name: Validate firebase Kotlin workflow
on:
  push:
    branches:
      - ci/check-firebase-kotlin-38275460775
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/firebase_tester_builder
          ref: main
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Validate Kotlin Play Store workflow
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color -shellcheck= .github/workflows/play_kotlin_auto.yml
