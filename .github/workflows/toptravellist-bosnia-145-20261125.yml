name: TopTravelList Bosnia and Herzegovina validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toptravellist-bosnia-145-20261125.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: data/bosnia-herzegovina-worldwide-v2-2026
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          fetch-depth: 0
          path: repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and generate rankings
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python scripts/validate.py
          python scripts/check_city_benchmarks.py
          python scripts/check_sight_benchmarks.py
          python scripts/check_new_country_reviews.py --country BA
          python scripts/generate_rankings.py --country BA
          python scripts/generate_rankings.py --check
          python scripts/rank.py --kind cities --country BA --limit 20
          python scripts/rank.py --kind sights --country BA --limit 20
      - name: Assert record coverage and threshold challenges
        working-directory: repo
        run: |
          python - <<'PY'
          from pathlib import Path
          from decimal import Decimal
          import re,yaml,subprocess
          r=Path('countries/BA')
          d=Path('methodology/reviews/BA')
          txt='\n'.join((d/p).read_text() for p in ['cities.md','sights.md'])
          ids=re.findall(r'^## ((?:city|sight)-ba-[a-z0-9-]+) — ',txt,re.M)
          assert len(ids)==len(set(ids))==145
          assert txt.count('**source-linked-unverified**')==46
          assert txt.count('**editorial-only**')==99
          dims=['impact','uniqueness','significance','experience','depth']
          weights=[30,25,20,15,10]
          high=0
          for kind,n in [('cities',44),('sights',101)]:
              files=list((r/kind).glob('*.yaml'))
              assert len(files)==n
              md=(r/f'{kind}.md').read_text()
              assert md.count('https://www.google.com/maps/search/?api=1&query=')==n
              for f in files:
                  a=yaml.safe_load(f.read_text())
                  assert a['id'] in ids
                  assert a['location']['country_code']=='BA'
                  vals=[*(a['scores'][x] for x in dims),*a['scores']['categories'].values()]
                  assert all(0<=v<10 for v in vals)
                  assert f']({kind}/{f.name})' in md
                  total=sum(Decimal(str(a['scores'][x]))*w for x,w in zip(dims,weights))/10
                  if total>=90 or any(v>=9.5 for v in vals):
                      high+=1
                      section=txt.split('## '+a['id']+' — ',1)[1].split('\n## ',1)[0]
                      assert 'High-score challenge: Not applicable' not in section,a['id']
          assert high==3,high
          print('PASS: 145 individual reviews; 3 exceptional-score records; 46 source-linked; 99 editorial-only.')
          PY
      - name: Commit generated rankings
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name toptravellist-editorial-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md countries/BA/cities.md countries/BA/sights.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Bosnia and Herzegovina ranking pages'
            git push origin HEAD:refs/heads/data/bosnia-herzegovina-worldwide-v2-2026
          fi
