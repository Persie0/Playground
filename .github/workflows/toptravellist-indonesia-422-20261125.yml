name: TopTravelList Indonesia 422 reviews and rankings
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toptravellist-indonesia-422-20261125.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toptravellist-indonesia-422-20261125
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Indonesia branch through public Playground
        uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: data/indonesia-worldwide-v2-2026
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        working-directory: repo
        run: python -m pip install -r requirements.txt
      - name: Validate schemas benchmarks and review coverage
        working-directory: repo
        run: |
          set -euo pipefail
          python scripts/validate.py
          python scripts/check_city_benchmarks.py
          python scripts/check_sight_benchmarks.py
          python scripts/check_new_country_reviews.py --country ID
      - name: Generate Indonesia rankings and verify global consistency
        working-directory: repo
        run: |
          set -euo pipefail
          python scripts/generate_rankings.py --country ID
          python scripts/generate_rankings.py --check
          python scripts/rank.py --kind cities --limit 60
          python scripts/rank.py --kind sights --limit 60
      - name: Assert exact counts and data scope
        working-directory: repo
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          import yaml
          root=Path.cwd()
          for kind,count,prefix in [('cities',79,'city'),('sights',343,'sight')]:
              files=list((root/'countries/ID'/kind).glob('*.yaml'))
              assert len(files)==count,(kind,len(files))
              md=(root/'countries/ID'/f'{kind}.md').read_text()
              assert md.count('https://www.google.com/maps/search/?api=1&query=')==count
              for f in files:
                  r=yaml.safe_load(f.read_text())
                  assert r['id']==f'{prefix}-id-{f.stem}'
                  assert all(0<=r['scores'][k]<10 for k in ['impact','uniqueness','significance','experience','depth'])
                  assert f']({kind}/{f.name})' in md
          review=root/'methodology/reviews/ID'
          notes=[review/'cities.md',*review.glob('sights-*.md')]
          txt='\n'.join(p.read_text() for p in notes)
          assert len(re.findall(r'^## (?:city|sight)-id-',txt,re.M))==422
          assert txt.count('**source-linked-unverified**')==63
          assert txt.count('**editorial-only**')==359
          assert '| [Indonesia](countries/ID/) (`ID`) | 79 | 343 |' in (root/'README.md').read_text()
          assert len(list((root/'countries').glob('*/cities/*.yaml')))==966
          assert len(list((root/'countries').glob('*/sights/*.yaml')))==2936
          print('PASS: 79 cities, 343 sights, 422 named reviews, 63 initially source-linked and 359 editorial-only.')
          PY
      - name: Commit only generated Indonesia rankings and index
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name toptravellist-editorial-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md countries/ID/cities.md countries/ID/sights.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Indonesia ranking pages and update country directory'
            git push origin HEAD:refs/heads/data/indonesia-worldwide-v2-2026
          fi
