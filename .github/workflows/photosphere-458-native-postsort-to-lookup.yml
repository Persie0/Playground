name: Photosphere 458 source-original Ceres post-sort to first parameter lookup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-458-native-postsort-to-lookup.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-458-native-postsort-to-lookup
  cancel-in-progress: false
jobs:
  original-postsort-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout private source SHA read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: e4f8e8d5bed62f6e4b7b3d217ca453749b25746b
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify research SHA and Python syntax
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e4f8e8d5bed62f6e4b7b3d217ca453749b25746b
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py research/photosphere/checkpoint442/live_six_pair_native_camera_getters.py research/photosphere/checkpoint454/live_original_problem_constructor.py research/photosphere/checkpoint455/live_first_native_registration_entry.py research/photosphere/checkpoint456/live_first_scratch_copy.py research/photosphere/checkpoint457/live_first_native_four_pointer_sort.py research/photosphere/checkpoint457/scan_native_four_pointer_sort.py research/photosphere/checkpoint458/scan_original_ceres_postsort.py research/photosphere/checkpoint458/live_original_postsort_to_lookup.py
      - name: Verify source-original GCam 8.8.225 APK and ARM64 ELF
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Source-run original Ceres post-sort duplicate checks to first parameter owner BL
        working-directory: research-src
        env:
          PHOTOSPHERE_THIRD_SHIFT407: '2'
          PHOTOSPHERE_FOURTH_CERES458: '1'
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py > checkpoint458-native.log 2> checkpoint458-diagnostic.log || {
            echo CHECKPOINT458_NATIVE_FAILURE
            tail -n 90 checkpoint458-diagnostic.log
            tail -n 8 checkpoint458-native.log | cut -c1-240
            exit 1
          }
          python3 - <<'PY'
          import json
          line=next(x for x in open("checkpoint458-native.log")
                    if x.startswith("CHECKPOINT395_NATIVE_POINT_SETUP_THIRD_ROBUST_ENTRY_REPORT="))
          d=json.loads(line.split("=",1)[1])
          h=d["checkpoint458_fourth_original_postsort_to_parameter_lookup"]
          s=d["checkpoint457_fourth_original_four_pointer_sort"]
          c=d["checkpoint456_fourth_original_first_scratch_copy"]
          p=d["checkpoint455_fourth_native_first_registration_entry"]
          getters=d["checkpoint442_fourth_original_native_getters"]
          if not h:
              print("CHECKPOINT458_MISSING_RECEIPT_DEBUG="+json.dumps({
                  "callback_error":getters.get("source_original_callback_execution_error"),
                  "requested":getters.get("source_original_postsort_458_requested"),
                  "completed":getters.get("source_original_postsort_458_completed"),
                  "sort_457_completed":getters.get("source_original_four_pointer_sort_457_completed"),
                  "scratch_456_completed":getters.get("source_original_first_scratch_456_completed"),
                  "registration_455_completed":getters.get("source_original_first_registration_455_completed"),
                  "first_source_rows":getters.get("source_original_callback_rows",[])[:1],
                  "output_available":d.get("checkpoint458_fourth_original_postsort_to_parameter_lookup"),
              },default=str,sort_keys=True))
              raise AssertionError("source native 458 receipt missing; see debug above")
          assert h["checkpoint"]==458
          assert h["original_source_3_adjacent_sorted_unique_pointer_checks"]==3
          assert h["original_source_native_duplicate_rejection_not_taken"]
          assert h["original_source_postsort_free_BL_executed"]
          assert h["original_source_free_import_host_substituted"]
          assert h["original_source_second_32byte_allocation_BL_executed"]
          assert h["original_source_second_allocation_host_mapped"]
          assert h["original_source_32byte_zero_memset_BL_executed"]
          assert h["original_source_memset_import_host_substituted"]
          assert h["original_source_parameter_result_pointer_buffer_32byte_zero_verified"]
          assert h["original_source_first_parameter_lookup_callsite_reached"]=="0x134854"
          assert h["original_source_first_parameter_lookup_unexecuted"]
          assert h["original_source_four_parameter_block_sizes"]==[4,4,2,1]
          assert h["original_source_first_parameter_data_pointer_unchanged"]
          assert h["original_source_pimpl_at_first_lookup_verified"]
          assert h["original_source_problem_owner_heap_unchanged"]
          assert h["original_source_four_camera_parameter_input_bytes_unchanged"]
          assert h["original_source_first_point_observation_unchanged"]
          assert h["original_source_residual_registration_unexecuted"]
          assert h["original_source_ceres_solver_unexecuted"]
          assert s["source_original_four_pointer_sorted_ascending_verified"]
          assert s["source_original_four_pointer_dispatch_target"]=="0x3cf0e0"
          assert s["source_original_first_parameter_lookup_executed"] is False
          assert c["source_original_parameter_pointer_copy_verified"]
          assert c["source_original_memmove_import_host_substituted"]
          assert p["original_source_0x128e04_call_executed"]
          assert getters["source_original_postsort_458_completed"]
          assert getters["source_original_four_pointer_sort_457_completed"]
          assert getters["source_original_first_scratch_456_completed"]
          assert getters["source_original_first_registration_455_completed"]
          assert getters["source_original_problem_ctor_454_completed"]
          assert getters["source_original_point_row_451_completed"]
          assert getters["source_original_pair_buffer_unchanged"]
          assert getters["source_original_source_camera_unchanged"]
          assert getters["source_original_provider_owned_children_unchanged"]
          assert getters["source_original_nested_vector_payloads_unchanged_443"]
          v=getters["source_original_matcher_owned_nested_vectors_443"]
          assert [x["point28"]["count"] for x in v]==[25,15,16,11,0,19]
          assert sum(x["point28"]["count"] for x in v)==86
          print("CHECKPOINT458_SOURCE_POSTSORT_FIRST_PARAMETER_HANDOFF_VERIFIED")
          print("CHECKPOINT458_SOURCE_ONLY_RECEIPT="+json.dumps(h,sort_keys=True))
          PY
      - name: Delete original APK and native ELF on success or failure
        if: always()
        working-directory: research-src
        run: |
          rm -f original.apk research/native/liblightcycle.so
      - name: Upload source-only diagnostic (no original binary)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-458-first-parameter-handoff-source-only
          path: research-src/checkpoint458-diagnostic.log
          if-no-files-found: error
          retention-days: 7
