name: ImagePdfScaler zero padding text fit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imagepdfscaler-zero-padding-text-fit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Verify private checkout token
        env:
          APP_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$APP_TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: Persie0/ImagePdfScaler
          ref: fix/zero-padding-text-box-fit-20261015
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Flutter analysis
        working-directory: app
        run: flutter analyze --no-pub
      - name: Focused text layout, dialog and PDF tests
        working-directory: app
        run: flutter test --no-pub --reporter expanded test/text_box_layout_test.dart test/text_editor_units_test.dart test/paper_canvas_interaction_test.dart test/visible_text_pdf_test.dart
      - name: Full Flutter suite
        working-directory: app
        run: flutter test --no-pub
      - name: Install required Android NDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "ndk;29.0.13599879"
      - name: Build Android debug APK
        working-directory: app
        run: flutter build apk --debug --no-pub
