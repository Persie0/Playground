name: ToiletCompass PR8 branch validation

on:
  push:
    branches: [toiletcompass-pr8-validation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ToiletCompass PR branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/toiletcompass
          ref: feat/monthly-country-database-pipeline
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false
          path: app
      - name: Run Python database tests
        working-directory: app
        run: python3 -m unittest discover -s database/tests -v
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run database manifest tests
        working-directory: app
        run: flutter test test/database_manifest_test.dart
      - name: Run full Flutter tests
        working-directory: app
        run: flutter test
