name: Photosphere capture focused CI

on:
  push:
    branches:
      - photosphere-capture-ci

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout private app revision
        uses: actions/checkout@v5
        with:
          repository: Persie0/Photosphere-
          ref: fix/capture-guidance-3d
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build minimal regression package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p focused/lib/src/models focused/lib/src/services focused/test
          cp app/lib/src/models/capture_geometry.dart focused/lib/src/models/
          cp app/lib/src/models/capture_plan.dart focused/lib/src/models/
          cp app/lib/src/models/vec3.dart focused/lib/src/models/
          cp app/lib/src/services/motion_pose_tracker.dart focused/lib/src/services/
          cp app/lib/src/services/native_orientation.dart focused/lib/src/services/
          cp app/test/capture_geometry_test.dart focused/test/
          cp app/test/native_orientation_test.dart focused/test/
          cat > focused/pubspec.yaml <<'EOF'
          name: photosphere
          publish_to: none
          environment:
            sdk: '>=3.10.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            sensors_plus: 7.1.0
          dev_dependencies:
            flutter_test:
              sdk: flutter
          EOF
      - name: Run focused capture regression tests
        run: cd focused && flutter pub get && flutter test test/capture_geometry_test.dart test/native_orientation_test.dart --reporter expanded
