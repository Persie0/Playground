name: Photosphere capture focused CI

on:
  push:
    branches:
      - photosphere-capture-ci

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout private app revision
        uses: actions/checkout@v5
        with:
          repository: Persie0/Photosphere-
          ref: fix/capture-guidance-3d
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: cd app && flutter pub get
      - name: Run capture regression tests
        run: cd app && flutter test test/capture_geometry_test.dart test/native_orientation_test.dart --reporter expanded
