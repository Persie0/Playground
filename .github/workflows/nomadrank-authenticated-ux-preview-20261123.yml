name: NomadRank authenticated shell UX screenshots (public Playground)
# Tenth review: verify fresh empty Map, contributor dialog and large-font composition.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nomadrank-authenticated-ux-preview-20261123.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Confirm private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout private feature branch in public Playground
        uses: actions/checkout@v4
        with:
          repository: Persie0/skratch_clone
          ref: ux/impeccable-nomadrank-20261122
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore Flutter dependencies
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build a temporary no-credentials app-shell preview entrypoint
        shell: bash
        run: |
          cat > lib/ux_preview_main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:intl/date_symbol_data_local.dart';
          import 'package:nomadrank/nomadrank_app_impl.dart';
          import 'package:nomadrank/services/prefs_service.dart';

          Future<void> main() async {
            WidgetsFlutterBinding.ensureInitialized();
            await PrefsService.init();
            await PrefsService.prefs.setBool('hasCompletedOnboarding', true);
            await PrefsService.prefs.setBool('guestSessionV1', true);
            await PrefsService.prefs.setString('displayName', 'UX Preview');
            await PrefsService.prefs.setString('username', 'UX Preview');
            await PrefsService.prefs.setString('homeCountry', 'Austria');
            await initializeDateFormatting(null, null);
            runApp(const NomadRankApp(firebaseAvailable: false));
          }
          DART
          cat > nomadrank-preview-capture.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          flutter build apk --debug --no-pub -t lib/ux_preview_main.dart
          adb install -r build/app/outputs/flutter-apk/app-debug.apk
          adb shell wm size 1080x2400
          adb shell wm density 440
          adb shell am start -n at.persie0.nomadrank/.MainActivity
          sleep 18
          mkdir -p native-ux-preview
          adb exec-out screencap -p > native-ux-preview/01-hq-phone.png
          # Four Material NavigationBar destinations, evenly spaced.
          adb shell input tap 405 2220
          sleep 12
          adb exec-out screencap -p > native-ux-preview/02-map-phone.png
          # The contributors button is positioned at the upper right of the
          # expanded Map on the standard 1080x2400 / 440dpi preview.
          adb shell input tap 940 395
          sleep 3
          adb exec-out screencap -p > native-ux-preview/02b-map-contributors.png
          adb shell input keyevent 4
          sleep 2
          adb shell settings put system font_scale 1.6
          sleep 5
          adb exec-out screencap -p > native-ux-preview/02c-map-large-type.png
          adb shell settings put system font_scale 1.0
          sleep 2
          adb shell input tap 675 2220
          sleep 10
          adb exec-out screencap -p > native-ux-preview/03-intel-phone.png
          adb shell input tap 945 2220
          sleep 10
          adb exec-out screencap -p > native-ux-preview/04-circles-phone.png
          adb shell settings put system font_scale 1.45
          sleep 5
          adb exec-out screencap -p > native-ux-preview/05-circles-large-type.png
          adb shell settings put system font_scale 1.0
          adb shell wm size 1920x1200
          adb shell wm density 200
          sleep 10
          adb exec-out screencap -p > native-ux-preview/06-wide-circles-rail.png
          SCRIPT
          chmod +x nomadrank-preview-capture.sh

      - name: Build, launch and capture authenticated app shell
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_atd
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash nomadrank-preview-capture.sh

      - name: Upload original Android screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nomadrank-ux-preview-android
          path: native-ux-preview/*.png
          if-no-files-found: ignore

      - name: Capture manifest
        if: success()
        run: ls -lh native-ux-preview/*.png
