name: ImagePdfScaler desktop checks and unsigned builds (manual)

# Only manual dispatch: avoids accidental fan-out or private-repository CI.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imagepdfscaler-desktop-manual.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag/SHA in private ImagePdfScaler
        required: true
        type: string
        default: chore/desktop-store-readiness
      target:
        description: Validate Dart, build macOS, or build Windows
        type: choice
        required: true
        default: verify
        options:
          - verify
          - macos
          - windows
      upload_public_artifact:
        description: Upload the unsigned app to a PUBLIC workflow artifact
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: imagepdfscaler-desktop-${{ github.ref }}-${{ inputs.target || 'smoke' }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ inputs.target == 'verify' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check private checkout token exists
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Fetch exact private app revision
        uses: actions/checkout@v4
        with:
          repository: Persie0/ImagePdfScaler
          ref: ${{ inputs.ref || 'feature/macos-app-store-release' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: imagepdfscaler
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        working-directory: imagepdfscaler
        run: flutter pub get
      - name: Verify macOS Store configuration
        working-directory: imagepdfscaler
        run: python3 tool/verify_macos_store.py
      - name: Analyze source
        working-directory: imagepdfscaler
        run: flutter analyze --no-pub
      - name: Run all tests
        working-directory: imagepdfscaler
        run: flutter test --no-pub

  macos:
    if: ${{ inputs.target == 'macos' || github.event_name == 'push' }}
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - name: Check private checkout token exists
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Fetch exact private app revision
        uses: actions/checkout@v4
        with:
          repository: Persie0/ImagePdfScaler
          ref: ${{ inputs.ref || 'feature/macos-app-store-release' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: imagepdfscaler
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare sandboxed macOS runner and build
        working-directory: imagepdfscaler
        run: bash tool/prepare_macos.sh --build
      - name: Verify bundled icon sizes, sandbox and privacy manifest
        working-directory: imagepdfscaler
        run: python3 tool/verify_macos_store.py --release
      - name: Zip unsigned macOS app for opt-in diagnostic artifact
        if: ${{ inputs.upload_public_artifact }}
        working-directory: imagepdfscaler
        run: |
          APP="$(find build/macos/Build/Products/Release -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$RUNNER_TEMP/imagepdfscaler-macos-unsigned.zip"
      - name: Upload macOS binary publicly (only when explicitly selected)
        if: ${{ inputs.upload_public_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: imagepdfscaler-macos-unsigned
          path: ${{ runner.temp }}/imagepdfscaler-macos-unsigned.zip
          if-no-files-found: error
          retention-days: 2

  windows:
    if: ${{ inputs.target == 'windows' }}
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - name: Check private checkout token exists
        shell: pwsh
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: if (-not $env:PRIVATE_TOKEN) { throw 'Missing private checkout token' }
      - name: Fetch exact private app revision
        uses: actions/checkout@v4
        with:
          repository: Persie0/ImagePdfScaler
          ref: ${{ inputs.ref || 'feature/macos-app-store-release' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: imagepdfscaler
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Windows runner and build
        working-directory: imagepdfscaler
        shell: pwsh
        run: ./tool/prepare_windows.ps1 -Build
      - name: Upload unsigned Windows binary publicly (only when selected)
        if: ${{ inputs.upload_public_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: imagepdfscaler-windows-unsigned
          path: imagepdfscaler/build/windows/x64/runner/Release/**
          if-no-files-found: error
          retention-days: 2
