name: Photo Sphere checkpoint253 Rust original native self-match parity (one shot)
on:
  push:
    branches: [ci/photosphere-checkpoint253-native-self-match]
    paths: ['.github/workflows/photosphere-checkpoint253-native-self-match.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint253-rust-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rust-native-self-match:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'ci: run photosphere checkpoint253 rust once'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 1d67cc39799817eb9defc867d89c76e615847642
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Verify exact app revision
        run: test "$(git rev-parse HEAD)" = "1d67cc39799817eb9defc867d89c76e615847642"
      - name: Replay 56 original native identical-feature match records
        run: cargo test --locked checkpoint253_original_arm64_identical_native_features_match_exactly -- --nocapture
      - name: Run complete Rust regression suite
        run: cargo test --locked
