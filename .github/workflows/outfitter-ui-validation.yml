name: Outfitter UI validation

# Validation pass after awaiting bundled fonts (97b9b2a71161).
# Outfitter PR #10: timezone, accessibility, secure key, look composition.
# Runs on PUBLIC Playground Actions minutes. The private source is never
# copied into this repository or uploaded as an artifact.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/outfitter-ui-validation.yml
  workflow_dispatch:
    inputs:
      source_ref:
        description: Outfitter branch to validate
        required: false
        type: string
        default: feat/destination-time-accessibility-weather-look

permissions:
  contents: write

concurrency:
  group: outfitter-ui-validation
  cancel-in-progress: true

jobs:
  flutter-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout Outfitter source
        uses: actions/checkout@v5
        with:
          repository: Persie0/outfitter
          ref: ${{ inputs.source_ref || 'feat/destination-time-accessibility-weather-look' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: true
          path: source

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch dependencies
        working-directory: source
        run: flutter pub get

      - name: Format updated Dart files
        working-directory: source
        run: |
          dart format lib/services/destination_time_service.dart \
            lib/widgets/outfit_composition.dart \
            lib/services/api_key_service.dart \
            lib/screens/settings_screen.dart \
            lib/services/outfit_history_service.dart \
            test/destination_time_service_test.dart \
            lib/models/trip_plan.dart \
            lib/models/saved_outfit.dart \
            lib/services/weather_service.dart \
            lib/services/saved_outfit_service.dart \
            lib/services/outfit_history_service.dart \
            lib/widgets/garment_illustration.dart \
            lib/screens/home_shell.dart \
            lib/screens/plan_screen.dart \
            lib/screens/recommendation_screen.dart \
            lib/screens/saved_library_screen.dart \
            lib/screens/example_outfit_screen.dart \
            lib/screens/api_key_setup_screen.dart \
            test/weather_service_test.dart \
            test/saved_outfit_test.dart \
            test/plan_screen_test.dart

      - name: Run Flutter tests
        working-directory: source
        run: flutter test

      - name: Analyze application
        working-directory: source
        # Flutter 3.50 marks legacy material.dart imports as deprecated infos.
        # Keep diagnostics visible, but fail the job only for warnings/errors.
        run: flutter analyze --no-fatal-infos

      - name: Push validated formatting to feature branch
        working-directory: source
        env:
          SOURCE_REF: ${{ inputs.source_ref || 'feat/destination-time-accessibility-weather-look' }}
        run: |
          git add pubspec.yaml pubspec.lock \
            lib/services/destination_time_service.dart \
            lib/widgets/outfit_composition.dart lib/services/api_key_service.dart \
            lib/screens/settings_screen.dart test/destination_time_service_test.dart \
            lib/models/trip_plan.dart lib/models/saved_outfit.dart \
            lib/services/weather_service.dart lib/services/saved_outfit_service.dart \
            lib/services/outfit_history_service.dart \
            lib/widgets/garment_illustration.dart lib/screens/home_shell.dart \
            lib/screens/plan_screen.dart lib/screens/recommendation_screen.dart \
            lib/screens/saved_library_screen.dart lib/screens/example_outfit_screen.dart \
            lib/screens/api_key_setup_screen.dart test/weather_service_test.dart \
            test/saved_outfit_test.dart test/plan_screen_test.dart
          if ! git diff --cached --quiet; then
            git config user.name "playground-ci"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format Outfitter UI redesign"
            git push origin "HEAD:$SOURCE_REF"
          fi

      - name: Publish validation result for review
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATION_STATUS: ${{ job.status }}
          SOURCE_REF: ${{ inputs.source_ref || 'feat/destination-time-accessibility-weather-look' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          SOURCE_SHA="$(git -C source rev-parse HEAD 2>/dev/null || true)"
          export SOURCE_SHA
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          
          path = "ci-results/outfitter-ui-validation.json"
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/contents/{path}"
          headers = {
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          content = {
              "status": os.environ["VALIDATION_STATUS"],
              "source_ref": os.environ["SOURCE_REF"],
              "source_sha": os.environ.get("SOURCE_SHA", ""),
              "run_url": os.environ["RUN_URL"],
          }
          existing_sha = None
          try:
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as response:
                  existing_sha = json.load(response)["sha"]
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          payload = {
              "message": "ci: record Outfitter UI validation result",
              "branch": "main",
              "content": base64.b64encode(
                  (json.dumps(content, indent=2) + "\n").encode()
              ).decode(),
          }
          if existing_sha:
              payload["sha"] = existing_sha
          req = urllib.request.Request(
              url, data=json.dumps(payload).encode(),
              headers={**headers, "Content-Type": "application/json"},
              method="PUT",
          )
          with urllib.request.urlopen(req) as response:
              print(f"Published result ({content['status']}) for {content['source_sha']}")
          PY
