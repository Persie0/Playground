name: Photosphere checkpoint313 AOSP Bionic fmodf reference
on:
  push:
    branches: [research/photosphere-checkpoint313-bionic-fmodf]
    paths: [.github/workflows/photosphere-checkpoint313-bionic-fmodf.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install reference source and ARM64 execution dependencies
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools unicorn
      - name: Download immutable AOSP Android 13/14 fmodf C source
        run: |
          set -euo pipefail
          mkdir -p aosp-source
          curl --fail --location --retry 3 --silent --show-error \
            'https://raw.githubusercontent.com/aosp-mirror/platform_bionic/0b981d1ec055efaef86d8a5d402cf1b3167ba10b/libm/upstream-freebsd/lib/msun/src/e_fmodf.c' \
            -o aosp-source/e_fmodf.c
          test "$(git hash-object aosp-source/e_fmodf.c)" = 1b6bf36f9cba5eeb45bb61943c288310b21248e8
      - name: Fetch original GCam ARM64 ELF with pinned SHA256
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk'
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Checkout pinned AOSP C oracle builder
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 98284179cefdc2366ee147e93149fe25c77495b2
          path: research
          sparse-checkout: |
            research/photosphere/checkpoint313
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Compile pinned original AOSP shift-subtract fmodf and build float32 oracle
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 98284179cefdc2366ee147e93149fe25c77495b2
          python3 research/research/photosphere/checkpoint313/build_aosp_fmodf_oracle.py \
            --aosp-source aosp-source/e_fmodf.c \
            --build-dir compiled-fmodf \
            --oracle checkpoint313-bionic-fmodf-reference.tsv \
            --metadata checkpoint313-bionic-fmodf-reference.json | tee checkpoint313-aosp-source.log
          grep -q '^CHECKPOINT313_AOSP_FMODF_ORIGINAL_C_COMPILED 1b6bf36f9cba5eeb45bb61943c288310b21248e8' checkpoint313-aosp-source.log
          grep -q '^CHECKPOINT313_AOSP_FMODF_ORACLE_BUILT' checkpoint313-aosp-source.log
      - name: Run full original ARM64 12-case multi-bin with compiled AOSP C fmodf answers
        run: |
          set -euo pipefail
          python3 research/research/photosphere/checkpoint313/native_original_multibin_aosp_fmodf.py original.so \
            --compiled-aosp-libm compiled-fmodf/libaosp_original_fmodf_reference.so \
            --output checkpoint313-original-multibin-aosp.json | tee checkpoint313-original-multibin-aosp.log
          grep -q '^CHECKPOINT313_ORIGINAL_AOSP_FMODF_MULTIBIN_PASS 12 52' checkpoint313-original-multibin-aosp.log
          grep -q '^CHECKPOINT313_ORIGINAL_AOSP_FMODF_COMPACT_PASS 12 52' checkpoint313-original-multibin-aosp.log
      - name: Checkout pinned PhotosphereCleanroom Bionic source port and full-loop collector
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 89e60d753f8a4ffcea86d3dd3f668f7c9f6c6056
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Bitwise 41K original AOSP C outputs vs Rust and 12 native original multi-bin scenes
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = 89e60d753f8a4ffcea86d3dd3f668f7c9f6c6056
          export GCAM_AOSP_FMODF_ORACLE="$GITHUB_WORKSPACE/checkpoint313-bionic-fmodf-reference.tsv"
          export GCAM313_AOSP_MULTIBIN_ORACLE="$GITHUB_WORKSPACE/checkpoint313-original-multibin-aosp-compact.json"
          cd app
          git diff --check
          rustfmt --edition 2021 --check src/native_bionic_fmodf.rs src/native_line_multibin.rs
          cargo test --lib checkpoint313_ -- --nocapture
          cargo test --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint313-aosp-reference-oracle
          path: |
            checkpoint313-aosp-source.log
            checkpoint313-bionic-fmodf-reference.json
            checkpoint313-bionic-fmodf-reference.tsv
            checkpoint313-original-multibin-aosp.log
            checkpoint313-original-multibin-aosp.json
            checkpoint313-original-multibin-aosp-compact.json
          retention-days: 14
