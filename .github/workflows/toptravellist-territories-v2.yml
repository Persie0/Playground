name: TopTravelList Geographic territories validation
on:
  push:
    branches: ['ci/toptravellist-territories-v2']
    paths: ['.github/workflows/toptravellist-territories-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: feature/worldwide-territories-greenland
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and generate
        run: |
          set -euo pipefail
          git config user.name toptravellist-editorial-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            test "$(git diff --name-only --diff-filter=U)" = "README.md"
            git checkout --ours README.md
            git add README.md
            git commit --no-edit
          fi
          python -m pip install -r requirements.txt
          python scripts/validate.py
          python scripts/check_city_benchmarks.py
          python scripts/check_sight_benchmarks.py
          python scripts/check_new_country_reviews.py --country GL
          python scripts/check_new_country_reviews.py --country FO
          python scripts/check_new_country_reviews.py --country PF
          python scripts/check_new_country_reviews.py --country FR
          python scripts/check_new_country_reviews.py --country PR
          python scripts/check_new_country_reviews.py --country US
          python scripts/check_new_country_reviews.py --country AQ
          python scripts/generate_rankings.py
          python scripts/generate_rankings.py --check
          python scripts/rank.py --kind cities --limit 60 >/tmp/world-cities.txt
          python scripts/rank.py --kind sights --limit 60 >/tmp/world-sights.txt
          python - <<'PY'
          from pathlib import Path
          from decimal import Decimal
          import yaml
          for kind,count in [('cities',7),('sights',12)]:
              files=list(Path('countries/GL',kind).glob('*.yaml'))
              assert len(files)==count
              txt=Path('methodology/reviews/GL',kind+'.md').read_text()
              for f in files:
                  d=yaml.safe_load(f.read_text())
                  section=txt.split('## '+d['id']+' — ',1)[1].split('\n## ',1)[0]
                  vals=[d['scores'][k] for k in ('impact','uniqueness','significance','experience','depth')]
                  if None not in vals:
                      total=sum(Decimal(str(v))*w for v,w in zip(vals,[30,25,20,15,10]))/10
                      assert f'Overall: {total:.2f}/100.' in section, d['id']
                  else:
                      assert 'Overall: unranked.' in section
              assert Path('countries/GL',kind+'.md').read_text().count('https://www.google.com/maps/search/?api=1&query=')==2*count
          print('PASS: GL counts, totals and map links')
          PY
          python - <<'PY'
          import json, sys
          sys.path.insert(0, 'scripts')
          from registry import registry_errors, complete
          from pathlib import Path
          r=json.loads(Path('countries/_registry.json').read_text())
          assert len(r['codes'])==250 and not registry_errors(r)
          assert complete(r, 'AQ', 0, 1) and not complete(r, 'AQ', 0, 0)
          assert not complete(r, 'GL', 0, 1) and complete(r, 'GL', 1, 1)
          assert len(list(Path('countries').glob('*/cities.md')))==250
          assert len(list(Path('countries').glob('*/sights.md')))==250
          print('PASS: 250 registry entries, all pages, sight-only coverage')
          PY
          test ! -f countries/FR/sights/taputapuatea.yaml
          test ! -f countries/FR/sights/marquesas.yaml
          test -f countries/PF/sights/taputapuatea.yaml
          test -f countries/PF/sights/marquesas.yaml
          test ! -f countries/US/sights/san-juan-national-historic-site.yaml
          test -f countries/PR/sights/san-juan-national-historic-site.yaml
          test "$(find countries/AQ -path '*/cities/*.yaml' | wc -l)" -eq 0
          cd web
          if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi
          npm test
          npm run build
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const a=JSON.parse(fs.readFileSync('public/atlas.json','utf8'));
          assert.equal(Object.keys(a.countries).length,250);
          assert.equal(a.countries.GL.catalogued,true);
          assert.equal(a.countries.FO.catalogued,true);
          assert.equal(a.countries.PF.catalogued,true);
          assert.equal(a.countries.PR.catalogued,true);
          assert.equal(a.rows.filter(r=>r.country==='PR').length,16);
          assert.equal(a.rows.filter(r=>r.country==='PF').length,16);
          assert.equal(a.rows.filter(r=>r.country==='FO').length,11);
          assert.equal(a.countries.AQ.settlementsRequired,false);
          assert.equal(a.countries.AQ.catalogued,true);
          assert.equal(a.rows.filter(r=>r.country==='AQ').length,14);
          assert.equal(a.rows.filter(r=>r.country==='GL').length,19);
          console.log('PASS: exported atlas registry and Greenland rows');
          JS
          cd ..
          git add README.md countries
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Geographic territories ranking pages and country directory'
          fi
          git push origin HEAD:refs/heads/feature/worldwide-territories-greenland
