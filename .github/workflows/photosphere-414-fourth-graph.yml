name: Photosphere 414 fourth original native point rows and reciprocal graph source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-414-fourth-graph.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-414-fourth-graph
  cancel-in-progress: false
jobs:
  native-fourth-original-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Read-only pinned decompile original native research checkout
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: ef715fcd5fb32193f116b9aa96df010c0c18ac06
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify research SHA and compile source probe
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'ef715fcd5fb32193f116b9aa96df010c0c18ac06'
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py
      - name: Verify original pinned APK and ELF hashes
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Execute original fourth-point writer and both native graph link calls
        working-directory: research-src
        env:
          PHOTOSPHERE_THIRD_SHIFT407: '2'
          PHOTOSPHERE_FOURTH_GRAPH414: '1'
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py > checkpoint414-source-full.log 2> checkpoint414-diagnostic.log || {
            echo 'CHECKPOINT414_ORIGINAL_FOURTH_GRAPH_NOT_VERIFIED'
            tail -n 100 checkpoint414-diagnostic.log
            tail -n 5 checkpoint414-source-full.log | cut -c1-220
            exit 1
          }
          grep '^CHECKPOINT414_SOURCE_FOURTH_GRAPH=' checkpoint414-source-full.log | cut -c1-2500
          python3 - <<'PY'
          import json
          row=next(line for line in open("checkpoint414-source-full.log")
              if line.startswith("CHECKPOINT395_NATIVE_POINT_SETUP_THIRD_ROBUST_ENTRY_REPORT="))
          d=json.loads(row.split("=",1)[1])
          r=d["checkpoint409_fourth_source_descriptor"]
          assert d["original_elf_sha256"]=="878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1"
          assert r["original_distinct_pixel_offsets"]==[0,1,2,3]
          assert len(set(r["original_all_four_source_pixel_sha256"]))==4
          assert r["source_original_pre_fourth_feature_owner_count"]==3
          assert len(r["source_original_pre_fourth_native_owner_pointers"])==3
          assert r["source_original_pre_fourth_provider_counts"]==[3,3]
          assert r["source_original_fourth_image_buffer_is_new"]
          assert r["source_original_fourth_feature_wrapper_returned"]
          assert not r.get("source_original_fourth_execution_error")
          assert r["original_native_descriptor_calls"]
          assert r["original_native_fourth_matcher_threshold_events"]
          assert r["source_original_graph_pair_created_for_fourth"]
          assert not r["source_original_relative_pair_constructor_executed"]
          assert not r["source_original_full_solver_ceres_executed"]
          assert r["source_original_endpoint"]=="fourth_original_first_reciprocal_graph_boundary"
          assert r["source_original_stop_pc"]=="0x11dbb8"
          assert r["original_native_descriptor_calls"]
          assert r["original_native_descriptor_calls"][0]["native_original_source_match_count"]==11
          robust=r["original_native_fourth_robust"]
          assert robust["source_original_robust_entry_pc"]=="0x30f860"
          assert robust["native_original_robust_calls"]==1
          assert robust["native_original_trial_count"]==550
          assert robust["native_original_svd_call_count"]>=550
          assert robust["native_original_550_trials_verified"]
          assert robust["source_native_robust_return_pc"]=="0x120918"
          assert robust["source_native_robust_return_w0"] in (0,1)
          assert robust["test_controlled_sampler_pair_indices"]==[0,10]
          assert len(robust["test_controlled_imported_rand_values"])==1100
          assert robust["native_original_first_sample_indices"]==[0,10]
          assert robust["native_android_bionic_rand_reproduced"] is False
          assert robust["original_native_graph_adjacency_not_run"] is False
          for item in r["original_native_descriptor_calls"]:
              assert item["native_current_image_index_w21"]==3
              assert 0<=item["native_candidate_index_w25"]<3
              assert item["source_original_highlevel_entry_reached"]
              if item.get("native_original_source_match_count") is not None:
                  count=item["native_original_source_match_count"]
                  assert count>=0 and len(item["source_original_match_vector_20byte_hex"])==20*2*count
                  assert item["native_source_matches_not_test_injected"]
          for row in r["original_native_fourth_matcher_threshold_events"]:
              assert (row["original_source_native_match_count"]>=7)==row[
                  "source_qualified_for_native_robust_estimator"]
          assert r["source_fourth_original_graph_mutated_here"] is True
          assert r["source_original_graph_pair_created_for_fourth"] is True
          assert r["source_original_relative_pair_constructor_executed"] is False
          graph=d["checkpoint414_fourth_native_graph"]
          assert graph["source_original_robust_accepted_before_native_point_writer"]
          assert graph["source_original_point_rows_28_hex"]
          assert graph["original_native_fourth_highlevel_return_pc"]=="0x11db8c"
          assert graph["original_native_fourth_highlevel_return_w0"]==1
          assert graph["original_native_fourth_pair_indices_i32"]==[0,3]
          assert graph["source_original_first_directed_link_executed"]
          assert graph["source_original_second_directed_link_executed"]
          assert graph["source_original_reciprocal_graph_verified"]
          assert graph["original_native_fourth_graph_boundary_pc"]=="0x11dbb8"
          assert graph["original_native_fourth_addimage_success_w28"]==1
          count=len(graph["source_original_point_rows_28_hex"])
          assert count==graph["source_native_fourth_point_row_count"]
          assert count>0 and count<=11
          assert len(graph["source_native_fourth_point_vector_28_hex"])==count*28*2
          assert all(len(x)==56 for x in graph["source_original_point_rows_28_hex"])
          a0=graph["source_original_fourth_owner_a_before"]["source_native_element_count"]
          b0=graph["source_original_fourth_owner_b_before"]["source_native_element_count"]
          a2=graph["source_original_fourth_owner_a_after_both"]["source_native_element_count"]
          b2=graph["source_original_fourth_owner_b_after_both"]["source_native_element_count"]
          assert a2==a0+1 and b2==b0+1
          with open("checkpoint414-native-original.json","w") as f:
              json.dump(d,f,indent=2,sort_keys=True)
              f.write("\n")
          print("CHECKPOINT414_SOURCE_FOURTH_RECIPROCAL_GRAPH_PASS",json.dumps({
              "image_offsets":r["original_distinct_pixel_offsets"],
              "fourth_candidate":r["original_native_descriptor_calls"][0]["native_candidate_index_w25"],
              "descriptor_matches":r["original_native_descriptor_calls"][0]["native_original_source_match_count"],
              "original_native_trials":robust["native_original_trial_count"],
              "native_svd":robust["native_original_svd_call_count"],
              "native_robust_return_w0":robust["source_native_robust_return_w0"],
              "original_28byte_point_rows":count,
              "original_pair_indices":graph["original_native_fourth_pair_indices_i32"],
              "graph_owner_a_before_after":[a0,a2],
              "graph_owner_b_before_after":[b0,b2],
              "source_endpoint":r["source_original_endpoint"],
          },sort_keys=True))
          PY
      - name: Remove original proprietary APK and ELF before archive
        if: always()
        working-directory: research-src
        run: |
          rm -f original.apk research/native/liblightcycle.so com.google.android.GoogleCamera_*.apk
      - name: Archive source-only numeric evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-414-original-fourth-graph-source
          path: |
            research-src/checkpoint414-native-original.json
            research-src/checkpoint414-diagnostic.log
          retention-days: 7
          if-no-files-found: warn
