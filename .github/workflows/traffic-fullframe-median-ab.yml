name: Traffic production full-frame median A/B (ARM64)

on:
  push:
    paths:
      - ".github/workflows/traffic-fullframe-median-ab.yml"
      - "benchmarks/traffic_fullframe_masked_median.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - name: Checkout public Playground harness
        uses: actions/checkout@v4

      - name: Check private-source read token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          if [ -z "$PRIVATE_TOKEN" ]; then
            echo "::error::Missing private repository checkout secret."
            exit 1
          fi

      - name: Checkout original production implementation
        uses: actions/checkout@v4
        with:
          repository: Persie0/traffic-counting-light-main
          ref: e2ec5b544f084029d9fcfc473af2567c668a03ae
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          lfs: false
          path: original

      - name: Checkout optimized production implementation
        uses: actions/checkout@v4
        with:
          repository: Persie0/traffic-counting-light-main
          ref: 805ac7fa4d7970f37b56b8e37dab738c923ce795
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          lfs: false
          path: optimized

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Pi-compatible analysis dependencies
        run: python -m pip install 'numpy==2.5.1' 'opencv-python-headless==4.13.0.92'

      - name: Record runner hardware
        run: |
          mkdir -p results
          uname -m
          lscpu | grep -E 'Architecture|CPU\(s\)|Model name'
          python -c "import numpy, cv2; print('NumPy',numpy.__version__,'OpenCV',cv2.__version__)"

      - name: Full 1296x972, 60-sample, 32-row-tile A/B test
        run: |
          python benchmarks/traffic_fullframe_masked_median.py \
            --old original/traffic-counting-edge-detection-master \
            --new optimized/traffic-counting-edge-detection-master \
            --repetitions 3 \
            --output results/traffic-median-fullframe-ab.json
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('results/traffic-median-fullframe-ab.json').read_text())
          for entry in report['results']:
              assert entry['byte_identical']
              print(f"{entry['scenario']}: baseline {entry['old_median_ms']:.2f} ms, "
                    f"optimized {entry['new_median_ms']:.2f} ms, "
                    f"speedup {entry['speedup']:.2f}x, byte identical.")
          PY

      - name: Archive numeric results only (no proprietary inputs/source)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traffic-median-fullframe-arm64-results
          path: results/*.json
          if-no-files-found: warn
          retention-days: 7
