name: NomadRank Impeccable UX validation (public CI)
# Round eight: validate adaptive rating controls and keyboard-operable Pin Stay actions.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nomadrank-impeccable-ux-20261122.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Verify checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout private NomadRank feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/skratch_clone
          ref: ux/impeccable-nomadrank-20261122
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Generate localized import warnings
        run: flutter gen-l10n

      - name: Format changed UI and tests
        run: |
          dart format \
            lib/nomadrank_app_impl.dart \
            lib/theme/app_theme.dart \
            lib/widgets/bottom_nav.dart \
            lib/widgets/dashboard_globe_card.dart \
            lib/widgets/stat_card.dart \
            lib/screens/dashboard_screen.dart \
            lib/screens/bucket_list_screen.dart \
            lib/screens/settings_screen.dart \
            lib/screens/scratch_map_screen.dart \
            lib/screens/city_intel_compare_screen.dart \
            lib/screens/travel_circles_screen.dart \
            lib/screens/pin_stay_screen.dart \
            lib/screens/quick_add_wizard_screen.dart \
            lib/screens/onboarding_checklist_screen.dart \
            lib/screens/city_intel_screen.dart \
            lib/screens/city_stats_screen.dart \
            lib/screens/edit_dates_screen.dart \
            lib/screens/seasonal_screen.dart \
            lib/screens/recent_stays_screen.dart \
            lib/screens/login_screen.dart \
            lib/screens/friend_qr_scanner_screen.dart \
            lib/screens/email_verification_screen.dart \
            test/email_verification_accessibility_test.dart \
            test/login_accessibility_test.dart \
            test/friend_qr_scanner_accessibility_test.dart \
            lib/screens/data_portability_screen.dart \
            lib/screens/trip_timeline_screen.dart \
            lib/screens/personal_insights_screen.dart \
            test/full_account_import_confirmation_test.dart \
            test/edit_dates_accessibility_test.dart \
            test/bottom_nav_accessibility_test.dart \
            test/map_visit_sheet_accessibility_test.dart \
            lib/widgets/ten_point_rating_selector.dart \
            test/ten_point_rating_selector_test.dart

      - name: Analyze changed UI and tests
        run: |
          flutter analyze --no-pub \
            lib/nomadrank_app_impl.dart \
            lib/theme/app_theme.dart \
            lib/widgets/bottom_nav.dart \
            lib/widgets/dashboard_globe_card.dart \
            lib/widgets/stat_card.dart \
            lib/screens/dashboard_screen.dart \
            lib/screens/bucket_list_screen.dart \
            lib/screens/settings_screen.dart \
            lib/screens/scratch_map_screen.dart \
            lib/screens/city_intel_compare_screen.dart \
            lib/screens/travel_circles_screen.dart \
            lib/screens/pin_stay_screen.dart \
            lib/screens/quick_add_wizard_screen.dart \
            lib/screens/onboarding_checklist_screen.dart \
            lib/screens/city_intel_screen.dart \
            lib/screens/city_stats_screen.dart \
            lib/screens/edit_dates_screen.dart \
            lib/screens/seasonal_screen.dart \
            lib/screens/recent_stays_screen.dart \
            lib/screens/login_screen.dart \
            lib/screens/friend_qr_scanner_screen.dart \
            lib/screens/email_verification_screen.dart \
            test/email_verification_accessibility_test.dart \
            test/login_accessibility_test.dart \
            test/friend_qr_scanner_accessibility_test.dart \
            lib/screens/data_portability_screen.dart \
            lib/screens/trip_timeline_screen.dart \
            lib/screens/personal_insights_screen.dart \
            test/full_account_import_confirmation_test.dart \
            test/edit_dates_accessibility_test.dart \
            test/bottom_nav_accessibility_test.dart \
            test/map_visit_sheet_accessibility_test.dart \
            lib/widgets/ten_point_rating_selector.dart \
            test/ten_point_rating_selector_test.dart

      - name: Run focused UX widget regression tests
        run: |
          flutter test --no-pub test/ten_point_rating_selector_test.dart test/map_visit_sheet_accessibility_test.dart test/email_verification_accessibility_test.dart test/login_accessibility_test.dart test/friend_qr_scanner_accessibility_test.dart test/full_account_import_confirmation_test.dart test/edit_dates_accessibility_test.dart test/bottom_nav_accessibility_test.dart test/stat_card_world_coverage_test.dart test/city_choice_sheet_test.dart test/pin_stay_add_rating_test.dart test/travel_circles_invite_test.dart test/rating_compare_sheet_test.dart

      - name: Run full Flutter regression suite
        run: flutter test --no-pub

      - name: Commit formatting only after all checks pass
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/map_visit_sheet_accessibility_test.dart lib/screens/email_verification_screen.dart test/email_verification_accessibility_test.dart lib/screens/friend_qr_scanner_screen.dart test/login_accessibility_test.dart test/friend_qr_scanner_accessibility_test.dart lib/l10n/app_en.arb lib/l10n/app_de.arb lib/l10n/gen_l10n lib/screens/trip_timeline_screen.dart lib/screens/personal_insights_screen.dart lib/screens/login_screen.dart lib/screens/data_portability_screen.dart test/full_account_import_confirmation_test.dart lib/nomadrank_app_impl.dart lib/theme/app_theme.dart lib/widgets/bottom_nav.dart lib/widgets/dashboard_globe_card.dart lib/widgets/stat_card.dart lib/screens/dashboard_screen.dart lib/screens/bucket_list_screen.dart lib/screens/settings_screen.dart lib/screens/scratch_map_screen.dart lib/screens/city_intel_compare_screen.dart lib/screens/travel_circles_screen.dart lib/screens/pin_stay_screen.dart lib/screens/quick_add_wizard_screen.dart lib/screens/onboarding_checklist_screen.dart lib/screens/city_intel_screen.dart lib/screens/city_stats_screen.dart lib/screens/edit_dates_screen.dart lib/screens/seasonal_screen.dart lib/screens/recent_stays_screen.dart test/edit_dates_accessibility_test.dart test/bottom_nav_accessibility_test.dart lib/widgets/ten_point_rating_selector.dart test/ten_point_rating_selector_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'style(ui): format verified NomadRank round-seven visual corrections'
            git push origin HEAD:refs/heads/ux/impeccable-nomadrank-20261122
          fi
