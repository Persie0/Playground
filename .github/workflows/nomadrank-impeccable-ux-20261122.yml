name: NomadRank Impeccable UX validation (public CI)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nomadrank-impeccable-ux-20261122.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Verify checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout private NomadRank feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/skratch_clone
          ref: ux/impeccable-nomadrank-20261122
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Format changed UI and tests
        run: |
          dart format \
            lib/theme/app_theme.dart \
            lib/widgets/bottom_nav.dart \
            lib/widgets/dashboard_globe_card.dart \
            lib/widgets/stat_card.dart \
            lib/screens/dashboard_screen.dart \
            lib/screens/bucket_list_screen.dart \
            lib/screens/settings_screen.dart \
            lib/screens/scratch_map_screen.dart \
            test/bottom_nav_accessibility_test.dart

      - name: Commit only formatting to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/theme/app_theme.dart lib/widgets/bottom_nav.dart lib/widgets/dashboard_globe_card.dart lib/widgets/stat_card.dart lib/screens/dashboard_screen.dart lib/screens/bucket_list_screen.dart lib/screens/settings_screen.dart lib/screens/scratch_map_screen.dart test/bottom_nav_accessibility_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'style(ui): dart format Impeccable changes'
            git push origin HEAD:refs/heads/ux/impeccable-nomadrank-20261122
          fi

      - name: Analyze changed UI and tests
        run: |
          flutter analyze --no-pub \
            lib/theme/app_theme.dart \
            lib/widgets/bottom_nav.dart \
            lib/widgets/dashboard_globe_card.dart \
            lib/widgets/stat_card.dart \
            lib/screens/dashboard_screen.dart \
            lib/screens/bucket_list_screen.dart \
            lib/screens/settings_screen.dart \
            lib/screens/scratch_map_screen.dart \
            test/bottom_nav_accessibility_test.dart

      - name: Run focused UX widget regression tests
        run: |
          flutter test --no-pub test/bottom_nav_accessibility_test.dart test/stat_card_world_coverage_test.dart
