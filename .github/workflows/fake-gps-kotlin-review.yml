name: Fake GPS native Kotlin PR validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fake-gps-kotlin-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Validate secret
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$TOKEN"
      - name: Checkout private Fake GPS branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/fake_gps_detector
          ref: feature/native-kotlin-migration
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: fakegps
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform 37
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify original Flutter archive
        working-directory: fakegps
        run: |
          set -euo pipefail
          test -f old/pubspec.yaml
          test -f old/lib/main.dart
          test -f settings.gradle.kts
          test -f app/src/main/java/at/austriao/fake_gps_detector_app/MainActivity.kt
          test ! -f pubspec.yaml
      - name: Kotlin Android build and unit tests
        working-directory: fakegps
        run: |
          gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest --stacktrace --console=plain
