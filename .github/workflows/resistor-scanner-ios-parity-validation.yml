name: Validate native iOS Resistor Scanner Core ML and feature parity
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/resistor-scanner-ios-parity-validation.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/resistor-scanner-ios
          ref: fix/native-coreml-only-segmentation-20261031
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          submodules: recursive
          persist-credentials: false
          path: source
      - name: Confirm Appodeal SPM-supported Xcode version
        run: |
          xcodebuild -version
          major="$(xcodebuild -version | awk '/^Xcode/{print $2}' | cut -d. -f1)"
          test "$major" -ge 26
      - name: Run all pure Swift package tests
        run: cd source && swift test
      - name: Build for simulator without signing
        shell: bash
        run: |
          set -euo pipefail
          cd source
          xcodebuild -project ResistorScanner.xcodeproj -scheme ResistorScanner -configuration Debug -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/resistor-ios-build.log" 2>&1 || {
            grep -nE 'error:|fatal error|BUILD FAILED|SwiftCompile|CompileSwift' "$RUNNER_TEMP/resistor-ios-build.log" | tail -120
            tail -75 "$RUNNER_TEMP/resistor-ios-build.log"
            exit 1
          }
          grep 'BUILD SUCCEEDED' "$RUNNER_TEMP/resistor-ios-build.log"
      - name: Verify native Core ML is packaged for simulator
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/ResistorScanner.app"
          test -d "$APP"
          find "$APP" -maxdepth 4 -iname "*ppliteseg*" -print
          test -f "$APP/Models/resistor_segmenter_ppliteseg.json"
          test -d "$APP/Models/resistor_segmenter_ppliteseg.mlmodelc"
      - name: Execute real native Core ML prediction on macOS
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/ResistorScanner.app"
          env -u SDKROOT -u PLATFORM_NAME -u EFFECTIVE_PLATFORM_NAME xcrun --sdk macosx swift -framework CoreML \
            source/Scripts/verify_native_coreml.swift \
            "$APP/Models/resistor_segmenter_ppliteseg.mlmodelc"
      - name: Upload iOS build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resistor-ios-parity-build
          retention-days: 3
          path: |
            ${{ runner.temp }}/resistor-ios-build.log

