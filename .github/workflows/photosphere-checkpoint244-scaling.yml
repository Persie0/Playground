name: Photo Sphere checkpoint244 original converter post-scale
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint244-scaling.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 04a17c5b7c84fa709c81f568dfa742a4dbb6a2eb
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify exact source
        run: test "$(git rev-parse HEAD)" = "04a17c5b7c84fa709c81f568dfa742a4dbb6a2eb"
      - name: Install ARM64 emulation tooling
        run: python3 -m pip install --break-system-packages --quiet -r research/photosphere/checkpoint218/requirements.txt
      - name: Verify original GCam pinned liblightcycle ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Original feature converter coordinate scale 1x 2x 4x
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint244/native_injected_scaling.py > checkpoint244-scaling.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=Path("checkpoint244-scaling.log").read_text()
          d=json.loads(s.split("CHECKPOINT244_SCALED_CONVERTER_BEGIN\n")[1].split("\nCHECKPOINT244_SCALED_CONVERTER_END")[0])
          assert len(d["cases"])==1
          c=d["cases"][0]
          scaled=c["scaled_outputs"]
          assert [x["scale"] for x in scaled]==[1,2,4]
          assert [len(x["scaled_xy"]) for x in scaled]==[4,3,2]
          print("CHECKPOINT244_NATIVE_POST_SCALE",scaled)
          out={"elf_sha256":d["elf_sha256"],"source_dimensions":c["source_dimensions"],
            "scope":"Original ARM64 converter + post-scaler, detector keypoints injected",
            "injected_keypoints":c["native_outputs"],
            "native_converter":c["converter_outputs"],"native_scaled":scaled}
          Path("checkpoint244-original-post-scale.json").write_text(json.dumps(out,indent=2)+"\n")
          print("CHECKPOINT244_SCALED_ORACLE_BEGIN")
          print(json.dumps(out,separators=(",",":")))
          print("CHECKPOINT244_SCALED_ORACLE_END")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint244-native-feature-coordinate-postscale
          path: |
            checkpoint244-original-post-scale.json
            checkpoint244-scaling.log
          retention-days: 14
          if-no-files-found: warn
