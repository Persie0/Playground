name: Memory Palace UX validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/memory-palace-ux-audit-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private app
        uses: actions/checkout@v5
        with:
          repository: Persie0/Memory_Palace_Builder
          ref: b51d86415ed40345ea971a3902f9e121b7768e9d
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: private-app
        run: |
          if flutter pub get > "$RUNNER_TEMP/memory-pub.log" 2>&1; then
            echo "Dependency resolution passed"
          else
            echo "::error::Dependency resolution failed (private output withheld)"
            exit 1
          fi
      - name: Analyze changed Flutter files
        working-directory: private-app
        run: |
          if flutter analyze --no-fatal-infos --no-fatal-warnings lib/pages/learn_lists lib/pages/memory_palaces lib/pages/training lib/provider/settings_provider.dart lib/provider/storage_manager.dart lib/provider/palace_save_journal.dart lib/main.dart lib/settings/options.dart lib/widgets test/widgets test/provider/storage_manager_test.dart test/provider/palace_save_journal_test.dart test/pages/palace_selection_accessibility_test.dart test_driver/palace_recovery_probe.dart > "$RUNNER_TEMP/memory-analyze.log" 2>&1; then
            echo "Analysis passed"
          else
            python3 -c 'import os,re; p=os.path.join(os.environ["RUNNER_TEMP"],"memory-analyze.log"); print("\n".join(m.group(1)+" "+m.group(2)+" "+m.group(3) for l in open(p) if (m:=re.match(r"\s*(error|warning) • .* • ((?:lib|test)/[^ ]+) • ([a-z_]+)\s*$",l))))'
            echo "::error::Analysis failed (private output withheld)"
            exit 1
          fi
      - name: Run focused widget tests
        working-directory: private-app
        if: success() || failure()
        run: |
          failed=0
          for group in test/widgets test/provider/storage_manager_test.dart test/provider/palace_save_journal_test.dart test/pages/palace_selection_accessibility_test.dart; do
            if flutter test --machine "$group" > "$RUNNER_TEMP/memory-test.log" 2>&1; then
              echo "PASS $group"
            else
              echo "::error::FAIL $group (private output withheld)"
              python3 -c 'import sys,re,json; raw=sys.stdin.read(); allowed=["RenderFlex overflowed","No element","Too many elements","Expected: exactly one matching candidate","Could not find","pumpAndSettle timed out","FileSystemException","FormatException","PlatformException","MissingPluginException","Bad state","Assertion failed","ScrollController","not hit testable","maximum number of scrolls","Expected: null","Actual:","zero widgets","ScrollPosition","Compilation failed","Failed to load","Error:","Error when reading","Dart library","not available on this platform","Test failed","Unable to load","A Timer is still pending","native assets","SIG","Exception","PALACE_CHECK_INITIAL_LAYOUT","PALACE_CHECK_START_PRESENT","PALACE_CHECK_START_DISABLED","PALACE_CHECK_ROW_PRESENT","PALACE_CHECK_ROW_VISIBLE","PALACE_CHECK_ROW_DISABLED","PALACE_CHECK_SCROLL_LAYOUT"]; print("Categories:",", ".join(x for x in allowed if x.lower() in raw.lower())); print("Compiler positions:",sorted(set(re.findall(r"(?:lib|test)/[a-zA-Z0-9_/]+\\.dart:\\d+:\\d+",raw))))' < "$RUNNER_TEMP/memory-test.log" || true
              failed=1
            fi
          done
          exit "$failed"
  android-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private app
        uses: actions/checkout@v5
        with:
          repository: Persie0/Memory_Palace_Builder
          ref: b51d86415ed40345ea971a3902f9e121b7768e9d
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build isolated native recovery harness
        run: |
          set -e
          # Compile the actual journal and storage implementation without
          # unrelated application dependencies (ads, billing, Firebase, etc.).
          flutter create --platforms=android --org com.austriao --project-name memory_palace_builder --no-pub "$RUNNER_TEMP/palace-probe" > "$RUNNER_TEMP/palace-create.log" 2>&1
          probe="$RUNNER_TEMP/palace-probe"
          mkdir -p "$probe/lib/provider"
          cp private-app/lib/provider/palace_save_journal.dart "$probe/lib/provider/"
          cp private-app/lib/provider/storage_manager.dart "$probe/lib/provider/"
          cp private-app/test_driver/palace_recovery_probe.dart "$probe/lib/main.dart"
          cd "$probe"
          if ! flutter pub add 'crypto:^3.0.7' 'path_provider:^2.1.6' 'shared_preferences:^2.5.6' > "$RUNNER_TEMP/palace-probe-pub.log" 2>&1; then
            echo "::error::Isolated probe dependency resolution failed"
            exit 1
          fi
          if ! flutter build apk --debug --dart-define=PALACE_RECOVERY_PROBE=true > "$RUNNER_TEMP/palace-probe-build.log" 2>&1; then
            python3 -c 'import sys; raw=open(sys.argv[1]).read().lower(); categories=["sdk location not found","failed to find platform","license","ndk","gradle","could not resolve","could not download","minimum supported","java heap space","out of memory","no space left","compilation failed","failed to compile","missingpluginexception","unsupported class file","network is unreachable","timeout","manifest merger failed","could not install"]; print("Build diagnostic categories:",", ".join(x for x in categories if x in raw))' "$RUNNER_TEMP/palace-probe-build.log"
            echo "::error::Isolated probe build failed (private output withheld)"
            exit 1
          fi
      - name: Verify real Android process restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r "$RUNNER_TEMP/palace-probe/build/app/outputs/flutter-apk/app-debug.apk"
            adb shell pm clear com.austriao.memory_palace_builder
            adb logcat -c
            adb shell am start -n com.austriao.memory_palace_builder/.MainActivity
            for i in $(seq 1 90); do if adb logcat -d -s flutter | grep -q PALACE_RECOVERY_PROBE_READY; then break; fi; sleep 2; done
            adb logcat -d -s flutter | grep -q PALACE_RECOVERY_PROBE_READY
            echo "Native staged transaction ready"
            adb shell am force-stop com.austriao.memory_palace_builder
            adb logcat -c
            adb shell am start -n com.austriao.memory_palace_builder/.MainActivity
            for i in $(seq 1 90); do if adb logcat -d -s flutter | grep -q PALACE_RECOVERY_PROBE_PASSED; then break; fi; sleep 2; done
            adb logcat -d -s flutter | grep -q PALACE_RECOVERY_PROBE_PASSED
            echo "Native force-stop and relaunch recovery passed"
