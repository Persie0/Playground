name: Memory Palace UX validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/memory-palace-ux-audit-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private app
        uses: actions/checkout@v5
        with:
          repository: Persie0/Memory_Palace_Builder
          ref: b4ea1a3a9dd8f5490f83346fa04a452d1fe07d21
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: private-app
        run: |
          if flutter pub get > "$RUNNER_TEMP/memory-pub.log" 2>&1; then
            echo "Dependency resolution passed"
          else
            echo "::error::Dependency resolution failed (private output withheld)"
            exit 1
          fi
      - name: Analyze changed Flutter files
        working-directory: private-app
        run: |
          if flutter analyze --no-fatal-infos --no-fatal-warnings lib/pages/learn_lists lib/pages/memory_palaces lib/pages/training lib/provider/settings_provider.dart lib/provider/storage_manager.dart lib/settings/options.dart lib/widgets test/widgets test/provider/storage_manager_test.dart > "$RUNNER_TEMP/memory-analyze.log" 2>&1; then
            echo "Analysis passed"
          else
            grep -E '^[[:space:]]*(error|warning) •' "$RUNNER_TEMP/memory-analyze.log" | sed -E 's/^[[:space:]]*(error|warning) • .* • (lib\/[^ ]+|test\/[^ ]+) • ([a-z_]+)$/\1 • \2 • \3/' | grep -E '^(error|warning) • (lib|test)/[^ ]+ • [a-z_]+
            exit 1
          fi
      - name: Run focused widget tests
        working-directory: private-app
        if: success() || failure()
        run: |
          if flutter test test/widgets test/provider/storage_manager_test.dart > "$RUNNER_TEMP/memory-test.log" 2>&1; then
            echo "Focused widget tests passed"
          else
            echo "::error::Focused widget tests failed (private output withheld)"
            exit 1
          fi
 || true
            echo "::error::Analysis failed (private output withheld)"
            exit 1
          fi
      - name: Run focused widget tests
        working-directory: private-app
        if: success() || failure()
        run: |
          if flutter test test/widgets test/provider/storage_manager_test.dart > "$RUNNER_TEMP/memory-test.log" 2>&1; then
            echo "Focused widget tests passed"
          else
            echo "::error::Focused widget tests failed (private output withheld)"
            exit 1
          fi
