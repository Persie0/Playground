name: Memory Palace UX validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/memory-palace-ux-audit-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private app
        uses: actions/checkout@v5
        with:
          repository: Persie0/Memory_Palace_Builder
          ref: e93790d47396e6d6750a4d98db8a73fc3c26847e
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: private-app
        run: |
          if flutter pub get > "$RUNNER_TEMP/memory-pub.log" 2>&1; then
            echo "Dependency resolution passed"
          else
            echo "::error::Dependency resolution failed (private output withheld)"
            exit 1
          fi
      - name: Analyze changed Flutter files
        working-directory: private-app
        run: |
          if flutter analyze --no-fatal-infos --no-fatal-warnings lib/pages/learn_lists lib/pages/memory_palaces lib/pages/training lib/provider/settings_provider.dart lib/provider/storage_manager.dart lib/provider/palace_save_journal.dart lib/main.dart lib/settings/options.dart lib/widgets test/widgets test/provider/storage_manager_test.dart test/provider/palace_save_journal_test.dart test/pages/palace_selection_accessibility_test.dart test_driver/palace_recovery_probe.dart > "$RUNNER_TEMP/memory-analyze.log" 2>&1; then
            echo "Analysis passed"
          else
            python3 -c 'import os,re; p=os.path.join(os.environ["RUNNER_TEMP"],"memory-analyze.log"); print("\n".join(m.group(1)+" "+m.group(2)+" "+m.group(3) for l in open(p) if (m:=re.match(r"\s*(error|warning) • .* • ((?:lib|test)/[^ ]+) • ([a-z_]+)\s*$",l))))'
            echo "::error::Analysis failed (private output withheld)"
            exit 1
          fi
      - name: Run focused widget tests
        working-directory: private-app
        if: success() || failure()
        run: |
          failed=0
          for group in test/widgets test/provider/storage_manager_test.dart test/provider/palace_save_journal_test.dart test/pages/palace_selection_accessibility_test.dart; do
            if flutter test --machine "$group" > "$RUNNER_TEMP/memory-test.log" 2>&1; then
              echo "PASS $group"
            else
              echo "::error::FAIL $group (private output withheld)"
              python3 -c 'import sys,json; rows=[]; exec("for line in sys.stdin:\n try:\n  row=json.loads(line)\n  if isinstance(row,dict): rows.append(row)\n except ValueError: pass"); errors="\n".join(str(r.get("error","")) for r in rows if r.get("type")=="error"); allowed=["RenderFlex overflowed","No element","Too many elements","Expected: exactly one matching candidate","Could not find","pumpAndSettle timed out","FileSystemException","FormatException","PlatformException","MissingPluginException","Bad state","Assertion failed","ScrollController","not hit testable","maximum number of scrolls","Expected: null","Actual:","zero widgets","ScrollPosition"]; print("Error categories:",", ".join(x for x in allowed if x.lower() in errors.lower())); print("Test failures:",sum(r.get("type")=="testDone" and r.get("result") in ("failure","error") for r in rows))' < "$RUNNER_TEMP/memory-test.log" || true
              failed=1
            fi
          done
          exit "$failed"
  android-restart:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private app
        uses: actions/checkout@v5
        with:
          repository: Persie0/Memory_Palace_Builder
          ref: e93790d47396e6d6750a4d98db8a73fc3c26847e
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: android-actions/setup-android@v3
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build private recovery probe
        working-directory: private-app
        run: |
          if ! flutter pub get > "$RUNNER_TEMP/memory-device-pub.log" 2>&1; then
            echo "::error::Device dependency resolution failed"
            exit 1
          fi
          if ! flutter build apk --debug --target test_driver/palace_recovery_probe.dart --dart-define=PALACE_RECOVERY_PROBE=true > "$RUNNER_TEMP/memory-device-build.log" 2>&1; then
            echo "::error::Device probe build failed (private output withheld)"
            exit 1
          fi
      - name: Verify real Android process restart
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r private-app/build/app/outputs/flutter-apk/app-debug.apk
            adb shell pm clear com.austriao.memory_palace_builder
            adb logcat -c
            adb shell am start -n com.austriao.memory_palace_builder/.MainActivity
            for i in $(seq 1 90); do if adb logcat -d -s flutter | grep -q PALACE_RECOVERY_PROBE_READY; then break; fi; sleep 2; done
            adb logcat -d -s flutter | grep -q PALACE_RECOVERY_PROBE_READY
            echo "Native staged transaction ready"
            adb shell am force-stop com.austriao.memory_palace_builder
            adb logcat -c
            adb shell am start -n com.austriao.memory_palace_builder/.MainActivity
            for i in $(seq 1 90); do if adb logcat -d -s flutter | grep -q PALACE_RECOVERY_PROBE_PASSED; then break; fi; sleep 2; done
            adb logcat -d -s flutter | grep -q PALACE_RECOVERY_PROBE_PASSED
            echo "Native force-stop and relaunch recovery passed"
