name: Toothfairy brand and listing validation
on:
  push:
    branches: [toothfairy-private-validation]
    paths: ['.github/workflows/toothfairy-brand.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brand:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch pinned private source
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feature/01-mobile-foundation https://github.com/Persie0/Toothfairy.git source
          test "$(git -C source rev-parse HEAD)" = 858431aedcb5ce05d0a255fe48b005d443c076cd
      - name: Render and validate release assets
        run: |
          set -euo pipefail
          python -m venv /tmp/tf-brand
          /tmp/tf-brand/bin/pip install -q -r source/tools/requirements-brand.txt >/tmp/tf-brand-deps.log 2>&1
          cd source
          /tmp/tf-brand/bin/python -m unittest discover -s tools -p test_release_assets.py >/tmp/tf-listing.log 2>&1 || { echo "Listing validation failed"; exit 1; }
          /tmp/tf-brand/bin/python tools/build_brand.py >/tmp/tf-brand.log 2>&1 || { echo "Brand rendering failed"; exit 1; }
          cat /tmp/tf-brand.log
          echo "Bilingual listing character limits and five opaque PNGs validated."
      - name: Commit generated brand assets privately
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          cd source
          git add mobile/Assets/Toothfairy/Brand release/brand
          git -c user.name=toothfairy-validation -c user.email=toothfairy-validation@users.noreply.github.com commit -qm "assets: bundle validated original app icons and localized feature graphics"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push --quiet origin HEAD:refs/heads/feature/01-mobile-foundation
      - name: Cleanup
        if: always()
        run: rm -rf source /tmp/tf-brand /tmp/tf-brand-deps.log /tmp/tf-listing.log /tmp/tf-brand.log
