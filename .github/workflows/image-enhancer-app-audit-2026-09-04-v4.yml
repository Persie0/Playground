name: Image Enhancer app audit 2026-09-04 v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/image-enhancer-app-audit-2026-09-04-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/image_enhancer
  TARGET_BRANCH: fix/app-audit-2026-09-04

jobs:
  audit-followup-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Checkout audited Image Enhancer branch
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply follow-up audit fixes
        working-directory: app
        run: |
          set -euo pipefail
          python3 ../.github/scripts/image_enhancer_app_audit_followup_2026_09_04.py
          rm lib/services/eu_privacy_service.dart
          flutter pub get
          dart format \
            lib/main.dart \
            lib/store/store.dart \
            lib/super_resolution_home_page.dart
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ET.parse('android/app/src/main/AndroidManifest.xml')
          haystack = '\n'.join([
              Path('lib/main.dart').read_text(),
              Path('pubspec.yaml').read_text(),
          ])
          assert 'EuPrivacyService' not in haystack
          assert 'ip_country_lookup' not in haystack
          assert not Path('lib/services/eu_privacy_service.dart').exists()
          PY
          git diff --check

      - name: Analyze and test app
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Test super-resolution package
        working-directory: app/flutter_super_resolution
        run: |
          flutter pub get
          flutter test

      - name: Compile Android debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Commit and push completed audit
        working-directory: app
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'Persie0'
          git config user.email '76871553+Persie0@users.noreply.github.com'
          git add -A
          git commit -m 'Complete app audit hardening'
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/Persie0/image_enhancer.git"
          git push origin HEAD:"$TARGET_BRANCH"
