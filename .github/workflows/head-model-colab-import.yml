name: Head model Colab import regression

on:
  push:
    paths:
      - ".github/workflows/head-model-colab-import.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Head_model
        uses: actions/checkout@v4
        with:
          repository: Persie0/Head_model
          ref: main
          path: Head_model
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reproduce live-kernel editable import
        run: |
          python - <<'PY'
          import importlib
          import importlib.util
          import pathlib
          import subprocess
          import sys

          repo = pathlib.Path("Head_model").resolve()
          subprocess.run(
              [sys.executable, "-m", "pip", "install", "-q", "-e", f"{repo}[train,export,dev]"],
              check=True,
          )

          # Same fix used by the Colab script: no interpreter restart.
          src_dir = (repo / "src").resolve()
          sys.path.insert(0, str(src_dir))
          importlib.invalidate_caches()

          spec = importlib.util.find_spec("head_model")
          assert spec is not None, sys.path
          from head_model.makehuman_synth import generate_makehuman_dataset
          print("head_model spec:", spec.origin)
          print("generator import:", generate_makehuman_dataset.__name__)
          PY
      - name: Compile and test
        working-directory: Head_model
        run: |
          python -m compileall -q src tests colab/train_headscan_lite_colab.py
          pytest -q
