name: Video editor native UX validation
on:
  push:
    branches: [ci/video-upscaler-ux-20261126]
    paths: [.github/workflows/video-editor-ux-validation.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Checkout private Android editor (read only)
        uses: actions/checkout@v4
        with:
          repository: Persie0/video_upscaler_android
          ref: 6af2659d000443a9f1805f04d3f1f479098373d6
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app-src
      - name: Install compile SDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' || "$SDKMANAGER" --install 'platforms;android-37'
      - name: Compile app, JVM tests and Android instrumentation APK
        working-directory: app-src
        run: |
          chmod +x ./gradlew
          if ! ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest :app:lintDebug --no-daemon --console=plain > /tmp/native-ux-build.log 2>&1; then
            echo "::error::Android compile, test or lint failed (private build output withheld)"
            exit 1
          fi
          echo "Debug build, JVM tests, instrumentation APK and lint passed"
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run UI regression tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: >-
            cd app-src &&
            ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=at.persie0.VideoUpscaler.EditorAccessibilityTest,at.persie0.VideoUpscaler.UpscalerHomeInstrumentedTest,at.persie0.VideoUpscaler.EditorNavigationInstrumentedTest --no-daemon --console=plain > /tmp/native-ux-device.log 2>&1
            || { echo "::error::UI regression tests failed"; exit 1; }
      - name: Summarize UI test results without exposing source
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          files = list(pathlib.Path("app-src/app/build/outputs/androidTest-results").rglob("TEST-*.xml"))
          for file in files:
              root = ET.parse(file).getroot()
              print("Tests:", root.get("tests"), "Failures:", root.get("failures"), "Errors:", root.get("errors"))
              for case in root.iter("testcase"):
                  print(case.get("name"), "FAILED" if case.find("failure") is not None or case.find("error") is not None else "PASSED")
          PY
      - name: Remove private build output
        if: always()
        run: rm -f /tmp/sdk-install.log /tmp/native-ux-build.log /tmp/native-ux-device.log
