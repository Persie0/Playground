name: Validate North Macedonia rankings
on:
  push:
    branches: [main]
    paths: ['.github/workflows/toptravellist-north-macedonia-47-20261125.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: data/north-macedonia-worldwide-v2-2026
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: repo
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and regenerate
        working-directory: repo
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python scripts/validate.py
          python scripts/check_city_benchmarks.py
          python scripts/check_sight_benchmarks.py
          python scripts/check_new_country_reviews.py --country MK
          python scripts/generate_rankings.py --country MK
          python scripts/generate_rankings.py --check
          python scripts/rank.py --country MK --kind cities --limit 15
          python scripts/rank.py --country MK --kind sights --limit 20
      - name: Check review totals and numerical peers
        working-directory: repo
        run: |
          python - <<'PY'
          import re,yaml
          from decimal import Decimal as D
          from pathlib import Path
          dims='impact uniqueness significance experience depth'.split()
          weights=[30,25,20,15,10]
          refs=high=linked=editorial=unranked=0
          for kind,n in [('cities',14),('sights',33)]:
              r=Path('countries/MK')
              txt=Path(f'methodology/reviews/MK/{kind}.md').read_text()
              ids=re.findall(r'^## ((?:city|sight)-mk-[a-z0-9-]+) — ',txt,re.M)
              assert len(ids)==len(set(ids))==n
              linked+=txt.count('**source-linked-unverified**')
              editorial+=txt.count('**editorial-only**')
              files=list((r/kind).glob('*.yaml'))
              assert len(files)==n
              md=(r/f'{kind}.md').read_text()
              assert md.count('https://www.google.com/maps/search/?api=1&query=')>=n-1
              for f in files:
                  a=yaml.safe_load(f.read_text()); sc=a['scores']; loc=a['location']
                  assert a['id'] in ids and loc['country_code']=='MK'
                  assert 40.8<=loc['latitude']<=42.4 and 20.4<=loc['longitude']<=23.1
                  vals=[*(sc[k] for k in dims),*sc['categories'].values()]
                  assert all(v is None or 0<=v<10 for v in vals)
                  sec=txt.split('## '+a['id']+' — ',1)[1].split('\n## ',1)[0]
                  assert f']({kind}/{f.name})' in md
                  if any(sc[k] is None for k in dims):
                      unranked+=1
                      assert a['id']=='sight-mk-dlaboka-reka-beech-forest-component' and '**unassessed**' in sec
                  else:
                      total=sum(D(str(sc[k]))*w for k,w in zip(dims,weights))/10
                      assert f'Overall {total:.2f}/100' in sec
                      if total>=90 or any(v>=9.5 for v in vals):
                          high+=1
                          assert 'High-score challenge: Not applicable' not in sec
                  peers=re.findall(r'\]\(\.\./\.\./\.\./(countries/[A-Z]{2}/(?:cities|sights)/[^)]+\.yaml)\) — ([0-9./]+) \(([0-9.]+)/100\)',sec)
                  assert len(set(p[0] for p in peers))==4
                  for path,vec,score in peers:
                      assert Path(path).parts[2]==kind
                      p=yaml.safe_load(Path(path).read_text())
                      actual=[D(str(p['scores'][k])) for k in dims]
                      assert actual==[D(x) for x in vec.split('/')],(path,actual,vec)
                      assert sum(v*w for v,w in zip(actual,weights))/10==D(score)
                      refs+=1
          assert (refs,high,linked,editorial,unranked)==(188,2,37,9,1)
          print('PASS: 47 reviews, 188 peer checks, two exceptional cases and one intentionally unranked sight')
          PY
      - name: Commit generated rankings
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name toptravellist-editorial-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md countries/MK/cities.md countries/MK/sights.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Generate North Macedonia rankings'
            git push origin HEAD:refs/heads/data/north-macedonia-worldwide-v2-2026
          fi
