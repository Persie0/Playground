name: FocusMove Step 12 opt-in sensor PR validation

on:
  push:
    paths:
      - '.github/workflows/pomodoroexercise-steps-pr-validation.yml'
      - 'pomodoroexercise-steps-ci-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focusmove-steps12-validation
  cancel-in-progress: true

jobs:
  android-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Clone private feature branch (no source publication)
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/12-opt-in-live-steps https://github.com/Persie0/pomodoroexercise.git source
      - name: Flutter dependencies, static analysis and all tests
        working-directory: source
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test --reporter expanded
      - name: Build Android debug APK (not uploaded publicly)
        working-directory: source
        run: flutter build apk --debug

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Clone private feature branch (no source publication)
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/12-opt-in-live-steps https://github.com/Persie0/pomodoroexercise.git source
      - name: Compile iOS simulator (unsigned, no artifact upload)
        working-directory: source
        run: |
          set -euo pipefail
          flutter pub get
          flutter build ios --simulator --no-codesign
