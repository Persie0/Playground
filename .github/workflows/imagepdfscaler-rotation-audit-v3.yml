name: ImagePdfScaler rotation audit v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imagepdfscaler-rotation-audit-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finish-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Checkout audit branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/ImagePdfScaler
          ref: audit/performance-rotation
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch model and editor hot path
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          model = Path('lib/models/layout_models.dart')
          s = model.read_text()
          if 'int get normalizedQuarterTurns' not in s:
              marker = '  double get centerYMm => yMm + heightMm / 2;\n'
              if marker not in s:
                  raise SystemExit('centerYMm marker not found')
              s = s.replace(
                  marker,
                  marker + '''
            int get normalizedQuarterTurns =>
                ((rotationQuarterTurns % 4) + 4) % 4;
            bool get rotationSwapsAxes => normalizedQuarterTurns.isOdd;

            /// Physical dimensions occupied by the unrotated source pixels before
            /// the editor/PDF applies the deferred quarter-turn transform.
            double get sourceWidthMm => rotationSwapsAxes ? heightMm : widthMm;
            double get sourceHeightMm => rotationSwapsAxes ? widthMm : heightMm;
          ''',
                  1,
              )
          if 'PlacedImage? rotatePlacedImage90' not in s:
              marker = 'class SnapGuide {'
              idx = s.find(marker)
              if idx < 0:
                  raise SystemExit('SnapGuide marker not found')
              helper = '''PlacedImage? rotatePlacedImage90({
            required PlacedImage item,
            required PaperPreset paper,
          }) {
            final width = item.heightMm;
            final height = item.widthMm;
            if (!width.isFinite || !height.isFinite || width <= 0 || height <= 0) {
              return null;
            }
            if (width > paper.widthMm + 0.0001 ||
                height > paper.heightMm + 0.0001) {
              return null;
            }
            final maxX = math.max(0.0, paper.widthMm - width);
            final maxY = math.max(0.0, paper.heightMm - height);
            return item.copyWith(
              widthMm: width,
              heightMm: height,
              xMm: item.xMm.clamp(0.0, maxX).toDouble(),
              yMm: item.yMm.clamp(0.0, maxY).toDouble(),
              rotationQuarterTurns: (item.normalizedQuarterTurns + 1) % 4,
            );
          }

          '''
              s = s[:idx] + helper + s[idx:]
          model.write_text(s)

          editor = Path('lib/screens/editor_page.dart')
          s = editor.read_text()
          if '_materializeRotationForEditing' not in s:
              marker = '  Future<void> _cropImage(String id) async {'
              if marker not in s:
                  raise SystemExit('crop marker not found')
              helper = '''  Future<PlacedImage?> _materializeRotationForEditing(
            PlacedImage item,
          ) async {
            final turns = item.normalizedQuarterTurns;
            if (turns == 0) return item;
            if (_processingImage) return null;

            setState(() => _processingImage = true);
            try {
              final result = await ImageProcessingService.materializeQuarterTurns(
                fullBytes: item.bytes,
                quarterTurns: turns,
              );
              if (!mounted) return null;
              if (result == null) {
                _showSnack('Could not prepare this rotated image for editing.');
                return null;
              }
              final index = _images.indexWhere((entry) => entry.id == item.id);
              if (index < 0) return null;
              final current = _images[index];
              final updated = current.copyWith(
                bytes: result.fullBytes,
                previewBytes: result.previewBytes,
                rotationQuarterTurns: 0,
              );
              setState(() => _images[index] = updated);
              return updated;
            } catch (error) {
              if (mounted) _showSnack('Could not prepare rotated image: $error');
              return null;
            } finally {
              if (mounted) setState(() => _processingImage = false);
            }
          }

          '''
              s = s.replace(marker, helper + marker, 1)

          crop_start = s.find('  Future<void> _cropImage(String id) async {')
          rotate_start = s.find('  Future<void> _rotateSelected()', crop_start)
          if crop_start < 0 or rotate_start < 0:
              raise SystemExit('crop/rotate boundaries not found')
          crop = s[crop_start:rotate_start]
          crop = crop.replace('    final item = _images[index];', '    var item = _images[index];', 1)
          if 'item.normalizedQuarterTurns != 0' not in crop:
              nav = '    final edited = await Navigator.of(context).push<EditedImageResult>('
              if nav not in crop:
                  raise SystemExit('crop nav marker not found')
              pre = '''    if (item.normalizedQuarterTurns != 0) {
                final materialized = await _materializeRotationForEditing(item);
                if (materialized == null || !mounted) return;
                item = materialized;
              }

          '''
              crop = crop.replace(nav, pre + nav, 1)
          s = s[:crop_start] + crop + s[rotate_start:]

          pattern = re.compile(
              r'  Future<void> _rotateSelected\(\) async \{.*?\n  \}\n\n  void _duplicateSelected\(\) \{',
              re.S,
          )
          if '  void _rotateSelected() {' not in s:
              replacement = '''  void _rotateSelected() {
            final item = _primarySelectedImage;
            if (item == null || _selectedIds.length != 1) return;
            final rotated = rotatePlacedImage90(item: item, paper: _paper);
            if (rotated == null) {
              _showSnack('A 90° rotation would not fit on the current paper.');
              return;
            }
            final index = _images.indexWhere((entry) => entry.id == item.id);
            if (index < 0) return;
            setState(() {
              _images[index] = rotated;
              _snapGuides = const [];
            });
            if (_settings.hapticsEnabled) HapticFeedback.selectionClick();
          }

          void _duplicateSelected() {'''
              s, count = pattern.subn(replacement, s, count=1)
              if count != 1:
                  raise SystemExit(f'rotate replacement count={count}')

          if 'Could not open the print dialog' not in s:
              pattern = re.compile(
                  r"  Future<void> _printPdf\(\) async \{.*?\n  \}\n\n  Future<void> _sharePdf\(\) async \{.*?\n  \}",
                  re.S,
              )
              replacement = '''  Future<void> _printPdf() async {
            try {
              final bytes = await _buildPdf();
              if (bytes == null) return;
              await Printing.layoutPdf(
                name: 'image-layout-${_safeFileName(_paper.name)}.pdf',
                onLayout: (_) async => bytes,
              );
            } catch (error) {
              if (mounted) _showSnack('Could not open the print dialog: $error');
            }
          }

          Future<void> _sharePdf() async {
            try {
              final bytes = await _buildPdf();
              if (bytes == null) return;
              await Printing.sharePdf(
                bytes: bytes,
                filename: 'image-layout-${_safeFileName(_paper.name)}.pdf',
              );
            } catch (error) {
              if (mounted) _showSnack('Could not share the PDF: $error');
            }
          }'''
              s, count = pattern.subn(replacement, s, count=1)
              if count != 1:
                  raise SystemExit(f'print/share replacement count={count}')
          editor.write_text(s)
          PY

          dart format lib test
          git diff --check

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Strict analyze
        working-directory: app
        run: flutter analyze

      - name: Full tests
        working-directory: app
        run: flutter test

      - name: Dependency report
        working-directory: app
        run: flutter pub outdated || true

      - name: Generate Android scaffold
        shell: bash
        run: |
          rm -rf /tmp/imagepdfscaler-scaffold
          flutter create /tmp/imagepdfscaler-scaffold \
            --platforms=android \
            --org com.persie \
            --project-name image_pdf_scaler
          rm -rf app/android
          cp -R /tmp/imagepdfscaler-scaffold/android app/android

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Commit and push green audit
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Persie0'
          git config user.email '76871553+Persie0@users.noreply.github.com'
          git add lib test tool pubspec.yaml AUDIT_2026-09.md
          git commit -m 'Make 90 degree rotation instant and complete audit' || true
          git push origin HEAD:audit/performance-rotation

      - name: Upload audited release APK
        uses: actions/upload-artifact@v4
        with:
          name: imagepdfscaler-audited-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
