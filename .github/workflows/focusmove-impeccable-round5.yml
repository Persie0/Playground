name: FocusMove Impeccable round 5 validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/focusmove-impeccable-round5.yml'
      - 'focusmove-impeccable-round5-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focusmove-impeccable-round5
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private FocusMove feature branch in temporary runner only
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Missing private repository token'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=fix/impeccable-focusmove-round5-20261122 https://github.com/Persie0/pomodoroexercise.git source
          git -C source log -1 --format='Private revision %h'
      - name: Format changed Dart code on private branch
        working-directory: source
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          dart format lib/src/screens/home_shell.dart lib/src/screens/privacy_settings_screen.dart test/impeccable_round5_test.dart
          if ! git diff --quiet -- lib/src/screens/home_shell.dart lib/src/screens/privacy_settings_screen.dart test/impeccable_round5_test.dart; then
            git config user.name 'focusmove-public-ci'
            git config user.email 'actions@users.noreply.github.com'
            git add lib/src/screens/home_shell.dart lib/src/screens/privacy_settings_screen.dart test/impeccable_round5_test.dart
            git commit -m 'style: format FocusMove round 5 changes'
            AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/impeccable-focusmove-round5-20261122
          fi
      - name: Resolve dependencies
        working-directory: source
        shell: bash
        run: timeout 240s flutter pub get
      - name: Analyze
        working-directory: source
        shell: bash
        run: timeout 150s flutter analyze
      - name: Test UX round 5 regression cases
        working-directory: source
        shell: bash
        run: timeout 180s flutter test test/impeccable_round5_test.dart --reporter expanded
      - name: Run full Flutter test suite
        working-directory: source
        shell: bash
        run: timeout 300s flutter test --reporter expanded
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build Android debug APK privately
        working-directory: source
        shell: bash
        run: |
          timeout 600s flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk

  ios:
    needs: flutter
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private source in temporary runner only
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=fix/impeccable-focusmove-round5-20261122 https://github.com/Persie0/pomodoroexercise.git source
      - name: Compile iOS simulator (unsigned)
        working-directory: source
        shell: bash
        run: |
          timeout 3600s flutter pub get
          flutter build ios --simulator --no-codesign
          test -d build/ios/iphonesimulator/Runner.app
