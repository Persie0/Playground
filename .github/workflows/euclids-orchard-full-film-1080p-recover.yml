name: Euclid's Orchard - Recover 1080p Full Film Assembly

on:
  push:
    branches: [ci/euclids-orchard-full1080p]
    paths:
      - .github/workflows/euclids-orchard-full-film-1080p-recover.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: euclids-orchard-1080p-assembly-recovery
  cancel-in-progress: false

env:
  ORIGINAL_RUN_ID: "41740923487"
  SOURCE_SHA: e471557830b2f8e47495133508d78e4c17545699
  RELEASE_TAG: euclids-orchard-19m12s-native1080p-silent-2026-11-04
  PYTHONUNBUFFERED: "1"

jobs:
  assemble:
    name: Recover all 26 successful HD renders, verify, and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout public Playground scripts (patched assembly)
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python and FFmpeg (no NumPy required for assembly)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure FFmpeg and syntax are available
        run: |
          set -euo pipefail
          command -v ffmpeg
          command -v ffprobe
          python -m py_compile scripts/euclids-orchard/render_fullfilm.py
          python - <<'PY'
          import ast
          from pathlib import Path
          module = ast.parse(Path('scripts/euclids-orchard/render_fullfilm.py').read_text())
          assert not any(isinstance(x,(ast.Import,ast.ImportFrom)) and any(
            a.name == 'numpy' or a.name.startswith('numpy.') for a in (
              x.names if isinstance(x,ast.Import) else [ast.alias(name=x.module or '')]
            )) for x in module.body), 'NumPy must not be a top-level assembly dependency'
          print('PASS: assembly is dependency-light and NumPy is lazy-loaded for render-only')
          PY

      - name: Reuse validated scene artifacts from original run 41740923487
        uses: actions/download-artifact@v4
        with:
          repository: Persie0/Playground
          run-id: 41740923487
          github-token: ${{ github.token }}
          pattern: orchard-scene-*-native1080p
          path: output/scenes
          merge-multiple: true

      - name: Verify all 26 expected scenes downloaded
        run: |
          set -euo pipefail
          for n in $(seq 1 26); do
            file="$(printf 'output/scenes/scene-%02d.mp4' "$n")"
            test -s "$file" || { echo "::error::Missing $file"; exit 1; }
          done
          test "$(find output/scenes -maxdepth 1 -type f -name 'scene-*.mp4' | wc -l)" -eq 26
          ls -lh output/scenes/scene-*.mp4
          echo "PASS: all original native 1080p scene artifacts recovered"

      - name: Assemble exact 19m12s 1080p30 film and fully decode
        env:
          EUCLIDS_SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          python scripts/euclids-orchard/render_fullfilm.py assemble \
            --parts-dir output/scenes \
            --output output/Euclids_Orchard_19m12s_1080p30_SILENT.mp4
          (cd output && sha256sum Euclids_Orchard_19m12s_1080p30_SILENT.mp4 RENDER_INFO.txt > SHA256SUMS.txt)
          (cd output && sha256sum -c SHA256SUMS.txt)

      - name: Upload final verified MP4 regardless of release token availability
        uses: actions/upload-artifact@v4
        with:
          name: Euclids-Orchard-19m12s-Native1080p30-SILENT-RECOVERED
          path: |
            output/Euclids_Orchard_19m12s_1080p30_SILENT.mp4
            output/RENDER_INFO.txt
            output/SHA256SUMS.txt
          compression-level: 0
          retention-days: 30
          if-no-files-found: error

      - name: Publish silent visual master to public Playground prerelease
        env:
          PRIVATE_PAT: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ALT_PAT: ${{ secrets.GH_TOKEN }}
          RELEASE_PAT: ${{ secrets.GH_RELEASE_TOKEN }}
          WORKFLOW_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/orchard-release.md <<'EOF'
          ## Euclid's Orchard — full original 26-scene native 1080p silent export
          - Complete 19:12 / 1152-second visual film, native 1920×1080 at 30fps.
          - 34,560 source-rendered frames across all 26 scenes; native HD Scene 1 included.
          - Source: private manimVideos commit e471557830b2f8e47495133508d78e4c17545699.
          - Rendered on public Playground Actions run 41740923487, successfully assembled and checked with the recovery workflow.
          - Verified exact frames, frame rate and full FFmpeg decode; SHA256SUMS attached.
          - SILENT PREVIEW. No final narration, soundtrack, timed SRT or mastered audio.
          EOF
          release_ok=false
          for label in PRIVATE_REPO_TOKEN GH_TOKEN GH_RELEASE_TOKEN GITHUB_TOKEN; do
            case "$label" in
              PRIVATE_REPO_TOKEN) token="$PRIVATE_PAT";;
              GH_TOKEN) token="$ALT_PAT";;
              GH_RELEASE_TOKEN) token="$RELEASE_PAT";;
              GITHUB_TOKEN) token="$WORKFLOW_TOKEN";;
            esac
            [ -n "$token" ] || continue
            echo "Attempt release with $label"
            if GH_TOKEN="$token" gh release view "$RELEASE_TAG" --repo Persie0/Playground >/dev/null 2>&1; then
              if GH_TOKEN="$token" gh release upload "$RELEASE_TAG" \
                output/Euclids_Orchard_19m12s_1080p30_SILENT.mp4 \
                output/RENDER_INFO.txt output/SHA256SUMS.txt \
                --repo Persie0/Playground --clobber &&
                GH_TOKEN="$token" gh release edit "$RELEASE_TAG" --repo Persie0/Playground \
                  --notes-file /tmp/orchard-release.md --prerelease; then
                release_ok=true; break
              fi
            else
              if GH_TOKEN="$token" gh release create "$RELEASE_TAG" \
                output/Euclids_Orchard_19m12s_1080p30_SILENT.mp4 \
                output/RENDER_INFO.txt output/SHA256SUMS.txt \
                --repo Persie0/Playground --target "$GITHUB_SHA" \
                --title "Euclid's Orchard — full native 1080p 19:12 silent export" \
                --notes-file /tmp/orchard-release.md --prerelease; then
                release_ok=true; break
              fi
            fi
          done
          if [ "$release_ok" != true ]; then
            echo "::error::Film artifact uploaded, but publishing the prerelease failed."
            exit 1
          fi
          GH_TOKEN="$token" gh release view "$RELEASE_TAG" --repo Persie0/Playground --json url,assets
