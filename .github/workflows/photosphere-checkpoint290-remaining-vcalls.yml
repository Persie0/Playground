name: Photosphere checkpoint290 original 32 indirect calls and Rust camera chain
on:
  push:
    branches: [research/photosphere-checkpoint290-remaining-vcalls]
    paths:
      - '.github/workflows/photosphere-checkpoint290-remaining-vcalls.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint290-remaining-vcalls
  cancel-in-progress: false
jobs:
  original-receiver-and-rust-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact decompile research revision, not private Actions
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: da19fa3ba65213903f3f1dd094ab2028616a5ebf
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install source decoder and verify pinned decompile commit
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "da19fa3ba65213903f3f1dd094ab2028616a5ebf"
          python3 -m pip install --break-system-packages --quiet capstone
      - name: Fetch hash-pinned original Google Camera APK and ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Inspect all 32 remaining +0x70 original ARM64 receiver windows
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint290/scan_original_remaining_virtual_calls.py original.so --output checkpoint290-original-receiver-windows.json | tee checkpoint290-original-calls.log
          grep -q '^CHECKPOINT290_ORIGINAL_32_SLOT_LOAD_WINDOWS_PASSED 32$' checkpoint290-original-calls.log
      - name: Checkout exact PhotosphereCleanroom code (no app Actions)
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: fe5fca5718f320fa46d376c9bb97e7e52611474b
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Validate only pinned PhotosphereCleanroom revision
        working-directory: app
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fe5fca5718f320fa46d376c9bb97e7e52611474b"
          cargo fmt --all -- --check
          cargo test --lib checkpoint290_original_linear_camera_clone_resize_width_order_and_isolation -- --nocapture
          cargo test --lib
      - name: Archive original textual analysis, never APK/ELF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint290-original-receiver-and-rust-validation
          path: |
            checkpoint290-original-receiver-windows.json
            checkpoint290-original-calls.log
          if-no-files-found: warn
          retention-days: 14
