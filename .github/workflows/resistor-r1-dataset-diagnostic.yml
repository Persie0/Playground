name: Resistor r1 dataset diagnostic

on:
  push:
    branches: [agent/resistor-yolox-runner]
    paths:
      - .github/workflows/resistor-r1-dataset-diagnostic.yml
      - .github/triggers/resistor-r1-dataset-diagnostic.txt

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and summarize three r1 COCO datasets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import shutil
          import urllib.request
          import zipfile
          from collections import Counter, defaultdict
          from pathlib import Path

          base = 'https://github.com/Persie0/resistor_model/releases/download/r1'
          assets = (
              ('rres.v4i.coco.zip', '24b46548700156a5f553197193c153b42381472b3eddfa2f9cf19d849fc84d4a'),
              ('resistor.value.training.v8i.coco.zip', 'dbf4b665d361a98d01024481970fc74be27d71e795b95dac5936af94dd4cf958'),
              ('Deteksi.Nilai.Resistor.v1i.coco.zip', 'ee8db6b64e59dfe47050b313f215051d3da5932dbe5e1f7b7d94e6495449dc92'),
          )
          work = Path('/tmp/resistor-r1-diagnostic')
          shutil.rmtree(work, ignore_errors=True)
          work.mkdir(parents=True)

          for asset, expected_sha in assets:
              archive = work / asset
              req = urllib.request.Request(f'{base}/{asset}', headers={'User-Agent': 'resistor-r1-diagnostic'})
              with urllib.request.urlopen(req) as src, archive.open('wb') as dst:
                  shutil.copyfileobj(src, dst)
              actual = hashlib.sha256(archive.read_bytes()).hexdigest()
              if actual != expected_sha:
                  raise SystemExit(f'SHA mismatch for {asset}: {actual}')

              annotation_counts = Counter()
              image_counts = Counter()
              invalid_reasons = Counter()
              invalid_categories = Counter()
              invalid_images = set()
              max_right = (0.0, None)
              max_bottom = (0.0, None)
              examples = []

              with zipfile.ZipFile(archive) as zf:
                  json_names = sorted(name for name in zf.namelist() if name.endswith('_annotations.coco.json'))
                  print('ASSET', asset, 'annotation_files', json_names)
                  for name in json_names:
                      payload = json.loads(zf.read(name))
                      categories = {int(c['id']): str(c['name']) for c in payload.get('categories', [])}
                      images = {int(i['id']): i for i in payload.get('images', [])}
                      anns_by_image = defaultdict(set)
                      for ann in payload.get('annotations', []):
                          image_id = int(ann['image_id'])
                          image = images[image_id]
                          label = categories.get(int(ann['category_id']), f"<id:{ann['category_id']}>")
                          annotation_counts[label] += 1
                          anns_by_image[image_id].add(label)
                          bbox = ann.get('bbox')
                          reasons = []
                          right_over = bottom_over = 0.0
                          if not isinstance(bbox, list) or len(bbox) != 4:
                              reasons.append('malformed')
                          else:
                              x, y, w, h = map(float, bbox)
                              iw, ih = float(image['width']), float(image['height'])
                              if x < 0: reasons.append('x_negative')
                              if y < 0: reasons.append('y_negative')
                              if w <= 0: reasons.append('width_nonpositive')
                              if h <= 0: reasons.append('height_nonpositive')
                              right_over = max(0.0, x + w - iw)
                              bottom_over = max(0.0, y + h - ih)
                              if right_over > 0: reasons.append('right_overflow')
                              if bottom_over > 0: reasons.append('bottom_overflow')
                          if reasons:
                              key = (asset, name, image_id)
                              invalid_images.add(key)
                              invalid_categories[label] += 1
                              for reason in reasons:
                                  invalid_reasons[reason] += 1
                              detail = {
                                  'asset': asset,
                                  'split': name,
                                  'image_id': image_id,
                                  'file_name': image.get('file_name'),
                                  'label': label,
                                  'image_size': [image.get('width'), image.get('height')],
                                  'bbox': bbox,
                                  'right_overflow_px': round(right_over, 6),
                                  'bottom_overflow_px': round(bottom_over, 6),
                                  'right_overflow_fraction': round(right_over / float(image['width']), 8) if image.get('width') else None,
                                  'bottom_overflow_fraction': round(bottom_over / float(image['height']), 8) if image.get('height') else None,
                              }
                              if right_over > max_right[0]: max_right = (right_over, detail)
                              if bottom_over > max_bottom[0]: max_bottom = (bottom_over, detail)
                              if len(examples) < 20:
                                  examples.append(detail)
                      for labels in anns_by_image.values():
                          for label in labels:
                              image_counts[label] += 1
                      print('SPLIT', asset, name, 'categories', sorted(categories.values()))

              print('ASSET_ANN_COUNTS', asset, json.dumps(dict(sorted(annotation_counts.items())), sort_keys=True))
              print('ASSET_IMAGE_COUNTS', asset, json.dumps(dict(sorted(image_counts.items())), sort_keys=True))
              print('BBOX_INVALID_REASONS', asset, json.dumps(dict(sorted(invalid_reasons.items())), sort_keys=True))
              print('BBOX_INVALID_CATEGORIES', asset, json.dumps(dict(sorted(invalid_categories.items())), sort_keys=True))
              print('BBOX_INVALID_IMAGE_COUNT', asset, len(invalid_images))
              print('BBOX_MAX_RIGHT_OVERFLOW', asset, json.dumps(max_right[1], sort_keys=True) if max_right[1] else 'null')
              print('BBOX_MAX_BOTTOM_OVERFLOW', asset, json.dumps(max_bottom[1], sort_keys=True) if max_bottom[1] else 'null')
              for example in examples:
                  print('BBOX_INVALID_EXAMPLE', json.dumps(example, sort_keys=True))
          PY
