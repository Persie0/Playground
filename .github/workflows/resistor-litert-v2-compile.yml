name: Build Android Google Play services LiteRT migration
# Public runner validates the latest scanner branch; no private repo Actions minutes.
on:
  push:
    paths:
      - .github/workflows/resistor-litert-v2-compile.yml
  workflow_dispatch:
permissions:
  contents: read

jobs:
  compile-and-unit-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout private scanner source on public-repo runner minutes
        uses: actions/checkout@v4
        with:
          repository: Persie0/resistor-scanner-android
          ref: feat/play-services-litert-mobile1d
          path: scanner
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android compile SDK 37
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          if ! "$SDKMANAGER" --channel=3 "platforms;android-37" "build-tools;36.0.0" >/dev/null; then
            echo "::warning::API 37 platform unavailable on hosted SDK; compiling against API 36 in CI checkout only"
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null
            sed -i 's/compileSdk = 37/compileSdk = 36/; s/targetSdk = 37/targetSdk = 36/' scanner/app/build.gradle.kts
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build real encrypted LiteRT APK, instrumented-test APK, and run unit tests
        working-directory: scanner
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest
