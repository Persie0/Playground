name: Drift Blast Godot 4.7.2 validation (public runner)

on:
  push:
    paths:
      - ".github/workflows/driftblast-godot-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out private game source with permitted token
        uses: actions/checkout@v7.0.1
        with:
          repository: Persie0/DriftBlast
          ref: a42a08f2b92bb56d897e87a4cefdf7b565cdfd98
          path: game
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Download verified official Godot executable
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse Godot project
        run: |
          set -euo pipefail
          timeout 120s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path game --editor --quit 2>&1 | tee import.log
          ! grep -E "SCRIPT ERROR:|Parse Error:" import.log
      - name: Run rule regression tests
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/test_board.gd 2>&1 | tee tests.log
          ! grep -E "SCRIPT ERROR:|Parse Error:" tests.log
      - name: First-run gameplay integration tests
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/test_game.gd 2>&1 | tee flow.log
          ! grep -E "SCRIPT ERROR:|Parse Error:" flow.log
      - name: Smoke-test main scene
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path game --quit-after 15 2>&1 | tee smoke.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|Invalid call" smoke.log
