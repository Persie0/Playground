name: Drift Blast UI and Godot 4.7.2 validation (public runner)

on:
  push:
    paths:
      - ".github/workflows/driftblast-godot-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out private game source with permitted token
        uses: actions/checkout@v7.0.1
        with:
          repository: Persie0/DriftBlast
          ref: ac2c670efe3d2e193686a10f4e919355df44a1a7
          path: game
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Download verified official Godot executable
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse Godot project
        run: |
          set -euo pipefail
          timeout 120s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path game --editor --quit 2>&1 | tee import.log
          ! grep -E "SCRIPT ERROR:|Parse Error:" import.log
      - name: Run rule regression tests
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/test_board.gd 2>&1 | tee tests.log
          ! grep -E "SCRIPT ERROR:|Parse Error:" tests.log
      - name: Replay 600 certified puzzle solutions
        run: |
          set -euo pipefail
          timeout 120s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/test_level_factory.gd 2>&1 | tee certificates.log
          ! grep -E "SCRIPT ERROR:|Parse Error:" certificates.log
      - name: First-run gameplay integration tests
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script res://tests/test_game.gd 2>&1 | tee flow.log
          ! grep -E "SCRIPT ERROR:|Parse Error:" flow.log
      - name: Capture Godot UI in software-rendered virtual display
        id: visual-capture
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p game/ux_screens
          if ! command -v xvfb-run >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y xvfb; fi
          cat > game/visual_capture.gd <<'GDSCRIPT'
          extends SceneTree
          var game: Control
          
          func _initialize() -> void:
          	call_deferred("_capture_all")
          
          func _capture_all() -> void:
          	var scene: PackedScene = load("res://scenes/main.tscn")
          	game = scene.instantiate()
          	root.add_child(game)
          	await process_frame
          	game.reduced_motion = true
          	game.level = 1
          	game.unlocked_level = 1
          	game.rewarded_levels.clear()
          	game.first_move_completed = false
          	game.score = 0
          	game.best_score = 0
          	game.coins = 0
          	game._start_level()
          	DirAccess.make_dir_recursive_absolute(ProjectSettings.globalize_path("res://ux_screens"))
          	await _capture("intro-420", Vector2i(420, 840), 0, Vector2.ZERO)
          	await _capture("guided-420", Vector2i(420, 840), 1, Vector2.ZERO)
          	game.first_move_completed = true
          	game.coins = 100
          	await _capture("play-420", Vector2i(420, 840), 1, Vector2.ZERO)
          	await _capture("pause-420", Vector2i(420, 840), 4, Vector2.ZERO)
          	await _capture("settings-420", Vector2i(420, 840), 5, Vector2.ZERO)
          	await _capture("play-320-insets50", Vector2i(320, 480), 1, Vector2(50, 50))
          	await _capture("play-320-insets96", Vector2i(320, 480), 1, Vector2(96, 96))
          	game.precision_aim = true
          	game.selected = 0
          	await _capture("aim-320-insets96", Vector2i(320, 480), 1, Vector2(96, 96))
          	game.precision_aim = false
          	game.selected = -1
          	await _capture("settings-320-insets50", Vector2i(320, 480), 5, Vector2(50, 50))
          	await _capture("settings-320-insets96", Vector2i(320, 480), 5, Vector2(96, 96))
          	print("Captured ten Godot UI screenshots")
          	quit()
          
          func _capture(name: String, resolution: Vector2i, screen_id: int, insets: Vector2) -> void:
          	root.content_scale_size = resolution
          	root.size = resolution
          	game.size = Vector2(resolution)
          	game.safe_insets_override = insets
          	game.screen = screen_id
          	game._layout()
          	game.queue_redraw()
          	await process_frame
          	await RenderingServer.frame_post_draw
          	var image: Image = root.get_texture().get_image()
          	if image.is_empty():
          		push_error("Empty capture " + name)
          		quit(1)
          		return
          	var error: Error = image.save_png("res://ux_screens/%s.png" % name)
          	if error != OK:
          		push_error("Capture write failed: " + name)
          		quit(1)
          		return
          	print("Captured %s at %s" % [name, str(image.get_size())])
          GDSCRIPT
          timeout 90s xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./Godot_v4.7.2-stable_linux.x86_64 --path game --script res://visual_capture.gd 2>&1 | tee visual.log
          test -s game/ux_screens/intro-420.png
          test -s game/ux_screens/settings-320-insets96.png
      - name: Upload visual review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driftblast-visual-ux
          path: game/ux_screens/*.png
          if-no-files-found: warn
          retention-days: 7
      - name: Smoke-test main scene
        run: |
          set -euo pipefail
          timeout 90s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path game --quit-after 15 2>&1 | tee smoke.log
          ! grep -E "SCRIPT ERROR:|Parse Error:|Invalid call" smoke.log
