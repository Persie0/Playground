name: Photosphere checkpoint254 original two-image matcher one-shot
on:
  push:
    branches: [ci/photosphere-checkpoint254-distinct-native]
    paths: ['.github/workflows/photosphere-checkpoint254-distinct-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint254-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-distinct-image-matcher:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'ci: run photosphere checkpoint254 once'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: e62c9a37129dcfc83c3c2b4dc676a0320f341594
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify exact native research revision
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e62c9a37129dcfc83c3c2b4dc676a0320f341594"
          python3 -m py_compile research/photosphere/checkpoint254/native_distinct_image_matcher.py research/photosphere/checkpoint254/validate_distinct_matcher.py
          python3 -m pip install --break-system-packages --quiet -r research/photosphere/checkpoint218/requirements.txt
      - name: Retrieve exact original APK and ARM64 lightcycle
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Execute original two independent native feature sources and matcher
        run: |
          set -euo pipefail
          if ! python3 research/photosphere/checkpoint254/native_distinct_image_matcher.py > checkpoint254-original.log 2> checkpoint254-original.stderr; then
            tail -n 100 checkpoint254-original.stderr || true
            exit 1
          fi
          python3 research/photosphere/checkpoint254/validate_distinct_matcher.py checkpoint254-original.log | tee checkpoint254-validation.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=Path('checkpoint254-original.log').read_text()
          d=json.loads(s.split('CHECKPOINT254_NATIVE_ADDIMAGE_FEATURE_BEGIN\n')[1].split('\nCHECKPOINT254_NATIVE_ADDIMAGE_FEATURE_END')[0])
          Path('checkpoint254-original.json').write_text(json.dumps(d,indent=2)+'\n')
          for c in d['cases']:
              print('CHECKPOINT254_NATIVE_MATCH_COUNTS', c['name'], [(m['source'],m['target'],m['count']) for m in c['native_distinct_frame_matches']])
          PY
      - name: Archive real native evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint254-original-distinct-matcher
          path: |
            checkpoint254-original.log
            checkpoint254-original.stderr
            checkpoint254-original.json
            checkpoint254-validation.txt
          retention-days: 14
          if-no-files-found: warn
