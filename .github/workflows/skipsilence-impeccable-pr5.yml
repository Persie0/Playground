name: SkipSilencePlayer Impeccable PR5 validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/skipsilence-impeccable-pr5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          repository: Persie0/SkipSilencePlayer
          ref: feature/impeccable-followup-ux-20261120
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: source
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Android tests and debug build
        working-directory: source/kotlin-android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload Android APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SkipSilencePlayer-PR5-debug
          path: source/kotlin-android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          repository: Persie0/SkipSilencePlayer
          ref: feature/impeccable-followup-ux-20261120
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: source
      - name: Build iOS simulator
        working-directory: source/swift-ios
        run: |
          set -o pipefail
          xcodebuild \
            -project SkipSilencePlayer.xcodeproj \
            -scheme SkipSilencePlayer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derived \
            CODE_SIGNING_ALLOWED=NO \
            build

# Final validation of SkipSilencePlayer 61b731651f2ad9441d71081b34b3c0261c88753f
