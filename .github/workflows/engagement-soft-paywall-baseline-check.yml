name: Verify engagement soft-paywall baselines

on:
  push:
    paths:
      - '.github/workflows/engagement-soft-paywall-baseline-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Baseline ${{ matrix.repo }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: noise_remover
            ref: master
          - repo: norwegian_yoyillo
            ref: main
    steps:
      - name: Validate private repository token
        env:
          REPO_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$REPO_TOKEN"

      - name: Checkout base branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/${{ matrix.repo }}
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: ${{ matrix.ref }}
          fetch-depth: 1
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: app
        run: flutter test
