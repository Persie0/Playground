name: Harden engagement soft-paywalls

on:
  push:
    paths:
      - '.github/workflows/engagement-soft-paywall-baseline-check.yml'
  workflow_dispatch:

permissions:
  contents: read

# Public Playground only; private-repo Actions stay unused.
jobs:
  harden:
    name: Harden ${{ matrix.repo }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: recorder_noise_remove
            source: lib/services/ad_service.dart
            extras: ''
          - repo: fake_gps_detector
            source: lib/start_screen.dart
            extras: ''
          - repo: root_detection_app
            source: lib/adbanner.dart
            extras: ''
          - repo: face_scanner
            source: lib/screens/show2d.dart
            extras: ''
          - repo: vitamindtracker
            source: lib/providers/vitd_provider_impl.dart
            extras: ''
          - repo: surebets_calculator
            source: lib/services/bet_history_service.dart
            extras: ''
          - repo: image_enhancer
            source: lib/services/image_processing_service.dart
            extras: ''
          - repo: hanzi_hero
            source: lib/screens/flashcards/flashcards_screen.dart
            extras: ''
          - repo: Memory_Palace_Builder
            source: lib/pages/memory_palaces/add_entry.dart
            extras: ''
          - repo: noise_remover
            source: lib/services/processing_lock_service.dart
            extras: 'test/bulk_report_pro_refresh_regression_test.dart test/localization_integrity_test.dart'
          - repo: norwegian_yoyillo
            source: lib/screens/flashcards/flashcards_screen.dart
            extras: 'lib/utils/norwegian_gap_utils.dart test/utils/pinyin_utils_test.dart test/providers/word_provider_test.dart'
    steps:
      - name: Validate private repository token
        env:
          REPO_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$REPO_TOKEN"

      - name: Checkout public control repo
        uses: actions/checkout@v5
        with:
          path: control
          persist-credentials: false

      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/${{ matrix.repo }}
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: feature/engagement-soft-paywall
          fetch-depth: 2
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Apply verified fixes
        run: python3 control/scripts/harden_engagement_soft_paywalls.py '${{ matrix.repo }}' app

      - name: GREEN - Pro guard regression
        working-directory: app
        run: flutter test test/engagement_soft_paywall_pro_guard_test.dart

      - name: Full Flutter test suite
        working-directory: app
        run: flutter test

      - name: Commit and push verified changes
        working-directory: app
        env:
          REPO_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          TARGET_REPO: ${{ matrix.repo }}
          SOURCE_PATH: ${{ matrix.source }}
          EXTRA_FILES: ${{ matrix.extras }}
        run: |
          git config user.name 'Persie0'
          git config user.email '76871553+Persie0@users.noreply.github.com'
          git add "$SOURCE_PATH" test/engagement_soft_paywall_pro_guard_test.dart
          if [ -n "$EXTRA_FILES" ]; then
            # shellcheck disable=SC2086
            git add $EXTRA_FILES
          fi
          git diff --cached --check
          git commit -m 'fix: suppress soft paywall for Pro users'
          git remote set-url origin "https://x-access-token:${REPO_TOKEN}@github.com/Persie0/${TARGET_REPO}.git"
          git push origin HEAD:feature/engagement-soft-paywall
