name: Verify engagement soft-paywall Pro guards

on:
  push:
    paths:
      - '.github/workflows/engagement-soft-paywall-baseline-check.yml'
  workflow_dispatch:

permissions:
  contents: read

# Public Playground only; private-repo Actions stay unused.
jobs:
  pro-guard:
    name: Pro guard ${{ matrix.repo }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        repo:
          - recorder_noise_remove
          - fake_gps_detector
          - root_detection_app
          - face_scanner
          - vitamindtracker
          - surebets_calculator
          - image_enhancer
          - hanzi_hero
          - Memory_Palace_Builder
          - noise_remover
          - norwegian_yoyillo
    steps:
      - name: Validate private repository token
        env:
          REPO_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$REPO_TOKEN"

      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/${{ matrix.repo }}
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: feature/engagement-soft-paywall
          fetch-depth: 1
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Run Pro guard regression test
        working-directory: app
        run: flutter test test/engagement_soft_paywall_pro_guard_test.dart
