name: PhotoSphere checkpoint262 original native controlled sampler Rust parity (one shot)
on:
  push:
    branches: [ci/photosphere-checkpoint262-controlled-rand]
    paths: ['.github/workflows/photosphere-checkpoint262-rust.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint262-rust-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-controlled-sampler-rust:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'ci: run photosphere checkpoint262 rust once'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 1951c2bd60d438582039b6aebbed0cb646a99a72
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Verify exact executable source revision
        run: test "$(git rev-parse HEAD)" = "1951c2bd60d438582039b6aebbed0cb646a99a72"
      - name: Verify original GCam native two-source sampler selected pair from real 25 rays
        run: cargo test --locked checkpoint262_original_arm64_sampler_selects_real_ray_pair_for_test_draws -- --nocapture
      - name: Run all Rust regression suites
        run: cargo test --locked
