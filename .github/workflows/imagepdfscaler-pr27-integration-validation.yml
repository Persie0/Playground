name: ImagePdfScaler PR27 integration validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imagepdfscaler-pr27-integration-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check private repository access token
        env:
          APP_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$APP_TOKEN"
      - name: Checkout ImagePdfScaler integration PR
        uses: actions/checkout@v4
        with:
          repository: Persie0/ImagePdfScaler
          ref: b5739c41b98ada09619eb5f5313685880e8340f3
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze source strictly
        working-directory: app
        run: flutter analyze --no-pub --fatal-infos
      - name: Run focused EULA and home tests
        working-directory: app
        run: flutter test --no-pub --reporter expanded test/eula_gate_test.dart test/project_home_page_test.dart test/widget_test.dart
      - name: Run all Flutter tests
        working-directory: app
        run: flutter test --no-pub
