name: ImagePdfScaler text grey box regression
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imagepdfscaler-text-grey-box-fix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check private checkout token
        env:
          APP_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$APP_TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: Persie0/ImagePdfScaler
          ref: fix/text-grey-box-container-clipping-20261014
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Static analysis
        working-directory: app
        run: flutter analyze --no-pub
      - name: Text rendering and persistence regression tests
        working-directory: app
        run: flutter test --no-pub --reporter expanded test/paper_canvas_interaction_test.dart test/text_editor_units_test.dart test/project_storage_service_test.dart
      - name: Full Flutter test suite
        working-directory: app
        run: flutter test --no-pub
      - name: Install required Android NDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "ndk;29.0.13599879"
      - name: Android debug APK
        working-directory: app
        run: flutter build apk --debug --no-pub
