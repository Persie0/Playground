name: FocusMove Step 16 Android revalidation
# Verify latest fix for filesystem teardown and direct camera-off widget tests.
on:
  push:
    paths:
      - '.github/workflows/pomodoroexercise-pose-lab-step16-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private feature branch without source publication
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Missing checkout token'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/16-debug-pose-lab https://github.com/Persie0/pomodoroexercise.git source
      - name: Analyze test and compile Android debug/release
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test --reporter expanded
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk
