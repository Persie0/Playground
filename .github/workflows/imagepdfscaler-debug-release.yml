name: ImagePdfScaler private debug release
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Private app branch, tag, or SHA
        required: true
        default: main
        type: string
permissions:
  contents: read
env:
  APP_REPOSITORY: Persie0/ImagePdfScaler
  APP_REF: ${{ inputs.ref || 'main' }}
jobs:
  build-and-release-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate private/release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$RELEASE_TOKEN"
      - name: Checkout private app revision
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-app
      - name: Checkout private CI harness
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: main
          token: ${{ secrets.RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-ci
          sparse-checkout: .github/playground
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Run private debug build harness
        run: bash private-ci/.github/playground/debug-build.sh private-app
      - name: Prepare release asset
        id: meta
        run: |
          SHA="$(git -C private-app rev-parse HEAD)"
          SHORT_SHA="${SHA:0:7}"
          TAG="debug-${SHORT_SHA}"
          APK_NAME="ImagePdfScaler-debug-${SHORT_SHA}.apk"
          cp private-app/build/app/outputs/flutter-apk/app-debug.apk "$APK_NAME"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: imagepdfscaler-debug-${{ steps.meta.outputs.short_sha }}
          path: ${{ steps.meta.outputs.apk_name }}
          if-no-files-found: error
      - name: Create/update private prerelease
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          SHA: ${{ steps.meta.outputs.sha }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
        run: |
          if gh release view "$TAG" --repo "$APP_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" --repo "$APP_REPOSITORY" --clobber
          else
            gh release create "$TAG" --repo "$APP_REPOSITORY" --target "$SHA" --title "ImagePdfScaler Debug ${SHORT_SHA}" --notes "Private validation passed for ${SHA}." --prerelease "$APK_NAME"
          fi
