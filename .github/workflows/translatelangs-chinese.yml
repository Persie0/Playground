name: Continue translateLangs Languages

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch in Persie0/translateLangs to continue translating
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: translatelangs-languages-${{ inputs.branch || 'main' }}
  cancel-in-progress: false

env:
  TRANSLATE_REPOSITORY: Persie0/translateLangs
  TRANSLATE_BRANCH: ${{ inputs.branch || 'main' }}

jobs:
  continue-translations:
    runs-on: ubuntu-latest
    timeout-minutes: 390

    steps:
      - name: Validate private repository token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if [[ -z "$PRIVATE_TOKEN" ]]; then
            echo "::error::Set PRIVATE_REPO_TOKEN or GH_TOKEN with Contents: write access to Persie0/translateLangs."
            exit 2
          fi

      - name: Checkout translateLangs
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TRANSLATE_REPOSITORY }}
          ref: ${{ env.TRANSLATE_BRANCH }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: translateLangs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: translateLangs/translate_notes.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai google-genai

      - name: Configure Git
        working-directory: translateLangs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Continue all translations in languages/
        working-directory: translateLangs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python translate_notes.py --lang all

      - name: Commit and push all remaining translation changes
        if: always()
        shell: bash
        run: |
          if [[ ! -d translateLangs/.git ]]; then
            echo "translateLangs checkout is unavailable; nothing to commit."
            exit 0
          fi

          cd translateLangs
          git add -A languages/

          if git diff --cached --quiet; then
            echo "No remaining translation changes to commit."
            exit 0
          fi

          git commit -m "chore: continue vocabulary translations [skip ci]"
          git pull --rebase origin "${TRANSLATE_BRANCH}"
          git push origin "HEAD:${TRANSLATE_BRANCH}"
