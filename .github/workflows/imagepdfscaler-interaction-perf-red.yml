name: ImagePdfScaler interaction perf verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imagepdfscaler-interaction-perf-red.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/ImagePdfScaler
          ref: feat/loading-resize-fast-import
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
