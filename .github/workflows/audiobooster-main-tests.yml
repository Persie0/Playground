name: AudioBooster main tests

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audiobooster-main-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Playground
        uses: actions/checkout@v4

      - name: Check out AudioBooster main
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: audiobooster

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: audiobooster
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: audiobooster
        run: flutter test

      - name: Analyze
        working-directory: audiobooster
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

