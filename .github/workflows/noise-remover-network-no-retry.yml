name: Noise Remover network no-retry validation
on:
  push:
    paths:
      - '.github/workflows/noise-remover-network-no-retry.yml'
permissions:
  contents: read
env:
  APP_REPOSITORY: Persie0/noise_remover
  APP_REF: fix/network-errors-no-report-no-retry
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout private app branch
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/main.dart lib/services/subscription_service.dart lib/utils/network_error.dart test/network_error_test.dart
      - name: Network regression tests
        run: flutter test test/network_error_test.dart test/purchase_restriction_reporting_test.dart
      - name: Strict analyze
        run: flutter analyze --fatal-infos
