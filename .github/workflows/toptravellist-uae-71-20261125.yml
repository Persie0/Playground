name: TopTravelList UAE validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/toptravellist-uae-71-20261125.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: data/uae-worldwide-v2-2026
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          fetch-depth: 0
          path: repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and regenerate rankings
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python scripts/validate.py
          python scripts/check_city_benchmarks.py
          python scripts/check_sight_benchmarks.py
          python scripts/check_new_country_reviews.py --country AE
          python scripts/generate_rankings.py --country AE
          python scripts/generate_rankings.py --check
          python scripts/rank.py --kind cities --limit 60 > /tmp/world-cities.txt
          python scripts/rank.py --kind sights --limit 60 > /tmp/world-sights.txt
          python scripts/rank.py --kind sights --country AE --limit 20 > /tmp/uae-sights.txt
      - name: Check review coverage and scope
        working-directory: repo
        run: |
          python - <<'PY'
          import re, subprocess
          from decimal import Decimal
          from pathlib import Path
          import yaml
          root=Path('countries/AE')
          d=Path('methodology/reviews/AE')
          txt='\n'.join((d/p).read_text() for p in ['cities.md','sights.md'])
          ids=re.findall(r'^## ((?:city|sight)-ae-[a-z0-9-]+) — ',txt,re.M)
          assert len(ids)==len(set(ids))==71
          assert txt.count('**source-linked-unverified**')==45
          assert txt.count('**editorial-only**')==12
          assert txt.count('**unassessed**')==14
          dims=['impact','uniqueness','significance','experience','depth']
          weights=[30,25,20,15,10]
          high=0; unranked=0
          for k,n in [('cities',14),('sights',57)]:
              files=list((root/k).glob('*.yaml'))
              assert len(files)==n
              md=(root/f'{k}.md').read_text()
              assert md.count('https://www.google.com/maps/search/?api=1&query=')==2*n
              for f in files:
                  a=yaml.safe_load(f.read_text())
                  assert a['id'] in ids and a['location']['country_code']=='AE'
                  vals=[*(a['scores'][x] for x in dims),*a['scores']['categories'].values()]
                  assert all(v is None or 0<=v<10 for v in vals)
                  section=txt.split('## '+a['id']+' — ',1)[1].split('\n## ',1)[0]
                  assert f']({k}/{f.name})' in md
                  peers=re.findall(r'\]\(\.\./\.\./\.\./countries/([A-Z]{2}/(?:cities|sights)/[^)]+\.yaml)\)',section)
                  assert len(set(p for p in peers if not p.startswith('AE/')))==4
                  assert all((Path('countries')/p).is_file() for p in peers)
                  total=None
                  if any(a['scores'][x] is None for x in dims):
                      unranked+=1
                      assert '**unassessed**' in section and 'Overall: unranked.' in section
                  else:
                      total=sum(Decimal(str(a['scores'][x]))*w for x,w in zip(dims,weights))/10
                      assert f'Overall: {total:.2f}/100.' in section
                  if (total is not None and total>=90) or any(v is not None and v>=9.5 for v in vals):
                      high+=1
                      assert 'High-score challenge: Not applicable' not in section
          assert unranked==14 and high==7
          changes=subprocess.check_output(['git','diff','--name-only','a223d93b175c389fe30fbb80b964bc8dc658eb4c','HEAD'],text=True).splitlines()
          assert all(p=='README.md' or p.startswith(('countries/AE/','methodology/reviews/AE/')) for p in changes)
          print('PASS: coverage, scores, peer links, GPS links and preservation of earlier records.')
          print('WORLDWIDE:',len({f.parent.parent.name for f in Path('countries').glob('*/*/*.yaml')}),len(list(Path('countries').glob('*/cities/*.yaml'))),len(list(Path('countries').glob('*/sights/*.yaml'))))
          PY
      - name: Commit generated rankings
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name toptravellist-editorial-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md countries/AE/cities.md countries/AE/sights.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Generate UAE ranking pages and country directory'
            git push origin HEAD:refs/heads/data/uae-worldwide-v2-2026
          fi
