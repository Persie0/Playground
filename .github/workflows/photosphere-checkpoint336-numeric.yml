name: Photosphere checkpoint336 original triangle numeric oracle
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint336-numeric.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint336-numeric
  cancel-in-progress: false
jobs:
  original-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout pinned private research read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: e3a5b0c1e2e4c587fe330e74b826008384c20ed0
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify exact revision and install native analysis libraries
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e3a5b0c1e2e4c587fe330e74b826008384c20ed0"
          python3 -m pip install --quiet --break-system-packages capstone unicorn pyelftools
      - name: Acquire SHA-pinned original Google Camera ARM64 library
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Survey original triangle metric and numeric callee source
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint336/survey_original_triangle_metric.py original.so --output checkpoint336-metric-asm.json | tee checkpoint336-survey.log
          grep -q '^CHECKPOINT336_NUMERIC_SURVEY_PASS 4' checkpoint336-survey.log
      - name: Source-execute original numerical helper and whole triangle scorer
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint336/native_original_triangle_numeric.py original.so --output checkpoint336-original-numeric.json | tee checkpoint336-numeric-execution.log
          grep -q '^CHECKPOINT336_ORIGINAL_NUMERIC_PASS 17 14 14' checkpoint336-numeric-execution.log
      - name: Integrate original scorer, metric and graph candidate loop in one source execution
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint336/native_original_numeric_candidate_join.py original.so --output checkpoint336-original-integrated.json | tee checkpoint336-integrated.log
          grep -q '^CHECKPOINT336_ORIGINAL_INTEGRATED_PASS 18 12' checkpoint336-integrated.log
      - name: Upload nonproprietary numeric evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-checkpoint336-numeric-evidence
          path: |
            checkpoint336-metric-asm.json
            checkpoint336-survey.log
            checkpoint336-original-numeric.json
            checkpoint336-numeric-execution.log
            checkpoint336-original-integrated.json
            checkpoint336-integrated.log
          if-no-files-found: warn
          retention-days: 7
