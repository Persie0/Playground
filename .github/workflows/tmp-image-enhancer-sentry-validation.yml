name: Temporary Image Enhancer Sentry validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-image-enhancer-sentry-validation.yml'

permissions:
  contents: read

# Re-run after cleaning the existing settings_provider analyzer warning.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v5
        with:
          repository: Persie0/image_enhancer
          ref: optimize/r8-sentry-9-30
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: app
      - name: Checkout EULA assets
        uses: actions/checkout@v5
        with:
          repository: Persie0/Persie0.github.io
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: eula_repo
      - name: Install EULA assets
        run: |
          mkdir -p app/assets/eula/translations_eula app/assets/eula/static
          cp -rf eula_repo/translations_eula/. app/assets/eula/translations_eula/
          cp -rf eula_repo/static/. app/assets/eula/static/
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Policy tests
        working-directory: app
        run: python3 .github/scripts/tests/test_r8_keep_policy.py -v
      - name: Flutter analyze
        working-directory: app
        run: flutter analyze
      - name: Flutter tests
        working-directory: app
        run: flutter test
