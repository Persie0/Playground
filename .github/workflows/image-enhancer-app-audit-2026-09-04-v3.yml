name: Image Enhancer app audit 2026-09-04 v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/image-enhancer-app-audit-2026-09-04-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/image_enhancer
  TARGET_BRANCH: fix/app-audit-2026-09-04

jobs:
  audit-fix-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private Image Enhancer
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply audited fixes
        working-directory: app
        run: |
          set -euo pipefail
          git checkout -B "$TARGET_BRANCH"
          python3 ../.github/scripts/image_enhancer_app_audit_2026_09_04.py
          dart format lib/services/subscription_service.dart lib/model_selection_page.dart lib/adbanner.dart lib/super_resolution_home_page.dart
          git diff --check
      - name: Analyze and test app
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Test super-resolution package
        working-directory: app/flutter_super_resolution
        run: |
          flutter pub get
          flutter test
      - name: Compile Android debug APK
        working-directory: app
        run: flutter build apk --debug
      - name: Commit and push verified fixes
        working-directory: app
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'Persie0'
          git config user.email '76871553+Persie0@users.noreply.github.com'
          git add lib
          git commit -m 'Harden app lifecycle, entitlements, and result IO'
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/Persie0/image_enhancer.git"
          git push --force origin HEAD:"$TARGET_BRANCH"
