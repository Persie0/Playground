name: Photo Sphere checkpoint 238 native six-level feature pyramid
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-native-feature-levels-238.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: research/checkpoint238-native-feature-pyramid-levels
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install Unicorn and ELF dependencies
        run: python3 -m pip install --break-system-packages --quiet -r research/photosphere/checkpoint218/requirements.txt
      - name: Retrieve and verify original GCam binary
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Execute original native six-slot feature pyramid
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint238/native_feature_multilevel_probe.py > checkpoint238.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=Path('checkpoint238.log').read_text()
          p=json.loads(s.split('CHECKPOINT238_JSON_BEGIN\n')[1].split('\nCHECKPOINT238_JSON_END')[0])
          assert len(p['cases'])==4
          for c in p['cases']:
              assert len(c['levels'])==c['requested_slots']
              assert c['native_filter_calls']==c['requested_slots']-1
              for level in c['levels']:
                  assert level['mismatches']==0,(c['name'],level['index'],level['mismatches'])
                  w,h=level['dimensions']
                  assert len(level['pixels'])==w*h
              print(c['name'],[l['dimensions'] for l in c['levels']])
          Path('checkpoint238.json').write_text(json.dumps(p,indent=2)+'\n')
          print('CHECKPOINT238_JSON_BEGIN')
          print(json.dumps(p,separators=(',',':')))
          print('CHECKPOINT238_JSON_END')
          print('PASS four complete native feature-pyramid pixel oracles')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint238-original-feature-pyramid-levels
          path: checkpoint238.json
          retention-days: 7
          if-no-files-found: warn
