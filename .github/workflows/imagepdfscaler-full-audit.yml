name: ImagePdfScaler full audit and rotation performance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imagepdfscaler-full-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-fix-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Checkout audit branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/ImagePdfScaler
          ref: audit/performance-rotation
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply audited fixes
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'{label}: anchor not found in {path}')
              p.write_text(s.replace(old, new, 1))

          # -----------------------------------------------------------------
          # Model: make quarter-turn rotation a layout transform, not a raster
          # rewrite. Keep source print dimensions available for PDF rendering.
          # -----------------------------------------------------------------
          replace_once(
              'lib/models/layout_models.dart',
              '''  double get rightMm => xMm + widthMm;
          double get bottomMm => yMm + heightMm;
          double get centerXMm => xMm + widthMm / 2;
          double get centerYMm => yMm + heightMm / 2;
          ''',
              '''  double get rightMm => xMm + widthMm;
          double get bottomMm => yMm + heightMm;
          double get centerXMm => xMm + widthMm / 2;
          double get centerYMm => yMm + heightMm / 2;

          int get normalizedQuarterTurns =>
              ((rotationQuarterTurns % 4) + 4) % 4;
          bool get rotationSwapsAxes => normalizedQuarterTurns.isOdd;

          /// Physical dimensions the unrotated source pixels occupy before the
          /// quarter-turn transform is applied by the editor/PDF renderer.
          double get sourceWidthMm => rotationSwapsAxes ? heightMm : widthMm;
          double get sourceHeightMm => rotationSwapsAxes ? widthMm : heightMm;
          ''',
              'placed-image rotation getters',
          )

          replace_once(
              'lib/models/layout_models.dart',
              '''}

          class SnapGuide {''',
              '''}

          PlacedImage? rotatePlacedImage90({
            required PlacedImage item,
            required PaperPreset paper,
          }) {
            final width = item.heightMm;
            final height = item.widthMm;
            if (!width.isFinite || !height.isFinite || width <= 0 || height <= 0) {
              return null;
            }
            if (width > paper.widthMm + 0.0001 ||
                height > paper.heightMm + 0.0001) {
              return null;
            }
            final maxX = math.max(0.0, paper.widthMm - width);
            final maxY = math.max(0.0, paper.heightMm - height);
            return item.copyWith(
              widthMm: width,
              heightMm: height,
              xMm: item.xMm.clamp(0.0, maxX).toDouble(),
              yMm: item.yMm.clamp(0.0, maxY).toDouble(),
              rotationQuarterTurns: (item.normalizedQuarterTurns + 1) % 4,
            );
          }

          class SnapGuide {''',
              'metadata rotate helper',
          )

          # -----------------------------------------------------------------
          # Canvas: render the low-res preview through RotatedBox. No decoding
          # or encoding occurs when the home-screen 90-degree button is tapped.
          # -----------------------------------------------------------------
          replace_once(
              'lib/widgets/paper_canvas.dart',
              '''            child: Image.memory(
                        item.previewBytes,
                        fit: BoxFit.fill,
                        filterQuality: FilterQuality.medium,
                        gaplessPlayback: true,
                        errorBuilder: (context, error, stackTrace) => DecoratedBox(
                          decoration: BoxDecoration(color: Theme.of(context).colorScheme.errorContainer),
                          child: Center(
                            child: Icon(
                              Icons.broken_image_outlined,
                              color: Theme.of(context).colorScheme.onErrorContainer,
                            ),
                          ),
                        ),
                      ),''',
              '''            child: RotatedBox(
                        quarterTurns: item.normalizedQuarterTurns,
                        child: Image.memory(
                          item.previewBytes,
                          fit: BoxFit.fill,
                          filterQuality: FilterQuality.medium,
                          gaplessPlayback: true,
                          errorBuilder: (context, error, stackTrace) => DecoratedBox(
                            decoration: BoxDecoration(
                              color: Theme.of(context).colorScheme.errorContainer,
                            ),
                            child: Center(
                              child: Icon(
                                Icons.broken_image_outlined,
                                color: Theme.of(context).colorScheme.onErrorContainer,
                              ),
                            ),
                          ),
                        ),
                      ),''',
              'paper canvas rotated preview',
          )

          # -----------------------------------------------------------------
          # Image processing: avoid an unnecessary full-frame copy on import,
          # use compact JPEG previews for opaque images, and materialize pending
          # quarter turns only when a destructive crop/fine-rotate edit needs it.
          # -----------------------------------------------------------------
          replace_once(
              'lib/services/image_processing_service.dart',
              '''  static Future<EditedImageResult?> rotate90(Uint8List fullBytes) async {
              final result = await compute(_rotate90, fullBytes);
              if (result == null) return null;
              return EditedImageResult(
                fullBytes: result['fullBytes']! as Uint8List,
                previewBytes: result['previewBytes']! as Uint8List,
                pixelWidth: result['width']! as int,
                pixelHeight: result['height']! as int,
              );
            }
          ''',
              '''  static Future<EditedImageResult?> materializeQuarterTurns({
              required Uint8List fullBytes,
              required int quarterTurns,
            }) async {
              final result = await compute(_materializeQuarterTurns, <String, Object>{
                'bytes': fullBytes,
                'quarterTurns': quarterTurns,
              });
              if (result == null) return null;
              return EditedImageResult(
                fullBytes: result['fullBytes']! as Uint8List,
                previewBytes: result['previewBytes']! as Uint8List,
                pixelWidth: result['width']! as int,
                pixelHeight: result['height']! as int,
              );
            }
          ''',
              'materialize quarter-turn API',
          )

          replace_once(
              'lib/services/image_processing_service.dart',
              '''  final oriented = img.bakeOrientation(decoded);
            final fullBytes = Uint8List.fromList(img.encodePng(oriented));''',
              '''  final orientation = decoded.exif.imageIfd.hasOrientation
                ? decoded.exif.imageIfd.orientation
                : null;
            // bakeOrientation clones the whole decoded pixel buffer even when the
            // image is already upright. Avoid that extra full-resolution copy.
            final oriented = orientation != null && orientation != 1
                ? img.bakeOrientation(decoded)
                : decoded;
            final fullBytes = Uint8List.fromList(img.encodePng(oriented));''',
              'import orientation fast path',
          )

          pattern = re.compile(
              r"Map<String, Object>\? _rotate90\(Uint8List fullBytes\) \{.*?\n\}\n\nUint8List\? _compressForPdf",
              re.S,
          )
          service = Path('lib/services/image_processing_service.dart')
          s = service.read_text()
          replacement = '''Map<String, Object>? _materializeQuarterTurns(Map<String, Object> args) {
            final fullBytes = args['bytes']! as Uint8List;
            final decoded = img.decodeImage(fullBytes);
            if (decoded == null || decoded.width <= 0 || decoded.height <= 0) {
              return null;
            }
            final rawTurns = args['quarterTurns']! as int;
            final turns = ((rawTurns % 4) + 4) % 4;
            final angle = switch (turns) {
              1 => 90.0,
              2 => 180.0,
              3 => -90.0,
              _ => 0.0,
            };
            final output = turns == 0
                ? decoded
                : img.copyRotate(decoded, angle: angle);
            return <String, Object>{
              'fullBytes': Uint8List.fromList(img.encodePng(output)),
              'previewBytes': _encodePreview(output),
              'width': output.width,
              'height': output.height,
            };
          }

          Uint8List? _compressForPdf'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('materialize worker: rotate90 block not found')
          service.write_text(s)

          replace_once(
              'lib/services/image_processing_service.dart',
              '''  return Uint8List.fromList(img.encodePng(preview));
            }''',
              '''  if (!preview.hasAlpha) {
              // Editor-only preview: lossy compression is intentional and keeps
              // photos much smaller while full-resolution PDF pixels are untouched.
              return Uint8List.fromList(img.encodeJpg(preview, quality: 82));
            }
            return Uint8List.fromList(img.encodePng(preview));
          }''',
              'compact opaque preview encoding',
          )

          # -----------------------------------------------------------------
          # Editor: 90-degree home rotation becomes a synchronous geometry-only
          # operation. Pending transforms are rasterized only when entering the
          # destructive crop/fine-rotation editor.
          # -----------------------------------------------------------------
          editor = Path('lib/screens/editor_page.dart')
          s = editor.read_text()

          crop_anchor = '''  Future<void> _cropImage(String id) async {'''
          materialize_method = '''  Future<PlacedImage?> _materializeRotationForEditing(
            PlacedImage item,
          ) async {
            final turns = item.normalizedQuarterTurns;
            if (turns == 0) return item;
            if (_processingImage) return null;

            setState(() => _processingImage = true);
            try {
              final result = await ImageProcessingService.materializeQuarterTurns(
                fullBytes: item.bytes,
                quarterTurns: turns,
              );
              if (!mounted) return null;
              if (result == null) {
                _showSnack('Could not prepare this rotated image for editing.');
                return null;
              }
              final index = _images.indexWhere((entry) => entry.id == item.id);
              if (index < 0) return null;
              final current = _images[index];
              final updated = current.copyWith(
                bytes: result.fullBytes,
                previewBytes: result.previewBytes,
                rotationQuarterTurns: 0,
              );
              setState(() => _images[index] = updated);
              return updated;
            } catch (error) {
              if (mounted) {
                _showSnack('Could not prepare rotated image: $error');
              }
              return null;
            } finally {
              if (mounted) setState(() => _processingImage = false);
            }
          }

          '''
          if crop_anchor not in s:
              raise SystemExit('crop method anchor not found')
          s = s.replace(crop_anchor, materialize_method + crop_anchor, 1)

          old = '''    final index = _images.indexWhere((item) => item.id == id);
              if (index < 0) return;
              final item = _images[index];
              if (!_selectedIds.contains(id)) {'''
          new = '''    final index = _images.indexWhere((item) => item.id == id);
              if (index < 0) return;
              var item = _images[index];
              if (!_selectedIds.contains(id)) {'''
          if old not in s:
              raise SystemExit('crop item mutability anchor not found')
          s = s.replace(old, new, 1)

          nav_anchor = '''    final edited = await Navigator.of(context).push<EditedImageResult>('''
          insert = '''    if (item.normalizedQuarterTurns != 0) {
              final materialized = await _materializeRotationForEditing(item);
              if (materialized == null || !mounted) return;
              item = materialized;
            }

          '''
          if nav_anchor not in s:
              raise SystemExit('crop navigation anchor not found')
          s = s.replace(nav_anchor, insert + nav_anchor, 1)

          pattern = re.compile(
              r"  Future<void> _rotateSelected\(\) async \{.*?\n  \}\n\n  void _duplicateSelected\(\) \{",
              re.S,
          )
          replacement = '''  void _rotateSelected() {
            final item = _primarySelectedImage;
            if (item == null || _selectedIds.length != 1) return;
            final rotated = rotatePlacedImage90(item: item, paper: _paper);
            if (rotated == null) {
              _showSnack('A 90° rotation would not fit on the current paper.');
              return;
            }
            final index = _images.indexWhere((entry) => entry.id == item.id);
            if (index < 0) return;
            setState(() {
              _images[index] = rotated;
              _snapGuides = const [];
            });
            if (_settings.hapticsEnabled) HapticFeedback.selectionClick();
          }

          void _duplicateSelected() {'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'rotateSelected block replacement count={n}')

          # Print/share should not surface plugin exceptions as uncaught futures.
          s = s.replace(
              '''  Future<void> _printPdf() async {
              final bytes = await _buildPdf();
              if (bytes == null) return;
              await Printing.layoutPdf(
                name: 'image-layout-${_safeFileName(_paper.name)}.pdf',
                onLayout: (_) async => bytes,
              );
            }

            Future<void> _sharePdf() async {
              final bytes = await _buildPdf();
              if (bytes == null) return;
              await Printing.sharePdf(
                bytes: bytes,
                filename: 'image-layout-${_safeFileName(_paper.name)}.pdf',
              );
            }''',
              '''  Future<void> _printPdf() async {
              try {
                final bytes = await _buildPdf();
                if (bytes == null) return;
                await Printing.layoutPdf(
                  name: 'image-layout-${_safeFileName(_paper.name)}.pdf',
                  onLayout: (_) async => bytes,
                );
              } catch (error) {
                if (mounted) _showSnack('Could not open the print dialog: $error');
              }
            }

            Future<void> _sharePdf() async {
              try {
                final bytes = await _buildPdf();
                if (bytes == null) return;
                await Printing.sharePdf(
                  bytes: bytes,
                  filename: 'image-layout-${_safeFileName(_paper.name)}.pdf',
                );
              } catch (error) {
                if (mounted) _showSnack('Could not share the PDF: $error');
              }
            }''',
              1,
          )
          editor.write_text(s)

          # -----------------------------------------------------------------
          # Project storage: v3 gives rotationQuarterTurns actual transform
          # semantics. v2 stored already-raster-rotated bytes, so ignore its
          # informational quarter-turn field to avoid double-rotating old saves.
          # Also make Save As non-destructive and harden project IDs.
          # -----------------------------------------------------------------
          storage = Path('lib/services/project_storage_service.dart')
          s = storage.read_text()
          s = s.replace(
              "  static const _projectsDirectoryName = 'image_pdf_scaler_projects';",
              "  static const _projectsDirectoryName = 'image_pdf_scaler_projects';\n  static const _currentProjectVersion = 3;",
              1,
          )
          s = s.replace(
              '''  static Future<File> _projectFile(String id) async {
              final directory = await _projectsDirectory();
              return File('${directory.path}/$id.json');
            }''',
              '''  static Future<File> _projectFile(String id) async {
              if (!_isValidProjectId(id)) {
                throw ArgumentError.value(id, 'id', 'Invalid project id');
              }
              final directory = await _projectsDirectory();
              return File('${directory.path}/$id.json');
            }''',
              1,
          )
          s = s.replace(
              '''    for (final summary in summaries) {
                if (summary.id.isEmpty) continue;
                if (await (await _projectFile(summary.id)).exists()) existing.add(summary);
              }''',
              '''    for (final summary in summaries) {
                if (!_isValidProjectId(summary.id)) continue;
                if (await (await _projectFile(summary.id)).exists()) {
                  existing.add(summary);
                }
              }''',
              1,
          )
          s = s.replace(
              '''    var id = existingId;
              if (id == null || !summaries.any((item) => item.id == id)) {
                final sameName = summaries.where(
                  (item) => item.name.toLowerCase() == cleanName.toLowerCase(),
                );
                id = sameName.isEmpty ? _newProjectId() : sameName.first.id;
              }''',
              '''    var id = existingId;
              if (id == null ||
                  !_isValidProjectId(id) ||
                  !summaries.any((item) => item.id == id)) {
                // Save As must never silently overwrite another same-name project.
                id = _newProjectId();
              }''',
              1,
          )
          s = s.replace("      'version': 2,", "      'version': _currentProjectVersion,", 1)
          s = s.replace(
              '''    final settingsJson = decoded['settings'];
              final imagesJson = decoded['images'];''',
              '''    final projectVersion = (decoded['version'] as num?)?.toInt() ?? 1;
              final settingsJson = decoded['settings'];
              final imagesJson = decoded['images'];''',
              1,
          )
          s = s.replace(
              '''          rotationQuarterTurns: (raw['rotationQuarterTurns'] as num?)?.toInt() ?? 0,''',
              '''          rotationQuarterTurns: projectVersion >= 3
                  ? _normalizeQuarterTurns(
                      (raw['rotationQuarterTurns'] as num?)?.toInt() ?? 0,
                    )
                  : 0,''',
              1,
          )
          s = s.replace(
              '''  static Future<SavedLayoutProject?> loadNamed(String id) async {
              final summaries = await listProjects();''',
              '''  static Future<SavedLayoutProject?> loadNamed(String id) async {
              if (!_isValidProjectId(id)) return null;
              final summaries = await listProjects();''',
              1,
          )
          s = s.replace(
              '''  static Future<void> deleteNamed(String id) async {
              final file = await _projectFile(id);''',
              '''  static Future<void> deleteNamed(String id) async {
              if (!_isValidProjectId(id)) return;
              final file = await _projectFile(id);''',
              1,
          )
          s = s.replace(
              "  static String _newProjectId() => 'p${DateTime.now().microsecondsSinceEpoch}';\n}",
              '''  static bool _isValidProjectId(String id) =>
              RegExp(r'^[A-Za-z0-9_-]{1,96}$').hasMatch(id);

            static int _normalizeQuarterTurns(int value) => ((value % 4) + 4) % 4;

            static String _newProjectId() =>
                'p${DateTime.now().microsecondsSinceEpoch}';
          }''',
              1,
          )
          storage.write_text(s)

          # Version bump.
          pubspec = Path('pubspec.yaml')
          s = pubspec.read_text()
          s, n = re.subn(r'^version:\s*0\.3\.1\+4\s*$', 'version: 0.3.2+5', s, flags=re.M)
          if n != 1:
              raise SystemExit('pubspec version anchor not found')
          pubspec.write_text(s)
          PY

          cat > lib/services/pdf_export_service.dart <<'DART'
          import 'dart:math' as math;
          import 'dart:typed_data';

          import 'package:pdf/pdf.dart';
          import 'package:pdf/widgets.dart' as pw;

          import '../models/layout_models.dart';
          import 'image_processing_service.dart';

          class PdfExportService {
            static Future<Uint8List> build({
              required PaperPreset paper,
              required List<PlacedImage> images,
              PdfImageQuality imageQuality = PdfImageQuality.original,
            }) async {
              final document = pw.Document();
              final pageFormat = PdfPageFormat(
                paper.widthMm * PdfPageFormat.mm,
                paper.heightMm * PdfPageFormat.mm,
                marginAll: 0,
              );

              // Duplicate layout items intentionally share their source bytes.
              // Cache prepared PDF pixels by source identity + source-orientation
              // print size so copies do not repeatedly decode/downsample.
              final preparedBytes = <String, Uint8List>{};
              final memoryImages = <String, pw.MemoryImage>{};
              final imageKeys = <String, String>{};
              for (final item in images) {
                final sourceWidthMm = item.sourceWidthMm;
                final sourceHeightMm = item.sourceHeightMm;
                final key = '${identityHashCode(item.bytes)}:'
                    '${sourceWidthMm.toStringAsFixed(4)}:'
                    '${sourceHeightMm.toStringAsFixed(4)}:'
                    '${imageQuality.name}';
                imageKeys[item.id] = key;
                if (preparedBytes.containsKey(key)) continue;
                final bytes = await ImageProcessingService.bytesForPdf(
                  fullBytes: item.bytes,
                  widthMm: sourceWidthMm,
                  heightMm: sourceHeightMm,
                  quality: imageQuality,
                );
                preparedBytes[key] = bytes;
                memoryImages[key] = pw.MemoryImage(bytes);
              }

              document.addPage(
                pw.Page(
                  pageFormat: pageFormat,
                  margin: pw.EdgeInsets.zero,
                  build: (_) => pw.SizedBox(
                    width: pageFormat.width,
                    height: pageFormat.height,
                    child: pw.Stack(
                      children: [
                        for (final item in images)
                          pw.Positioned(
                            left: item.xMm * PdfPageFormat.mm,
                            top: item.yMm * PdfPageFormat.mm,
                            child: _renderPlacedImage(
                              item,
                              memoryImages[imageKeys[item.id]!]!,
                            ),
                          ),
                      ],
                    ),
                  ),
                ),
              );

              return document.save();
            }

            static pw.Widget _renderPlacedImage(
              PlacedImage item,
              pw.MemoryImage image,
            ) {
              final source = pw.SizedBox(
                width: item.sourceWidthMm * PdfPageFormat.mm,
                height: item.sourceHeightMm * PdfPageFormat.mm,
                child: pw.Image(image, fit: pw.BoxFit.fill),
              );
              final turns = item.normalizedQuarterTurns;
              if (turns == 0) return source;

              // PDF's transform uses the mathematical Y-up rotation direction;
              // negate the angle to match Flutter RotatedBox clockwise turns.
              return pw.Transform.rotateBox(
                angle: -turns * math.pi / 2,
                unconstrained: true,
                child: source,
              );
            }
          }
          DART

          cat > lib/widgets/exact_size_dialog.dart <<'DART'
          import 'package:flutter/material.dart';

          import '../models/layout_models.dart';

          enum SizeDriver { width, height }

          typedef ExactSize = ({double value, SizeDriver driver});

          Future<ExactSize?> showExactSizeDialog(
            BuildContext context,
            PlacedImage item,
          ) {
            return showDialog<ExactSize>(
              context: context,
              builder: (_) => _ExactSizeDialog(item: item),
            );
          }

          class _ExactSizeDialog extends StatefulWidget {
            const _ExactSizeDialog({required this.item});

            final PlacedImage item;

            @override
            State<_ExactSizeDialog> createState() => _ExactSizeDialogState();
          }

          class _ExactSizeDialogState extends State<_ExactSizeDialog> {
            late final TextEditingController _controller;
            SizeDriver _driver = SizeDriver.width;
            String? _error;

            @override
            void initState() {
              super.initState();
              _controller = TextEditingController(
                text: widget.item.widthMm.toStringAsFixed(1),
              );
            }

            @override
            void dispose() {
              _controller.dispose();
              super.dispose();
            }

            void _cancel() {
              FocusManager.instance.primaryFocus?.unfocus();
              Navigator.of(context).pop();
            }

            void _submit() {
              final value = double.tryParse(
                _controller.text.trim().replaceAll(',', '.'),
              );
              if (value == null || !value.isFinite || value <= 0) {
                setState(() => _error = 'Enter a positive finite size.');
                return;
              }
              FocusManager.instance.primaryFocus?.unfocus();
              Navigator.of(context).pop((value: value, driver: _driver));
            }

            @override
            Widget build(BuildContext context) {
              return AlertDialog(
                title: const Text('Exact printed size'),
                content: Column(
                  mainAxisSize: MainAxisSize.min,
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    SegmentedButton<SizeDriver>(
                      segments: const [
                        ButtonSegment(
                          value: SizeDriver.width,
                          label: Text('Width'),
                        ),
                        ButtonSegment(
                          value: SizeDriver.height,
                          label: Text('Height'),
                        ),
                      ],
                      selected: {_driver},
                      onSelectionChanged: (selection) {
                        setState(() {
                          _driver = selection.first;
                          _error = null;
                          _controller.text = (_driver == SizeDriver.width
                                  ? widget.item.widthMm
                                  : widget.item.heightMm)
                              .toStringAsFixed(1);
                        });
                      },
                    ),
                    const SizedBox(height: 16),
                    TextField(
                      controller: _controller,
                      autofocus: true,
                      keyboardType: const TextInputType.numberWithOptions(
                        decimal: true,
                      ),
                      textInputAction: TextInputAction.done,
                      onSubmitted: (_) => _submit(),
                      decoration: InputDecoration(
                        labelText: _driver == SizeDriver.width ? 'Width' : 'Height',
                        suffixText: 'mm',
                        border: const OutlineInputBorder(),
                        errorText: _error,
                      ),
                    ),
                    const SizedBox(height: 12),
                    const Text(
                      'Aspect ratio stays locked. The other dimension is calculated automatically.',
                    ),
                  ],
                ),
                actions: [
                  TextButton(onPressed: _cancel, child: const Text('Cancel')),
                  FilledButton(onPressed: _submit, child: const Text('Apply')),
                ],
              );
            }
          }
          DART

          cat > lib/widgets/project_dialogs.dart <<'DART'
          import 'package:flutter/material.dart';

          import '../services/project_storage_service.dart';

          class SaveProjectRequest {
            const SaveProjectRequest({required this.name});

            final String name;
          }

          Future<SaveProjectRequest?> showSaveProjectDialog(
            BuildContext context, {
            String? currentName,
          }) {
            return showDialog<SaveProjectRequest>(
              context: context,
              builder: (_) => _SaveProjectDialog(currentName: currentName),
            );
          }

          class _SaveProjectDialog extends StatefulWidget {
            const _SaveProjectDialog({required this.currentName});

