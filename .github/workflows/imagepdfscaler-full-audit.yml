                        : ListView.separated(
                            shrinkWrap: true,
                            itemCount: mutableProjects.length,
                            separatorBuilder: (_, __) => const Divider(height: 1),
                            itemBuilder: (context, index) {
                              final project = mutableProjects[index];
                              return ListTile(
                                title: Text(
                                  project.name,
                                  maxLines: 1,
                                  overflow: TextOverflow.ellipsis,
                                ),
                                subtitle: Text(_formatModified(project.modifiedAt)),
                                onTap: () => Navigator.pop(
                                  dialogContext,
                                  project.id,
                                ),
                                trailing: IconButton(
                                  tooltip: 'Delete project',
                                  icon: const Icon(Icons.delete_outline),
                                  onPressed: () async {
                                    final confirmed = await showDialog<bool>(
                                      context: context,
                                      builder: (confirmContext) => AlertDialog(
                                        title: const Text('Delete project?'),
                                        content: Text(
                                          'Delete “${project.name}” from app data?',
                                        ),
                                        actions: [
                                          TextButton(
                                            onPressed: () => Navigator.pop(
                                              confirmContext,
                                              false,
                                            ),
                                            child: const Text('Cancel'),
                                          ),
                                          FilledButton(
                                            onPressed: () => Navigator.pop(
                                              confirmContext,
                                              true,
                                            ),
                                            child: const Text('Delete'),
                                          ),
                                        ],
                                      ),
                                    );
                                    if (confirmed != true || !context.mounted) {
                                      return;
                                    }
                                    try {
                                      await onDelete(project.id);
                                    } catch (error) {
                                      if (!context.mounted) return;
                                      ScaffoldMessenger.of(context).showSnackBar(
                                        SnackBar(
                                          content: Text(
                                            'Could not delete project: $error',
                                          ),
                                        ),
                                      );
                                      return;
                                    }
                                    if (!context.mounted) return;
                                    setState(
                                      () => mutableProjects.removeWhere(
                                        (item) => item.id == project.id,
                                      ),
                                    );
                                  },
                                ),
                              );
                            },
                          ),
                  ),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(dialogContext),
