          Future<String?> showLoadProjectDialog(
            BuildContext context, {
            required List<SavedProjectSummary> projects,
            required Future<void> Function(String id) onDelete,
          }) async {
            if (projects.isEmpty) return null;
            final mutableProjects = List<SavedProjectSummary>.from(projects);
            return showDialog<String>(
