          cat > AUDIT_2026-09.md <<'MD'
          # ImagePdfScaler audit — September 2026

          ## Fixed in this audit

          - **90° editor rotation was doing full-resolution decode → rotate → PNG encode on every tap.** It is now an O(1) layout/metadata operation. The preview uses `RotatedBox` and PDF output uses a PDF transform, so quarter turns do not resample or recompress the source image.
          - **Quarter-turn project compatibility.** Project format v2 stored bytes that were already physically rotated while also recording `rotationQuarterTurns`. Format v3 gives that field real transform semantics; v1/v2 loads intentionally ignore the old informational field to prevent double rotation.
          - **Crop/fine-rotate interop.** A pending metadata quarter turn is materialized only when entering the destructive crop/fine-rotation editor, in one background-isolate pass.
          - **Dialog lifecycle race.** Exact size, layout settings, and save-project dialogs had the same controller ownership pattern that previously crashed Fit copies. Controllers now live in the dialog State for the full route/focus teardown lifecycle.
          - **Preview size/CPU.** Opaque editor previews are now JPEG quality 82 (still max 1024 px); full-resolution PDF bytes are unchanged. Import also avoids an unnecessary full-frame clone when EXIF orientation is already upright.
          - **Save As safety.** Saving under a name that belongs to another project now creates a new project rather than silently overwriting the other project.
          - **Project ID hardening.** IDs are validated before they are used as file paths.
          - **Printing/share errors.** Plugin errors are surfaced as app messages instead of uncaught async exceptions.
          - **iOS gallery permission.** Platform bootstrap now adds `NSPhotoLibraryUsageDescription` when iOS is generated.

          ## Verified architecture

          - Layout coordinates remain in millimetres end-to-end.
          - PDF page size remains exact physical paper size with zero PDF margins.
          - Full-resolution pixels are retained separately from editor previews.
          - Duplicates share source byte buffers and PDF preparation is cached by source identity + print size.
          - Snap geometry, safe margins, exact gap, multi-select alignment/distribution, auto-pack, calibration sheet, and named projects remain isolated from raster image operations.

          ## Remaining medium-priority opportunities

          1. **Project storage format:** images are still base64-embedded in JSON. A manifest + binary asset files would remove ~33% base64 overhead and reduce peak memory during save/load.
          2. **Drag rebuild scope:** every drag tick still rebuilds `EditorPage`; moving canvas state into a notifier/state object would matter for very image-heavy sheets.
          3. **Packing quality:** the current shelf packer is intentionally simple and can reject some layouts that a MaxRects/Skyline bin packer could fit.
          4. **Compressed PDF throughput:** distinct source images are downsampled sequentially. Bounded parallel preparation (e.g. two workers) could improve export latency without an unbounded memory spike.
          5. **Production signing:** generated Android release builds are suitable for testing, but Play Store production signing still requires the real keystore/CI secrets.
