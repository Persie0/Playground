name: Export Appodeal migration script

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export_appodeal_script.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - run: git clone --depth 1 https://github.com/Persie0/firebase_tester_builder.git builder
      - run: |
          set -euo pipefail
          mkdir -p payload/scripts
          cp builder/scripts/appodeal43_migrate.py payload/scripts/appodeal43_migrate.py
          test -s payload/scripts/appodeal43_migrate.py
      - uses: actions/upload-artifact@v4
        with:
          name: appodeal43-migration-script
          path: payload
          if-no-files-found: error
