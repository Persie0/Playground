name: Photosphere 460 original native Ceres first parameter tree and lookup return
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-460-native-first-tree-return.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-460-native-first-tree-return
  cancel-in-progress: false
jobs:
  original-first-tree-return:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout private source SHA read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: f5b43a7c77b47fd448cf2da1b3d90bfc5bce1fc4
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify research SHA and Python syntax
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f5b43a7c77b47fd448cf2da1b3d90bfc5bce1fc4
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py research/photosphere/checkpoint442/live_six_pair_native_camera_getters.py research/photosphere/checkpoint454/live_original_problem_constructor.py research/photosphere/checkpoint455/live_first_native_registration_entry.py research/photosphere/checkpoint456/live_first_scratch_copy.py research/photosphere/checkpoint457/live_first_native_four_pointer_sort.py research/photosphere/checkpoint457/scan_native_four_pointer_sort.py research/photosphere/checkpoint458/scan_original_ceres_postsort.py research/photosphere/checkpoint458/live_original_postsort_to_lookup.py research/photosphere/checkpoint459/live_first_parameter_owner.py research/photosphere/checkpoint459/scan_original_first_parameter_owner.py research/photosphere/checkpoint460/live_first_parameter_tree_insert.py research/photosphere/checkpoint460/scan_original_parameter_tree_insertion.py
      - name: Verify source-original GCam 8.8.225 APK and ARM64 ELF
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Source-run original first Ceres parameter RB tree insertion, rebalance and lookup return
        working-directory: research-src
        env:
          PHOTOSPHERE_THIRD_SHIFT407: '2'
          PHOTOSPHERE_FOURTH_CERES460: '1'
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py > checkpoint460-native.log 2> checkpoint460-diagnostic.log || {
            echo CHECKPOINT460_NATIVE_FAILURE
            tail -n 90 checkpoint460-diagnostic.log
            tail -n 8 checkpoint460-native.log | cut -c1-240
            exit 1
          }
          python3 - <<'PY'
          import json
          line=next(x for x in open("checkpoint460-native.log")
                    if x.startswith("CHECKPOINT395_NATIVE_POINT_SETUP_THIRD_ROBUST_ENTRY_REPORT="))
          d=json.loads(line.split("=",1)[1])
          t=d["checkpoint460_fourth_original_first_parameter_tree_insert"]
          a=d["checkpoint459_fourth_original_first_parameter_owner"]
          h=d["checkpoint458_fourth_original_postsort_to_parameter_lookup"]
          s=d["checkpoint457_fourth_original_four_pointer_sort"]
          c=d["checkpoint456_fourth_original_first_scratch_copy"]
          p=d["checkpoint455_fourth_native_first_registration_entry"]
          getters=d["checkpoint442_fourth_original_native_getters"]
          if not t:
              print("CHECKPOINT460_MISSING_RECEIPT_DEBUG="+json.dumps({
                "callback_error":getters.get("source_original_callback_execution_error"),
                "requested":getters.get("source_original_first_tree_insert_460_requested"),
                "completed":getters.get("source_original_first_tree_insert_460_completed"),
                "parameter_459_completed":getters.get("source_original_first_parameter_459_completed"),
                "postsort_458_completed":getters.get("source_original_postsort_458_completed"),
                "sort_457_completed":getters.get("source_original_four_pointer_sort_457_completed"),
                "first_source_rows":getters.get("source_original_callback_rows",[])[:1],
              },default=str,sort_keys=True))
              raise AssertionError("source-original first Ceres parameter tree native receipt missing")
          assert t["checkpoint"]==460
          assert t["source_original_first_tree_48byte_malloc_BL_executed"]
          assert t["source_original_first_tree_native_rebalance_call_executed"]
          assert t["source_original_first_tree_native_rebalance_root_color_verified"]
          assert t["source_original_first_tree_root_and_header_source_written"]
          assert t["source_original_first_parameter_tree_count"]==1
          assert t["source_original_native_parameter_first_vector_malloc_BL_executed"]
          assert t["source_original_native_first_parameter_aux_vector_append_verified"]
          assert t["source_original_first_parameter_lookup_return_pc"]=="0x134858"
          assert t["source_original_first_parameter_lookup_native_return_executed"]
          assert t["source_original_first_parameter_object_unchanged"]
          assert t["source_original_original_pimpl_tree_invariants_verified"]
          assert t["source_original_source_28byte_point_unchanged"]
          assert t["source_original_first_result_buffer_unchanged"]
          assert t["source_original_imported_allocator_host_substituted"]
          assert t["source_original_original_input_four_parameter_pointer_bytes_unchanged"]
          assert t["source_original_second_parameter_lookup_unexecuted"]
          assert t["source_original_ceres_residual_registration_unexecuted"]
          assert t["source_original_ceres_optimizer_unexecuted"]
          assert a["checkpoint"]==459
          assert a["original_first_parameter_object_byte_size"]==80
          assert a["original_first_parameter_object_parameter_size"]==4
          assert a["original_first_parameter_native_metadata_writes_executed"]
          assert a["original_first_parameter_lookup_native_tree_insert_stop_pc"]=="0x133ddc"
          assert h["checkpoint"]==458 and h["original_source_3_adjacent_sorted_unique_pointer_checks"]==3
          assert h["original_source_first_parameter_lookup_callsite_reached"]=="0x134854"
          assert s["source_original_four_pointer_sorted_ascending_verified"]
          assert s["source_original_four_pointer_dispatch_target"]=="0x3cf0e0"
          assert c["source_original_parameter_pointer_copy_verified"]
          assert c["source_original_memmove_import_host_substituted"]
          assert p["original_source_0x128e04_call_executed"]
          assert getters["source_original_first_tree_insert_460_completed"]
          assert getters["source_original_first_parameter_459_completed"]
          assert getters["source_original_postsort_458_completed"]
          assert getters["source_original_four_pointer_sort_457_completed"]
          assert getters["source_original_first_scratch_456_completed"]
          assert getters["source_original_first_registration_455_completed"]
          assert getters["source_original_problem_ctor_454_completed"]
          assert getters["source_original_point_row_451_completed"]
          assert getters["source_original_pair_buffer_unchanged"]
          assert getters["source_original_source_camera_unchanged"]
          assert getters["source_original_provider_owned_children_unchanged"]
          assert getters["source_original_nested_vector_payloads_unchanged_443"]
          v=getters["source_original_matcher_owned_nested_vectors_443"]
          assert [x["point28"]["count"] for x in v]==[25,15,16,11,0,19]
          assert sum(x["point28"]["count"] for x in v)==86
          print("CHECKPOINT460_SOURCE_NATIVE_FIRST_TREE_RETURN_VERIFIED")
          print("CHECKPOINT460_SOURCE_NATIVE_RECEIPT="+json.dumps(t,sort_keys=True))
          PY
      - name: Delete original APK and native ELF on success or failure
        if: always()
        working-directory: research-src
        run: |
          rm -f original.apk research/native/liblightcycle.so
      - name: Upload source-only diagnostic (no original binary)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-460-first-tree-return-source-only
          path: research-src/checkpoint460-diagnostic.log
          if-no-files-found: error
          retention-days: 7
