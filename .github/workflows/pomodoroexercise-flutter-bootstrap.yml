name: FocusMove private Flutter build and scaffold
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pomodoroexercise-flutter-bootstrap.yml'
      - 'pomodoroexercise-ci-trigger.txt'

permissions:
  contents: read

concurrency:
  group: focusmove-flutter-bootstrap
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout FocusMove private implementation branch
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'A private repository token must be configured'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --depth=1 --branch=feat/01-flutter-foundation https://github.com/Persie0/pomodoroexercise.git source
          test -f source/lib/main.dart
      - name: Generate platform runners without overwriting authored app
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter create --project-name pomodoroexercise --org com.persie --platforms android,ios .
          grep -q 'FocusMoveApp' lib/main.dart
          # Flutter's generated sample test targets MyApp; our real test replaces it.
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get
          dart format --output=write lib test
      - name: Analyze, test and build Android debug APK
        working-directory: source
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos
          flutter test
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
      - name: Commit generated runners back to private feature branch
        if: success()
        working-directory: source
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'focusmove-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A android ios .metadata pubspec.lock lib test
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'build: generate Flutter Android and iOS runners and format source'
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/01-flutter-foundation
          echo 'Validated source and platform runner files committed to the private branch.'
