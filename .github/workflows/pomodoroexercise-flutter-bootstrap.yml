name: FocusMove private Flutter build and scaffold
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pomodoroexercise-flutter-bootstrap.yml'
      - 'pomodoroexercise-ci-trigger.txt'

permissions:
  contents: read

concurrency:
  group: focusmove-flutter-bootstrap
  cancel-in-progress: false

jobs:
  flutter:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'FocusMove')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout FocusMove private implementation branch
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'A private repository token must be configured'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --depth=1 --branch=feat/05-phase-notifications https://github.com/Persie0/pomodoroexercise.git source
          test -f source/lib/main.dart
      - name: Generate platform runners without overwriting authored app
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter create --project-name pomodoroexercise --org com.persie --platforms android,ios .
          grep -q 'FocusMoveApp' lib/main.dart
          # Flutter's generated sample test targets MyApp; our real test replaces it.
          if [ -f test/widget_test.dart ] && grep -q 'MyApp' test/widget_test.dart; then rm test/widget_test.dart; fi
          flutter pub get
          dart format --output=write lib test
      - name: Validate privately and write diagnostic report
        working-directory: source
        shell: bash
        run: |
          set +e
          set -uo pipefail
          mkdir -p .ci
          flutter analyze --no-fatal-infos > /tmp/focusmove-analyze.log 2>&1
          ANALYZE=$?
          flutter test > /tmp/focusmove-test.log 2>&1
          TESTS=$?
          if [ "$ANALYZE" -eq 0 ] && [ "$TESTS" -eq 0 ]; then
            flutter build apk --debug > /tmp/focusmove-build.log 2>&1
            BUILD=$?
          else
            echo 'Build skipped because analysis or tests failed.' > /tmp/focusmove-build.log
            BUILD=98
          fi
          {
            printf '# FocusMove public runner / private diagnostics\n\n'
            printf 'Flutter analyze exit: %s\nFlutter tests exit: %s\nAndroid debug build exit: %s\n\n' "$ANALYZE" "$TESTS" "$BUILD"
            printf '## Analyzer\n\n```text\n'; cat /tmp/focusmove-analyze.log; printf '\n```\n'
            printf '## Tests\n\n```text\n'; cat /tmp/focusmove-test.log; printf '\n```\n'
            printf '## Android build\n\n```text\n'; tail -n 120 /tmp/focusmove-build.log; printf '\n```\n'
          } > .ci/validation-report.md
          if [ "$ANALYZE" -eq 0 ] && [ "$TESTS" -eq 0 ] && [ "$BUILD" -eq 0 ]; then
            test -s build/app/outputs/flutter-apk/app-debug.apk
            echo 'Validation complete: success. APK is not uploaded publicly.'
          else
            echo 'Validation incomplete: see private repo .ci/validation-report.md.'
          fi
      - name: Commit generated runners and diagnostic report privately
        working-directory: source
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'focusmove-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -A android ios .metadata pubspec.lock lib test .ci
          if ! git diff --cached --quiet; then
            git commit -m 'build: generate Flutter runners and save private validation results'
            AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/05-phase-notifications
          fi
          echo 'Generated files and diagnostics updated in private feature branch.'
      - name: Require validation success
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Flutter analyze exit: 0' .ci/validation-report.md
          grep -Fq 'Flutter tests exit: 0' .ci/validation-report.md
          grep -Fq 'Android debug build exit: 0' .ci/validation-report.md
          echo 'Flutter analysis, tests and Android build passed.'

  ios-simulator:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private FocusMove source
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Private repository token not available'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --depth=1 --branch=feat/05-phase-notifications https://github.com/Persie0/pomodoroexercise.git source
      - name: Resolve Flutter packages and compile iOS simulator
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get >/dev/null
          flutter build ios --simulator --no-codesign > /tmp/focusmove-ios-build.log 2>&1 || {
            tail -n 110 /tmp/focusmove-ios-build.log
            exit 1
          }
          echo 'iOS simulator build succeeded; no private IPA/artifact published'
