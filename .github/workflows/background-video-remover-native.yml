name: Native Background Video Remover build checks
on:
  push:
    branches:
      - ci/background-video-remover-native
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: background-video-remover-native-validation
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout private implementation
        uses: actions/checkout@v4
        with:
          repository: Persie0/BackgroundVideoRemover
          ref: feat/native-mobile-background-removal
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android platform
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/16.0/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Android unit tests and debug build
        run: gradle --no-daemon -p android :app:testDebugUnitTest :app:assembleDebug

  swift-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout private implementation
        uses: actions/checkout@v4
        with:
          repository: Persie0/BackgroundVideoRemover
          ref: feat/native-mobile-background-removal
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Parse Swift syntax
        run: |
          swiftc -frontend -parse ios/BackgroundVideoRemover/*.swift

  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout private implementation
        uses: actions/checkout@v4
        with:
          repository: Persie0/BackgroundVideoRemover
          ref: feat/native-mobile-background-removal
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Build iOS Simulator app
        run: |
          xcodebuild -project ios/BackgroundVideoRemover.xcodeproj \
            -scheme BackgroundVideoRemover \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
