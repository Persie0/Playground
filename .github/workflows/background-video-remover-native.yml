name: Native Background Video Remover build checks
on:
  push:
    branches:
      - ci/background-video-remover-native
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout private implementation
        uses: actions/checkout@v4
        with:
          repository: Persie0/BackgroundVideoRemover
          ref: feat/native-mobile-background-removal
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Android unit tests and debug build
        run: gradle --no-daemon -p android :app:testDebugUnitTest :app:assembleDebug

  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout private implementation
        uses: actions/checkout@v4
        with:
          repository: Persie0/BackgroundVideoRemover
          ref: feat/native-mobile-background-removal
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Build iOS Simulator app
        run: |
          xcodebuild -project ios/BackgroundVideoRemover.xcodeproj \
            -scheme BackgroundVideoRemover \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
