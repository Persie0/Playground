name: SkipSilencePlayer PR4 native UI validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/skip-silence-impeccable-pr4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SkipSilencePlayer feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/SkipSilencePlayer
          ref: feature/impeccable-player-ux-20261120
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: target
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android tests and debug APK
        working-directory: target/kotlin-android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SkipSilencePlayer-PR4-debug
          path: target/kotlin-android/app/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout SkipSilencePlayer feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/SkipSilencePlayer
          ref: feature/impeccable-player-ux-20261120
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: target
      - name: Build iOS simulator
        working-directory: target/swift-ios
        run: |
          set -o pipefail
          xcodebuild \
            -project SkipSilencePlayer.xcodeproj \
            -scheme SkipSilencePlayer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derived \
            CODE_SIGNING_ALLOWED=NO \
            build
