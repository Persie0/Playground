name: FocusMove PR8 quick validation
on:
  push:
    paths:
      - '.github/workflows/focusmove-pr8-quick-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'FocusMove')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Fetch private FocusMove source securely
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --depth=1 --branch=feat/08-guided-break-player https://github.com/Persie0/pomodoroexercise.git source
      - name: Validate analyzer and tests only
        working-directory: source
        shell: bash
        run: |
          set +e
          flutter pub get >/tmp/focusmove-pr8-pub.log 2>&1
          PUB=$?
          if [ "$PUB" -eq 0 ]; then
            flutter analyze --no-fatal-infos >/tmp/focusmove-pr8-analyze.log 2>&1
            ANALYZE=$?
            timeout 360 flutter test --reporter compact >/tmp/focusmove-pr8-tests.log 2>&1
            TESTS=$?
          else
            ANALYZE=98
            TESTS=98
          fi
          printf 'FocusMove dependency resolution: %s\nAnalyzer: %s\nTests: %s\n' "$PUB" "$ANALYZE" "$TESTS"
          [ "$PUB" -eq 0 ] && [ "$ANALYZE" -eq 0 ] && [ "$TESTS" -eq 0 ]
          echo 'FocusMove PR8 analysis and unit/widget tests passed; no private logs or artifacts published.'
