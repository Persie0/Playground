name: FocusMove PR8 quick validation
on:
  push:
    paths:
      - '.github/workflows/focusmove-pr8-quick-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'FocusMove')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Fetch private FocusMove source securely
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --depth=1 --branch=feat/08-guided-break-player https://github.com/Persie0/pomodoroexercise.git source
      - name: Validate analyzer and tests with hard failure checks
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get >/tmp/focusmove-pr8-pub.log 2>&1
          flutter analyze --no-fatal-infos >/tmp/focusmove-pr8-analyze.log 2>&1
          echo 'Analyzer clean.'
          if timeout 150 flutter test test/guided_break_widget_test.dart --timeout 45s --reporter expanded >/tmp/focusmove-pr8-targeted.log 2>&1; then
            echo 'Guided widget tests passed.'
          else
            echo 'Guided widget tests FAILED or TIMED OUT. Merge blocked.'
            grep -E 'Test failed|[0-9]+ tests passed|TimeoutException|Test timed out|Some tests failed' /tmp/focusmove-pr8-targeted.log | tail -n 12 || true
            exit 1
          fi
          if timeout 240 flutter test --timeout 45s --reporter expanded >/tmp/focusmove-pr8-tests.log 2>&1; then
            echo 'Complete Flutter test suite passed.'
          else
            echo 'Flutter tests FAILED or TIMED OUT. Merge blocked.'
            grep -E 'Test failed|[0-9]+ tests passed|TimeoutException|Test timed out|Some tests failed' /tmp/focusmove-pr8-tests.log | tail -n 12 || true
            exit 1
          fi
          echo 'FocusMove PR8 analysis and all tests passed; no private logs or artifacts published.'
