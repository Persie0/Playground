name: FocusMove PR8 targeted private diagnostics
on:
  push:
    paths:
      - '.github/workflows/focusmove-pr8-quick-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-guided-widgets:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'FocusMove')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private code
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --depth=1 --branch=feat/08-guided-break-player https://github.com/Persie0/pomodoroexercise.git source
      - name: Run bounded guide tests and save diagnostics privately
        working-directory: source
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set +e
          set -uo pipefail
          flutter pub get >/tmp/focusmove-pub.log 2>&1
          PUB=$?
          flutter analyze --no-fatal-infos >/tmp/focusmove-analyze.log 2>&1
          ANALYZE=$?
          timeout 75 flutter test test/guided_break_widget_test.dart --timeout 20s --reporter expanded >/tmp/focusmove-target.log 2>&1
          TESTS=$?
          mkdir -p .ci
          {
            printf '# PR8 guided widget diagnostic — private\n\n'
            printf 'Dependency resolution: %s\nAnalyzer: %s\nGuided tests: %s\n\n' "$PUB" "$ANALYZE" "$TESTS"
            printf '\x60\x60\x60text\n'
            cat /tmp/focusmove-target.log
            printf '\n\x60\x60\x60\n'
          } > .ci/guided-widget-diagnostic.md
          git config user.name 'focusmove-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add .ci/guided-widget-diagnostic.md
          git commit -m 'ci: store guided widget diagnostics privately' || true
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/08-guided-break-player
          printf 'Guided widget tests exit: %s (full diagnostics are PRIVATE)\n' "$TESTS"
          test "$PUB" -eq 0 && test "$ANALYZE" -eq 0 && test "$TESTS" -eq 0
