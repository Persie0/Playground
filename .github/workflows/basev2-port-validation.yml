name: BaseV2 port validation

on:
  push:
    branches:
      - basev2-port-validation
    paths:
      - ".github/workflows/basev2-port-validation.yml"
      - "debug_triggers/basev2-port-validation.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Playground
        uses: actions/checkout@v4

      - name: Checkout BaseV2 port branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/traffic-counting-light-main
          ref: basev2-port-edge-features
          path: traffic-counting-light-main
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          lfs: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: traffic-counting-light-main/baseV2/traffic-counting-edge-dashboard-main/frontend/package-lock.json

      - name: Install verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "pytest<10" \
            numpy \
            opencv-python-headless \
            pyyaml \
            ruamel-yaml \
            loguru \
            lz4 \
            requests \
            jsonpickle \
            watchfiles \
            "supervision==0.26.1" \
            "scipy==1.17.1" \
            "fastapi==0.136.3" \
            httpx

      - name: Compile BaseV2 Python sources
        working-directory: traffic-counting-light-main/baseV2/traffic-counting-edge-detection-master
        run: python -m compileall -q src tests

      - name: Run BaseV2 detection tests except known pre-existing broken mock-path file
        working-directory: traffic-counting-light-main/baseV2/traffic-counting-edge-detection-master
        env:
          PYTHONPATH: src
        run: |
          pytest -q tests \
            --ignore=tests/http_publisher_tests/test_settings_publisher.py

      - name: Confirm excluded detection test is unchanged from main
        working-directory: traffic-counting-light-main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main:baseV2/traffic-counting-edge-detection-master/tests/http_publisher_tests/test_settings_publisher.py)" = \
               "$(git rev-parse HEAD:baseV2/traffic-counting-edge-detection-master/tests/http_publisher_tests/test_settings_publisher.py)"

      - name: Run dashboard analysis API tests
        working-directory: traffic-counting-light-main/baseV2/traffic-counting-edge-dashboard-main/server
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_analysis.py

      - name: Confirm unrelated broken frontend spec is unchanged from main
        working-directory: traffic-counting-light-main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main:baseV2/traffic-counting-edge-dashboard-main/frontend/src/app/service/system-statistics.spec.ts)" = \
               "$(git rev-parse HEAD:baseV2/traffic-counting-edge-dashboard-main/frontend/src/app/service/system-statistics.spec.ts)"

      - name: Build dashboard frontend and run analysis spec
        working-directory: traffic-counting-light-main/baseV2/traffic-counting-edge-dashboard-main/frontend
        run: |
          npm ci
          npm run build
          mv src/app/service/system-statistics.spec.ts /tmp/system-statistics.spec.ts
          npm test -- --include=src/app/route/analysis/analysis.spec.ts

      - name: Verify copied LibreYOLO model is byte-identical
        working-directory: traffic-counting-light-main
        shell: bash
        run: |
          set -euo pipefail
          source_dir='edge/models/libreyolo9t_384x288_ncnn_model'
          target_dir='baseV2/traffic-counting-edge-detection-master/src/inference/models/libreyolo9t-288x384-ncnn'

          for name in model.ncnn.param model.ncnn.bin metadata.yaml provenance.json; do
            test -s "$source_dir/$name"
            test -s "$target_dir/$name"
            cmp "$source_dir/$name" "$target_dir/$name"
          done

          test "$(stat -c '%s' "$target_dir/model.ncnn.bin")" -eq 4102140
          test "$(sha256sum "$target_dir/model.ncnn.bin" | cut -d' ' -f1)" = \
            'af1724a2bc8c225bdcd6f2840c5c0624c5399d4ebf144f63d01dfee29be3d7e0'

          attr="$(git check-attr filter -- "$target_dir/model.ncnn.param")"
          echo "$attr"
          test "$attr" = "$target_dir/model.ncnn.param: filter: unset" || \
            test "$attr" = "$target_dir/model.ncnn.param: filter: unspecified"

      - name: Check deferred dual-stream stays documentation-only
        working-directory: traffic-counting-light-main
        shell: bash
        run: |
          set -euo pipefail
          test -f baseV2/traffic-counting-edge-detection-master/docs/fisheye-dual-stream-idea.md
          ! grep -R --line-number --exclude='fisheye-dual-stream-idea.md' 'fisheye_dual_stream' baseV2/traffic-counting-edge-detection-master/src
