name: PhotosphereCleanroom independent Rust baseline
on:
  push:
    branches: [main]
    paths: [".github/workflows/photosphere-cleanroom-baseline.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-mapping:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch and verify original research input
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -H "Authorization: Bearer $GH_TOKEN" "https://github.com/Persie0/decompile/releases/download/pho/com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk" -o camera.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  camera.apk" | sha256sum -c -
          unzip -p camera.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo "878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so" | sha256sum -c -
      - name: Install pinned static decoders
        run: python3 -m pip install --disable-pip-version-check capstone==5.0.6 pyelftools==0.32
      - name: Resolve exact global accesses and ELF-owned method boundaries
        run: |
          set -euo pipefail
          mkdir -p out
          python3 scripts/photosphere_manager_163.py | tee out/manager-native.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: photosphere-mapping-163
          path: out/
          retention-days: 7
  verify-and-prepare:
    needs: native-mapping
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: playground
      - uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereRust
          ref: ec0cc990e9b80d4195deec8c93bf74059dc1f6b0
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: baseline
      - uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: f8cdfc6c2b6f3f2a0ba2f17ff91a5ac63b9098aa
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: cleanroom
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Import pinned independent source and lock dependencies
        working-directory: cleanroom
        run: |
          set -euo pipefail
          python3 tools/prepare_baseline.py "$GITHUB_WORKSPACE/baseline"
          cargo generate-lockfile > "$RUNNER_TEMP/resolve.log" 2>&1
          rustc --version
          python3 - <<'PY'
          import pathlib, subprocess
          version = subprocess.check_output(["rustc", "--version"], text=True).split()[1]
          pathlib.Path("rust-toolchain.toml").write_text('[toolchain]\nchannel = "' + version + '"\nprofile = "minimal"\ncomponents = ["rustfmt"]\n')
          PY
      - name: Prove metadata regressions fail on behaviorally unchanged engine
        working-directory: cleanroom
        run: |
          set -euo pipefail
          if cargo test --locked --no-default-features --test java_metadata_compat > "$RUNNER_TEMP/red.log" 2>&1; then
            echo "Expected behaviorally unchanged engine to fail metadata assertions."
            exit 1
          fi
          python3 - <<'PY'
          import os, pathlib
          text = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "red.log").read_text()
          assert "test result: FAILED" in text, "Red phase failed before test execution; inspect private diagnostics."
          assert "java_reader_ignores_malformed_lines_in_otherwise_valid_metadata ... FAILED" in text
          print("RED confirmed: behaviorally unchanged independent engine fails behavioral assertions.")
          for line in text.splitlines():
              if line.startswith("test result:"): print(line)
          PY
      - name: Apply independently specified Java metadata contract
        working-directory: cleanroom
        run: |
          set -euo pipefail
          python3 tools/apply_metadata_contract.py
          rustfmt --edition 2021 src/java_metadata.rs examples/stitch_session.rs tests/java_metadata_compat.rs
          rustfmt --edition 2021 --check src/java_metadata.rs examples/stitch_session.rs tests/java_metadata_compat.rs
      - name: Default engine and CLI tests
        working-directory: cleanroom
        run: python3 ../playground/scripts/run_private_rust_check.py default cargo test --locked --all-targets
      - name: Portable engine and CLI tests
        working-directory: cleanroom
        run: python3 ../playground/scripts/run_private_rust_check.py portable cargo test --locked --all-targets --no-default-features
      - name: Android JNI host engine and CLI tests
        working-directory: cleanroom
        run: python3 ../playground/scripts/run_private_rust_check.py jni-host cargo test --locked --all-targets --features android-jni
      - name: Build release library
        working-directory: cleanroom
        run: python3 ../playground/scripts/run_private_rust_check.py release cargo build --locked --release
      - name: Check Android and iOS Rust targets sequentially
        working-directory: cleanroom
        run: |
          set -euo pipefail
          rustup target add aarch64-linux-android aarch64-apple-ios > "$RUNNER_TEMP/targets.log" 2>&1
          for platform in aarch64-linux-android aarch64-apple-ios; do
            if cargo check --locked --no-default-features --features android-jni --target "$platform" > "$RUNNER_TEMP/$platform.log" 2>&1; then
              echo "$platform Rust check passed"
            else
              echo "$platform Rust check failed; inspect private diagnostics."
              exit 1
            fi
          done
      - name: Exercise the saved-session command end to end
        working-directory: cleanroom
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/fixture_lib" Pillow==11.3.0 > "$RUNNER_TEMP/pillow.log" 2>&1
          PYTHONPATH="$RUNNER_TEMP/fixture_lib" python3 - <<'PY'
          import hashlib, json, os, pathlib
          from PIL import Image
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "gcam-synthetic"
          root.mkdir()
          image = Image.new("RGB", (320, 240))
          image.putdata([(x % 256, y % 256, (x+y) % 256) for y in range(240) for x in range(320)])
          image.save(root / "0.jpg", quality=95)
          (root / "orientations.txt").write_text("1 0 0 0 1 0 0 0 1 3\n")
          hashes = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in root.iterdir()}
          (root / "hashes.json").write_text(json.dumps(hashes))
          PY
          cargo run --locked --release --example stitch_session -- "$RUNNER_TEMP/gcam-synthetic" 75 "$RUNNER_TEMP/gcam-rendered.jpg" 512 > "$RUNNER_TEMP/cli-report.json" 2> "$RUNNER_TEMP/cli.log"
          PYTHONPATH="$RUNNER_TEMP/fixture_lib" python3 - <<'PY'
          import hashlib, json, os, pathlib
          from PIL import Image
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          root = temp / "gcam-synthetic"
          report = json.loads((temp / "cli-report.json").read_text())
          output = temp / "gcam-rendered.jpg"
          with Image.open(output) as image:
              image.load()
              assert image.size == (report["output_width"], report["output_height"])
          assert b'GPano:ProjectionType="equirectangular"' in output.read_bytes()
          for name, digest in json.loads((root / "hashes.json").read_text()).items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == digest
          assert report["gpano_metadata_written"]
          print("CLI render passed: decodable JPEG, GPano metadata, original source hashes unchanged.")
          PY
          if cargo run --locked --release --example stitch_session -- "$RUNNER_TEMP/gcam-synthetic" 75 "$RUNNER_TEMP/gcam-rendered.jpg" 512 > "$RUNNER_TEMP/cli-repeat.log" 2>&1; then
            echo "CLI unexpectedly overwrote an existing panorama."
            exit 1
          fi
          python3 -c 'import os,pathlib; assert "output already exists" in (pathlib.Path(os.environ["RUNNER_TEMP"])/"cli-repeat.log").read_text()'
          echo "CLI existing-output refusal passed."
      - name: Record evidence and push tested review branch
        working-directory: cleanroom
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, subprocess
          directory = pathlib.Path("docs/validation")
          directory.mkdir(exist_ok=True)
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          text = "# Rust baseline validation\n\n"
          text += "Run: https://github.com/Persie0/Playground/actions/runs/" + os.environ["GITHUB_RUN_ID"] + "\n\n"
          text += "Compiler: " + subprocess.check_output(["rustc", "--version"], text=True).strip() + "\n\n"
          text += "Independent source: ec0cc990e9b80d4195deec8c93bf74059dc1f6b0. After a build-only f64 annotation, metadata tests failed on the behaviorally unchanged base, then passed after the specified parser was connected.\n\n"
          for name in ("red", "default", "portable", "jni-host"):
              lines = [s for s in (temp / (name+".log")).read_text().splitlines() if s.startswith("test result:")]
              text += "## " + name + "\n\n" + "\n".join("- "+s for s in lines) + "\n\n"
          text += "Release library built. Rust checks passed for aarch64-linux-android and aarch64-apple-ios. These are cross-compilation checks, not device execution.\n\n"
          text += "The actual command rendered a synthetic saved session to a decodable JPEG with GPano, preserved source hashes, and refused an existing output path. No original Google Camera/device fixture was tested.\n"
          (directory / "2026-10-20-baseline.md").write_text(text)
          PY
          git diff --check
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock rust-toolchain.toml src tests examples bindings include LICENSE-MIT LICENSE-APACHE PERFORMANCE.md docs
          git commit -m "feat: import verified independent Rust engine and fix Java metadata compatibility" > "$RUNNER_TEMP/commit.log" 2>&1
          git push origin HEAD:refs/heads/feat/gcam-rust-baseline
          echo "Tested implementation pushed to the private review branch."
      - name: Retain failure diagnostics privately
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh auth setup-git
          git clone --quiet --depth 1 --branch main https://github.com/Persie0/PhotosphereCleanroom.git "$RUNNER_TEMP/private-diagnostics"
          python3 - <<'PY'
          import os, pathlib
          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          out = temp / "private-diagnostics" / "docs" / "validation" / os.environ["GITHUB_RUN_ID"]
          out.mkdir(parents=True)
          for path in temp.glob("*.log"):
              if path.name in ("resolve.log","red.log","default.log","portable.log","jni-host.log","release.log","targets.log","aarch64-linux-android.log","aarch64-apple-ios.log","cli.log","cli-repeat.log","pillow.log","commit.log"):
                  (out / (path.stem+".txt")).write_text("\n".join(path.read_text(errors="replace").splitlines()[-500:])+"\n")
          PY
          cd "$RUNNER_TEMP/private-diagnostics"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/validation
          git commit -m "ci: retain private Rust baseline diagnostics" > /dev/null
          git push --quiet origin "HEAD:refs/heads/ci/cleanroom-${{ github.run_id }}"
          echo "Diagnostics are in PhotosphereCleanroom on ci/cleanroom-${{ github.run_id }}."
