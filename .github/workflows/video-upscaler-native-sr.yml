name: Video Upscaler licensed native SR validation
on:
  push:
    paths:
      - '.github/workflows/video-upscaler-native-sr.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: video-upscaler-native-sr
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 55
    steps:
      - name: Checkout private source using public Playground secrets
        uses: actions/checkout@v4
        with:
          repository: Persie0/video_upscaler
          ref: feature/native-sr-realesrgan-coreml
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: app
          persist-credentials: false
      - name: Xcode version
        run: xcodebuild -version
      - name: Audit translations
        working-directory: app
        run: python3 Scripts/audit_localizations.py
      - name: Build and test macOS with real Core ML smoke
        working-directory: app
        env:
          RUN_COREML_SMOKE: '1'
        run: >-
          xcodebuild -project VideoUpscaler.xcodeproj
          -scheme VideoUpscaler -destination 'platform=macOS'
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO
          SWIFT_STRICT_CONCURRENCY=complete test
      - name: Swift package tests
        working-directory: app
        run: swift test
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-sr-xcresult
          path: app/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore
