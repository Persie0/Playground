name: TopTravelList Singapore 100 reviews and rankings
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toptravellist-singapore-100-20261125.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: data/singapore-worldwide-v2-2026
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          fetch-depth: 0
          path: repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and generate rankings
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python scripts/validate.py
          python scripts/check_city_benchmarks.py
          python scripts/check_sight_benchmarks.py
          python scripts/check_new_country_reviews.py --country SG
          python scripts/generate_rankings.py --country SG
          python scripts/generate_rankings.py --check
          python scripts/rank.py --kind cities --limit 60
          python scripts/rank.py --kind sights --limit 60
          python scripts/rank.py --kind sights --country SG --limit 20
      - name: Assert coverage and score thresholds
        working-directory: repo
        run: |
          python - <<'PY'
          import re
          from decimal import Decimal
          from pathlib import Path
          import yaml
          r=Path('countries/SG')
          d=Path('methodology/reviews/SG')
          txt='\n'.join((d/p).read_text() for p in ['cities.md','sights.md'])
          ids=re.findall(r'^## ((?:city|sight)-sg-[a-z0-9-]+) — ',txt,re.M)
          assert len(ids)==len(set(ids))==100
          assert txt.count('**source-linked-unverified**')==83
          assert txt.count('**editorial-only**')==17
          dims=['impact','uniqueness','significance','experience','depth']
          weights=[30,25,20,15,10]
          high=0
          for k,n in [('cities',1),('sights',99)]:
              files=list((r/k).glob('*.yaml'))
              assert len(files)==n
              md=(r/f'{k}.md').read_text()
              assert md.count('https://www.google.com/maps/search/?api=1&query=')==n
              for f in files:
                  a=yaml.safe_load(f.read_text())
                  assert a['id'] in ids
                  assert a['location']['country_code']=='SG'
                  vals=[*(a['scores'][x] for x in dims),*a['scores']['categories'].values()]
                  assert all(0<=v<10 for v in vals)
                  assert f']({k}/{f.name})' in md
                  total=sum(Decimal(str(a['scores'][x]))*w for x,w in zip(dims,weights))/10
                  section=txt.split('## '+a['id']+' — ',1)[1].split('\n## ',1)[0]
                  if total>=90 or any(v>=9.5 for v in vals):
                      high+=1
                      assert 'High-score challenge: Not applicable' not in section,a['id']
          assert high==5,high
          assert len(list(Path('countries').glob('*/cities/*.yaml')))==1032
          assert len(list(Path('countries').glob('*/sights/*.yaml')))==3248
          print('PASS: 100 reviews, 5 exceptional-score records, 4280 worldwide records.')
          PY
      - name: Commit generated rankings
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name toptravellist-editorial-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md countries/SG/cities.md countries/SG/sights.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Singapore ranking pages and country directory'
            git push origin HEAD:refs/heads/data/singapore-worldwide-v2-2026
          fi
