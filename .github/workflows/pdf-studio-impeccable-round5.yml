name: PDF Studio Impeccable round 5 - release APK
# Responsive markup controls: 200-percent text and signature coverage.

on:
  push:
    branches:
      - pdf-studio-impeccable-round5-ci
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-studio-impeccable-round5
  cancel-in-progress: true

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private PDF Studio feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/pdfapp
          ref: feature/pdf-studio-impeccable-round5
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify Dart analysis
        run: flutter analyze
      - name: Run Flutter unit and widget tests
        run: flutter test --reporter expanded
      - name: Build installable release APK
        id: release
        continue-on-error: true
        run: flutter build apk --release
      - name: Fall back to installable debug APK
        if: steps.release.outcome == 'failure'
        run: flutter build apk --debug
      - name: Record APK checksum and build details
        shell: bash
        run: |
          set -euo pipefail
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            APK=build/app/outputs/flutter-apk/app-release.apk
            MODE=release
          else
            APK=build/app/outputs/flutter-apk/app-debug.apk
            MODE=debug
          fi
          test -s "$APK"
          cp "$APK" pdf-studio-android.apk
          echo "Git commit: $(git rev-parse HEAD)" | tee apk-build-info.txt
          flutter --version | head -n 1 | tee -a apk-build-info.txt
          echo "Build mode: $MODE (Android project currently uses debug-key signing)" | tee -a apk-build-info.txt
          ls -lh pdf-studio-android.apk | tee -a apk-build-info.txt
          sha256sum pdf-studio-android.apk | tee apk-sha256.txt
      - name: Upload installable APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: pdf-studio-impeccable-round5-apk
          path: |
            pdf-studio-android.apk
            apk-build-info.txt
            apk-sha256.txt
          retention-days: 14
          if-no-files-found: error
