name: Finalize ExtractAudioFromVideo Gradle Wrapper

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-extract-audio-wrapper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repository
        uses: actions/checkout@v5
        with:
          repository: Persie0/ExtractAudioFromVideo
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: target
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'
      - name: Generate and commit wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd target/kotlin-android
          gradle wrapper --gradle-version 9.6.0
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kotlin-android/gradlew kotlin-android/gradlew.bat kotlin-android/gradle/wrapper/gradle-wrapper.jar kotlin-android/gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "Gradle wrapper already complete."
            exit 0
          fi
          git commit -m "Add complete Gradle wrapper"
          git push origin main
