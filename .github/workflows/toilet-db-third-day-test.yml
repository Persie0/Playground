name: ToiletCompass third-day update prompt test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/toilet-db-third-day-test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/toiletcompass
          ref: fix/monthly-db-prompt-third-day
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: app
        run: flutter pub get
      - name: Third-day policy regression
        working-directory: app
        run: flutter test test/monthly_database_update_policy_test.dart
      - name: Analyze calendar update logic
        working-directory: app
        run: dart analyze lib/monthly_database_update_gate.dart test/monthly_database_update_policy_test.dart
