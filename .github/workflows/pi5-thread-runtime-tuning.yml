name: Pi5 thread runtime tuning TDD

on:
  push:
    branches:
      - test/pi5-thread-runtime-tuning
    paths:
      - '.github/workflows/pi5-thread-runtime-tuning.yml'
      - '.github/pi5-thread-runtime-tuning-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  TRAFFIC_REPOSITORY: Persie0/traffic-counting-light-main
  TRAFFIC_REF: perf/pi5-thread-runtime-tuning

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Checkout traffic project
        uses: actions/checkout@v5
        with:
          repository: ${{ env.TRAFFIC_REPOSITORY }}
          ref: ${{ env.TRAFFIC_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-traffic

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install edge runtime and development dependencies
        working-directory: private-traffic/edge
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[pi,dev]'

      - name: Run complete edge test suite
        working-directory: private-traffic/edge
        run: PYTHONPATH=src python -m pytest -q tests

      - name: Run Ruff
        working-directory: private-traffic/edge
        run: python -m ruff check src tests

      - name: Compile Python sources
        working-directory: private-traffic/edge
        run: python -m compileall -q src tests
