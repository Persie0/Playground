name: Photosphere 461 original Ceres nonempty tree overlap helper source audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-461-native-overlap-static.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-461-native-overlap-static
  cancel-in-progress: false
jobs:
  source-pointer-overlap-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 2ac32a4ec124a1de49a8b695bb6530d048956b3a
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify pinned research source and Python
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2ac32a4ec124a1de49a8b695bb6530d048956b3a
          python3 -m pip install --quiet --break-system-packages capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint461/scan_source_parameter_overlap_helper.py
      - name: Validate original APK/ELF integrity
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Decode original native Ceres pointer overlap-check source and caller branches
        working-directory: research-src
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint461/scan_source_parameter_overlap_helper.py research/native/liblightcycle.so --output checkpoint461-original-overlap.json > checkpoint461-scan.log
          python3 - <<'PY'
          import json
          d=json.load(open("checkpoint461-original-overlap.json"))
          assert d["source_native_overlap_calls_verified"]
          assert not d["source_original_overlap_helper_executed"]
          print("CHECKPOINT461_OVERLAP_SOURCE_STATIC_VERIFIED")
          for name in ("owner_overlap_calls","parameter_overlap_helper"):
              print("CHECKPOINT461_SCAN_"+name.upper()+"="+json.dumps(d["windows"][name],separators=(",",":")))
          PY
      - name: Remove original binaries before artifact
        if: always()
        working-directory: research-src
        run: rm -f original.apk research/native/liblightcycle.so
      - name: Upload source-only opcode inventory
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-461-original-overlap-opcodes
          path: research-src/checkpoint461-original-overlap.json
          retention-days: 7
          if-no-files-found: error
