name: Noise Remover Impeccable Android visual smoke

on:
  push:
    branches:
      - validation/noise-remover-impeccable-ux-20261121
    paths:
      - .github/workflows/noise-remover-impeccable-android-visual.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-visual:
    name: Pixel emulator screenshots and accessibility snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the private app on a public runner
        uses: actions/checkout@v4
        with:
          repository: Persie0/noise_remover
          ref: feature/impeccable-noise-remover-ux
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - name: Configure private Git dependency access
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          test -n "$PRIVATE_TOKEN"
          git config --global url."https://x-access-token:${PRIVATE_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter packages and generate translations
        working-directory: app
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Install Android command-line tools
        uses: android-actions/setup-android@v4
      - name: Install app Android SDK/NDK versions
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 --install 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;29.0.14206865'
      - name: Enable accelerated Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Compile Android screenshot harness
        working-directory: app
        run: flutter build apk --debug --target lib/screenshot_harness.dart
      - name: Prepare single-process emulator capture script
        run: |
          cat > "$RUNNER_TEMP/noise-visual.sh" <<'SCRIPT'
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ux-captures"
          adb install -r app/build/app/outputs/flutter-apk/app-debug.apk
          adb shell am start -n at.persie0.noise_remover/.MainActivity
          sleep 12
          python3 - <<'PY'
          import os, re, subprocess, time, xml.etree.ElementTree as ET
          from pathlib import Path
          out = Path(os.environ['GITHUB_WORKSPACE']) / 'ux-captures'
          pkg = 'at.persie0.noise_remover'
          def adb(*args, **kwargs):
              return subprocess.run(['adb', *args], check=True, **kwargs)
          def dump():
              adb('shell','uiautomator','dump','/sdcard/window.xml', stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              adb('pull','/sdcard/window.xml','/tmp/noise-ux-window.xml', stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              return ET.parse('/tmp/noise-ux-window.xml')
          def tap_label(label):
              for node in dump().iter('node'):
                  desc = (node.attrib.get('text','') + ' ' + node.attrib.get('content-desc','')).lower()
                  if label.lower() not in desc:
                      continue
                  coords = re.findall(r'\d+',node.attrib.get('bounds',''))
                  if len(coords) != 4:
                      continue
                  x1,y1,x2,y2 = map(int,coords)
                  if x2 <= x1 or y2 <= y1:
                      continue
                  adb('shell','input','tap',str((x1+x2)//2),str((y1+y2)//2))
                  time.sleep(1)
                  return True
              return False
          def choose(label):
              if not tap_label(label):
                  raise RuntimeError('Screenshot navigation is unreachable: '+label)
          def capture(name):
              choose('Hide Toolbar')
              time.sleep(1)
              if name == 'home_dark':
                  dump().write(str(out/'accessibility-home.xml'),encoding='utf-8')
              with open(out/(name+'.png'),'wb') as file:
                  adb('exec-out','screencap','-p',stdout=file)
              choose('Show Toolbar')
          capture('home_dark')
          for label,name in [('Processing','processing_dark'),('Result','result_dark'),('Batch','batch_dark')]:
              choose(label)
              time.sleep(5)
              capture(name)
              if label == 'Result':
                  text = ' '.join((n.attrib.get('text','')+' '+n.attrib.get('content-desc','')) for n in dump().iter('node'))
                  if 'file not found' in text.lower():
                      print('VISUAL_FIXTURE_WARNING: Result capture is a missing-file state')
          choose('Home')
          choose('Light Mode')
          time.sleep(2)
          # The inverse action proves the theme actually changed.
          labels = ' '.join(n.attrib.get('text','') + ' ' + n.attrib.get('content-desc','') for n in dump().iter('node'))
          if 'Dark Mode' not in labels:
              raise RuntimeError('Theme switch did not expose the Dark Mode action')
          capture('home_light')
          choose('Batch')
          time.sleep(2)
          capture('batch_light')
          adb('shell','settings','put','system','font_scale','1.3')
          adb('shell','am','force-stop',pkg)
          adb('shell','am','start','-n',pkg+'/.MainActivity')
          time.sleep(10)
          capture('home_large_text')
          adb('shell','settings','put','system','font_scale','1.0')
          for name in ('home_dark','processing_dark','result_dark','batch_dark','home_light','batch_light','home_large_text'):
              item = out/(name+'.png')
              if not item.exists() or item.stat().st_size < 10000:
                  raise RuntimeError('Missing or empty screenshot: '+name)
          print('VISUAL_CAPTURE_COMPLETE:', ','.join(p.name for p in sorted(out.glob('*.png'))))
          PY
          adb logcat -d -s flutter:D Flutter:D AndroidRuntime:E > "$GITHUB_WORKSPACE/ux-captures/android-logcat.txt" || true
          SCRIPT
          chmod +x "$RUNNER_TEMP/noise-visual.sh"
      - name: Render actual Android Flutter UI on Pixel 6
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash "$RUNNER_TEMP/noise-visual.sh"
      - name: Upload captured UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noise-remover-impeccable-android-visual
          path: ux-captures/
          if-no-files-found: warn
          retention-days: 7
