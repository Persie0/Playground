name: Resistor Scanner Impeccable QA 2026-11-23

on:
  push:
    branches: [ci/resistor-scanner-ux-20261123]
    paths:
      - .github/workflows/resistor-scanner-ux-qa-20261123.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout scanner revision
        uses: actions/checkout@v4
        with:
          repository: Persie0/resistor-scanner-android
          ref: fix/impeccable-scanner-ux-20261123
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Compile, test, lint, and assemble
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
