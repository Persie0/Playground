name: Apply Noise Remover background Task 5 v2

on:
  push:
    branches:
      - background-media-processing-validation-20260928
    paths:
      - '.github/workflows/apply-noise-background-task5-v2.yml'

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/noise_remover
  APP_REF: feature/android-background-media-processing-20260928

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout private feature branch
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: app

      - name: Patch foreground startup reattach and direct cancel
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          path = Path('lib/screens/home_screen.dart')
          text = path.read_text()

          base_import = "import '../services/background_processing_task.dart';\n"
          if "import '../services/android_media_processing_events.dart';" not in text:
              text = replace_once(
                  text,
                  base_import,
                  base_import
                  + "import '../services/android_media_processing_events.dart';\n"
                  + "import '../services/android_media_processing_service.dart';\n"
                  + "import '../services/background_processing_recovery.dart';\n",
                  'foreground imports',
              )

          new_startup = '''    if (savedJob != null && mounted) {
              var recoveryJob = savedJob;

              void scheduleRecoveryPrompt(Map<String, dynamic> job) {
                WidgetsBinding.instance.addPostFrameCallback((_) {
                  if (!mounted) return;
                  unawaited(
                    _promptSavedJobRecovery(job).catchError((
                      Object error,
                      StackTrace stackTrace,
                    ) async {
                      debugPrint('Saved-job recovery prompt failed: $error');
                      await Sentry.captureException(error, stackTrace: stackTrace);
                    }),
                  );
                });
              }

              if (recoveryJob['type'] == 'short') {
                final jobId = recoveryJob['jobId'] as String?;
                var foregroundOwnsJob = false;
                if (Platform.isAndroid &&
                    recoveryJob['status'] == 'inProgress' &&
                    jobId != null) {
                  foregroundOwnsJob = await AndroidMediaProcessingService.instance
                      .isRunningForJob(jobId);
                  final latest = await _processingLock.loadJobState();
                  if (latest != null && latest['jobId'] == jobId) {
                    recoveryJob = latest;
                  }
                }

                final recoveryAction = resolveShortJobRecovery(
                  savedJob: recoveryJob,
                  foregroundOwnsJob: foregroundOwnsJob,
                );
                switch (recoveryAction) {
                  case ShortJobRecoveryAction.reattach:
                    WidgetsBinding.instance.addPostFrameCallback((_) {
                      if (!mounted) return;
                      unawaited(
                        _reattachShortForegroundJob(recoveryJob).catchError((
                          Object error,
                          StackTrace stackTrace,
                        ) async {
                          debugPrint('Foreground job reattach failed: $error');
                          await Sentry.captureException(
                            error,
                            stackTrace: stackTrace,
                          );
                        }),
                      );
                    });
                    break;
                  case ShortJobRecoveryAction.markInterrupted:
                    recoveryJob = {...recoveryJob, 'status': 'interrupted'};
                    await _processingLock.saveJobState(recoveryJob);
                    scheduleRecoveryPrompt(recoveryJob);
                    break;
                  case ShortJobRecoveryAction.resumeFinalization:
                    final finalizationState = {
                      ...recoveryJob,
                      'status': 'finalizing',
                    };
                    await _processingLock.saveJobState(finalizationState);
                    WidgetsBinding.instance.addPostFrameCallback((_) {
                      if (!mounted) return;
                      unawaited(
                        _resumeShortFinalization(finalizationState).catchError((
                          Object error,
                          StackTrace stackTrace,
                        ) async {
                          debugPrint('Foreground finalization recovery failed: $error');
                          await Sentry.captureException(
                            error,
                            stackTrace: stackTrace,
                          );
                        }),
                      );
                    });
                    break;
                  case ShortJobRecoveryAction.promptExistingRecovery:
                    scheduleRecoveryPrompt(recoveryJob);
                    break;
                }
              } else {
                if (recoveryJob['status'] == 'inProgress') {
                  recoveryJob = {...recoveryJob, 'status': 'interrupted'};
                  await _processingLock.saveJobState(recoveryJob);
                }
                scheduleRecoveryPrompt(recoveryJob);
              }
            }
          '''

          if '_reattachShortForegroundJob(recoveryJob)' not in text:
              start = text.find("    if (savedJob != null && mounted) {")
              end_marker = "\n  }\n\n  Future<void> _promptSavedJobRecovery"
              end = text.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit('could not locate startup recovery block')
              text = text[:start] + new_startup + text[end:]

          reattach_method = '''  Future<void> _reattachShortForegroundJob(
              Map<String, dynamic> savedJob,
            ) async {
              if (!mounted || _isLoading) return;
              final jobId = savedJob['jobId'] as String?;
              final originalPath = savedJob['filePath'] as String?;
              if (jobId == null || jobId.isEmpty || originalPath == null) {
                await _processingLock.clearJobState();
                return;
              }

              final source = File(originalPath);
              if (!await source.exists()) {
                final interrupted = {
                  ...savedJob,
                  'status': 'interrupted',
                  'lastError': 'The source file is no longer available.',
                };
                await _processingLock.saveJobState(interrupted);
                if (mounted) await _promptSavedJobRecovery(interrupted);
                return;
              }

              setState(() => _isLoading = true);
              final l10n = AppLocalizations.of(context)!;
              final progressNotifier = ValueNotifier<double>(
                ((savedJob['progress'] as num?)?.toDouble() ?? 0.0)
                    .clamp(0.0, 1.0)
                    .toDouble(),
              );
              final messageNotifier = ValueNotifier<String>(
                savedJob['message'] as String? ?? l10n.msgStarting,
              );
              final speedNotifier = ValueNotifier<String>('');
              final cancelRequestedNotifier = ValueNotifier<bool>(false);
              final terminal = Completer<AndroidMediaProcessingEvent>();
              var processingScreenPushed = false;
              late final StreamSubscription<AndroidMediaProcessingEvent> subscription;

              void acceptEvent(AndroidMediaProcessingEvent event) {
                if (event.jobId != jobId || terminal.isCompleted) return;
                if (event.type == AndroidMediaProcessingEventType.progress) {
                  progressNotifier.value =
                      (event.progress ?? progressNotifier.value)
                          .clamp(0.0, 1.0)
                          .toDouble();
                  final message = event.message;
                  if (message != null && message.isNotEmpty) {
                    messageNotifier.value = message;
                  }
                  return;
                }
                terminal.complete(event);
              }

              void acceptCheckpoint(Map<String, dynamic>? checkpoint) {
                if (checkpoint == null ||
                    checkpoint['jobId'] != jobId ||
                    terminal.isCompleted) {
                  return;
                }
                final status = checkpoint['status'] as String?;
                final progress = (checkpoint['progress'] as num?)?.toDouble();
                final message = checkpoint['message'] as String?;
                if (progress != null) {
                  progressNotifier.value = progress.clamp(0.0, 1.0).toDouble();
                }
                if (message != null && message.isNotEmpty) {
                  messageNotifier.value = message;
                }
                switch (status) {
                  case 'completed':
                    terminal.complete(
                      AndroidMediaProcessingEvent(
                        type: AndroidMediaProcessingEventType.completed,
                        jobId: jobId,
                        progress: 1.0,
                        message: message,
                        finalOutputPath: checkpoint['finalOutputPath'] as String?,
                      ),
                    );
                    break;
                  case 'cancelled':
                    terminal.complete(
                      AndroidMediaProcessingEvent(
                        type: AndroidMediaProcessingEventType.cancelled,
                        jobId: jobId,
                        message: message,
                        error: checkpoint['lastError'] as String?,
                      ),
                    );
                    break;
                  case 'failed':
                    terminal.complete(
                      AndroidMediaProcessingEvent(
                        type: AndroidMediaProcessingEventType.failed,
                        jobId: jobId,
                        message: message,
                        error: checkpoint['lastError'] as String?,
                      ),
                    );
                    break;
                  case 'interrupted':
                    terminal.complete(
                      AndroidMediaProcessingEvent(
                        type: AndroidMediaProcessingEventType.interrupted,
                        jobId: jobId,
                        message: message,
                        error: checkpoint['lastError'] as String?,
                      ),
                    );
                    break;
                }
              }

              subscription = AndroidMediaProcessingService.instance.events.listen(
                acceptEvent,
              );

              try {
                final fileSize = await source.length();
                final fileName =
                    savedJob['originalFileName'] as String? ?? path.basename(originalPath);
                final fileExt = path
                    .extension(originalPath)
                    .toUpperCase()
                    .replaceAll('.', '');

                if (!mounted) return;
                processingScreenPushed = true;
                Navigator.push(
                  context,
                  MaterialPageRoute(
                    builder:
                        (context) => ProcessingScreen(
                          fileName: fileName,
                          fileSize:
                              '${(fileSize / (1024 * 1024)).toStringAsFixed(1)} MB',
                          fileFormat: fileExt,
                          progressNotifier: progressNotifier,
                          messageNotifier: messageNotifier,
                          speedNotifier: speedNotifier,
                          cancelRequestedNotifier: cancelRequestedNotifier,
                          showBackgroundInfo: true,
                          onCancel: () async {
                            if (cancelRequestedNotifier.value) return;
                            cancelRequestedNotifier.value = true;
                            messageNotifier.value = l10n.cancel;
                            await AndroidMediaProcessingService.instance.cancel();
                            if (mounted && processingScreenPushed) {
                              Navigator.pop(context);
                              processingScreenPushed = false;
                            }
                          },
                        ),
                  ),
                );

                final checkpoint = await _processingLock.loadJobState();
                acceptCheckpoint(checkpoint);
                if (!terminal.isCompleted &&
                    !await AndroidMediaProcessingService.instance
                        .isRunningForJob(jobId)) {
                  final latest = await _processingLock.loadJobState();
                  acceptCheckpoint(latest);
                  if (!terminal.isCompleted) {
                    final interrupted = {
                      ...(latest ?? savedJob),
                      'status': 'interrupted',
                      'lastError':
                          'Android foreground processing stopped before completion.',
                    };
                    await _processingLock.saveJobState(interrupted);
                    acceptCheckpoint(interrupted);
                  }
                }

                final event = await terminal.future;
                if (mounted && processingScreenPushed) {
                  Navigator.pop(context);
                  processingScreenPushed = false;
                }

                final latest =
                    await _processingLock.loadJobState() ?? <String, dynamic>{...savedJob};
                switch (event.type) {
                  case AndroidMediaProcessingEventType.completed:
                    final outputPath =
                        event.finalOutputPath ?? latest['finalOutputPath'] as String?;
                    if (outputPath == null || outputPath.isEmpty) {
                      final failed = {
                        ...latest,
                        'status': 'failed',
                        'lastError':
                            'Foreground processing completed without an output path.',
                      };
                      await _processingLock.saveJobState(failed);
                      if (mounted) await _promptSavedJobRecovery(failed);
                      return;
                    }
                    final finalizationState = {
                      ...latest,
                      'status': 'finalizing',
                      'finalOutputPath': outputPath,
                    };
                    await _processingLock.saveJobState(finalizationState);
                    if (mounted) await _resumeShortFinalization(finalizationState);
                    break;
                  case AndroidMediaProcessingEventType.cancelled:
                    await _processingLock.clearJobState();
                    break;
                  case AndroidMediaProcessingEventType.failed:
                  case AndroidMediaProcessingEventType.interrupted:
                    if (mounted) await _promptSavedJobRecovery(latest);
                    break;
                  case AndroidMediaProcessingEventType.progress:
                    break;
                }
              } finally {
                await subscription.cancel();
                progressNotifier.dispose();
                messageNotifier.dispose();
                speedNotifier.dispose();
                cancelRequestedNotifier.dispose();
                if (mounted) setState(() => _isLoading = false);
              }
            }

          '''
          method_marker = '  Future<void> _promptSavedJobRecovery(Map<String, dynamic> savedJob) async {'
          if 'Future<void> _reattachShortForegroundJob(' not in text:
              text = replace_once(
                  text,
                  method_marker,
                  reattach_method + method_marker,
                  'reattach method insertion',
              )

          process_start = text.find('  Future<void> _processFile(')
          if process_start < 0:
              raise SystemExit('short process method not found')
          prefix, process_tail = text[:process_start], text[process_start:]
          old_cancel = '''                  messageNotifier?.value = l10n.cancel;
                  unawaited(cancellationToken.cancel());'''
          new_cancel = '''                  messageNotifier?.value = l10n.cancel;
                  if (Platform.isAndroid) {
                    await AndroidMediaProcessingService.instance.cancel();
                  }
                  unawaited(cancellationToken.cancel());'''
          if old_cancel in process_tail:
              process_tail = replace_once(
                  process_tail,
                  old_cancel,
                  new_cancel,
                  'short direct cancel',
              )
          elif new_cancel not in process_tail:
              raise SystemExit('short cancellation block changed unexpectedly')
          text = prefix + process_tail

          path.write_text(text)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      - name: Task 5 focused tests
        working-directory: app
        run: |
          flutter test \
            test/services/android_media_processing_service_test.dart \
            test/services/background_processing_recovery_test.dart \
            test/background_processing_foreground_service_regression_test.dart

      - name: Analyze touched integration
        working-directory: app
        run: flutter analyze lib/main.dart lib/screens/home_screen.dart lib/services/background_processing_task.dart lib/services/background_processing_recovery.dart lib/services/android_media_processing_task.dart

      - name: Commit and push verified patch
        working-directory: app
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No patch to push.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/screens/home_screen.dart
          git commit -m 'feat: reattach active Android foreground noise jobs'
          git push origin HEAD:${APP_REF}
