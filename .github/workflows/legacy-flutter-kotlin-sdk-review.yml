name: Student Planner SDK NDK verification
on:
  pull_request:
    paths: [.github/workflows/legacy-flutter-kotlin-sdk-review.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - repo: student_planner
            ref: chore/android-agp9-kotlin2421-20261013
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android SDK and licenses
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' || "$SDKMANAGER" --install 'platforms;android-37'
          "$SDKMANAGER" --install 'ndk;29.0.13599879'
      - name: Verify Android modernization versions
        working-directory: app
        run: |
          grep -q 'gradle-9.6.0-' android/gradle/wrapper/gradle-wrapper.properties
          grep -Eq '2.4.21' android/settings.gradle
      - name: Restore Dart packages
        working-directory: app
        run: flutter pub get
      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug --no-pub
      - name: Flutter tests
        working-directory: app
        run: |
          if test -d test; then flutter test --no-pub; else echo 'No Flutter tests'; fi
