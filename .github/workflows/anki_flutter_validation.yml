# Stage: browser sorting final UI regression verification
name: AnkiFlutter hosted validation
on:
  push:
    branches:
      - codex/anki-flutter-validation-20260930
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out AnkiFlutter test branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/AnkiFlutter
          ref: codex/anki-browser-bulk-actions-20260930
          path: AnkiFlutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Resolve locked Flutter packages
        working-directory: AnkiFlutter/app
        run: flutter pub get --enforce-lockfile
      - name: Run Anki browser feature tests
        working-directory: AnkiFlutter/app
        run: flutter test test/features/browser
      - name: Run backend operation contract test
        working-directory: AnkiFlutter/app
        run: flutter test test/core/backend/backend_operation_test.dart
      - name: Analyze the complete Flutter app
        working-directory: AnkiFlutter/app
        run: flutter analyze
      - name: Run the complete Flutter test suite
        working-directory: AnkiFlutter/app
        run: flutter test
