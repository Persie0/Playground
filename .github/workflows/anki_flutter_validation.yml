# Stage: repository contract verification
name: AnkiFlutter hosted validation
on:
  push:
    branches:
      - codex/anki-flutter-validation-20260930
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out AnkiFlutter test branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/AnkiFlutter
          ref: codex/anki-browser-bulk-actions-20260930
          path: AnkiFlutter
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Resolve locked Flutter packages
        working-directory: AnkiFlutter/app
        run: flutter pub get --enforce-lockfile
      - name: Run focused Anki browser repository tests
        working-directory: AnkiFlutter/app
        run: flutter test test/features/browser/data/anki_card_browser_repository_test.dart
