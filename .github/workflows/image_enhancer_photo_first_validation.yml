name: Image Enhancer photo-first P2 validation

on:
  push:
    branches: [image-enhancer-photo-first-validation-20261121]
    paths: [.github/workflows/image_enhancer_photo_first_validation.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-enhancer-photo-first-validation-20261121
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private image editor from public Playground
        uses: actions/checkout@v4
        with:
          repository: Persie0/image_enhancer
          ref: ui/impeccable-p2-photo-first-editor-20261121
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: image_enhancer

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: image_enhancer
        run: flutter pub get

      - name: Generate localizations
        working-directory: image_enhancer
        run: flutter gen-l10n

      - name: Focused editor-layout regression tests
        working-directory: image_enhancer
        run: flutter test test/impeccable_p2_photo_first_test.dart test/impeccable_p2_layout_test.dart test/enhancement_presets_test.dart test/home_layout_test.dart test/batch_recovery_ux_test.dart --timeout 2m --reporter expanded

      - name: Flutter analysis
        working-directory: image_enhancer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Full Flutter regression suite
        working-directory: image_enhancer
        run: flutter test --concurrency=2 --timeout 2m --reporter compact

# Revalidate P2 after updating prior layout tests for the new grouped model catalog.

# Final P2 review: remove duplicate mode headings and update ad-model regression assertions.
