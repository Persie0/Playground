name: Toothfairy private model review
on:
  push:
    branches: [ci/toothfairy-model-review]
    paths: [.github/workflows/toothfairy-model-review.yml]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: a6593a5a77a48b19ba1ef9b83eade9e9875a88b6
      PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
    steps:
      - name: Render actual Blender rig and save review images privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          d="$RUNNER_TEMP/toothfairy-review"
          mkdir -p "$d/src" "$d/blender" "$d/review"
          log="$d/review.log"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -C "$d/src" init -q
          git -C "$d/src" remote add origin https://github.com/Persie0/Toothfairy.git
          git -C "$d/src" -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --quiet --depth=1 origin "$SOURCE_SHA" >"$log" 2>&1
          git -C "$d/src" checkout -q --detach FETCH_HEAD
          (
            cd "$d/blender"
            version=4.2.23
            archive="blender-$version-linux-x64.tar.xz"
            url="https://download.blender.org/release/Blender4.2"
            curl -fsSL --retry 3 "$url/$archive" -o "$archive"
            curl -fsSL --retry 3 "$url/blender-$version.sha256" -o checksums
            grep -E "[[:space:]]\\*?$archive$" checksums | sha256sum -c -
            tar -xf "$archive"
            rm "$archive"
          ) >>"$log" 2>&1
          blender="$d/blender/blender-4.2.23-linux-x64/blender"
          # Regenerate, verify and render the revised source, preserving the full rig.
          mkdir -p "$d/generated"
          "$blender" -b --python-exit-code 1 -P "$d/src/assets-source/create_fairy.py" -- "$d/generated/Fairy.blend" >"$d/generate.log" 2>&1 || { echo "::error::Fairy generation failed."; exit 1; }
          expected="$(sed -nE 's/^Generated optimized fairy rig: [0-9]+ meshes, ([0-9]+) triangles, [0-9]+ bones$/\1/p' "$d/generate.log" | tail -1)"
          test -n "$expected"
          "$blender" -b --python-exit-code 1 -P "$d/src/assets-source/verify_fairy.py" -- "$d/generated/Fairy.fbx" "$expected" >"$d/verify.log" 2>&1 || { echo "::error::FBX roundtrip failed."; exit 1; }
          sed -e 's/samples=24/samples=12/' -e 's/resolution_x=720;scene.render.resolution_y=900/resolution_x=480;scene.render.resolution_y=600/' -e "s/file_format='PNG'/file_format='JPEG';scene.render.image_settings.quality=85/" -e "s/\.png/\.jpg/g" "$d/src/assets-source/render_fairy_review.py" > "$d/render.py"
          "$blender" -b "$d/generated/Fairy.blend" --python-exit-code 1 -P "$d/render.py" -- "$d/review" >>"$log" 2>&1
          cp "$d/generated/Fairy.blend" "$d/src/assets-source/Fairy.blend"
          cp "$d/generated/Fairy.fbx" "$d/src/mobile/Assets/Toothfairy/Resources/Fairy/Fairy.fbx"
          git -C "$d/src" add -- assets-source/Fairy.blend mobile/Assets/Toothfairy/Resources/Fairy/Fairy.fbx
          git -C "$d/src" -c user.name="Toothfairy CI" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Regenerate V11 corrected swept hair and tiara" >>"$log" 2>&1
          git -C "$d/src" -c "http.extraheader=AUTHORIZATION: basic $auth" push --quiet origin HEAD:refs/heads/feature/fairy-face-parent-unlock >>"$log" 2>&1
          mkdir -p "$d/src/.ci/model-review"
          cp "$d/review/"*.jpg "$d/src/.ci/model-review/"
          test "$(find "$d/src/.ci/model-review" -name '*.jpg' | wc -l)" -eq 5
          git -C "$d/src" add -- .ci/model-review
          git -C "$d/src" -c user.name="Toothfairy CI" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Private visual review of exact fairy rig" >>"$log" 2>&1
          git -C "$d/src" -c "http.extraheader=AUTHORIZATION: basic $auth" push --quiet origin HEAD:refs/heads/ci/model-review/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT >>"$log" 2>&1
          echo "Five review images saved privately."
      - name: Retain generation diagnostics privately
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/toothfairy-review"
          test -d "$d/src/.git" || exit 0
          mkdir -p "$d/src/.ci/model-review"
          for stage in generate verify; do
            if [[ -s "$d/$stage.log" ]]; then tail -n 40 "$d/$stage.log" >>"$d/src/.ci/model-review/diagnostics.txt"; fi
          done
          test -s "$d/src/.ci/model-review/diagnostics.txt" || exit 0
          git -C "$d/src" add -- .ci/model-review/diagnostics.txt
          git -C "$d/src" -c user.name="Toothfairy CI" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Private model generation diagnostics" >/dev/null
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -C "$d/src" -c "http.extraheader=AUTHORIZATION: basic $auth" push --quiet origin HEAD:refs/heads/ci/model-review/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT >/dev/null 2>&1
      - name: Cleanup
        if: always()
        run: sudo rm -rf "$RUNNER_TEMP/toothfairy-review"
