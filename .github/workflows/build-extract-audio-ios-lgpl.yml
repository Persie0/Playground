name: Build LGPL FFmpeg iOS Vendor

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-extract-audio-ios-lgpl.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      TARGET_REPO: Persie0/ExtractAudioFromVideo
      FFMPEG_KIT_NEXT_COMMIT: a724ed99583dcfe2af497c794fdd6b24ddd54a4e
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v5
        with:
          repository: Persie0/ExtractAudioFromVideo
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: target
          fetch-depth: 0

      - name: Checkout FFmpegKitNext source
        uses: actions/checkout@v5
        with:
          repository: arthenica/ffmpeg-kit-next
          ref: v9.0.0
          path: ffmpeg-kit-next

      - name: Verify source revision
        working-directory: ffmpeg-kit-next
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FFMPEG_KIT_NEXT_COMMIT"

      - name: Install build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          brew install autoconf automake libtool pkg-config nasm yasm cmake gnu-sed || true

      - name: Build iOS LGPL-only XCFrameworks from source
        working-directory: ffmpeg-kit-next
        shell: bash
        run: |
          set -euo pipefail
          export SED="$(brew --prefix)/bin/gsed"
          ./ios.sh \
            -x \
            --spm \
            --target=17.0 \
            --arch=arm64 \
            --jobs=4

      - name: Locate and verify generated package
        working-directory: ffmpeg-kit-next
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_FILE="$(find prebuilt -maxdepth 3 -name Package.swift -print -quit)"
          test -n "$PACKAGE_FILE"
          PACKAGE_DIR="$(dirname "$PACKAGE_FILE")"
          echo "PACKAGE_DIR=$PACKAGE_DIR" >> "$GITHUB_ENV"
          echo "Generated package: $PACKAGE_DIR"
          find "$PACKAGE_DIR" -maxdepth 1 -type d -name '*.xcframework' -print

          found=0
          while IFS= read -r binary; do
            if file "$binary" | grep -q 'Mach-O'; then
              case "$(basename "$binary")" in
                ffmpegkit|libavcodec|libavdevice|libavfilter|libavformat|libavutil|libswresample|libswscale)
                  found=$((found + 1))
                  echo "Verifying $binary"
                  if ! otool -l "$binary" | grep -q 'LC_ID_DYLIB'; then
                    echo "ERROR: expected dynamic library: $binary" >&2
                    exit 1
                  fi
                  if strings "$binary" | grep -E -- '--enable-gpl([ =]|$)|--enable-nonfree([ =]|$)|--enable-libx264([ =]|$)|--enable-libx265([ =]|$)|--enable-libxvid([ =]|$)|--enable-libvidstab([ =]|$)|--enable-librubberband([ =]|$)'; then
                    echo "ERROR: GPL/nonfree option found in $binary" >&2
                    exit 1
                  fi
                  ;;
              esac
            fi
          done < <(find "$PACKAGE_DIR" -type f)
          test "$found" -gt 0

      - name: Publish verified binary package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x .github/scripts/publish_extract_audio_ffmpeg.sh
          .github/scripts/publish_extract_audio_ffmpeg.sh "ffmpeg-kit-next/$PACKAGE_DIR"

      - name: Commit checksum-pinned SwiftPM manifest
        shell: bash
        run: |
          chmod +x .github/scripts/commit_extract_audio_ffmpeg_manifest.sh
          .github/scripts/commit_extract_audio_ffmpeg_manifest.sh target "$ASSETS"
