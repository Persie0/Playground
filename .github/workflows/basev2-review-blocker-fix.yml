name: BaseV2 review blocker fix

on:
  push:
    branches:
      - basev2-port-validation
    paths:
      - ".github/workflows/basev2-review-blocker-fix.yml"

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/traffic-counting-light-main
          ref: basev2-port-edge-features
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Apply native analysis registry wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          traffic_stage = root / 'baseV2/traffic-counting-edge-detection-master/src/analysis/traffic/traffic_stage.py'
          source = traffic_stage.read_text(encoding='utf-8')
          replacements = [
              (
                  'from analysis.traffic.input import samples_from_detections',
                  'from analysis.traffic.input import AnalysisTrackRegistry, samples_from_detections',
              ),
              (
                  '        self._closed = False\n',
                  '        self._closed = False\n        self._track_registry = AnalysisTrackRegistry()\n',
              ),
              (
                  '        samples = samples_from_detections(frame, timestamp, detections)\n',
                  '        samples = samples_from_detections(\n            frame,\n            timestamp,\n            detections,\n            registry=self._track_registry,\n        )\n',
              ),
          ]
          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'missing expected TrafficStage text: {old!r}')
              source = source.replace(old, new, 1)
          traffic_stage.write_text(source, encoding='utf-8')

          detector = root / 'baseV2/traffic-counting-edge-detection-master/src/detection/traffic_detector.py'
          source = detector.read_text(encoding='utf-8')
          old = '# Roboflow ByteTrack backend using the configured camera frame rate.'
          new = '# Supervision 0.26.1 ByteTrack backend using the configured camera frame rate.'
          if old in source:
              source = source.replace(old, new, 1)
              detector.write_text(source, encoding='utf-8')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseV2/traffic-counting-edge-detection-master/src/analysis/traffic/traffic_stage.py \
                  baseV2/traffic-counting-edge-detection-master/src/detection/traffic_detector.py
          git diff --cached --check
          git commit -m "fix: wire stable analysis track registry"
          git push origin HEAD:basev2-port-edge-features
