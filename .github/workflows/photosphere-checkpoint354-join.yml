name: Photosphere checkpoint354 native AddImage two-stage model source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint354-join.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint354-join
  cancel-in-progress: false
jobs:
  original-addimage-two-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout original research SHA-pinned read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 67e31f9ef311b2935b3b31fc25eff20fbb9ef88e
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify private source SHA and install ARM64 original source runtime
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "67e31f9ef311b2935b3b31fc25eff20fbb9ef88e"
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint354/native_original_addimage_two_stage_source.py
      - name: Obtain original checksum-pinned Google Camera ARM64
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Source execute original X3 virtual +0x10 then AddImage provider +0x60 and native 8+36 byte append
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint354/native_original_addimage_two_stage_source.py original.so --output checkpoint354-join.json | tee checkpoint354-join.log
          grep -q '^CHECKPOINT354_ORIGINAL_TWO_STAGE_ADDIMAGE_SOURCE_PASS 45 5 11$' checkpoint354-join.log
      - name: Archive nonproprietary test results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-checkpoint354-join
          path: |
            checkpoint354-join.json
            checkpoint354-join.log
          retention-days: 7
          if-no-files-found: warn
