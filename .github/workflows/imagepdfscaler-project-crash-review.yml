name: ImagePdfScaler project crash review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imagepdfscaler-project-crash-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Verify checkout token
        env:
          APP_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$APP_TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: Persie0/ImagePdfScaler
          ref: fix/project-loading-crash-diagnostics-20261014
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Flutter analyzer
        working-directory: app
        run: flutter analyze --no-pub
      - name: Project recovery tests
        working-directory: app
        run: flutter test --no-pub --reporter expanded test/project_storage_service_test.dart test/project_home_page_test.dart
      - name: Full Flutter suite
        working-directory: app
        run: flutter test --no-pub
      - name: Install required Android NDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "ndk;29.0.13599879"
      - name: Android debug build
        working-directory: app
        run: flutter build apk --debug --no-pub
