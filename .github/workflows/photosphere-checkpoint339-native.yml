name: Photosphere checkpoint339 original pair producer and aux transfers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint339-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint339-native
  cancel-in-progress: false
jobs:
  original-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pinned private research read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: e5159852d109ae772ad0c3f36bc01e2fca1b0366
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify pinned research and dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "e5159852d109ae772ad0c3f36bc01e2fca1b0366"
          python3 -m pip install --quiet --break-system-packages capstone unicorn pyelftools
      - name: Fetch checksum-pinned Google Camera original binary from private release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Source-original AddImage and producer static call graph
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint339/scan_original_pair_producer.py original.so --output checkpoint339-original-producer-survey.json > checkpoint339-original-producer-survey.log
          grep -q '^CHECKPOINT339_ORIGINAL_PRODUCER_SURVEY_PASS 12 11' checkpoint339-original-producer-survey.log
          grep '^CHECKPOINT339_FDE' checkpoint339-original-producer-survey.log
      - name: Source-original 12-byte auxiliary vector assignment
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint339/native_original_aux12_vector.py original.so --output checkpoint339-original-12byte-vector.json | tee checkpoint339-aux12.log
          grep -q '^CHECKPOINT339_AUX12_SOURCE_PASS 18 13' checkpoint339-aux12.log
      - name: Trace original AddImage upstream pair-record instruction chain
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint339/trace_original_pair_upstream.py original.so --output checkpoint339-original-upstream-producer.json > checkpoint339-original-upstream.log
          grep -q '^CHECKPOINT339_ORIGINAL_UPSTREAM_SURVEY_PASS 7' checkpoint339-original-upstream.log
          grep '^CHECKPOINT339_UPSTREAM_FDE' checkpoint339-original-upstream.log
      - name: Archive nonproprietary original source evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-checkpoint339-native-evidence
          path: |
            checkpoint339-original-producer-survey.json
            checkpoint339-original-producer-survey.log
            checkpoint339-original-upstream-producer.json
            checkpoint339-original-upstream.log
            checkpoint339-original-12byte-vector.json
            checkpoint339-aux12.log
          if-no-files-found: warn
          retention-days: 7
