name: Noise Remover Appodeal 4.3 release verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noise-remover-post-revenuecat-r8-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/noise_remover
  APP_REF: optimize/agp94-r8-analyzer

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Validate private repo token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          test -n "$PRIVATE_TOKEN" || { echo '::error::Missing PRIVATE_REPO_TOKEN/GH_TOKEN'; exit 2; }

      - name: Checkout Noise Remover optimization branch
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 1
          path: private-app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Prepare dependencies and Android SDK
        working-directory: private-app
        run: |
          set -euxo pipefail
          flutter --version
          flutter pub get
          grep -A7 '^  stack_appodeal_flutter:' pubspec.lock | tee ../appodeal-lock.txt
          grep -q 'version: "4.3.0"' ../appodeal-lock.txt
          grep -q 'stack_appodeal_flutter: \^4.3.0' pubspec.yaml
          grep -q 'com.appodeal.ads.sdk:core:4.3.0' android/app/build.gradle.kts
          grep -q "pod 'Appodeal', '4.3.0'" ios/Podfile
          cp pubspec.lock ../pubspec.lock.generated
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_SDK_ROOT" > android/local.properties
          yes | sdkmanager "platforms;android-37" "ndk;29.0.14206865" >/dev/null || true
          cat > android/gradlew <<'EOF'
          #!/usr/bin/env bash
          set -e
          exec gradle "$@"
          EOF
          chmod +x android/gradlew
          keytool -genkeypair -v -keystore android/app/ci-release.jks -storepass android -keypass android -alias ci -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=US"
          printf '%s\n' 'storePassword=android' 'keyPassword=android' 'keyAlias=ci' 'storeFile=ci-release.jks' > android/key.properties

      - name: Flutter analyze
        working-directory: private-app
        run: flutter analyze

      - name: Flutter tests
        working-directory: private-app
        run: |
          touch .env
          if grep -q '^SKIP_TESTERS:' .env; then sed -i 's/^SKIP_TESTERS:.*/SKIP_TESTERS:true/' .env; else echo 'SKIP_TESTERS:true' >> .env; fi
          flutter test

      - name: Capture Appodeal release dependency graph
        working-directory: private-app/android
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath | tee ../../release-dependencies-appodeal43.txt
          grep -E 'appodeal|bidon|bidmachine|applovin|facebook|meta|mbridge|mintegral|vungle|bigo|fyber|dtexchange|ironsource|unity' ../../release-dependencies-appodeal43.txt | tee ../../ad-dependencies-appodeal43.txt || true

      - name: Configure release build resources
        working-directory: private-app
        run: |
          sed -i -e '/^org\.gradle\.jvmargs=/d' -e '/^org\.gradle\.workers\.max=/d' -e '/^org\.gradle\.parallel=/d' -e '/^org\.gradle\.daemon=/d' -e '/^kotlin\.compiler\.execution\.strategy=/d' android/gradle.properties
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xms2g -Xmx10g -XX:+UseParallelGC -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          org.gradle.daemon=false
          kotlin.compiler.execution.strategy=in-process
          EOF

      - name: Build optimized release AAB
        working-directory: private-app
        env:
          CARGO_BUILD_JOBS: '2'
          GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false'
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info

      - name: Extract R8 and ad SDK metrics
        working-directory: private-app
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path

          aab = Path('build/app/outputs/bundle/release/app-release.aab')
          with zipfile.ZipFile(aab) as z:
              r8 = json.loads(z.read('BUNDLE-METADATA/com.android.tools/r8.json'))
              dex_entries = [(i.filename, i.file_size, i.compress_size) for i in z.infolist() if i.filename.endswith('.dex')]
          result = {
              'aab_bytes': aab.stat().st_size,
              'dex_uncompressed_bytes': sum(x[1] for x in dex_entries),
              'dex_compressed_bytes': sum(x[2] for x in dex_entries),
              'dex_entries': dex_entries,
              'r8': r8,
          }
          Path('../appodeal43-r8-metrics.json').write_text(json.dumps(result, indent=2, sort_keys=True))
          print(json.dumps(result, indent=2, sort_keys=True))

          mappings = list(Path('build').rglob('mapping.txt'))
          prefixes = {
              'appodeal':'com.appodeal.', 'bidmachine':'io.bidmachine.', 'bidon':'org.bidon.',
              'applovin':'com.applovin.', 'meta':'com.facebook.', 'mintegral':'com.mbridge.',
              'vungle':'com.vungle.', 'bigo':'com.bigossp.', 'ironsource':'com.ironsource.',
              'unity':'com.unity3d.', 'fyber':'com.fyber.'
          }
          counts = {}
          if mappings:
              lines = mappings[0].read_text(errors='ignore').splitlines()
              classes = [line.split(' -> ',1)[0] for line in lines if ' -> ' in line and line.endswith(':')]
              for name,prefix in prefixes.items(): counts[name] = sum(c.startswith(prefix) for c in classes)
          Path('../ad-mapped-class-counts.json').write_text(json.dumps(counts, indent=2, sort_keys=True))
          print('Mapped retained ad classes:', json.dumps(counts, sort_keys=True))
          PY

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noise-remover-appodeal43-r8-verify
          path: |
            appodeal-lock.txt
            pubspec.lock.generated
            release-dependencies-appodeal43.txt
            ad-dependencies-appodeal43.txt
            appodeal43-r8-metrics.json
            ad-mapped-class-counts.json
            private-app/build/app/outputs/bundle/release/app-release.aab
            private-app/build/app/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 7
