name: Outfitter recommendation validation

# Uses PUBLIC Playground Actions minutes only. The private source is checked
# out temporarily using an existing Playground secret, never published here.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/outfitter-recommendation-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Verify private checkout credential exists
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout Outfitter candidate
        uses: actions/checkout@v5
        with:
          repository: Persie0/outfitter
          ref: fix/destination-local-forecast-time-and-coverage
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: true
          path: source
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: source
        run: flutter pub get
      - name: Format touched Dart files
        working-directory: source
        run: dart format lib/services/weather_service.dart lib/screens/plan_screen.dart test/weather_service_test.dart
      - name: Run complete Flutter test suite
        working-directory: source
        run: flutter test
      - name: Analyze app
        working-directory: source
        run: flutter analyze
      - name: Commit validated formatting to Outfitter candidate
        working-directory: source
        shell: bash
        run: |
          git add lib/services/weather_service.dart lib/screens/plan_screen.dart test/weather_service_test.dart
          if ! git diff --cached --quiet; then
            git config user.name "playground-ci"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style: format forecast recommendation changes"
            git push origin HEAD:fix/destination-local-forecast-time-and-coverage
          fi
