name: Photosphere checkpoint295 original BA quaternion matrix writeback
on:
  push:
    branches: [research/photosphere-checkpoint295-quaternion-matrix-writeback]
    paths:
      - .github/workflows/photosphere-checkpoint295-quaternion-matrix.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint295-source-oracle
  cancel-in-progress: true
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Public Playground workflow checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install original ARM64 decoder and emulator
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools unicorn
      - name: Download and hash original GCam 8.8.225
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Disassemble quaternion conversion and original session index source
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          b=Path('original.so').read_bytes()
          assert hashlib.sha256(b).hexdigest()=='878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1'
          c=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          windows={
            'original_ba_postsolve_quaternion_full':(0x129750,0x1299b0),
            'original_ba_params_to_quaternion_array':(0x1287f0,0x128a30),
            'original_addimage_append_and_pose_pair':(0x11d720,0x11d7bc),
            'original_rosette_indexed_setter':(0x34565c,0x3456b8),
            'original_rosette_indexed_camera_accessor':(0x3448d0,0x344960),
            'original_rosette_constructor_pose_camera_count':(0x343ebc,0x343f34),
          }
          out={}
          for name,(start,end) in windows.items():
            rows=[{'pc':hex(i.address),'instruction':(i.mnemonic+' '+i.op_str).strip()}
                  for i in c.disasm(b[start:end],start)]
            assert len(rows)==(end-start)//4
            out[name]=rows
            print('CHECKPOINT295_REGION',name)
            for v in rows: print('CHECKPOINT295_ARM64',name,v['pc'],v['instruction'])
          Path('checkpoint295-original-quaternion-disassembly.json').write_text(
              json.dumps({'original_elf_sha256':hashlib.sha256(b).hexdigest(),
                          'instruction_windows':out,
                          'actual_Ceres_solve_executed':False,
                          'per_JPEG_image_identity_proven':False},indent=2)+'\n')
          print('CHECKPOINT295_ORIGINAL_DISASSEMBLY_PASSED')
          PY
      - name: Checkout pinned decompile original-ARM64 quaternion probe
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: a2b2d470715c7bb17a2432fb6c2db11eae270e5c
          path: decompile
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          filter: blob:none
          sparse-checkout: |
            research/photosphere/checkpoint295
            research/photosphere/checkpoint292
            research/photosphere/checkpoint211
            research/photosphere/checkpoint210
            research/photosphere/checkpoint209
            research/photosphere/checkpoint188
          persist-credentials: false
      - name: Execute original ARM64 quaternion-to-matrix and indexed pose setter
        run: |
          set -euo pipefail
          test "$(git -C decompile rev-parse HEAD)" = a2b2d470715c7bb17a2432fb6c2db11eae270e5c
          mkdir -p decompile/research/native
          cp original.so decompile/research/native/liblightcycle.so
          (
            cd decompile
            python3 research/photosphere/checkpoint295/native_original_quaternion_writeback.py | tee ../checkpoint295-original-native-quaternion.log
            cp checkpoint295-original-quaternion-matrix-fixtures.json ..
          )
          grep -q 'CHECKPOINT295_NATIVE_QUATERN_CASES_PASSED 16' checkpoint295-original-native-quaternion.log
      - name: Exact original instruction and vtable verifier
        run: |
          set -euo pipefail
          python3 decompile/research/photosphere/checkpoint295/verify_original_quaternion_writeback.py original.so --output checkpoint295-original-writeback-verification.json | tee checkpoint295-original-writeback-verification.log
          grep -q '^CHECKPOINT295_ORIGINAL_WRITEBACK_OPCODE_AND_VTABLE_PASSED ' checkpoint295-original-writeback-verification.log
      - name: Checkout pinned PhotosphereCleanroom Rust writeback and fixtures
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 3dca46ef8605de1fdbfd33d80ac09722cbcba7cb
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Compare fresh original ARM64 output against pinned Rust fixture
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = 3dca46ef8605de1fdbfd33d80ac09722cbcba7cb
          python3 - <<'PY'
          import json
          with open('checkpoint295-original-quaternion-matrix-fixtures.json') as f: original=json.load(f)
          with open('app/tests/fixtures/native_quaternion_matrix_295.json') as f: pinned=json.load(f)
          assert original==pinned, 'original native execution results changed versus frozen Rust fixture'
          assert len(original['cases'])==16
          print('CHECKPOINT295_FRESH_ORIGINAL_MATCHES_RUST_FIXTURE_PASSED 16')
          PY
      - name: Scoped Rust formatting, differential quaternion test and full library
        working-directory: app
        run: |
          set -euo pipefail
          git diff --check
          rustfmt --edition 2021 --check src/native_bundle_quaternion.rs
          cargo test --lib checkpoint295_original_arm64_quaternion_matrix_and_rosette_writer_bytes -- --nocapture
          cargo test --lib
      - name: Upload original instruction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint295-original-quaternion-disassembly
          path: |
            checkpoint295-original-quaternion-disassembly.json
            checkpoint295-original-quaternion-matrix-fixtures.json
            checkpoint295-original-native-quaternion.log
            checkpoint295-original-writeback-verification.json
            checkpoint295-original-writeback-verification.log
          retention-days: 14
          if-no-files-found: warn
