name: ToiletCompass Impeccable UI review validation
# Follow-up UX: empty-state recovery, GPS lifecycle, and reduced-motion checks.
# Include map zero-result recovery and 1.3x German text regression.
# Verify compass startup calibration and system theme changes.
# Cover 320dp German settings in dark mode and 1.3x font scaling.
# Verify full 32-locale chooser and its narrow-screen regression fix.
# Verify localized OSM legal wrapping and system-theme restoration.
# Final: RTL Arabic, single-scroll offline region fallback, no raw error output.
# Re-check targeted settings list scrolling and cache confirmation.
# Round 4: tablet layout constraints, distinct database/GPS retries, adaptive detail actions.
# Round 4: test quick-start onboarding, all 32 offline-map localizations, plus full suite.
# Final round 4: compact German onboarding CTA + GPS screen layout, full regression.
# Round 5: prevent invalid OSM amenity claims and stale navigation data, use standard Material sheet.
# Final bounded QA: native detail facts, malformed OSM metadata, stale GPS streams, info-only analyzer baseline.
# PR #20 merge-ready validation after reconciling mainline iOS 15.5 and SwiftPM pins.
# Pre-merge review: verify theme-aware status bar contrast and full regression after screenshot fix.

on:
  push:
    branches:
      - impeccable/toiletcompass-ux-qa
    paths:
      - .github/workflows/toiletcompass-impeccable-ux-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout Toilet Compass branch with public Playground secret
        uses: actions/checkout@v4
        with:
          repository: Persie0/toiletcompass
          ref: impeccable/toiletcompass-ux-40-point-pass
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze modified Flutter surfaces and tests
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib/main.dart lib/main_screen.dart lib/map_screen.dart lib/onboarding_screen.dart lib/settings_screen.dart lib/settings_provider.dart lib/theme.dart lib/widgets/no_matches_panel.dart lib/widgets/nearby_toilets_list.dart lib/widgets/osm_attribution_dialog.dart lib/widgets/toilet_attribute_labels.dart lib/services/tracking_epoch.dart test/no_matches_panel_test.dart test/osm_attribution_dialog_test.dart test/nearby_toilets_list_test.dart test/offline_map_notice_test.dart test/toilet_attribute_labels_test.dart test/services/tracking_epoch_test.dart test/settings_theme_follow_test.dart test/onboarding_keyboard_focus_test.dart test/settings_ux_test.dart test/settings_filter_reset_test.dart test/system_ui_overlay_style_test.dart

      - name: Widget and interaction regression tests
        working-directory: app
        run: flutter test test/osm_attribution_dialog_test.dart test/offline_map_notice_test.dart test/toilet_attribute_labels_test.dart test/services/tracking_epoch_test.dart test/nearby_toilets_list_test.dart test/no_matches_panel_test.dart test/settings_theme_follow_test.dart test/settings_ux_test.dart test/onboarding_keyboard_focus_test.dart test/settings_filter_reset_test.dart test/system_ui_overlay_style_test.dart

      - name: Full Flutter regression suite
        working-directory: app
        run: flutter test
