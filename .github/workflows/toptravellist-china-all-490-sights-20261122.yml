name: TopTravelList complete 1913 individual sights global peer recheck
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/toptravellist-china-all-490-sights-20261122.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toptravellist-china-complete-490-20261122
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout review branch via public Playground with approved secret priority
        uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: audit/complete-china-407-sights-2026
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: true
          path: repo
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        working-directory: repo
        run: python -m pip install -r requirements.txt
      - name: Apply 407 individually assessed China sites
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/review_sights_individually_2026.py
          python scripts/review_sights_individually_2026.py --apply
      - name: Validate all sight YAML and worldwide city and sight scoring anchors
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate.py
          python scripts/check_city_benchmarks.py
          python scripts/check_sight_benchmarks.py
      - name: Regenerate worldwide rankings and audit and test deterministic output
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_rankings.py
          python scripts/generate_rankings.py --check
          python scripts/review_sights_individually_2026.py --check
      - name: Verify 490 China slugs and all 1913 individual sight decisions
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path.cwd()
          st=json.loads((root/'methodology/sight-review-2026-stats.json').read_text())
          assert st['records']==st['targeted']==1913, st
          assert st['screened_only']==0, st
          assert st['source_referenced']==632, st
          assert st['changed']>=1800, st
          expected={'AT':133,'TH':206,'KR':284,'CN':490,'VN':360,'KH':260,'TW':180}
          for code,count in expected.items():
              assert st['by_country'][code]['reviewed']==st['by_country'][code]['total']==count,(code,st['by_country'][code])
              src={p.stem for p in (root/'countries'/code/'sights').glob('*.yaml')}
              lines=(root/'methodology/sight-review-decisions-2026'/f'{code}.tsv').read_text().splitlines()
              items=[line.split('|') for line in lines if line and not line.startswith('#')]
              assert len(items)==len(src)==count,(code,len(items),len(src))
              assert {line[0] for line in items}==src,(code,'slug mismatch')
              for item in items:
                  assert len(item)==4 and len(item[1].split(','))==5,(code,item)
                  assert len(item[3])>=60,(code,item)
          assert sum(1 for _ in (root/'countries').glob('*/sights/*.yaml'))==1913
          assert sum(1 for _ in (root/'countries').glob('*/cities/*.yaml'))==703
          print('PASS: 1913/1913 individually authored sight scores, 632 source-linked rationales, zero screened-only.')
          PY
      - name: Commit only Chinese sight YAML, generated rankings, and global audit
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'toptravellist-editorial-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add countries/CN/sights/*.yaml countries/CN/sights.md
          git add methodology/sight-review-2026-full-audit.md
          git add methodology/sight-review-2026-summary.md
          git add methodology/sight-review-2026-stats.json
          git diff --cached --check
          git diff --cached --name-only > /tmp/changes.txt
          count="$(grep -Ec '^countries/CN/sights/[a-z0-9-]+[.]yaml$' /tmp/changes.txt)"
          test "$count" -ge 50
          if grep -E '^countries/[^/]+/cities/' /tmp/changes.txt; then exit 1; fi
          git commit -m 'Complete all remaining 407 China sight scores and worldwide audit'
          git push origin HEAD:refs/heads/audit/complete-china-407-sights-2026
