name: Surebets odds/history verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/surebets-odds-history-validation.yml'
      - 'surebets-odds-history-validation/run.txt'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout Surebets logical history branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/surebets_calculator
          ref: feat/logical-bet-history
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Run logical history regression tests
        working-directory: app
        run: flutter test test/logical_bet_history_test.dart test/bet_history_service_test.dart

      - name: Run Flutter analyzer
        working-directory: app
        run: flutter analyze

      - name: Run full Flutter test suite
        working-directory: app
        run: flutter test
