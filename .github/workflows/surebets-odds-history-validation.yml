name: Surebets remove fifth-active-odd paywall

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/surebets-odds-history-validation.yml'
      - 'surebets-odds-history-validation/run.txt'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout Surebets fix branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/surebets_calculator
          ref: fix/remove-fifth-active-odd-paywall
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Run fifth-active-odd regression
        working-directory: app
        run: flutter test test/fifth_active_odd_paywall_test.dart
