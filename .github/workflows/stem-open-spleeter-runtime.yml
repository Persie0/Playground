name: Stem open 5-stem TFLite runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stem-open-spleeter-runtime.yml'
      - 'stem-spleeter-audit/**'

permissions:
  contents: read

jobs:
  open-tflite-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download open 5-stem model and build payload
        run: |
          set -euxo pipefail
          mkdir -p stem-spleeter-audit/app/libs stem-spleeter-audit/app/src/main/assets .tools .model
          # AAR is needed only so the shared audit test source compiles; this test
          # never loads its ARM-only native library.
          curl -fL --retry 3 -o stem-spleeter-audit/app/libs/ttvspleeter.aar \
            https://raw.githubusercontent.com/FaceOnLive/Spleeter-Android-iOS/main/Android/app/libs/ttvspleeter.aar
          curl -fL --retry 3 -o .model/5stems.tar.gz \
            https://github.com/jinay1991/spleeter/releases/download/v2.3/5stems.tar.gz
          tar -tzf .model/5stems.tar.gz | tee .model/contents.txt
          tar -xzf .model/5stems.tar.gz -C .model
          MODEL="$(find .model -type f -name '5stems.tflite' -print -quit)"
          test -n "$MODEL"
          cp "$MODEL" stem-spleeter-audit/app/src/main/assets/5stems.tflite
          echo "model=$MODEL bytes=$(stat -c%s "$MODEL")"
          curl -fL --retry 3 -o .tools/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q .tools/gradle.zip -d .tools

      - name: Execute open 5-stem model on hardware-accelerated Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          heap-size: 1536M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: >-
            set +e; cd "$GITHUB_WORKSPACE/stem-spleeter-audit"; "$GITHUB_WORKSPACE/.tools/gradle-8.9/bin/gradle" :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.persie.spleeteraudit.OpenTflite5StemRuntimeTest --stacktrace --info; rc=$?; cd "$GITHUB_WORKSPACE"; adb logcat -d -v threadtime | grep -E 'OpenSpleeterAudit|tflite|tensorflow' > open-spleeter-runtime-log.txt || true; cat open-spleeter-runtime-log.txt || true; exit $rc

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stem-open-spleeter-runtime
          path: |
            open-spleeter-runtime-log.txt
            .model/contents.txt
            stem-spleeter-audit/app/build/reports/androidTests/connected/
            stem-spleeter-audit/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
