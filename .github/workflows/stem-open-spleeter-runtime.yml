name: Stem open 5-stem TFLite runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stem-open-spleeter-runtime.yml'
      - 'stem-spleeter-audit/**'

permissions:
  contents: read

jobs:
  open-tflite-arm64:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download open 5-stem model and build payload
        run: |
          set -euxo pipefail
          mkdir -p stem-spleeter-audit/app/libs stem-spleeter-audit/app/src/main/assets .tools .model
          curl -fL --retry 3 -o stem-spleeter-audit/app/libs/ttvspleeter.aar \
            https://raw.githubusercontent.com/FaceOnLive/Spleeter-Android-iOS/main/Android/app/libs/ttvspleeter.aar
          curl -fL --retry 3 -o .model/5stems.tar.gz \
            https://github.com/jinay1991/spleeter/releases/download/v2.3/5stems.tar.gz
          tar -tzf .model/5stems.tar.gz | tee .model/contents.txt
          tar -xzf .model/5stems.tar.gz -C .model
          MODEL="$(find .model -type f -name '5stems.tflite' -print -quit)"
          test -n "$MODEL"
          cp "$MODEL" stem-spleeter-audit/app/src/main/assets/5stems.tflite
          echo "model=$MODEL bytes=$(stat -f%z "$MODEL")"
          curl -fL --retry 3 -o .tools/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q .tools/gradle.zip -d .tools

      - name: Execute open 5-stem model on ARM64 Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: arm64-v8a
          profile: pixel_4
          cores: 4
          ram-size: 6144M
          heap-size: 1536M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set +e
            cd stem-spleeter-audit
            ../.tools/gradle-8.9/bin/gradle :app:connectedDebugAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.class=com.persie.spleeteraudit.OpenTflite5StemRuntimeTest \
              --stacktrace --info
            rc=$?
            cd ..
            adb logcat -d -v threadtime | grep -E 'OpenSpleeterAudit|tflite|tensorflow' > open-spleeter-runtime-log.txt || true
            cat open-spleeter-runtime-log.txt || true
            exit $rc

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stem-open-spleeter-arm64-runtime
          path: |
            open-spleeter-runtime-log.txt
            .model/contents.txt
            stem-spleeter-audit/app/build/reports/androidTests/connected/
            stem-spleeter-audit/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
