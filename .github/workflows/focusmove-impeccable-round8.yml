name: FocusMove Impeccable round 8 validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/focusmove-impeccable-round8.yml'
permissions:
  contents: read
concurrency:
  group: focusmove-impeccable-round8-validation
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Clone private source into ephemeral runner
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=fix/impeccable-round8-activity-action-state https://github.com/Persie0/pomodoroexercise.git source
          git -C source rev-parse HEAD
      - name: Format changed Dart files and push only formatting
        working-directory: source
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          dart format lib/src/features/timer/persistent_timer_controller.dart lib/src/screens/activities_home.dart test/impeccable_round8_test.dart
          if ! git diff --quiet; then
            git config user.name focusmove-ci-format
            git config user.email actions@users.noreply.github.com
            git add lib/src/features/timer/persistent_timer_controller.dart lib/src/screens/activities_home.dart test/impeccable_round8_test.dart
            git commit -m "style: format Impeccable round 8 UI changes"
            AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/impeccable-round8-activity-action-state
          fi
          git log -1 --format='VALIDATED_SOURCE_SHA=%H'
      - name: Resolve Flutter packages
        working-directory: source
        run: flutter pub get
      - name: Flutter static analysis
        working-directory: source
        run: flutter analyze
      - name: Activity-state widget regressions
        working-directory: source
        run: flutter test test/impeccable_round8_test.dart --reporter expanded
      - name: Entire Flutter test suite
        working-directory: source
        run: flutter test --reporter expanded
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile Android debug APK
        working-directory: source
        run: |
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
  ios:
    needs: flutter
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Clone the same private branch temporarily
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=fix/impeccable-round8-activity-action-state https://github.com/Persie0/pomodoroexercise.git source
          git -C source rev-parse HEAD
      - name: Compile unsigned iOS simulator build
        working-directory: source
        run: |
          flutter pub get
          flutter build ios --simulator --no-codesign
          test -d build/ios/iphonesimulator/Runner.app
