name: Resistor Scanner settings cleanup validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resistor-scanner-settings-cleanup-validation.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - uses: actions/checkout@v5
        with:
          repository: Persie0/resistor-scanner-android
          ref: fix/remove-scan-fps-default-autostop-on
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Verify Android settings behavior
        working-directory: app
        run: |
          set -euo pipefail
          FILE=app/src/main/java/at/austriao/resistorscanner/ui/ScannerScreen.kt
          grep -F 'getBoolean("auto_stop_enabled", true)' "$FILE"
          ! grep -F 'Maximum live scan rate' "$FILE"
          ! grep -F 'scanFps' "$FILE"
          ! grep -F 'scan_fps' "$FILE"

      - name: Unit tests and debug build
        working-directory: app
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - uses: actions/checkout@v5
        with:
          repository: Persie0/resistor-scanner-ios
          ref: fix/remove-scan-fps-default-autostop-on
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1
          path: app

      - name: Verify iOS settings behavior
        working-directory: app
        run: |
          set -euo pipefail
          VM=ResistorScanner/UI/ScannerViewModel.swift
          SETTINGS=ResistorScanner/UI/SettingsSheet.swift
          VIEW=ResistorScanner/UI/ScannerView.swift
          grep -F '@Published var autoStopEnabled = true' "$VM"
          grep -F 'SettingsKey.autoStopEnabled) as? Bool ?? true' "$VM"
          ! grep -F 'scanFps' "$VM"
          ! grep -F 'scan_fps' "$VM"
          ! grep -F 'Live scan speed' "$SETTINGS"
          ! grep -F 'Maximum scan rate' "$SETTINGS"
          ! grep -F 'scanFps' "$SETTINGS"
          ! grep -F 'scanFps:' "$VIEW"

      - name: Swift tests
        working-directory: app
        run: swift test

      - name: Resolve packages
        working-directory: app
        run: xcodebuild -resolvePackageDependencies -project ResistorScanner.xcodeproj -scheme ResistorScanner

      - name: Build iOS simulator
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild \
            -project ResistorScanner.xcodeproj \
            -scheme ResistorScanner \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/ios-build.log"
