name: SkipSilencePlayer round 6 inspect native screenshots
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/skipsilenceplayer-round6-inspect-ios-captures.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Retrieve existing iPhone and iPad PNG artifacts
        uses: actions/download-artifact@v4
        with:
          name: SkipSilencePlayer-round6-iOS-native-review
          run-id: 44977446103
          repository: Persie0/Playground
          github-token: ${{ github.token }}
          path: ios-review
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare screenshot previews without simulator rebuild
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          import base64
          import io
          from pathlib import Path
          from PIL import Image
          for kind in ("iPhone", "iPad"):
              path = Path("ios-review") / f"{kind}-home.png"
              if not path.exists():
                  print(f"SCREENSHOT_NOT_FOUND: {path}")
                  continue
              image = Image.open(path).convert("RGB")
              print(f"ORIGINAL {kind}: {image.size}", flush=True)
              image.thumbnail((700, 700))
              buffer = io.BytesIO()
              image.save(buffer, format="JPEG", quality=60, optimize=True)
              print(f"{kind}_RENDER_START", flush=True)
              print(base64.b64encode(buffer.getvalue()).decode("ascii"), flush=True)
              print(f"{kind}_RENDER_END", flush=True)
          PY
