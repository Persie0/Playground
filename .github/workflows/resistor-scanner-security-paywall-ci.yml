name: Resistor Scanner security/paywall validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resistor-scanner-security-paywall-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - uses: actions/checkout@v5
        with:
          repository: Persie0/resistor-scanner-android
          ref: feat/security-paywall-legal-branding
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Test and build
        working-directory: app
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

      - name: Verify package and encrypted models
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" | tee /tmp/apk-files.txt
          grep -F 'assets/models/resistor_segmenter.onnx.enc' /tmp/apk-files.txt
          grep -F 'assets/models/resistor_bandnet.onnx.enc' /tmp/apk-files.txt
          if grep -E 'assets/models/(resistor_segmenter|resistor_bandnet)\.onnx$' /tmp/apk-files.txt; then
            echo "Plaintext ONNX model packaged in APK" >&2
            exit 1
          fi
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT2="$(find "$SDK_ROOT/build-tools" -type f -name aapt2 -perm -u+x | sort -V | tail -n1)"
          "$AAPT2" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='at.austriao.resistor_scanner'" /tmp/badging.txt

  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - uses: actions/checkout@v5
        with:
          repository: Persie0/resistor-scanner-ios
          ref: feat/security-paywall-legal-branding
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1
          path: app

      - name: Run Swift tests
        working-directory: app
        run: swift test

      - name: Resolve packages
        working-directory: app
        run: xcodebuild -resolvePackageDependencies -project ResistorScanner.xcodeproj -scheme ResistorScanner

      - name: Build simulator app
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild \
            -project ResistorScanner.xcodeproj \
            -scheme ResistorScanner \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/ios-build.log"

      - name: Verify bundle id, launch assets, and encrypted models
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/ResistorScanner.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | tee /tmp/bundle-id.txt
          grep -Fx 'at.austriao.resistor-scanner' /tmp/bundle-id.txt
          test -s "$APP/Models/resistor_segmenter.onnx.enc"
          test -s "$APP/Models/resistor_bandnet.onnx.enc"
          test ! -e "$APP/Models/resistor_segmenter.onnx"
          test ! -e "$APP/Models/resistor_bandnet.onnx"
          test -e "$APP/Assets.car"
          test -e "$APP/Base.lproj/LaunchScreen.storyboardc" || test -e "$APP/LaunchScreen.storyboardc"
