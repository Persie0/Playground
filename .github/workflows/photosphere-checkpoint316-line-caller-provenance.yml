name: Photosphere checkpoint316 original line-bin caller scan
on:
  push:
    branches: [research/photosphere-checkpoint316-line-caller-provenance]
    paths: [.github/workflows/photosphere-checkpoint316-line-caller-provenance.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-caller-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install static ARM64 analysis dependencies
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools unicorn
      - name: Download hash-pinned original camera ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk'
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Checkout pinned decompile scanner read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: e19e575f5fb9ba345de304ba510e930d3ce34d08
          path: research
          sparse-checkout: |
            research/photosphere/checkpoint316
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Scan all original executable ARM64 .text BL instructions
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = e19e575f5fb9ba345de304ba510e930d3ce34d08
          python3 research/research/photosphere/checkpoint316/scan_original_line_bin_callers.py original.so --output checkpoint316-original-direct-callers.json | tee checkpoint316-original-direct-callers.log
          grep -q '^CHECKPOINT316_ORIGINAL_DIRECT_CALLERS' checkpoint316-original-direct-callers.log
          python3 research/research/photosphere/checkpoint316/native_original_secondary_mask_gate.py original.so --output checkpoint316-original-secondary-mask.json | tee checkpoint316-original-secondary-mask.log
          grep -q '^CHECKPOINT316_ORIGINAL_SECONDARY_MASK_PASS' checkpoint316-original-secondary-mask.log
          echo CHECKPOINT316_SECONDARY_MASK_JSON_BEGIN
          cat checkpoint316-original-secondary-mask.json
          echo CHECKPOINT316_SECONDARY_MASK_JSON_END
          echo CHECKPOINT316_DIRECT_CALLERS_JSON_BEGIN
          cat checkpoint316-original-direct-callers.json
          echo CHECKPOINT316_DIRECT_CALLERS_JSON_END
      - name: Read-only checkout checkpoint316 Rust app
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: e984346047e58567792c6c595cde4fde362e6aac
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Compare fresh original ARM64 observations with Rust oracles
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = e984346047e58567792c6c595cde4fde362e6aac
          python3 - <<'PY'
          import json
          from pathlib import Path
          for actual,expected in [
              ('checkpoint316-original-direct-callers.json', 'app/tests/fixtures/native_original_line_bin_direct_callers_316.json'),
              ('checkpoint316-original-secondary-mask.json','app/tests/fixtures/native_original_secondary_mask_gate_316.json'),
          ]:
              a=json.loads(Path(actual).read_text())
              b=json.loads(Path(expected).read_text())
              assert a==b,(actual,expected)
              print("CHECKPOINT316_ORIGINAL_RUST_FIXTURE_EQUAL",expected)
          PY
      - name: Rust checkpoint316 focused and full regression
        run: |
          set -euo pipefail
          cd app
          rustfmt --edition 2021 --check src/native_line_secondary_mask.rs
          cargo test --lib checkpoint316 -- --nocapture
          cargo test --lib
      - name: Print formatted Rust secondary gate
        run: |
          echo CHECKPOINT316_RUST_FORMATTED_BEGIN
          cat app/src/native_line_secondary_mask.rs
          echo CHECKPOINT316_RUST_FORMATTED_END
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint316-original-direct-callers
          path: |
            checkpoint316-original-direct-callers.json
            checkpoint316-original-direct-callers.log
            checkpoint316-original-secondary-mask.json
            checkpoint316-original-secondary-mask.log
          retention-days: 14
