name: FocusMove Step 16 focused Pose Lab regression tests
on:
  push:
    paths:
      - '.github/workflows/pomodoroexercise-pose-lab-step16-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Clone Pose Lab feature branch privately
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/16-debug-pose-lab https://github.com/Persie0/pomodoroexercise.git source
      - name: Validate only Pose Lab data integrity and camera-off widget tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter test test/pose_lab_data_test.dart test/pose_lab_widget_test.dart --reporter expanded --timeout 45s
