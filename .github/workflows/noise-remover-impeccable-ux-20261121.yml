name: Noise Remover Impeccable UX branch validation
# Fifteenth-pass final: Android-native findings and WCAG dark/light contrast regression

on:
  push:
    branches:
      - validation/noise-remover-impeccable-ux-20261121
    paths:
      - .github/workflows/noise-remover-impeccable-ux-20261121.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Format, analyze, and test Noise Remover
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Require a private repository access token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout Noise Remover UX branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/noise_remover
          ref: feature/impeccable-noise-remover-ux
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - name: Authenticate private Git dependencies
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: git config --global url."https://x-access-token:${PRIVATE_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate localizations
        working-directory: app
        run: flutter gen-l10n

      - name: Align changed UI files with Material UI migration
        working-directory: app
        run: |
          for file in \
            lib/screens/about_legal_page.dart \
            lib/screens/audio_recording_screen.dart \
            lib/screens/bulk_processing_screen.dart \
            lib/screens/general_settings_page.dart \
            lib/screens/help_screen.dart \
            lib/screens/home_screen.dart \
            lib/screens/paywall_screen.dart \
            lib/screens/processing_screen.dart \
            lib/screens/processing_settings_page.dart \
            lib/screens/result_screen.dart \
            lib/screens/settings_screen.dart \
            lib/screens/storage_settings_page.dart \
            lib/widgets/audio_waveform_preview.dart \
            lib/widgets/language_picker_sheet.dart \
            lib/widgets/model_option_widget.dart \
            lib/widgets/paywall_package_choice.dart \
            lib/widgets/paywall_unavailable_panel.dart \
            lib/widgets/pro_status_badge.dart \
            lib/widgets/processing_estimate_dialog.dart \
            lib/widgets/result_error_panel.dart \
            lib/widgets/result_source_selector.dart \
            lib/widgets/storage_usage_indicator.dart; do
            sed -i 's#package:flutter/material.dart#package:material_ui/material_ui.dart#g' "$file"
          done

      - name: Format touched Dart files
        working-directory: app
        run: |
          dart format \
            lib/screens/home_screen.dart \
            lib/screens/result_screen.dart \
            lib/screens/processing_screen.dart \
            lib/screens/bulk_processing_screen.dart \
            lib/widgets/audio_waveform_preview.dart \
            test/audio_waveform_preview_test.dart \
            test/impeccable_ux_regression_test.dart \
            test/video_media_detection_regression_test.dart \
            lib/screens/audio_recording_screen.dart \
            lib/screens/settings_screen.dart \
            lib/utils/recording_level_meter.dart \
            test/recording_ux_regression_test.dart \
            test/impeccable_fourth_pass_test.dart \
            test/impeccable_fifth_pass_test.dart \
            lib/screens/help_screen.dart \
            test/help_screen_test.dart \
            lib/widgets/pro_status_badge.dart \
            lib/widgets/result_source_selector.dart \
            test/impeccable_sixth_pass_test.dart \
            lib/widgets/result_error_panel.dart \
            test/impeccable_seventh_pass_test.dart \
            lib/screens/general_settings_page.dart \
            lib/screens/processing_settings_page.dart \
            lib/screens/storage_settings_page.dart \
            lib/widgets/language_picker_sheet.dart \
            test/impeccable_eighth_pass_test.dart \
            lib/screens/paywall_screen.dart \
            lib/widgets/model_option_widget.dart \
            lib/widgets/processing_estimate_dialog.dart \
            lib/widgets/paywall_package_choice.dart \
            test/impeccable_ninth_pass_test.dart \
            lib/widgets/paywall_unavailable_panel.dart \
            test/impeccable_tenth_pass_test.dart \
            lib/screens/about_legal_page.dart \
            test/impeccable_eleventh_pass_test.dart \
            lib/widgets/storage_usage_indicator.dart \
            test/impeccable_twelfth_pass_test.dart \
            test/impeccable_thirteenth_pass_test.dart \
            lib/utils/destructive_action_gate.dart \
            test/impeccable_fourteenth_pass_test.dart \
            lib/widgets/bulk_header_title.dart \
            lib/screenshot_harness.dart \
            test/impeccable_fifteenth_pass_test.dart \
            lib/theme.dart \
            test/impeccable_contrast_regression_test.dart
          git diff --check

      - name: Analyze changed source and tests
        working-directory: app
        run: |
          dart analyze \
            lib/screens/home_screen.dart \
            lib/screens/result_screen.dart \
            lib/screens/processing_screen.dart \
            lib/screens/bulk_processing_screen.dart \
            lib/widgets/audio_waveform_preview.dart \
            test/audio_waveform_preview_test.dart \
            test/impeccable_ux_regression_test.dart \
            test/video_media_detection_regression_test.dart \
            lib/screens/audio_recording_screen.dart \
            lib/screens/settings_screen.dart \
            lib/utils/recording_level_meter.dart \
            test/recording_ux_regression_test.dart \
            test/impeccable_fourth_pass_test.dart \
            test/impeccable_fifth_pass_test.dart \
            lib/screens/help_screen.dart \
            test/help_screen_test.dart \
            lib/widgets/pro_status_badge.dart \
            lib/widgets/result_source_selector.dart \
            test/impeccable_sixth_pass_test.dart \
            lib/widgets/result_error_panel.dart \
            test/impeccable_seventh_pass_test.dart \
            lib/screens/general_settings_page.dart \
            lib/screens/processing_settings_page.dart \
            lib/screens/storage_settings_page.dart \
            lib/widgets/language_picker_sheet.dart \
            test/impeccable_eighth_pass_test.dart \
            lib/screens/paywall_screen.dart \
            lib/widgets/model_option_widget.dart \
            lib/widgets/processing_estimate_dialog.dart \
            lib/widgets/paywall_package_choice.dart \
            test/impeccable_ninth_pass_test.dart \
            lib/widgets/paywall_unavailable_panel.dart \
            test/impeccable_tenth_pass_test.dart \
            lib/screens/about_legal_page.dart \
            test/impeccable_eleventh_pass_test.dart \
            lib/widgets/storage_usage_indicator.dart \
            test/impeccable_twelfth_pass_test.dart \
            test/impeccable_thirteenth_pass_test.dart \
            lib/utils/destructive_action_gate.dart \
            test/impeccable_fourteenth_pass_test.dart \
            lib/widgets/bulk_header_title.dart \
            lib/screenshot_harness.dart \
            test/impeccable_fifteenth_pass_test.dart \
            lib/theme.dart \
            test/impeccable_contrast_regression_test.dart

      - name: Run Flutter test suite
        working-directory: app
        run: flutter test --no-pub --reporter expanded

      - name: Commit formatter changes to feature branch
        working-directory: app
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git add \
            lib/screens/home_screen.dart \
            lib/screens/result_screen.dart \
            lib/screens/processing_screen.dart \
            lib/screens/bulk_processing_screen.dart \
            lib/widgets/audio_waveform_preview.dart \
            test/audio_waveform_preview_test.dart \
            test/impeccable_ux_regression_test.dart \
            test/video_media_detection_regression_test.dart \
            lib/screens/audio_recording_screen.dart \
            lib/screens/settings_screen.dart \
            lib/utils/recording_level_meter.dart \
            test/recording_ux_regression_test.dart \
            test/impeccable_fourth_pass_test.dart \
            test/impeccable_fifth_pass_test.dart \
            lib/screens/help_screen.dart \
            test/help_screen_test.dart \
            lib/widgets/pro_status_badge.dart \
            lib/widgets/result_source_selector.dart \
            test/impeccable_sixth_pass_test.dart \
            lib/widgets/result_error_panel.dart \
            test/impeccable_seventh_pass_test.dart \
            lib/screens/general_settings_page.dart \
            lib/screens/processing_settings_page.dart \
            lib/screens/storage_settings_page.dart \
            lib/widgets/language_picker_sheet.dart \
            test/impeccable_eighth_pass_test.dart \
            lib/screens/paywall_screen.dart \
            lib/widgets/model_option_widget.dart \
            lib/widgets/processing_estimate_dialog.dart \
            lib/widgets/paywall_package_choice.dart \
            test/impeccable_ninth_pass_test.dart \
            lib/widgets/paywall_unavailable_panel.dart \
            test/impeccable_tenth_pass_test.dart \
            lib/screens/about_legal_page.dart \
            test/impeccable_eleventh_pass_test.dart \
            lib/widgets/storage_usage_indicator.dart \
            test/impeccable_twelfth_pass_test.dart \
            test/impeccable_thirteenth_pass_test.dart \
            lib/utils/destructive_action_gate.dart \
            test/impeccable_fourteenth_pass_test.dart \
            lib/widgets/bulk_header_title.dart \
            lib/screenshot_harness.dart \
            test/impeccable_fifteenth_pass_test.dart \
            lib/theme.dart \
            test/impeccable_contrast_regression_test.dart
          if ! git diff --cached --quiet; then
            git -c user.name='Playground UI validation' \
              -c user.email='github-actions[bot]@users.noreply.github.com' \
              commit -m 'style: format Noise Remover Impeccable UI changes'
            git push "https://x-access-token:${PRIVATE_TOKEN}@github.com/Persie0/noise_remover.git" \
              HEAD:refs/heads/feature/impeccable-noise-remover-ux
          fi
