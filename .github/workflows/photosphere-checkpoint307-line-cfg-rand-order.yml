name: Photosphere checkpoint307 original line call CFG
on:
  push:
    branches: [research/photosphere-checkpoint307-line-cfg-rand-order]
    paths: [.github/workflows/photosphere-checkpoint307-line-cfg-rand-order.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install original ELF tools
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools unicorn
      - name: Download sha-pinned original Google Camera ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk'
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Derive original LineAligner CFG and RNG entry branch constraints
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee checkpoint307-original-cfg.log
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from collections import deque
          from hashlib import sha256
          import json
          b=Path('original.so').read_bytes()
          assert sha256(b).hexdigest()=='878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1'
          lo,hi=0x303cf8,0x305618
          ins=list(Cs(CS_ARCH_ARM64,CS_MODE_ARM).disasm(b[lo:hi],lo))
          inst={i.address:i for i in ins}
          edges={}
          unresolved=[]
          for i in ins:
            pc=i.address;nm=i.mnemonic;nextpc=pc+4
            if nm in ('ret','eret','br'):
              dest=[]
            elif nm=='b' or nm.startswith(('b.','cbz','cbnz','tbz','tbnz')):
              token=i.op_str.split(',')[-1].strip()
              if not token.startswith('#0x'):
                unresolved.append((hex(pc),nm,i.op_str));continue
              target=int(token[1:],16)
              dest=[target] if nm=='b' else [nextpc,target]
            else:
              dest=[nextpc]
            edges[pc]=[a for a in dest if a in inst]
          def reach(a,goal,blocked=()):
            q=deque([(a,0)]);seen={a}|set(blocked)
            while q:
              here,dist=q.popleft()
              if here==goal:return dist,len(seen)
              for nxt in edges.get(here,()):
                if nxt not in seen:seen.add(nxt);q.append((nxt,dist+1))
            return None,len(seen)
          checks=[
            ('entry_to_early_line',lo,0x304254,()),
            ('entry_to_later_ransac',lo,0x304f48,()),
            ('entry_to_ransac_avoiding_early_line',lo,0x304f48,(0x304254,)),
            ('early_line_to_later_ransac',0x304254,0x304f48,()),
            ('later_ransac_to_early_line',0x304f48,0x304254,()),
            ('line_disabled_branch_to_ransac',0x3042d0,0x304f48,()),
            ('line_enabled_continuation_to_ransac',0x304258,0x304f48,()),
          ]
          for label,a,z,block in checks:
            depth,visited=reach(a,z,block)
            print('CHECKPOINT307_CFG',label,'hops',depth,'visited',visited)
          for name,p in [('LINE_FLAG',0x30420c),('LINE_CALL',0x304254),('ALT_CALL',0x304318),('RANSAC_GATE',0x304edc),('RANSAC_CALL',0x304f48),('LINE_NEXT',0x304258)]:
            i=inst[p];print('CHECKPOINT307_PIN',name,hex(p),i.mnemonic,i.op_str,'edges',[hex(x) for x in edges[p]])
          print('CHECKPOINT307_GRAPH_COUNTS',len(inst),len(edges),sum(len(a) for a in edges.values()),'unresolved',unresolved[:50])
          print('CHECKPOINT307_CFG_SCAN_PASS')
          PY
          grep -q '^CHECKPOINT307_CFG_SCAN_PASS' checkpoint307-original-cfg.log
      - name: Checkout SHA-pinned original checkpoint307 research
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: fc5fc7e28126c2a5e50c010ff2e3c04811d8af79
          path: research
          sparse-checkout: |
            research/photosphere/checkpoint307
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify complete original CFG and execute 11 original ARM64 multi-draw streams
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = fc5fc7e28126c2a5e50c010ff2e3c04811d8af79
          python3 research/research/photosphere/checkpoint307/verify_original_line_cfg.py original.so --output checkpoint307-line-cfg.json | tee checkpoint307-cfg-verifier.log
          python3 research/research/photosphere/checkpoint307/native_original_line_multidraw.py original.so --output checkpoint307-native-multidraw.json | tee checkpoint307-native-multidraw.log
          grep -q '^CHECKPOINT307_ORIGINAL_CFG_VERIFIED' checkpoint307-cfg-verifier.log
          grep -q '^CHECKPOINT307_ORIGINAL_MULTIDRAW_VERIFIED' checkpoint307-native-multidraw.log
          grep -q '^CHECKPOINT307_ORIGINAL_COMPACT_WRITTEN' checkpoint307-native-multidraw.log
          grep -q '^CHECKPOINT307_ORIGINAL_COUNT_ONE_TERMINAL_VERIFIED 7' checkpoint307-native-multidraw.log
          python3 research/research/photosphere/checkpoint307/analyze_device_rng_trace.py --self-test | tee checkpoint307-offline-auditor.log
          grep -q '^CHECKPOINT307_OFFLINE_FRIDA_AUDITOR_SELF_TEST_PASS' checkpoint307-offline-auditor.log
          node --check research/research/photosphere/checkpoint307/device-process-libc-rng.frida.js
          echo CHECKPOINT307_GLOBAL_LIBC_TRACE_SYNTAX_PASS
      - name: Checkout pinned PhotosphereCleanroom checkpoint307 Rust parity tests
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 95217aba36008f9e6409f80584bf176842795ce5
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify original ARM64 stateful candidate corpus against Rust and full library tests
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = 95217aba36008f9e6409f80584bf176842795ce5
          python3 - <<'PY'
          from pathlib import Path
          import json
          original=json.loads(Path("checkpoint307-native-multidraw-compact.json").read_text())
          rust=json.loads(Path("app/tests/fixtures/native_original_line_multidraw_307.json").read_text())
          if original!=rust:
              for k in sorted(set(original)|set(rust)):
                  if original.get(k)!=rust.get(k):
                      print("CHECKPOINT307_NATIVE_RUST_DIFFERENCE",k)
                      if k=="cases":
                          for i,(x,y) in enumerate(zip(original[k],rust[k])):
                              for sub in sorted(set(x)|set(y)):
                                  if x.get(sub)!=y.get(sub):
                                      print("CHECKPOINT307_NATIVE_RUST_CASE_DIFFERENCE",i,sub,repr(x.get(sub))[:200],repr(y.get(sub))[:200])
                      else:
                          print("CHECKPOINT307_NATIVE_RUST_TOP_DIFFERENCE",repr(original.get(k))[:200],repr(rust.get(k))[:200])
              raise AssertionError("Original native checkpoint307 oracle diverged from the Rust fixture")
          assert original["original_executed_scenarios"]==11
          assert original["original_executed_draw_total"]==52
          assert original["original_count_one_terminal_draw_scenarios"]==7
          print("CHECKPOINT307_NATIVE_RUST_45_DRAW_EQUAL",original["original_executed_scenarios"],original["original_executed_draw_total"])
          PY
          cd app
          git diff --check
          rustfmt --edition 2021 --check src/native_line_candidate_rng_checkpoint307_test.rs
          cargo test --lib checkpoint307_ -- --nocapture
          cargo test --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint307-source-cfg
          path: |
            checkpoint307-original-cfg.log
            checkpoint307-line-cfg.json
            checkpoint307-cfg-verifier.log
            checkpoint307-native-multidraw.json
            checkpoint307-native-multidraw.log
            checkpoint307-native-multidraw-compact.json
            checkpoint307-offline-auditor.log
          retention-days: 14
