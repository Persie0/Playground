name: Head Scanner release-1 model contract
on:
  push:
    paths:
      - .github/workflows/head-scanner-model-contract.yml
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/head_scanner
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -q onnx onnxruntime numpy
      - name: Download, SHA-verify and convert Head_model release 1
        run: python source/scripts/prepare_model.py
      - name: Run mobile ONNX and validate triangle indices
        run: |
          python - <<'PY'
          import numpy as np, onnxruntime as ort, pathlib, struct
          model = pathlib.Path('source/android/app/src/main/assets/headscan_lite.onnx')
          faces = pathlib.Path('source/android/app/src/main/assets/head_faces.bin').read_bytes()
          s = ort.SessionOptions()
          s.intra_op_num_threads=2
          session = ort.InferenceSession(str(model), sess_options=s, providers=['CPUExecutionProvider'])
          for i in session.get_inputs():
              print('input',i.name,i.shape,i.type)
          xs=np.zeros((1,8,3,256,256),dtype=np.float32)
          poses=np.zeros((1,8,2),dtype=np.float32)
          valid=np.zeros((1,8),dtype=np.uint8); valid[0,0]=1
          vertex, = session.run(['vertices_mm'],dict(images=xs,view_angles=poses,view_valid=valid))
          assert vertex.ndim==3 and vertex.shape[0]==1 and vertex.shape[-1]==3,vertex.shape
          assert np.isfinite(vertex).all()
          count=struct.unpack_from('<I',faces,0)[0]
          assert len(faces)==4+count*6
          triangles=np.frombuffer(faces,dtype='<u2',offset=4)
          assert np.max(triangles)<vertex.shape[1]
          print('PASS', vertex.shape, count, 'triangles',model.stat().st_size/1e6,'MB')
          PY
