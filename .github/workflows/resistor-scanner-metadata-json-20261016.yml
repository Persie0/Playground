name: Resistor Scanner PP-LiteSeg metadata CI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/resistor-scanner-metadata-json-20261016.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Resistor Scanner fix branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/resistor-scanner-android
          ref: fix/jvm-model-metadata-json-test
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android API 37.0
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-37.0" ||
            sdkmanager --channel=3 "platforms;android-37.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Run Kotlin unit tests
        working-directory: app
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --stacktrace

      - name: Run release lint
        working-directory: app
        shell: bash
        run: ./gradlew --no-daemon :app:lintRelease --stacktrace

      - name: Print test failures
        if: failure()
        working-directory: app
        shell: bash
        run: |
          find app/build/test-results -name '*.xml' -print -exec grep -nE '<failure|<error' {} \; || true
