name: Photosphere checkpoint256 Rust actual second AddImage parity (one shot)
on:
  push:
    branches: [ci/photosphere-checkpoint256-second-addimage]
    paths: ['.github/workflows/photosphere-checkpoint256-rust.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint256-rust-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-two-addimage-rust:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'ci: run photosphere checkpoint256 rust once'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 74a5fb294bb230ced84c0b15773e3e31e8f029d6
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Verify exact executable source revision
        run: test "$(git rev-parse HEAD)" = "74a5fb294bb230ced84c0b15773e3e31e8f029d6"
      - name: Verify original two native AddImage feature owners and source descriptor parity
        run: cargo test --locked checkpoint256_original_two_addimage_feature_owner_and_descriptor_parity -- --nocapture
      - name: Run all Rust regression suites
        run: cargo test --locked
