name: Verify resistor segmentation progress

on:
  push:
    paths:
      - '.github/workflows/verify_resistor_segmentation_progress.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resistor_model feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/resistor_model
          ref: feature/segmentation-progress-checkpoints

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,segmentation,export]'

      - name: Run segmentation tests
        run: |
          pytest -q \
            tests/test_segmentation.py \
            tests/test_segmentation_train.py \
            tests/test_segmentation_export.py \
            tests/test_colab_segmentation.py

      - name: Run one-epoch checkpoint and progress smoke test
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image

          root = Path('/tmp/tiny_seg')
          for split, count in [('train', 2), ('valid', 1), ('test', 1)]:
              d = root / split
              d.mkdir(parents=True, exist_ok=True)
              images = []
              annotations = []
              for i in range(count):
                  file_name = f'{split}_{i}.png'
                  Image.new('RGB', (64, 64), 'white').save(d / file_name)
                  images.append({'id': i + 1, 'file_name': file_name, 'width': 64, 'height': 64})
                  annotations.append({
                      'id': i + 1,
                      'image_id': i + 1,
                      'category_id': 1,
                      'segmentation': [[8, 24, 56, 24, 56, 40, 8, 40]],
                      'bbox': [8, 24, 48, 16],
                      'area': 768,
                      'iscrowd': 0,
                  })
              payload = {
                  'images': images,
                  'categories': [{'id': 1, 'name': 'resistor'}],
                  'annotations': annotations,
              }
              (d / '_annotations.coco.json').write_text(json.dumps(payload), encoding='utf-8')
          PY
          python -u -m resistor_model.train_segmentation \
            --dataset-root /tmp/tiny_seg \
            --output-dir /tmp/seg_run \
            --category resistor \
            --image-size 64 \
            --epochs 1 \
            --batch-size 2 \
            --num-workers 0 \
            --progress-every 1 \
            --checkpoint-every 1 \
            --cpu
          test -s /tmp/seg_run/last.pt
          test -s /tmp/seg_run/best.pt
          test -s /tmp/seg_run/checkpoints/epoch_001.pt
          test -s /tmp/seg_run/metrics.jsonl
          test -s /tmp/seg_run/summary.json
          python - <<'PY'
          import torch
          checkpoint = torch.load('/tmp/seg_run/last.pt', map_location='cpu')
          assert 'scaler' in checkpoint
          assert checkpoint['epoch'] == 0
          print('checkpoint keys verified')
          PY
