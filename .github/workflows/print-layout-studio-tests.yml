name: Print Layout Studio browser and unit tests

# Public CI trigger for Print Layout Studio. The source ref can be temporarily
# pointed at an implementation branch for red/green regression verification.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/print-layout-studio-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - name: Check out the public print-layout-studio source
        run: git clone --depth 1 --branch fix/layout-audit-20260928 https://github.com/Persie0/print-layout-studio.git source

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: source
        run: pnpm test

      - name: Run lint
        working-directory: source
        run: pnpm run lint

      - name: Check TypeScript
        working-directory: source
        run: pnpm exec tsc --noEmit

      - name: Install Chromium for Playwright
        working-directory: source
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser usage tests
        working-directory: source
        run: pnpm test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: print-layout-playwright-${{ github.run_id }}
          path: source/test-results
          if-no-files-found: ignore
          retention-days: 1
