name: Print Layout Studio browser and unit tests

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/print-layout-studio-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Check out the public print-layout-studio source
        run: git clone --depth 1 --branch main https://github.com/Persie0/print-layout-studio.git source

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: source
        run: pnpm test

      - name: Run lint
        working-directory: source
        run: pnpm run lint

      - name: Check TypeScript
        working-directory: source
        run: pnpm exec tsc --noEmit

      - name: Install Chromium for Playwright
        working-directory: source
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser usage tests
        working-directory: source
        run: pnpm test:e2e
