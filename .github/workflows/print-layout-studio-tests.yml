name: Print Layout Studio browser and unit tests

# Each run checks the latest print-layout-studio main; this workflow file is the public trigger.
# Retriggered after waiting for the saved orientation setting.
# Triggered for the Sep 2026 full-sheet preview and OCR-size UI update.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/print-layout-studio-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - name: Check out the public print-layout-studio source
        run: git clone --depth 1 --branch main https://github.com/Persie0/print-layout-studio.git source

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: source
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        working-directory: source
        run: pnpm test

      - name: Run lint
        working-directory: source
        run: pnpm run lint

      - name: Check TypeScript
        working-directory: source
        run: pnpm exec tsc --noEmit

      - name: Install Chromium for Playwright
        working-directory: source
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser usage tests
        working-directory: source
        run: pnpm test:e2e
# Triggered for Markdown tables and inline math, split text blocks, and image navigation.
# Retriggered after correcting preview fit and browser assertions.

# Triggered for disabled action contrast, typed-text OCR sizing, viewer deletion, and full-height sheet preview.

# Retriggered with per-group print numbering and updated browser checks.

# Retriggered after adding adjustable image-matched text sizing.

# Added a wait for the persisted OCR result before the reload assertion.

# Retriggered after page switching, paste undo, and group image numbering changes.

# Retriggered for portable workspace export/import, group balancing, OCR-matched text, and portrait printing.

# Retriggered after correcting the browser workflow expectations and reload timing.

# Retriggered after waiting for imported data and group assignments to persist before assertions.

# Retriggered after fixing print page flow and the intact-group balance scenario.

# Retriggered with PDF pagination diagnostics and saved balance results.

# Retriggered with page geometry and persisted move assertions.

# Retriggered after constraining the print document to the selected sheet width.

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: print-layout-playwright-${{ github.run_id }}
          path: source/test-results
          if-no-files-found: ignore
          retention-days: 1

