name: NomadRank map fade (public CI)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA in Persie0/skratch_clone
        required: false
        default: fix/smooth-scratch-map-zoom-fade-20261027
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/nomadrank-smooth-map-ci.yml'

permissions:
  contents: read

jobs:
  flutter-map:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout NomadRank privately
        uses: actions/checkout@v4
        with:
          repository: Persie0/skratch_clone
          ref: ${{ inputs.ref || 'fix/smooth-scratch-map-zoom-fade-20261027' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze changed Dart files
        run: flutter analyze --no-pub lib/utils/map_style.dart lib/screens/scratch_map_screen.dart test/map_style_test.dart
      - name: Test map style and curtain helpers
        run: flutter test --no-pub test/map_style_test.dart
      - name: Apply Dart formatter
        run: dart format lib/utils/map_style.dart lib/screens/scratch_map_screen.dart test/map_style_test.dart
      - name: Commit formatter-only changes back to the private feature branch
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git add lib/utils/map_style.dart lib/screens/scratch_map_screen.dart test/map_style_test.dart
          if git diff --cached --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "Playground CI"
          git config user.email "playground-ci@users.noreply.github.com"
          git commit -m "style: apply dart format to map fade implementation"
          AUTH="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/smooth-scratch-map-zoom-fade-20261027
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib/utils/map_style.dart lib/screens/scratch_map_screen.dart test/map_style_test.dart
