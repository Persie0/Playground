name: Temporary AudioBooster player asset red gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-audiobooster-player-asset-red.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check out AudioBooster feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: feature/player-example-button-highlight
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: audiobooster
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: audiobooster
        run: flutter pub get
      - name: Run focused tests
        working-directory: audiobooster
        run: flutter test test/home_history_tutorial_test.dart
