name: Photosphere 447 original five-pair point-cost data
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-447-live-point-cost.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-447-native-cost
  cancel-in-progress: false
jobs:
  source-postgraph:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout SHA-pinned private research read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 86eac3adf53f9164c91cf8eecbf6b03cc08784bf
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Exact research SHA and Python syntax
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 86eac3adf53f9164c91cf8eecbf6b03cc08784bf
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py research/photosphere/checkpoint437/live_fourth_original_postgraph.py research/photosphere/checkpoint438/scan_postgraph_import_abi.py research/photosphere/checkpoint439/host_math_import_join.py research/photosphere/checkpoint440/live_four_pair_fov_copy.py research/photosphere/checkpoint441/live_six_pair_solver_gate.py research/photosphere/checkpoint442/live_six_pair_native_camera_getters.py
      - name: Verify source-original pinned APK and ELF hashes
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Pin original postgraph import symbol and ABI
        working-directory: research-src
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint438/scan_postgraph_import_abi.py research/native/liblightcycle.so --output checkpoint447-source-import.json
      - name: Source-run five original 40-byte point cost buffers from native matcher rows
        working-directory: research-src
        env:
          PHOTOSPHERE_THIRD_SHIFT407: '2'
          PHOTOSPHERE_FOURTH_COST447: '1'
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py > checkpoint447-source.log 2> checkpoint447-diagnostic.log || {
            echo CHECKPOINT447_ORIGINAL_SOURCE_RUN_FAILED
            tail -n 100 checkpoint447-diagnostic.log
            tail -n 6 checkpoint447-source.log | cut -c1-180
            exit 1
          }
          python3 - <<'PY'
          import json
          row=next(x for x in open('checkpoint447-source.log') if x.startswith('CHECKPOINT395_NATIVE_POINT_SETUP_THIRD_ROBUST_ENTRY_REPORT='))
          d=json.loads(row.split('=',1)[1])
          g=d['checkpoint436_fourth_original_finalizer_graph']
          p=d['checkpoint437_fourth_original_postgraph']
          original=json.load(open('checkpoint447-source-import.json'))
          assert d['original_elf_sha256']==original['original_elf_sha256']
          assert g['source_original_graph_entry_and_return_verified']
          assert p['source_original_same_estimator_verified']
          assert p['source_original_graph_completed']
          assert p['source_original_postgraph_entry_reached']
          assert p['source_original_upstream_virtual_w0_still_test_supplied']
          assert p['source_original_postgraph_test_controlled_host_math']
          assert not p['source_original_bionic_libm_parity_proven']
          assert not p['source_original_imported_postgraph_libm_not_host_supplied']
          assert p['source_original_import_symbol_verified_from_pinned_elf']==original['original_import_symbol']
          assert p['source_original_import_calls']
          assert p['source_original_solver_boundary_not_crossed']
          assert p['source_original_ceres_not_executed']
          before=p['source_original_postgraph_pair_before']['pairs']
          after=p['source_original_postgraph_pair_after']['pairs']
          assert len(before)==len(after)==6
          assert [r['status_u32'] for r in before]==[0,0,0,0,2,0]
          assert [r['endpoints'] for r in after]==[r['endpoints'] for r in before]
          assert p['source_original_postgraph_completed']
          assert len(p['source_original_status_loads'])==6
          assert p['source_original_440_status_gate_all_completed']
          gate=p['source_original_status_gate_440']
          assert [x['pair_index'] for x in gate]==list(range(6)),gate
          assert [x['status_u32'] for x in gate]==[0,0,0,0,2,0],gate
          assert [x['next_pc'] for x in gate]==[
            '0x11cf18','0x11cf18','0x11cf18','0x11cf18','0x11cefc','0x11cf18'],gate
          assert len(p['source_original_pair_status_field_writes'])==0
          assert all(a['status_u32']==b['status_u32'] for a,b in zip(before,after))
          assert original['original_import_symbol']=='sin'
          solver=d['checkpoint441_fourth_original_solver_gate']
          assert solver['source_original_same_six_matcher_pair_records_verified']
          assert solver['source_original_solver_vtable_target']=='0x1287c0'
          assert solver['source_original_solver_vcall_at_0x123020_not_executed']
          assert solver['source_original_bounded_inner_loop_abi_join']
          assert solver['source_original_full_ceres_not_executed']
          assert solver['source_original_solver_pair_loop_completed'], solver.get('source_original_solver_pair_loop_error')
          assert solver['source_original_source_pair_records_unchanged']
          assert solver['source_original_pair_sha256_before']==solver['source_original_pair_sha256_after']
          assert not solver['source_original_pair_buffer_writes']
          native_rows=solver['source_original_solver_pair_rows']
          assert len(native_rows)==7
          assert [r['source_original_status_u32'] for r in native_rows]==[0,0,0,0,2,0,None]
          assert [r['source_original_branch'] for r in native_rows]==[
            'eligible','eligible','eligible','eligible','skipped','eligible','exhausted']
          assert [r['source_original_predicate_w0'] for r in native_rows]==[1,1,1,1,0,1,None]
          assert [r['source_original_endpoint_load_reached'] for r in native_rows]==[
            True,True,True,True,False,True,False]
          assert [r['source_original_pair_endpoints'] for r in native_rows]==[
            [0,1],[0,2],[1,2],[0,3],None,[2,3],None]
          getters=d['checkpoint442_fourth_original_native_getters']
          assert getters['source_original_same_live_six_matcher_pair_records_verified']
          assert not getters['source_original_provider_child_vector_test_supplied']
          assert getters['source_original_provider_child_vector_already_populated']
          assert getters['source_original_provider_native_child_count']==4
          assert getters['source_original_sample_table_base_test_supplied']
          assert getters['source_original_provider_getter_target']=='0x3448d0'
          assert getters['source_original_center_getter_target']=='0x330ebc'
          assert getters['source_original_focal_getter_target']=='0x330eb4'
          assert getters['source_original_child_cameras_original_provider_owned']
          assert getters['source_original_child_camera_cloning_not_reexecuted_at_this_join']
          assert getters['source_original_three_getter_bodies_native_executed'],getters.get('source_original_callback_execution_error')
          assert not getters['source_original_full_solver_or_ceres_executed']
          assert not getters['source_original_residual_construction_executed']
          assert getters['source_original_pair_buffer_unchanged']
          assert getters['source_original_source_camera_unchanged']
          assert getters['source_original_provider_owned_children_unchanged']
          assert getters['source_original_provider_owner_header_unchanged']
          assert getters['source_original_source_pairs_sha256_before']==getters['source_original_source_pairs_sha256_after']
          assert not getters['source_original_pair_buffer_write_events']
          cb_rows=getters['source_original_callback_rows']
          assert len(cb_rows)==6
          assert [r['status_u32'] for r in cb_rows]==[0,0,0,0,2,0]
          assert [r['source_original_callback_calls'] for r in cb_rows]==[3,3,3,3,0,3]
          assert [r['native_solver_gate_skipped'] for r in cb_rows]==[False,False,False,False,True,False]
          assert all(r.get('source_original_center_matches_source_child_bytes')
                     and r.get('source_original_focal_matches_source_child_bytes')
                     for r in cb_rows if not r['native_solver_gate_skipped'])
          assert getters['source_original_residual_dispatch_443_requested']
          assert getters['source_original_residual_dispatch_443_completed'],getters.get('source_original_callback_execution_error')
          assert not getters['source_original_residual_numeric_bodies_executed_443']
          assert getters['source_original_nested_vector_payloads_unchanged_443']
          rows443=d['checkpoint443_fourth_original_residual_dispatch']
          raw_vectors=getters['source_original_matcher_owned_nested_vectors_443']
          assert len(rows443)==len(raw_vectors)==6
          assert [r['pair_index'] for r in rows443]==list(range(6))
          assert [r['status_u32'] for r in rows443]==[0,0,0,0,2,0]
          assert all(v['point28']['stride']==28 and v['line36']['stride']==36
                     for v in raw_vectors)
          assert [r['point28_count'] for r in rows443]==[
            v['point28']['count'] for v in raw_vectors]
          assert [r['line36_count'] for r in rows443]==[
            v['line36']['count'] for v in raw_vectors]
          assert [r['native_solver_gate_skipped'] for r in rows443]==[
            False,False,False,False,True,False]
          assert all(not r['native_residual_dispatch_executed'] if r['native_solver_gate_skipped']
                     else r['native_residual_dispatch_executed']
                     for r in rows443)
          def expected_native_branch(r):
            if r['native_solver_gate_skipped']: return None
            return ('0x129a64' if r['line36_count'] else
                    '0x128da8' if r['point28_count'] else '0x128b10')
          assert all(r.get('source_original_native_branch_stop')==expected_native_branch(r)
                     for r in rows443)
          assert all(r.get('source_original_native_branch_pcs',[None])[0]=='0x128d84'
                     for r in rows443 if not r['native_solver_gate_skipped'])
          setup=getters['source_original_first_point_setup_rows_444']
          assert getters['source_original_first_point_setup_444_requested']
          assert getters['source_original_first_point_setup_444_completed'],getters.get('source_original_callback_execution_error')
          assert getters['source_original_point_setup_loss_factory_executed_444']
          assert not getters['source_original_first_point_numeric_residual_executed_444']
          assert len(setup)==6
          assert setup==d['checkpoint444_fourth_original_first_point_setup']
          assert [r['pair_index'] for r in setup]==list(range(6))
          assert [r['status_u32'] for r in setup]==[0,0,0,0,2,0]
          assert [r['source_native_point_row_count'] for r in setup]==[25,15,16,11,0,19]
          assert [r['source_original_first_point_setup_executed'] for r in setup]==[
            True,True,True,True,False,True]
          expected_point_pcs=['0x128da8','0x128dac','0x128db0',
                              '0x128e38','0x128e3c','0x128e40']
          for row in setup:
            if row['native_solver_gate_skipped']:
              assert row['pair_index']==4 and not row['source_original_first_point_setup_executed']
              continue
            assert row['source_original_point_setup_pcs']==expected_point_pcs
            assert row['source_original_point_iteration_x24']==0
            assert row['source_original_point_offset_x25']==0
            assert row['source_original_first_helper_call_pc']=='0x128e40'
            assert row['source_original_first_helper_target_pc']=='0x129e80'
            assert row['source_original_first_helper_not_executed']
            assert row['source_original_source_points_unchanged']
            assert len(bytes.fromhex(row['source_original_first_point_source_28_bytes_hex']))==28
            assert row['source_original_first_point_begin_x28']==raw_vectors[row['pair_index']]['point28']['begin']
          assert sum(r['source_native_point_row_count'] for r in setup)==86
          loss=getters['source_original_loss_call_445_rows']
          assert getters['source_original_loss_call_445_requested']
          assert getters['source_original_loss_call_445_completed'],getters.get('source_original_callback_execution_error')
          assert not getters['source_original_loss_factory_direct_vm_call_used_445']
          assert not getters['source_original_ceres_cost_functor_executed_445']
          assert not getters['source_original_full_solver_Ceres_executed_445']
          original_options=getters['source_original_elf_options_selector_rodata_445']
          assert original_options['word_pc']=='0x619f0'
          assert original_options['original_word_u32']==1
          options_source=d['checkpoint446_fourth_source_original_options']
          assert getters['source_original_options_init_446_requested']
          assert getters['source_original_options_init_446_completed']
          assert getters['source_original_options_prologue_handoff_446_completed']
          assert getters['source_original_options_loss_selector_no_w0_substitution_446']
          assert getters['source_original_loss_call_446_completed'],getters.get('source_original_callback_execution_error')
          assert options_source==getters['source_original_options_native_owner_446']
          assert options_source['source_original_mov_w20_one_pc']=='0x11ed50'
          assert options_source['source_original_solver_store_x2_pc']=='0x1287e4'
          assert options_source['source_original_initialization_pcs']==[
            hex(pc) for pc in range(0x11ed64,0x11ed90,4)]
          assert options_source['source_original_native_option_words']=={
            'match_loss_selector':1,'max_iterations':50,
            'sensor_prior_choice':1,'allow_no_convergence':1}
          assert options_source['source_original_options_bytes_written_only_by_original_arm64']
          assert options_source['source_original_source_options_pointer_x2_test_supplied']
          assert options_source['source_original_original_full_prologue_not_executed']
          assert options_source['source_original_original_finalizer_full_call_not_executed']
          assert not options_source['source_original_original_w0_register_override_used']
          assert original_options['source_original_factory_caller_pc']=='0x128e40'
          assert original_options['source_original_factory_entry_pc']=='0x129e80'
          assert original_options['source_original_factory_return_pc']=='0x128e44'
          assert not original_options['option_stack_frame_naturally_executed']
          assert loss==d['checkpoint445_fourth_original_loss_caller']
          assert len(loss)==6
          assert [r['pair_index'] for r in loss]==list(range(6))
          assert [r['status_u32'] for r in loss]==[0,0,0,0,2,0]
          assert [r['source_original_loss_factory_caller_executed'] for r in loss]==[
            True,True,True,True,False,True]
          import struct
          huber_bits=struct.unpack('<Q',struct.pack('<d',35.0))[0]
          for row in loss:
            if row['native_solver_gate_skipped']:
              assert row['pair_index']==4 and not row['source_original_loss_factory_caller_executed']
              continue
            assert not row['source_original_source_options_stack_not_executed']
            assert row['source_original_native_option_initializer_executed_446']
            assert row['source_original_native_prologue_pointer_store_executed_446']
            assert row['source_original_native_w0_no_register_patch_446']
            assert row['source_original_selector_from_elf_rodata']==1
            assert isinstance(row['original_native_caller_w0_before_abi_join'],int)
            assert row['original_native_caller_w0_before_abi_join']==1
            assert not row['source_original_selector_abi_join_test_controlled']
            assert row['source_original_real_native_bl_entry_pc']=='0x128e40'
            assert row['source_original_native_factory_method_pc']=='0x129e80'
            assert row['source_original_native_factory_return_pc']=='0x128e44'
            assert row['source_original_loss_factory_entry_count']==1
            assert row['source_original_loss_vtable_ptr']=='0x3fe228'
            assert row['source_original_huber_delta_f64_bits']==huber_bits
            assert row['source_original_loss_object_matches_huber_delta35']
            assert row['source_original_first_28_matcher_row_unchanged']
            assert len(bytes.fromhex(row['original_returned_loss_object_16_bytes_hex']))==16
            assert row['source_original_loss_code_trace_pcs'][-1]=='0x128e44'
          costs=getters['source_original_point_cost_447_rows']
          assert costs==d['checkpoint447_fourth_original_point_cost_payload']
          assert getters['source_original_point_cost_447_requested']
          assert getters['source_original_point_cost_447_completed'],getters.get('source_original_callback_execution_error')
          assert getters['source_original_point_cost_447_allocator_source_called']
          assert getters['source_original_point_cost_447_functor_allocation_not_executed']
          assert getters['source_original_point_cost_447_Ceres_problem_not_executed']
          assert len(costs)==6
          assert [r['pair_index'] for r in costs]==list(range(6))
          assert [r['status_u32'] for r in costs]==[0,0,0,0,2,0]
          assert [r['source_original_point_cost_payload_written'] for r in costs]==[
            True,True,True,True,False,True]
          expected_cost_pcs=['0x128e44','0x128e48','0x128e4c',
            '0x128e50','0x128e54','0x128e58','0x128e5c','0x128e60',
            '0x128e64','0x128e68','0x128e6c','0x128e70',
            '0x128e74','0x128e78','0x128e7c','0x128e80']
          for row in costs:
            if row['native_solver_gate_skipped']:
              assert row['pair_index']==4
              continue
            assert row['source_original_native_cost_payload_allocation_bytes']==40
            assert row['source_original_native_cost_allocator_pc']=='0x3f19f4'
            assert row['source_original_native_cost_allocator_entry_count']==1
            assert row['source_original_native_4f32_to_4f64_verified']
            assert row['source_original_native_weight_scale_f32_preserved']
            assert row['source_original_original_source_rows_unchanged']
            assert row['source_original_native_cost_payload_source_pcs']==expected_cost_pcs
            assert row['source_original_native_cost_payload_stop_pc']=='0x128e80'
            assert row['source_original_next_cost_functor_allocation_not_executed']
            assert row['source_original_native_cost_payload_prefix_36_hex']==row['source_original_expected_source_28_row_widening_hex']
            native_payload=bytes.fromhex(row['source_original_native_cost_payload_prefix_36_hex'])
            native_match=bytes.fromhex(row['source_original_matcher_row_28_hex'])
            assert len(native_payload)==36 and len(native_match)==28
            f32=struct.unpack('<4f',native_match[:16])
            assert native_payload==struct.pack('<4d',*f32)+native_match[24:28]
            assert row['source_original_loss_ptr_owner_x26']==loss[row['pair_index']]['original_returned_loss_object_ptr']
          assert sum(r['source_original_point_cost_payload_written'] for r in costs)==5
          fov=d['checkpoint440_fourth_original_fov_copy']
          assert fov['source_original_same_six_matcher_pairs_verified']
          assert fov['source_original_graph_and_postgraph_returned']
          assert fov['source_original_fov_owner_pointer_test_supplied']
          receipt={
            'elf_sha256':d['original_elf_sha256'],
            'source_import':original,
            'host_libm_approximation':True,
            'bionic_parity_proven':False,
            'full_session_flush_executed':False,
            'full_ceres_executed':False,
            'source_original_postgraph_completed':p['source_original_postgraph_completed'],
            'native_postgraph_error':p.get('source_original_postgraph_execution_error'),
            'source_original_postgraph_pc_trace':p['source_original_postgraph_pc_trace'],
            'source_original_import_calls':p['source_original_import_calls'],
            'source_original_status_loads':p['source_original_status_loads'],
            'source_original_status_branches':p['source_original_status_branches'],
            'source_original_weight_writes':p['source_original_weight_writes'],
            'source_original_pair_buffer_writes':p['source_original_pair_buffer_writes'],
            'source_original_pair_status_field_writes':p['source_original_pair_status_field_writes'],
            'source_original_pairs_before':before,
            'source_original_pairs_after':after,
            'source_original_model_count_callback':p.get('source_original_model_count_callback'),
            'source_original_status_gate_440':gate,
            'source_original_fov_copy_440':fov,
            'source_original_solver_gate_441':solver,
            'source_original_native_getters_442':getters,
            'source_original_residual_branch_rows_443':rows443,
            'source_original_matcher_owned_nested_vectors_443':raw_vectors,
            'source_original_first_point_setup_rows_444':setup,
            'source_original_loss_caller_rows_445':loss,
            'source_original_options_selector_rodata_445':original_options,
            'source_original_native_written_options_446':options_source,
            'source_original_point_cost_payload_447':costs
          }
          with open('checkpoint447-source-receipt.json','w') as f:
            json.dump(receipt,f,indent=2,sort_keys=True);f.write('\n')
          print('CHECKPOINT447_NATIVE_POSTGRAPH_SOURCE',json.dumps({
            'symbol':original['original_import_symbol'],
            'host_calls':len(p['source_original_import_calls']),
            'postgraph_return':p['source_original_postgraph_completed'],
            'last_boundary':p.get('source_original_postgraph_execution_error'),
            'status_loads':len(p['source_original_status_loads']),
            'status_writes':len(p['source_original_pair_status_field_writes']),
            'statuses_after':[r['status_u32'] for r in after],
            'status_gate_next_pcs':[r['next_pc'] for r in gate],
            'fov_copies_completed':fov['source_original_four_vector_copy_completed'],
            'fov_copies_verified':fov['source_original_four_vector_copy_verified'],
            'native_fov_copy_error':fov.get('source_original_copy_execution_error'),
            'native_fov_validation_error':fov.get('source_original_copy_validation_error'),
            'fov_helper_visits':fov['source_original_original_helper_visits'],
            'solver_vtable_target':solver['source_original_solver_vtable_target'],
            'solver_status_rows':len(native_rows),
            'solver_branches':[r['source_original_branch'] for r in native_rows],
            'solver_source_buffer_unchanged':solver['source_original_source_pair_records_unchanged'],
            'source_owned_children':len(getters['source_original_provider_owned_child_addresses']),
            'native_getter_calls':sum(x['source_original_callback_calls'] for x in cb_rows),
            'native_provider_getter_target':getters['source_original_provider_getter_target'],
            'native_center_getter_target':getters['source_original_center_getter_target'],
            'native_focal_getter_target':getters['source_original_focal_getter_target'],
            'source_pair_buffer_unchanged':getters['source_original_pair_buffer_unchanged'],
            'native_getter_error':getters.get('source_original_callback_execution_error'),
            'residual_point_row_counts':[r['point28_count'] for r in rows443],
            'residual_line_row_counts':[r['line36_count'] for r in rows443],
            'residual_original_branch_pcs':[r.get('source_original_native_branch_stop') for r in rows443],
            'residual_original_dispatch_verified':getters['source_original_residual_dispatch_443_completed'],
