name: Traffic config simplification

on:
  push:
    branches:
      - traffic-analysis-quality-fixes
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPOSITORY: Persie0/traffic-counting-light-main
  TARGET_REF: refactor/simplify-traffic-heatmap-config

jobs:
  review-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Playground
        uses: actions/checkout@v4

      - name: Checkout traffic branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: target
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused dependencies
        run: python -m pip install numpy opencv-python-headless pytest pyyaml easydict loguru

      - name: Run review regression tests
        working-directory: target/edge
        run: PYTHONPATH=src python -m pytest -q tests/test_config.py tests/test_analysis_pipeline.py tests/test_waiting_detector.py tests/test_occupied_area.py tests/test_traffic_renderer.py tests/test_traffic_stage.py tests/test_traffic_replay.py

      - name: Historical replay after config simplification
        working-directory: target/edge
        run: |
          rm -rf /tmp/review-replay
          PYTHONPATH=src python scripts/replay_traffic_heatmaps.py \
            --tracks ../experiments/intersection_analysis/heatmaps/tracks_bytetrack.csv \
            --image ../experiments/intersection_analysis/heatmaps/frame.jpg \
            --out /tmp/review-replay \
            --conf 0.5 \
            --grid-width 384 \
            --grid-height 288
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          out = Path("/tmp/review-replay")
          benchmark = json.loads((out / "replay_benchmark.json").read_text())
          with sqlite3.connect(out / "traffic_analysis.sqlite3") as connection:
              events = connection.execute("SELECT COUNT(*) FROM waiting_events").fetchone()[0]
              tracks = connection.execute("SELECT COUNT(DISTINCT track_id) FROM waiting_events").fetchone()[0]
          print("historical_waiting_events=", events)
          print("historical_unique_waiting_tracks=", tracks)
          print("analysis_ms_per_frame=", benchmark["analysis_ms_per_frame"])
          assert 50 <= events <= 200
          assert benchmark["analysis_ms_per_frame"] < 1.0
          PY
