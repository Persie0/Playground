name: Archive Audiobooster Flutter app

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-audiobooster-flutter-once.yml'

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ensure private repository token
        env:
          ARCHIVE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARCHIVE_TOKEN"

      - name: Checkout Audiobooster
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: source
          fetch-depth: 1

      - name: Checkout private Flutter archive
        uses: actions/checkout@v4
        with:
          repository: Persie0/oldflutter
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: archive
          fetch-depth: 1

      - name: Copy complete tracked legacy Flutter project
        shell: bash
        run: |
          set -euo pipefail
          test -f source/old/pubspec.yaml
          test -d source/old/lib
          if [ -e archive/Audiobooster ]; then
            diff -qr -- source/old archive/Audiobooster
          else
            mkdir -p archive/Audiobooster
            cp -a source/old/. archive/Audiobooster/
          fi
          diff -qr -- source/old archive/Audiobooster

      - name: Commit and verify archive before any deletion
        shell: bash
        run: |
          set -euo pipefail
          git -C archive config user.name "github-actions[bot]"
          git -C archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C archive add -f -A -- Audiobooster
          source_count=$(git -C source ls-files -- old/ | wc -l)
          archive_count=$(git -C archive ls-files -- Audiobooster/ | wc -l)
          echo "Audiobooster tracked files: $source_count -> $archive_count"
          test "$source_count" -eq 211
          test "$source_count" -eq "$archive_count"
          if ! git -C archive diff --cached --quiet; then
            git -C archive commit -m "Archive original Audiobooster Flutter application [skip ci]"
            git -C archive push origin HEAD:main
          fi
          git -C archive fetch --quiet origin main
          test "$(git -C archive rev-parse HEAD)" = "$(git -C archive rev-parse origin/main)"
          diff -qr -- source/old archive/Audiobooster
          git -C archive ls-tree -r --name-only HEAD Audiobooster/ > archive-files.txt
          test "$(wc -l < archive-files.txt)" -eq "$source_count"

      - name: Delete only archived old directory in Kotlin repository
        shell: bash
        run: |
          set -euo pipefail
          remote_head=$(git -C source ls-remote origin refs/heads/main | cut -f1)
          test -n "$remote_head"
          test "$(git -C source rev-parse HEAD)" = "$remote_head"
          diff -qr -- source/old archive/Audiobooster
          git -C source config user.name "github-actions[bot]"
          git -C source config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C source rm -r -- old
          git -C source commit -m "Move legacy Flutter implementation into Persie0/oldflutter/Audiobooster [skip ci]"
          git -C source push origin HEAD:main
          if git -C source ls-tree -r --name-only HEAD | grep -q '^old/'; then
            echo "::error::Old Flutter directory still tracked"
            exit 1
          fi

      - name: Migration summary
        shell: bash
        run: |
          {
            echo "## Audiobooster Flutter migration successful"
            echo "Archive: [Persie0/oldflutter/Audiobooster](https://github.com/Persie0/oldflutter/tree/main/Audiobooster)"
            echo "Source: [Persie0/Audiobooster](https://github.com/Persie0/Audiobooster)"
          } >> "$GITHUB_STEP_SUMMARY"
