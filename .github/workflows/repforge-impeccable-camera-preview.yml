name: RepForge Impeccable camera privacy and UX (public Playground)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repforge-impeccable-camera-preview.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Fetch pinned private RepForge code using public-runner secret
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          SOURCE_BRANCH: fix/impeccable-camera-privacy-a11y-20261122
          SOURCE_SHA: ba429c9c3d0cd5d50bdc00a1056ebd2d272ca78e
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'No access secret provided'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --quiet --depth 1 --branch "$SOURCE_BRANCH" \
            https://github.com/Persie0/gameexercise.git source
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA" || {
            echo 'Private revision mismatch; refusing to test another commit'; exit 1;
          }
      - name: Flutter analysis, camera regressions and full test suite
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get > /tmp/camera_pub.log 2>&1 || {
            tail -n 80 /tmp/camera_pub.log; exit 1;
          }
          dart format --output=none lib test > /tmp/camera_format.log 2>&1 || {
            tail -n 100 /tmp/camera_format.log; exit 1;
          }
          flutter analyze > /tmp/camera_analysis.log 2>&1 || {
            tail -n 160 /tmp/camera_analysis.log; exit 1;
          }
          flutter test test/forge_camera_setup_screen_test.dart --reporter expanded > /tmp/camera_focus.log 2>&1 || {
            tail -n 200 /tmp/camera_focus.log | cut -c 1-280; exit 1;
          }
          flutter test --reporter compact > /tmp/camera_full.log 2>&1 || {
            tr '\r' '\n' < /tmp/camera_full.log |
              grep -E '\[E\]|TestFailure|Expected:|Actual:|The test description was:' |
              tail -n 80 | cut -c 1-240 || true
            tail -n 140 /tmp/camera_full.log | cut -c 1-250
            exit 1
          }
          tail -n 5 /tmp/camera_analysis.log
          tr '\r' '\n' < /tmp/camera_full.log | tail -n 4 | cut -c 1-170
      - name: Produce inspectable Flutter widget screenshots with real fonts
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          SCREENSHOT_TEXT_FONT="$(fc-match -f '%{file}' 'DejaVu Sans')"
          SCREENSHOT_MATERIAL_FONT="$(find "$FLUTTER_ROOT/bin/cache" -name MaterialIcons-Regular.otf -print -quit)"
          test -s "$SCREENSHOT_TEXT_FONT"
          test -s "$SCREENSHOT_MATERIAL_FONT"
          export SCREENSHOT_TEXT_FONT SCREENSHOT_MATERIAL_FONT
          flutter test test/camera_visual_capture.dart --update-goldens --reporter expanded > /tmp/camera_visual.log 2>&1 || {
            tail -n 150 /tmp/camera_visual.log | cut -c 1-280; exit 1;
          }
          test -s test/goldens/camera_320_de_text200.png
          test -s test/goldens/camera_900_en.png
          echo 'Camera preview widget captures generated; no physical camera or Android emulator involved'
      - name: Upload actual widget captures (fail if absent)
        uses: actions/upload-artifact@v4
        with:
          name: repforge-camera-ux-captures
          path: source/test/goldens/camera_*.png
          if-no-files-found: error
          retention-days: 7
      - name: Compile Android debug APK, not published
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          flutter build apk --debug > /tmp/camera_apk.log 2>&1 || {
            tail -n 120 /tmp/camera_apk.log | cut -c 1-280; exit 1;
          }
          test -s build/app/outputs/flutter-apk/app-debug.apk
          echo 'Android debug build completed; APK not uploaded'
