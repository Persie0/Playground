name: Image Enhancer post83 UX quality hardening
# Final revalidation after save-and-continue dialog and guard coverage.
on:
  push:
    branches: [image-enhancer-post83-ux-hardening-20261121]
    paths:
      - .github/workflows/image_enhancer_post83_quality_validation.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-enhancer-post83-quality-validation
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout private image editor through public Playground
        uses: actions/checkout@v4
        with:
          repository: Persie0/image_enhancer
          ref: impeccable/post83-quality-safety-accessibility
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: image_enhancer
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        working-directory: image_enhancer
        run: flutter pub get --enforce-lockfile
      - name: Generate all app localizations
        working-directory: image_enhancer
        run: flutter gen-l10n
      - name: Focused UX and localization regression tests
        working-directory: image_enhancer
        run: |
          flutter test \
            test/impeccable_post83_quality_safety_test.dart \
            test/impeccable_live_batch_queue_test.dart \
            test/result_comparison_page_test.dart \
            test/batch_recovery_ux_test.dart \
            test/new_locale_arb_coverage_test.dart \
            test/play_locale_arb_integration_test.dart \
            --timeout 2m --reporter expanded
      - name: Strict Flutter analyzer without ignored diagnostics
        working-directory: image_enhancer
        run: flutter analyze
      - name: Complete Flutter test suite
        working-directory: image_enhancer
        run: flutter test --concurrency=2 --timeout 2m --reporter compact
