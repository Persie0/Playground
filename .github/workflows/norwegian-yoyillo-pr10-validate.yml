name: Validate Norwegian YoYillo PR10

on:
  push:
    paths:
      - '.github/workflows/norwegian-yoyillo-pr10-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate private repository token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout Norwegian YoYillo PR branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/norwegian_yoyillo
          ref: feature/engagement-soft-paywall
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Format changed Dart files
        working-directory: app
        run: |
          dart format \
            lib/screens/flashcards/flashcards_screen.dart \
            lib/services/soft_paywall_trigger.dart \
            lib/services/subscription_service.dart \
            lib/utils/norwegian_gap_utils.dart \
            test/engagement_soft_paywall_pro_guard_test.dart \
            test/providers/word_provider_test.dart \
            test/utils/pinyin_utils_test.dart

      - name: Push formatting fixes if needed
        working-directory: app
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "Formatting already clean."
            exit 0
          fi
          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/screens/flashcards/flashcards_screen.dart \
            lib/services/soft_paywall_trigger.dart \
            lib/services/subscription_service.dart \
            lib/utils/norwegian_gap_utils.dart \
            test/engagement_soft_paywall_pro_guard_test.dart \
            test/providers/word_provider_test.dart \
            test/utils/pinyin_utils_test.dart
          git commit -m 'style: format PR10 changes [skip ci]'
          git remote set-url origin "https://x-access-token:${PRIVATE_TOKEN}@github.com/Persie0/norwegian_yoyillo.git"
          git push origin HEAD:feature/engagement-soft-paywall

      - name: Run soft-paywall regression test
        working-directory: app
        run: flutter test test/engagement_soft_paywall_pro_guard_test.dart

      - name: Run full Flutter test suite
        working-directory: app
        run: flutter test
