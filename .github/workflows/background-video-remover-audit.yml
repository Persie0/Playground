name: Background Video Remover audit validation
# Final PR #5 validation after preview error-state fixes

on:
  push:
    branches: [ci/background-video-remover-audit-20261104]
    paths: [.github/workflows/background-video-remover-audit.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout private app source
        uses: actions/checkout@v4
        with:
          repository: Persie0/BackgroundVideoRemover
          ref: fix/processing-reliability-audit-20261104
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          # API 37 is not available on hosted CI; test against API 36 without
          # modifying the real private repository's target SDK.
          sed -i -e 's/compileSdk = 37/compileSdk = 36/' \
                 -e 's/targetSdk = 37/targetSdk = 36/' \
                 -e 's/compose-bom:2026.09.00/compose-bom:2026.05.00/' app/android/app/build.gradle.kts
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Run Android tests and build
        working-directory: app/android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout private app source
        uses: actions/checkout@v4
        with:
          repository: Persie0/BackgroundVideoRemover
          ref: fix/processing-reliability-audit-20261104
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - name: Build iOS Simulator application
        working-directory: app
        run: |
          xcodebuild -project ios/BackgroundVideoRemover.xcodeproj \
            -scheme BackgroundVideoRemover \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
      - name: Compile iOS integration tests
        working-directory: app
        run: |
          xcodebuild -project ios/BackgroundVideoRemover.xcodeproj \
            -scheme BackgroundVideoRemover \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Run tests if a simulator is installed
        working-directory: app
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available | sed -nE '/iPhone /s/.*\\(([0-9A-Fa-f-]{36})\\).*/\\1/p' | head -1 || true)
          if [ -z "$DEVICE" ]; then
            echo "No iPhone simulator is installed on this runner; device integration tests were not executed."
            exit 0
          fi
          xcodebuild -project ios/BackgroundVideoRemover.xcodeproj \
            -scheme BackgroundVideoRemover \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO test
