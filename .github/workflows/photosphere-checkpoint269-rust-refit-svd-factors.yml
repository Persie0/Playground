name: Photosphere checkpoint269 original full-refit SVD factors Rust parity (one-shot)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint269-rust-refit-svd-factors.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-parity-singletons
  cancel-in-progress: false
jobs:
  production-original-refit-covariance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned private app via public Playground
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 2f04022485f6ef09095cd671a29a2bb946996a3a
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify source
        run: test "$(git rev-parse HEAD)" = "2f04022485f6ef09095cd671a29a2bb946996a3a"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - name: Compare all 21 original refit SVD factor bits
        run: |
          set -euo pipefail
          if ! cargo test --locked --lib checkpoint269_original_addimage_full_refit_svd_factors_bit_exact -- --nocapture > checkpoint269-focused.log 2>&1; then
            tail -n 120 checkpoint269-focused.log
            exit 1
          fi
          grep -q 'test result: ok. 1 passed; 0 failed' checkpoint269-focused.log
          tail -n 20 checkpoint269-focused.log
      - name: Run complete Rust library regression suite
        run: |
          set -euo pipefail
          if ! cargo test --locked --lib > checkpoint269-all.log 2>&1; then
            tail -n 120 checkpoint269-all.log
            exit 1
          fi
          grep -E 'test result:' checkpoint269-all.log | tail -2
      - name: Archive validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint269-rust-refit-svd-factors
          path: |
            checkpoint269-focused.log
            checkpoint269-all.log
          if-no-files-found: warn
          retention-days: 14
