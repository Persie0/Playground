name: Sync Face Scanner lockfile

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/face-scanner-sync-lock.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Face Scanner fix
        uses: actions/checkout@v4
        with:
          repository: Persie0/face_scanner
          ref: fix/save-image-to-gallery
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: face_scanner
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: face_scanner
        run: flutter pub get
      - name: Commit regenerated lockfile
        working-directory: face_scanner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo "pubspec.lock already current"
            exit 0
          fi
          git commit -m "chore: update gallery save dependencies lockfile"
          git push origin HEAD:fix/save-image-to-gallery
