name: PDF Studio merged-main smoke tests
# Run Flutter analysis and tests in public Playground only.
on:
  push:
    paths:
      - .github/workflows/pdfapp-v2-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-studio-merged-main-smoke
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private PDF Studio main
        uses: actions/checkout@v4
        with:
          repository: Persie0/pdfapp
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze and test PDF Studio
        run: |
          flutter pub get
          flutter analyze
          flutter test
