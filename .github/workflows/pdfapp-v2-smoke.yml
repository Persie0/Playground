name: PDF Studio UI feature smoke tests
# Validate the full PDF Studio UX pass: tools, reader, pages and redaction.
on:
  push:
    paths:
      - .github/workflows/pdfapp-v2-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-studio-v2-smoke
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PDF Studio UX branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/pdfapp
          ref: feature/impeccable-ux-overhaul
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve and validate
        run: |
          flutter pub get
          flutter analyze
          flutter test
