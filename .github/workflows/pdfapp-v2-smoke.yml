name: PDF Studio v2 current-head smoke tests
# Verify saved signature lint fix and all tests.
on:
  push:
    paths:
      - .github/workflows/pdfapp-v2-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-studio-v2-smoke
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest PDF Studio feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/pdfapp
          ref: feature/all-pdf-tools-v2
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve and validate
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Persist resolved Flutter dependency lockfile
        env:
          PUSH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git add pubspec.lock
          if git diff --cached --quiet; then
            echo "Dependency lock already current"
            exit 0
          fi
          git config user.name "Persie0 Playground CI"
          git config user.email "76871553+Persie0@users.noreply.github.com"
          git commit -m "chore: resolve locked Flutter dependencies for PDF Studio v2"
          git fetch "https://x-access-token:${PUSH_TOKEN}@github.com/Persie0/pdfapp.git" feature/all-pdf-tools-v2
          git rebase FETCH_HEAD
          GIT_TERMINAL_PROMPT=0 git push \
            "https://x-access-token:${PUSH_TOKEN}@github.com/Persie0/pdfapp.git" \
            HEAD:refs/heads/feature/all-pdf-tools-v2
