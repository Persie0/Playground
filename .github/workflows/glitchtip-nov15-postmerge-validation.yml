name: GlitchTip Nov 15 merged-fix validation (public)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/glitchtip-nov15-postmerge-validation.yml
  workflow_dispatch:
permissions:
  contents: write

concurrency:
  group: glitchtip-nov15-postmerge
  cancel-in-progress: true

jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Verify private clone token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Checkout NomadRank privately
        uses: actions/checkout@v4
        with:
          repository: Persie0/skratch_clone
          ref: master
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: nomadrank

      - name: NomadRank dependencies
        working-directory: nomadrank
        run: flutter pub get

      - name: NomadRank formatting
        continue-on-error: true
        id: nomad_format
        working-directory: nomadrank
        run: dart format --output=none --set-exit-if-changed lib/utils/map_style.dart test/map_style_test.dart

      - name: NomadRank map analyzer
        continue-on-error: true
        id: nomad_analyze
        working-directory: nomadrank
        run: flutter analyze --no-pub --no-fatal-infos lib/utils/map_style.dart test/map_style_test.dart lib/screens/scratch_map_screen.dart

      - name: NomadRank bundled-style tests
        continue-on-error: true
        id: nomad_test
        working-directory: nomadrank
        run: flutter test --no-pub test/map_style_test.dart

      - name: Checkout Noise Remover privately
        uses: actions/checkout@v4
        with:
          repository: Persie0/noise_remover
          ref: master
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: noise_remover

      - name: Noise Remover dependencies
        working-directory: noise_remover
        run: flutter pub get

      - name: Noise Remover formatting
        continue-on-error: true
        id: noise_format
        working-directory: noise_remover
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/services/revenuecat_startup_timeout_policy.dart \
            lib/services/expected_processing_event.dart \
            lib/services/exceptions.dart \
            test/services/revenuecat_startup_timeout_policy_test.dart \
            test/expected_processing_event_test.dart

      - name: Noise Remover analyzer
        continue-on-error: true
        id: noise_analyze
        working-directory: noise_remover
        run: |
          flutter analyze --no-pub --no-fatal-infos \
            lib/services/revenuecat_startup_timeout_policy.dart \
            lib/services/expected_processing_event.dart \
            lib/services/exceptions.dart \
            lib/screens/bulk_processing_screen.dart \
            lib/services/subscription_service.dart \
            lib/main.dart \
            test/services/revenuecat_startup_timeout_policy_test.dart \
            test/expected_processing_event_test.dart

      - name: Noise Remover focused regression tests
        continue-on-error: true
        id: noise_test
        working-directory: noise_remover
        run: |
          flutter test --no-pub \
            test/services/revenuecat_startup_timeout_policy_test.dart \
            test/expected_processing_event_test.dart \
            test/bulk_report_pro_refresh_regression_test.dart

      - name: Checkout Surebets privately
        uses: actions/checkout@v4
        with:
          repository: Persie0/surebets_calculator
          ref: master
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: surebets

      - name: Surebets dependencies
        working-directory: surebets
        run: flutter pub get

      - name: Surebets billing analyzer
        continue-on-error: true
        id: surebets_analyze
        working-directory: surebets
        run: |
          flutter analyze --no-pub \
            lib/services/purchase_feedback_policy.dart \
            lib/services/purchase_error_policy.dart \
            test/purchase_feedback_policy_test.dart \
            test/purchase_error_policy_test.dart

      - name: Surebets purchase tests
        continue-on-error: true
        id: surebets_test
        working-directory: surebets
        run: |
          flutter test --no-pub \
            test/purchase_feedback_policy_test.dart \
            test/purchase_error_policy_test.dart

      - name: Record public validation result for review
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const status = {
              run_id: context.runId,
              run_number: context.runNumber,
              source_commit: context.sha,
              conclusion: "${{ (steps.nomad_analyze.outcome == 'success' && steps.nomad_test.outcome == 'success' && steps.noise_analyze.outcome == 'success' && steps.noise_test.outcome == 'success' && steps.surebets_analyze.outcome == 'success' && steps.surebets_test.outcome == 'success') && 'success' || 'failure' }}",
              steps: {
                nomad_format: "${{ steps.nomad_format.outcome }}",
                nomad_analyze: "${{ steps.nomad_analyze.outcome }}",
                nomad_test: "${{ steps.nomad_test.outcome }}",
                noise_format: "${{ steps.noise_format.outcome }}",
                noise_analyze: "${{ steps.noise_analyze.outcome }}",
                noise_test: "${{ steps.noise_test.outcome }}",
                surebets_analyze: "${{ steps.surebets_analyze.outcome }}",
                surebets_test: "${{ steps.surebets_test.outcome }}"
              }
            };
            const filePath = "reports/glitchtip-nov15-postmerge-validation.json";
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo, path: filePath
              });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const encoded = Buffer.from(
              JSON.stringify(status, null, 2) + "\n", "utf8"
            ).toString("base64");
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo, path: filePath,
              branch: "main", message: "ci: record GlitchTip public validation outcome",
              content: encoded, ...(sha ? {sha} : {})
            });

      - name: Enforce substantive validation result
        if: always()
        env:
          NOMAD_ANALYZE: ${{ steps.nomad_analyze.outcome }}
          NOMAD_TEST: ${{ steps.nomad_test.outcome }}
          NOISE_ANALYZE: ${{ steps.noise_analyze.outcome }}
          NOISE_TEST: ${{ steps.noise_test.outcome }}
          SUREBETS_ANALYZE: ${{ steps.surebets_analyze.outcome }}
          SUREBETS_TEST: ${{ steps.surebets_test.outcome }}
        run: |
          test "$NOMAD_ANALYZE" = success
          test "$NOMAD_TEST" = success
          test "$NOISE_ANALYZE" = success
          test "$NOISE_TEST" = success
          test "$SUREBETS_ANALYZE" = success
          test "$SUREBETS_TEST" = success
