name: Riemann hypothesis single scene 1080p
on:
  push:
    branches: [main]
    paths: [.github/workflows/riemann-hypothesis-single-scene.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/manimVideos
          ref: ee9a8f00c53cd2a60dcb68a046b1e665a0e12e3f
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2-dev libpango1.0-dev pkg-config ffmpeg fonts-dejavu-core
          python -m pip install -r source/riemann-hypothesis/requirements.txt
      - name: Test mathematics
        working-directory: source/riemann-hypothesis
        run: |
          python -m compileall -q scene.py math_data.py
          python -m unittest discover -s tests -v
      - name: Render one continuous scene
        working-directory: source/riemann-hypothesis
        run: |
          manim -qh --fps 30 --disable_caching scene.py RiemannHypothesis
          mkdir -p output
          cp media/videos/scene/1080p30/RiemannHypothesis.mp4 output/RiemannHypothesis_1080p30.mp4
          ffmpeg -v error -xerror -i output/RiemannHypothesis_1080p30.mp4 -f null -
          python - <<'PY'
          import subprocess, json
          p='output/RiemannHypothesis_1080p30.mp4'
          d=json.loads(subprocess.check_output(['ffprobe','-v','error','-show_streams','-show_format','-of','json',p]))
          v=next(s for s in d['streams'] if s['codec_type']=='video')
          assert (v['width'],v['height'],v['r_frame_rate'])==(1920,1080,'30/1'),v
          assert 80<float(d['format']['duration'])<180,d['format']
          print(d['format']['duration'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Riemann-Hypothesis-1080p30
          path: source/riemann-hypothesis/output/RiemannHypothesis_1080p30.mp4
          if-no-files-found: error
          compression-level: 0
