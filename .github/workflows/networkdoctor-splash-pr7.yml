name: NetworkDoctor splash PR7 validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/networkdoctor-splash-pr7.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout NetworkDoctor change
        uses: actions/checkout@v4
        with:
          repository: Persie0/NetworkDoctor
          ref: 8d83705aabbd5d3b73367c5a3f6853f79f5ccd53
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false

      - name: Assert splash matches adaptive icon background
        shell: bash
        run: |
          python3 - <<'PY'
          from xml.etree import ElementTree as ET
          from pathlib import Path
          root = Path('app/src/main/res')
          android = '{http://schemas.android.com/apk/res/android}'
          colors = ET.parse(root / 'values/colors.xml').getroot()
          values = {x.attrib['name']: x.text.strip() for x in colors.findall('color')}
          assert values['ic_launcher_background'] == '#0167FD', values
          adaptive = ET.parse(root / 'mipmap-anydpi-v26/ic_launcher.xml').getroot()
          assert adaptive.find('background').get(android+'drawable') == '@color/ic_launcher_background'
          for resource, expect_system_splash in [('values/themes.xml', False), ('values-v31/themes.xml', True)]:
              styles = ET.parse(root / resource).getroot()
              theme = next(s for s in styles.findall('style') if s.get('name') == 'Theme.NetworkDoctor')
              items = {i.get('name'): (i.text or '').strip() for i in theme.findall('item')}
              assert items['android:windowBackground'] == '@color/ic_launcher_background', items
              assert items['android:windowLightStatusBar'] == 'false'
              if expect_system_splash:
                  assert items['android:windowSplashScreenBackground'] == '@color/ic_launcher_background'
                  assert items['android:windowSplashScreenAnimatedIcon'] == '@mipmap/ic_launcher'
          print('Splash and adaptive launcher use matching color resources')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install available Android SDK for CI smoke test
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'

      - name: Use SDK 36 for CI-only check
        shell: bash
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' app/build.gradle.kts

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile, test and lint
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug -x :app:checkDebugAarMetadata
