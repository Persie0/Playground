name: TopTravelList El Salvador validation
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/toptravellist-sv-78-20261125.yml']
  push:
    branches: [main, 'ci/toptravellist-sv-78']
    paths: ['.github/workflows/toptravellist-sv-78-20261125.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: data/el-salvador-rankings-78
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate dataset and generate rankings
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python scripts/validate.py
          python scripts/check_city_benchmarks.py
          python scripts/check_sight_benchmarks.py
          python scripts/check_new_country_reviews.py --country SV
          python scripts/generate_rankings.py --country SV
          python scripts/generate_rankings.py --check
          python scripts/rank.py --kind cities --limit 60 >/tmp/world-cities.txt
          python scripts/rank.py --kind sights --limit 60 >/tmp/world-sights.txt
          python scripts/rank.py --kind sights --country SV --limit 20 >/tmp/sv-sights.txt
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          from decimal import Decimal
          import yaml
          txt='\n'.join(Path('methodology/reviews/SV',k+'.md').read_text() for k in ('cities','sights'))
          assert txt.count('**source-linked-unverified**')==54
          assert txt.count('**editorial-only**')==20
          assert txt.count('**unassessed**')==4
          for kind,count in [('cities',24),('sights',54)]:
              files=list(Path('countries/SV',kind).glob('*.yaml'))
              assert len(files)==count
              md=Path('countries/SV',kind+'.md').read_text()
              assert md.count('https://www.google.com/maps/search/?api=1&query=')==count
              for f in files:
                  d=yaml.safe_load(f.read_text())
                  section=txt.split('## '+d['id']+' — ',1)[1].split('\n## ',1)[0]
                  peers=re.findall(r'\]\(\.\./\.\./\.\./countries/([A-Z]{2}/(?:cities|sights)/[^)]+\.yaml)\)',section)
                  assert len(set(peers))==4 and all(Path('countries',p).is_file() for p in peers)
                  vals=[d['scores'][k] for k in ('impact','uniqueness','significance','experience','depth')]
                  if None not in vals:
                      total=sum(Decimal(str(v))*w for v,w in zip(vals,[30,25,20,15,10]))/10
                      assert f'Overall: {total:.2f}/100.' in section
                  else:
                      assert 'Overall: unranked.' in section
                  if any(v is not None and v>=9.5 for v in vals+list(d['scores']['categories'].values())):
                      assert 'High-score challenge: Not applicable' not in section
          changes=subprocess.check_output(['git','diff','--name-only','3609aa06d143c050fc00d2013ab7413a58dfae11','HEAD'],text=True).splitlines()
          assert all(p=='README.md' or p.startswith(('countries/SV/','methodology/reviews/SV/')) for p in changes)
          print('PASS: record counts, reviews, peer links, totals, maps and scope')
          print('WORLDWIDE:',len({f.parent.parent.name for f in Path('countries').glob('*/*/*.yaml')}),len(list(Path('countries').glob('*/cities/*.yaml'))),len(list(Path('countries').glob('*/sights/*.yaml'))))
          PY
          git config user.name toptravellist-editorial-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md countries/SV/cities.md countries/SV/sights.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Generate El Salvador ranking pages and country directory'
            git push origin HEAD:refs/heads/data/el-salvador-rankings-78
          fi
