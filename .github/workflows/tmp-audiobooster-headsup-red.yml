name: Temporary AudioBooster session-caught RED

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-audiobooster-headsup-red.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Check out AudioBooster feature
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: 5bd443cc553220943188a4518b2c5619056f8c2a
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: audiobooster

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: audiobooster
        run: flutter pub get

      - name: Verify caught-session regression is red
        working-directory: audiobooster
        run: flutter test test/heads_up_notification_source_test.dart
