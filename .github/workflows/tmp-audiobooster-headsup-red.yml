name: Temporary AudioBooster heads-up notification GREEN

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-audiobooster-headsup-red.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Check out AudioBooster feature
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: b9b5f436fe8d52109ed2b542d1dc0ebcad42fe5b
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: audiobooster

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: audiobooster
        run: flutter pub get

      - name: Focused notification and paywall tests
        working-directory: audiobooster
        run: flutter test test/heads_up_notification_source_test.dart test/trial_paywall_flow_test.dart

      - name: Analyze
        working-directory: audiobooster
        run: flutter analyze

      - name: Bootstrap Android and compile debug APK
        working-directory: audiobooster
        run: |
          bash tool/bootstrap_android.sh
          flutter build apk --debug
