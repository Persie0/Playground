name: Punisher PR 23 validation
on:
  push:
    branches: [ci/punisher-impeccable-pr23]
    paths: [.github/workflows/punisher-impeccable-pr23.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/punisher
          ref: c1894a36b5a8435c8bd96880ae6726a2c4ac28c6
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
      - name: Dependencies
        run: |
          if flutter pub get > "$RUNNER_TEMP/punisher-pub.log" 2>&1; then echo "Dependency resolution passed"; else echo "Dependency resolution failed"; exit 1; fi
      - name: Analyze and test without publishing private source or logs
        shell: bash
        run: |
          set +e
          dart analyze --fatal-infos --format=machine > "$RUNNER_TEMP/punisher-analyze.log" 2>&1
          analyze=$?
          flutter test --machine > "$RUNNER_TEMP/punisher-test.log" 2>&1
          tests=$?
          printf 'Analyzer exit: %s\nTests exit: %s\n' "$analyze" "$tests"
          test "$analyze" -eq 0 && test "$tests" -eq 0
      - name: Report sanitized diagnostic identifiers
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          def loc(path):
              try: path = str(pathlib.Path(path.removeprefix('file://')).resolve().relative_to(pathlib.Path.cwd()))
              except ValueError: return 'external'
              return hashlib.sha256(path.encode()).hexdigest()[:12]
          a = root / 'punisher-analyze.log'
          if a.exists():
              for line in a.read_text(errors='replace').splitlines():
                  fields = line.split('|')
                  if len(fields) >= 8 and re.fullmatch(r'[A-Z_]+', fields[2]) and fields[4].isdigit() and fields[5].isdigit():
                      print('ANALYZE', fields[0], fields[2], loc(fields[3]), fields[4], fields[5])
                      if fields[2] == 'DEPRECATED_MEMBER_USE':
                          try: source = pathlib.Path(fields[3]).read_text().splitlines()[int(fields[4])-1]
                          except (OSError, IndexError): source = ''
                          if source.strip() == "import 'package:flutter/material.dart';":
                              # Only report public framework names, not project identifiers or raw messages.
                              print('FRAMEWORK_DEPRECATION', [word for word in ['material.dart','Material','material_ui','material','flutter','Flutter','widgets.dart','cupertino','package:material','package:flutter','deprecated','migration'] if word in fields[7]])
          t = root / 'punisher-test.log'
          if t.exists():
              suites, tests = {}, {}
              for line in t.read_text(errors='replace').splitlines():
                  try: event = json.loads(line)
                  except ValueError:
                      for path, ln, col in re.findall(r'((?:lib|test)/[\w/.-]+\.dart):(\d+):(\d+)', line):
                          print('COMPILE', loc(path), ln, col)
                      continue
                  if not isinstance(event, dict): continue
                  kind = event.get('type')
                  if kind == 'suite':
                      suite = event['suite']
                      suites[suite['id']] = loc(suite.get('path') or '')
                  if kind == 'testStart':
                      test = event['test']
                      tests[test['id']] = (suites.get(test['suiteID'], 'unknown'), hashlib.sha256(test.get('name','').encode()).hexdigest()[:12], test.get('root_line',test.get('line')), test.get('root_column',test.get('column')))
                  if kind == 'testDone' and event.get('result') != 'success':
                      print('TEST', event.get('result'), tests.get(event['testID'], 'unknown'))
                  if kind in ('error', 'print'):
                      error = str(event.get('error',event.get('message','')))
                      categories = ['RenderFlex overflowed', 'No element', 'MissingPluginException', 'Bad state', 'Expected:', 'Actual:', 'Multiple exceptions', 'Timeout', 'Compilation failed', 'TypeError', 'not found', 'not a subtype', 'setState()', 'Test failed', 'test failed', 'TestFailure', 'FlutterError', 'overflowed', 'pumpAndSettle', 'scrollUntilVisible', 'ensureVisible', 'hit test', 'Finder', 'found 0 widgets', 'found 1 widget', 'found 2 widgets', 'Too many elements', 'disposed', 'pending timer', 'assertion', 'Expected exactly one matching', 'No matching', 'No widgets', 'was called', 'Exception', 'TestWidgetsFlutterBinding', 'hasSize', 'not laid out', 'A RenderFlex', 'A RenderViewport', 'Null check operator', 'No MaterialLocalizations', 'MediaQuery', 'ChangeNotifier', 'setSurfaceSize']
                      hits = [x for x in categories if x.lower() in error.lower()]
                      if hits or kind == 'error': print('TEST_ERROR', tests.get(event.get('testID'), 'unknown'), hits)
                      for path, ln, col in re.findall(r'((?:lib|test)/[\w/.-]+\.dart)[: ]+(\d+)[: ]+(\d+)', str(event.get('stackTrace','')) + error):
                          print('TEST_LOCATION', loc(path), ln, col)
          PY
