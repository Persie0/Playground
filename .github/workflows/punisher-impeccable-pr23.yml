name: Punisher PR 23 validation
on:
  push:
    branches: [ci/punisher-impeccable-pr23]
    paths: [.github/workflows/punisher-impeccable-pr23.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/punisher
          ref: a0577eb186c7ac79c1b4172063216a055e0de670
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
      - name: Dependencies
        run: |
          if flutter pub get > "$RUNNER_TEMP/punisher-pub.log" 2>&1; then echo "Dependency resolution passed"; else echo "Dependency resolution failed"; exit 1; fi
      - name: Analyze and test without publishing private source or logs
        shell: bash
        run: |
          set +e
          flutter analyze > "$RUNNER_TEMP/punisher-analyze.log" 2>&1
          analyze=$?
          flutter test --reporter compact > "$RUNNER_TEMP/punisher-test.log" 2>&1
          tests=$?
          printf 'Analyzer exit: %s\nTests exit: %s\n' "$analyze" "$tests"
          test "$analyze" -eq 0 && test "$tests" -eq 0
      - name: Send diagnostics to private pull request
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY' > "$RUNNER_TEMP/punisher-diagnostics.md"
          import os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          print('### Private CI diagnostics — run ' + os.environ['GITHUB_RUN_ID'])
          for name in ('pub', 'analyze', 'test'):
              p = root / ('punisher-' + name + '.log')
              if not p.exists(): continue
              print('\n**' + name + '**\n\`\`\`text')
              s = p.read_text(errors='replace').replace('\r', '\n')
              lines = [x for x in s.splitlines() if x.strip()]
              if name == 'test':
                  lines = [x for x in lines if not (' +0:' in x and 'loading' in x)]
              print('\n'.join(lines)[-16000:])
              print('\`\`\`')
          PY
          gh pr comment 23 --repo Persie0/punisher --body-file "$RUNNER_TEMP/punisher-diagnostics.md" >/dev/null 2>&1 || { echo 'Private diagnostics delivery failed'; exit 1; }
