name: Punisher PR 23 validation
on:
  push:
    branches: [ci/punisher-impeccable-pr23]
    paths: [.github/workflows/punisher-impeccable-pr23.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/punisher
          ref: e0156ea95f759ead5e9a5df603dec65aab7e157f
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
      - name: Dependencies
        run: |
          if flutter pub get --enforce-lockfile > "$RUNNER_TEMP/punisher-pub.log" 2>&1; then echo "Dependency resolution passed"; else echo "Dependency resolution failed"; exit 1; fi
      - name: Analyze and test
        shell: bash
        run: |
          set +e
          dart analyze --fatal-infos --format=machine > "$RUNNER_TEMP/punisher-analyze.log" 2>&1
          analyze=$?
          flutter test --machine > "$RUNNER_TEMP/punisher-test.log" 2>&1
          tests=$?
          printf 'Analyzer exit: %s\nTests exit: %s\n' "$analyze" "$tests"
          test "$analyze" -eq 0 && test "$tests" -eq 0
      - name: Encrypt diagnostic summary to ephemeral review key
        if: always()
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/recipient.pem" <<'CERT'
          -----BEGIN CERTIFICATE-----
          MIIDSzCCAjOgAwIBAgIUXdETChXQKEtwRDcZSwnYe39EnIswDQYJKoZIhvcNAQEL
          BQAwNTEzMDEGA1UEAwwqUHJpdmF0ZSBDSSBkaWFnbm9zdGljcyBlcGhlbWVyYWwg
          cmVjaXBpZW50MB4XDTI2MTEyNjAxMDEyMFoXDTI2MTEyODAxMDEyMFowNTEzMDEG
          A1UEAwwqUHJpdmF0ZSBDSSBkaWFnbm9zdGljcyBlcGhlbWVyYWwgcmVjaXBpZW50
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA5TquoT+jJTYTj8DztVAp
          wKe59fE1oz+QrUXtnMgl+cchcakI09/aMpk1InPpLUMziX2zWFg2J6V7zDsTaXR5
          fzBsAhBKjNrIaCw03F4ZaSsoGky/cHkVLQemPS/ejjK2M+6EsOPKsP2mm0RpDM0I
          5XeoTwqMX7bICJBUdK2EMHCvJZsnTut29usWxU0eqz4efIyP61VihDZAnPQvc0Vm
          pB5h4BCxXZi8hkw4Dfgyg+dFyCJ8axKX0OhV1qg4jf8sty4w18GqwW1w7sgUTNeX
          jkOiB10xXgP8xByfqFHCOCwpZG2PYhFOTqhc+PkkU2b8IFrSv0bq7r89o3j8Kjqu
          tQIDAQABo1MwUTAdBgNVHQ4EFgQUdmS4LBLLLdXqmU+i6VtgbrCNhxIwHwYDVR0j
          BBgwFoAUdmS4LBLLLdXqmU+i6VtgbrCNhxIwDwYDVR0TAQH/BAUwAwEB/zANBgkq
          hkiG9w0BAQsFAAOCAQEAnivrjnNnxm4NMlkdNIV/wCHZJnCT1InN6jXviX/LnJwN
          hGEVNmrttVxMosV/V6HvNrcFJAcRIcWgkdzzeJbwLMBtEp+3fN5ZqdvAjCPxo756
          B3JQp87uXE1ETa5QSgndqcKG5aJ6k2pSrIptE1n0ntLBiBF02y9OMRB8PMMeW5Z8
          EqZAUqEdksxhGtGkvgAxNIybZhITATp054jJ7dSVHfvW4E3jgtCvdCqvA7DdIB8g
          1A19jJg2m2/AvisUYdrI025xnW1xy1Y183z90v9ZB6B5VQEqpb1YROFtnc9oD4Nm
          7rTam4hlRlVgCM99U+J6xACSe15/IMOiL3ehwiblTA==
          -----END CERTIFICATE-----
          CERT
          python3 - <<'PY'
          import json, os, pathlib, gzip, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          parts = []
          for name in ['pub','analyze']:
              p = root / ('punisher-' + name + '.log')
              if p.exists(): parts.append(name + '\n' + p.read_text(errors='replace')[-16000:])
          p = root / 'punisher-test.log'
          if p.exists():
              tests, output, failed, other = {}, {}, set(), []
              passed = 0
              for line in p.read_text(errors='replace').splitlines():
                  try: e = json.loads(line)
                  except ValueError:
                      other.append(line)
                      continue
                  if not isinstance(e, dict): continue
                  kind = e.get('type')
                  if kind == 'testStart':
                      t = e['test']
                      tests[t['id']] = t.get('name','')
                  if kind in ('print','error'):
                      output.setdefault(e.get('testID'), []).append(str(e.get('message', e.get('error',''))))
                  if kind == 'testDone':
                      if e.get('result') != 'success': failed.add(e.get('testID'))
                      elif not e.get('hidden'): passed += 1
              print('TEST_COUNTS', passed, len(failed))
              parts.append('non-json test output:\n' + '\n'.join(other)[-6000:])
              for i in sorted(x for x in failed if x is not None):
                  parts.append(tests.get(i,'unknown') + '\n' + '\n'.join(output.get(i,[]))[:5000])
          try:
              diff = subprocess.check_output(['git','diff','--','pubspec.lock'],text=True)
              parts.append('LOCK DIFF\n' + diff[:24000])
          except Exception: pass
          (root / 'diagnostics.gz').write_bytes(gzip.compress('\n\n'.join(parts).encode()))
          PY
          openssl cms -encrypt -binary -aes256 -outform DER -in "$RUNNER_TEMP/diagnostics.gz" -out "$RUNNER_TEMP/diagnostics.der" "$RUNNER_TEMP/recipient.pem"
          printf 'ENCRYPTED_DIAGNOSTICS '
          base64 -w0 "$RUNNER_TEMP/diagnostics.der"
          printf '\n'
