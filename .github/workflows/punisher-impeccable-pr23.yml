name: Punisher PR 23 validation
on:
  push:
    branches: [ci/punisher-impeccable-pr23]
    paths: [.github/workflows/punisher-impeccable-pr23.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/punisher
          ref: 403bdc29f717d5e6b9bd066ec0d6ac057030ebea
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Backend cancellation protocol tests
        working-directory: server
        run: |
          set +e
          npm ci --no-audit --no-fund > "$RUNNER_TEMP/server-install.log" 2>&1
          install=$?
          echo "Backend dependency exit: $install"
          if [ "$install" -ne 0 ]; then exit "$install"; fi
          npm test -- --test-reporter=tap > "$RUNNER_TEMP/server-test.log" 2>&1
          code=$?
          grep -E '^# (tests|pass|fail|cancelled|skipped) [0-9]+$' "$RUNNER_TEMP/server-test.log" || true
          grep -oE '^not ok [0-9]+' "$RUNNER_TEMP/server-test.log" || true
          echo "Backend tests exit: $code"
          exit "$code"
      - uses: subosito/flutter-action@v2
        if: always()
        with:
          channel: stable
          flutter-version: '3.50.0'
      - name: Flutter dependencies
        if: always()
        run: |
          flutter pub get --enforce-lockfile > "$RUNNER_TEMP/punisher-pub.log" 2>&1
      - name: Strict analysis and Flutter regression tests
        if: always()
        shell: bash
        run: |
          set +e
          dart analyze --fatal-infos --format=machine > "$RUNNER_TEMP/punisher-analyze.log" 2>&1
          analyze=$?
          flutter test --no-pub --machine > "$RUNNER_TEMP/punisher-test.log" 2>&1
          tests=$?
          printf 'Analyzer exit: %s\nTests exit: %s\n' "$analyze" "$tests"
          test "$analyze" -eq 0 && test "$tests" -eq 0
      - name: Sanitized diagnostics
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, re, hashlib, json
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          def loc(path):
              try: path = str(pathlib.Path(path.removeprefix('file://')).resolve().relative_to(pathlib.Path.cwd()))
              except ValueError: return 'external'
              return hashlib.sha256(path.encode()).hexdigest()[:12]
          a = root / 'punisher-analyze.log'
          if a.exists():
              for line in a.read_text(errors='replace').splitlines():
                  f = line.split('|')
                  if len(f) >= 8 and re.fullmatch(r'[A-Z_]+', f[2]) and f[4].isdigit() and f[5].isdigit():
                      print('ANALYZE', f[0], f[2], loc(f[3]), f[4], f[5])
          t = root / 'punisher-test.log'
          if t.exists():
              passed, failed = 0, set()
              for line in t.read_text(errors='replace').splitlines():
                  try: e = json.loads(line)
                  except ValueError:
                      for path, ln, col in re.findall(r'((?:lib|test)/[\w/.-]+\.dart):(\d+):(\d+)', line): print('COMPILE', loc(path), ln, col)
                      continue
                  if not isinstance(e, dict): continue
                  if e.get('type') == 'testDone':
                      if e.get('result') == 'success' and not e.get('hidden'): passed += 1
                      elif e.get('result') != 'success': failed.add(e.get('testID'))
                  if e.get('type') == 'error':
                      error = str(e.get('error', ''))
                      for path, ln, col in re.findall(r'((?:lib|test)/[\w/.-]+\.dart):(\d+):(\d+)', str(e.get('stackTrace','')) + error): print('TEST_LOCATION', loc(path), ln, col)
              print('FLUTTER_TEST_COUNTS', passed, len(failed))
          PY
