name: Stop runaway banker-manim tag jobs and exclude tag pushes
on:
  push:
    branches: [main]
    paths: [.github/workflows/emergency-tag-fanout-guard.yml]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: emergency-tag-fanout-guard
  cancel-in-progress: false

jobs:
  emergency:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cancel runaway tag-based workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request, urllib.error
          url = "https://api.github.com/repos/" + os.environ["GITHUB_REPOSITORY"]
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"], "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28"}
          sha = "1ca83c33aa0b059413ba7050c7de5e27b14c1dbf"
          def api(path, method="GET"):
              for attempt in range(7):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url + path, method=method, headers=headers), timeout=40) as r:
                          body = r.read()
                          return json.loads(body) if body else {}
                  except urllib.error.HTTPError as e:
                      if e.code in (403, 429, 502, 503, 504) and attempt < 6:
                          wait = min(10 * (attempt + 1), 60)
                          print("Rate limit / transient HTTP", e.code, "waiting", wait, flush=True)
                          time.sleep(wait)
                          continue
                      raise
          targets = {}
          for status in ("queued", "in_progress", "waiting", "pending"):
              for page in range(1, 31):
                  rows = api(f"/actions/runs?status={status}&per_page=100&page={page}").get("workflow_runs", [])
                  for r in rows:
                      if r.get("head_sha") in (sha, "6e2bd4440ee0da0e989720301a0ba8ae428659d9") and r.get("event") == "push" and (r.get("head_branch") or "").startswith("banker-manim-"):
                          targets[r["id"]] = r
                  if len(rows) < 100:
                      break
          print("Found", len(targets), "runaway banker-manim runs", flush=True)
          failed = []
          accepted = 0
          for i, run_id in enumerate(sorted(targets), 1):
              try:
                  api(f"/actions/runs/{run_id}/cancel", "POST")
                  accepted += 1
              except urllib.error.HTTPError as e:
                  if e.code != 409:
                      failed.append((run_id, e.code))
              except Exception as e:
                  failed.append((run_id, str(e)))
              if i % 20 == 0:
                  print("Processed", i, "of", len(targets), flush=True)
              time.sleep(0.45)
          print("Cancel accepted", accepted, "errors", failed, flush=True)
          if failed:
              raise SystemExit(1)
          PY

      - name: Fix broad push triggers throughout Playground
        if: always()
        env:
          PLAYGROUND_PAT_A: ${{ secrets.PRIVATE_REPO_TOKEN }}
          PLAYGROUND_PAT_B: ${{ secrets.GH_TOKEN }}
          PLAYGROUND_PAT_C: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          python3 - <<'PY'
          import pathlib, re
          changed = []
          unresolved = []
          for p in sorted(pathlib.Path(".github/workflows").glob("*")):
              if p.suffix not in (".yml", ".yaml"):
                  continue
              s = p.read_text()
              t = s
              match = re.search(r"(?m)^on:\s*(?:#.*)?$", t)
              if match:
                  begin = match.end()
                  sibling = re.search(r"(?m)^[A-Za-z_][\w-]*:", t[begin:])
                  end = begin + sibling.start() if sibling else len(t)
                  section = t[begin:end]
                  pusher = re.search(r"(?m)^  push:\s*(?:#.*)?$", section)
                  if pusher:
                      tail = section[pusher.end():]
                      next_event = re.search(r"(?m)^  [\w-]+:", tail)
                      body = tail[:next_event.start()] if next_event else tail
                      if not re.search(r"(?m)^    (branches|branches-ignore|tags|tags-ignore):", body):
                          position = begin + pusher.end()
                          t = t[:position] + "\n    branches:\n      - '**'" + t[position:]
                  elif re.search(r"(?m)^  push:\s*\{\s*\}\s*$", section):
                      section = re.sub(r"(?m)^  push:\s*\{\s*\}\s*$", "  push:\n    branches:\n      - '**'", section)
                      t = t[:begin] + section + t[end:]
              else:
                  simple = re.search(r"(?m)^on:\s*push\s*$", t)
                  if simple:
                      t = t[:simple.start()] + "on:\n  push:\n    branches:\n      - '**'" + t[simple.end():]
                  else:
                      inline = re.search(r"(?m)^on:\s*\[([^\n\]]+)\]\s*$", t)
                      if inline:
                          events = [e.strip() for e in inline.group(1).split(",")]
                          if "push" in events and all(re.fullmatch(r"[\w-]+", e) for e in events):
                              replacement = "on:\n" + "".join(
                                  "  push:\n    branches:\n      - '**'\n" if e == "push" else "  " + e + ":\n"
                                  for e in events
                              ).rstrip("\n")
                              t = t[:inline.start()] + replacement + t[inline.end():]
              if t != s:
                  p.write_text(t)
                  changed.append(str(p))
              # Confirm no unfiltered push remains inside an on: mapping.
              found = re.search(r"(?m)^on:\s*(?:#.*)?$", t)
              if found:
                  begin = found.end()
                  sibling = re.search(r"(?m)^[A-Za-z_][\w-]*:", t[begin:])
                  section = t[begin:begin + sibling.start()] if sibling else t[begin:]
                  push = re.search(r"(?m)^  push:\s*(?:#.*)?$", section)
                  if push:
                      tail = section[push.end():]
                      next_event = re.search(r"(?m)^  [\w-]+:", tail)
                      body = tail[:next_event.start()] if next_event else tail
                      if not re.search(r"(?m)^    (branches|branches-ignore|tags|tags-ignore):", body):
                          unresolved.append(str(p))
              if re.search(r"(?m)^on:\s*push\s*$|^on:\s*\[[^\n]*\bpush\b", t):
                  unresolved.append(str(p))
          print("Protected", len(changed), "workflows:", *changed, sep="\n", flush=True)
          if unresolved:
              print("Unresolved workflow triggers:", *unresolved, sep="\n", flush=True)
              raise SystemExit(1)
          PY
          git diff --check
          if ! git diff --quiet -- .github/workflows; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/workflows
            git commit -m 'ci: limit broad push workflows to branches [skip ci]'
            # Workflow-file changes require a credential with workflow write scope.
            # Try the repository token first, then configured PATs in precedence order.
            if ! git push origin HEAD:main; then
              git config --local --unset-all http.https://github.com/.extraheader || true
              did_push=false
              for token in "$PLAYGROUND_PAT_A" "$PLAYGROUND_PAT_B" "$PLAYGROUND_PAT_C"; do
                if [ -z "$token" ]; then continue; fi
                git remote set-url origin "https://x-access-token:${token}@github.com/${GITHUB_REPOSITORY}.git"
                if git push origin HEAD:main; then did_push=true; break; fi
              done
              if [ "$did_push" != true ]; then
                echo "::error::Cannot push workflow-guard changes with available credentials"
                exit 1
              fi
            fi
          fi
