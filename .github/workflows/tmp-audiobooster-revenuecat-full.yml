name: Temporary AudioBooster RevenueCat full validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-audiobooster-revenuecat-full.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check out AudioBooster feature
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: 9e17742b9977ecedeee5a6bda0af3cb9aeffa6d6
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: audiobooster
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        working-directory: audiobooster
        run: |
          set -euxo pipefail
          flutter --version
          flutter pub get

      - name: Bootstrap Android
        working-directory: audiobooster
        run: |
          set -euxo pipefail
          bash tool/bootstrap_android.sh

      - name: Native JVM tests
        working-directory: audiobooster/android
        run: |
          set -euxo pipefail
          ./gradlew testDebugUnitTest

      - name: Verify maintained Android mirrors
        working-directory: audiobooster
        run: |
          set -euxo pipefail
          cmp tool/android/MainActivity.kt android/app/src/main/kotlin/com/persie0/audiobooster/MainActivity.kt
          diff -qr tool/android/com/persie0/audiobooster android/app/src/main/kotlin/com/persie0/audiobooster

      - name: Flutter tests
        working-directory: audiobooster
        run: |
          set -euxo pipefail
          flutter test

      - name: Flutter analyze
        working-directory: audiobooster
        run: |
          set -euxo pipefail
          flutter analyze

      - name: Debug APK
        working-directory: audiobooster
        run: |
          set -euxo pipefail
          flutter build apk --debug

      - name: Release APK
        working-directory: audiobooster
        run: |
          set -euxo pipefail
          flutter build apk --release

      - name: Release AAB
        working-directory: audiobooster
        run: |
          set -euxo pipefail
          flutter build appbundle --release
