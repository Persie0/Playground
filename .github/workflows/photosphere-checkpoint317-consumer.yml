name: Photosphere checkpoint317 native second-caller consumer
on:
  push:
    branches: [research/photosphere-checkpoint317-consumer]
    paths: [.github/workflows/photosphere-checkpoint317-consumer.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install original source ARM64 analysis
        run: python3 -m pip install --break-system-packages --quiet unicorn capstone pyelftools
      - name: Download original hash-pinned GCam camera ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk'
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Checkout pinned reverse-engineering source read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 5c5aba1e84219a57b0b017d24055ddda17203beb
          path: research
          sparse-checkout: |
            research/photosphere/checkpoint317
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Execute original caller entry and extract trace
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 5c5aba1e84219a57b0b017d24055ddda17203beb
          python3 research/research/photosphere/checkpoint317/native_original_secondary_consumer_entry.py original.so --output checkpoint317-original-consumer-entry.json | tee checkpoint317-original-consumer-entry.log
          grep -q '^CHECKPOINT317_NATIVE_CONSUMER_ENTRY_PASS' checkpoint317-original-consumer-entry.log
          python3 research/research/photosphere/checkpoint317/native_original_counter_consumption.py original.so --output checkpoint317-original-counter-consumption.json | tee checkpoint317-original-counter-consumption.log
          grep -q '^CHECKPOINT317_ORIGINAL_COUNTER_CONSUMPTION_PASS' checkpoint317-original-counter-consumption.log
          echo CHECKPOINT317_COUNTER_JSON_BEGIN
          cat checkpoint317-original-counter-consumption.json
          echo CHECKPOINT317_COUNTER_JSON_END
          echo CHECKPOINT317_JSON_BEGIN
          cat checkpoint317-original-consumer-entry.json
          echo CHECKPOINT317_JSON_END
      - name: Checkout pinned Rust counter-consumer model read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 9a51d42108ca77c644934eff923a5dfd298f1879
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Check fresh native ARM64 oracle against Rust fixture
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = 9a51d42108ca77c644934eff923a5dfd298f1879
          python3 - <<'PY'
          import json
          from pathlib import Path
          native=json.loads(Path("checkpoint317-original-counter-consumption.json").read_text())
          for case in native["cases"]:
              trace=case.pop("original_instruction_trace")
              case["original_trace_start_pc"]=trace[0]
              case["original_trace_end_pc"]=trace[-1]
              case["original_trace_instruction_count"]=len(trace)
          rust=json.loads(Path("app/tests/fixtures/native_original_counter_consumption_317.json").read_text())
          assert native==rust, "fresh original ARM64 loop disagrees with checked-in fixture"
          assert native["original_fixture_count"]==16
          assert native["original_attempt_count"]==27
          assert native["original_write_count"]==21
          assert native["original_diagnostic_count"]==6
          print("CHECKPOINT317_FRESH_NATIVE_RUST_ORACLE_EQUAL",len(native["cases"]),27,21,6)
          PY
      - name: Run Rust parity and full regression
        run: |
          set -euo pipefail
          cd app
          rustfmt --edition 2021 --check src/native_line_counter_consume.rs src/native_line_counter_consume_checkpoint317_test.rs
          cargo test --lib checkpoint317 -- --nocapture
          cargo test --lib
      - name: Show formatted Rust source for readback
        run: |
          echo CHECKPOINT317_RUST_MODEL_BEGIN
          cat app/src/native_line_counter_consume.rs
          echo CHECKPOINT317_RUST_MODEL_END
          echo CHECKPOINT317_RUST_TEST_BEGIN
          cat app/src/native_line_counter_consume_checkpoint317_test.rs
          echo CHECKPOINT317_RUST_TEST_END
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint317-original-consumer
          path: |
            checkpoint317-original-consumer-entry.json
            checkpoint317-original-consumer-entry.log
            checkpoint317-original-counter-consumption.json
            checkpoint317-original-counter-consumption.log
          retention-days: 14
