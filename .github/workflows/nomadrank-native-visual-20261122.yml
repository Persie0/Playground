name: NomadRank native visual smoke (public Playground)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nomadrank-native-visual-20261122.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Ensure private checkout credential exists
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout NomadRank UX branch using Playground credentials
        uses: actions/checkout@v4
        with:
          repository: Persie0/skratch_clone
          ref: ux/impeccable-nomadrank-20261122
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build, launch and capture Android UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_atd
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            flutter build apk --debug --no-pub
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell wm dismiss-keyguard || true
            adb shell am start -n at.persie0.nomadrank/.MainActivity
            sleep 15
            # Fail rather than certify screenshots obscured by an Android ANR.
            verify_visible_app() {
              if timeout 25s adb shell uiautomator dump /sdcard/nomadrank-ui.xml >/dev/null 2>&1; then
                if adb shell cat /sdcard/nomadrank-ui.xml | grep -Eqi "Launcher.*responding|System UI.*responding|isn.t responding|Application Not Responding"; then
                  echo "::error::An Android system not-responding dialog obscures the app."
                  exit 1
                fi
              fi
            }
            verify_visible_app
            mkdir -p native-ux-captures
            adb exec-out screencap -p > native-ux-captures/android-phone-default.png
            adb shell cmd uimode night yes
            sleep 4
            verify_visible_app
            adb exec-out screencap -p > native-ux-captures/android-phone-dark.png
            adb shell cmd uimode night no
            sleep 4
            adb shell settings put system font_scale 1.4
            sleep 3
            verify_visible_app
            adb exec-out screencap -p > native-ux-captures/android-phone-large-text.png
            adb shell wm size 1920x1200
            adb shell wm density 200
            sleep 5
            verify_visible_app
            adb exec-out screencap -p > native-ux-captures/android-wide-window.png

      - name: Upload unmodified native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nomadrank-android-native-screenshots
          path: native-ux-captures/*.png
          if-no-files-found: ignore

      - name: List screenshot sizes for audit
        if: success()
        run: ls -lh native-ux-captures/*.png
