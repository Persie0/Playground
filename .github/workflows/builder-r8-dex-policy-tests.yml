name: Test Firebase builder DEX-aware R8 policy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/builder-r8-dex-policy-tests.yml

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/firebase_tester_builder
          ref: fix/play-r8-dex-size-applicability
          persist-credentials: false
      # Re-run after fixing the stale Uniminder checkout assertion.
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
