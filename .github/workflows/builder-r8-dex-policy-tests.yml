name: Test Firebase builder DEX-aware R8 policy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/builder-r8-dex-policy-tests.yml

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/firebase_tester_builder
          ref: fix/screendetector-bidmachine-gms-r8-20261105
          persist-credentials: false
      # Run all repository tests, including screendetector-only R8 override.
      - name: Python unit tests
        run: python3 -m unittest discover -s tests -v
