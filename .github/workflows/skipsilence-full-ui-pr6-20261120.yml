name: SkipSilencePlayer PR6 full interface review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/skipsilence-full-ui-pr6-20261120.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout native player feature branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/SkipSilencePlayer
          ref: feature/impeccable-full-ia-adaptive-20261120
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: source
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Android unit tests and debug APK
        working-directory: source/kotlin-android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Upload APK for device QA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SkipSilencePlayer-PR6-debug-APK
          path: source/kotlin-android/app/build/outputs/apk/debug/*.apk
  ios:
    runs-on: macos-latest
    steps:
      - name: Checkout native player feature branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/SkipSilencePlayer
          ref: feature/impeccable-full-ia-adaptive-20261120
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: source
      - name: Build iOS simulator app
        working-directory: source/swift-ios
        run: |
          set -o pipefail
          xcodebuild \
            -project SkipSilencePlayer.xcodeproj \
            -scheme SkipSilencePlayer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derived \
            CODE_SIGNING_ALLOWED=NO \
            build
