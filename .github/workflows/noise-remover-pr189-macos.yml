name: Noise Remover PR189 macOS exact-head verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noise-remover-pr189-macos.yml'

permissions:
  contents: read

jobs:
  macos-release-gate:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact private PR head
        uses: actions/checkout@v5
        with:
          repository: Persie0/noise_remover
          ref: edce8a9c395db0a3fff7460652087cab9b101056
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: app

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Run checked-in macOS release gate
        shell: bash
        run: bash app/.github/playground/noise_remover/run_macos_ci.sh app

