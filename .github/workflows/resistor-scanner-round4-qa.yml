name: Resistor Scanner Native UX (Playground harness)

on:
  push:
    branches: [ci/resistor-scanner-round4-20261123]
    paths: [.github/workflows/resistor-scanner-round4-qa.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  SCANNER_REF: 20d6343cd5f45c307eaa8aca7ca90166a95ffd12

concurrency:
  group: resistor-scanner-native-ux
  cancel-in-progress: true

jobs:
  native-review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout existing Playground capture harness
        uses: actions/checkout@v4
      - name: Checkout private Resistor Scanner revision
        uses: actions/checkout@v4
        with:
          repository: Persie0/resistor-scanner-android
          ref: ${{ env.SCANNER_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Install compile SDK
        shell: bash
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile, unit-test, lint and assemble
        working-directory: app
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace
      - name: Enable KVM (existing Playground native harness)
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod a+rw /dev/kvm
      - name: Run adapted Playground native UI capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_atd
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back virtualscene -camera-front none
          script: |
            adb install -r app/app/build/outputs/apk/debug/app-debug.apk
            python3 .github/scripts/resistor-scanner-native-ui.py
      - name: Upload unmodified native UI captures and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resistor-scanner-native-review
          path: native-review/
          if-no-files-found: warn
          retention-days: 3
