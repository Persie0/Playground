name: Resistor Scanner Round 4 Native UX QA

on:
  push:
    branches: [ci/resistor-scanner-round4-20261123]
    paths: [.github/workflows/resistor-scanner-round4-qa.yml]
  workflow_dispatch:

permissions:
  contents: read

env:
  SCANNER_REF: 20d6343cd5f45c307eaa8aca7ca90166a95ffd12

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout scanner PR commit
        uses: actions/checkout@v4
        with:
          repository: Persie0/resistor-scanner-android
          ref: ${{ env.SCANNER_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Compile, unit-test, lint and assemble
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugKotlin :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

  native-screen-smoke:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout same scanner revision
        uses: actions/checkout@v4
        with:
          repository: Persie0/resistor-scanner-android
          ref: ${{ env.SCANNER_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install compile SDK for emulator
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Library/Android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true
      - name: Enable KVM acceleration on public Ubuntu runner
        shell: bash
        run: |
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
      - name: Build debug APK before starting the emulator
        shell: bash
        working-directory: app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
      - name: Prepare resilient native screenshot script
        shell: bash
        run: |
          cat > scanner-ui-smoke.py <<'PY'
          import re
          import subprocess
          import time
          import xml.etree.ElementTree as ET
          from pathlib import Path
          
          PKG = 'at.austriao.resistor_scanner'
          ACTIVITY = PKG + '/at.austriao.resistorscanner.MainActivity'
          QA = Path('qa')
          QA.mkdir(exist_ok=True)
          
          def adb(*args, timeout=30):
              return subprocess.check_output(['adb', *args], stderr=subprocess.STDOUT, timeout=timeout)
          
          def dump():
              adb('shell', 'uiautomator', 'dump', '/sdcard/scanner-window.xml')
              raw = adb('shell', 'cat', '/sdcard/scanner-window.xml')
              return raw, list(ET.fromstring(raw).iter('node'))
          
          def matches(node, label):
              return label in (node.get('text'), node.get('content-desc'))
          
          def tap(node):
              x1,y1,x2,y2 = map(int,re.findall(r'\d+',node.get('bounds')))
              adb('shell','input','tap',str((x1+x2)//2),str((y1+y2)//2))
          
          def save(name, raw=None):
              (QA / (name+'.png')).write_bytes(adb('exec-out','screencap','-p'))
              if raw:
                  (QA / (name+'.xml')).write_bytes(raw)
          
          def wait_for(label, name=None, timeout=100):
              deadline = time.monotonic()+timeout
              last = None
              while time.monotonic()<deadline:
                  try:
                      raw, nodes = dump()
                      last = raw
                      # A known background Pixel Launcher ANR intercepted the earlier
                      # capture. Dismiss only that exact system dialog, not app errors.
                      launcher_anr = any(n.get('package') == 'android' and
                          n.get('text') == "Pixel Launcher isn't responding" for n in nodes)
                      if launcher_anr:
                          close = next((n for n in nodes if matches(n,'Close app')),None)
                          if close is not None:
                              tap(close)
                              adb('shell','am','start','-W','-n',ACTIVITY)
                              time.sleep(2)
                              continue
                      node = next((n for n in nodes if n.get('package') == PKG and matches(n,label)),None)
                      if node is not None:
                          if name:
                              save(name,raw)
                          return node
                  except (subprocess.SubprocessError, ET.ParseError) as exc:
                      print('Waiting for stable UI:', type(exc).__name__,flush=True)
                  time.sleep(2)
              save('failure-'+re.sub(r'[^a-z0-9]+','-',label.lower()),last)
              raise RuntimeError('App control not visible: '+label)
          
          def launch():
              adb('shell','am','start','-W','-n',ACTIVITY,timeout=60)
          
          try:
              adb('shell','input','keyevent','KEYCODE_WAKEUP')
              adb('shell','wm','dismiss-keyguard')
              adb('install','-r','app/app/build/outputs/apk/debug/app-debug.apk',timeout=180)
              adb('shell','pm','clear',PKG)
              adb('shell','pm','grant',PKG,'android.permission.CAMERA')
              launch()
              tap(wait_for('Next','intro-portrait'))
              tap(wait_for('Next','intro-step2-portrait'))
              tap(wait_for('Start scanning','intro-step3-portrait'))
              wait_for('Scanner settings','scanner-portrait')
              adb('shell','settings','put','system','font_scale','1.3')
              adb('shell','cmd','uimode','night','yes')
              adb('shell','settings','put','system','accelerometer_rotation','0')
              adb('shell','settings','put','system','user_rotation','1')
              adb('shell','am','force-stop',PKG)
              launch()
              tap(wait_for('Scanner settings','scanner-landscape-dark-large-type'))
              tap(wait_for('Scan guide','settings-landscape-dark-large-type'))
              tap(wait_for('Next','guide-replay-landscape-dark-large-type'))
              wait_for('Previous','guide-replay-step2-landscape-dark-large-type')
              adb('shell','input','keyevent','KEYCODE_BACK')
              wait_for('Next')
              adb('shell','input','keyevent','KEYCODE_BACK')
              wait_for('Scanner settings','scanner-after-guide-replay')
          finally:
              for file,args in [('window-state.txt',('shell','dumpsys','window')),
                                ('runtime-crashes.log',('logcat','-d','-s','AndroidRuntime:E'))]:
                  try:
                      (QA/file).write_bytes(adb(*args))
                  except subprocess.SubprocessError:
                      pass
          PY
      - name: Android phone orientation and large-type visual smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          # Match Linux x86_64 host and enable /dev/kvm acceleration above.
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: python3 scanner-ui-smoke.py
      - name: Preserve screenshots and accessibility hierarchy
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resistor-scanner-round6-native-ui
          path: qa/
          if-no-files-found: warn
