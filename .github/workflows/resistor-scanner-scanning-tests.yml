name: Resistor Scanner scanning tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag/SHA in Persie0/resistor_scanner
        required: true
        default: test/comprehensive-coverage
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/resistor-scanner-scanning-tests.yml'

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/resistor_scanner
  APP_REF: ${{ inputs.ref || 'test/comprehensive-coverage' }}

jobs:
  scanner-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if [[ -z "$PRIVATE_TOKEN" ]]; then
            echo "::error::Set PRIVATE_REPO_TOKEN or GH_TOKEN with Contents: read on Persie0/resistor_scanner."
            exit 2
          fi

      - name: Checkout resistor scanner
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Run Tasks 1-4 scanner model and camera tests
        working-directory: app
        run: >
          flutter test
          test/functions
          test/tracker
          test/provider/settings_model_test.dart
          test/services/model_cache_test.dart
          test/pages/camera_lifecycle_test.dart
          test/pages/live_scan_lifecycle_test.dart
          test/pages/track_scan_lifecycle_test.dart

# execution-stage: task4-green
