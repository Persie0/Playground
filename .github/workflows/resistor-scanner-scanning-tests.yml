name: Resistor Scanner private scanning tests

on:
  push:
    paths:
      - '.github/workflows/resistor-scanner-scanning-tests.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag/SHA in Persie0/resistor_scanner
        required: true
        default: tflite
        type: string

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/resistor_scanner
  APP_REF: fix/glitchtip-34-camera-race

jobs:
  scanner-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout app revision
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - name: Checkout private CI harness
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: tflite
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-ci
          sparse-checkout: .github/playground
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Run private scanner/camera suite
        run: bash private-ci/.github/playground/scanning-tests.sh app
