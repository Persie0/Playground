name: Noise Remover FFmpeg framework layout probe

on:
  push:
    branches: [noise-remover-macos-ci]
    paths:
      - '.github/workflows/noise-remover-ffmpeg-layout-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Download exact audio macOS frameworks
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/sk3llo/ffmpeg_kit_flutter/releases/download/8.1.2-audio/ffmpeg-kit-macos-audio-8.1.2.zip'
          curl -fL --retry 3 -o /tmp/ffmpeg-audio.zip "$url"
          unzip -q /tmp/ffmpeg-audio.zip -d /tmp/ffmpeg-audio

      - name: Prove AppleDouble sidecars are the sealing defect
        shell: bash
        run: |
          set -euo pipefail
          sidecars_before="$(find /tmp/ffmpeg-audio -type f -name '._*' | wc -l | tr -d ' ')"
          echo "appledouble_before=$sidecars_before"
          test "$sidecars_before" -gt 0

          # The upstream ZIP stores AppleDouble metadata as real files. These
          # files are not valid entries in a sealed versioned framework.
          find /tmp/ffmpeg-audio -type f -name '._*' -delete
          sidecars_after="$(find /tmp/ffmpeg-audio -type f -name '._*' | wc -l | tr -d ' ')"
          echo "appledouble_after=$sidecars_after"
          test "$sidecars_after" -eq 0

          for framework in /tmp/ffmpeg-audio/*.framework; do
            echo "===== sanitized $(basename "$framework") ====="
            ls -la "$framework"
            /usr/bin/codesign --force --sign - "$framework"
            details="$(codesign -dvv "$framework" 2>&1)"
            printf '%s\n' "$details" | grep -E 'Executable=|CodeDirectory|Signature=|Info.plist=|Sealed Resources=' || true
            printf '%s\n' "$details" | grep -q 'Signature=adhoc'
            if printf '%s\n' "$details" | grep -q 'linker-signed'; then
              echo 'ERROR: framework retained linker-signed flag after sanitization' >&2
              exit 1
            fi
            codesign --verify --strict --verbose=4 "$framework"
          done
