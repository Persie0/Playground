name: Photosphere checkpoint354 original AddImage X3 virtual source provenance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint354-source.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint354-source
  cancel-in-progress: false
jobs:
  source-original-addimage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Read-only exact private research checkout
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 48dd4bbbb4c5c19898a898cb2481e8f815975120
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify SHA and install original ELF disassembly dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "48dd4bbbb4c5c19898a898cb2481e8f815975120"
          python3 -m pip install --quiet --break-system-packages capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint354/scan_original_addimage_callers.py
      - name: Retrieve original GCam SHA-pinned APK and native ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Analyze original AddImage source caller / X3 class references / vtables
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint354/scan_original_addimage_callers.py original.so --output checkpoint354-original-callers.json | tee checkpoint354-original-callers.log
          grep -q '^CHECKPOINT354_ORIGINAL_ADDIMAGE_CALLER_SURVEY_PASS 12 ' checkpoint354-original-callers.log
      - name: Preserve only nonproprietary opcode/relocation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-checkpoint354-source
          path: |
            checkpoint354-original-callers.json
            checkpoint354-original-callers.log
          if-no-files-found: warn
          retention-days: 7
