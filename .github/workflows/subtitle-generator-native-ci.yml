name: Subtitle Generator Android validation
on:
  push:
    branches: [ci/subtitle-generator-validation]
    paths:
      - subtitle-generator-test-target.txt
      - .github/workflows/subtitle-generator-native-ci.yml
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: Persie0/SubtitleGenerator
          ref: feat/native-offline-subtitles
          path: source
          persist-credentials: false
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run Android unit tests and build
        working-directory: source/android
        run: gradle --no-daemon testDebugUnitTest assembleDebug --stacktrace
