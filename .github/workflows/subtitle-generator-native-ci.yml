name: Subtitle Generator native validation
on:
  push:
    branches: [ci/subtitle-generator-validation]
    paths:
      - subtitle-generator-test-target.txt
      - .github/workflows/subtitle-generator-native-ci.yml
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned private revision
        id: revision
        shell: bash
        run: echo "sha=$(tr -d '\\r\\n' < subtitle-generator-test-target.txt)" >> "$GITHUB_OUTPUT"
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: Persie0/SubtitleGenerator
          ref: ${{ steps.revision.outputs.sha }}
          path: source
          persist-credentials: false
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Run Android unit tests and build
        working-directory: source/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug --stacktrace
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned private revision
        id: revision
        shell: bash
        run: echo "sha=$(tr -d '\\r\\n' < subtitle-generator-test-target.txt)" >> "$GITHUB_OUTPUT"
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: Persie0/SubtitleGenerator
          ref: ${{ steps.revision.outputs.sha }}
          path: source
          persist-credentials: false
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
      - name: Install XcodeGen and whisper.cpp XCFramework
        working-directory: source/ios
        run: |
          brew install xcodegen
          ./scripts/prepare-whisper.sh
          xcodegen generate
      - name: Build for simulator
        working-directory: source/ios
        run: |
          xcodebuild -project SubtitleGenerator.xcodeproj -scheme SubtitleGenerator -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run Swift unit tests
        working-directory: source/ios
        run: |
          xcodebuild -project SubtitleGenerator.xcodeproj -scheme SubtitleGenerator -sdk iphonesimulator -destination 'platform=iOS Simulator,name=iPhone 16' CODE_SIGNING_ALLOWED=NO test
  windows-wrapper:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned private revision
        id: revision
        shell: bash
        run: echo "sha=$(tr -d '\\r\\n' < subtitle-generator-test-target.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Persie0/SubtitleGenerator
          ref: ${{ steps.revision.outputs.sha }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Windows Gradle wrapper
        working-directory: source/android
        shell: pwsh
        run: .\\gradlew.bat --version
