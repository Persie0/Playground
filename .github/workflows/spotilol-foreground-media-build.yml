name: Spotilol low-end UX APK
on:
  push:
    branches: [ci/spotilol-foreground-media-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Spotilol branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/Spotilol
          ref: perf/low-end-ux-and-player
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          persist-credentials: false
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install API 37 with runner SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list --channel=3 | grep -E 'platforms;android-37|build-tools;37' || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0'
          # Numeric compileSdk=37 may still look for the unsuffixed SDK directory.
          if [ ! -e "$ANDROID_HOME/platforms/android-37" ]; then
            ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          fi
      - name: Create harmless CI-only Firebase project configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          Path('app/google-services.json').write_text(json.dumps({
              'project_info': {'project_number': '1234567890', 'project_id': 'spotilol-ci', 'storage_bucket': 'spotilol-ci.appspot.com'},
              'client': [{'client_info': {'mobilesdk_app_id': '1:1234567890:android:abcdef0123456789', 'android_client_info': {'package_name': 'com.project.lol'}},
                          'api_key': [{'current_key': 'CI_NOT_A_REAL_API_KEY'}]}],
              'configuration_version': '1'
          }))
          PY
      - name: Check embedded JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess, sys, tempfile
          root = pathlib.Path('app/src/main/java/com/project/lol/webview/injections')
          files = ['SpotilolPlayer.kt', 'SearchOverlay.kt', 'PowerSave.kt', 'MainLoop.kt', 'WebPrefs.kt']
          for name in files:
              source = (root / name).read_text()
              parts = re.findall(r'const val (?:CONTENT|PART_[0-9]+)\\s*=\\s*"""(.*?)"""', source, flags=re.S)
              assert parts, name
              body = ''.join(parts)
              with tempfile.NamedTemporaryFile('w', suffix='.js', encoding='utf-8') as f:
                  f.write(body)
                  f.flush()
                  result = subprocess.run(['node', '--check', f.name], capture_output=True, text=True)
                  print(name, 'OK' if result.returncode == 0 else result.stderr, flush=True)
                  if result.returncode: sys.exit(result.returncode)
          PY
      - name: Build installable debug APK
        run: bash ./gradlew :app:assembleDebug --stacktrace --no-configuration-cache --no-daemon
      - name: Prepare APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          mkdir -p dist
          cp "$apk" dist/Spotilol-low-end-ux-debug.apk
          ( cd dist && sha256sum Spotilol-low-end-ux-debug.apk > SHA256SUMS.txt )
          printf 'Spotilol commit: %s\nBuild: unsigned for production, automatically signed with Android DEBUG keystore\nFirebase: CI placeholder (test media playback only)\n' "$(git rev-parse HEAD)" > dist/BUILD-INFO.txt
          ls -lh dist/
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Spotilol-low-end-ux-debug
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
