name: Image Enhancer post86 private widget visual QA
on:
  push:
    branches: [image-enhancer-post86-private-widget-captures-20261122]
    paths:
      - .github/workflows/image_enhancer_post86_widget_visual_qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out private QA branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/image_enhancer
          ref: qa/impeccable-post86-widget-captures-20261122
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: image_enhancer
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate private widget screenshots
        working-directory: image_enhancer
        run: |
          flutter pub get --enforce-lockfile
          flutter gen-l10n
          timeout 360s flutter test --update-goldens test/qa_capture_post86_test.dart --reporter expanded
      - name: Save synthetic QA images in private QA branch only
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -s image_enhancer/docs/qa/impeccable-post86/model_library_light_phone.png
          test -s image_enhancer/docs/qa/impeccable-post86/model_library_dark_large_text.png
          test -s image_enhancer/docs/qa/impeccable-post86/presets_light_compact.png
          test -s image_enhancer/docs/qa/impeccable-post86/presets_dark_large_text.png
          cd image_enhancer
          git config user.name 'Public Playground QA'
          git config user.email 'playground-qa@users.noreply.github.com'
          for png in docs/qa/impeccable-post86/*.png; do
            base64 -w0 "$png" > "$png.b64"
          done
          git add docs/qa/impeccable-post86/*.png docs/qa/impeccable-post86/*.b64
          git commit -m 'Capture synthetic model UI in light and large-text dark themes [skip ci]'
          BASIC=$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $BASIC" fetch \
            https://github.com/Persie0/image_enhancer.git \
            refs/heads/qa/impeccable-post86-widget-captures-20261122
          git stash push -m 'Ignore Flutter-generated workspace changes'
          git rebase FETCH_HEAD
          git -c "http.extraheader=AUTHORIZATION: basic $BASIC" push \
            https://github.com/Persie0/image_enhancer.git \
            HEAD:refs/heads/qa/impeccable-post86-widget-captures-20261122
