name: Toilet database encryption secret smoke
on:
  push:
    branches: [feat/toilet-db-encryption-publisher]
    paths: ['.github/workflows/toilet-db-secret-smoke.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify configured encryption key without logging it
        env:
          TOILET_DB_KEY_B64: ${{ secrets.TOILET_DB_KEY_B64 }}
        run: |
          python3 - <<'PY'
          import os, base64
          raw = os.environ.get('TOILET_DB_KEY_B64', '')
          try:
              key = base64.b64decode(raw, validate=True)
          except Exception as exc:
              raise SystemExit('Encryption key missing or invalid base64') from None
          if len(key) != 32:
              raise SystemExit('Encryption key missing or not 256-bit')
          print('Encryption key configuration: valid 256-bit key')
          PY
