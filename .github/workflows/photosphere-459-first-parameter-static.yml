name: Photosphere 459 original ARM64 Ceres first parameter-owner inventory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-459-first-parameter-static.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-459-first-parameter-static
  cancel-in-progress: false
jobs:
  source-parameter-owner-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: fc1d57a6044c7c6d4180c1b7c8b93de6ace8d8f1
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify pinned research source and Python
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = fc1d57a6044c7c6d4180c1b7c8b93de6ace8d8f1
          python3 -m pip install --quiet --break-system-packages capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint459/scan_original_first_parameter_owner.py
      - name: Validate original APK/ELF integrity
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Decode original native first Ceres parameter block owner and surrounding callsites
        working-directory: research-src
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint459/scan_original_first_parameter_owner.py research/native/liblightcycle.so --output checkpoint459-original-parameter.json > checkpoint459-scan.log
          python3 - <<'PY'
          import json
          d=json.load(open("checkpoint459-original-parameter.json"))
          assert d["source_opcode_pins_verified"]
          assert d["original_source_first_parameter_lookup_unexecuted"]
          assert d["first_native_parameter_owner_entry"]=="0x133bd0"
          print("CHECKPOINT459_SOURCE_STATIC_VERIFIED")
          for name in ("parameter_owner_entry","first_registration_caller"):
              print("CHECKPOINT459_SCAN_"+name.upper()+"="+json.dumps(d["windows"][name],separators=(",",":")))
          PY
      - name: Remove original binaries before artifact
        if: always()
        working-directory: research-src
        run: rm -f original.apk research/native/liblightcycle.so
      - name: Upload source-only opcode inventory
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-459-original-parameter-opcodes
          path: research-src/checkpoint459-original-parameter.json
          retention-days: 7
          if-no-files-found: error
