name: Photosphere 455 original first native Ceres AddResidualBlock entry
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/photosphere-455-original-first-add-native.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-455-original-first-add-native
  cancel-in-progress: false
jobs:
  first-original-source-add:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Read-only SHA-pinned research checkout
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 4563b49d9194e1fcc1926b8dd3e59026ff61ec69
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Exact source SHA and native probe syntax
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 4563b49d9194e1fcc1926b8dd3e59026ff61ec69
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py research/photosphere/checkpoint442/live_six_pair_native_camera_getters.py research/photosphere/checkpoint454/live_original_problem_constructor.py research/photosphere/checkpoint455/live_first_native_registration_entry.py research/photosphere/checkpoint455/scan_original_first_registration.py
      - name: Hash-check original GCam 8.8.225 APK and original ELF
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Execute first original AddResidualBlock call to exact native allocation stop
        working-directory: research-src
        env:
          PHOTOSPHERE_THIRD_SHIFT407: '2'
          PHOTOSPHERE_FOURTH_CERES455: '1'
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py > checkpoint455-native.log 2> checkpoint455-diagnostic.log || {
            echo CHECKPOINT455_SOURCE_NATIVE_RUN_FAILED
            tail -n 100 checkpoint455-diagnostic.log
            tail -n 6 checkpoint455-native.log | cut -c1-240
            exit 1
          }
          python3 - <<'PY'
          import json
          line=next(x for x in open("checkpoint455-native.log")
                    if x.startswith("CHECKPOINT395_NATIVE_POINT_SETUP_THIRD_ROBUST_ENTRY_REPORT="))
          d=json.loads(line.split("=",1)[1])
          entry=d["checkpoint455_fourth_native_first_registration_entry"]
          ctor=d["checkpoint454_fourth_native_ceres_full_problem_constructor"]
          getters=d["checkpoint442_fourth_original_native_getters"]
          assert ctor["source_original_full_problem_constructor_source_executed"]
          assert entry["checkpoint"]==455
          assert entry["original_source_0x128e04_call_executed"]
          assert entry["original_source_0x133ba0_wrapper_dereference_executed"]
          assert entry["original_source_0x134720_registration_entry_executed"]
          assert entry["original_source_native_problem_pimpl_owned"]
          assert entry["original_source_registration_cost_and_loss_identical"]
          assert entry["original_source_parameter_array_identical"]
          assert entry["original_source_four_parameter_block_sizes"]==[4,4,2,1]
          assert entry["original_source_parameter_count_check_passed"]
          assert entry["original_source_native_problem_option_flag_zero"]
          assert entry["original_source_first_allocator_request_bytes"]==32
          assert not entry["original_source_first_allocator_called"]
          assert entry["original_source_first_parameter_lookup_unexecuted"]
          assert entry["original_source_residual_block_registration_unexecuted"]
          assert entry["original_source_first_native_add_boundary_pc"]=="0x13478c"
          assert entry["original_source_constructor_454_reused_and_verified"]
          assert not entry["original_source_ceres_optimization_unexecuted"] is False
          assert getters["source_original_first_registration_455_completed"]
          assert getters["source_original_problem_ctor_454_completed"]
          assert getters["source_original_point_row_451_completed"]
          assert getters["source_original_same_live_six_matcher_pair_records_verified"]
          assert getters["source_original_pair_buffer_unchanged"]
          assert getters["source_original_source_camera_unchanged"]
          assert getters["source_original_provider_owned_children_unchanged"]
          assert getters["source_original_nested_vector_payloads_unchanged_443"]
          vectors=getters["source_original_matcher_owned_nested_vectors_443"]
          assert [v["point28"]["count"] for v in vectors]==[25,15,16,11,0,19]
          assert sum(v["point28"]["count"] for v in vectors)==86
          print("CHECKPOINT455_SOURCE_NATIVE_ENTRY_VERIFIED")
          print("CHECKPOINT455_SOURCE_ONLY_RECEIPT=" + json.dumps({
              "entry":entry,"four_image_statuses":[0,0,0,0,2,0],
              "source_observations":86,"add_residual_complete":False},sort_keys=True))
          PY
      - name: Delete original proprietary APK and ELF
        if: always()
        working-directory: research-src
        run: |
          rm -f original.apk research/native/liblightcycle.so
      - name: Upload source-only diagnostic
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-455-source-original-first-add
          path: |
            research-src/checkpoint455-diagnostic.log
          if-no-files-found: error
          retention-days: 7
