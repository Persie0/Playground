name: ImagePdfScaler Impeccable PR28 validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imagepdfscaler-impeccable-pr28-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Confirm private checkout credential
        env:
          APP_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$APP_TOKEN"
      - name: Checkout Photo Print Size PR branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/ImagePdfScaler
          ref: feature/impeccable-print-workflow-ux
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze Flutter source
        id: analyze
        working-directory: app
        continue-on-error: true
        run: flutter analyze --no-pub
      - name: Run focused interface regression tests
        id: focused
        working-directory: app
        continue-on-error: true
        run: flutter test --no-pub --reporter expanded test/project_home_page_test.dart test/editor_page_logic_test.dart test/dialog_validation_test.dart test/edge_aware_horizontal_scroll_test.dart
      - name: Run full Flutter tests
        id: all_tests
        working-directory: app
        continue-on-error: true
        run: flutter test --no-pub
      - name: Require all checks to pass
        if: always()
        env:
          ANALYZE: ${{ steps.analyze.outcome }}
          FOCUSED: ${{ steps.focused.outcome }}
          ALL_TESTS: ${{ steps.all_tests.outcome }}
        run: |
          echo "analyze=$ANALYZE focused=$FOCUSED full=$ALL_TESTS"
          test "$ANALYZE" = success
          test "$FOCUSED" = success
          test "$ALL_TESTS" = success
