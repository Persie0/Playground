name: Noise Remover PR review 2026-10-05

on:
  push:
    paths:
      - '.github/workflows/noise-remover-pr-review-20261005.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Verify rebased PR 195
    steps:
      - name: Checkout exact Noise Remover head
        uses: actions/checkout@v5
        with:
          repository: Persie0/noise_remover
          ref: cd8cca6850c69fd5b378b245e283205cf5082d36
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Run full Flutter tests
        working-directory: app
        run: flutter test --concurrency=1 --timeout 2m --reporter expanded
      - name: Run analyzer
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
