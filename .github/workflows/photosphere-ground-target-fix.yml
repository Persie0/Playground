name: Photosphere ground target stability fix

on:
  push:
    branches: [photosphere-ci-v2]
    paths:
      - '.github/workflows/photosphere-ground-target-fix.yml'
      - 'tools/photosphere_ground_target_fix.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Photosphere source
        uses: actions/checkout@v4
        with:
          repository: Persie0/Photosphere-
          ref: audit/code-hardening-3
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true
          path: private-app

      - name: Apply ground-target stability patch
        working-directory: private-app
        run: |
          python3 ../tools/photosphere_ground_target_fix.py
          sed -i '/^double _compatHypot/,/^}$/d' lib/src/services/motion_pose_tracker.dart

      - name: Install Flutter stable
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Format, analyze, and test
        working-directory: private-app
        run: |
          flutter pub get
          dart format lib/src/models/capture_plan.dart lib/src/services/motion_pose_tracker.dart lib/src/screens/capture_screen.dart test/capture_plan_test.dart
          flutter analyze
          flutter test test/capture_plan_test.dart test/native_orientation_test.dart --reporter expanded

      - name: Commit and push fix
        working-directory: private-app
        run: |
          git config user.name 'photosphere-ci-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/src/models/capture_plan.dart lib/src/services/motion_pose_tracker.dart lib/src/screens/capture_screen.dart test/capture_plan_test.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Stabilize ground and pole capture guidance'
            git push origin HEAD:audit/code-hardening-3
          fi
          git rev-parse HEAD

      - name: Generate Android runner and build debug APK
        working-directory: private-app
        run: |
          flutter create --platforms=android,ios --org com.persie --no-pub .
          dart run tool/configure_platforms.dart
          flutter pub get
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
          sha256sum build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload fixed debug APK
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-ground-target-fixed-debug-apk
          path: private-app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
