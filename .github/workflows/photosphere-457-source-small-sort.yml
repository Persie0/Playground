name: Photosphere 457 original ARM64 four-pointer Ceres sort inventory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-457-source-small-sort.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-457-source-small-sort
  cancel-in-progress: false
jobs:
  source-four-sort-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 2ab8c68a3cbe416230d4e188d4d62112849710dd
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify pinned research source and Python
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2ab8c68a3cbe416230d4e188d4d62112849710dd
          python3 -m pip install --quiet --break-system-packages capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint457/scan_native_four_pointer_sort.py
      - name: Validate original APK/ELF integrity
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Decode exact original four-pointer sort source opcodes
        working-directory: research-src
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint457/scan_native_four_pointer_sort.py research/native/liblightcycle.so --output checkpoint457-source-sort.json > checkpoint457-scan.log
          python3 - <<'PY'
          import json
          d=json.load(open("checkpoint457-source-sort.json"))
          assert d["source_opcode_pins_verified"]
          assert not d["source_four_element_sort_executed"]
          assert d["sort_dispatch_original_rodata_jump_targets"][4]=="0x3cf0e0"
          print("CHECKPOINT457_ORIGINAL_SORT_RODATA_JUMP_TARGETS="+json.dumps(d["sort_dispatch_original_rodata_jump_targets"]))
          print("CHECKPOINT457_SORT_SOURCE_STATIC_VERIFIED")
          for name in ("sort_dispatch","four_element_sort","sort_tail"):
              print("CHECKPOINT457_SORT_SOURCE_WINDOW_"+name.upper()+"="+json.dumps(d["windows"][name],separators=(",",":")))
          PY
      - name: Remove original binaries before artifact
        if: always()
        working-directory: research-src
        run: rm -f original.apk research/native/liblightcycle.so
      - name: Upload source-only opcode inventory
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-457-original-four-sort-opcodes
          path: research-src/checkpoint457-source-sort.json
          retention-days: 7
          if-no-files-found: error
