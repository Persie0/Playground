name: ToiletCompass Impeccable native Android captures

on:
  push:
    branches:
      - impeccable/toiletcompass-ux-qa
    paths:
      - .github/workflows/toiletcompass-impeccable-native-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-ui-captures:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout app from private repo via Playground secret
        uses: actions/checkout@v4
        with:
          repository: Persie0/toiletcompass
          ref: impeccable/toiletcompass-ux-40-point-pass
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Android compile platform and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.13599879"

      - name: Build debug app
        working-directory: app
        run: |
          flutter pub get
          flutter create --platforms=android --project-name=toiletcompass --no-pub .
          flutter build apk --debug --no-pub

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture native first-run onboarding at multiple sizes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -eux
            mkdir -p captures
            adb install -r app/build/app/outputs/flutter-apk/app-debug.apk
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night no
            adb shell am start -n at.persie0.toiletcompass/.MainActivity
            sleep 15
            adb exec-out screencap -p > captures/phone-light.png
            adb shell cmd uimode night yes
            sleep 4
            adb exec-out screencap -p > captures/phone-dark.png
            adb shell settings put system font_scale 1.3
            sleep 5
            adb exec-out screencap -p > captures/phone-dark-large-text.png
            adb shell wm size 800x1280
            adb shell wm density 160
            sleep 6
            adb exec-out screencap -p > captures/tablet-sized-large-text.png
            adb shell wm size reset
            adb shell wm density reset
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night no

      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toiletcompass-native-onboarding-views
          path: captures/*.png
          if-no-files-found: warn
