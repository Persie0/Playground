name: Image Enhancer app audit 2026-09-04 v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/image-enhancer-app-audit-2026-09-04-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/image_enhancer
  TARGET_BRANCH: fix/app-audit-2026-09-04

jobs:
  audit-fix-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private Image Enhancer
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply audited fixes
        working-directory: app
        run: |
          set -euo pipefail
          git checkout -B "$TARGET_BRANCH"
          python3 - <<'PY'
          from pathlib import Path

          def load(path): return Path(path).read_text()
          def save(path, text): Path(path).write_text(text)
          def one(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              return text.replace(old, new, 1)
          def between(text, start, end, replacement, label):
              a = text.find(start)
              if a < 0: raise SystemExit(f'{label}: start not found')
              b = text.find(end, a)
              if b < 0: raise SystemExit(f'{label}: end not found')
              return text[:a] + replacement + text[b:]

          # 1) RevenueCat entitlement correctness and production logging.
          p = 'lib/services/subscription_service.dart'
          s = load(p)
          s = one(s, '    await Purchases.setLogLevel(LogLevel.debug);',
              """    if (kDebugMode) {
                await Purchases.setLogLevel(LogLevel.debug);
              }""", 'RevenueCat debug log level')
          start = '    final isProNow = customerInfo.entitlements.active.isNotEmpty;'
          end = '    // Only update if status changed'
          replacement = """    final entitlement = customerInfo.entitlements.active[_entitlementId];
              final isProNow = entitlement != null;
              // RevenueCat uses a null expiration date for lifetime entitlements.
              // Never infer this app's Pro state from a different entitlement.
              final isLifetimeNow =
                  entitlement != null && entitlement.expirationDate == null;

          """
          s = between(s, start, end, replacement, 'exact Pro entitlement')
          save(p, s)

          # 2) Model selection observes current Pro state and cannot switch the
          # selected key beneath an in-flight download.
          p = 'lib/model_selection_page.dart'
          s = load(p)
          s = one(s,
              """  final Map<String, ModelInfo> availableModels;
            final bool isProUser;

            const ModelSelectionPage({
              super.key,
              required this.availableModels,
              required this.isProUser,
            });""",
              """  final Map<String, ModelInfo> availableModels;

            const ModelSelectionPage({
              super.key,
              required this.availableModels,
            });""", 'remove Pro snapshot field')
          s = one(s, '  bool _isToastShown = false;',
              """  bool _isToastShown = false;

            bool get _isProUserNow =>
                Provider.of<SettingsProvider>(context, listen: false).getBoughtPro();""",
              'current Pro helper')
          s = one(s, '    if (model.isPro && !widget.isProUser) {',
              '    if (model.isPro && !_isProUserNow) {', 'download Pro check')
          build_anchor = """    final isDark = Theme.of(context).brightness == Brightness.dark;
            final bgColor = isDark ? _bgDark : _bgLight;"""
          s = one(s, build_anchor,
              """    final isProUser = Provider.of<SettingsProvider>(context).getBoughtPro();
            final isDark = Theme.of(context).brightness == Brightness.dark;
            final bgColor = isDark ? _bgDark : _bgLight;""",
              'watch Pro in model build')
          if s.count('widget.isProUser') != 2:
              raise SystemExit(f'model picker stale Pro refs: {s.count("widget.isProUser")}')
          s = s.replace('widget.isProUser', 'isProUser')
          dropdown_start = '                        onChanged: (val) {'
          dropdown_end = '                        },\n                      ),'
          a = s.find(dropdown_start)
          b = s.find(dropdown_end, a)
          if a < 0 or b < 0: raise SystemExit('model dropdown callback anchors missing')
          body = s[a:b + len('                        },')]
          if '_isAdGatedModel(val)' not in body:
              raise SystemExit('unexpected model dropdown callback')
          new_body = """                        onChanged: _isDownloading
                            ? null
                            : (val) {
                                setState(() => _selectedModelKey = val);
                                if (val != null &&
                                    _isAdGatedModel(val) &&
                                    !isProUser) {
                                  _showAdGatedModelInfo();
                                }
                              },"""
          s = s[:a] + new_body + s[b + len('                        },'):]
          save(p, s)

          # 3) Banner observes entitlement changes so ads disappear immediately.
          p = 'lib/adbanner.dart'
          s = load(p)
          old = """  Widget build(BuildContext context) {
            if (!Provider.of<SettingsProvider>(context, listen: false).getBoughtPro() &&
                canShowAd) {"""
          new = """  Widget build(BuildContext context) {
            final isProUser = Provider.of<SettingsProvider>(context).getBoughtPro();
            if (!isProUser && canShowAd) {"""
          s = one(s, old, new, 'banner Pro listener')
          save(p, s)

          # 4) Home page: lifecycle guards, lower-memory saving, and safe result IO.
          p = 'lib/super_resolution_home_page.dart'
          s = load(p)
          s = one(s,
              """    final settings = Provider.of<SettingsProvider>(context, listen: false);
            final result = await Navigator.push(
              context,
              MaterialPageRoute(
                builder: (context) => ModelSelectionPage(
                  availableModels: _availableModels,
                  isProUser: settings.getBoughtPro(),
                ),
              ),
            );""",
              """    final result = await Navigator.push(
              context,
              MaterialPageRoute(
                builder: (context) => ModelSelectionPage(
                  availableModels: _availableModels,
                ),
              ),
            );""", 'home model picker call')
          s = one(s, '        if (modelFile.existsSync()) {',
              '        if (await modelFile.exists()) {', 'async model exists')
          s = one(s, '    if (!imageToProcess.existsSync()) {',
              '    if (!await imageToProcess.exists()) {', 'async input exists')
          s = one(s,
              '  Future<void> _pickImage({bool batch = false}) async {\n    if (_isPickingImage || _isProcessing || _processRequestInFlight) return;',
              """  Future<void> _pickImage({bool batch = false}) async {
            if (_isPickingImage ||
                _isProcessing ||
                _processRequestInFlight ||
                _isSaving ||
                _isSharing ||
                _isSharePreparing) {
              return;
            }""", 'pick IO guard')
          s = one(s,
              """        final List<XFile> images = await PermissionHelper.runWithRetry(
              () => _picker.pickMultiImage(),
            );
            if (images.isNotEmpty) {""",
              """        final List<XFile> images = await PermissionHelper.runWithRetry(
              () => _picker.pickMultiImage(),
            );
            if (!mounted) return;
            if (images.isNotEmpty) {""", 'batch picker mounted')
          s = one(s,
              """          for (final file in files) {
                await _validateImageForScale(file, scale);
              }
              setState(() {""",
              """          for (final file in files) {
                await _validateImageForScale(file, scale);
                if (!mounted) return;
              }
              if (!mounted) return;
              setState(() {""", 'batch validation mounted')
          s = one(s,
              """        final XFile? image = await PermissionHelper.runWithRetry(
              () => _picker.pickImage(source: ImageSource.gallery),
            );
            if (image != null) {""",
              """        final XFile? image = await PermissionHelper.runWithRetry(
              () => _picker.pickImage(source: ImageSource.gallery),
            );
            if (!mounted) return;
            if (image != null) {""", 'single picker mounted')
          # Insert a guard immediately before the single-image state commit.
          marker = """          setState(() {
                _selectedImage = file;
                _imageSize = size;"""
          s = one(s, marker,
              """          if (!mounted) return;
              setState(() {
                _selectedImage = file;
                _imageSize = size;""", 'single selection mounted')
          s = one(s,
              '  void _recordUpscaleDiagnostics(Map<String, Object?> diagnostics) {\n    final settings = Provider.of<SettingsProvider>(context, listen: false);',
              """  void _recordUpscaleDiagnostics(Map<String, Object?> diagnostics) {
            if (!mounted) return;
            final settings = Provider.of<SettingsProvider>(context, listen: false);""",
              'diagnostics mounted')
          s = one(s,
              """    } catch (_) {
              await upscaler.dispose();
              rethrow;
            }
            _upscaler = upscaler;""",
              """    } catch (_) {
              await upscaler.dispose();
              rethrow;
            }
            if (!mounted) {
              await upscaler.dispose();
              return;
            }
            _upscaler = upscaler;""", 'late session disposal')
          s = one(s,
              """      final scaleFactor = _getScaleFactorForModel(modelKey);
            await _validateImageForScale(imageToProcess, scaleFactor);
            await _ensureModelSession(modelKey: modelKey, overlap: overlap);

            if (_upscaler == null) {
              throw Exception(l10n.modelInfoMissing);
            }""",
              """      final scaleFactor = _getScaleFactorForModel(modelKey);
            await _validateImageForScale(imageToProcess, scaleFactor);
            if (!mounted) return;
            await _ensureModelSession(modelKey: modelKey, overlap: overlap);
            if (!mounted) return;

            final upscaler = _upscaler;
            if (upscaler == null) {
              throw Exception(l10n.modelInfoMissing);
            }""", 'stable session ref')
          s = one(s,
              """      late final ui.Image upscaledImage;
            try {
              upscaledImage = await _upscaler!.upscaleImage(""",
              """      if (!mounted) {
              sourceImage.dispose();
              return;
            }

            late final ui.Image upscaledImage;
            try {
              upscaledImage = await upscaler.upscaleImage(""", 'no inference after dispose')
          s = one(s,
              """      } else {
            // For batch mode, the caller will handle the state
            _upscaledImage = upscaledImage;
          }""",
              """      } else if (mounted) {
            // For batch mode, the caller will handle the state.
            _upscaledImage = upscaledImage;
          } else {
            upscaledImage.dispose();
          }""", 'late batch result disposal')
          s = one(s,
              """        if (e is UnsupportedFileException) {
              _showError(l10n.unsupportedFileError);
            } else {
              _showError(l10n.failedToUpscaleImage(e.toString()));
            }""",
              """        if (e is UnsupportedFileException) {
              _showError(l10n.unsupportedFileError);
            } else if (e is ImageTooLargeException) {
              _showError(e.message);
            } else {
              _showError(l10n.failedToUpscaleImage(e.toString()));
            }""", 'single size message')
          s = one(s,
              """        await _upscaleImage(
              imageToProcess: images[i],
              modelKey: modelKey,
              overlap: overlap,
              batchItem: true,
            );
            if (_upscaledImage != null) {""",
              """        await _upscaleImage(
              imageToProcess: images[i],
              modelKey: modelKey,
              overlap: overlap,
              batchItem: true,
            );
            if (!mounted) break;
            if (_upscaledImage != null) {""", 'batch loop mounted')
          s = one(s,
              '      if (mounted) _showError(l10n.failedToUpscaleImage(e.toString()));',
              """      if (mounted) {
              _showError(
                e is ImageTooLargeException
                    ? e.message
                    : l10n.failedToUpscaleImage(e.toString()),
              );
            }""", 'batch size message')
          s = one(s,
              '        final bytes = await tempFile.readAsBytes();\n', '', 'remove batch byte copy')
          s = one(s,
              """        final result = await PermissionHelper.runWithRetry<dynamic>(
              () async => await ImageGallerySaverPlus.saveImage(
                bytes,
                quality: 100,
                name: '${stem}_upscaled',
              ),
            );""",
              """        final result = await PermissionHelper.runWithRetry<dynamic>(
              () async => await ImageGallerySaverPlus.saveFile(
                tempFile.path,
                name: '${stem}_upscaled',
              ),
            );""", 'batch saveFile')
          s = one(s,
              """      final preparedFile = File(preparedPath);
            final bytes = await preparedFile.readAsBytes();

            final result = await PermissionHelper.runWithRetry<dynamic>(
              () async => await ImageGallerySaverPlus.saveImage(
                bytes,
                quality: 100,
                name: preparedFile.uri.pathSegments.last.replaceAll('.png', ''),
              ),
            );""",
              """      final preparedFile = File(preparedPath);

            final result = await PermissionHelper.runWithRetry<dynamic>(
              () async => await ImageGallerySaverPlus.saveFile(
                preparedFile.path,
                name: preparedFile.uri.pathSegments.last.replaceAll('.png', ''),
              ),
            );""", 'single saveFile')
          s = one(s,
              """                                  onPressed:
                                      _isSaving ||
                                          _isProcessing ||
                                          _processRequestInFlight
                                      ? null
                                      : _handleProcessRequest,""",
              """                                  onPressed:
                                      _isSaving ||
                                          _isSharing ||
                                          _isSharePreparing ||
                                          _isProcessing ||
                                          _processRequestInFlight
                                      ? null
                                      : _handleProcessRequest,""", 'reprocess IO guard')
          save(p, s)
          PY

          dart format lib/services/subscription_service.dart lib/model_selection_page.dart lib/adbanner.dart lib/super_resolution_home_page.dart
          git diff --check

      - name: Analyze and test app
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Test super-resolution package
        working-directory: app/flutter_super_resolution
        run: |
          flutter pub get
          flutter test
      - name: Compile Android debug APK
        working-directory: app
        run: flutter build apk --debug
      - name: Commit and push verified fixes
        working-directory: app
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'Persie0'
          git config user.email '76871553+Persie0@users.noreply.github.com'
          git add lib
          git commit -m 'Harden app lifecycle, entitlements, and result IO'
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/Persie0/image_enhancer.git"
          git push --force origin HEAD:"$TARGET_BRANCH"
