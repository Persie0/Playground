name: Traffic counting tracker dataset probe

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/traffic-counting-light-main
  APP_REF: deps/roboflow-bytetrack-runtime-final

jobs:
  inspect-dataset:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inspect replay geometry
        shell: bash
        run: |
          cd app
          file experiments/intersection_analysis/heatmaps/frame.jpg || true
          file experiments/intersection_analysis/heatmaps/bg.jpeg || true
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path

          root = Path('experiments/intersection_analysis/heatmaps')
          path = root / 'detections_all_frames.csv'
          counts = Counter()
          classes = Counter()
          min_frame = None
          max_frame = None
          conf_min = None
          conf_max = None
          max_x2 = 0.0
          max_y2 = 0.0
          min_x1 = float('inf')
          min_y1 = float('inf')
          total = 0
          with path.open(newline='', encoding='utf-8-sig') as f:
              reader = csv.DictReader(f)
              print('detections columns:', reader.fieldnames)
              for row in reader:
                  total += 1
                  frame = int(row['frame'])
                  counts[frame] += 1
                  min_frame = frame if min_frame is None else min(min_frame, frame)
                  max_frame = frame if max_frame is None else max(max_frame, frame)
                  classes[row['class_name']] += 1
                  c = float(row['confidence'])
                  conf_min = c if conf_min is None else min(conf_min, c)
                  conf_max = c if conf_max is None else max(conf_max, c)
                  min_x1 = min(min_x1, float(row['x1']))
                  min_y1 = min(min_y1, float(row['y1']))
                  max_x2 = max(max_x2, float(row['x2']))
                  max_y2 = max(max_y2, float(row['y2']))
          print('raw_total_rows:', total)
          print('frame_range:', (min_frame, max_frame), 'unique_frames:', len(counts))
          print('classes:', classes)
          print('confidence_range:', (conf_min, conf_max))
          print('coordinate_extrema:', (min_x1, min_y1, max_x2, max_y2))
          print('detections_per_frame_min_max:', min(counts.values()), max(counts.values()))

          tracks = root / 'tracks_bytetrack.csv'
          with tracks.open(newline='', encoding='utf-8-sig') as f:
              reader = csv.DictReader(f)
              print('historical track columns:', reader.fieldnames)
              track_ids = set()
              rows = 0
              max_track_frame = -1
              for row in reader:
                  rows += 1
                  track_ids.add(int(row['track_id']))
                  max_track_frame = max(max_track_frame, int(row['frame']))
          print('historical_track_rows:', rows)
          print('historical_unique_tracks:', len(track_ids))
          print('historical_max_frame:', max_track_frame)
          PY
