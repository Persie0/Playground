name: Photosphere 403-404 second native graph tree/pair ABI and Rust
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-batch-403-404.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-batch-403-404
  cancel-in-progress: false
jobs:
  native-second-postlink-and-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Exact SHA read-only original ARM64 research checkout
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 5adbf961e1864cf8ba01f25461214563c6edc2e1
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Assert research source SHA and compile Python source
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '5adbf961e1864cf8ba01f25461214563c6edc2e1'
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py
      - name: Verify pinned original APK and ELF checksums
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Original source second postlink tree and relative pair constructor callsite
        working-directory: research-src
        env:
          PHOTOSPHERE_EXTEND_SECOND_POSTLINK: '1'
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py > checkpoint403-full.log 2> checkpoint403-diagnostic.log
          python3 - <<'PY'
          import json
          source=next(x for x in open('checkpoint403-full.log')
              if x.startswith('CHECKPOINT395_NATIVE_POINT_SETUP_THIRD_ROBUST_ENTRY_REPORT='))
          d=json.loads(source.split('=',1)[1])
          first=d['checkpoint388_third_native_full']
          pair=d['checkpoint391_third_matcher_owned']
          graph=d['checkpoint393_third_source_graph']
          post=d['checkpoint395_third_postlink']
          desc=d['checkpoint397_second_matcher_descriptor']
          second=d['checkpoint399_second_robust']
          assert d['original_elf_sha256']=='878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1'
          assert d['source_original_third_image_callsite'].get('original_third_execution_error') is None
          assert not d['original_full_solver_ceres_executed']
          assert d['bionic_rand_stream_test_controlled']
          assert first['native_third_550_trials_finished']
          assert first['native_third_refit_executed']
          assert first['native_original_robust_return']['native_return_w0']==1
          assert pair['native_pair_first_second_i32']==[0,2]
          assert pair['source_native_row_count']==25
          assert pair['source_original_highlevel_success_w0']==1
          assert graph['original_third_native_first_link_executed']
          assert graph['original_third_native_second_link_executed']
          assert graph['original_source_graph_link_delta_verified']
          assert post['original_native_both_reciprocal_links_earlier']
          assert post['original_source_endpoint']=='second_postlink_pair_constructor_callsite'
          assert not post['original_native_next_matcher_not_executed']
          assert post['original_native_pair_constructor_not_executed']
          assert desc['source_native_raw_match_count']==47
          assert desc['source_second_native_descriptor_result_pc']=='0x1206e4'
          assert desc['source_native_descriptor_rows_not_host_injected']
          assert second['native_source_threshold_pc']=='0x1208a0'
          assert second['source_threshold_passed']
          assert second['native_match_count']==47
          assert second['source_original_ray_preparation_pc']=='0x120914'
          assert second['original_preprocessor_pc']=='0x127bac'
          assert [x['source_native_ray_count'] for x in second['original_source_ray_vectors']]==[47,47]
          assert second['original_native_robust_entry_pc']=='0x30f860'
          assert second['source_first_pair_gate_pc']=='0x30fde8'
          assert second['native_original_first_pair_indices']==[0,24]
          assert second['source_native_ransac_trial_count']==550
          assert second['source_native_completed_trial_count_w21']==550
          assert second['source_native_full_550_trials_executed']
          assert second['source_native_svd_call_count']>0
          assert second['source_original_postloop_pc']=='0x310418'
          assert second['source_native_rand_draws']==[0,24]*550
          assert second['source_native_robust_return_pc']=='0x120918'
          assert second['source_native_robust_return_w0']==1
          assert not second['source_original_stop_before_second_point_rows']
          assert second['active'] is False
          assert second['original_full_second_ceres_executed'] is False
          graph2=d['checkpoint401_second_source_graph']
          assert graph2['native_original_second_point_writer_pc']=='0x122384'
          assert graph2['native_original_second_link_callee_pc']=='0x122dbc'
          assert graph2['second_native_highlevel_return_reached']
          assert graph2['native_original_second_highlevel_return_w0']==1
          assert graph2['native_second_pair_image_indices_i32']==[1,2]
          assert 0<graph2['native_second_point_row_count']<=100
          assert len(graph2['native_source_point_row_calls'])==graph2['native_second_point_row_count']
          assert graph2['native_source_point_vector_growth']
          assert graph2['original_second_first_link_executed']
          assert graph2['original_second_second_link_executed']
          assert graph2['source_second_reciprocal_delta_verified']
          assert graph2['native_original_second_addimage_w28']==1
          assert graph2['second_original_graph_link_end_boundary']=='0x11dbb8'
          a0=graph2['original_source_second_owner_a_before']['source_native_elements_8_hex']
          b0=graph2['original_source_second_owner_b_before']['source_native_elements_8_hex']
          a1=graph2['original_source_second_owner_a_after_first']['source_native_elements_8_hex']
          b1=graph2['original_source_second_owner_b_after_first']['source_native_elements_8_hex']
          a2=graph2['original_source_second_owner_a_after_both']['source_native_elements_8_hex']
          b2=graph2['original_source_second_owner_b_after_both']['source_native_elements_8_hex']
          assert a1[:-1]==a0 and len(a1)==len(a0)+1 and b1==b0
          assert a2==a1 and b2[:-1]==b1 and len(b2)==len(b1)+1
          assert len(set(r['original_source_owner'] for r in graph2['native_source_point_row_calls']))==1
          assert all(r['source_native_image_index_pair_i32']==[1,2]
                     for r in graph2['native_source_point_row_calls'])
          assert not graph2['source_original_second_pair_constructor_executed']
          assert not graph2['source_original_ceres_or_device_pixels_executed']
          post2=d['checkpoint403_second_postlink']
          assert post2['source_original_second_postlink_active']
          assert post2['source_original_post_second_graph_entry_pc']=='0x11dbb8'
          assert post2['source_native_all_three_graph_pair_links_executed']
          assert post2['source_original_endpoint']=='pair_constructor_callsite'
          assert post2['native_source_postlink_trace']
          assert post2['native_source_postlink_trace'][-1]['source_pc']=='0x11de1c'
          assert post2['source_original_pair_constructor_call']['source_callsite_pc']=='0x11de1c'
          assert post2['source_original_pair_constructor_call']['source_constructor_callee_pc']=='0x316e24'
          assert len(post2['source_original_pair_constructor_call']['original_native_pose_a_9_f32_u32'])==9
          assert len(post2['source_original_pair_constructor_call']['original_native_pose_b_9_f32_u32'])==9
          assert post2['source_original_pair_constructor_call']['source_native_pose_arrays_from_original_stack']
          assert not post2['source_original_pair_constructor_call']['source_original_pair_constructor_executed']
          assert post2['source_native_unique_owner_count']==3
          assert sum(post2['source_native_owner_pairwise_equality'].values())==1
          assert not post2['native_original_full_solver_executed']
          open('checkpoint403-native.json','w').write(json.dumps(d,sort_keys=True,indent=2)+'\n')
          print('CHECKPOINT403_SECOND_ORIGINAL_NATIVE_POSTLINK_PASS',json.dumps({
              'original_first_pair':[0,2],
              'second_candidate':[1,2],
              'second_descriptor_matches':desc['source_native_raw_match_count'],
              'second_source_native_trials':second['source_native_ransac_trial_count'],
              'second_source_native_svd_calls':second['source_native_svd_call_count'],
              'second_original_native_refit_executed':second.get('source_native_refit_executed',False),
              'second_original_native_return_w0':second['source_native_robust_return_w0'],
              'second_source_original_point_rows':graph2['native_second_point_row_count'],
              'source_graph_a_before_after':[len(a0),len(a2)],
              'source_graph_b_before_after':[len(b0),len(b2)],
              'native_second_graph_link_executed':graph2['source_second_reciprocal_delta_verified'],
              'source_original_postlink_endpoint':post2['source_original_endpoint'],
              'native_graph_unique_owners':post2['source_native_unique_owner_count'],
              'source_tree_trace_selected_pcs':len(post2['native_source_postlink_trace']),
              'original_pair_constructor_callsite':post2['source_original_pair_constructor_call']['source_callsite_pc'],
              'original_pair_constructor_executed':False,
              'native_android_bionic_rng_reproduced':False,
          },sort_keys=True))
          PY
      - name: Delete proprietary original APK and ELF before source archive
        if: always()
        working-directory: research-src
        run: |
          rm -f original.apk research/native/liblightcycle.so com.google.android.GoogleCamera_*.apk
      - name: Exact SHA read-only private Rust app checkout
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 1798934e1e3a7cf408404f43d420f538c0c8444f
          path: app-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: One grouped Rust all-targets source differential and regressions
        working-directory: app-src
        env:
          PHOTOSPHERE_403_NATIVE_JSON: ${{ github.workspace }}/research-src/checkpoint403-native.json
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '1798934e1e3a7cf408404f43d420f538c0c8444f'
          test -s "$PHOTOSPHERE_403_NATIVE_JSON"
          cargo test --locked --all-targets > checkpoint404-rust.log 2>&1 || { tail -n 180 checkpoint404-rust.log; exit 1; }
          grep '^test result:' checkpoint404-rust.log | tail -n 12
      - name: Archive only source synthetic numeric receipts and grouped Rust logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-403-404-native-second-postlink-source
          path: |
            research-src/checkpoint403-native.json
            research-src/checkpoint403-diagnostic.log
            app-src/checkpoint404-rust.log
          retention-days: 7
          if-no-files-found: warn
