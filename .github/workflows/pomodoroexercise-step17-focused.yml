name: FocusMove Step 17 focused recommendation and widget tests
# Recheck recommendation rotation and explicit rest controls after visibility fix.
on:
  push:
    paths:
      - '.github/workflows/pomodoroexercise-step17-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Clone FocusMove Step 17 private branch
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/17-break-recommendation-ux https://github.com/Persie0/pomodoroexercise.git source
      - name: Validate break ranking, controller rotation and activity UI
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          timeout --signal=TERM 180s flutter test test/activity_catalog_test.dart test/activity_controller_test.dart test/activities_widget_test.dart --reporter expanded --timeout 45s
