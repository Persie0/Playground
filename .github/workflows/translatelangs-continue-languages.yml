name: Continue private translations
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Private repository branch
        required: true
        default: main
        type: string
permissions:
  contents: read
concurrency:
  group: translatelangs-${{ inputs.branch || 'main' }}
  cancel-in-progress: false
env:
  APP_REPOSITORY: Persie0/translateLangs
  APP_REF: ${{ inputs.branch || 'main' }}
jobs:
  continue-translations:
    runs-on: ubuntu-latest
    timeout-minutes: 390
    steps:
      - name: Validate private repository token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout private app revision
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: app
      - name: Checkout private CI harness
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-ci
          sparse-checkout: .github/playground
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run private translation harness
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bash private-ci/.github/playground/continue-languages.sh app "$APP_REF"
