name: AlarmChallenges Flutter Android debug

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/alarmchallenges-flutter-build.yml'
      - 'alarmchallenges-flutter-ci-trigger.txt'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Checkout AlarmChallenges from private repo
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          test -n "$REPO_TOKEN" || { echo "Private repo read token is not configured"; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth=1 --branch=feature/flutter-morning-island \
            https://github.com/Persie0/alarmchallenges.git source
      - name: Generate missing Android/iOS Flutter scaffold
        working-directory: source/flutter_app
        run: flutter create --project-name alarmchallenges --org com.persie --platforms android,ios .
      - name: Flutter packages and static analysis
        working-directory: source/flutter_app
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test || true
          flutter analyze --no-fatal-infos
      - name: Flutter tests and debug APK
        working-directory: source/flutter_app
        run: |
          flutter test
          flutter build apk --debug
      - name: Verify APK and source digest
        working-directory: source/flutter_app
        run: |
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$APK"
          git -C .. rev-parse HEAD > build/app/outputs/flutter-apk/SOURCE_COMMIT.txt
          sha256sum "$APK" > build/app/outputs/flutter-apk/SHA256SUMS.txt
      - name: Upload installable APK and test outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alarmchallenges-flutter-debug-apk
          path: |
            source/flutter_app/build/app/outputs/flutter-apk/*.apk
            source/flutter_app/build/app/outputs/flutter-apk/*.txt
          if-no-files-found: warn
          retention-days: 7
