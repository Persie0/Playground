name: PricingKit integration

on:
  push:
    branches: [pricingkit-integration-run]
    paths:
      - '.github/workflows/pricingkit-integration.yml'
      - 'pricingkit/trigger.txt'

permissions:
  contents: read

env:
  TARGET_REPOSITORY: Persie0/PricingKit
  TARGET_BRANCH: integrate-oskar-smart-pricing

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate cross-repo token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout PricingKit integration branch
        uses: actions/checkout@v5
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: PricingKit

      - name: Reapply Persie0 changes on Oskar head
        working-directory: PricingKit
        run: |
          set -euo pipefail
          git config user.name "Persie0 Playground CI"
          git config user.email "actions@users.noreply.github.com"

          if git log --format='%s' -n 20 | grep -Fq 'feat: update Google Play region currency resolution and display in bulk pricing modal'; then
            echo 'Persie0 changes already applied; skipping cherry-picks.'
            exit 0
          fi

          for sha in \
            3713780cf7561c25b1d577637c1ce3a25f8f35a3 \
            884e0e277e45087a5d5768dc60b18706f523494a \
            f5ab63f389e9f1e2e81378f13001f9484b8a3ae4 \
            ef3a7298b17cd2899d245652bf8490fa0e5c9270 \
            38737f1d91f5c26121825034b86449afa09962af
          do
            if git cherry-pick "$sha"; then
              continue
            fi

            conflicts="$(git diff --name-only --diff-filter=U)"
            if [[ "$sha" == "3713780cf7561c25b1d577637c1ce3a25f8f35a3" && "$conflicts" == "src/lib/google-play/currency.ts" ]]; then
              python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/lib/google-play/currency.ts')
          text = path.read_text()
          pattern = re.compile(
              r"<<<<<<< HEAD\n"
              r"export type PricingStrategy = 'direct' \| 'smart' \| 'ppp' \| 'bigmac' \| 'netflix' \| 'custom';\n"
              r"export type RoundingMode = 'nearest-tier' \| 'nearest-99' \| 'round-up' \| 'none';\n"
              r"=======\n"
              r"export type PricingStrategy = 'direct' \| 'ppp' \| 'bigmac' \| 'netflix' \| 'custom';\n"
              r"export type RoundingMode = 'nearest-tier' \| 'nearest-99' \| 'round-up' \| 'nearest-x9' \| 'round-up-x9' \| 'none';\n"
              r">>>>>>> .*?\n"
          )
          replacement = (
              "export type PricingStrategy = 'direct' | 'smart' | 'ppp' | 'bigmac' | 'netflix' | 'custom';\n"
              "export type RoundingMode = 'nearest-tier' | 'nearest-99' | 'round-up' | 'nearest-x9' | 'round-up-x9' | 'none';\n"
          )
          updated, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'Expected one currency type conflict, found {count}')
          path.write_text(updated)
          PY
              git add src/lib/google-play/currency.ts
              GIT_EDITOR=true git cherry-pick --continue
              continue
            fi

            echo "::error::Unhandled cherry-pick conflict for $sha"
            git status --short
            git diff --name-only --diff-filter=U
            git diff
            exit 1
          done

      - name: Push integrated branch
        working-directory: PricingKit
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${PRIVATE_TOKEN}@github.com/${TARGET_REPOSITORY}.git"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: PricingKit
        run: |
          npm --version
          npm install --no-audit --no-fund

      - name: Run tests
        working-directory: PricingKit
        run: npm test

      - name: Build
        working-directory: PricingKit
        run: npm run build
