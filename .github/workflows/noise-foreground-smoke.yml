name: Noise Remover foreground processing smoke

on:
  push:
    branches: [background-media-processing-validation-20260928]
    paths:
      - '.github/workflows/noise-foreground-smoke.yml'
      - 'scripts/run_noise_foreground_smoke.sh'

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/noise_remover
  APP_REF: feature/android-background-media-processing-20260928

jobs:
  android-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public harness
        uses: actions/checkout@v5
        with:
          ref: background-media-processing-validation-20260928
          path: harness

      - name: Checkout noise remover feature branch
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install host FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Create long foreground fixture
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p .ci/foreground-fixtures
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i 'sine=frequency=523.25:sample_rate=48000:duration=20' \
            -f lavfi -i 'anoisesrc=color=white:sample_rate=48000:duration=20:amplitude=0.02' \
            -filter_complex '[0:a][1:a]amix=inputs=2:normalize=0' \
            -ac 1 -c:a pcm_s16le .ci/foreground-fixtures/foreground.wav
          ffprobe -v error -show_entries format=duration -of default=nw=1 .ci/foreground-fixtures/foreground.wav

      - name: Enable KVM group access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run background and lock-screen smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: app
          script: bash ../harness/scripts/run_noise_foreground_smoke.sh

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noise-foreground-smoke-diagnostics
          path: |
            app/.ci/foreground-smoke.log
            app/.ci/foreground-http.log
            app/.ci/foreground-activity.txt
            app/.ci/foreground-services-home.txt
            app/.ci/foreground-services-locked.txt
            app/.ci/foreground-notifications.txt
            app/.ci/foreground-logcat-locked.txt
            app/.ci/foreground-logcat-final.txt
          if-no-files-found: ignore
