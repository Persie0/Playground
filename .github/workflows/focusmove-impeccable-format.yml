name: FocusMove Impeccable Dart format (private PR branch)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/focusmove-impeccable-format.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private FocusMove PR branch
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/impeccable-focusmove-ui https://github.com/Persie0/pomodoroexercise.git source
      - name: Format changed Flutter files and push private PR only
        shell: bash
        working-directory: source
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          dart format \
            lib/src/design/timer_components.dart \
            lib/src/features/onboarding/onboarding_flow.dart \
            lib/src/screens/activities_home.dart \
            lib/src/screens/history_home.dart \
            lib/src/screens/home_shell.dart \
            lib/src/screens/profile_home.dart \
            lib/src/screens/timer_home.dart \
            test/activities_widget_test.dart \
            test/history_widget_test.dart \
            test/onboarding_flow_test.dart \
            test/pose_lab_widget_test.dart \
            test/privacy_settings_widget_test.dart \
            test/routine_widget_test.dart
          git config user.name 'focusmove-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add lib test
          if git diff --cached --quiet; then
            echo 'Already formatted'
          else
            git commit -m 'style: dart format Impeccable UI updates'
            AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/impeccable-focusmove-ui
          fi
