name: Root Detector native emulator smoke
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/root-detector-native-emulator.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/root_detection_app
          ref: native-kotlin-migration
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: root-detector
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDK 37
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-37.0'
      - name: Assemble native debug APK
        working-directory: root-detector
        run: gradle --no-daemon :app:assembleDebug
      - name: Enable KVM acceleration
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          ls -l /dev/kvm
      - name: Android 13 launch and EULA smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eu
            adb install root-detector/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n at.persie0.root_detection_app/.MainActivity
            sleep 8
            adb shell pidof at.persie0.root_detection_app
            adb exec-out screencap -p > root-detector-eula.png
            python3 - <<'PY'
            import re
            import subprocess
            import xml.etree.ElementTree as ET

            def tap_label(label):
                subprocess.check_call(
                    ["adb", "shell", "uiautomator", "dump", "/sdcard/root-detector-ui.xml"],
                    timeout=45
                )
                xml = subprocess.check_output(
                    ["adb", "shell", "cat", "/sdcard/root-detector-ui.xml"], text=True
                )
                for node in ET.fromstring(xml).iter("node"):
                    desc = node.attrib.get("text", "") + " " + node.attrib.get("content-desc", "")
                    if label.casefold() not in desc.casefold():
                        continue
                    coords = [int(v) for v in re.findall(r"\d+", node.attrib.get("bounds", ""))]
                    if len(coords) == 4:
                        a, b, c, d = coords
                        subprocess.check_call([
                            "adb", "shell", "input", "tap",
                            str((a+c)//2), str((b+d)//2)
                        ])
                        return
                raise RuntimeError("UI label not found: " + label)

            tap_label("I have read and agree")
            tap_label("Accept and Continue")
            PY
            sleep 12
            adb shell pidof at.persie0.root_detection_app
            adb exec-out screencap -p > root-detector-scan.png
      - name: Upload screenshots for UI comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-detector-native-smoke
          path: |
            root-detector-eula.png
            root-detector-scan.png
          if-no-files-found: ignore
          retention-days: 3
