name: Traffic dual-stream branch verification

on:
  push:
    branches:
      - traffic-dual-stream-ci

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/traffic-counting-light-main
  APP_REF: f80fcbaaf3a6fe161244c634e032e995858609fb

jobs:
  project-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout private app revision
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact runtime/test dependencies
        run: |
          cd app/edge
          python -m pip install --upgrade pip
          python -m pip install -e '.[pi,dev]'

      - name: Validate shipped configs
        env:
          PYTHONPATH: ${{ github.workspace }}/app/edge/src
        run: |
          cd app/edge
          python - <<'PY'
          from pathlib import Path
          from utils.config import Config
          for path in [
              Path("configs/runtime/pi_camera.yaml"),
              Path("configs/runtime/recording.yaml"),
              Path("configs/runtime/webcam.yaml"),
              Path("configs/benchmark/ncnn.yaml"),
          ]:
              Config.load(path)
              print(f"PASS {path}")
          PY

      - name: Focused dual-stream and runtime tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app/edge/src
        run: |
          cd app/edge
          python -m pytest -q \
            tests/test_config.py \
            tests/test_fisheye_rectifier.py \
            tests/test_preprocessors.py \
            tests/test_image_loader_transform.py \
            tests/test_processed_image_roi.py \
            tests/test_rpi_dual_stream_loader.py \
            tests/test_analysis_pipeline.py \
            tests/test_reader_manager_async.py \
            tests/test_traffic_coordinates.py \
            tests/test_pipeline_cleanup.py

      - name: Complete edge tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app/edge/src
        run: |
          cd app/edge
          python -m pytest -q tests

      - name: Project tests
        env:
          PYTHONPATH: ${{ github.workspace }}/app/edge/src
        run: |
          cd app
          python -m pytest -q project_tests

      - name: Compile Python sources
        run: |
          cd app
          python -m compileall -q edge/src edge/tests edge/scripts experiments tools project_tests

      - name: Ruff edge checks
        run: |
          cd app/edge
          python -m ruff check --select F,E9 src tests

      - name: Ruff project checks
        run: |
          cd app
          python -m ruff check --select E9,F63,F7,F82 project_tests experiments tools edge/scripts
