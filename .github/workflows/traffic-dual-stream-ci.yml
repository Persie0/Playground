name: Traffic dual-stream branch verification

on:
  push:
    branches:
      - traffic-dual-stream-ci

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/traffic-counting-light-main
  APP_REF: feature/picamera2-dual-stream-preprocessing

jobs:
  project-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout private app revision
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact runtime/test dependencies
        run: |
          cd app/edge
          python -m pip install --upgrade pip
          python -m pip install -e '.[pi,dev]'

      - name: Validate shipped configs with traceback
        env:
          PYTHONPATH: ${{ github.workspace }}/app/edge/src
        run: |
          cd app/edge
          python - <<'PY'
          from pathlib import Path
          from utils.config import Config
          paths = [
              Path("configs/runtime/pi_camera.yaml"),
              Path("configs/runtime/recording.yaml"),
              Path("configs/runtime/webcam.yaml"),
              Path("configs/benchmark/ncnn.yaml"),
          ]
          for path in paths:
              print(f"VALIDATING {path}")
              Config.load(path)
              print(f"PASS {path}")
          PY
