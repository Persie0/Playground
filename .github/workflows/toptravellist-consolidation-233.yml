name: Worldwide ranking regeneration pass 233
on:
  push:
    branches: [main]
    paths: ['.github/workflows/toptravellist-consolidation-233.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toptravellist-consolidation-233
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: 194e641a020424d3e676b2ed8a4d3e9107244a61
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recount, regenerate independently and retain diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python scripts/reconcile_worldwide_backlog.py --verify-baseline
          python scripts/reconcile_worldwide_backlog.py --verify-baseline --check
          ranking=PASS
          if ! python scripts/generate_rankings.py >/tmp/rankings.log 2>&1; then
            ranking=FAIL
          elif ! python scripts/generate_rankings.py --check >>/tmp/rankings.log 2>&1; then
            ranking=FAIL
          fi
          if [ "$ranking" = FAIL ]; then
            cat /tmp/rankings.log
            git restore -- README.md countries
          fi
          schema=PASS
          python scripts/validate.py >/tmp/schema-validation.log 2>&1 || schema=FAIL
          export RANKING_STATUS="$ranking" SCHEMA_STATUS="$schema"
          python - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          changes = subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()
          allowed = lambda p: p == 'README.md' or p in {
              'methodology/worldwide-backlog/README.md',
              'methodology/worldwide-backlog/remaining.tsv',
              'methodology/worldwide-backlog/original-inventory.tsv',
          } or bool(re.fullmatch(r'countries/[A-Z]{2}/(?:sights|cities)\.md',p))
          assert all(allowed(p) for p in changes), 'Unexpected generated change'
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard'],text=True).strip(), 'Unexpected untracked file'
          summary = Path('methodology/worldwide-backlog/README.md').read_text().split('## Remaining by area')[0]
          assert '**20,162**' in summary
          print(summary)
          note = Path('methodology/reviews/worldwide-consolidation-pass234-regeneration-2026-11-28.md')
          assert not note.exists()
          ranking = os.environ['RANKING_STATUS']
          schema = os.environ['SCHEMA_STATUS']
          note.write_text('# Pass 234 — independent generation and validation\n\n'
              'Pinned input: 194e641a020424d3e676b2ed8a4d3e9107244a61.\n\n'
              + summary + '\n'
              + f'- Changed generated files: {len(changes)}\n'
              + '- Historical baseline and backlog consistency checks: PASS\n'
              + f'- Rankings generation and consistency: {ranking}\n- Schema validation: {schema}\n'
              + '- Partial ranking output reverted if generation failed. No source YAML changes, no merge.\n'
              + '\n## Ranking diagnostics\n\n```text\n' + Path('/tmp/rankings.log').read_text()[:30000] + '\n```\n'
              + '\n## Schema diagnostics\n\n```text\n' + Path('/tmp/schema-validation.log').read_text()[:60000] + '\n```\n')
          PY
          git add README.md countries methodology/worldwide-backlog methodology/reviews/worldwide-consolidation-pass234-regeneration-2026-11-28.md
          git diff --cached --check
          git config user.name toptravellist-editorial-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Publish exact worldwide backlog and generation diagnostics (pass 234)'
          git fetch origin refs/heads/data/worldwide-bias-audit-pass205
          test "$(git rev-parse FETCH_HEAD)" = 194e641a020424d3e676b2ed8a4d3e9107244a61 || { echo 'Branch moved; refusing stale push'; exit 1; }
          git push origin HEAD:refs/heads/data/worldwide-bias-audit-pass205
          echo "Ranking: $ranking; schema: $schema"
          test "$ranking" = PASS && test "$schema" = PASS
