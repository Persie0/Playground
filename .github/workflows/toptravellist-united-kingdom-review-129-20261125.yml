name: TopTravelList United Kingdom PR 129 review
on:
  push:
    branches: [main]
    paths: ['.github/workflows/toptravellist-united-kingdom-review-129-20261125.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: data/united-kingdom-worldwide-v2-20261125
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate main, regenerate and validate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name toptravellist-review-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
          if gh api repos/Persie0/TopTravelList/pulls/129 --jq '.merged' | grep -qx true; then exit 0; fi
          git fetch origin main data/united-kingdom-worldwide-v2-20261125
          git merge --ff-only origin/data/united-kingdom-worldwide-v2-20261125
          if ! git merge --no-commit --no-ff origin/main; then
            test "$(git diff --name-only --diff-filter=U)" = README.md
          fi
          git checkout origin/main -- README.md
          python -m pip install -r requirements.txt
          python scripts/validate.py
          python scripts/check_city_benchmarks.py
          python scripts/check_sight_benchmarks.py
          python scripts/generate_rankings.py --country GB
          python scripts/generate_rankings.py --check
          python scripts/rank.py --kind cities --limit 60
          python scripts/rank.py --kind sights --limit 60
          git add README.md countries/GB/cities.md countries/GB/sights.md
          python -c 'from pathlib import Path; [p.write_text("\n".join(l.rstrip() for l in p.read_text().splitlines()).rstrip()+"\n") for p in Path("methodology/reviews/GB").glob("*.md")]'
          git add methodology/reviews/GB
          git diff --cached --check origin/main
          git diff --cached --name-only origin/main | grep -vE '^(README\.md|countries/GB/|methodology/reviews/GB/)' > /tmp/unexpected-paths || true
          test ! -s /tmp/unexpected-paths
          if ! git diff --cached --quiet || test -f .git/MERGE_HEAD; then
            git commit -m 'Integrate current main and regenerate United Kingdom reviewed rankings (source audit)'
          fi
          git push origin HEAD:refs/heads/data/united-kingdom-worldwide-v2-20261125
          git rev-parse HEAD
          if gh api --method PUT repos/Persie0/TopTravelList/pulls/129/merge -f merge_method=merge -f sha="$(git rev-parse HEAD)" --jq '.merged' | grep -qx true; then exit 0; fi
          if gh api repos/Persie0/TopTravelList/pulls/129 --jq '.merged' | grep -qx true; then exit 0; fi
          done
          exit 1
