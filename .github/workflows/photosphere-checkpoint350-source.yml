name: Photosphere checkpoint350 original solver model-callback caller
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint350-source.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint350-source
  cancel-in-progress: false
jobs:
  source-original-solver-callbacks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source research SHA read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: d876464fcd43cae7a3136a0f6790b9b9157bf044
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify source revision and install ARM64 tooling
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d876464fcd43cae7a3136a0f6790b9b9157bf044"
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint350/native_original_solver_model_callbacks.py
      - name: Download original GCam 8.8 ARM64 ELF checksum-verified
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Execute original native solver status5 virtual callsites and status re-read
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint350/native_original_solver_model_callbacks.py original.so --output checkpoint350-source.json | tee checkpoint350-source.log
          grep -q '^CHECKPOINT350_SOLVER_CALLBACK_ORIGINAL_PASS 15 79$' checkpoint350-source.log
      - name: Archive nonproprietary diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-checkpoint350-source
          path: |
            checkpoint350-source.json
            checkpoint350-source.log
          if-no-files-found: warn
          retention-days: 7
