name: Image Enhancer PR72 — localization validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/image_enhancer_locale_pr72_validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-enhancer-localization-pr72
  # Validates current Image Enhancer feature branch (never private-repo Actions).
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Image Enhancer PR72 branch (private)
        uses: actions/checkout@v4
        with:
          repository: Persie0/image_enhancer
          ref: feat/play-console-all-locale-coverage
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: image_enhancer
          fetch-depth: 1

      - name: Audit all ARBs, model labels and hardcoded native copy
        working-directory: image_enhancer
        run: python3 tool/audit_localizations.py

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: image_enhancer
        run: flutter pub get

      - name: Generate localization Dart classes
        working-directory: image_enhancer
        run: flutter gen-l10n

      - name: Verify all 87 Play Console locales and 246-string translations
        working-directory: image_enhancer
        run: flutter test test/supported_languages_test.dart test/new_locale_arb_coverage_test.dart test/play_locale_arb_integration_test.dart --reporter expanded

      - name: Full Flutter regression suite
        working-directory: image_enhancer
        run: flutter test --concurrency=2 --timeout 2m --reporter compact

      - name: Analyze Flutter source
        working-directory: image_enhancer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
