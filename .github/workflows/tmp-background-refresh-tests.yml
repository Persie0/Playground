name: Temporary background refresh regression tests

on:
  push:
    paths:
      - ".github/workflows/tmp-background-refresh-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out traffic-counting branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/traffic-counting-light-main
          ref: test/background-refresh-regressions

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy opencv-python-headless loguru

      - name: Run background refresh tests
        working-directory: traffic-counting-edge-detection-master
        run: PYTHONPATH=src pytest -q tests/test_analysis_background_refresh.py tests/test_analysis_background_collector.py
