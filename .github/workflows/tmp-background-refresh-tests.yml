name: Temporary background refresh regression tests

on:
  push:
    paths:
      - ".github/workflows/tmp-background-refresh-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out traffic-counting main
        uses: actions/checkout@v4
        with:
          repository: Persie0/traffic-counting-light-main
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest numpy opencv-python-headless loguru pyyaml

      - name: Run background refresh tests
        working-directory: traffic-counting-edge-detection-master
        run: PYTHONPATH=src pytest -q tests/test_analysis_background_refresh.py tests/test_analysis_background_collector.py tests/test_analysis_pipeline_integration.py
