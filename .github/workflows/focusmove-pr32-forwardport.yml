name: FocusMove PR32 safe-forwardport validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/focusmove-pr32-forwardport.yml'
      - 'focusmove-pr32-forwardport-trigger.txt'
permissions:
  contents: read
concurrency:
  group: focusmove-pr32-forwardport-validation
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Clone private branch only onto ephemeral public Playground runner
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=fix/pr32-onboarding-forwardport-20261126 https://github.com/Persie0/pomodoroexercise.git source
          git -C source rev-parse HEAD
      - name: Resolve Flutter packages
        working-directory: source
        run: flutter pub get
      - name: Format exact changed code before verifying
        working-directory: source
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          dart format lib/src/features/onboarding/onboarding_flow.dart test/onboarding_flow_test.dart test/app_shell_test.dart test/routine_widget_test.dart
          if ! git diff --quiet; then
            git config user.name focusmove-ux-validation
            git config user.email actions@users.noreply.github.com
            git add lib/src/features/onboarding/onboarding_flow.dart test/onboarding_flow_test.dart test/app_shell_test.dart test/routine_widget_test.dart
            git commit -m 'style: format PR32 forwardport'
            AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/fix/pr32-onboarding-forwardport-20261126
          fi
          git log -1 --format='VALIDATED_SOURCE_SHA=%H'
      - name: Flutter analyze
        working-directory: source
        run: flutter analyze
      - name: Onboarding CTA responsive regression tests
        working-directory: source
        run: flutter test test/onboarding_flow_test.dart test/app_shell_test.dart test/routine_widget_test.dart --reporter expanded
      - name: Full Flutter suite
        working-directory: source
        run: flutter test --reporter expanded
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android debug APK compilation
        working-directory: source
        run: |
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
  ios:
    needs: flutter
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Clone exact validated private source branch temporarily
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=fix/pr32-onboarding-forwardport-20261126 https://github.com/Persie0/pomodoroexercise.git source
          git -C source rev-parse HEAD
      - name: Unsigned iOS simulator compilation
        working-directory: source
        run: |
          flutter pub get
          flutter build ios --simulator --no-codesign
          test -d build/ios/iphonesimulator/Runner.app
