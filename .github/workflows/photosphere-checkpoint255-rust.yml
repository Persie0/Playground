name: Photosphere checkpoint255 original native second-camera Rust regression (one shot)
on:
  push:
    branches: [ci/photosphere-checkpoint255-second-index]
    paths: ['.github/workflows/photosphere-checkpoint255-rust.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint255-rust-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rust-original-second-index:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'ci: run photosphere checkpoint255 rust once'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: a216ce29fa1029e69235c97e8e301831bb8ee09f
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Verify exact test executable source revision
        run: test "$(git rev-parse HEAD)" = "a216ce29fa1029e69235c97e8e301831bb8ee09f"
      - name: Verify original native indexed camera ray and match record parity
        run: cargo test --locked checkpoint255_original_second_index_rosette_camera_rays_exact -- --nocapture
      - name: Full Rust regression suite
        run: cargo test --locked
