name: RepForge Workshop Impeccable UX validation (public Playground)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repforge-impeccable-workshop-ui.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Clone pinned private RepForge branch into public runner
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          SOURCE_BRANCH: feat/impeccable-workshop-layout-dialogs-20261122
          SOURCE_SHA: 18f5ddfe8d9b9b6a08550ac89028d27fe9399658
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Private repository access token missing'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --quiet --depth 1 --branch "$SOURCE_BRANCH" \
            https://github.com/Persie0/gameexercise.git source
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA" || {
            echo 'Private source changed after pin; refusing unverified build'; exit 1;
          }
      - name: Analyze and test Workshop plus full Flutter suite
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          flutter pub get > /tmp/repforge_pub.log 2>&1 || {
            tail -n 90 /tmp/repforge_pub.log; exit 1;
          }
          dart format --output=none lib test > /tmp/repforge_format.log 2>&1 || {
            tail -n 110 /tmp/repforge_format.log; exit 1;
          }
          flutter analyze > /tmp/repforge_analyze.log 2>&1 || {
            tail -n 130 /tmp/repforge_analyze.log; exit 1;
          }
          flutter test test/forge_workshop_screen_test.dart test/forge_motling_collection_screen_test.dart --reporter expanded > /tmp/repforge_focus.log 2>&1 || {
            tail -n 240 /tmp/repforge_focus.log | cut -c 1-300; exit 1;
          }
          flutter test --reporter compact > /tmp/repforge_all.log 2>&1 || {
            tr '\r' '\n' < /tmp/repforge_all.log |
              grep -E '\[E\]|TestFailure|Expected:|Actual:|The test description was:' |
              tail -n 120 | cut -c 1-240 || true
            tail -n 160 /tmp/repforge_all.log | cut -c 1-260
            exit 1
          }
          tail -n 5 /tmp/repforge_analyze.log
          tr '\r' '\n' < /tmp/repforge_all.log | tail -n 4 | cut -c 1-200
      - name: Generate Flutter-rendered mobile and expanded screenshots
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          SCREENSHOT_TEXT_FONT="$(fc-match -f '%{file}' 'DejaVu Sans')"
          SCREENSHOT_MATERIAL_FONT="$(find "$FLUTTER_ROOT/bin/cache" -name MaterialIcons-Regular.otf -print -quit)"
          test -s "$SCREENSHOT_TEXT_FONT" || { echo 'No usable text font on public runner'; exit 1; }
          test -s "$SCREENSHOT_MATERIAL_FONT" || { echo 'Flutter MaterialIcons font missing'; exit 1; }
          export SCREENSHOT_TEXT_FONT SCREENSHOT_MATERIAL_FONT
          flutter test test/workshop_visual_capture.dart --update-goldens --reporter expanded > /tmp/repforge_visual.log 2>&1 || {
            tail -n 170 /tmp/repforge_visual.log | cut -c 1-280; exit 1;
          }
          test -s test/goldens/workshop_320_de_text200.png
          test -s test/goldens/workshop_900_de_standard.png
          echo 'Flutter widget-rendered screenshots generated (not Android emulator screenshots)'
      - name: Upload screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: repforge-workshop-ui-captures
          path: source/test/goldens/workshop_*.png
          if-no-files-found: error
          retention-days: 7
      - name: Compile Android debug APK
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          flutter build apk --debug > /tmp/repforge_apk.log 2>&1 || {
            tail -n 140 /tmp/repforge_apk.log | cut -c 1-300; exit 1;
          }
          test -s build/app/outputs/flutter-apk/app-debug.apk
          echo 'Android debug APK compiled; not published or uploaded'
