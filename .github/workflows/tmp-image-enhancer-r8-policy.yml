name: Temporary Image Enhancer R8 dependency policy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-image-enhancer-r8-policy.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Image Enhancer git ref
        required: false
        default: optimize/r8-play-25

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout Image Enhancer
        uses: actions/checkout@v5
        with:
          repository: Persie0/image_enhancer
          ref: ${{ inputs.ref || 'optimize/r8-play-25' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: app

      - name: Assert R8 dependency policy
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          GRADLE=android/app/build.gradle.kts
          RULES=android/app/src/main/keepRules/app.keep

          # Keep this test pointed at the current optimization branch state.
          if grep -Eqi 'io\.bidmachine:ads\.networks\.mintegral|org\.bidon:mintegral-adapter|com\.appodeal\.ads\.sdk\.adapters:mintegral' "$GRADLE"; then
            echo '::error::Mintegral mediation dependencies must not be present in the Play build.'
            grep -Ein 'mintegral' "$GRADLE" || true
            exit 1
          fi

          if ! grep -Fq 'exclude(group = "com.revenuecat.purchases", module = "purchases-store-amazon")' "$GRADLE"; then
            echo '::error::Google Play build must exclude RevenueCat purchases-store-amazon.'
            exit 1
          fi

          if grep -Fq 'com.facebook.infer.annotation:infer-annotation' "$GRADLE"; then
            echo '::error::Redundant explicit infer-annotation dependency must not be present.'
            exit 1
          fi

          if ! grep -Fqx -- '-keep class ai.onnxruntime.** { *; }' "$RULES"; then
            echo '::error::Official ONNX Runtime broad keep rule must remain unchanged.'
            cat "$RULES"
            exit 1
          fi

          if grep -Fq 'flutter.usePrecompiledBinaries=true' android/gradle.properties; then
            echo '::error::flutter.usePrecompiledBinaries=true must remain removed.'
            exit 1
          fi

          echo 'R8 dependency policy passed for the optimization branch.'
