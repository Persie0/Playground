name: Surebets Impeccable round 3 validation

on:
  push:
    branches:
      - ci/surebets-impeccable-round3-20261121
    paths:
      - .github/workflows/surebets-impeccable-round3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout private app source from review branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/surebets_calculator
          ref: design/impeccable-ux-round3-20261121
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Normalize changed Dart files and check syntax
        run: |
          dart format lib/logic/free_bet_calculator.dart lib/logic/odds_input_feedback.dart lib/free_bet_snr_screen.dart lib/free_bet_sr_screen.dart lib/odds_converter_screen.dart lib/widgets/copy_value_button.dart lib/widgets/calculation_overview.dart lib/widgets/free_bet_result_card.dart lib/bet_history_screen.dart test/free_bet_input_validation_test.dart test/impeccable_round3_widget_test.dart
          git diff --check

      - name: Analyze all Dart source
        run: flutter analyze --no-fatal-infos

      - name: Run complete Flutter regression suite
        run: flutter test
