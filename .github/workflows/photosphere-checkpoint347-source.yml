name: Photosphere checkpoint347 original postgraph status-zero filter
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint347-source.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint347-source
  cancel-in-progress: false
jobs:
  native-original-postgraph:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Read-only SHA pinned original research
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: a9322270e87dbfc100aa43b0e0ca5daba9d5621f
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Pin exact source and install ARM64 emulation tools
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a9322270e87dbfc100aa43b0e0ca5daba9d5621f"
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint347/native_original_postgraph_status0_filter.py
      - name: Verify exact original GCam ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Execute original AddImage graph postgraph and FOV in same memory
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint347/native_original_postgraph_status0_filter.py original.so --output checkpoint347-postgraph.json | tee checkpoint347-postgraph.log
          grep -q 'CHECKPOINT347_POSTGRAPH_STATUS_FILTER_ORIGINAL_PASS 15 40' checkpoint347-postgraph.log
      - name: Archive only original test result JSON and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-checkpoint347-source
          path: |
            checkpoint347-postgraph.json
            checkpoint347-postgraph.log
          if-no-files-found: warn
          retention-days: 7
