name: ImagePdfScaler private Flutter CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imagepdfscaler-private-ci.yml'

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/ImagePdfScaler
  APP_REF: review/editor-logic-20261002

jobs:
  editor-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout app revision
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-app
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: private-app
        run: flutter pub get >/dev/null
      - name: Run editor diagnostic
        working-directory: private-app
        run: timeout 60s flutter test --reporter=expanded test/editor_page_diagnostic_test.dart
