name: ImagePdfScaler private Flutter CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag/SHA in Persie0/ImagePdfScaler
        required: true
        default: main
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/imagepdfscaler-private-ci.yml'

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/ImagePdfScaler
  APP_REF: ${{ inputs.ref || 'tests/comprehensive-logic-20261001' }}

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout app revision
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: private-app
        run: flutter pub get >/dev/null
      - name: Diagnose failing tests
        working-directory: private-app
        run: |
          flutter test --reporter=expanded \
            test/image_processing_edge_cases_test.dart \
            test/crop_editor_interaction_test.dart \
            test/paper_canvas_interaction_test.dart
