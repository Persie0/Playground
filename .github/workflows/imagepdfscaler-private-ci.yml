name: ImagePdfScaler private Flutter CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag/SHA in Persie0/ImagePdfScaler
        required: true
        default: main
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/imagepdfscaler-private-ci.yml'

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/ImagePdfScaler
  APP_REF: ${{ inputs.ref || 'tests/comprehensive-logic-20261001' }}

jobs:
  flutter-android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout app revision
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-app
      - name: Checkout private CI harness
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-ci
          sparse-checkout: .github/playground
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Run private test/build harness
        id: harness
        continue-on-error: true
        run: bash private-ci/.github/playground/private-ci.sh private-app
      - name: Diagnose new test files
        if: steps.harness.outcome == 'failure'
        shell: bash
        run: |
          set -uo pipefail
          cd private-app
          failed=0
          for f in \
            test/layout_models_edge_cases_test.dart \
            test/image_processing_edge_cases_test.dart \
            test/project_storage_service_test.dart \
            test/dialog_validation_test.dart \
            test/pdf_services_test.dart \
            test/crop_editor_interaction_test.dart \
            test/paper_canvas_interaction_test.dart; do
            if flutter test "$f" >/dev/null 2>&1; then
              echo "PASS: $f"
            else
              echo "FAIL: $f"
              failed=1
            fi
          done
          exit "$failed"
      - name: Upload debug APK
        if: steps.harness.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: imagepdfscaler-debug-apk
          path: private-app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
      - name: Upload release APK
        if: steps.harness.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: imagepdfscaler-release-apk
          path: private-app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
