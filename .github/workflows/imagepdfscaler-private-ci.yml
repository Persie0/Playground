name: ImagePdfScaler private Flutter CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imagepdfscaler-private-ci.yml'

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/ImagePdfScaler
  APP_REF: review/editor-logic-20261002

jobs:
  editor-test:
    strategy:
      fail-fast: false
      matrix:
        test_name:
          - loading a project repairs invalid margins and constrains images
          - selection rotate lock duplicate and delete update editor state
          - multi-select alignment and exact-gap distribution mutate positions
          - auto arrange removes overlap and orientation keeps items on paper
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout app revision
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: private-app
        run: flutter pub get >/dev/null
      - name: Run one editor flow
        working-directory: private-app
        env:
          TEST_NAME: ${{ matrix.test_name }}
        run: timeout 45s flutter test --reporter=expanded --plain-name "$TEST_NAME" test/editor_page_logic_test.dart
