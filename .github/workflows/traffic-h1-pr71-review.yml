name: Review Traffic Heading H1 PR71
on:
  push:
    branches:
      - ci/traffic-h1-pr71-20261104
    paths:
      - .github/workflows/traffic-h1-pr71-review.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heading-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact reviewed PR head
        uses: actions/checkout@v5
        with:
          repository: Persie0/traffic-counting-light-main
          ref: be8477aadc83a4591f8de1f905939f3da51bebad
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          persist-credentials: false
          path: app
      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies on Python 3.11
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless pytest pyyaml loguru requests scipy pillow jsonpickle
      - name: Compile and run H1 plus baseline analysis tests on Python 3.11
        env:
          PYTHONPATH: app/traffic-counting-edge-detection-master/src
        run: |
          python -m compileall -q \
            app/traffic-counting-edge-detection-master/src/detection/direction_detection.py \
            app/traffic-counting-edge-detection-master/src/speed_measurement/homography_matrix.py
          python -m pytest -q \
            app/traffic-counting-edge-detection-master/tests/test_direction_ground_angles.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_native_input.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_route_heatmap.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_waiting_detector.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_pipeline_integration.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_background_refresh.py
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies on Python 3.13
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless pytest pyyaml loguru requests scipy pillow jsonpickle
      - name: Run same H1 plus baseline analysis tests on Python 3.13
        env:
          PYTHONPATH: app/traffic-counting-edge-detection-master/src
        run: |
          python -m pytest -q \
            app/traffic-counting-edge-detection-master/tests/test_direction_ground_angles.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_native_input.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_route_heatmap.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_waiting_detector.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_pipeline_integration.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_background_refresh.py
