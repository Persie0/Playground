name: FocusMove paste crash diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/focusmove-crash-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-public-paste:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read crash log and print redacted failure summary
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 2 -fsSL --max-time 30 'https://paste.crdroid.net/api/v2/pastes/D4xhHd' -o "$RUNNER_TEMP/paste.json"
          python3 - "$RUNNER_TEMP/paste.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path
          payload = json.loads(Path(sys.argv[1]).read_text())
          data = payload.get("content", "")
          if not isinstance(data, str):
              raise RuntimeError("Paste content is not text")
          lines = data.splitlines()
          print(f"Paste length: {len(data)} chars, {len(lines)} lines")
          hits = [i for i, line in enumerate(lines) if re.search(r'(Exception|Error|FATAL|Fatal|Caused by|E/flutter|Failed assertion|package:.*\.dart|#\d+\s+.+\.dart)', line, re.I)]
          print(f"Matching error lines: {len(hits)}")
          for i, _ in enumerate(lines[:100]):
              line = lines[i].strip()
              line = re.sub(r'(?i)https?://\S+', '[url]', line)
              line = re.sub(r'[\w.+-]+@[\w.-]+\.[a-zA-Z]{2,}', '[email]', line)
              line = re.sub(r'(?i)(Bearer\s+|token[=:]\s*)[a-z0-9._-]+', r'\1[redacted]', line)
              line = re.sub(r'\b(?:\d{1,3}\.){3}\d{1,3}\b', '[ip]', line)
              print(f"{i+1}: {line[:320]}")
          if not data.strip():
              raise RuntimeError("The paste is empty")
          PY
