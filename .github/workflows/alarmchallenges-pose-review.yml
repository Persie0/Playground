name: AlarmChallenges pose coach review

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "alarmchallenges ref to validate"
        required: true
        default: feature/animated-pose-exercise-coach
        type: string
  push:
    paths:
      - '.github/workflows/alarmchallenges-pose-review.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private project
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref || 'feature/animated-pose-exercise-coach' }}
        run: |
          set -eu
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth=1 --branch="$SOURCE_REF" \
            https://github.com/Persie0/alarmchallenges.git source
          git -C source rev-parse HEAD
      - name: Analyze and test
        working-directory: source
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build APK
        working-directory: source
        run: |
          flutter build apk --debug
          git rev-parse HEAD > build/app/outputs/flutter-apk/SOURCE_COMMIT.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alarmchallenges-pose-coach-apk
          path: |
            source/build/app/outputs/flutter-apk/*.apk
            source/build/app/outputs/flutter-apk/*.txt
          if-no-files-found: warn
          retention-days: 7

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private project
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          SOURCE_REF: ${{ inputs.source_ref || 'feature/animated-pose-exercise-coach' }}
        run: |
          set -eu
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth=1 --branch="$SOURCE_REF" \
            https://github.com/Persie0/alarmchallenges.git source
          git -C source rev-parse HEAD
      - name: Flutter tests and iOS simulator build
        working-directory: source
        run: |
          set -o pipefail
          flutter pub get
          flutter test 2>&1 | tee pose-ios-test.log
          flutter build ios --simulator --no-codesign 2>&1 | tee pose-ios-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alarmchallenges-pose-coach-ios-logs
          path: |
            source/pose-ios-test.log
            source/pose-ios-build.log
          if-no-files-found: warn
          retention-days: 7
