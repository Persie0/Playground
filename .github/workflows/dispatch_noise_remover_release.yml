name: Validate noise_remover background processing

on:
  push:
    branches:
      - background-media-processing-validation-20260928
    paths:
      - '.github/workflows/dispatch_noise_remover_release.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-and-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Dispatch shared validation workflow
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          gh workflow run play_auto.yml \
            --repo Persie0/firebase_tester_builder \
            --ref main \
            -f app=noise_remover \
            -f build_apk=true \
            -f run_tests=true \
            -f branch=feature/android-background-media-processing-20260928

          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_ID="$(gh run list \
              --repo Persie0/firebase_tester_builder \
              --workflow play_auto.yml \
              --event workflow_dispatch \
              --limit 20 \
              --json databaseId,createdAt,displayTitle \
              --jq ".[] | select(.createdAt >= \"${STARTED_AT}\" and (.displayTitle | contains(\"Deploy noise_remover (feature/android-background-media-processing-20260928)\"))) | .databaseId" \
              | head -n 1)"
            if [ -n "$RUN_ID" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$RUN_ID" ]; then
            echo "::error::Dispatched validation workflow was not found."
            exit 1
          fi

          echo "Watching validation workflow run $RUN_ID"
          gh run watch "$RUN_ID" \
            --repo Persie0/firebase_tester_builder \
            --exit-status
