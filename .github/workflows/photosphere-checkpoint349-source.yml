name: Photosphere checkpoint349 original solver record loop
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint349-source.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint349-source
  cancel-in-progress: false
jobs:
  source-original-solver-pair-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact research SHA read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: a3a794e4d2780bf8c1d3d20f221f37ee702f5006
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify private source and install native ARM64 emulator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a3a794e4d2780bf8c1d3d20f221f37ee702f5006"
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint349/native_original_solver_pair_loop.py
      - name: Retrieve SHA-pinned original Google Camera ARM64 source
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Execute source AddImage graph postgraph solver loop FOV transfer and status gate
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint349/native_original_solver_pair_loop.py original.so --output checkpoint349-solver-loop.json | tee checkpoint349-solver-loop.log
          grep -q '^CHECKPOINT349_SOLVER_LOOP_ORIGINAL_PASS 15 57$' checkpoint349-solver-loop.log
      - name: Archive only nonproprietary source results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-checkpoint349-source
          path: |
            checkpoint349-solver-loop.json
            checkpoint349-solver-loop.log
          retention-days: 7
          if-no-files-found: warn
