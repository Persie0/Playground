name: ToiletCompass feature tests

on:
  push:
    branches: [toiletcompass-monthly-db]
    paths:
      - 'tools/toiletcompass-feature-trigger.txt'
      - 'tools/test_toiletcompass_monthly_workflow.py'
      - '.github/workflows/toiletcompass-feature-tests.yml'
      - '.github/workflows/toiletcompass-monthly-databases.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: toiletcompass-feature-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Playground workflow contract
        uses: actions/checkout@v5
        with:
          ref: toiletcompass-monthly-db
          path: playground

      - name: Validate monthly workflow contract
        working-directory: playground
        run: python3 tools/test_toiletcompass_monthly_workflow.py

      - name: Validate cross-repository token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout ToiletCompass feature branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/toiletcompass
          ref: feat/monthly-country-database-pipeline
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true
          path: app

      - name: Apply private feature patches if present
        working-directory: app
        run: |
          shopt -s nullglob
          scripts=(tools/apply_country_selection_*.py)
          for script in "${scripts[@]}"; do
            python3 "$script"
          done
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "feat: implement country database selection"
            git push origin HEAD:feat/monthly-country-database-pipeline
          fi

      - name: Run Python database tests
        working-directory: app
        run: python3 -m unittest discover -s database/tests -v

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        working-directory: app
        run: flutter test

      - name: Install real-data pilot dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool sqlite3

      - name: Run LU/BH/AS/BQ real-data pilot
        working-directory: app
        run: |
          rm -rf /tmp/toiletcompass-country-pilot
          python3 database/monthly_country_pipeline.py build-all \
            --output /tmp/toiletcompass-country-pilot \
            --version pilot-${{ github.run_number }} \
            --countries LU,BH,AS,BQ
          python3 database/monthly_country_pipeline.py validate-all \
            --output /tmp/toiletcompass-country-pilot
          test ! -e /tmp/toiletcompass-country-pilot/.scratch
          python3 - <<'PY'
          import json
          import sqlite3
          from pathlib import Path
          root = Path('/tmp/toiletcompass-country-pilot')
          manifest = json.load(open(root / 'manifest.json'))
          assert set(manifest['countries']) == {'LU', 'BH', 'AS', 'BQ'}
          for iso in ('LU', 'BH', 'AS', 'BQ'):
              item = manifest['countries'][iso]
              assert isinstance(item.get('continents'), list), (iso, item)
              with sqlite3.connect(root / 'countries' / f'{iso}.db') as db:
                  count = db.execute('SELECT COUNT(*) FROM toilets').fetchone()[0]
              if iso in {'LU', 'BH'}:
                  assert count > 0, (iso, count)
              print(f'{iso}={count}; coverage={item["continents"]}')
          assert manifest['countries']['LU']['continents'] == ['europe']
          PY
