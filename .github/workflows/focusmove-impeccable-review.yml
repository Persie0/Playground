name: FocusMove Impeccable UI redesign PR validation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/focusmove-impeccable-review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focusmove-impeccable-ui-pr
  cancel-in-progress: false

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Check out private FocusMove feature branch (runner only)
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Missing private repository token'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/impeccable-focusmove-ui https://github.com/Persie0/pomodoroexercise.git source
      - name: Flutter analyze and all tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test --reporter expanded

  android:
    needs: flutter
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Check out private feature branch (runner only)
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/impeccable-focusmove-ui https://github.com/Persie0/pomodoroexercise.git source
      - name: Build release-mode test APK and audit permissions
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.persie.pomodoroexercise.ci'"
          "$AAPT" dump permissions "$APK" > "$RUNNER_TEMP/focusmove-permissions.txt"
          if grep -E 'android.permission.(INTERNET|RECORD_AUDIO|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|FOREGROUND_SERVICE|SCHEDULE_EXACT_ALARM)' "$RUNNER_TEMP/focusmove-permissions.txt"; then
            echo 'Unexpected permission'; exit 1
          fi

  ios:
    needs: flutter
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Check out private feature branch (runner only)
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/impeccable-focusmove-ui https://github.com/Persie0/pomodoroexercise.git source
      - name: Unsigned iOS simulator build and ML Kit resources
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter build ios --simulator --no-codesign
          APP=build/ios/iphonesimulator/Runner.app
          test -d "$APP"
          for name in MLKitPoseDetectionFastResources MLKitPoseDetectionCommonResources MLKitXenoResources; do
            test -d "$APP/$name.bundle" || { echo "Missing ML Kit $name"; exit 1; }
          done
