name: NetworkDoctor native Impeccable visual smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/networkdoctor-impeccable-visual-20261121.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout reviewed NetworkDoctor branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/NetworkDoctor
          ref: 59adb4f07de6709a8e918467a5782e2f842c0cd1
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: networkdoctor

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android platforms with preinstalled command line tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37.0" "platforms;android-35" "platform-tools" "emulator"

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble UI build
        working-directory: networkdoctor
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Enable KVM
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Prepare native screenshot script
        shell: bash
        run: |
          cat > capture-networkdoctor.sh <<'NETWORKDOCTOR_SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          adb wait-for-device
          mkdir -p screenshots
          adb install -r networkdoctor/app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -n at.persie0.networkdoctor/.MainActivity
          sleep 40
          adb exec-out screencap -p > screenshots/overview-light.png
          S="$(adb shell wm size | grep -oE '[0-9]+x[0-9]+' | tail -1)"
          W="${S%x*}"
          H="${S#*x}"
          D="$(adb shell wm density | grep -oE '[0-9]+' | tail -1)"
          Y=$((H - (64 * D / 160)))
          switch_tab() {
            X=$((W * (2 * $1 + 1) / 8))
            adb shell input tap "$X" "$Y"
            sleep 3
          }
          switch_tab 1
          adb exec-out screencap -p > screenshots/checks-light.png
          switch_tab 2
          adb exec-out screencap -p > screenshots/history-light.png
          switch_tab 3
          adb exec-out screencap -p > screenshots/settings-light.png
          adb shell cmd uimode night yes
          sleep 3
          switch_tab 0
          adb exec-out screencap -p > screenshots/overview-dark.png
          switch_tab 1
          adb exec-out screencap -p > screenshots/checks-dark.png
          adb shell settings put system font_scale 2.0
          adb shell am force-stop at.persie0.networkdoctor
          adb shell am start -n at.persie0.networkdoctor/.MainActivity
          sleep 8
          adb exec-out screencap -p > screenshots/overview-dark-200-font.png
          switch_tab 1
          adb exec-out screencap -p > screenshots/checks-dark-200-font.png
          adb shell settings put system font_scale 1.0
          adb shell cmd uimode night no || true
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          adb shell am force-stop at.persie0.networkdoctor
          adb shell am start -n at.persie0.networkdoctor/.MainActivity
          sleep 35
          adb exec-out screencap -p > screenshots/overview-offline.png
          switch_tab 1
          adb exec-out screencap -p > screenshots/checks-offline.png
          # Exercise expanded-width Material navigation and landscape layout.
          adb shell settings put system font_scale 1.0
          adb shell wm size 1280x1920
          adb shell wm density 200
          adb shell am force-stop at.persie0.networkdoctor
          adb shell am start -n at.persie0.networkdoctor/.MainActivity
          sleep 9
          adb exec-out screencap -p > screenshots/overview-tablet.png
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          sleep 5
          adb exec-out screencap -p > screenshots/overview-tablet-landscape.png

          NETWORKDOCTOR_SCRIPT
          chmod +x capture-networkdoctor.sh

      - name: Capture native Android screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash capture-networkdoctor.sh

      - name: Upload private-app UI smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: networkdoctor-impeccable-android-screens
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 7
