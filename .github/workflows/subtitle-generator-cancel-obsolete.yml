name: Cancel obsolete subtitle CI
on:
  push:
    branches: [ci/subtitle-generator-validation]
    paths:
      - .github/workflows/subtitle-generator-cancel-obsolete.yml
permissions:
  actions: write
  contents: read
jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel superseded test attempts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/Persie0/Playground/actions/runs/38183551949/cancel || true
          gh api --method POST repos/Persie0/Playground/actions/runs/38183785442/cancel || true
          gh api --method POST repos/Persie0/Playground/actions/runs/38184029452/cancel || true
          gh api --method POST repos/Persie0/Playground/actions/runs/38184178920/cancel || true
          gh api --method POST repos/Persie0/Playground/actions/runs/38184192134/cancel || true
          gh api --method POST repos/Persie0/Playground/actions/runs/38184216885/cancel || true
          gh api --method POST repos/Persie0/Playground/actions/runs/38184299345/cancel || true
