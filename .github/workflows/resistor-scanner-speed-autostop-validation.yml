name: Resistor Scanner speed and auto-stop validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resistor-scanner-speed-autostop-validation.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - uses: actions/checkout@v5
        with:
          repository: Persie0/resistor-scanner-android
          ref: feat/live-scan-speed-autostop
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Verify Android features
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'const val MIN_SCAN_FPS = 5' app/src/main/java/at/austriao/resistorscanner/pipeline/ScannerPipeline.kt
          grep -F 'const val MAX_SCAN_FPS = 60' app/src/main/java/at/austriao/resistorscanner/pipeline/ScannerPipeline.kt
          grep -F 'Maximum live scan rate' app/src/main/java/at/austriao/resistorscanner/ui/ScannerScreen.kt
          grep -F 'Auto-stop when confident' app/src/main/java/at/austriao/resistorscanner/ui/ScannerScreen.kt
          grep -F 'converter.convert(image)' app/src/main/java/at/austriao/resistorscanner/camera/FrameAnalyzer.kt
          grep -F 'minimumFrameIntervalNs' app/src/main/java/at/austriao/resistorscanner/camera/FrameAnalyzer.kt
          grep -F 'OptLevel.ALL_OPT' app/src/main/java/at/austriao/resistorscanner/ml/OnnxSessionFactory.kt
          grep -F 'private val inputBuffer = ByteBuffer' app/src/main/java/at/austriao/resistorscanner/segmentation/ResistorSegmenter.kt
          grep -F 'private val inputBuffer = ByteBuffer' app/src/main/java/at/austriao/resistorscanner/recognition/BandNetRecognizer.kt

      - name: Unit tests and debug build
        working-directory: app
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug --stacktrace

  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - uses: actions/checkout@v5
        with:
          repository: Persie0/resistor-scanner-ios
          ref: feat/live-scan-speed-autostop
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1
          path: app

      - name: Verify iOS features
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'static let minimumScanFps = 5' ResistorScanner/Pipeline/ScannerEngine.swift
          grep -F 'static let maximumScanFps = 60' ResistorScanner/Pipeline/ScannerEngine.swift
          grep -F 'Maximum scan rate' ResistorScanner/UI/SettingsSheet.swift
          grep -F 'Auto-stop when confident' ResistorScanner/UI/SettingsSheet.swift
          grep -F 'AutoStopTracker' Sources/ResistorScannerCore/AutoStopTracker.swift
          grep -F 'SpecializationStrategy' ResistorScanner/ML/OrtSessionFactory.swift
          grep -F 'shapeNumbers: inputShape' ResistorScanner/ML/OrtSegmenter.swift
          grep -F 'shapeNumbers: inputShape' ResistorScanner/ML/OrtBandNet.swift

      - name: Swift tests
        working-directory: app
        run: swift test

      - name: Resolve packages
        working-directory: app
        run: xcodebuild -resolvePackageDependencies -project ResistorScanner.xcodeproj -scheme ResistorScanner

      - name: Build iOS simulator
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild \
            -project ResistorScanner.xcodeproj \
            -scheme ResistorScanner \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/ios-build.log"

# final validation after buffer reuse and cadence test
