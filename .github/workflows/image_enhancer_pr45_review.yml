name: Verify image_enhancer PR 45

on:
  push:
    paths:
      - '.github/workflows/image_enhancer_pr45_review.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_ENHANCER_REF: 2af07fb8a5f1c761c8863490162ef20c98566641

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact private revision
        uses: actions/checkout@v5
        with:
          repository: Persie0/image_enhancer
          ref: ${{ env.IMAGE_ENHANCER_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: image_enhancer
          fetch-depth: 1

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: image_enhancer
        run: flutter pub get

      - name: RevenueCat regression tests
        working-directory: image_enhancer
        run: flutter test test/subscription_service_revenuecat_test.dart --reporter expanded

      - name: Full Flutter test suite
        working-directory: image_enhancer
        run: flutter test --concurrency=1 --timeout 2m --reporter expanded

      - name: Analyzer
        working-directory: image_enhancer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
