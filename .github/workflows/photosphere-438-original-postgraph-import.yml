name: Photosphere 438 original postgraph imported libm ABI
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-438-original-postgraph-import.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-438-import-static
  cancel-in-progress: false
jobs:
  verify-original-postgraph-import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out SHA-pinned private research read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 8cfa96bcbc8e499fc3af3f018d7ae9720f3cb0a7
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify research SHA and compile scanner
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8cfa96bcbc8e499fc3af3f018d7ae9720f3cb0a7
          python3 -m pip install --quiet --break-system-packages capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint438/scan_postgraph_import_abi.py
      - name: Acquire exact original pinned APK and ELF
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Scan source-original postgraph imported math ABI
        working-directory: research-src
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint438/scan_postgraph_import_abi.py research/native/liblightcycle.so --output checkpoint438-original-import-abi.json
          test -s checkpoint438-original-import-abi.json
      - name: Remove proprietary binaries
        if: always()
        working-directory: research-src
        run: |
          rm -f original.apk research/native/liblightcycle.so com.google.android.GoogleCamera_*.apk
      - name: Upload source-only original opcode and import receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-438-postgraph-import-abi-source
          path: research-src/checkpoint438-original-import-abi.json
          retention-days: 7
          if-no-files-found: warn
