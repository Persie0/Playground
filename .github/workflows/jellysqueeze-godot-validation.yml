name: Jelly Squeeze - Swing & Turn Flex Lab validation (public runner)

on:
  push:
    paths:
      - ".github/workflows/jellysqueeze-godot-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact private Jelly Squeeze revision
        uses: actions/checkout@v4
        with:
          repository: Persie0/JellySqueeze
          ref: 6e7b5109e4f1e80f0b1b441bc926f2dfecb9d4eb
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: game

      - name: Download verified Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --version

      - name: Import project and compile all scripts
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path game --editor --quit 2>&1 | tee godot-import.log
          if grep -Ei "SCRIPT ERROR:|Parse Error:|ERROR:" godot-import.log; then exit 1; fi

      - name: Generate 500 reproducible reference rules cases (G-01)
        shell: bash
        run: |
          set -euo pipefail
          python3 game/tools/differential/generate_cases.py
          test -s game/tests/content/classic_rule_differential_fixture.json

      - name: Compile and run reference-verified BFS layer harvester (G-02)
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -O2 -Wall -Wextra game/tools/bankgen/harvest.cpp -o bankgen
          ./bankgen --recipe t1 --seed 7 --limit 12 > t1.jsonl
          ./bankgen --recipe t2 --seed 11 --limit 12 > t2.jsonl
          timeout 120s ./bankgen --recipe t3 --seed 7 --limit 6 > t3.jsonl
          ./bankgen --recipe t1 --seed 7 --limit 12 > t1-again.jsonl
          cmp t1.jsonl t1-again.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          for name in ('t1', 't2', 't3'):
              data = [json.loads(s) for s in Path(f'{name}.jsonl').read_text().splitlines()]
              assert len(data) == (6 if name == 't3' else 12)
              assert all(d['par_proven'] and len(d['solution_certificate']) ==
                         d['par_moves'] for d in data)
              print('G-02 BFS CANDIDATES', name, len(data))
          PY

      - name: Differential test C++ BFS successor sets against Python rules (G-01+)
        shell: bash
        run: |
          set -euo pipefail
          ./bankgen --recipe t1 --seed 7 --dump-successors 500 > cpp-t1.jsonl
          ./bankgen --recipe t2 --seed 11 --dump-successors 500 > cpp-t2.jsonl
          ./bankgen --recipe t3 --seed 7 --dump-successors 500 > cpp-t3.jsonl
          python3 game/tools/differential/verify_cpp_rules.py \
            cpp-t1.jsonl cpp-t2.jsonl cpp-t3.jsonl

      - name: Score BFS candidates and pack test-only binary (G-02 and G-04)
        shell: bash
        run: |
          set -euo pipefail
          python3 game/tools/bankgen/rate_candidates.py \
            --inputs t1.jsonl t2.jsonl t3.jsonl \
            --campaign-dir game/content/levels \
            --output-prefix game/tests/content/generated_candidate \
            --trials 50 --min-levels 10
          test -s game/tests/content/generated_candidate.bin
          test -s game/tests/content/generated_candidate.index.json
          test -s game/tests/content/generated_candidate.report.json

      - name: Prove deterministic packing and fail-closed G-04 release gates
        shell: bash
        run: |
          set -euo pipefail
          python3 game/tools/bank/test_pack_bank.py
          python3 game/tools/bankgen/test_release_gate.py

      - name: Compile deterministic test-only binary bank (G-03)
        shell: bash
        run: |
          set -euo pipefail
          python3 game/tools/bank/pack_bank.py --fixtures \
            --campaign-dir game/content/levels \
            --out-prefix game/tests/content/bank_fixture
          test -s game/tests/content/bank_fixture.bin
          test -s game/tests/content/bank_fixture.index.json

      - name: Execute all headless test scripts
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          fails=0
          for test in \
            tests/content/test_rules_differential.gd \
            tests/content/test_bank_binary.gd \
            tests/content/test_bank_release.gd \
            tests/content/test_bank_runtime.gd \
            tests/content/test_bank_generated.gd \
            tests/progression/test_flow_director.gd \
            tests/progression/test_stars_migration.gd \
            tests/progression/test_local_flow_history.gd \
            tests/progression/test_endless_progress.gd \
            tests/ui/test_tap_journey.gd \
            tests/ui/test_endless_navigation.gd \
            tests/ui/test_colorblind_patterns.gd \
            tests/ui/test_map_stars.gd \
            tests/ui/test_screen_layouts.gd \
            tests/core/test_rules.gd \
            tests/core/test_tutorial.gd \
            tests/core/test_solver.gd \
            tests/input/test_swipe.gd \
            tests/rendering/test_gel_layer.gd \
            tests/content/test_generator.gd \
            tests/content/test_campaign_50.gd \
            tests/content/test_difficulty.gd \
            tests/progression/test_save.gd \
            tests/audio/test_audio.gd \
            tests/ui/test_navigation.gd \
            tests/ui/test_pause_navigation.gd \
            tests/ui/test_completion_chapters.gd \
            tests/ui/test_android_settings_scroll.gd \
            tests/progression/test_daily_rewards.gd \
            tests/ui/test_daily_ui.gd \
            tests/progression/test_cosmetics.gd \
            tests/ui/test_collection.gd \
            tests/progression/test_chapter_cosmetics.gd \
            tests/purchases/test_iap.gd \
            tests/ui/test_touch_scrolling.gd \
            tests/ui/test_hint_visibility.gd \
            tests/progression/test_adaptive_daily.gd \
            tests/core/test_flex_rules.gd \
            tests/ui/test_flex_lab.gd; do
            printf '\n=== %s ===\n' "$test"
            log="test-$(basename "$test" .gd).log"
            status=0
            timeout 150s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script "res://$test" > "$log" 2>&1 || status=$?
            tail -n 65 "$log"
            if [ "$status" -ne 0 ] || grep -Eiq "SCRIPT ERROR:|Parse Error:|ERROR:|FAILED:" "$log"; then
              echo "::error title=Godot test failed::$test (exit $status)"
              fails=$((fails + 1))
            else
              echo "::notice title=Godot test passed::$test"
            fi
          done
          echo "FAILED_TESTS=$fails" >> "$GITHUB_ENV"
          [ "$fails" -eq 0 ]

      - name: Verify every campaign puzzle with exact solver
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path game \
            --script res://tools/verify_levels.gd 2>&1 | tee verify-levels.log
          grep -q "ALL 50 MANIFEST LEVELS VERIFIED" verify-levels.log
          ! grep -Ei "SCRIPT ERROR:|Parse Error:|ERROR:" verify-levels.log

      - name: Run main scene smoke test
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          timeout 100s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path game \
            --quit-after 20 2>&1 | tee smoke.log
          ! grep -Ei "SCRIPT ERROR:|Parse Error:|ERROR:|Invalid call" smoke.log

      - name: Checkout public Playground to publish a safe results summary
        if: always()
        uses: actions/checkout@v4
        with:
          repository: Persie0/Playground
          ref: main
          path: result-repo

      - name: Publish private-source-safe validation status to public Playground
        if: always()
        shell: bash
        env:
          VALIDATION_OUTCOME: ${{ job.status }}
          REPO_SHA: 6e7b5109e4f1e80f0b1b441bc926f2dfecb9d4eb
        run: |
          set -euo pipefail
          mkdir -p result-repo/reports
          {
            echo "# Jelly Squeeze public validation summary"
            echo
            echo "Private source commit: \`$REPO_SHA\`"
            echo "Runner: https://github.com/Persie0/Playground/actions/runs/${GITHUB_RUN_ID}"
            echo "Overall checks before report: **$VALIDATION_OUTCOME**"
            echo
            echo "## Test suites"
            for log in test-*.log; do
              [ -f "$log" ] || continue
              name="${log#test-}"; name="${name%.log}"
              if grep -Eq "SCRIPT ERROR:|Parse Error:|ERROR:|FAILED:" "$log"; then
                echo "- $name: FAIL"
                grep -E "SCRIPT ERROR:|Parse Error:|ERROR:|FAILED:" "$log" | head -n 5 | sed 's/^/  - /'
              else
                echo "- $name: PASS"
              fi
            done
            echo
            echo "## Import, solver verification and smoke tests"
            for name in godot-import verify-levels smoke; do
              if [ -f "${name}.log" ]; then
                if grep -Eiq "SCRIPT ERROR:|Parse Error:|ERROR:|Invalid call" "${name}.log"; then
                  echo "- $name: FAIL"
                  grep -Ei "SCRIPT ERROR:|Parse Error:|ERROR:|Invalid call" "${name}.log" | head -n 5 | sed 's/^/  - /'
                else
                  echo "- $name: PASS (inspect runner exit status if job failed)"
                fi
              else
                echo "- $name: NOT RUN"
              fi
            done
          } > result-repo/reports/jelly-validation-latest.md
          cp result-repo/reports/jelly-validation-latest.md "$RUNNER_TEMP/jelly-report.md"
          git -C result-repo config user.name "Jelly Validation"
          git -C result-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            # Concurrent public workflows may update this same summary. The
            # validation must not fail because the optional report raced.
            git -C result-repo fetch origin main
            git -C result-repo reset --hard FETCH_HEAD
            cp "$RUNNER_TEMP/jelly-report.md" result-repo/reports/jelly-validation-latest.md
            git -C result-repo add reports/jelly-validation-latest.md
            if git -C result-repo diff --cached --quiet; then
              break
            fi
            git -C result-repo commit -m "ci: record JellySqueeze public validation summary"
            if git -C result-repo push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::warning::Public summary raced repeatedly; actual test status is in this run."
            fi
          done
