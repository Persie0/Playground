name: Jelly Squeeze - Step 16 Native IAP Safety validation (public runner)

on:
  push:
    paths:
      - ".github/workflows/jellysqueeze-godot-validation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact private Jelly Squeeze revision
        uses: actions/checkout@v4
        with:
          repository: Persie0/JellySqueeze
          ref: d505c87d5cef0d65184f6b154416f4c7151cb747
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: game

      - name: Download verified Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot.zip" | sha256sum -c -
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --version

      - name: Import project and compile all scripts
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path game --editor --quit 2>&1 | tee godot-import.log
          if grep -Ei "SCRIPT ERROR:|Parse Error:|ERROR:" godot-import.log; then exit 1; fi

      - name: Execute all headless test scripts
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          fails=0
          for test in \
            tests/core/test_rules.gd \
            tests/core/test_tutorial.gd \
            tests/core/test_solver.gd \
            tests/input/test_swipe.gd \
            tests/rendering/test_gel_layer.gd \
            tests/content/test_generator.gd \
            tests/content/test_campaign_50.gd \
            tests/content/test_difficulty.gd \
            tests/progression/test_save.gd \
            tests/audio/test_audio.gd \
            tests/ui/test_navigation.gd \
            tests/ui/test_pause_navigation.gd \
            tests/ui/test_completion_chapters.gd \
            tests/ui/test_android_settings_scroll.gd \
            tests/progression/test_daily_rewards.gd \
            tests/ui/test_daily_ui.gd \
            tests/progression/test_cosmetics.gd \
            tests/ui/test_collection.gd \
            tests/progression/test_chapter_cosmetics.gd \
            tests/purchases/test_iap.gd; do
            printf '\n=== %s ===\n' "$test"
            log="test-$(basename "$test" .gd).log"
            status=0
            timeout 150s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path game --script "res://$test" > "$log" 2>&1 || status=$?
            tail -n 65 "$log"
            if [ "$status" -ne 0 ] || grep -Eiq "SCRIPT ERROR:|Parse Error:|ERROR:|FAILED:" "$log"; then
              echo "::error title=Godot test failed::$test (exit $status)"
              fails=$((fails + 1))
            else
              echo "::notice title=Godot test passed::$test"
            fi
          done
          echo "FAILED_TESTS=$fails" >> "$GITHUB_ENV"
          [ "$fails" -eq 0 ]

      - name: Verify every campaign puzzle with exact solver
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path game \
            --script res://tools/verify_levels.gd 2>&1 | tee verify-levels.log
          grep -q "ALL 50 MANIFEST LEVELS VERIFIED" verify-levels.log
          ! grep -Ei "SCRIPT ERROR:|Parse Error:|ERROR:" verify-levels.log

      - name: Run main scene smoke test
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          timeout 100s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path game \
            --quit-after 20 2>&1 | tee smoke.log
          ! grep -Ei "SCRIPT ERROR:|Parse Error:|ERROR:|Invalid call" smoke.log

      - name: Checkout public Playground to publish a safe results summary
        if: always()
        uses: actions/checkout@v4
        with:
          repository: Persie0/Playground
          ref: main
          path: result-repo

      - name: Publish private-source-safe validation status to public Playground
        if: always()
        shell: bash
        env:
          VALIDATION_OUTCOME: ${{ job.status }}
          REPO_SHA: d505c87d5cef0d65184f6b154416f4c7151cb747
        run: |
          set -euo pipefail
          mkdir -p result-repo/reports
          {
            echo "# Jelly Squeeze public validation summary"
            echo
            echo "Private source commit: \`$REPO_SHA\`"
            echo "Runner: https://github.com/Persie0/Playground/actions/runs/${GITHUB_RUN_ID}"
            echo "Overall checks before report: **$VALIDATION_OUTCOME**"
            echo
            echo "## Test suites"
            for log in test-*.log; do
              [ -f "$log" ] || continue
              name="${log#test-}"; name="${name%.log}"
              if grep -Eq "SCRIPT ERROR:|Parse Error:|ERROR:|FAILED:" "$log"; then
                echo "- $name: FAIL"
                grep -E "SCRIPT ERROR:|Parse Error:|ERROR:|FAILED:" "$log" | head -n 5 | sed 's/^/  - /'
              else
                echo "- $name: PASS"
              fi
            done
            echo
            echo "## Import, solver verification and smoke tests"
            for name in godot-import verify-levels smoke; do
              if [ -f "${name}.log" ]; then
                if grep -Eiq "SCRIPT ERROR:|Parse Error:|ERROR:|Invalid call" "${name}.log"; then
                  echo "- $name: FAIL"
                  grep -Ei "SCRIPT ERROR:|Parse Error:|ERROR:|Invalid call" "${name}.log" | head -n 5 | sed 's/^/  - /'
                else
                  echo "- $name: PASS (inspect runner exit status if job failed)"
                fi
              else
                echo "- $name: NOT RUN"
              fi
            done
          } > result-repo/reports/jelly-validation-latest.md
          git -C result-repo config user.name "Jelly Validation"
          git -C result-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C result-repo add reports/jelly-validation-latest.md
          if ! git -C result-repo diff --cached --quiet; then
            git -C result-repo commit -m "ci: record JellySqueeze public validation summary"
            git -C result-repo push origin main
          fi
