name: Noise Remover Appodeal fork R8 analyzer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noise-remover-r8-appodeal-fork.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/noise_remover
  APP_REF: master

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN" || { echo '::error::Missing private repo token'; exit 2; }
      - name: Checkout latest Noise Remover branch
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-app
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Point Noise Remover at Appodeal optimization fork
        working-directory: private-app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          s = p.read_text()
          old = '  stack_appodeal_flutter: ^4.3.0'
          new = '  stack_appodeal_flutter:\n    git:\n      url: https://github.com/Persie0/Appodeal-Flutter-Plugin.git\n      ref: optimize/r8-adapter-preserving'
          if old not in s:
              raise SystemExit('stack_appodeal_flutter hosted dependency not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f pubspec.lock
          grep -A4 'stack_appodeal_flutter:' pubspec.yaml

      - name: Prepare project
        working-directory: private-app
        run: |
          echo "Noise Remover commit: $(git rev-parse HEAD)"
          flutter --version
          flutter pub get
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_SDK_ROOT" > android/local.properties
          cat > android/gradlew <<'EOF'
          #!/usr/bin/env bash
          set -e
          exec gradle "$@"
          EOF
          chmod +x android/gradlew
          keytool -genkeypair -v -keystore android/app/ci-release.jks -storepass android -keypass android -alias ci -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=US"
          printf '%s\n' 'storePassword=android' 'keyPassword=android' 'keyAlias=ci' 'storeFile=ci-release.jks' > android/key.properties
      - name: Guard modern Android toolchain
        working-directory: private-app
        run: |
          grep -q 'com.android.application.*9.4.0' android/settings.gradle.kts
          grep -q 'com.android.library.*9.4.0' android/settings.gradle.kts
          grep -q 'optimization' android/app/build.gradle.kts
          grep -q 'enable = true' android/app/build.gradle.kts
          ! grep -R -nE "com.android.tools.build:gradle:(7|8)\." DPDFNet_flutter/android flutter_nnnoiseless/android
          ! grep -qE '^\s*android\.enableR8\.fullMode\s*=\s*false' android/gradle.properties
      - name: Run R8 Configuration Analyzer
        working-directory: private-app/android
        run: |
          ./gradlew --no-daemon :app:analyzeReleaseR8Config --stacktrace
          REPORT='../build/app/reports/r8/r8-config-analyzer-release.html'
          test -s "$REPORT"
          cp "$REPORT" ../../r8-config-analyzer-release.html
      - name: Build optimized release AAB with fork
        working-directory: private-app
        env:
          CARGO_BUILD_JOBS: '2'
          GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false'
        run: |
          sed -i -e '/^org\\.gradle\\.jvmargs=/d' -e '/^org\\.gradle\\.workers\\.max=/d' -e '/^org\\.gradle\\.parallel=/d' -e '/^org\\.gradle\\.daemon=/d' -e '/^kotlin\\.compiler\\.execution\\.strategy=/d' android/gradle.properties
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xms2g -Xmx10g -XX:+UseParallelGC -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          org.gradle.daemon=false
          kotlin.compiler.execution.strategy=in-process
          EOF
          flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info

      - name: Verify R8 percentages and bundle size
        working-directory: private-app
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path

          aab = Path('build/app/outputs/bundle/release/app-release.aab')
          with zipfile.ZipFile(aab) as z:
              r8 = json.loads(z.read('BUNDLE-METADATA/com.android.tools/r8.json'))
              dex = [(i.filename, i.file_size, i.compress_size)
                     for i in z.infolist() if i.filename.endswith('.dex')]

          stats = r8['stats']
          eligible = {
              'optimization': round(100.0 - stats['noOptimizationPercentage'], 2),
              'obfuscation': round(100.0 - stats['noObfuscationPercentage'], 2),
              'shrinking': round(100.0 - stats['noShrinkingPercentage'], 2),
          }
          result = {
              'aab_bytes': aab.stat().st_size,
              'dex_uncompressed_bytes': sum(x[1] for x in dex),
              'dex_compressed_bytes': sum(x[2] for x in dex),
              'dex_entries': dex,
              'r8_stats': stats,
              'eligible_percentages': eligible,
              'r8_version': r8.get('version'),
          }
          Path('../appodeal-fork-r8-metrics.json').write_text(
              json.dumps(result, indent=2, sort_keys=True)
          )
          print(json.dumps(result, indent=2, sort_keys=True))

          failed = {k:v for k,v in eligible.items() if v < 25.0}
          if failed:
              raise SystemExit(f'R8 >=25% target not met: {failed}')
          PY

          CONFIG='build/app/outputs/mapping/release/configuration.txt'
          test -s "$CONFIG"
          if grep -F -- '-keep class com.google.android.gms.** { *; }' "$CONFIG"; then
            echo '::error::Legacy Vungle blanket Google Play services keep still present'
            exit 1
          fi

      - name: Extract analyzer text and likely blockers
        run: |
          python3 - <<'PY'
          import html, re
          from pathlib import Path
          p = Path('r8-config-analyzer-release.html')
          raw = p.read_text(errors='ignore')
          text = re.sub(r'<script\b[^>]*>.*?</script>', ' ', raw, flags=re.S|re.I)
          text = re.sub(r'<style\b[^>]*>.*?</style>', ' ', text, flags=re.S|re.I)
          text = html.unescape(re.sub(r'<[^>]+>', '\n', text))
          lines = [' '.join(x.split()) for x in text.splitlines() if x.strip()]
          keys = ('score','keep','optimization','obfuscation','shrinking','prevent','ffmpeg','videolan','appodeal','bidon','bidmachine','unity','mintegral','vungle','applovin','ironsource','bigo')
          selected = [x for x in lines if any(k in x.lower() for k in keys)]
          Path('r8-analyzer-summary.txt').write_text('\n'.join(selected))
          print('\n'.join(selected[:800]))
          PY
      - name: Dump embedded dependency keep rules
        if: always()
        run: |
          python3 - <<'PY'
          import re, zipfile
          from pathlib import Path

          cache = Path.home() / '.gradle/caches/modules-2/files-2.1'
          out = []
          broad = re.compile(r'^\s*-(?:keep|keepnames|keepclassmembers|keepclasseswithmembers)\b.*(?:\.\*\*|\{\s*\*;\s*\})')
          global_rule = re.compile(r'^\s*-(?:dontoptimize|dontobfuscate|dontshrink)\b')

          for aar in sorted(cache.rglob('*.aar')):
              rel = aar.relative_to(cache)
              parts = rel.parts
              gav = ':'.join(parts[:3]) if len(parts) >= 3 else str(rel)
              try:
                  with zipfile.ZipFile(aar) as z:
                      names = [n for n in z.namelist()
                               if n in ('proguard.txt', 'consumer-rules.pro')
                               or n.startswith('META-INF/proguard/')]
                      if not names:
                          continue
                      out.append(f'\n===== {gav} =====')
                      for name in names:
                          text_data = z.read(name).decode('utf-8', 'replace')
                          out.append(f'--- {name} ---')
                          for i, line in enumerate(text_data.splitlines(), 1):
                              marker = ' !!!' if broad.search(line) or global_rule.search(line) else ''
                              out.append(f'{i:04d}: {line}{marker}')
              except zipfile.BadZipFile:
                  pass

          Path('dependency-consumer-rules.txt').write_text('\n'.join(out))
          print('\n'.join(out[:2500]))
          PY
      - name: Upload analyzer report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noise-remover-appodeal-fork-r8-analyzer
          path: |
            r8-config-analyzer-release.html
            r8-analyzer-summary.txt
            dependency-consumer-rules.txt
            appodeal-fork-r8-metrics.json
            private-app/build/app/outputs/bundle/release/app-release.aab
            private-app/build/app/outputs/mapping/release/configuration.txt
          if-no-files-found: ignore
          retention-days: 7
# A/B run trigger after workflow registration
