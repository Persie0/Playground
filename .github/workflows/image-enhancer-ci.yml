name: Image Enhancer CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or SHA in Persie0/image_enhancer
        required: true
        default: codex/reprocess-friendly-models
        type: string
  push:
    branches:
      - codex/image-enhancer-ci
    paths:
      - .github/workflows/image-enhancer-ci.yml

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/image_enhancer
  APP_REF: ${{ inputs.ref || '6ab8e98e5bb7e7c8d64565d3ceb6827ae31d8754' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if [[ -z "$PRIVATE_TOKEN" ]]; then
            echo "::error::Set PRIVATE_REPO_TOKEN with read access to Persie0/image_enhancer."
            exit 2
          fi

      - name: Checkout Image Enhancer
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Format changed files
        working-directory: app
        run: |
          dart format \
            lib/model_selection_page.dart \
            lib/super_resolution_home_page.dart \
            test/model_catalog_test.dart
          git diff -- \
            lib/model_selection_page.dart \
            lib/super_resolution_home_page.dart \
            test/model_catalog_test.dart

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test model catalog
        working-directory: app
        run: flutter test test/model_catalog_test.dart
