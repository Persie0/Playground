name: FocusMove Impeccable round 5 exact-source final validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/focusmove-round5-final-source.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout exact private FocusMove PR35 revision
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=fix/impeccable-focusmove-round5-20261122 https://github.com/Persie0/pomodoroexercise.git source
          git -C source log -1 --format='Validated revision: %H'
      - name: Resolve dependencies
        working-directory: source
        run: timeout 240s flutter pub get
      - name: Analyze all Flutter code
        working-directory: source
        run: timeout 150s flutter analyze
      - name: Run new privacy and UX tests
        working-directory: source
        run: timeout 160s flutter test test/impeccable_round5_test.dart test/erase_cache_privacy_test.dart --reporter expanded
      - name: Run full Flutter suite
        working-directory: source
        run: timeout 300s flutter test --reporter expanded
