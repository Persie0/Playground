name: Flow Forge Impeccable Round 11 - Godot 4.7.2 validation
# UX R11 final pass: safe Help replay, contextual early-level default, truthful unavailable mechanics, large touch buttons and unlocked-topic navigation.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/flowforge-impeccable-r11.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch private Flow Forge feature branch
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo "Missing token with access to Persie0/flowforge"; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth=1 --branch=feature/impeccable-round11-help-safety-and-guides https://github.com/Persie0/flowforge.git source
          echo "FLOWFORGE_SHA=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Download official stable Godot 4.7.2
        run: |
          set -euo pipefail
          wget --quiet --show-progress --progress=dot:giga \
            'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' \
            -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --version

      - name: Validate pinned RevenueCat installer syntax
        run: bash -n source/tools/install-revenuecat.sh

      - name: Import project and compile GDScript
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path source --quit 2>&1 | tee import.log
          if grep -Ei '(SCRIPT ERROR|Parse Error|ERROR:)' import.log; then exit 1; fi

      - name: Render bounded native screenshots at 540x960 and 540x1200
        continue-on-error: true
        run: |
          set -euo pipefail
          cat > source/tests/ci_ui_capture.gd <<'GDSCRIPT'
          extends SceneTree

          const MainScene = preload("res://scenes/main.tscn")
          const FlowLevels = preload("res://scripts/flow_levels.gd")

          func _initialize() -> void:
              call_deferred("_capture")

          func _capture() -> void:
              var game: Control = MainScene.instantiate()
              root.add_child(game)
              # Existing screenshot regressions start with onboarding already
              # learned. Dedicated captures enable individual first-use guides.
              game.tutorial_seen = {"basics": true, "two_routes": true,
                  "rotate": true, "larger_board": true, "third_route": true,
                  "neutral": true, "four_piece": true, "orbit": true,
                  "bridge": true, "precision": true}
              if OS.get_environment("FLOW_COMPACT") == "1":
                  game._open_level(60)
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-level-60-compact.png") == OK)
                  game._open_map()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-chapter-map-compact.png") == OK)
                  game.map_open = false
                  game.selected_index = 0
                  game.selected_turns = int(game.level["pieces"][0].get("solution_turns", 0))
                  var piece_origin: Vector2i = game.level["pieces"][0]["origin"]
                  var preview: Dictionary = game._precision_lens_contents(piece_origin)
                  var center_cell: Vector2i = preview["center"]
                  var target: Vector2 = game._tile_pixel(center_cell) + Vector2.ONE * (game._tile_size() * 0.5)
                  game.pointer = target + Vector2(0, maxf(42.0, game._tile_size() * 1.25))
                  game.drag_from = Vector2(-100, -100)
                  game.drag_active = true
                  game.precision_touch_override = true
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-precision-lens-compact.png") == OK)
                  game.precision_touch_override = false
                  game.drag_active = false
                  game._open_level(4, false)
                  game.economy.coins = 240
                  game.shop_open = true
                  var skip_center: Vector2 = game._shop_button_rect(2).get_center()
                  game._shop_click(skip_center, skip_center)
                  assert(game.shop_confirm_index == 2 and game.economy.coins == 240)
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-confirm-skip-compact.png") == OK)
                  game._process(game.CONFIRM_WINDOW_SECONDS + 0.1)
                  assert(game.shop_confirm_index == -1 and game.economy.coins == 240)
                  game.status_seconds = 0.0
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-expired-skip-compact.png") == OK)
                  game.shop_open = false
                  game._open_level(4, false)
                  game._on_store_message("No active Lifetime Pro found — check store account")
                  assert(game._status_toast_lines(game.status_text).size() >= 2)
                  for tray_rect in game._tray_rects():
                      assert(not game._status_rect().intersects(tray_rect),
                          "Restore notice must not conceal puzzle pieces")
                  assert(not game._status_rect().intersects(game._help_rect()))
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-wrapped-restore-status-compact.png") == OK)
                  game.status_seconds = 0.0
                  game._open_level(4, false)
                  game.status_seconds = 0.0
                  game.sound_on = false
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-sound-muted-compact.png") == OK)
                  game.sound_on = true
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-sound-on-compact.png") == OK)
                  game._keyboard_navigation = false
                  game._refresh_accessibility()
                  game._keyboard_navigation = true
                  game._access_controls["header_shop"].grab_focus()
                  game._open_shop()
                  game._refresh_accessibility()
                  assert(root.gui_get_focus_owner() == game._access_controls["shop_close"])
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-keyboard-modal-focus-compact.png") == OK)
                  game._keyboard_navigation = false
                  var old_focus: Control = root.gui_get_focus_owner()
                  if old_focus != null:
                      old_focus.release_focus()
                  game._open_level(4, false)
                  game.economy.store_available = true
                  game.economy.premium = false
                  game.economy.busy = true
                  game.economy.verifying_purchase = true
                  game.economy.prices[game.economy.PREMIUM_ID] = "EUR 4.99"
                  game._open_shop()
                  game._refresh_accessibility()
                  assert(game._access_controls["shop_3"].disabled)
                  assert(game._access_controls["shop_3"].accessibility_name == "Verifying Lifetime Pro")
                  assert(game._access_controls["shop_4"].disabled)
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-pro-verifying-compact.png") == OK)
                  game.economy.busy = false
                  game.economy.verifying_purchase = false
                  game.shop_open = false
                  game.economy.last_daily = game.economy.daily_date()
                  game._open_shop()
                  game._refresh_accessibility()
                  assert(game._access_controls["shop_0"].disabled)
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-daily-claimed-compact.png") == OK)
                  game.shop_open = false
                  game._open_level(4, false)
                  game.haptics_on = true
                  game._open_session_menu()
                  game._refresh_accessibility()
                  assert(game._access_controls["session_4"].visible)
                  assert(game._session_panel_rect().encloses(game._session_action_rect(4)))
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-pause-haptics-on-compact.png") == OK)
                  game._session_choose(4)
                  game._refresh_accessibility()
                  assert(game._access_controls["session_4"].accessibility_name == "Haptics: off")
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-pause-haptics-off-compact.png") == OK)
                  game._session_choose(1)
                  assert(game.restart_confirm)
                  assert(game._session_panel_rect().size.y == 320.0)
                  assert(game._session_panel_rect().encloses(game._session_action_rect(1)))
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-restart-confirm-compact.png") == OK)
                  game._handle_back()
                  game._handle_back()
                  game._open_level(4, false)
                  game.economy.store_available = true
                  game.economy.prices[game.economy.PREMIUM_ID] = "EUR 4.99"
                  game.economy.purchasing = true
                  game.economy.busy = true
                  game._open_shop()
                  game._refresh_accessibility()
                  assert(game._shop_pro_value() == "PURCHASING")
                  assert(game._shop_restore_caption() == "Wait for the native store purchase")
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-pro-purchasing-compact.png") == OK)
                  game.economy.busy = false
                  game.economy.purchasing = false
                  game.shop_open = false
                  game._open_level(2, false)
                  game._open_session_menu()
                  game._refresh_accessibility()
                  assert(game._access_controls["session_5"].visible)
                  assert(game._session_panel_rect().encloses(game._session_action_rect(5)))
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-auto-skip-setting-compact.png") == OK)
                  game._session_choose(0)
                  game.skip_flow_always = false
                  game.skip_flow_prompt_seen = false
                  game._run_marble_test()
                  game._refresh_accessibility()
                  assert(game._access_controls["flow_skip"].visible)
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-skip-flow-button-compact.png") == OK)
                  game._request_skip_flow()
                  assert(game.skip_flow_prompt_open)
                  game._refresh_accessibility()
                  assert(game._access_controls["flow_skip_yes"].visible)
                  assert(game._access_controls["flow_skip_no"].visible)
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-skip-flow-choice-compact.png") == OK)
                  game._choose_flow_skip(false)
                  game.tutorial_seen.erase("rotate")
                  var r10_rotate_level: int = -1
                  for number in range(7, 44):
                      var generated: Dictionary = FlowLevels.build(number)
                      for piece in generated["pieces"]:
                          if int(piece.get("solution_turns", 0)) != 0:
                              r10_rotate_level = number
                              break
                      if r10_rotate_level >= 0:
                          break
                  assert(r10_rotate_level >= 0)
                  game._open_level(r10_rotate_level, false)
                  assert(game.tutorial_kind == "rotate")
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-rotate-first-use-compact.png") == OK)
                  assert(game._feature_coach_rect().end.y <= game._board_top().y)
                  var rotation_piece: int = game._tray_item_at(game._feature_focus_rect().get_center())
                  assert(rotation_piece >= 0)
                  game._activate_feature_spotlight()
                  assert(game.tutorial_stage == 1)
                  assert(game.selected_index == rotation_piece)
                  assert(not game.keyboard_focus, "Touch coach must not create keyboard ghost cursor")
                  assert(game._feature_focus_rect() == game._action_rect(1))
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-rotate-real-control-compact.png") == OK)
                  game._activate_feature_spotlight()
                  assert(game.tutorial_kind.is_empty() and game.selected_turns == 1)
                  game._open_level(r10_rotate_level, false)
                  assert(game.tutorial_kind.is_empty())
                  # New first-use sequence: show progress and an honest
                  # next action, while the close control skips the stack.
                  game.tutorial_seen.erase("rotate")
                  game.tutorial_seen.erase("larger_board")
                  game._open_level(r10_rotate_level, false)
                  assert(game.tutorial_is_auto and game.tutorial_sequence_total == 2)
                  assert(game._tutorial_continue_label() == "SKIP TO NEXT")
                  game._refresh_accessibility()
                  assert(game._access_controls["tutorial_close"].accessibility_name == "Skip remaining new tips")
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-tip-1-of-2-compact.png") == OK)
                  game._finish_tutorial()
                  assert(game.tutorial_kind == "larger_board")
                  assert(game.tutorial_sequence_index == 2)
                  assert(game._tutorial_continue_label() == "PLAY LEVEL")
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-tip-2-of-2-compact.png") == OK)
                  game._dismiss_tutorial_sequence()
                  assert(game.tutorial_kind.is_empty() and game.tutorial_pending.is_empty())
                  game._open_level(60, false)
                  game._show_tutorial(game._latest_tutorial(60))
                  assert(game.tutorial_kind == "precision" and not game.tutorial_is_auto)
                  game._refresh_accessibility()
                  assert(game._access_controls["tutorial_next"].visible)
                  assert(is_equal_approx(game._tutorial_nav_rect(true).get_center().y,
                      game._tutorial_panel().get_center().y))
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-latest-help-compact.png") == OK)
                  # Help must retain late unlocked guides after backtracking
                  # to a much earlier board, without changing the active puzzle.
                  game._dismiss_tutorial_sequence()
                  game._open_level(2, false)
                  assert(game.highest_unlocked >= 60)
                  assert(game._help_tutorials().size() == 10)
                  game._show_tutorial(game._latest_tutorial(game.level_number))
                  assert(game.tutorial_kind == "basics")
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-current-help-on-early-level-compact.png") == OK)
                  game._cycle_tutorial(-1)
                  assert(game.tutorial_kind == "precision")
                  assert(not game._feature_available_here())
                  game._refresh_accessibility()
                  assert(not game._access_controls["feature_spotlight"].visible)
                  assert(game._feature_coach_copy()["tip"].contains("LATER LEVEL"))
                  assert(game._tutorial_done_rect().size.y == 72.0)
                  assert(game._tutorial_done_rect().size.y * game._layout_scale() >= 44.0)
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-late-help-on-early-level-compact.png") == OK)
                  game._dismiss_tutorial_sequence()
                  game.tutorial_seen.erase("rotate")
                  game._open_level(r10_rotate_level, false)
                  assert(game.tutorial_kind == "rotate")
                  assert(game._tutorial_continue_label() == "SKIP & PLAY")
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-honest-skip-label-compact.png") == OK)
                  print("UI_CAPTURE_COMPACT_OK")
              elif OS.get_environment("FLOW_TALL") == "1":
                  game._open_level(60)
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  print("TALL_ROOT ", root.size, " CONTROL ", game.size)
                  assert(game._layout_height() > 1100.0, "Height did not expand")
                  assert(root.get_texture().get_image().save_png("res://ui-level-60-tall.png") == OK)
                  game.selected_index = 0
                  game.selected_turns = int(game.level["pieces"][0].get("solution_turns", 0))
                  var first_origin: Vector2i = game.level["pieces"][0]["origin"]
                  var lens_data: Dictionary = game._precision_lens_contents(first_origin)
                  var mid_cell: Vector2i = lens_data["center"]
                  var target: Vector2 = game._tile_pixel(mid_cell) + Vector2.ONE * (game._tile_size() * 0.5)
                  game.pointer = target + Vector2(0, maxf(42.0, game._tile_size() * 1.25))
                  game.drag_from = Vector2(-100, -100)
                  game.drag_active = true
                  game.precision_touch_override = true
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-precision-lens-tall.png") == OK)
                  game.precision_touch_override = false
                  game.drag_active = false
                  game.selected_index = -1
                  game._open_level(1, false)
                  game._show_tutorial("basics")
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-basics-tutorial-tall.png") == OK)
                  game._start_tutorial_demo()
                  assert(game.tutorial_stage == 1)
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-tutorial-demo-skip-tall.png") == OK)
                  game._skip_tutorial_demo()
                  assert(game.tutorial_stage == 2)
                  game._show_tutorial("basics")
                  game._start_tutorial_demo()
                  game._process(2.2)
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-basics-practice-tall.png") == OK)
                  game._finish_tutorial()
                  game.tutorial_seen.erase("precision")
                  game._open_level(34, false)
                  assert(game.tutorial_kind == "precision")
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-precision-first-use-tall.png") == OK)
                  game._finish_tutorial()
                  game._open_level(2, false)
                  game._open_session_menu()
                  game._refresh_accessibility()
                  assert(game._access_controls["session_5"].visible)
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-auto-skip-setting-tall.png") == OK)
                  game._open_level(60, false)
                  game.economy.coins = 240
                  game.shop_open = true
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-shop-tall.png") == OK)
                  var auto_center: Vector2 = game._shop_button_rect(1).get_center()
                  game._shop_click(auto_center, auto_center)
                  assert(game.shop_confirm_index == 1 and game.economy.coins == 240)
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-confirm-auto-tall.png") == OK)
                  game.shop_confirm_index = -1
                  var skip_center: Vector2 = game._shop_button_rect(2).get_center()
                  game._shop_click(skip_center, skip_center)
                  assert(game.shop_confirm_index == 2 and game.economy.coins == 240)
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-confirm-skip-tall.png") == OK)
                  game.shop_confirm_index = -1
                  game.shop_open = false
                  game._open_level(4, false)
                  game.economy.coins = 120
                  game._show_hint()
                  assert(game.hint_confirm_pending)
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-confirm-hint-tall.png") == OK)
                  game.hint_confirm_pending = false
                  game.economy.premium = true
                  game.economy.store_available = false
                  game._open_shop()
                  assert(game._shop_has_pro())
                  assert(game.status_text.is_empty(), "Boosts must clear stale hint messages")
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-pro-owned-offline-tall.png") == OK)
                  game.economy.premium = false
                  game.economy.store_available = true
                  game.economy.busy = false
                  game.economy.prices.clear()
                  game._open_shop()
                  assert(game._shop_has_pro() and not game._shop_pro_can_purchase())
                  game._refresh_accessibility()
                  assert(game._access_controls.has("shop_4"))
                  assert(not game._access_controls["shop_4"].disabled)
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-restore-without-price-tall.png") == OK)
                  game.economy.restoring = true
                  game.economy.busy = true
                  game._refresh_accessibility()
                  assert(game._access_controls["shop_4"].disabled)
                  assert(game._access_controls["shop_4"].accessibility_name == "Checking Lifetime Pro")
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-restore-checking-tall.png") == OK)
                  game.economy.restoring = false
                  game.economy.verifying_purchase = true
                  game._refresh_accessibility()
                  assert(game._access_controls["shop_3"].disabled)
                  assert(game._access_controls["shop_3"].accessibility_name == "Verifying Lifetime Pro")
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-pro-verifying-tall.png") == OK)
                  game.economy.verifying_purchase = false
                  game.economy.busy = false
                  game.economy.store_available = false
                  game.shop_open = false
                  game._open_level(60, false)
                  game.haptics_on = false
                  game._open_session_menu()
                  game._refresh_accessibility()
                  assert(game._session_panel_rect().encloses(game._session_action_rect(4)))
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-pause-haptics-tall.png") == OK)
                  game._handle_back()
                  game._open_map()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-chapter-map-tall.png") == OK)
                  game.map_open = false
                  game.shop_open = false
                  game.session_open = false
                  game.selected_index = 0
                  game.selected_turns = 1
                  game.inspector_open = true
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-inspector-tall.png") == OK)
                  game.inspector_open = false
                  game.selected_index = -1
                  game.placements.clear()
                  for i in range(game.level["pieces"].size()):
                      var piece: Dictionary = game.level["pieces"][i]
                      game.placements.append({
                          "index": i,
                          "origin": piece["origin"],
                          "turns": int(piece.get("solution_turns", 0)),
                      })
                  game.phase = "won"
                  game.earned_stars = 3
                  game.earned_coins = 30
                  game.move_count = 6
                  game.win_board_visible = false
                  game.queue_redraw()
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-win-tall.png") == OK)
                  game._win_choose(3)
                  assert(game.win_board_visible)
                  await RenderingServer.frame_post_draw
                  await RenderingServer.frame_post_draw
                  assert(root.get_texture().get_image().save_png("res://ui-win-board-tall.png") == OK)
                  print("UI_CAPTURE_TALL_OK")
              else:
                  for number in [4, 25, 60]:
                      game._open_level(number)
                      game.selected_index = -1
                      await RenderingServer.frame_post_draw
                      await RenderingServer.frame_post_draw
                      assert(root.get_texture().get_image().save_png(
                          "res://ui-level-%d.png" % number) == OK)
                      print("UI_CAPTURE_OK ", number)
                      if number == 25:
                          game._start_tutorial_demo()
                          game._process(2.2)
                          await RenderingServer.frame_post_draw
                          await RenderingServer.frame_post_draw
                          assert(root.get_texture().get_image().save_png(
                              "res://ui-bridge-practice.png") == OK)
                          game._pointer_down(game._tutorial_trial_piece_rect().get_center())
                          game._pointer_up(game._tutorial_trial_target_rect().get_center())
                          await RenderingServer.frame_post_draw
                          await RenderingServer.frame_post_draw
                          assert(root.get_texture().get_image().save_png(
                              "res://ui-bridge-solved.png") == OK)
              quit()
          GDSCRIPT
          timeout 35s xvfb-run -a -s '-screen 0 1080x1920x24' /tmp/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path source --script res://tests/ci_ui_capture.gd --resolution 540x960 2>&1 | tee capture.log
          FLOW_TALL=1 timeout 35s xvfb-run -a -s '-screen 0 1080x1920x24' /tmp/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path source --script res://tests/ci_ui_capture.gd --resolution 540x1200 2>&1 | tee -a capture.log
          FLOW_COMPACT=1 timeout 35s xvfb-run -a -s '-screen 0 1080x1920x24' /tmp/Godot_v4.7.2-stable_linux.x86_64 --audio-driver Dummy --path source --script res://tests/ci_ui_capture.gd --resolution 360x640 2>&1 | tee -a capture.log
          grep -q 'UI_CAPTURE_TALL_OK' capture.log
          grep -q 'UI_CAPTURE_COMPACT_OK' capture.log

      - name: Upload visual screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowforge-ui-captures
          path: source/ui-*.png
          if-no-files-found: ignore
          retention-days: 3

      - name: Validate generated levels
        run: |
          set -euo pipefail
          timeout 120s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path source --script res://tests/level_tests.gd --quit-after 500 2>&1 | tee levels.log
          grep -q 'generated levels validated' levels.log
          if grep -Ei '(SCRIPT ERROR|Parse Error|ERROR:)' levels.log; then exit 1; fi

      - name: Gameplay interaction regression tests
        run: |
          set -euo pipefail
          timeout 100s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path source --script res://tests/gameplay_tests.gd 2>&1 | tee gameplay.log
          grep -q 'gameplay interactions and 60 level completions validated' gameplay.log
          if grep -Ei '(SCRIPT ERROR|Parse Error|ERROR:)' gameplay.log; then exit 1; fi

      - name: Coins and RevenueCat contract tests
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path source --script res://tests/economy_tests.gd 2>&1 | tee economy.log
          grep -q 'fail-closed IAP tests validated' economy.log
          if grep -Ei '(SCRIPT ERROR|Parse Error|ERROR:)' economy.log; then exit 1; fi

      - name: Game scene smoke test
        run: |
          set -euo pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path source --quit-after 100 2>&1 | tee smoke.log
          if grep -Ei '(SCRIPT ERROR|Parse Error|ERROR:)' smoke.log; then exit 1; fi

      - name: Validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flowforge-godot-validation-logs
          path: |
            *.log
          if-no-files-found: ignore
          retention-days: 7
