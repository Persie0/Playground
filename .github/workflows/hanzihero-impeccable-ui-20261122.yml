name: HanziHero Impeccable UI verification

on:
  push:
    branches:
      - impeccable/hanzihero-ui-ci-20261122
    paths:
      - .github/workflows/hanzihero-impeccable-ui-20261122.yml
      - hanzihero-impeccable-ui/run.txt
  workflow_dispatch:

concurrency:
  group: hanzihero-impeccable-20261122
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private HanziHero UX branch
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=impeccable/hanzihero-ux-40-20261122 https://github.com/Persie0/hanzi_hero.git app

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format updated Dart sources
        working-directory: app
        shell: bash
        run: |
          dart format \
            lib/l10n/feature_help_copy.dart \
            lib/l10n/flashcard_action_copy.dart \
            lib/l10n/learning_feedback_copy.dart \
            lib/l10n/radio_transport_copy.dart \
            lib/screens/cloud_sync_screen.dart \
            lib/screens/dictionary_screen.dart \
            lib/screens/flashcards/flashcards_screen.dart \
            lib/screens/google_drive_sync_screen.dart \
            lib/screens/home_screen.dart \
            lib/screens/home_tab.dart \
            lib/screens/icloud_sync_screen.dart \
            lib/screens/onboarding/goal_selection_screen.dart \
            lib/screens/onboarding/language_selection_screen.dart \
            lib/screens/onboarding/script_selection_screen.dart \
            lib/screens/onboarding/welcome_screen.dart \
            lib/screens/radio_session_screen.dart \
            lib/screens/sentence_build/sentence_build_result_screen.dart \
            lib/screens/sentence_build/sentence_build_screen.dart \
            lib/screens/sentence_build/translation_build_screen.dart \
            lib/screens/settings_screen.dart \
            lib/screens/start_learning/character_reveal_screen.dart \
            lib/screens/start_learning/character_select_screen.dart \
            lib/screens/start_learning/learning_audio_screen.dart \
            lib/screens/start_learning/learning_question_screen.dart \
            lib/screens/start_learning/meaning_guess_screen.dart \
            lib/screens/start_learning/pinyin_reveal_screen.dart \
            lib/screens/start_learning/sentence_review_screen.dart \
            lib/screens/start_learning/word_overview_screen.dart \
            lib/screens/store_screen.dart \
            lib/screens/themed_learning_screen.dart \
            lib/screens/widgets/first_use_coachmark.dart \
            lib/screens/widgets/hanzi_widgets.dart \
            lib/screens/widgets/playback_speed_controls.dart \
            lib/utils/app_theme.dart \
            lib/utils/sentence_choice_bank.dart \
            test/l10n/feature_help_copy_test.dart \
            test/l10n/flashcard_action_copy_test.dart \
            test/l10n/learning_feedback_copy_test.dart \
            test/l10n/radio_transport_copy_test.dart \
            test/utils/app_theme_primary_contrast_test.dart \
            test/utils/sentence_choice_bank_test.dart \
            test/widgets/first_use_coachmark_test.dart \
            test/widgets/hanzi_navigation_accessibility_test.dart \
            test/widgets/learning_question_recovery_test.dart \
            test/widgets/playback_speed_controls_test.dart \
            test/widgets/welcome_screen_accessibility_test.dart

      - name: Commit formatted sources to private feature branch
        working-directory: app
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git add lib/l10n/feature_help_copy.dart lib/l10n/flashcard_action_copy.dart lib/l10n/learning_feedback_copy.dart lib/l10n/radio_transport_copy.dart lib/screens/cloud_sync_screen.dart lib/screens/dictionary_screen.dart lib/screens/flashcards/flashcards_screen.dart lib/screens/google_drive_sync_screen.dart lib/screens/home_screen.dart lib/screens/home_tab.dart lib/screens/icloud_sync_screen.dart lib/screens/onboarding/goal_selection_screen.dart lib/screens/onboarding/language_selection_screen.dart lib/screens/onboarding/script_selection_screen.dart lib/screens/onboarding/welcome_screen.dart lib/screens/radio_session_screen.dart lib/screens/sentence_build/sentence_build_result_screen.dart lib/screens/sentence_build/sentence_build_screen.dart lib/screens/sentence_build/translation_build_screen.dart lib/screens/settings_screen.dart lib/screens/start_learning/character_reveal_screen.dart lib/screens/start_learning/character_select_screen.dart lib/screens/start_learning/learning_audio_screen.dart lib/screens/start_learning/learning_question_screen.dart lib/screens/start_learning/meaning_guess_screen.dart lib/screens/start_learning/pinyin_reveal_screen.dart lib/screens/start_learning/sentence_review_screen.dart lib/screens/start_learning/word_overview_screen.dart lib/screens/store_screen.dart lib/screens/themed_learning_screen.dart lib/screens/widgets/first_use_coachmark.dart lib/screens/widgets/hanzi_widgets.dart lib/screens/widgets/playback_speed_controls.dart lib/utils/app_theme.dart lib/utils/sentence_choice_bank.dart test/l10n/feature_help_copy_test.dart test/l10n/flashcard_action_copy_test.dart test/l10n/radio_transport_copy_test.dart test/utils/app_theme_primary_contrast_test.dart test/utils/sentence_choice_bank_test.dart test/widgets/first_use_coachmark_test.dart test/widgets/hanzi_navigation_accessibility_test.dart test/widgets/playback_speed_controls_test.dart test/widgets/welcome_screen_accessibility_test.dart test/l10n/learning_feedback_copy_test.dart test/widgets/learning_question_recovery_test.dart
          if git diff --cached --quiet; then
            echo "Formatting already clean"
            exit 0
          fi
          git config user.name "hanzihero-ui-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "style(ui): format Impeccable UX changes"
          AUTH="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch origin impeccable/hanzihero-ux-40-20261122
          git rebase FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/impeccable/hanzihero-ux-40-20261122

      - name: Resolve Flutter dependencies
        working-directory: app
        shell: bash
        run: flutter pub get > /tmp/hanzi_pub.log 2>&1 || { tail -n 18 /tmp/hanzi_pub.log; exit 1; }

      - name: Flutter static analyzer
        working-directory: app
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/hanzi_analyze.log 2>&1
          RESULT=$?
          echo "Flutter analyze exit status: $RESULT"
          if [ "$RESULT" -ne 0 ]; then
            grep -E '^  error •|^error •|^Error:' /tmp/hanzi_analyze.log | head -n 50 || true
          fi
          exit "$RESULT"

      - name: Focused UX, localization and accessibility widget tests
        working-directory: app
        shell: bash
        run: |
          flutter test --reporter expanded \
            test/l10n/radio_transport_copy_test.dart \
            test/l10n/flashcard_action_copy_test.dart \
            test/l10n/feature_help_copy_test.dart \
            test/l10n/learning_feedback_copy_test.dart \
            test/utils/app_theme_primary_contrast_test.dart \
            test/utils/sentence_choice_bank_test.dart \
            test/widgets/hanzi_navigation_accessibility_test.dart \
            test/widgets/learning_question_recovery_test.dart \
            test/widgets/playback_speed_controls_test.dart \
            test/widgets/first_use_coachmark_test.dart \
            test/widgets/welcome_screen_accessibility_test.dart

      - name: Flutter test suite
        working-directory: app
        shell: bash
        run: |
          set +e
          flutter test > /tmp/hanzi_test.log 2>&1
          RESULT=$?
          echo "Flutter test exit status: $RESULT"
          if [ "$RESULT" -ne 0 ]; then
            grep -E '(\[E\]|Some tests failed|Expected:|Actual:|Exception|failed)' /tmp/hanzi_test.log | tail -n 45 || true
          fi
          exit "$RESULT"
