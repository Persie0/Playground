name: ToiletCompass Flutter database tests

on:
  push:
    branches: [toiletcompass-country-pilot-run]
    paths:
      - '.github/workflows/toiletcompass-flutter-db-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - uses: actions/checkout@v5
        with:
          repository: Persie0/toiletcompass
          ref: feat/monthly-country-database-pipeline-pilot2
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: toiletcompass
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        working-directory: toiletcompass
        run: flutter pub get
      - name: Run database update tests
        working-directory: toiletcompass
        run: flutter test test/database_manifest_test.dart test/database_update_io_test.dart
