name: Photosphere checkpoint323 original output tails
on:
  push:
    branches: [research/photosphere-checkpoint323-output-tails]
    paths: [.github/workflows/photosphere-checkpoint323-output-tails.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-tail-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install original machine code inspection tools
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools unicorn
      - name: Retrieve original hash-verified Google Camera ARM64 ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk'
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Read-only checkout original research
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: c74d8f1d8d78861fedd054a039a9c21154ea4f7e
          path: research
          sparse-checkout: |
            research/photosphere/checkpoint323
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Disassemble two original output tail targets
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = c74d8f1d8d78861fedd054a039a9c21154ea4f7e
          python3 research/research/photosphere/checkpoint323/scan_original_output_tails.py original.so --output checkpoint323-original-tail-scan.json | tee checkpoint323-original-tail-scan.log
          grep -q '^CHECKPOINT323_ORIGINAL_TAIL_SCAN' checkpoint323-original-tail-scan.log
          python3 research/research/photosphere/checkpoint323/native_original_output_tail_paths.py original.so --output checkpoint323-native-tails.json | tee checkpoint323-native-tails.log
          grep -q '^CHECKPOINT323_ORIGINAL_TAIL_SOURCE_PASS' checkpoint323-native-tails.log
          python3 research/research/photosphere/checkpoint323/scan_original_tail_callers.py original.so --output checkpoint323-caller-context.json | tee checkpoint323-caller-context.log
          grep -q '^CHECKPOINT323_ORIGINAL_CALLER_CONTEXT' checkpoint323-caller-context.log
          python3 research/research/photosphere/checkpoint323/native_original_fwrite_cas.py original.so --output checkpoint323-native-fwrite-cas.json | tee checkpoint323-native-fwrite-cas.log
          grep -q '^CHECKPOINT323_ORIGINAL_FWRITE_CAS_PASS' checkpoint323-native-fwrite-cas.log
          echo CHECKPOINT323_FWRITE_CAS_JSON_BEGIN
          cat checkpoint323-native-fwrite-cas.json
          echo CHECKPOINT323_FWRITE_CAS_JSON_END
          echo CHECKPOINT323_CALLER_JSON_BEGIN
          cat checkpoint323-caller-context.json
          echo CHECKPOINT323_CALLER_JSON_END
          echo CHECKPOINT323_TAILS_JSON_BEGIN
          cat checkpoint323-native-tails.json
          echo CHECKPOINT323_TAILS_JSON_END
          echo CHECKPOINT323_SCAN_JSON_BEGIN
          cat checkpoint323-original-tail-scan.json
          echo CHECKPOINT323_SCAN_JSON_END
      - name: Checkout exact checkpoint323 Rust commit read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 146e0f2eec7fbeba8a2c1b19f26d296203c84fe3
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Compare regenerated source-original oracles with Rust frozen fixtures
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = 146e0f2eec7fbeba8a2c1b19f26d296203c84fe3
          python3 - <<'PY'
          import json
          from pathlib import Path
          pairs=[
            ("checkpoint323-native-fwrite-cas.json","app/tests/fixtures/native_original_fwrite_cas_323.json"),
            ("checkpoint323-native-tails.json","app/tests/fixtures/native_original_output_tail_stubbed_323.json"),
            ("checkpoint323-caller-context.json","app/tests/fixtures/native_original_tail_caller_context_323.json"),
            ("checkpoint323-original-tail-scan.json","app/tests/fixtures/native_original_output_tail_scan_323.json"),
          ]
          for native_path, rust_path in pairs:
            actual=json.loads(Path(native_path).read_text())
            frozen=json.loads(Path(rust_path).read_text())
            assert actual==frozen, (native_path,"original source differs from Rust fixture")
            print("CHECKPOINT323_ORIGINAL_RUST_FIXTURE_EQUAL",native_path)
          o=json.loads(Path(pairs[0][0]).read_text())
          assert o["original_fwrite_argument_cases"]==4
          assert o["original_atomic_cases"]==11
          assert o["original_atomic_fastpath_cas_execution_count"]==8
          assert o["original_exact_opcode_pins"]==27
          assert o["original_atomic_lse_casl_opcode_pinned_but_not_executed"]
          print("CHECKPOINT323_SOURCE_EXCLUSIVE_CAS_VERIFIED",4,11,8,27)
          PY
      - name: Run focused and full Rust library regression
        run: |
          set -euo pipefail
          cd app
          rustfmt --edition 2021 src/native_line_tail_fwrite_atomic.rs src/native_line_tail_fwrite_atomic_checkpoint323_test.rs
          cargo test --lib checkpoint323 -- --nocapture
          cargo test --lib
      - name: Print formatted Rust source for exact readback
        run: |
          echo CHECKPOINT323_RUST_MODEL_BEGIN
          cat app/src/native_line_tail_fwrite_atomic.rs
          echo CHECKPOINT323_RUST_MODEL_END
          echo CHECKPOINT323_RUST_TEST_BEGIN
          cat app/src/native_line_tail_fwrite_atomic_checkpoint323_test.rs
          echo CHECKPOINT323_RUST_TEST_END
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint323-original-output-tails
          path: |
            checkpoint323-original-tail-scan.json
            checkpoint323-original-tail-scan.log
            checkpoint323-native-tails.json
            checkpoint323-native-tails.log
            checkpoint323-caller-context.json
            checkpoint323-caller-context.log
            checkpoint323-native-fwrite-cas.json
            checkpoint323-native-fwrite-cas.log
          retention-days: 14
