name: Noise Remover R8 native processing smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noise-remover-r8-native-smoke.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Noise Remover branch/SHA
        required: true
        default: fix/actionable-errors-r8-processing
        type: string

permissions:
  contents: read

env:
  APP_REF: ${{ inputs.ref || 'fix/actionable-errors-r8-processing' }}

jobs:
  release-native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Noise Remover
        uses: actions/checkout@v5
        with:
          repository: Persie0/noise_remover
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare project and release integration test
        working-directory: app
        run: |
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_SDK_ROOT" > android/local.properties
          yes | sdkmanager "ndk;29.0.14206865" >/dev/null || true
          cat > android/gradlew <<'EOF'
          #!/usr/bin/env bash
          set -e
          exec gradle "$@"
          EOF
          chmod +x android/gradlew

          keytool -genkeypair -v \
            -keystore android/app/ci-release.jks \
            -storepass android \
            -keypass android \
            -alias ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=US"
          printf '%s\n' \
            'storePassword=android' \
            'keyPassword=android' \
            'keyAlias=ci' \
            'storeFile=ci-release.jks' \
            > android/key.properties

          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          s = p.read_text()
          marker = 'dev_dependencies:\n'
          if 'integration_test:' not in s:
              if marker not in s:
                  raise SystemExit('dev_dependencies marker missing')
              s = s.replace(marker, 'dev_dependencies:\n  integration_test:\n    sdk: flutter\n', 1)
              p.write_text(s)

          Path('integration_test').mkdir(exist_ok=True)
          Path('test_driver').mkdir(exist_ok=True)
          Path('test_driver/integration_test.dart').write_text("""import 'package:integration_test/integration_test_driver.dart';

Future<void> main() => integrationDriver();
""")

          Path('integration_test/r8_native_processing_smoke_test.dart').write_text(r'''import 'dart:io';
import 'dart:math' as math;
import 'dart:typed_data';

import 'package:dpdfnet_flutter/dpdfnet_flutter.dart';
import 'package:ffmpeg_kit_flutter_new_audio/ffprobe_kit.dart';
import 'package:ffmpeg_kit_flutter_new_audio/return_code.dart';
import 'package:flutter_nnnoiseless/flutter_nnnoiseless.dart';
import 'package:flutter_test/flutter_test.dart';
import 'package:integration_test/integration_test.dart';
import 'package:noise_remover/utils/ffmpeg_utils.dart';
import 'package:path_provider/path_provider.dart';

Uint8List makeWav({int seconds = 3, int sampleRate = 48000}) {
  final samples = seconds * sampleRate;
  final dataSize = samples * 2;
  final out = ByteData(44 + dataSize);
  void ascii(int offset, String text) {
    for (var i = 0; i < text.length; i++) {
      out.setUint8(offset + i, text.codeUnitAt(i));
    }
  }
  ascii(0, 'RIFF');
  out.setUint32(4, 36 + dataSize, Endian.little);
  ascii(8, 'WAVE');
  ascii(12, 'fmt ');
  out.setUint32(16, 16, Endian.little);
  out.setUint16(20, 1, Endian.little);
  out.setUint16(22, 1, Endian.little);
  out.setUint32(24, sampleRate, Endian.little);
  out.setUint32(28, sampleRate * 2, Endian.little);
  out.setUint16(32, 2, Endian.little);
  out.setUint16(34, 16, Endian.little);
  ascii(36, 'data');
  out.setUint32(40, dataSize, Endian.little);
  for (var i = 0; i < samples; i++) {
    final t = i / sampleRate;
    final signal = 0.22 * math.sin(2 * math.pi * 220 * t) +
        0.10 * math.sin(2 * math.pi * 440 * t) +
        0.03 * math.sin(2 * math.pi * 3173 * t);
    final value = (signal.clamp(-0.95, 0.95) * 32767).round();
    out.setInt16(44 + i * 2, value, Endian.little);
  }
  return out.buffer.asUint8List();
}

void main() {
  IntegrationTestWidgetsFlutterBinding.ensureInitialized();

  testWidgets('R8 release keeps FFmpeg and RNNoise native bridges', (tester) async {
    final dir = await getTemporaryDirectory();
    final input = File('${dir.path}/r8_smoke_input.wav');
    final rnnoise = File('${dir.path}/r8_smoke_rnnoise.wav');
    final ffmpeg = File('${dir.path}/r8_smoke_ffmpeg.wav');
    await input.writeAsBytes(makeWav(), flush: true);
    expect(await input.length(), greaterThan(100000));

    final probe = await FFprobeKit.getMediaInformation(input.path);
    expect(probe.getMediaInformation(), isNotNull,
        reason: 'FFprobe Java/JNI bridge failed under R8 release');

    await ensureFlutterNnnoiselessInitialized();
    await Noiseless.instance.denoiseFile(
      inputPathStr: input.path,
      outputPathStr: rnnoise.path,
      onProgress: (_) {},
    );
    expect(await rnnoise.exists(), isTrue);
    expect(await rnnoise.length(), greaterThan(44),
        reason: 'RNNoise Rust bridge produced no output under R8');

    final session = await executeFFmpegAsync(
      '-y -i "${rnnoise.path}" -ac 1 -ar 48000 -c:a pcm_s16le "${ffmpeg.path}"',
    );
    final rc = await session.getReturnCode();
    expect(ReturnCode.isSuccess(rc), isTrue,
        reason: 'FFmpeg callback/JNI bridge failed under R8 release');
    expect(await ffmpeg.length(), greaterThan(44));
  }, timeout: const Timeout(Duration(minutes: 5)));

  testWidgets('R8 release keeps DPDFNet/ONNX processing bridge', (tester) async {
    final dir = await getTemporaryDirectory();
    final input = File('${dir.path}/r8_dpdf_input.wav');
    final output = File('${dir.path}/r8_dpdf_output.wav');
    await input.writeAsBytes(makeWav(seconds: 2), flush: true);

    await DPDFNetEngine.processFileInIsolate(
      DPDFNetModel.dpdfnet2_48khzHr.packageAssetPath(),
      input.path,
      output.path,
      useHardwareAcceleration: false,
    );
    expect(await output.exists(), isTrue);
    expect(await output.length(), greaterThan(44),
        reason: 'DPDFNet Rust/ONNX bridge produced no output under R8');
  }, timeout: const Timeout(Duration(minutes: 8)));
}
''')
          PY

          flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run native processing in R8 release app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: |
            cd app
            flutter drive \
              --driver=test_driver/integration_test.dart \
              --target=integration_test/r8_native_processing_smoke_test.dart \
              -d emulator-5554 \
              --release
