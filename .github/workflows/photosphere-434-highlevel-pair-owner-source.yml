name: Photosphere 434 original highlevel pair owner producer
on:
  push:
    branches: [main]
    paths: [.github/workflows/photosphere-434-highlevel-pair-owner-source.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-434-highlevel-pair-owner-source
  cancel-in-progress: false
jobs:
  original-highlevel-owner-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pinned private source checkout read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: c8e802c83c411f4b57bfeef15171af5d4257de69
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify pinned commit and install static ELF tools
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c8e802c83c411f4b57bfeef15171af5d4257de69
          python3 -m pip install --quiet --break-system-packages capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint434/scan_highlevel_source_pair_owner.py
      - name: Verify original pinned Google Camera APK and ELF
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Verify original highlevel pair X0 callsite producer
        working-directory: research-src
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint434/scan_highlevel_source_pair_owner.py original.so --out checkpoint434-original-highlevel-pair-owner-source.json
          test -s checkpoint434-original-highlevel-pair-owner-source.json
      - name: Delete proprietary original executable before artifact upload
        if: always()
        working-directory: research-src
        run: |
          rm -f original.apk original.so com.google.android.GoogleCamera_*.apk
      - name: Upload source-only numeric dispatch map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-434-original-highlevel-pair-owner-source
          path: research-src/checkpoint434-original-highlevel-pair-owner-source.json
          if-no-files-found: warn
          retention-days: 7
