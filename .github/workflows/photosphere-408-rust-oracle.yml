name: Photosphere 408 alternate third original oracle Rust differential
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-408-rust-oracle.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: photosphere-408-rust-oracle
  cancel-in-progress: false
jobs:
  source-oracle-grouped-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Retrieve already verified public 407 original source-only archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42926416280 --repo Persie0/Playground \
            --name photosphere-407-original-alternate-third-source --dir source-oracle
          test "$(find source-oracle -name checkpoint407-original-native.json -type f | wc -l)" -eq 1
          python3 - <<'PY'
          import pathlib,json
          f=next(pathlib.Path("source-oracle").rglob("checkpoint407-original-native.json"))
          r=json.loads(f.read_text())
          a=r["checkpoint407_alternate_original_pixels"]
          assert r["original_elf_sha256"]=="878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1"
          assert a["native_first_second_third_x_offsets"]==[0,1,2]
          assert [a["native_original_0_to_2_raw_matches"],a["native_original_1_to_2_raw_matches"]]==[15,17]
          assert [a["source_native_0_to_2_inlier_rows"],a["source_native_1_to_2_inlier_rows"]]==[15,16]
          assert a["source_native_graph_pair_0_to_2_executed"] and a["source_native_graph_pair_1_to_2_executed"]
          assert a["source_original_native_guard_x8"]==a["source_original_native_guard_x9"]=="0x2"
          assert a["source_original_native_exit_pc"]=="0x11e014"
          assert a["source_original_third_native_execution_error"] is None
          assert len(set(a[k] for k in ["source_original_first_pixel_sha256",
              "source_original_second_pixel_sha256","source_original_third_pixel_sha256"]))==3
          assert not a["native_graph_memory_and_branch_patched"]
          assert not a["original_bionic_rand_reproduced"]
          assert r["checkpoint383_third_original_sampler"]["source_test_controlled_first_sample_pair"]==[0,14]
          assert r["checkpoint399_second_robust"]["test_controlled_sampler_pair_indices"]==[0,16]
          print("CHECKPOINT407_ARCHIVED_ORIGINAL_SOURCE_VERIFIED")
          PY
      - name: Read-only pinned private Rust app checkout
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 38b4e6be87999fda21e578b0c657ea9fa9a41acd
          path: app-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: One grouped Rust all-targets source-original x0/x1/x2 differential
        working-directory: app-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 38b4e6be87999fda21e578b0c657ea9fa9a41acd
          export PHOTOSPHERE_407_NATIVE_JSON="$(find ../source-oracle -name checkpoint407-original-native.json -type f)"
          test -s "$PHOTOSPHERE_407_NATIVE_JSON"
          cargo test --locked --all-targets > checkpoint408-rust.log 2>&1 || {
            tail -n 180 checkpoint408-rust.log
            exit 1
          }
          grep '^test result:' checkpoint408-rust.log | tail -n 12
          echo 'CHECKPOINT408_RUST_ALTERNATE_NATIVE_ORACLE_PASS'
      - name: Archive grouped Rust logs only (reuse public source oracle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-408-original-alternate-three-pixel-rust
          path: app-src/checkpoint408-rust.log
          retention-days: 7
          if-no-files-found: warn
