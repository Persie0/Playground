name: Photo Sphere checkpoint 134 gamma-area scaler full Rust regression
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/photosphere-checkpoint-134-rust.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config: [default, portable, android-jni]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereRust
          ref: c317c20494b446ed2912800fcd2d8e24f026440d
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          path: PhotosphereRust
      - uses: dtolnay/rust-toolchain@stable
      - name: Run complete Rust default portable Android-JNI matrix for gamma-aware area downscale
        working-directory: PhotosphereRust
        shell: bash
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          set -euo pipefail
          case "$CONFIG" in
            default) cargo test --all-targets ;;
            portable) cargo test --all-targets --no-default-features ;;
            android-jni) cargo test --all-targets --features android-jni ;;
          esac
          # Existing unrelated whole-repo rustfmt differences are tracked separately; this lane verifies behavior.
