name: Noise Remover CoreML smoke

on:
  push:
    branches:
      - test/noise-remover-coreml
  workflow_dispatch:

jobs:
  coreml-smoke:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check CoreML ORT configuration
        working-directory: noise-remover-coreml-smoke
        run: cargo check --features coreml
