name: SkipSilencePlayer Android long-video fixes
on:
  push:
    branches:
      - validation/skipsilence-long-video-20261121
    paths:
      - .github/workflows/skipsilence-long-video-fix.yml
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/SkipSilencePlayer
          ref: fix/android-smooth-long-video-20261121
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          path: source
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Run Android unit tests and build debug APK
        working-directory: source/kotlin-android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SkipSilencePlayer-long-video-smooth-fix-debug-APK
          path: source/kotlin-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
