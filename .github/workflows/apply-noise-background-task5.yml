name: Apply Noise Remover background Task 5

on:
  push:
    branches: [background-media-processing-validation-20260928]
    paths: ['.github/workflows/apply-noise-background-task5.yml']

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/noise_remover
  APP_REF: feature/android-background-media-processing-20260928

jobs:
  apply-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: app

      - name: Patch HomeScreen foreground reattach
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/screens/home_screen.dart')
          s = p.read_text()

          def once(old, new, label, source=None):
              global s
              target = s if source is None else source
              count = target.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, got {count}')
              return target.replace(old, new, 1)

          base_import = "import '../services/background_processing_task.dart';\n"
          if "import '../services/android_media_processing_service.dart';" not in s:
              s = once(
                  base_import,
                  base_import
                  + "import '../services/android_media_processing_service.dart';\n"
                  + "import '../services/background_processing_recovery.dart';\n",
                  'service imports',
              )

          startup = '''    if (savedJob != null && mounted) {
              var recoveryJob = savedJob;

              void scheduleRecoveryPrompt(Map<String, dynamic> job) {
                WidgetsBinding.instance.addPostFrameCallback((_) {
                  if (!mounted) return;
                  unawaited(
                    _promptSavedJobRecovery(job).catchError((
                      Object error,
                      StackTrace stackTrace,
                    ) async {
                      debugPrint('Saved-job recovery prompt failed: $error');
                      await Sentry.captureException(error, stackTrace: stackTrace);
                    }),
                  );
                });
              }

              if (recoveryJob['type'] == 'short') {
                final jobId = recoveryJob['jobId'] as String?;
                var foregroundOwnsJob = false;
                if (Platform.isAndroid &&
                    recoveryJob['status'] == 'inProgress' &&
                    jobId != null) {
                  foregroundOwnsJob = await AndroidMediaProcessingService.instance
                      .isRunningForJob(jobId);
                  final latest = await _processingLock.loadJobState();
                  if (latest != null && latest['jobId'] == jobId) {
                    recoveryJob = latest;
                  }
                }

                final recoveryAction = resolveShortJobRecovery(
                  savedJob: recoveryJob,
                  foregroundOwnsJob: foregroundOwnsJob,
                );
                switch (recoveryAction) {
                  case ShortJobRecoveryAction.reattach:
                    WidgetsBinding.instance.addPostFrameCallback((_) {
                      if (!mounted) return;
                      unawaited(
                        _reattachShortForegroundJob(recoveryJob).catchError((
                          Object error,
                          StackTrace stackTrace,
                        ) async {
                          debugPrint('Foreground job reattach failed: $error');
                          await Sentry.captureException(
                            error,
                            stackTrace: stackTrace,
                          );
                        }),
                      );
                    });
                    break;
                  case ShortJobRecoveryAction.markInterrupted:
                    recoveryJob = {...recoveryJob, 'status': 'interrupted'};
                    await _processingLock.saveJobState(recoveryJob);
                    scheduleRecoveryPrompt(recoveryJob);
                    break;
                  case ShortJobRecoveryAction.resumeFinalization:
                    final finalizationState = {
                      ...recoveryJob,
                      'status': 'finalizing',
                    };
                    await _processingLock.saveJobState(finalizationState);
                    WidgetsBinding.instance.addPostFrameCallback((_) {
                      if (!mounted) return;
                      unawaited(
                        _resumeShortFinalization(finalizationState).catchError((
                          Object error,
                          StackTrace stackTrace,
                        ) async {
                          debugPrint('Foreground finalization recovery failed: $error');
                          await Sentry.captureException(
                            error,
                            stackTrace: stackTrace,
                          );
                        }),
                      );
                    });
                    break;
                  case ShortJobRecoveryAction.promptExistingRecovery:
                    scheduleRecoveryPrompt(recoveryJob);
                    break;
                }
              } else {
                if (recoveryJob['status'] == 'inProgress') {
                  recoveryJob = {...recoveryJob, 'status': 'interrupted'};
                  await _processingLock.saveJobState(recoveryJob);
                }
                scheduleRecoveryPrompt(recoveryJob);
              }
            }
          '''

          if '_reattachShortForegroundJob(recoveryJob)' not in s:
              start = s.find("    if (savedJob != null && mounted) {")
              end_marker = "\n  }\n\n  Future<void> _promptSavedJobRecovery"
              end = s.find(end_marker, start)
              if start < 0 or end < 0:
                  raise SystemExit('startup recovery block not found')
              s = s[:start] + startup + s[end:]

          method = '''  Future<void> _reattachShortForegroundJob(
              Map<String, dynamic> savedJob,
            ) async {
              final filePath = savedJob['filePath'] as String?;
              if (filePath == null || filePath.isEmpty) {
                await _processingLock.clearJobState();
                return;
              }
              await _processFile(
                filePath,
                wasResumed: true,
                foregroundReattach: true,
              );
            }

          '''
          marker = '  Future<void> _promptSavedJobRecovery(Map<String, dynamic> savedJob) async {'
          if 'Future<void> _reattachShortForegroundJob(' not in s:
              s = once(marker, method + marker, 'reattach method')

          old_sig = '''  Future<void> _processFile(
              String filePath, {
              bool wasResumed = false,
              String? pickedFileName,
            }) async {'''
          new_sig = '''  Future<void> _processFile(
              String filePath, {
              bool wasResumed = false,
              bool foregroundReattach = false,
              String? pickedFileName,
            }) async {'''
          if 'bool foregroundReattach = false' not in s:
              s = once(old_sig, new_sig, 'process signature')

          process_start = s.find('  Future<void> _processFile(')
          if process_start < 0:
              raise SystemExit('process method not found')
          head, tail = s[:process_start], s[process_start:]

          old_lock = '''      recoveryState = payload;
              await _processingLock.start(jobId: shortJobId, payload: payload);
              processingLockStarted = true;

              workerFuture = runProcessingTask('''
          new_lock = '''      recoveryState = payload;
              if (!foregroundReattach) {
                await _processingLock.start(jobId: shortJobId, payload: payload);
                processingLockStarted = true;
              }

              workerFuture = runProcessingTask('''
          if 'if (!foregroundReattach) {' not in tail:
              tail = once(old_lock, new_lock, 'foreground lock handoff', tail)

          old_cancel = '''                  messageNotifier?.value = l10n.cancel;
                            unawaited(cancellationToken.cancel());'''
          new_cancel = '''                  messageNotifier?.value = l10n.cancel;
                            if (Platform.isAndroid) {
                              await AndroidMediaProcessingService.instance.cancel();
                            }
                            unawaited(cancellationToken.cancel());'''
          if new_cancel not in tail:
              tail = once(old_cancel, new_cancel, 'direct foreground cancel', tail)

          old_cancelled_catch = '''      if (isCancelled || !mounted) {
              if (mounted && processingScreenPushed) Navigator.pop(context);
              return;
            }'''
          new_cancelled_catch = '''      if (isCancelled || !mounted) {
              if (isCancelled && foregroundReattach) {
                await _processingLock.clearJobState();
              }
              if (mounted && processingScreenPushed) Navigator.pop(context);
              return;
            }'''
          if 'if (isCancelled && foregroundReattach)' not in tail:
              tail = once(
                  old_cancelled_catch,
                  new_cancelled_catch,
                  'reattach cancellation cleanup',
                  tail,
              )

          s = head + tail
          p.write_text(s)
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Focused foreground tests
        working-directory: app
        run: |
          flutter test \
            test/background_processing_foreground_service_regression_test.dart \
            test/services/android_media_processing_service_test.dart \
            test/services/background_processing_recovery_test.dart \
            test/services/foreground_processing_state_test.dart

      - name: Analyze foreground integration
        working-directory: app
        run: flutter analyze lib/screens/home_screen.dart lib/services/background_processing_task.dart lib/services/android_media_processing_service.dart

      - name: Commit verified patch
        working-directory: app
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet; then
            echo 'No patch to push.'
            exit 0
          fi
          git add lib/screens/home_screen.dart
          git commit -m 'feat: reattach active Android foreground noise jobs'
          git push origin HEAD:${APP_REF}
