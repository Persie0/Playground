name: Face Scanner iOS target verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/face-scanner-ios-target-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out Face Scanner fixes
        uses: actions/checkout@v4
        with:
          repository: Persie0/face_scanner
          ref: fix/review-open-prs-20260929
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: face_scanner
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: face_scanner
        run: flutter pub get
      - name: Build iOS without signing
        working-directory: face_scanner
        run: flutter build ios --debug --no-codesign
