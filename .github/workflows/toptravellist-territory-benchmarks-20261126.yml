name: TopTravelList territory benchmark numerical audit
on:
  push:
    branches:
      - audit/toptravellist-territory-benchmarks-20261126
    paths:
      - '.github/workflows/toptravellist-territory-benchmarks-20261126.yml'
      - 'scripts/toptravellist-territory-benchmark-audit-20261126.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toptravellist-territory-benchmarks-20261126
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: feature/worldwide-territories-greenland
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: target
          fetch-depth: 1
      - name: Install validator dependencies
        run: python -m pip install --quiet pyyaml jsonschema referencing
      - name: Audit active territory records
        working-directory: target
        run: |
          python ../scripts/toptravellist-territory-benchmark-audit-20261126.py
          git diff --check
          git diff --name-only | grep -v '^methodology/reviews/' && exit 1 || true
      - name: Run canonical checks (record exit codes only)
        working-directory: target
        run: |
          set +e
          for script in validate.py check_city_benchmarks.py check_sight_benchmarks.py; do
            python "scripts/$script" > "/tmp/$script.log" 2>&1
            echo "$script exit=$?"
          done
          python scripts/generate_rankings.py --check >/tmp/generate-check.log 2>&1
          echo "generate_rankings.py --check exit=$?"
          python scripts/rank.py --kind cities --limit 60 >/tmp/top-cities.log 2>&1
          echo "rank.py cities exit=$?"
          python scripts/rank.py --kind sights --limit 60 >/tmp/top-sights.log 2>&1
          echo "rank.py sights exit=$?"
      - name: Commit documentation only and push without force
        working-directory: target
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add methodology/reviews
          git diff --cached --quiet && exit 0
          git commit -m 'Verify numerical international benchmark coverage across territory reviews' >/tmp/territory-audit-commit.log
          git push origin HEAD:feature/worldwide-territories-greenland
          echo "AUDIT_COMMIT=$(git rev-parse HEAD)"
