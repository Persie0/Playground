name: Photo Sphere checkpoint 237 native feature pyramid pixel bytes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-native-pyramid-pixels-237.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: research/checkpoint237-native-feature-downsample-pixels
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install Unicorn and ELF dependencies
        run: python3 -m pip install --break-system-packages --quiet -r research/photosphere/checkpoint218/requirements.txt
      - name: Retrieve and verify original GCam binary
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Execute pinned native pixel filter and assert fourteen exact byte oracles
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint237/native_feature_downsample_pixels.py > checkpoint237.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          text=Path('checkpoint237.log').read_text()
          p=json.loads(text.split('CHECKPOINT237_JSON_BEGIN\n')[1].split('\nCHECKPOINT237_JSON_END')[0])
          assert len(p['cases'])==14
          for case in p['cases']:
              w,h=case['source_dimensions']
              assert case['native_output_dimensions']==[w//2+1,h//2+1]
              assert case['native_allocation_args']==[w//2+1,h//2+1,1,8]
              assert len(case['native_pixels'])==(w//2+1)*(h//2+1)
              print(case['name'],case['native_output_dimensions'],case['native_pixel_sha256'])
          Path('checkpoint237.json').write_text(json.dumps(p,indent=2)+'\n')
          print('CHECKPOINT237_JSON_BEGIN')
          print(json.dumps(p,separators=(',',':')))
          print('CHECKPOINT237_JSON_END')
          print('PASS: fourteen bounded original native first pyramid pixel oracles')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint237-original-feature-pyramid-pixels
          path: checkpoint237.json
          retention-days: 7
          if-no-files-found: warn
