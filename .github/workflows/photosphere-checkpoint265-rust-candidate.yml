name: Photosphere checkpoint265 Rust original candidate parity (one-shot)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/photosphere-checkpoint265-rust-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-parity-singletons
  cancel-in-progress: false
jobs:
  original-candidate-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact app candidate through Playground
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: e9add83767f180c10753bc21aa623b3378550e0f
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Assert source pin
        run: test "$(git rev-parse HEAD)" = "e9add83767f180c10753bc21aa623b3378550e0f"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - name: Run original ARM64 model candidate bit parity test
        run: |
          set -euo pipefail
          cargo test --locked --lib checkpoint265_original_25_match_arm64_candidate_bits_equal_production -- --nocapture > checkpoint265-focused.log 2>&1 || {
            tail -n 120 checkpoint265-focused.log
            exit 1
          }
          tail -n 16 checkpoint265-focused.log
      - name: Run full locked Rust library test suite
        run: |
          set -euo pipefail
          cargo test --locked --lib > checkpoint265-all.log 2>&1 || {
            tail -n 120 checkpoint265-all.log
            exit 1
          }
          grep -E 'test result:' checkpoint265-all.log | tail -2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint265-candidate-rust
          path: |
            checkpoint265-focused.log
            checkpoint265-all.log
          if-no-files-found: warn
          retention-days: 14
