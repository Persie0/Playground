name: ImagePdfScaler exact circle hit validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imagepdfscaler-exact-hit-check.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/ImagePdfScaler
          ref: fix/resize-handle-exact-hit-area
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
