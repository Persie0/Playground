name: Ultrasonic minimum-cost validation
on:
  push:
    branches: [ultrasonic-minimum-cost-validation]
    paths: ['.github/workflows/ultrasonic-minimum-cost-validation.yml']
permissions:
  contents: read
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/Ultrasonic
          ref: 0621ebdfde6dadb18fc5a01750c8aa27e74ccf85
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          persist-credentials: false
      - name: Run both electrical sweeps
        run: |
          python3 designs/esp32-digital/simulation/rc_sweep.py
          python3 designs/esp32-digital/simulation/minimum_cost_sweep.py
          python3 - <<'PY'
          import csv, math, pathlib
          d=pathlib.Path("designs/esp32-digital/simulation")
          generated=list(csv.DictReader((d/"minimum-cost-results.csv").open()))
          for variant in ("baseline","passive"):
              ref=list(csv.DictReader((d/f"minimum-cost-{variant}.csv").open()))
              actual=[r for r in generated if r["variant"]==variant]
              assert len(ref)==len(actual)==3240
              def key(r):
                  return (r['scenario'], *(float(r[k]) for k in ('supply_V','capacitance_nF','series_ohm','assumed_driver_ohm','a_ticks','b_ticks')))
              for x,y in zip(sorted(ref,key=key),sorted(actual,key=key)):
                  for k in x:
                      if k in ("variant","scenario"):
                          assert x[k]==y[k]
                      else:
                          assert math.isclose(float(x[k]),float(y[k]),rel_tol=1e-8,abs_tol=1e-9),(k,x[k],y[k])
          print("6480 rows match committed reference")
          PY
          python3 designs/esp32-digital/integrated/power_sweep.py
      - name: Install KiCad 9
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints
          kicad-cli version
      - name: Strict native ERC and DRC
        run: |
          mkdir -p reports "$HOME/.config/kicad/9.0"
          result=0
          for name in minimum-cost integrated; do
            folder=designs/esp32-digital/$name
            sed "s|\${KIPRJMOD}|$PWD/$folder|g" "$folder/sym-lib-table" > "$HOME/.config/kicad/9.0/sym-lib-table"
            sed "s|\${KIPRJMOD}|$PWD/$folder|g" "$folder/fp-lib-table" > "$HOME/.config/kicad/9.0/fp-lib-table"
            kicad-cli sch erc --exit-code-violations -o "reports/$name-erc.txt" "$folder/$name.kicad_sch" || result=1
            kicad-cli pcb drc --exit-code-violations -o "reports/$name-drc.txt" "$folder/$name.kicad_pcb" || result=1
          done
          for f in reports/*.txt; do echo "=== $f ==="; cat "$f"; done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minimum-cost-eda
          path: reports/
