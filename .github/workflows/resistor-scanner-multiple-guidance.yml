name: Resistor Scanner multiple-resistor guidance validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resistor-scanner-multiple-guidance.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/resistor-scanner-android
          ref: fix/multiple-resistor-guidance
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify warning hooked to segmentation and UI
        run: |
          set -eu
          grep -F 'hasMultipleResistors(' app/src/main/java/at/austriao/resistorscanner/pipeline/ScannerPipeline.kt
          grep -F 'GuidanceReason.MULTIPLE_RESISTORS' app/src/main/java/at/austriao/resistorscanner/ui/ScannerScreen.kt
          grep -F 'Multiple resistors detected — remove the others' app/src/main/java/at/austriao/resistorscanner/ui/ScannerScreen.kt
      - name: Test and build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
  ios:
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/resistor-scanner-ios
          ref: fix/multiple-resistor-guidance
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
      - name: Verify warning is wired
        run: |
          set -eu
          grep -F 'hasMultipleResistors(' ResistorScanner/Pipeline/ScannerEngine.swift
          grep -F '.multipleResistors' ResistorScanner/UI/ScannerViewModel.swift
          grep -F 'Multiple resistors detected — remove the others' ResistorScanner/UI/ScannerViewModel.swift
      - name: Swift unit tests
        run: swift test
      - name: iOS Simulator build
        run: |
          xcodebuild -project ResistorScanner.xcodeproj -scheme ResistorScanner \
            -destination 'generic/platform=iOS Simulator' -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/build.log" 2>&1 || { tail -100 "$RUNNER_TEMP/build.log"; exit 1; }
