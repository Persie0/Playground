name: FocusMove Impeccable onboarding lint hotfix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/focusmove-impeccable-hotfix.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private hotfix branch (ephemeral)
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=fix/impeccable-onboarding-lint https://github.com/Persie0/pomodoroexercise.git source
      - name: Analyze and run all Flutter tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test --reporter expanded
