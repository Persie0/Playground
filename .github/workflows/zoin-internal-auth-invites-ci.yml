name: Zoin internal tester auth and short invite validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/zoin-internal-auth-invites-ci.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Read Zoin branch with sequential read-only token fallback
        shell: bash
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/git-askpass-zoin.sh" <<'SH'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *) printf '%s\n' "$ZOIN_READ_TOKEN" ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/git-askpass-zoin.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/git-askpass-zoin.sh"
          export GIT_TERMINAL_PROMPT=0
          found=false
          for name in PRIVATE_REPO_TOKEN GH_TOKEN GH_RELEASE_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              echo "$name not configured"
              continue
            fi
            export ZOIN_READ_TOKEN="${!name}"
            rm -rf zoin
            if git -c credential.helper= clone --quiet --depth 1 --single-branch \
                --branch fix/internal-test-auth-short-invites-20261117 \
                https://github.com/perzis/zoin.git zoin; then
              found=true
              echo "Private Zoin checkout succeeded using $name"
              break
            fi
            echo "$name cannot access private Zoin; trying next"
          done
          unset ZOIN_READ_TOKEN
          rm -f "$RUNNER_TEMP/git-askpass-zoin.sh"
          if [[ "$found" != true ]]; then
            echo "::error::Provide a Playground token with private perzis/zoin Contents: Read."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Zoin API test dependencies
        run: python -m pip install -r zoin/backend/requirements-dev.txt

      - name: Test Zoin API auth and short invites
        env:
          ENVIRONMENT: testing
          PYTHONPATH: ${{ github.workspace }}/zoin/backend
        run: |
          python -m pytest -q \
            zoin/backend/tests/test_auth.py \
            zoin/backend/tests/test_firebase_auth.py \
            zoin/backend/tests/test_invite_preview.py \
            zoin/backend/tests/test_invites_security.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Install Flutter dependencies
        working-directory: zoin
        run: flutter pub get

      - name: Flutter analyzer
        working-directory: zoin
        run: flutter analyze

      - name: Flutter tests
        working-directory: zoin
        run: flutter test

      - name: Build release Android App Bundle
        working-directory: zoin
        run: flutter build appbundle --release --dart-define=USE_DEMO=false
