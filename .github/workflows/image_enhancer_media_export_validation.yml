name: Image Enhancer media export validation

on:
  push:
    paths:
      - '.github/workflows/image_enhancer_media_export_validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/image_enhancer
          ref: 1d63404b168d05d1e9c958285df5a2a6b9a5fb0e
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          path: image_enhancer
          fetch-depth: 1

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: image_enhancer
        run: flutter pub get

      - name: Run full app test suite
        working-directory: image_enhancer
        run: flutter test

      - name: Run super-resolution package tests
        working-directory: image_enhancer/flutter_super_resolution
        run: |
          flutter pub get
          flutter test

      - name: Analyze modified Dart files
        working-directory: image_enhancer
        run: dart analyze lib/services/image_export_service.dart lib/settings_provider.dart lib/super_resolution_home_page.dart

      - name: Compile Android debug APK
        working-directory: image_enhancer
        run: flutter build apk --debug --no-pub

      - name: Generate ephemeral release verification key
        working-directory: image_enhancer
        run: |
          keytool -genkeypair -noprompt -keystore android/app/validation-release.jks \
            -alias validation -keyalg RSA -keysize 2048 -validity 1 \
            -storepass validation123 -keypass validation123 \
            -dname "CN=Build verification, O=Local testing, C=AT"
          printf 'storeFile=validation-release.jks\\nstorePassword=validation123\\nkeyAlias=validation\\nkeyPassword=validation123\\n' > android/key.properties

      - name: Compile optimized release APK (R8)
        working-directory: image_enhancer
        run: flutter build apk --release --no-pub
