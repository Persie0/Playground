name: Gauss Circle — Six-Chapter Source Preflight (public runner)

on:
  push:
    branches:
      - ci/gauss-six-preflight-20261120
    paths:
      - .github/workflows/gauss-six-chapter-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gauss-six-chapter-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Pure-math, timing, syntax and Manim-import QA
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out PRIVATE source using public Playground runner only
        uses: actions/checkout@v4
        with:
          repository: Persie0/manimVideos
          ref: feature/gauss-circle-six-chapter-rebuild
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific and renderer dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg pkg-config libcairo2-dev libpango1.0-dev fonts-dejavu-core
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'manim>=0.19,<0.20' 'edge-tts>=7,<9'
      - name: Python AST and executable contract tests
        run: |
          set -euo pipefail
          cd source/gauss-circle-problem
          python -m compileall -q production/six_chapter_film.py production/narrate_six_chapter.py shared/six_chapter_math.py tests/test_six_chapter.py
          python -m unittest discover -s tests -p test_six_chapter.py -v
          python -m production.narrate_six_chapter --validate-script-only
      - name: Import single-scene film and preflight geometry
        run: |
          set -euo pipefail
          cd source/gauss-circle-problem
          python - <<'PY'
          from production.six_chapter_film import GaussCircleSixChapterFilm, DURATIONS, TOTAL_SECONDS, error_curve, shell_size
          assert sum(DURATIONS) == TOTAL_SECONDS == 685
          assert len(error_curve(25)) > 200
          assert shell_size(25) == 12
          print("Six-chapter Manim scene imported, true lattice graph available")
          PY
      - name: Install LaTeX tooling for true Manim composition
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm
      - name: Exercise all six chapter compositions at accelerated preview speed
        env:
          GAUSS_SMOKE_RENDER: '1'
        run: |
          set -euo pipefail
          cd source/gauss-circle-problem
          manim -ql -r 640,360 --fps 12 --disable_caching \
            production/six_chapter_film.py GaussCircleSixChapterFilm
          find media -name 'GaussCircleSixChapterFilm.mp4' -size +1k -print | grep .
      - name: Synthesize all connected narration beats and validate actual speech timings
        run: |
          set -euo pipefail
          cd source/gauss-circle-problem
          python -m production.narrate_six_chapter \
            --voice-only --output-dir ../../voice-only --voice en-US-AndrewNeural
          test -s ../../voice-only/Gauss_Circle_English_Neural_Voice.wav
          test -s ../../voice-only/Gauss_Circle_English_Subtitles.srt
          test -s ../../voice-only/Gauss_Circle_Six_Chapter_Audio_QA.json
          (cd ../../voice-only && sha256sum -c SHA256SUMS.txt)
      - name: Publish voice QA artifacts for review
        uses: actions/upload-artifact@v4
        with:
          name: gauss-circle-six-chapter-voice-qa
          path: |
            voice-only/Gauss_Circle_English_Neural_Voice.wav
            voice-only/Gauss_Circle_English_Subtitles.srt
            voice-only/Gauss_Circle_Narration_Cues.json
            voice-only/Gauss_Circle_Six_Chapter_Audio_QA.json
          if-no-files-found: error
          retention-days: 7
