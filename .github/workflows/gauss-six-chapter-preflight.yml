name: Gauss Circle — Six-Chapter Visual Smoke (public runner)

on:
  push:
    branches:
      - ci/gauss-six-preflight-20261120
    paths:
      - .github/workflows/gauss-six-chapter-preflight.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gauss-six-chapter-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Revised six-chapter math, original SFX and native Manim smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out PRIVATE source using public Playground runner only
        uses: actions/checkout@v4
        with:
          repository: Persie0/manimVideos
          ref: feature/gauss-circle-six-chapter-rebuild
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific and renderer dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg pkg-config libcairo2-dev libpango1.0-dev fonts-dejavu-core
          python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'manim>=0.19,<0.20' 'edge-tts>=7,<9' 'Pillow>=10,<13'
      - name: Python AST and executable contract tests
        run: |
          set -euo pipefail
          cd source/gauss-circle-problem
          python -m compileall -q production/six_chapter_film.py production/narrate_six_chapter.py production/narrate_kokoro.py production/six_chapter_sfx.py shared/six_chapter_math.py tests/test_six_chapter.py
          python -m unittest discover -s tests -p test_six_chapter.py -v
          python -m production.narrate_six_chapter --validate-script-only
          python -m production.narrate_kokoro --validate-script-only
          python -m production.six_chapter_sfx --check-only
      - name: Import single-scene film and preflight geometry
        run: |
          set -euo pipefail
          cd source/gauss-circle-problem
          python - <<'PY'
          from production.six_chapter_film import GaussCircleSixChapterFilm, DURATIONS, TOTAL_SECONDS, error_curve, shell_size
          assert sum(DURATIONS) == TOTAL_SECONDS == 685
          assert len(error_curve(25)) > 200
          assert shell_size(25) == 12
          print("Six-chapter Manim scene imported, true lattice graph available")
          PY
      - name: Install LaTeX tooling for true Manim composition
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-science dvisvgm
      - name: Exercise all six chapter compositions at accelerated preview speed
        env:
          GAUSS_SMOKE_RENDER: '1'
        run: |
          set -euo pipefail
          cd source/gauss-circle-problem
          timeout --signal=INT --kill-after=30s 10m manim -ql -r 640,360 --fps 12 --disable_caching \
            production/six_chapter_film.py GaussCircleSixChapterFilm
          find media -name 'GaussCircleSixChapterFilm.mp4' -size +1k -print | grep .
      - name: Verify native full 685s clock at low resolution before spending 1080p resources
        run: |
          set -euo pipefail
          cd source/gauss-circle-problem
          # IMPORTANT: no GAUSS_SMOKE_RENDER here: this is the complete movie
          # timeline at 10fps. Its 6,850 physical frames must be exact.
          timeout --signal=INT --kill-after=30s 19m manim -ql \
            -r 320,180 --fps 10 --disable_caching \
            production/six_chapter_film.py GaussCircleSixChapterFilm
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          paths=list(Path("media").rglob("GaussCircleSixChapterFilm.mp4"))
          matches=[]
          for p in paths:
              data=json.loads(subprocess.check_output([
                  "ffprobe","-v","error","-show_entries",
                  "stream=width,height,r_frame_rate,nb_frames:format=duration",
                  "-of","json",str(p)]))
              v=data["streams"][0]
              if (v["width"],v["height"])==(320,180):
                  matches.append((p,v,data["format"]))
          assert len(matches)==1,matches
          p,v,fmt=matches[0]
          assert v["r_frame_rate"]=="10/1",(p,v)
          assert int(v["nb_frames"])==6850,(p,v)
          assert abs(float(fmt["duration"])-685)<.1,(p,fmt)
          print("Native complete 685-second timeline: 6850 exact frames",p)
          PY
      - name: Publish six-chapter visual smoke video
        uses: actions/upload-artifact@v4
        with:
          name: gauss-six-chapter-visual-smoke-360p12
          path: source/gauss-circle-problem/media/videos/six_chapter_film/360p12/GaussCircleSixChapterFilm.mp4
          if-no-files-found: error
          retention-days: 7
