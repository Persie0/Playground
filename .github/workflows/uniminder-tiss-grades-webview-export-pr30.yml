name: Uniminder TISS grades WebView export PR30
on:
  push:
    paths:
      - '.github/workflows/uniminder-tiss-grades-webview-export-pr30.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout Uniminder grades fix
        uses: actions/checkout@v4
        with:
          repository: Persie0/student
          ref: fix/tiss-grades-webview-export-20261023
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: uniminder
      - name: Execute TISS export JavaScript regression suite
        working-directory: uniminder
        run: node test/js/tiss_certificate_export_test.cjs
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: uniminder
        run: flutter pub get
      - name: Analyze modified Dart sources
        working-directory: uniminder
        run: |
          flutter analyze --no-pub lib/services/certificates_service.dart \
            lib/services/tiss_certificate_page.dart \
            test/tiss_certificate_page_test.dart
      - name: Grades and login regression tests
        working-directory: uniminder
        run: |
          flutter test --no-pub test/tiss_certificate_page_test.dart \
            test/certificate_chart_safety_test.dart \
            test/tu_auth_logout_test.dart \
            test/tu_login_otp_script_test.dart
      - name: Android debug build
        working-directory: uniminder
        run: flutter build apk --debug --no-pub
