name: Flow Forge RevenueCat native SDK installation validation
# Validate corrected revenue_cat Android module path.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/flowforge-revenuecat-install.yml'

permissions:
  contents: read

jobs:
  validate-plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone private Flow Forge source
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Private repo access token missing'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth=1 --branch main https://github.com/Persie0/flowforge.git source
      - name: Install pinned Godotx RevenueCat 2.4.0 archive
        run: bash source/tools/install-revenuecat.sh
      - name: Verify Android and iOS native SDK payloads
        run: |
          set -euo pipefail
          test -f source/addons/godotx_revenue_cat/plugin.cfg
          find source/android -type f -name '*.aar' -print | head -10
          find source/ios -name '*.xcframework' -print | head -10
          test -n "$(find source/android -type f -name '*.aar' -print -quit)"
          test -n "$(find source/ios -name '*.xcframework' -print -quit)"