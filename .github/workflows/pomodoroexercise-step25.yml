name: FocusMove Step 25 performance migration security and platform validation
# Run 2: explicitly remove inherited plugin permissions, then audit merged release APK.

on:
  push:
    paths:
      - '.github/workflows/pomodoroexercise-step25.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focusmove-step25-security
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private branch in ephemeral runner only
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Missing private checkout token'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/25-performance-migration-security https://github.com/Persie0/pomodoroexercise.git source
      - name: Format Step 25 source and tests, resolve packages
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/src/features/pose/pose_frame_gate.dart lib/src/features/pose/pose_preview_screen.dart lib/src/features/pose/pose_lab_store.dart lib/src/features/settings/local_data_export.dart lib/src/screens/privacy_settings_screen.dart test/step25_security_performance_test.dart
      - name: Commit formatter changes back to private PR branch only
        working-directory: source
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'focusmove-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add lib test pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore: format Step 25 timer reliability changes'
            AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/25-performance-migration-security
          fi

  android-flutter:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private feature branch (not published)
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/25-performance-migration-security https://github.com/Persie0/pomodoroexercise.git source
      - name: Analyze and run full Flutter test suite
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test --reporter expanded
      - name: Build Android debug and release APKs (not published)
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Audit merged release Android permissions and backup flags
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump permissions "$APK" | tee "$RUNNER_TEMP/focusmove_permissions.txt"
          if grep -E 'android.permission.(INTERNET|RECORD_AUDIO|ACCESS_(FINE|COARSE|BACKGROUND)_LOCATION|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM)' "$RUNNER_TEMP/focusmove_permissions.txt"; then
            echo 'Unexpected privileged permission in merged release APK'
            exit 1
          fi
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/focusmove_manifest.txt"
          grep -E 'android:(allowBackup|dataExtractionRules|fullBackupContent)' "$RUNNER_TEMP/focusmove_manifest.txt"
          grep -q 'android:allowBackup' "$RUNNER_TEMP/focusmove_manifest.txt"
          grep -q 'android:dataExtractionRules' "$RUNNER_TEMP/focusmove_manifest.txt"

  ios-simulator:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private feature branch (not published)
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/25-performance-migration-security https://github.com/Persie0/pomodoroexercise.git source
      - name: Build unsigned iOS simulator (not published)
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter build ios --simulator --no-codesign
      - name: Verify ML Kit model resources are bundled
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APP=build/ios/iphonesimulator/Runner.app
          test -d "$APP"
          for name in MLKitPoseDetectionFastResources MLKitPoseDetectionCommonResources MLKitXenoResources; do
            test -d "$APP/$name.bundle" || { echo "Missing iOS resource bundle: $name"; exit 1; }
          done
