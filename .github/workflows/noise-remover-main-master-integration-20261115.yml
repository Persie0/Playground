name: Noise Remover main to master integration validation
on:
  push:
    branches: [ci/noise-main-merge-20261115]
    paths:
      - '.github/workflows/noise-remover-main-master-integration-20261115.yml'
permissions:
  contents: read
env:
  APP_REF: f2aea9811d8156aa340c761eb789f057f02e2ed7
jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check private access token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout exact integrated private revision
        uses: actions/checkout@v4
        with:
          repository: Persie0/noise_remover
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - name: Configure authenticated Git dependencies
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: git config --global url."https://x-access-token:${PRIVATE_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Generate localizations
        working-directory: app
        run: flutter gen-l10n
      - name: Analyze Dart code
        working-directory: app
        run: flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Run Flutter test suite
        working-directory: app
        run: flutter test --no-pub --reporter expanded

  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Check private access token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout exact integrated private revision
        uses: actions/checkout@v4
        with:
          repository: Persie0/noise_remover
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - name: Configure authenticated Git dependencies
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: git config --global url."https://x-access-token:${PRIVATE_TOKEN}@github.com/".insteadOf "https://github.com/"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Prepare Flutter plugins
        working-directory: app
        run: |
          flutter --version
          xcodebuild -version
          flutter pub get
          flutter gen-l10n
      - name: CocoaPods installation
        working-directory: app/ios
        run: pod install --repo-update
      - name: Unsigned iOS simulator build
        working-directory: app
        run: flutter build ios --simulator --no-codesign --debug
