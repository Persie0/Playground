name: Resistor YOLOX model

on:
  workflow_dispatch:
    inputs:
      ref:
        description: resistor_scanner branch/tag/SHA
        required: true
        default: agent/yolox-resistor-model
        type: string
      mode:
        description: unit, smoke, or full
        required: true
        default: unit
        type: choice
        options: [unit, smoke, full]
      target:
        description: pytest target used by unit mode
        required: false
        default: ml/resistor_model/tests
        type: string
  push:
    branches: [agent/resistor-yolox-runner]
    paths:
      - .github/triggers/resistor-yolox-run.txt
      - .github/workflows/resistor-yolox-model.yml

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/resistor_scanner

jobs:
  resistor-yolox:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout Playground runner
        uses: actions/checkout@v5

      - name: Resolve requested ref and mode
        shell: bash
        env:
          DISPATCH_REF: ${{ inputs.ref }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          ref="${DISPATCH_REF:-agent/yolox-resistor-model}"
          mode="${DISPATCH_MODE:-unit}"
          target="${DISPATCH_TARGET:-ml/resistor_model/tests}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            trigger=.github/triggers/resistor-yolox-run.txt
            ref="$(sed -n 's/^ref=//p' "$trigger" | tail -n1)"
            mode="$(sed -n 's/^mode=//p' "$trigger" | tail -n1)"
            target="$(sed -n 's/^target=//p' "$trigger" | tail -n1)"
            ref="${ref:-agent/yolox-resistor-model}"
            mode="${mode:-unit}"
            target="${target:-ml/resistor_model/tests}"
          fi
          case "$mode" in unit|smoke|full) ;; *) echo "invalid mode: $mode" >&2; exit 2 ;; esac
          printf 'APP_REF=%s\nMODE=%s\nTEST_TARGET=%s\n' "$ref" "$mode" "$target" >> "$GITHUB_ENV"

      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout resistor_scanner model package only
        if: env.MODE == 'unit'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app
          sparse-checkout: |
            ml/resistor_model
            .github/playground
          sparse-checkout-cone-mode: true

      - name: Checkout complete resistor_scanner for smoke/full
        if: env.MODE == 'smoke' || env.MODE == 'full'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            app/ml/resistor_model/pyproject.toml
            app/ml/resistor_model/requirements-training.txt

      - name: Install unit-test bootstrap dependencies
        run: python -m pip install --upgrade pip pytest numpy opencv-python-headless==4.10.0.84 cryptography==50.0.2

      - name: Run focused RED/GREEN unit target
        if: env.MODE == 'unit'
        env:
          PYTHONPATH: app/ml/resistor_model/src
        run: python -m pytest "app/${TEST_TARGET}" -v

      - name: Confirm fixed r1 release datasets
        if: env.MODE == 'smoke' || env.MODE == 'full'
        env:
          PYTHONPATH: app/ml/resistor_model/src
        shell: bash
        run: |
          python - <<'PY'
          from resistor_model.release_dataset import RELEASE_ASSETS
          if len(RELEASE_ASSETS) != 3:
              raise SystemExit(f'expected 3 release assets, found {len(RELEASE_ASSETS)}')
          for asset in RELEASE_ASSETS:
              print('R1_DATASET', asset.name, asset.sha256, asset.url)
          PY

      - name: Run model pipeline
        if: env.MODE == 'smoke' || env.MODE == 'full'
        run: bash app/.github/playground/resistor-yolox-model.sh app "$MODE"

      - name: Assert artifacts contain no raw dataset payloads
        if: (env.MODE == 'smoke' || env.MODE == 'full') && always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d app/ml/resistor_model/artifacts ]]; then
            if find app/ml/resistor_model/artifacts -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*annotations*.json' \) | grep -q .; then
              echo 'raw dataset payload found in artifact directory' >&2
              exit 1
            fi
          fi

      - name: Upload smoke/full outputs
        if: (env.MODE == 'smoke' || env.MODE == 'full') && always()
        uses: actions/upload-artifact@v4
        with:
          name: resistor-yolox-${{ env.MODE }}-${{ github.run_id }}
          path: app/ml/resistor_model/artifacts
          if-no-files-found: warn
          retention-days: 30

      - name: Commit finalized full result to resistor_scanner
        if: env.MODE == 'full'
        shell: bash
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          cd app
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/model_reports
          git add pubspec.yaml lib/provider/settings_provider.dart
          git add test/services/model_asset_integrity_test.dart test/provider/settings_model_test.dart
          if [[ -f assets/model_yolox_v1.tflite.enc ]]; then
            git add assets/model_yolox_v1.tflite.enc
          fi
          if git diff --cached --quiet; then
            echo "No finalized model/report changes to commit"
            exit 0
          fi
          git commit -m "model: record full YOLOX resistor comparison"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin "HEAD:refs/heads/$APP_REF"
