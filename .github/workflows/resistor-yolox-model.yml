name: Resistor YOLOX model

on:
  workflow_dispatch:
    inputs:
      ref:
        description: resistor_scanner branch/tag/SHA
        required: true
        default: agent/yolox-resistor-model
        type: string
      mode:
        description: unit, smoke, or full
        required: true
        default: unit
        type: choice
        options: [unit, smoke, full]
      target:
        description: pytest target used by unit mode
        required: false
        default: ml/resistor_model/tests
        type: string
  push:
    branches: [agent/resistor-yolox-runner]
    paths:
      - .github/triggers/resistor-yolox-run.txt
      - .github/workflows/resistor-yolox-model.yml

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/resistor_scanner

jobs:
  resistor-yolox:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout Playground runner
        uses: actions/checkout@v5

      - name: Resolve requested ref and mode
        shell: bash
        env:
          DISPATCH_REF: ${{ inputs.ref }}
          DISPATCH_MODE: ${{ inputs.mode }}
          DISPATCH_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          ref="${DISPATCH_REF:-agent/yolox-resistor-model}"
          mode="${DISPATCH_MODE:-unit}"
          target="${DISPATCH_TARGET:-ml/resistor_model/tests}"
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            trigger=.github/triggers/resistor-yolox-run.txt
            ref="$(sed -n 's/^ref=//p' "$trigger" | tail -n1)"
            mode="$(sed -n 's/^mode=//p' "$trigger" | tail -n1)"
            target="$(sed -n 's/^target=//p' "$trigger" | tail -n1)"
            ref="${ref:-agent/yolox-resistor-model}"
            mode="${mode:-unit}"
            target="${target:-ml/resistor_model/tests}"
          fi
          case "$mode" in unit|smoke|full) ;; *) echo "invalid mode: $mode" >&2; exit 2 ;; esac
          printf 'APP_REF=%s\nMODE=%s\nTEST_TARGET=%s\n' "$ref" "$mode" "$target" >> "$GITHUB_ENV"

      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout resistor_scanner
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            app/ml/resistor_model/pyproject.toml
            app/ml/resistor_model/requirements-training.txt

      - name: Install unit-test bootstrap dependencies
        run: python -m pip install --upgrade pip pytest numpy

      - name: Run focused RED/GREEN unit target
        if: env.MODE == 'unit'
        env:
          PYTHONPATH: app/ml/resistor_model/src
        run: python -m pytest "app/${TEST_TARGET}" -v

      - name: Diagnose private dataset taxonomy
        if: env.MODE == 'smoke' || env.MODE == 'full'
        shell: bash
        run: |
          python - <<'PY'
          import json
          import statistics
          import zipfile
          from collections import Counter, defaultdict
          from pathlib import Path

          archive = Path('app/rres.v4i.coco.zip')
          with zipfile.ZipFile(archive) as zf:
              annotation_names = [
                  name for name in zf.namelist()
                  if name.endswith('_annotations.coco.json') and '/train/' in f'/{name}'
              ]
              if len(annotation_names) != 1:
                  raise SystemExit(f'expected one train annotation json, found {annotation_names}')
              payload = json.loads(zf.read(annotation_names[0]))

          names = {int(c['id']): str(c['name']) for c in payload['categories']}
          images = {int(i['id']): i for i in payload['images']}
          counts = Counter()
          image_classes = defaultdict(set)
          areas = defaultdict(list)
          aspects = defaultdict(list)
          for ann in payload['annotations']:
              cls = names[int(ann['category_id'])]
              image = images[int(ann['image_id'])]
              x, y, w, h = map(float, ann['bbox'])
              counts[cls] += 1
              image_classes[int(ann['image_id'])].add(cls)
              denom = float(image['width']) * float(image['height'])
              if denom > 0 and w > 0 and h > 0:
                  areas[cls].append((w * h) / denom)
                  aspects[cls].append(max(w / h, h / w))

          color_names = {
              'black','blue','brown','gold','green','grey','orange','red','violet','white','yellow'
          }
          for cls in sorted(counts):
              class_images = [iid for iid, classes in image_classes.items() if cls in classes]
              with_colors = sum(bool(image_classes[iid] & color_names) for iid in class_images)
              print(
                  'DATASET_CLASS',
                  json.dumps({
                      'name': cls,
                      'annotations': counts[cls],
                      'images': len(class_images),
                      'image_color_cooccurrence_fraction': round(with_colors / len(class_images), 4) if class_images else 0.0,
                      'median_normalized_area': round(statistics.median(areas[cls]), 6) if areas[cls] else None,
                      'median_long_short_aspect': round(statistics.median(aspects[cls]), 4) if aspects[cls] else None,
                  }, sort_keys=True),
              )
          PY

      - name: Run model pipeline
        if: env.MODE == 'smoke' || env.MODE == 'full'
        run: bash app/.github/playground/resistor-yolox-model.sh app "$MODE"

      - name: Assert artifacts contain no raw dataset payloads
        if: (env.MODE == 'smoke' || env.MODE == 'full') && always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d app/ml/resistor_model/artifacts ]]; then
            if find app/ml/resistor_model/artifacts -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*annotations*.json' \) | grep -q .; then
              echo 'raw dataset payload found in artifact directory' >&2
              exit 1
            fi
          fi

      - name: Upload smoke/full outputs
        if: (env.MODE == 'smoke' || env.MODE == 'full') && always()
        uses: actions/upload-artifact@v4
        with:
          name: resistor-yolox-${{ env.MODE }}-${{ github.run_id }}
          path: app/ml/resistor_model/artifacts
          if-no-files-found: warn
          retention-days: 30
