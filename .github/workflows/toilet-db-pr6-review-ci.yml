name: ToiletCompass encrypted publisher PR6 validation
on:
  push:
    branches:
      - feat/toilet-db-encryption-publisher
    paths:
      - .github/workflows/toiletcompass-monthly-databases.yml
      - .github/workflows/toilet-db-pr6-review-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: public
      - uses: actions/checkout@v4
        with:
          repository: Persie0/toiletcompass
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - name: Install test dependencies
        run: python3 -m pip install cryptography==46.0.4 PyYAML

      - name: Verify monthly publisher activation and staging contracts
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import tempfile
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path("public/.github/workflows/toiletcompass-monthly-databases.yml").read_text())
          triggers = workflow.get("on", workflow.get(True))
          assert triggers['schedule'] == [{'cron': '17 3 1 * *'}], triggers
          assert set(triggers) == {'schedule', 'workflow_dispatch'}
          steps = workflow['jobs']['build']['steps']
          names = [step.get("name", "") for step in steps]

          def step(name):
              return steps[names.index(name)]

          decide = step('Decide full build')['run']
          scenarios = [
              ('schedule', 'false', '', 'false'),
              ('schedule', 'false', 'true', 'true'),
              ('workflow_dispatch', 'true', '', 'false'),
              ('workflow_dispatch', 'false', 'true', 'false'),
              ('workflow_dispatch', 'true', 'true', 'true'),
          ]
          for event, full, flag, expected in scenarios:
              # Construct tokens without an Actions expression.
              event_token = chr(36) + '{{ github.event_name }}'
              build_token = chr(36) + '{{ inputs.full_build }}'
              script = decide.replace(event_token, event).replace(
                  build_token, full)
              with tempfile.TemporaryDirectory() as directory:
                  output = Path(directory) / 'output'
                  env = dict(os.environ,
                      ENABLE_ENCRYPTED_DB_PUBLISHING=flag,
                      GITHUB_OUTPUT=str(output))
                  result = subprocess.run(['bash', '-e'], input=script, text=True,
                                          capture_output=True, env=env, check=True)
                  assert output.read_text().strip() == f'enabled={expected}', (
                      event, full, flag, result.stdout)
          assert names.index('Upload encrypted database release as a draft') < names.index(
              'Verify uploaded draft before publishing') < names.index(
              'Publish verified encrypted release')
          upload = step('Upload encrypted database release as a draft')['run']
          verify = step('Verify uploaded draft before publishing')['run']
          publish = step('Publish verified encrypted release')['run']
          assert '--draft' in upload
          assert 'release/countries/*.db.enc' in upload
          assert 'release/continents/*.db.enc' in upload
          assert "assert len(expected) == 259" in verify
          assert 'assert published == expected' in verify
          assert '--draft=false' in publish and '--latest' in publish
          assert "test -z" in step('Build all country and continent databases sequentially')['run']
          assert "TOILET_DB_KEY_B64" in str(step('Gate encrypted database publication'))
          print('Monthly schedule, encrypted-only publishing, and staged release contracts verified')
          PY

      - name: Run database Python tests
        working-directory: app
        run: python3 -m unittest discover -s database/tests -v

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Analyze app
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test app
        working-directory: app
        run: flutter test
