name: Toilet database outage fallback validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toilet-db-fallback-validation.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/toiletcompass
          ref: fix/toilet-db-outage-fallback
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app
      - name: Python encryption and pipeline suite
        working-directory: app
        run: |
          python3 -m pip install cryptography==46.0.4
          python3 -m unittest discover -s database/tests -v
      - name: Live verified MP recovery from published release
        working-directory: app
        run: |
          python3 - <<'PY'
          import sys
          import tempfile
          from pathlib import Path
          sys.path.insert(0, 'database')
          from previous_release_fallback import PreviousReleaseFallback
          from toilet_pipeline import validate_app_db
          with tempfile.TemporaryDirectory() as scratch:
              target = Path(scratch) / 'MP.db'
              recovered = PreviousReleaseFallback().recover('MP', target)
              details = validate_app_db(target)
              print('Verified fallback from', recovered['version'], 'MP rows:', details['rows'])
          PY

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter analyzer and tests
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
