name: FocusMove Step 16 final-head Dart validation
# Recheck with corrected upward lazy-list scrolling fixture.
on:
  push:
    paths:
      - '.github/workflows/pomodoroexercise-pose-lab-step16-head.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Clone latest private Pose Lab PR branch
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/16-debug-pose-lab https://github.com/Persie0/pomodoroexercise.git source
      - name: Dart analyzer and full Flutter tests (no artifact uploads)
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test --reporter expanded
