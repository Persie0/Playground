name: Photosphere checkpoint305 sampler retries and RNG boundary
on:
  push:
    branches: [research/photosphere-checkpoint305-ransac-retry]
    paths: ['.github/workflows/photosphere-checkpoint305-ransac-retry.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint305-ransac-retry
  cancel-in-progress: true
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Install original ARM64 analysis tools
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools unicorn
      - name: Download and pin source ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Audit complete original RANSAC sample rejection and nearby RNG callsites
        run: |
          python3 - <<'PY' | tee checkpoint305-original-sampler-boundary.log
          import hashlib
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          b=Path('original.so').read_bytes()
          assert hashlib.sha256(b).hexdigest()=='878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1'
          for name,lo,hi in [('sample-loop',0x30fd18,0x30fe70),('trial-loop-terminator',0x3103bc,0x31044c),('other-rand',0x31391c,0x313984),('seed-wrapper',0x2d80d8,0x2d80f8)]:
            print('CHECKPOINT305_WINDOW_START',name)
            for i in Cs(CS_ARCH_ARM64,CS_MODE_ARM).disasm(b[lo:hi],lo):
              print(f'{i.address:#010x} {i.mnemonic:8} {i.op_str}')
            print('CHECKPOINT305_WINDOW_END',name)
          print('CHECKPOINT305_ORIGINAL_SAMPLER_DISASM_PASSED')
          PY
      - name: Checkout exact native RANSAC research and harness
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: fd4359c380f1f0e4c69f4d6e499b4873efa7d691
          path: native-research
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Execute real original ARM64 50-retry exhaustion in full 550-trial path
        run: |
          set -euo pipefail
          test "$(git -C native-research rev-parse HEAD)" = fd4359c380f1f0e4c69f4d6e499b4873efa7d691
          mkdir -p native-research/research/native
          cp original.so native-research/research/native/liblightcycle.so
          if ! (cd native-research && python3 research/photosphere/checkpoint305/native_original_ransac_retry.py) > checkpoint305-ransac-native.log 2> checkpoint305-ransac-native.err; then
            echo 'CHECKPOINT305_NATIVE_ORIGINAL_FAILED'
            tail -n 100 checkpoint305-ransac-native.err
            tail -n 40 checkpoint305-ransac-native.log
            exit 1
          fi
          cat checkpoint305-ransac-native.log
          cp native-research/checkpoint305-original-ransac-retry.json checkpoint305-original-ransac-retry.json
          grep -q '^CHECKPOINT305_ORIGINAL_50_RETRY_550_TRIALS_PASS' checkpoint305-ransac-native.log
      - name: Independently verify original native RNG consumers and signed sampler retry instructions
        run: |
          set -euo pipefail
          python3 native-research/research/photosphere/checkpoint305/verify_original_rng_consumers.py original.so --output checkpoint305-original-rng-consumers.json | tee checkpoint305-original-rng-consumers.log
          grep -q '^CHECKPOINT305_ORIGINAL_RNG_OWNERS_VERIFIED' checkpoint305-original-rng-consumers.log
      - name: Checkout exact PhotosphereCleanroom checkpoint305 Rust regression
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: d4d628de15eddf5855accb25324825206b48fdbe
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Match original full native source fixture and run production Rust RANSAC replay
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = d4d628de15eddf5855accb25324825206b48fdbe
          python3 - <<'PY'
          import json
          from pathlib import Path
          original=json.loads(Path('checkpoint305-original-ransac-retry.json').read_text())
          fixture=json.loads(Path('app/tests/fixtures/native_original_ransac_retry_305.json').read_text())
          original.pop('original_selected_pairs')
          original.pop('original_draw_counts_after_each_pair')
          assert original==fixture,"new original-source measurement differs from Rust fixture"
          assert original['original_second_trial_attempts']==50
          assert original['original_rand_draws_consumed']==1198
          print('CHECKPOINT305_FRESH_ORIGINAL_RUST_FIXTURE_EQUAL',len(fixture))
          PY
          cd app
          git diff --check
          rustfmt --edition 2021 --check src/alignment_checkpoint305_retry_test.rs
          cargo test --lib checkpoint305_ -- --nocapture
          cargo test --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint305-original-ransac-evidence
          path: |
            checkpoint305-original-sampler-boundary.log
            checkpoint305-ransac-native.log
            checkpoint305-ransac-native.err
            checkpoint305-original-ransac-retry.json
            checkpoint305-original-rng-consumers.json
            checkpoint305-original-rng-consumers.log
          retention-days: 14
