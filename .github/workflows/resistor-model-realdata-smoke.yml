name: Validate resistor model on real dataset

on:
  push:
    branches: [resistor-dataset-train]
    paths:
      - .github/workflows/resistor-model-realdata-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Checkout resistor_model training branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/resistor_model
          ref: feat/training-stack
          path: resistor_model
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: resistor_model/pyproject.toml

      - name: Install training and export stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './resistor_model[dev,export]'

      - name: Download private annotated dataset
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_TOKEN"
          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $PRIVATE_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/Persie0/resistor_scanner/contents/rres.v4i.yolov8.zip?ref=tflite" \
            -o /tmp/rres-yolo.zip
          mkdir -p /tmp/rres
          unzip -q /tmp/rres-yolo.zip -d /tmp/rres

      - name: Run full unit suite and compile check
        working-directory: resistor_model
        run: |
          pytest -q
          python -m compileall -q src

      - name: Import and audit real annotations
        run: |
          set -euo pipefail
          python -m resistor_model.tools.import_roboflow_yolo \
            --root /tmp/rres \
            --output /tmp/rres/manifest.jsonl \
            --min-bands 3 \
            --max-bands 6 | tee /tmp/import-report.json
          python -m resistor_model.tools.audit_dataset \
            --manifest /tmp/rres/manifest.jsonl \
            --image-root /tmp/rres | tee /tmp/audit-report.json
          python -m resistor_model.tools.make_splits \
            --manifest /tmp/rres/manifest.jsonl \
            --output /tmp/rres/splits.json \
            --ratios 0.70 0.15 0.15 \
            --seed 42 \
            --group-session

      - name: Audit orientation supervision
        run: |
          python - <<'PY' | tee /tmp/geometry-report.json
          import json, math
          from pathlib import Path
          import numpy as np

          rows = [json.loads(x) for x in Path('/tmp/rres/manifest.jsonl').read_text().splitlines() if x.strip()]
          box_diffs, polygon_diffs = [], []

          def axis(points):
              p = np.asarray(points, dtype=np.float64)
              p = p - p.mean(axis=0, keepdims=True)
              _, _, vt = np.linalg.svd(p, full_matrices=False)
              u = vt[0]
              return u / max(np.linalg.norm(u), 1e-12)

          def diff_deg(a, b):
              return math.degrees(math.acos(float(np.clip(abs(np.dot(a, b)), 0.0, 1.0))))

          for row in rows:
              for r in row['resistors']:
                  centers = [[(b['bbox'][0] + b['bbox'][2]) * 0.5, (b['bbox'][1] + b['bbox'][3]) * 0.5] for b in r['bands']]
                  if len(centers) < 2:
                      continue
                  band_axis = axis(centers)
                  if r.get('body_annotation_type') == 'polygon' and r.get('polygon'):
                      polygon_diffs.append(diff_deg(axis(r['polygon']), band_axis))
                  elif r.get('bbox'):
                      x1, y1, x2, y2 = r['bbox']
                      box_axis = np.array([1.0, 0.0]) if (x2-x1) >= (y2-y1) else np.array([0.0, 1.0])
                      box_diffs.append(diff_deg(box_axis, band_axis))

          def summary(values):
              a = np.asarray(values, dtype=np.float64)
              if not len(a): return {'n': 0}
              return {
                  'n': int(len(a)),
                  'median_deg': float(np.median(a)),
                  'p90_deg': float(np.quantile(a, .90)),
                  'p95_deg': float(np.quantile(a, .95)),
                  'max_deg': float(a.max()),
                  'fraction_gt_10deg': float(np.mean(a > 10)),
                  'fraction_gt_20deg': float(np.mean(a > 20)),
                  'fraction_gt_30deg': float(np.mean(a > 30)),
              }
          print(json.dumps({'box_axis_vs_band_pca': summary(box_diffs), 'polygon_axis_vs_band_pca': summary(polygon_diffs)}, indent=2, sort_keys=True))
          PY

      - name: Verify split isolation and coverage
        run: |
          python - <<'PY' | tee /tmp/split-report.json
          from collections import Counter, defaultdict
          import json
          from pathlib import Path

          rows = [json.loads(x) for x in Path('/tmp/rres/manifest.jsonl').read_text().splitlines() if x.strip()]
          splits = json.loads(Path('/tmp/rres/splits.json').read_text())
          id_to_split = {}
          for split, ids in splits.items():
              for rid in ids:
                  if rid in id_to_split:
                      raise AssertionError(f'resistor id appears in multiple splits: {rid}')
                  id_to_split[rid] = split

          session_splits = defaultdict(set)
          report = {s: {'resistor_ids': len(splits[s]), 'samples': 0, 'sessions': set(), 'colors': Counter(), 'band_counts': Counter()} for s in ('train','val','test')}
          for row in rows:
              for resistor in row['resistors']:
                  split = id_to_split.get(resistor['id'])
                  if split is None:
                      raise AssertionError(f'missing split for {resistor["id"]}')
                  report[split]['samples'] += 1
                  if row.get('session_id'):
                      session_splits[row['session_id']].add(split)
                      report[split]['sessions'].add(row['session_id'])
                  report[split]['band_counts'][len(resistor['bands'])] += 1
                  report[split]['colors'].update(b['color'] for b in resistor['bands'])

          leaked = {k: sorted(v) for k, v in session_splits.items() if len(v) > 1}
          if leaked:
              raise AssertionError(f'session/capture-group leakage: {list(leaked.items())[:10]}')
          for split in ('train','val','test'):
              if report[split]['samples'] == 0:
                  raise AssertionError(f'empty {split} split')
              missing_common = [c for c in ('black','brown','red','orange','yellow','green','blue','violet','gray','gold') if report[split]['colors'][c] == 0]
              if missing_common:
                  raise AssertionError(f'{split} missing common colors: {missing_common}')

          serializable = {}
          for split, r in report.items():
              serializable[split] = {
                  'resistor_ids': r['resistor_ids'],
                  'samples': r['samples'],
                  'sessions': len(r['sessions']),
                  'colors': dict(sorted(r['colors'].items())),
                  'band_counts': {str(k): v for k, v in sorted(r['band_counts'].items())},
              }
          print(json.dumps(serializable, indent=2, sort_keys=True))
          PY

      - name: Create real-data smoke config
        run: |
          python - <<'PY'
          import yaml
          cfg = {
              'seed': 42,
              'data': {
                  'manifest': '/tmp/rres/manifest.jsonl',
                  'image_root': '/tmp/rres',
                  'splits_file': '/tmp/rres/splits.json',
                  'output_size': [96, 512],
                  'sequence_bins': 192,
                  'num_workers': 2,
                  'group_session': True,
              },
              'model': {
                  'num_colors': 12,
                  'max_bands': 6,
                  'base_channels': 24,
                  'd_model': 128,
                  'transformer_layers': 2,
                  'transformer_heads': 4,
                  'slot_decoder_layers': 1,
                  'dropout': 0.10,
                  'use_chromatic_branch': True,
              },
              'train': {
                  'epochs': 1,
                  'batch_size': 8,
                  'lr': 3e-4,
                  'weight_decay': 0.05,
                  'warmup_epochs': 0,
                  'grad_clip': 1.0,
                  'amp': False,
                  'ema_decay': 0.999,
                  'output_dir': '/tmp/runs/rres-v4-smoke',
                  'resume': None,
              },
              'loss': {
                  'dense': 1.0, 'color': 2.0, 'exist': 0.5, 'center': 1.0,
                  'width': 0.5, 'order': 0.2, 'count': 0.2,
                  'consistency': 0.1, 'body_class_weight': 0.25,
              },
          }
          with open('/tmp/rres-smoke.yaml', 'w') as f:
              yaml.safe_dump(cfg, f, sort_keys=False)
          PY

      - name: Train one real batch and validate one real batch
        run: |
          python -m resistor_model.train --config /tmp/rres-smoke.yaml --smoke
          ls -lh /tmp/runs/rres-v4-smoke
          cat /tmp/runs/rres-v4-smoke/metrics.jsonl

      - name: Exercise evaluator and ONNX export
        run: |
          set -euo pipefail
          python -m resistor_model.evaluate \
            --checkpoint /tmp/runs/rres-v4-smoke/best.pt \
            --manifest /tmp/rres/manifest.jsonl \
            --image-root /tmp/rres \
            --split test \
            --batch-size 16 | tee /tmp/evaluate-report.txt
          resistor-export \
            --checkpoint /tmp/runs/rres-v4-smoke/best.pt \
            --output /tmp/runs/rres-v4-smoke/resistor_bandnet.onnx
          test -s /tmp/runs/rres-v4-smoke/resistor_bandnet.onnx
          test -s /tmp/runs/rres-v4-smoke/resistor_bandnet.onnx.json
          ls -lh /tmp/runs/rres-v4-smoke/resistor_bandnet.onnx*

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resistor-realdata-smoke-${{ github.run_id }}
          path: |
            /tmp/import-report.json
            /tmp/audit-report.json
            /tmp/geometry-report.json
            /tmp/split-report.json
            /tmp/evaluate-report.txt
            /tmp/rres/splits.json
            /tmp/runs/rres-v4-smoke/metrics.jsonl
            /tmp/runs/rres-v4-smoke/resistor_bandnet.onnx
            /tmp/runs/rres-v4-smoke/resistor_bandnet.onnx.json
          if-no-files-found: warn
          retention-days: 7
