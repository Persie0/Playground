name: Photosphere checkpoint352 original provider getter through solver BLR
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint352-source.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint352-source
  cancel-in-progress: false
jobs:
  native-original-getter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Read-only exact original research SHA
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: ea1d0dae26775c804b4a7e2f7681daf6a04bb407
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify exact SHA and install ARM64 emulator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ea1d0dae26775c804b4a7e2f7681daf6a04bb407"
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint352/native_original_provider_getter_join.py research/photosphere/checkpoint352/native_original_provider_getter_boundary.py research/photosphere/checkpoint352/trace_original_child_pointer_origin.py
      - name: Get original Google Camera ELF checksum verified
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Source execute original provider getter real ARM64 on 15 original graph cases
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint352/native_original_provider_getter_join.py original.so --output checkpoint352-source.json | tee checkpoint352-source.log
          grep -q '^CHECKPOINT352_REAL_PROVIDER_GETTER_SOURCE_PASS 15 104$' checkpoint352-source.log
      - name: Source execute genuine getter negative and out-of-range index branches
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint352/native_original_provider_getter_boundary.py original.so --output checkpoint352-boundary.json | tee checkpoint352-boundary.log
          grep -q '^CHECKPOINT352_BOUNDARY_GETTER_SOURCE_PASS ' checkpoint352-boundary.log
      - name: Verify source-original provider constructor copies existing runtime child pointers
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint352/trace_original_child_pointer_origin.py original.so --output checkpoint352-child-provenance.json | tee checkpoint352-child-provenance.log
          grep -q '^CHECKPOINT352_ORIGINAL_CHILD_POINTER_COPY_PROVENANCE_PASS 18 2$' checkpoint352-child-provenance.log
      - name: Upload only result JSON and diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-checkpoint352-source
          path: |
            checkpoint352-source.json
            checkpoint352-source.log
            checkpoint352-boundary.json
            checkpoint352-boundary.log
            checkpoint352-child-provenance.json
            checkpoint352-child-provenance.log
          if-no-files-found: warn
          retention-days: 7
