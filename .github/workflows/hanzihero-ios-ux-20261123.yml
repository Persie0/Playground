name: HanziHero native iPhone and iPad UX screenshots

on:
  push:
    branches:
      - impeccable/hanzihero-ui-ci-20261122
    paths:
      - .github/workflows/hanzihero-ios-ux-20261123.yml
      - hanzihero-impeccable-ui/capture-ios.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-native-screenshots:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private HanziHero UX feature branch
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$TOKEN" | base64)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=impeccable/hanzihero-ux-40-20261122 https://github.com/Persie0/hanzi_hero.git app

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve CocoaPods native dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter pub get
          cd ios
          # The checked-in pod lockfile pins PurchasesHybridCommon 19.2.0,
          # while purchases_flutter 10.14.0 requires 19.5.0.
          pod update PurchasesHybridCommon --repo-update > /tmp/hanzi-pods.log 2>&1 || { tail -n 95 /tmp/hanzi-pods.log; exit 1; }

      - name: Build native iOS Simulator app without signing
        shell: bash
        run: |
          set -euo pipefail
          cd app
          flutter build ios --simulator --debug --no-codesign > /tmp/hanzi-ios-build.log 2>&1 || { tail -n 110 /tmp/hanzi-ios-build.log; exit 1; }
          echo "iOS simulator app built"

      - name: Commit regenerated CocoaPods lockfile to UX feature branch
        shell: bash
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          cd app
          if git diff --quiet -- ios/Podfile.lock; then
            echo 'Podfile.lock already synchronized'
            exit 0
          fi
          test -n "$TOKEN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/Podfile.lock
          git commit -m "fix(ios): synchronize RevenueCat CocoaPods dependencies with purchases_flutter"
          AUTH="$(printf 'x-access-token:%s' "$TOKEN" | base64 | tr -d '\\r\\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" fetch origin impeccable/hanzihero-ux-40-20261122
          git rebase FETCH_HEAD
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/impeccable/hanzihero-ux-40-20261122

      - name: Capture iPhone and iPad interface in light and dark appearance
        shell: bash
        run: bash hanzihero-impeccable-ui/capture-ios.sh

      - name: Upload iOS native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanzihero-ios-native-ux
          path: ux-ios-screenshots/
          if-no-files-found: warn
          retention-days: 7
