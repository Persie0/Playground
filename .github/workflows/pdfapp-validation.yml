name: PDF Studio Flutter validation
# Verify native signature stamping, unlock and DOCX export regression tests.
on:
  push:
    paths:
      - .github/workflows/pdfapp-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-studio-checks
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private PDF Studio
        uses: actions/checkout@v4
        with:
          repository: Persie0/pdfapp
          ref: feature/flutter-pdf-studio
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Android debug APK (manual workflow only)
        if: github.event_name == 'workflow_dispatch'
        run: flutter build apk --debug
      - name: Upload APK (manual workflow only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pdf-studio-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
