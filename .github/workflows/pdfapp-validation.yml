name: PDF Studio Flutter validation
on:
  push:
    paths:
      - .github/workflows/pdfapp-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private PDF Studio source
        uses: actions/checkout@v4
        with:
          repository: Persie0/pdfapp
          ref: feature/flutter-pdf-studio
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Bootstrap and validate
        run: bash tool/bootstrap.sh
