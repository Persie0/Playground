name: PDF Studio Flutter validation
# Validation rerun after PDF app analyzer fixes and scanner bridge.
on:
  push:
    paths:
      - .github/workflows/pdfapp-validation.yml
  workflow_dispatch:

concurrency:
  group: pdfapp-validation-runners
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private PDF Studio source
        uses: actions/checkout@v4
        with:
          repository: Persie0/pdfapp
          ref: feature/flutter-pdf-studio
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Bootstrap and validate
        run: bash tool/bootstrap.sh
      - name: Build Android debug APK
        run: flutter build apk --debug
      - name: Upload Android debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-studio-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      - name: Commit generated Flutter runners to pdfapp feature branch
        env:
          PUSH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git add -A android ios pubspec.lock
          if git diff --cached --quiet; then
            echo "Runner files already committed"
            exit 0
          fi
          git config user.name "Persie0 Playground CI"
          git config user.email "76871553+Persie0@users.noreply.github.com"
          git commit -m "chore: commit generated Flutter Android and iOS runners"
          git fetch "https://x-access-token:$PUSH_TOKEN@github.com/Persie0/pdfapp.git" feature/flutter-pdf-studio
          git rebase FETCH_HEAD
          GIT_TERMINAL_PROMPT=0 git push \
            "https://x-access-token:$PUSH_TOKEN@github.com/Persie0/pdfapp.git" \
            HEAD:refs/heads/feature/flutter-pdf-studio
