name: ToiletCompass country DB pilot

on:
  push:
    branches: [toiletcompass-country-pilot-run]
    paths:
      - '.github/workflows/toiletcompass-country-db-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout ToiletCompass feature branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/toiletcompass
          ref: feat/monthly-country-database-pipeline-pilot2
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: toiletcompass

      - name: Run all database pipeline tests
        working-directory: toiletcompass
        run: python3 -m unittest discover -s database/tests -v

      - name: Install OSM tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool
          osmium --version

      - name: Build Austria and Slovenia via monthly streaming path
        working-directory: toiletcompass
        run: |
          rm -rf /tmp/toilet-db-scratch monthly-pilot
          python3 database/monthly_pipeline.py \
            --output-root monthly-pilot \
            --scratch-dir /tmp/toilet-db-scratch \
            --countries AT,SI \
            --release-tag toiletdb-pilot \
            --public-repo Persie0/OnnxModels
          test -z "$(find /tmp/toilet-db-scratch -type f -print -quit)"

      - name: Verify generated release assets
        working-directory: toiletcompass
        run: |
          python3 - <<'PY'
          import json, sqlite3
          from pathlib import Path
          root = Path('monthly-pilot/release-assets')
          expected = ['id','osm_id','name','lat','lon','fee','wheelchair','opening_hours','access','changing_table','toilets_position','toilets_disposal','toilets_handwashing','drinking_water','level','location','gender']
          manifest = json.loads((root / 'manifest.json').read_text())
          assert set(manifest['countries']) == {'AT', 'SI'}
          assert set(manifest['continents']) == {'africa','antarctica','asia','australia-oceania','central-america','europe','north-america','south-america'}
          country_total = 0
          for name in ('AT.db','SI.db','europe.db'):
            path = root / name
            con = sqlite3.connect(f'file:{path}?mode=ro', uri=True)
            assert con.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
            assert [r[1] for r in con.execute('PRAGMA table_info(toilets)')] == expected
            assert {'idx_lat','idx_lon','idx_osm_id'} <= {r[1] for r in con.execute('PRAGMA index_list(toilets)')}
            rows = con.execute('SELECT COUNT(*) FROM toilets').fetchone()[0]
            assert con.execute('SELECT COUNT(*) FROM toilets WHERE osm_id IS NULL OR lat IS NULL OR lon IS NULL').fetchone()[0] == 0
            con.close()
            assert rows > 0
            print(name, rows)
            if name in ('AT.db','SI.db'):
              country_total += rows
            else:
              assert rows == country_total
          print('streaming-pilot=ok')
          PY

      - name: Upload streaming pilot assets
        uses: actions/upload-artifact@v4
        with:
          name: toiletcompass-streaming-country-pilot
          path: toiletcompass/monthly-pilot/release-assets/
          retention-days: 3
          if-no-files-found: error
