name: ToiletCompass country DB pilot

on:
  push:
    branches: [toiletcompass-country-pilot-run]
    paths:
      - '.github/workflows/toiletcompass-country-db-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout ToiletCompass pilot branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/toiletcompass
          ref: feat/monthly-country-database-pipeline-pilot2
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true
          path: toiletcompass

      - name: Apply confirmed osmium attribute fix to source branch
        working-directory: toiletcompass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('database/country_pipeline.py')
          text = path.read_text()
          old = '_run(["osmium", "export", str(filtered), "-f", "geojsonseq", "-o", str(exported), "--overwrite"])'
          new = '_run(["osmium", "export", str(filtered), "-a", "id,type", "-f", "geojsonseq", "-o", str(exported), "--overwrite"])'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit('expected osmium export command not found')
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add database/country_pipeline.py
            git commit -m "fix: export OSM ids for country databases"
            git push origin HEAD:feat/monthly-country-database-pipeline-pilot2
          fi

      - name: Run country pipeline contract tests
        working-directory: toiletcompass
        run: python3 -m unittest database.tests.test_country_pipeline -v

      - name: Install OSM tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool
          osmium --version

      - name: Build Austria then Slovenia in one sequential job
        working-directory: toiletcompass
        run: |
          rm -rf /tmp/toilet-db-scratch pilot-output
          mkdir -p /tmp/toilet-db-scratch pilot-output
          python3 database/country_pipeline.py \
            --config database/countries.pilot.json \
            --output-dir pilot-output \
            --scratch-dir /tmp/toilet-db-scratch
          echo 'Scratch after complete run:'
          du -ah /tmp/toilet-db-scratch || true
          test -z "$(find /tmp/toilet-db-scratch -type f -print -quit)"

      - name: Independently inspect generated app databases
        working-directory: toiletcompass
        run: |
          set -o pipefail
          python3 - <<'PY' | tee pilot-output/pilot-report.txt
          import hashlib
          import sqlite3
          from pathlib import Path

          expected = [
              'id','osm_id','name','lat','lon','fee','wheelchair','opening_hours',
              'access','changing_table','toilets_position','toilets_disposal',
              'toilets_handwashing','drinking_water','level','location','gender'
          ]
          counts = {}
          for name in ('AT.db', 'SI.db', 'europe.db'):
              path = Path('pilot-output') / name
              assert path.exists(), name
              assert not Path(str(path) + '-wal').exists()
              assert not Path(str(path) + '-shm').exists()
              con = sqlite3.connect(f'file:{path}?mode=ro', uri=True)
              integrity = con.execute('PRAGMA integrity_check').fetchone()[0]
              columns = [r[1] for r in con.execute('PRAGMA table_info(toilets)')]
              indexes = {r[1] for r in con.execute('PRAGMA index_list(toilets)')}
              count = con.execute('SELECT COUNT(*) FROM toilets').fetchone()[0]
              bad_coords = con.execute('SELECT COUNT(*) FROM toilets WHERE lat IS NULL OR lon IS NULL OR lat < -90 OR lat > 90 OR lon < -180 OR lon > 180').fetchone()[0]
              null_osm = con.execute('SELECT COUNT(*) FROM toilets WHERE osm_id IS NULL').fetchone()[0]
              sample = con.execute('SELECT osm_id,name,lat,lon FROM toilets ORDER BY id LIMIT 3').fetchall()
              con.close()
              assert integrity == 'ok'
              assert columns == expected, (name, columns)
              assert {'idx_lat','idx_lon','idx_osm_id'} <= indexes
              assert bad_coords == 0
              assert null_osm == 0
              assert count > 0
              counts[name] = count
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              print(f'{name}: rows={count} bytes={path.stat().st_size} sha256={digest}')
              print(f'  columns={columns}')
              print(f'  indexes={sorted(indexes)}')
              print(f'  sample={sample}')
          assert counts['europe.db'] == counts['AT.db'] + counts['SI.db'], counts
          print(f"merge-count-check=ok ({counts['europe.db']} == {counts['AT.db']} + {counts['SI.db']})")
          PY

      - name: Upload pilot app-format databases
        uses: actions/upload-artifact@v4
        with:
          name: toiletcompass-country-db-pilot
          path: |
            toiletcompass/pilot-output/AT.db
            toiletcompass/pilot-output/SI.db
            toiletcompass/pilot-output/europe.db
            toiletcompass/pilot-output/pilot-report.txt
          retention-days: 3
          if-no-files-found: error
