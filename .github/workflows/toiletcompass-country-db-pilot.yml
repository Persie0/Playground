name: ToiletCompass country DB pilot

on:
  push:
    branches: [toiletcompass-country-pilot-run]
    paths:
      - '.github/workflows/toiletcompass-country-db-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout ToiletCompass feature branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/toiletcompass
          ref: feat/monthly-country-database-pipeline-pilot2
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true
          path: toiletcompass

      - name: Use bounded one-country disk processing
        working-directory: toiletcompass
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('database/monthly_pipeline.py')
          text = path.read_text()
          replacement = '''def _stream_filter_toilets(url: str, output_pbf: Path) -> None:
    """Download one country, filter it, then immediately delete the large raw PBF."""
    output_pbf.parent.mkdir(parents=True, exist_ok=True)
    raw_pbf = output_pbf.parent / "source.osm.pbf"
    try:
        subprocess.run([
            "curl", "-fL", "--retry", "4", "--retry-delay", "3",
            "--retry-all-errors", "--silent", "--show-error",
            "-o", str(raw_pbf), url,
        ], check=True)
        subprocess.run([
            "osmium", "tags-filter", str(raw_pbf),
            "n/amenity=toilets", "w/amenity=toilets", "r/amenity=toilets",
            "-o", str(output_pbf), "--overwrite",
        ], check=True)
    finally:
        raw_pbf.unlink(missing_ok=True)


def _export_geojsonseq'''
          pattern = r'def _stream_filter_toilets\(url: str, output_pbf: Path\) -> None:.*?\n\ndef _export_geojsonseq'
          updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'expected one stream helper, replaced {count}')
          path.write_text(updated)
          PY
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add database/monthly_pipeline.py
            git commit -m "fix: bound disk usage per country without stdin filtering"
            git push origin HEAD:feat/monthly-country-database-pipeline-pilot2
          fi

      - name: Run all database pipeline tests
        working-directory: toiletcompass
        run: python3 -m unittest discover -s database/tests -v

      - name: Install OSM tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends osmium-tool
          osmium --version

      - name: Build Austria then Slovenia sequentially
        working-directory: toiletcompass
        run: |
          rm -rf /tmp/toilet-db-scratch monthly-pilot
          python3 database/run_monthly.py \
            --output-root monthly-pilot \
            --scratch-dir /tmp/toilet-db-scratch \
            --countries AT,SI \
            --release-tag toiletdb-pilot \
            --public-repo Persie0/OnnxModels
          test -z "$(find /tmp/toilet-db-scratch -type f -print -quit)"

      - name: Verify generated release assets
        working-directory: toiletcompass
        run: |
          python3 - <<'PY'
          import json, sqlite3
          from pathlib import Path
          root = Path('monthly-pilot/release-assets')
          expected = ['id','osm_id','name','lat','lon','fee','wheelchair','opening_hours','access','changing_table','toilets_position','toilets_disposal','toilets_handwashing','drinking_water','level','location','gender']
          manifest = json.loads((root / 'manifest.json').read_text())
          assert set(manifest['countries']) == {'AT', 'SI'}
          assert set(manifest['continents']) == {'africa','antarctica','asia','australia-oceania','central-america','europe','north-america','south-america'}
          country_total = 0
          for name in ('AT.db','SI.db','europe.db'):
            path = root / name
            con = sqlite3.connect(f'file:{path}?mode=ro', uri=True)
            assert con.execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
            assert [r[1] for r in con.execute('PRAGMA table_info(toilets)')] == expected
            assert {'idx_lat','idx_lon','idx_osm_id'} <= {r[1] for r in con.execute('PRAGMA index_list(toilets)')}
            rows = con.execute('SELECT COUNT(*) FROM toilets').fetchone()[0]
            assert con.execute('SELECT COUNT(*) FROM toilets WHERE osm_id IS NULL OR lat IS NULL OR lon IS NULL').fetchone()[0] == 0
            con.close()
            assert rows > 0
            print(name, rows)
            if name in ('AT.db','SI.db'):
              country_total += rows
            else:
              assert rows == country_total
          print('bounded-country-pilot=ok')
          PY

      - name: Upload pilot assets
        uses: actions/upload-artifact@v4
        with:
          name: toiletcompass-monthly-country-pilot
          path: toiletcompass/monthly-pilot/release-assets/
          retention-days: 3
          if-no-files-found: error
