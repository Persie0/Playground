name: AlarmChallenges debug APK (private source on Playground)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/alarmchallenges-debug-apk.yml'

permissions:
  contents: read

concurrency:
  group: alarmchallenges-debug-apk
  cancel-in-progress: false

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout current private repo main
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -eu
          test -n "$REPO_TOKEN" || { echo "Missing repository token"; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth=1 --branch main \
            https://github.com/Persie0/alarmchallenges.git source
          echo "Source commit: $(git -C source rev-parse HEAD)"
      - name: Build Flutter debug APK
        working-directory: source
        run: |
          set -eu
          flutter pub get
          flutter build apk --debug
          git rev-parse HEAD > build/app/outputs/flutter-apk/SOURCE_COMMIT.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/SHA256SUMS.txt
      - name: Upload debug APK and source checksum
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alarmchallenges-main-debug-apk
          path: |
            source/build/app/outputs/flutter-apk/app-debug.apk
            source/build/app/outputs/flutter-apk/SOURCE_COMMIT.txt
            source/build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 7
