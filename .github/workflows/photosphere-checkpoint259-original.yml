name: PhotoSphere checkpoint259 original robust match threshold (one shot)
on:
  push:
    branches: [ci/photosphere-checkpoint259-robust-threshold]
    paths: ['.github/workflows/photosphere-checkpoint259-original.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint259-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-robust-threshold:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'ci: run photosphere checkpoint259 once'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: ea4f88541a8b87e90e4dd428b0a18fba1a63793a
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify exact source and emulator requirements
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ea4f88541a8b87e90e4dd428b0a18fba1a63793a"
          python3 -m py_compile research/photosphere/checkpoint259/native_robust_threshold_branch.py research/photosphere/checkpoint259/validate_robust_threshold.py
          python3 -m pip install --break-system-packages --quiet -r research/photosphere/checkpoint218/requirements.txt
      - name: Extract original GCam ARM64 ELF and verify pinned hashes
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Execute native original robust count decision and validate
        run: |
          set -euo pipefail
          if ! python3 research/photosphere/checkpoint259/native_robust_threshold_branch.py > checkpoint259-original.log 2> checkpoint259-original.stderr; then
            tail -n 110 checkpoint259-original.stderr || true
            exit 1
          fi
          python3 research/photosphere/checkpoint259/validate_robust_threshold.py checkpoint259-original.log | tee checkpoint259-validation.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=Path('checkpoint259-original.log').read_text()
          j=json.loads(s.split('CHECKPOINT259_NATIVE_ADDIMAGE_FEATURE_BEGIN\n')[1].split('\nCHECKPOINT259_NATIVE_ADDIMAGE_FEATURE_END')[0])
          Path('checkpoint259-original.json').write_text(json.dumps(j,indent=2)+'\n')
          for c in j['cases']:
            d=c['native_second_actual_addimage']['original_native_robust_threshold_branch']
            print('CHECKPOINT259_ORIGINAL_ROBUST_THRESHOLD',c['name'],d)
          PY
      - name: Archive original ARM64 threshold branch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint259-original-robust-threshold
          path: |
            checkpoint259-original.log
            checkpoint259-original.stderr
            checkpoint259-original.json
            checkpoint259-validation.txt
          if-no-files-found: warn
          retention-days: 14
