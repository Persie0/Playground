name: Pythagorean 12-scene smoke render (public Playground)
on:
  push:
    branches: [pythagorean-render-qa]
    paths: [.github/workflows/pythagorean-proof-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pythagorean-smoke-qa
  cancel-in-progress: false
env:
  SOURCE_SHA: 18c3b6ded5afb3d0f79e3f1409788728d756494c
  PYTHONUNBUFFERED: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
jobs:
  validate-and-render:
    name: Test 12 scenes, render previews and verify clips
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout public Playground workflow
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout private source without running private Actions
        uses: actions/checkout@v4
        with:
          repository: Persie0/manimVideos
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: source
          persist-credentials: false
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate pinned private commit and 12 renderers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          for n in $(seq 1 12); do
            test -f "source/pythagorean-theorem/scene$n/render_scene$n.py"
            test -f "source/pythagorean-theorem/scene$n/test_scene$n.py"
          done
      - name: Run all pure geometry timing and source regression tests
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          for n in $(seq 1 12); do
            echo "::group::Tests scene $n"
            if python -m unittest discover -s "source/pythagorean-theorem/scene$n" -p 'test_*.py' -v; then
              echo "PASS scene $n"
            else
              echo "::error::Scene $n regression suite failed"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures scene suites failed; renderer stage safely skipped"
            exit 1
          fi
      - name: Install Manim FFmpeg LaTeX SVG requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            ffmpeg pkg-config libcairo2-dev libpango1.0-dev \
            texlive-latex-extra texlive-fonts-recommended dvisvgm \
            fonts-dejavu-core fonts-lato
          python -m pip install -r source/pythagorean-theorem/requirements.txt
          python -c 'import manim; print("Manim", manim.__version__)'
      - name: Sequentially render all 12 scenes at 854x480 and 15fps
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p previews
          cd source/pythagorean-theorem
          for n in $(seq 1 12); do
            printf -v label '%02d' "$n"
            echo "::group::Rendering scene $label"
            manim --renderer=cairo -r 854,480 --fps 15 \
              "scene$n/render_scene$n.py" "PythagoreanScene$n" \
              -o "pythagorean_scene$label.mp4" --disable_caching
            video=$(find media/videos -type f -name "pythagorean_scene$label.mp4" -print -quit)
            test -n "$video"
            cp "$video" "../../previews/scene$label.mp4"
            echo "::endgroup::"
          done
      - name: Check resolution frame rates and durations; concatenate previews
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, subprocess
          files = sorted(pathlib.Path("previews").glob("scene*.mp4"))
          lengths = [18,17,18,17,20,18,20,32,21,15,26,18]
          assert len(files) == 12 and sum(lengths) == 240, files
          for i, (path, expected) in enumerate(zip(files,lengths),1):
              output=subprocess.check_output([
                  "ffprobe","-v","error","-show_streams",
                  "-show_format","-of","json",str(path)
              ])
              result=json.loads(output)
              stream=next(x for x in result["streams"] if x["codec_type"]=="video")
              assert (int(stream["width"]),int(stream["height"]))==(854,480), (path,stream)
              assert stream["avg_frame_rate"]=="15/1", (path,stream["avg_frame_rate"])
              actual=float(result["format"]["duration"])
              assert abs(actual-expected)<.60, (path,actual,expected)
              print(f"Scene {i:02d}: {actual:.3f}s, {stream.get('nb_frames')} frames")
          with open("previews/concat.txt","w") as output:
              for path in files:
                  output.write(f"file '{path.name}'\n")
          PY
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -f concat -safe 0 -i previews/concat.txt -c copy \
            -movflags +faststart previews/Pythagorean_12_Scenes_480p15_Preview.mp4
          ffprobe -v error -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            previews/Pythagorean_12_Scenes_480p15_Preview.mp4
          (cd previews && sha256sum *.mp4 > SHA256SUMS.txt)
      - name: Upload validated preview clips and film
        uses: actions/upload-artifact@v4
        with:
          name: pythagorean-12-scenes-smoke-480p15
          path: previews/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
