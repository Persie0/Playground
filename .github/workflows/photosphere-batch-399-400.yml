name: Photosphere 399-400 original second 550-trial RANSAC and Rust
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-batch-399-400.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-batch-399-400
  cancel-in-progress: false
jobs:
  native-second-ransac-and-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Exact SHA read-only original ARM64 research checkout
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 3a1a95942ec6ab0641574fea833f9ba1daff6b8a
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Assert research source SHA and compile Python source
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '3a1a95942ec6ab0641574fea833f9ba1daff6b8a'
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py
      - name: Verify pinned original APK and ELF checksums
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Original second source match native 550-trial RANSAC and return boundary
        working-directory: research-src
        env:
          PHOTOSPHERE_EXTEND_SECOND_ROBUST: '1'
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py > checkpoint399-full.log 2> checkpoint399-diagnostic.log
          python3 - <<'PY'
          import json
          source=next(x for x in open('checkpoint399-full.log')
              if x.startswith('CHECKPOINT395_NATIVE_POINT_SETUP_THIRD_ROBUST_ENTRY_REPORT='))
          d=json.loads(source.split('=',1)[1])
          first=d['checkpoint388_third_native_full']
          pair=d['checkpoint391_third_matcher_owned']
          graph=d['checkpoint393_third_source_graph']
          post=d['checkpoint395_third_postlink']
          desc=d['checkpoint397_second_matcher_descriptor']
          second=d['checkpoint399_second_robust']
          assert d['original_elf_sha256']=='878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1'
          assert d['source_original_third_image_callsite'].get('original_third_execution_error') is None
          assert not d['original_full_solver_ceres_executed']
          assert d['bionic_rand_stream_test_controlled']
          assert first['native_third_550_trials_finished']
          assert first['native_third_refit_executed']
          assert first['native_original_robust_return']['native_return_w0']==1
          assert pair['native_pair_first_second_i32']==[0,2]
          assert pair['source_native_row_count']==25
          assert pair['source_original_highlevel_success_w0']==1
          assert graph['original_third_native_first_link_executed']
          assert graph['original_third_native_second_link_executed']
          assert graph['original_source_graph_link_delta_verified']
          assert post['original_native_both_reciprocal_links_earlier']
          assert post['original_source_endpoint']=='second_matcher_robust_return'
          assert not post['original_native_next_matcher_not_executed']
          assert post['original_native_pair_constructor_not_executed']
          assert desc['source_native_raw_match_count']==47
          assert desc['source_second_native_descriptor_result_pc']=='0x1206e4'
          assert desc['source_native_descriptor_rows_not_host_injected']
          assert second['native_source_threshold_pc']=='0x1208a0'
          assert second['source_threshold_passed']
          assert second['native_match_count']==47
          assert second['source_original_ray_preparation_pc']=='0x120914'
          assert second['original_preprocessor_pc']=='0x127bac'
          assert [x['source_native_ray_count'] for x in second['original_source_ray_vectors']]==[47,47]
          assert second['original_native_robust_entry_pc']=='0x30f860'
          assert second['source_first_pair_gate_pc']=='0x30fde8'
          assert second['native_original_first_pair_indices']==[0,24]
          assert second['source_native_ransac_trial_count']==550
          assert second['source_native_completed_trial_count_w21']==550
          assert second['source_native_full_550_trials_executed']
          assert second['source_native_svd_call_count']>0
          assert second['source_original_postloop_pc']=='0x310418'
          assert second['source_native_rand_draws']==[0,24]*550
          assert second['source_native_robust_return_pc']=='0x120918'
          assert second['source_native_robust_return_w0'] in (0,1)
          assert second['source_original_stop_before_second_point_rows']
          assert second['active'] is False
          assert second['original_full_second_ceres_executed'] is False
          open('checkpoint399-native.json','w').write(json.dumps(d,sort_keys=True,indent=2)+'\n')
          print('CHECKPOINT399_SECOND_ORIGINAL_NATIVE_ROBUST_PASS',json.dumps({
              'original_first_pair':[0,2],
              'second_candidate':[1,2],
              'second_descriptor_matches':desc['source_native_raw_match_count'],
              'second_source_native_trials':second['source_native_ransac_trial_count'],
              'second_source_native_svd_calls':second['source_native_svd_call_count'],
              'second_original_native_refit_executed':second.get('source_native_refit_executed',False),
              'second_original_native_return_w0':second['source_native_robust_return_w0'],
              'native_second_graph_link_executed':False,
              'native_android_bionic_rng_reproduced':False,
          },sort_keys=True))
          PY
      - name: Delete proprietary original APK and ELF before source archive
        if: always()
        working-directory: research-src
        run: |
          rm -f original.apk research/native/liblightcycle.so com.google.android.GoogleCamera_*.apk
      - name: Exact SHA read-only private Rust app checkout
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: d2a234aa907aea69257a32091defc33556ffcbb1
          path: app-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: One grouped Rust all-targets source differential and regressions
        working-directory: app-src
        env:
          PHOTOSPHERE_399_NATIVE_JSON: ${{ github.workspace }}/research-src/checkpoint399-native.json
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd2a234aa907aea69257a32091defc33556ffcbb1'
          test -s "$PHOTOSPHERE_399_NATIVE_JSON"
          cargo test --locked --all-targets > checkpoint400-rust.log 2>&1 || { tail -n 180 checkpoint400-rust.log; exit 1; }
          grep '^test result:' checkpoint400-rust.log | tail -n 12
      - name: Archive only source synthetic numeric receipts and grouped Rust logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-399-400-second-native-ransac-source
          path: |
            research-src/checkpoint399-native.json
            research-src/checkpoint399-diagnostic.log
            app-src/checkpoint400-rust.log
          retention-days: 7
          if-no-files-found: warn
