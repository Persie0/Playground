name: Traffic counting performance unit tests

on:
  push:
    paths:
      - ".github/workflows/traffic-counting-perf-unit.yml"
      - "debug_triggers/traffic-counting-perf-unit.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/traffic-counting-light-main
  APP_REF: perf/pipeline-25fps

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout traffic-counting candidate
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependencies
        run: |
          python -m pip install \
            'pytest>=9,<10' \
            'ruff>=0.16.7,<0.17' \
            'ncnn>=1.0.20260526' \
            'numpy>=2.2,<2.5' \
            'opencv-python>=4.12,<5' \
            'pyyaml>=6,<7' \
            'easydict>=1.13,<2' \
            'loguru>=0.7,<1'
      - name: Ruff branch-clean performance files
        working-directory: app/edge
        run: |
          ruff check \
            src/detectors/ncnn_output.py \
            src/detectors/nms.py \
            src/img_processing/preprocessing_factory.py \
            tests/test_benchmark_fisheye_profiles.py \
            tests/test_fisheye_supersampled.py \
            tests/test_line_counter_geometry_cache.py \
            tests/test_ncnn_nms.py \
            tests/test_ncnn_output.py \
            tests/test_ncnn_runtime_options.py \
            tests/test_pi_supersample_config.py
      - name: Run focused performance/regression tests
        working-directory: app/edge
        run: |
          PYTHONPATH=src pytest -q \
            tests/test_benchmark_fisheye_profiles.py \
            tests/test_fisheye_rectifier.py \
            tests/test_fisheye_supersampled.py \
            tests/test_pi_supersample_config.py \
            tests/test_preprocessors.py \
            tests/test_config.py \
            tests/test_ncnn_runtime_options.py \
            tests/test_ncnn_output.py \
            tests/test_ncnn_nms.py \
            tests/test_line_counter_geometry_cache.py \
            tests/test_line_counter_classes.py \
            tests/test_line_counter_retention.py
