name: Photo Sphere checkpoint251 original matcher sort and bins Rust parity
on:
  push:
    branches:
      - ci/photosphere-checkpoint250-single-run
    paths:
      - .github/workflows/photosphere-checkpoint250-retained-vectors.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: photosphere-checkpoint251-rust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  original-matcher-rust-regression:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'ci: run photosphere checkpoint251 rust once'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pinned private PhotosphereCleanroom without persisting credentials
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 70948e3773eaa535a519f258f2503c6ef1d2841b
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Verify pinned source
        run: test "$(git rev-parse HEAD)" = "70948e3773eaa535a519f258f2503c6ef1d2841b"
      - name: Replay original native sorted feature and 30-bin outputs
        run: cargo test --locked checkpoint251_original_addimage_sorted_features_and_latitude_bins -- --nocapture
      - name: Run complete Rust regression suite
        run: cargo test --locked
