name: AudioBooster Flutter checks
# TDD: Task 9 red rerun - bootstrap and documentation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audiobooster-flutter.yml
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Playground
        uses: actions/checkout@v4
      - name: Check out AudioBooster
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: design/modern-audio-engine
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: audiobooster
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: audiobooster
        run: flutter pub get
      - name: Run Task 9 red checks
        working-directory: audiobooster
        run: flutter test test/bootstrap_android_source_test.dart test/native_bridge_source_test.dart
