name: AudioBooster onboarding CI
on:
  push:
    branches: [audiobooster-onboarding-ci]
    paths:
      - .github/workflows/audiobooster-flutter.yml
      - .ci-trigger-audiobooster-onboarding
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Playground
        uses: actions/checkout@v4
      - name: Check out AudioBooster feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: feature/onboarding-material-you
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: audiobooster
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Show Flutter version
        run: flutter --version
      - name: Install Flutter dependencies
        working-directory: audiobooster
        run: flutter pub get
      - name: Run Flutter tests
        id: flutter_tests
        continue-on-error: true
        working-directory: audiobooster
        run: flutter test
      - name: Analyze Dart sources
        id: analyze
        continue-on-error: true
        working-directory: audiobooster
        run: flutter analyze
      - name: Generate Android project and install native audio bridge
        working-directory: audiobooster
        run: bash tool/bootstrap_android.sh
      - name: Run AudioBooster Android unit tests
        id: native_tests
        continue-on-error: true
        working-directory: audiobooster/android
        run: ./gradlew :app:testDebugUnitTest
      - name: Build debug APK
        id: build
        continue-on-error: true
        working-directory: audiobooster
        run: flutter build apk --debug
      - name: Fail if any validation failed
        if: always()
        run: |
          echo "flutter_tests=${{ steps.flutter_tests.outcome }}"
          echo "analyze=${{ steps.analyze.outcome }}"
          echo "native_tests=${{ steps.native_tests.outcome }}"
          echo "build=${{ steps.build.outcome }}"
          test "${{ steps.flutter_tests.outcome }}" = success
          test "${{ steps.analyze.outcome }}" = success
          test "${{ steps.native_tests.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
      - name: Upload debug APK
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: audiobooster-onboarding-debug-apk
          path: audiobooster/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
