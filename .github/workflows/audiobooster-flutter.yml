name: AudioBooster Flutter checks
# Review TDD red: foreground state refresh after capture changes
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audiobooster-flutter.yml
  workflow_dispatch:
    inputs:
      audio_ref:
        description: AudioBooster branch, tag, or commit to validate
        required: false
        default: design/modern-audio-engine
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Playground
        uses: actions/checkout@v4
      - name: Check out AudioBooster
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: ${{ inputs.audio_ref || 'design/modern-audio-engine' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: audiobooster
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: audiobooster-gradle-${{ runner.os }}-v1
      - name: Show Flutter version
        run: flutter --version
      - name: Install Flutter dependencies
        working-directory: audiobooster
        run: flutter pub get
      - name: Run Flutter tests
        working-directory: audiobooster
        run: flutter test
      - name: Analyze Dart sources
        working-directory: audiobooster
        run: flutter analyze
      - name: Bootstrap Android host twice
        working-directory: audiobooster
        run: |
          bash tool/bootstrap_android.sh
          bash tool/bootstrap_android.sh
      - name: Verify bootstrap idempotence
        working-directory: audiobooster
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          root = ET.parse(manifest_path).getroot()
          android_name = '{http://schemas.android.com/apk/res/android}name'

          permissions = [
              node.get(android_name)
              for node in root.findall('uses-permission')
          ]
          services = [
              node.get(android_name)
              for node in root.findall('./application/service')
          ]

          for permission in [
              'android.permission.MODIFY_AUDIO_SETTINGS',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_SPECIAL_USE',
              'android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION',
              'android.permission.DUMP',
              'android.permission.RECORD_AUDIO',
          ]:
              count = permissions.count(permission)
              if count != 1:
                  raise SystemExit(
                      f'{permission}: expected exactly once, found {count}'
                  )

          for service in [
              'com.persie0.audiobooster.audio.AudioBoostService',
              'com.persie0.audiobooster.audio.MediaNotificationListenerService',
          ]:
              count = services.count(service)
              if count != 1:
                  raise SystemExit(
                      f'{service}: expected exactly once, found {count}'
                  )

          gradle_path = Path('android/app/build.gradle.kts')
          if not gradle_path.exists():
              gradle_path = Path('android/app/build.gradle')
          gradle = gradle_path.read_text()
          junit = 'junit:junit:4.13.2'
          if gradle.count(junit) != 1:
              raise SystemExit(
                  f'{junit}: expected exactly once, found {gradle.count(junit)}'
              )
          PY
      - name: Run Android unit tests
        working-directory: audiobooster/android
        run: ./gradlew :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: audiobooster
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: audiobooster-modern-debug-apk
          path: audiobooster/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
