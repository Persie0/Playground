name: Photosphere checkpoint300 original RANSAC RNG ownership
on:
  push:
    branches: [research/photosphere-checkpoint300-ransac-rng-ownership]
    paths: ['.github/workflows/photosphere-checkpoint300-ransac-rng-ownership.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint300-rng
  cancel-in-progress: true
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Original ELF decode dependencies
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools unicorn
      - name: Download exact original GCam APK and extract native SO
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Checkout pinned research probe
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: d350ac147af8dab6d0017adf4160aa457cb9a264
          path: decompile
          sparse-checkout: |
            research/photosphere/checkpoint300
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify original direct RANSAC rand and process seed linkage
        run: |
          set -euo pipefail
          test "$(git -C decompile rev-parse HEAD)" = d350ac147af8dab6d0017adf4160aa457cb9a264
          python3 decompile/research/photosphere/checkpoint300/verify_original_rng_linkage.py original.so --output checkpoint300-original-rng-linkage.json | tee checkpoint300-original-rng-linkage.log
          grep -q '^CHECKPOINT300_ORIGINAL_RNG_LINKAGE_PASSED' checkpoint300-original-rng-linkage.log
      - name: Checkout original native two-frame RANSAC harness and dependencies
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: d350ac147af8dab6d0017adf4160aa457cb9a264
          path: decompile-native
          sparse-checkout: |
            research/photosphere/checkpoint300
            research/photosphere/checkpoint271
            research/photosphere/checkpoint218
            research/photosphere/checkpoint211
            research/photosphere/checkpoint210
            research/photosphere/checkpoint209
            research/photosphere/checkpoint188
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Execute genuine 550-trial ARM64 RANSAC with two alternating controlled pairs
        run: |
          set -euo pipefail
          test "$(git -C decompile-native rev-parse HEAD)" = d350ac147af8dab6d0017adf4160aa457cb9a264
          mkdir -p decompile-native/research/native
          cp original.so decompile-native/research/native/liblightcycle.so
          (
            cd decompile-native
            python3 research/photosphere/checkpoint300/native_original_alternating_ransac.py > ../checkpoint300-native-alternating.log 2> ../checkpoint300-native-alternating.stderr
            cp checkpoint300-native-alternating-ransac-fixtures.json ..
          )
          cat checkpoint300-native-alternating.log
          grep -q '^CHECKPOINT300_ALTERNATING_NATIVE_550_TRIALS_PASSED 550 1100' checkpoint300-native-alternating.log
      - name: Checkout pinned Rust original RNG trace regression
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: cea670d110af1e2760ee42ecb60273e6a40ad5a9
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Compare freshly executed native RANSAC trace against both frozen fixtures
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = cea670d110af1e2760ee42ecb60273e6a40ad5a9
          python3 - <<'PY'
          import json
          with open('checkpoint300-native-alternating-ransac-fixtures.json') as f: actual=json.load(f)
          for path in [
              'decompile-native/research/photosphere/checkpoint300/native-original-alternating-ransac-fixture.json',
              'app/tests/fixtures/native_original_alternating_ransac_300.json'
          ]:
              with open(path) as f: expected=json.load(f)
              assert actual==expected,path+' differs from fresh original native execution'
          assert len(actual['actual_original_550_sampled_index_pairs'])==550
          assert actual['original_rand_values_consumed']==1100
          print('CHECKPOINT300_FRESH_ORIGINAL_ALTERNATING_ORACLE_EQUALITY_PASSED 550 1100')
          PY
      - name: Replay original sampled pairs through production Rust solver
        working-directory: app
        run: |
          set -euo pipefail
          git diff --check
          cargo test --lib checkpoint300_original_alternating_550_trial_ransac_draws_replay_in_production -- --nocapture
          cargo test --lib
      - name: Upload exact original linkage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint300-original-rng-linkage
          path: |
            checkpoint300-original-rng-linkage.json
            checkpoint300-original-rng-linkage.log
            checkpoint300-native-alternating-ransac-fixtures.json
            checkpoint300-native-alternating.log
            checkpoint300-native-alternating.stderr
          retention-days: 14
          if-no-files-found: warn
