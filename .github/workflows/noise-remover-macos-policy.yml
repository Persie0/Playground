name: Noise Remover PR 196 verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noise-remover-macos-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private PR 196 head
        uses: actions/checkout@v5
        with:
          repository: Persie0/noise_remover
          ref: fix/revenuecat-hardening
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Run full Flutter test suite
        working-directory: app
        run: flutter test --concurrency=1 --timeout 2m --reporter expanded

      - name: Run analyzer
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
