name: Noise Remover macOS policy tests

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Private Noise Remover branch/tag/SHA
        required: false
        default: macos-release
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/noise-remover-macos-policy.yml'
      - '.github/noise-remover-macos-policy-trigger'

permissions:
  contents: read

env:
  APP_REF: ${{ inputs.ref || 'macos-release' }}

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private app
        uses: actions/checkout@v5
        with:
          repository: Persie0/noise_remover
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - name: Show private revision
        working-directory: app
        run: git rev-parse HEAD

      - name: Run macOS Podfile policy regression
        working-directory: app
        run: python3 -m unittest tool/test_macos_podfile_linkage.py -v
