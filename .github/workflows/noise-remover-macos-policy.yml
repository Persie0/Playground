name: Noise Remover PR 196 rebase and verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noise-remover-macos-policy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private PR 196 head
        uses: actions/checkout@v5
        with:
          repository: Persie0/noise_remover
          ref: fix/revenuecat-hardening
          fetch-depth: 0
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true
          path: app

      - name: Merge current master and apply reviewed fixes
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Persie0 Playground CI'
          git config user.email '76871553+Persie0@users.noreply.github.com'
          git fetch origin master

          set +e
          git merge --no-commit --no-ff origin/master
          merge_status=$?
          set -e
          if [[ $merge_status -ne 0 ]]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            printf 'Merge conflicts:\n%s\n' "$conflicts"
            if [[ "$conflicts" != "lib/main.dart" ]]; then
              exit 1
            fi
            git checkout --ours lib/main.dart
            git add lib/main.dart
          fi

          python3 - <<'PY'
          from pathlib import Path

          # Preserve #198 expected-processing Sentry filtering on the RevenueCat branch.
          p = Path('lib/main.dart')
          s = p.read_text()
          expected_import = "import 'services/expected_processing_event.dart';"
          if expected_import not in s:
              anchor = "import 'services/exceptions.dart';\n"
              assert anchor in s
              s = s.replace(anchor, anchor + expected_import + "\n", 1)
          if 'shouldDropExpectedProcessingEvent(event)' not in s:
              anchor = '    options.beforeSend = (event, hint) {\n'
              assert anchor in s
              s = s.replace(
                  anchor,
                  anchor + '      if (shouldDropExpectedProcessingEvent(event)) return null;\n',
                  1,
              )
          p.write_text(s)

          # A Timer may wake marginally before the wall-clock expiration. If that
          # happens, reschedule the remaining interval instead of abandoning expiry.
          p = Path('lib/services/subscription_service.dart')
          s = p.read_text()
          old = """      if (currentExpiration == null ||
          currentExpiration.isAfter(DateTime.now().toUtc())) {
        return;
      }
"""
          new = """      if (currentExpiration == null) return;
      if (currentExpiration.isAfter(DateTime.now().toUtc())) {
        // Timers can wake slightly before the wall-clock boundary. Reschedule
        // the remaining delay instead of abandoning entitlement expiry.
        _scheduleEntitlementExpiry();
        return;
      }
"""
          assert old in s, 'expiry timer guard not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # The PR intentionally removes silent receipt/store recovery. Keep the
          # regression test aligned with that policy while retaining manual retry.
          p = Path('test/network_error_test.dart')
          s = p.read_text()
          old_name = "manual RevenueCat retry re-runs initialization and store recovery"
          assert old_name in s
          s = s.replace(
              old_name,
              "manual RevenueCat retry re-runs initialization without store recovery",
              1,
          )
          old = """    expect(
      source,
      contains('_initializeRevenueCat(forceStoreRecovery: true)'),
    );
"""
          new = """    expect(source, contains('await _initializeRevenueCat();'));
    expect(source, isNot(contains('forceStoreRecovery: true')));
    expect(source, isNot(contains('Purchases.syncPurchases')));
"""
          assert old in s, 'old manual retry expectation not found'
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Replace the obsolete silent-sync regression with assertions matching
          # CustomerInfo-only automatic refresh and explicit user Restore.
          p = Path('test/full_error_hardening_regression_test.dart')
          s = p.read_text()
          start_marker = "  test('inactive Pro ownership is retried on resume but rate limited', () {"
          end_marker = "  test('error codes distinguish pipeline stages'"
          assert start_marker in s and end_marker in s
          start = s.index(start_marker)
          end = s.index(end_marker, start)
          replacement = """  test('automatic subscription paths never silently recover store receipts', () {
    final service =
        File('lib/services/subscription_service.dart').readAsStringSync();
    final mainSource = File('lib/main.dart').readAsStringSync();
    final paywall =
        File('lib/screens/paywall_screen.dart').readAsStringSync();

    expect(service, isNot(contains('_silentStoreRecoveryCooldown')));
    expect(service, isNot(contains('Purchases.syncPurchases')));
    expect(mainSource, contains('refreshCustomerInfo()'));
    expect(
      mainSource,
      isNot(contains('recoverInactiveStorePurchase: true')),
    );
    expect(paywall, isNot(contains('recoverInactiveStorePurchase: true')));
    expect(paywall, contains('retryRevenueCatInitialization()'));
  });

"""
          s = s[:start] + replacement + s[end:]
          p.write_text(s)
          PY

          # This file only asserted the silent sync/recovery implementation that
          # PR 196 deliberately removes; current entitlement tests cover the new path.
          git rm -f test/services/pro_update_recovery_regression_test.dart

          git add lib/main.dart \
            lib/services/subscription_service.dart \
            test/network_error_test.dart \
            test/full_error_hardening_regression_test.dart
          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Run full Flutter test suite
        working-directory: app
        run: flutter test --concurrency=1 --timeout 2m --reporter expanded

      - name: Run analyzer
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Commit and push exact green candidate
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git commit -m 'fix: sync RevenueCat hardening with master [skip ci]'
          git push origin HEAD:fix/revenuecat-hardening
