name: Image Enhancer foreground processing smoke

on:
  push:
    branches: [background-media-processing-validation-20260928]
    paths:
      - '.github/workflows/image-foreground-smoke.yml'
      - 'scripts/image_foreground_smoke_test.dart'
      - 'scripts/run_image_foreground_smoke.sh'

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/image_enhancer
  APP_REF: feature/android-background-media-processing-20260928

jobs:
  android-emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout public harness
        uses: actions/checkout@v5
        with:
          ref: background-media-processing-validation-20260928
          path: harness

      - name: Checkout image enhancer feature branch
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install temporary integration harness
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p integration_test .ci
          cp ../harness/scripts/image_foreground_smoke_test.dart integration_test/foreground_image_processing_test.dart
          python3 - <<'PY'
          from pathlib import Path
          p = Path('pubspec.yaml')
          s = p.read_text()
          marker = 'dev_dependencies:\n'
          if '  integration_test:\n    sdk: flutter\n' not in s:
              if marker not in s:
                  raise SystemExit('dev_dependencies marker missing')
              s = s.replace(marker, marker + '  integration_test:\n    sdk: flutter\n', 1)
          p.write_text(s)
          PY
          flutter pub get
          dart format integration_test/foreground_image_processing_test.dart
          flutter analyze integration_test/foreground_image_processing_test.dart

      - name: Enable KVM group access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run background and lock-screen smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: app
          script: bash ../harness/scripts/run_image_foreground_smoke.sh

      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-foreground-smoke-diagnostics
          path: |
            app/.ci/image-foreground-smoke.log
            app/.ci/image-activity.txt
            app/.ci/image-services-home.txt
            app/.ci/image-services-locked.txt
            app/.ci/image-notifications.txt
            app/.ci/image-logcat-locked.txt
            app/.ci/image-logcat-final.txt
          if-no-files-found: ignore
