name: Photosphere checkpoint320 native logger return path
on:
  push:
    branches: [research/photosphere-checkpoint320-logger]
    paths: [.github/workflows/photosphere-checkpoint320-logger.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-logger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install original source analysis
        run: python3 -m pip install --break-system-packages --quiet unicorn capstone pyelftools
      - name: Download SHA-pinned original Google Camera ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk'
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Read-only checkout original diagnostic logger research
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 9ddeb574dee2767b079c747b61fcc315d089c8fc
          path: research
          sparse-checkout: |
            research/photosphere/checkpoint320
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Execute original severity-one nested logger and finalizer
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 9ddeb574dee2767b079c747b61fcc315d089c8fc
          python3 research/research/photosphere/checkpoint320/native_original_logger_finalizer.py original.so --output checkpoint320-original-logger.json | tee checkpoint320-original-logger.log
          grep -q '^CHECKPOINT320_ORIGINAL_LOGGER_RETURN_PASS' checkpoint320-original-logger.log
          python3 research/research/photosphere/checkpoint320/scan_original_logger_helpers.py original.so --output checkpoint320-original-nested.json | tee checkpoint320-original-nested.log
          grep -q '^CHECKPOINT320_ORIGINAL_NESTED_HELPERS_SCANNED' checkpoint320-original-nested.log
          echo CHECKPOINT320_NESTED_JSON_BEGIN
          cat checkpoint320-original-nested.json
          echo CHECKPOINT320_NESTED_JSON_END
          echo CHECKPOINT320_ORIGINAL_LOGGER_JSON_BEGIN
          cat checkpoint320-original-logger.json
          echo CHECKPOINT320_ORIGINAL_LOGGER_JSON_END
      - name: Checkout pinned Rust checkpoint320 app read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: b76af37f7c6674248020bf6df31c8f4437d737e0
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Compare fresh original ELF results with Rust frozen fixtures
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = b76af37f7c6674248020bf6df31c8f4437d737e0
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("checkpoint320-original-logger.json").read_text())
          for c in report["cases"]:
              trace=c.pop("original_instruction_trace")
              c["original_trace_start_pc"]=trace[0]
              c["original_trace_end_pc"]=trace[-1]
              c["original_trace_instruction_count"]=len(trace)
          frozen=json.loads(Path("app/tests/fixtures/native_original_logger_finalizer_320.json").read_text())
          assert report==frozen, "source-executed ARM64 logger differs from Rust source fixture"
          assert report["original_synthetic_case_count"]==9
          assert report["original_exact_opcode_pins"]==33
          print("CHECKPOINT320_FRESH_SOURCE_LOGGER_FIXTURE_EQUAL",9,33)
          source=json.loads(Path("checkpoint320-original-nested.json").read_text())
          for f in source["functions"]:
              if f["original_helper_entry_pc"] not in ("0x3b87f4","0x3b70b8","0x3b6ce4"):
                  items=f["original_instructions"]
                  f["original_instructions"]=items[:6]+items[-6:]
          frozen=json.loads(Path("app/tests/fixtures/native_original_logger_nested_helpers_320.json").read_text())
          assert source==frozen, "nested helper disassembly differs from Rust source fixture"
          assert source["original_nested_helper_count"]==6
          print("CHECKPOINT320_FRESH_SOURCE_NESTED_FIXTURE_EQUAL",6)
          PY
      - name: Run focused and full Rust regression
        run: |
          set -euo pipefail
          cd app
          rustfmt --edition 2021 --check src/native_line_logger_finalizer.rs src/native_line_logger_finalizer_checkpoint320_test.rs
          cargo test --lib checkpoint320 -- --nocapture
          cargo test --lib
      - name: Print formatted Rust source for exact readback
        run: |
          echo CHECKPOINT320_RUST_MODEL_BEGIN
          cat app/src/native_line_logger_finalizer.rs
          echo CHECKPOINT320_RUST_MODEL_END
          echo CHECKPOINT320_RUST_TEST_BEGIN
          cat app/src/native_line_logger_finalizer_checkpoint320_test.rs
          echo CHECKPOINT320_RUST_TEST_END
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint320-original-logger
          path: |
            checkpoint320-original-logger.json
            checkpoint320-original-logger.log
            checkpoint320-original-nested.json
            checkpoint320-original-nested.log
          retention-days: 14
