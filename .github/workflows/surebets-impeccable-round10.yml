name: Surebets Impeccable round 10 validation
on:
  push:
    branches: [ci/surebets-impeccable-round10-20261122]
    paths:
      - .github/workflows/surebets-impeccable-round10.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Surebets private repository via public Playground
        uses: actions/checkout@v4
        with:
          repository: Persie0/surebets_calculator
          ref: fix/impeccable-round10-cash-commission-20261122
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Dart format and whitespace verification
        run: |
          dart format lib/logic/cash_settlement.dart lib/logic/display_bet_outcome.dart lib/logic/surebet_calculator.dart lib/logic/odds_input_feedback.dart lib/widgets/calculation_overview.dart lib/calculator_screen.dart test/impeccable_round10_cash_commission_test.dart test/display_bet_outcome_test.dart visual_tests/impeccable_round6_goldens_test.dart
          git diff --check
      - name: Flutter static analyzer
        run: flutter analyze --no-fatal-infos
      - name: Full Flutter regression tests
        run: timeout 200s flutter test --reporter expanded
      - name: Confirm thirteen UI states with readable large-type commission details
        run: timeout 180s flutter test visual_tests/impeccable_round6_goldens_test.dart --update-goldens --reporter expanded
      - name: Upload result screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surebets-impeccable-round10-ui
          path: visual_tests/goldens/*.png
          if-no-files-found: warn
          retention-days: 7
