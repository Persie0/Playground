name: Surebets Impeccable round 7 validation
on:
  push:
    branches: [ci/surebets-impeccable-round7-20261122]
    paths:
      - .github/workflows/surebets-impeccable-round7.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Surebets private source (public runner only)
        uses: actions/checkout@v4
        with:
          repository: Persie0/surebets_calculator
          ref: fix/impeccable-round7-hedge-undo-20261122
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve app dependencies
        run: flutter pub get
      - name: Format changed sources and check whitespace
        run: |
          dart format lib/logic/free_bet_calculator.dart lib/widgets/free_bet_result_card.dart test/free_bet_result_card_test.dart lib/logic/odds_input_feedback.dart lib/free_bet_snr_screen.dart lib/free_bet_sr_screen.dart lib/services/bet_history_service.dart lib/bet_history_screen.dart test/impeccable_round7_placeable_hedge_test.dart test/impeccable_round7_clear_all_undo_test.dart test/impeccable_round7_hedge_widget_test.dart visual_tests/impeccable_round6_goldens_test.dart
          git diff --check
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos
      - name: Full Flutter tests
        run: timeout 240s flutter test --reporter expanded
      - name: Render six UI screenshot variants
        run: timeout 150s flutter test visual_tests/impeccable_round6_goldens_test.dart --update-goldens --reporter expanded
      - name: Publish screenshot matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surebets-round7-flutter-ui
          path: visual_tests/goldens/*.png
          retention-days: 7
          if-no-files-found: warn
