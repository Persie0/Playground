name: FocusMove redesign PR28 validation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/focusmove-redesign-pr28.yml
      - focusmove-redesign-pr28-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focusmove-redesign-pr28
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private source into ephemeral runner only
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Missing private checkout token'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feature/focusmove-redesign-spec-20261118 https://github.com/Persie0/pomodoroexercise.git source
      - name: Analyze and test UI changes
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test --reporter expanded
      - name: Build Android debug APK, without publishing private artifacts
        working-directory: source
        run: |
          set -euo pipefail
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
