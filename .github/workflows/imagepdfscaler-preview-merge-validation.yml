name: ImagePdfScaler preview merge validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imagepdfscaler-preview-merge-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Checkout audited app branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/ImagePdfScaler
          ref: audit/performance-rotation
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Check formatting
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

      - name: Generate Android scaffold
        working-directory: app
        run: bash tool/bootstrap_platforms.sh android

      - name: Resolve Android dependencies
        working-directory: app
        run: flutter pub get

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: imagepdfscaler-audited-preview-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
