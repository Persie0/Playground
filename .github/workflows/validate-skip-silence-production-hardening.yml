name: Validate SkipSilencePlayer production hardening

on:
  push:
    branches:
      - validate-skip-silence-production-hardening-20261118
    paths:
      - '.github/workflows/validate-skip-silence-production-hardening.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/SkipSilencePlayer
          ref: feature/production-hardening-20261118
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: target

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      - name: Test and build Android
        working-directory: target/kotlin-android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

  ios:
    needs: android
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/SkipSilencePlayer
          ref: feature/production-hardening-20261118
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: target

      - name: Build iOS simulator
        working-directory: target/swift-ios
        run: |
          set -o pipefail
          xcodebuild \
            -project SkipSilencePlayer.xcodeproj \
            -scheme SkipSilencePlayer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derived \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run real-media silence regression
        working-directory: target/swift-ios
        run: |
          python3 Tests/generate_fixture.py /tmp/skip-silence-fixture.wav
          xcrun swiftc \
            -parse-as-library \
            -framework AVFoundation \
            -framework CoreMedia \
            SkipSilencePlayer/SilenceAnalyzer.swift \
            Tests/SilenceAnalyzerHarness.swift \
            -o /tmp/silence-analyzer-test
          /tmp/silence-analyzer-test /tmp/skip-silence-fixture.wav
