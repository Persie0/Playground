name: Traffic analysis quality fixes
# final verification: exact route-support rendering + historical reference replay

on:
  push:
    branches:
      - traffic-analysis-quality-fixes
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPOSITORY: Persie0/traffic-counting-light-main
  TARGET_REF: feature/traffic-analysis-quality-fixes

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Playground
        uses: actions/checkout@v4

      - name: Validate private repository token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if [[ -z "$PRIVATE_TOKEN" ]]; then
            echo "::error::PRIVATE_REPO_TOKEN or GH_TOKEN is required."
            exit 2
          fi

      - name: Checkout traffic branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: target
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test dependencies
        working-directory: target/edge
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Compile
        working-directory: target
        run: python -m compileall -q edge/src

      - name: Check undefined names in changed runtime and tests
        working-directory: target/edge
        run: |
          python -m ruff check --select F             src/analysis/analysis_pipeline.py             src/analysis/artifacts.py             src/analysis/background             src/analysis/traffic/renderer.py             src/analysis/traffic/traffic_stage.py             src/analysis/traffic/waiting_detector.py             src/tracking/bytetrack.py             src/utils/config.py             scripts/replay_traffic_heatmaps.py             tests/test_analysis_pipeline.py             tests/test_background_collector.py             tests/test_background_stage.py             tests/test_bytetrack_config.py             tests/test_config.py             tests/test_masked_median.py             tests/test_pi_detector_config.py             tests/test_traffic_renderer.py             tests/test_traffic_stage.py             tests/test_vehicle_scale.py             tests/test_waiting_detector.py

      - name: Run focused regression suite
        working-directory: target/edge
        run: |
          python -m pytest -q             tests/test_vehicle_scale.py             tests/test_waiting_detector.py             tests/test_background_collector.py             tests/test_masked_median.py             tests/test_background_stage.py             tests/test_analysis_pipeline.py             tests/test_config.py             tests/test_pi_detector_config.py             tests/test_bytetrack_config.py             tests/test_route_heatmap.py             tests/test_traffic_renderer.py             tests/test_traffic_stage.py             tests/test_traffic_replay.py             tests/test_heatmap_storage.py


      - name: Replay historical reference tracks through new analysis
        working-directory: target/edge
        run: |
          rm -rf /tmp/traffic-quality-replay
          PYTHONPATH=src python scripts/replay_traffic_heatmaps.py --tracks ../experiments/intersection_analysis/heatmaps/tracks_bytetrack.csv --image ../experiments/intersection_analysis/heatmaps/frame.jpg --out /tmp/traffic-quality-replay --conf 0.5 --grid-width 384 --grid-height 288
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = Path("/tmp/traffic-quality-replay/traffic_analysis.sqlite3")
          with sqlite3.connect(db) as connection:
              event_count = connection.execute("SELECT COUNT(*) FROM waiting_events").fetchone()[0]
              track_count = connection.execute("SELECT COUNT(DISTINCT track_id) FROM waiting_events").fetchone()[0]
          print(f"reference replay waiting events={event_count}, unique waiting tracks={track_count}")
          assert event_count >= 50, "waiting-event recall regressed on the historical reference tracks"
          PY
