name: Traffic analysis quality fixes
# Final Superpowers verification for live vehicle scale + sneckdown implementation. PR #16 final review verification.

on:
  push:
    branches:
      - traffic-analysis-quality-fixes
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPOSITORY: Persie0/traffic-counting-light-main
  TARGET_REF: refactor/simplify-traffic-heatmap-config

jobs:
  final-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Playground
        uses: actions/checkout@v4

      - name: Validate private repository token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if [[ -z "$PRIVATE_TOKEN" ]]; then
            echo "::error::PRIVATE_REPO_TOKEN or GH_TOKEN is required."
            exit 2
          fi

      - name: Checkout traffic branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: target
          fetch-depth: 0
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: target/edge/pyproject.toml

      - name: Install edge dev environment
        working-directory: target/edge
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,pi]'

      - name: Compile runtime
        working-directory: target
        run: python -m compileall -q edge/src

      - name: Check undefined names in changed runtime and tests
        working-directory: target/edge
        run: |
          python -m ruff check --select F \
            src/analysis/analysis_pipeline.py \
            src/analysis/traffic/vehicle_scale.py \
            src/analysis/traffic/occupied_area.py \
            src/analysis/traffic/heatmap_state.py \
            src/analysis/traffic/waiting_detector.py \
            src/analysis/traffic/renderer.py \
            src/analysis/traffic/traffic_stage.py \
            src/analysis/traffic/storage.py \
            src/utils/config.py \
            scripts/replay_traffic_heatmaps.py \
            tests/test_vehicle_scale.py \
            tests/test_waiting_detector.py \
            tests/test_occupied_area.py \
            tests/test_traffic_renderer.py \
            tests/test_analysis_pipeline.py \
            tests/test_traffic_stage.py \
            tests/test_heatmap_storage.py \
            tests/test_config.py \
            tests/test_traffic_replay.py

      - name: Reject stale runtime fallback key
        working-directory: target
        run: |
          if grep -R --line-number "waiting_radius_fraction" edge/src edge/configs/runtime edge/docs; then
            echo "::error::legacy waiting_radius_fraction remains in runtime/config/user docs"
            exit 1
          fi

      - name: Run full edge test suite
        working-directory: target/edge
        run: python -m pytest -q

      - name: Historical scene-scale replay
        working-directory: target/edge
        run: |
          rm -rf /tmp/vehicle-scale-sneckdown-replay
          PYTHONPATH=src python scripts/replay_traffic_heatmaps.py \
            --tracks ../experiments/intersection_analysis/heatmaps/tracks_bytetrack.csv \
            --image ../experiments/intersection_analysis/heatmaps/frame.jpg \
            --out /tmp/vehicle-scale-sneckdown-replay \
            --conf 0.5 \
            --grid-width 384 \
            --grid-height 288
          python - <<'PY'
          import json
          import sqlite3
          from pathlib import Path

          out = Path("/tmp/vehicle-scale-sneckdown-replay")
          benchmark = json.loads((out / "replay_benchmark.json").read_text())
          with sqlite3.connect(out / "traffic_analysis.sqlite3") as connection:
              events = connection.execute("SELECT COUNT(*) FROM waiting_events").fetchone()[0]
              tracks = connection.execute("SELECT COUNT(DISTINCT track_id) FROM waiting_events").fetchone()[0]

          print("historical_waiting_events=", events)
          print("historical_unique_waiting_tracks=", tracks)
          print(json.dumps(benchmark, indent=2, sort_keys=True))
          assert 50 <= events <= 200
          assert benchmark["analysis_ms_per_frame"] < 1.0
          assert benchmark["scale_ring_bytes"] == 2101248
          assert benchmark["scale_numeric_bytes"] + benchmark["occupied_numeric_bytes"] < 2 * 1024 * 1024
          assert (out / "vehicle_bbox_height_heatmap.png").exists()
          assert (out / "sneckdown_heatmap_vehicles.png").exists()
          PY

      - name: Verify diff hygiene
        working-directory: target
        run: |
          git diff --check origin/main...HEAD
          git diff --stat origin/main...HEAD
