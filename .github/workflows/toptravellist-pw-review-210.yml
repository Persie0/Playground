name: TopTravelList Palau validation
on:
  push:
    branches: ['ci/toptravellist-pw-review-210']
    paths: ['.github/workflows/toptravellist-pw-review-210.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: data/palau-worldwide-rankings
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and generate
        run: |
          set -euo pipefail
          git config user.name toptravellist-editorial-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            test "$(git diff --name-only --diff-filter=U)" = "README.md"
            git checkout --theirs README.md
            git add README.md
            git commit --no-edit
          fi
          python -m pip install -r requirements.txt
          python scripts/validate.py
          python scripts/check_city_benchmarks.py
          python scripts/check_sight_benchmarks.py
          python scripts/check_new_country_reviews.py --country PW
          python scripts/generate_rankings.py --country PW
          python scripts/generate_rankings.py --check
          python scripts/rank.py --kind cities --limit 60 
          python scripts/rank.py --kind sights --limit 60 
          python - <<'PY'
          from pathlib import Path
          from decimal import Decimal
          import yaml
          for kind,count in [('cities',7),('sights',22)]:
              files=list(Path('countries/PW',kind).glob('*.yaml'))
              assert len(files)==count
              txt=Path('methodology/reviews/PW',kind+'.md').read_text()
              for f in files:
                  d=yaml.safe_load(f.read_text())
                  section=txt.split('## '+d['id']+' — ',1)[1].split('\n## ',1)[0]
                  vals=[d['scores'][k] for k in ('impact','uniqueness','significance','experience','depth')]
                  if None not in vals:
                      total=sum(Decimal(str(v))*w for v,w in zip(vals,[30,25,20,15,10]))/10
                      assert f'Overall: {total:.2f}/100.' in section, d['id']
                  else:
                      assert 'Overall: unranked.' in section
              assert Path('countries/PW',kind+'.md').read_text().count('https://www.google.com/maps/search/?api=1&query=')==2*count
          print('PASS: PW re-review counts, totals and map links')
          PY
          git add README.md countries/PW/cities.md countries/PW/sights.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Generate PW ranking pages and country directory'
          fi
          git push origin HEAD:refs/heads/data/palau-worldwide-rankings
