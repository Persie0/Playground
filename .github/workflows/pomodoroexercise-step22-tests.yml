name: FocusMove Step 22 responsive and accessibility tests

on:
  push:
    paths:
      - '.github/workflows/pomodoroexercise-step22-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private FocusMove UX branch on ephemeral public runner
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/22-responsive-accessibility-polish https://github.com/Persie0/pomodoroexercise.git source
      - name: Format changed Flutter files (on runner only)
        shell: bash
        working-directory: source
        run: |
          dart format lib/src/screens/home_shell.dart lib/src/screens/timer_home.dart lib/src/screens/history_home.dart lib/src/screens/personal_library_screens.dart lib/src/screens/insights_panel.dart lib/src/app.dart test/step22_visual_accessibility_test.dart
      - name: Analyze and test (no artifacts uploaded)
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test --reporter expanded
