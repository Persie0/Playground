name: Photosphere checkpoint294 original BA pose setter provenance
on:
  push:
    branches: [research/photosphere-checkpoint294-solve-pose-writeback]
    paths: ['.github/workflows/photosphere-checkpoint294-pose-provenance.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint294-native-provenance
  cancel-in-progress: false
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out public Playground
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install original ARM64 decoder
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools
      - name: Get checksum-pinned original GCam 8.8.225 APK
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Original estimator to solver to indexed rosette writeback
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          raw=Path('original.so').read_bytes()
          digest=hashlib.sha256(raw).hexdigest()
          assert digest=='878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1'
          d=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          regions={
            'finalizer_branch_callback':(0x11b9c0,0x11ba50),
            'estimator_plus48_alignment':(0x11ec84,0x11eea4),
            'bundle_adjuster_virtual_bridge':(0x122fcc,0x123078),
            'global_focal_bundle_adjuster_entry':(0x1287c0,0x128a20),
            'post_solve_quaternion_indexed_writeback':(0x129750,0x12986c),
            'rosette_indexed_pose_methods':(0x344818,0x344b28),
            'rosette_indexed_pose_setter_plus88':(0x34565c,0x3456f4),
            'rosette_copy_constructor':(0x343e74,0x343fbc),
            'line_aligner_constructor':(0x303b08,0x303c00),
            'line_aligner_entry':(0x303cf8,0x303d98),
            'finalizer_followup_type':(0x11bffc,0x11c060),
          }
          sections={}
          for k,(a,b) in regions.items():
            x=[{'pc':hex(i.address),'instruction':(i.mnemonic+' '+i.op_str).strip()} for i in d.disasm(raw[a:b],a)]
            assert len(x)==(b-a)//4,(k,len(x))
            sections[k]=x
            print('CHECKPOINT294_SECTION',k,len(x))
            for v in x:print('CHECKPOINT294_ARM64',k,v['pc'],v['instruction'])
          rel={}
          with Path('original.so').open('rb') as fh:
            elf=ELFFile(fh)
            for sec in elf.iter_sections():
              if sec['sh_type']!='SHT_RELA':continue
              for it in sec.iter_relocations():
                if it['r_info_type']==1027:rel[int(it['r_offset'])]=int(it['r_addend'])
          vptrs={'estimator':'0x3fdca0','rosette':'0x40dc10'}
          slots={}
          for label,ptr in vptrs.items():
            obj=int(ptr,16)
            slots[label]={hex(off):hex(rel[obj+off]) for off in range(0x10,0xa8,8) if obj+off in rel}
          assert slots['estimator']['0x48']=='0x11ec84'
          assert slots['rosette']['0x90']=='0x3456f4'
          print('CHECKPOINT294_VTABLE_SLOTS',json.dumps(slots))
          # Recover original exact register/stack writes from GFL entry through
          # its per-index setter. These observations do not by themselves
          # prove every alias; follow x4/x24 and sp+0x20 separately.
          full=list(d.disasm(raw[0x1287c0:0x129870],0x1287c0))
          index_provenance=[
            {'pc':hex(i.address),'instruction':(i.mnemonic+' '+i.op_str).strip()}
            for i in full
            if any(term in i.op_str for term in ('[sp, #0x20]','[sp, #0x18]','x23','x24'))
              and (i.mnemonic in ('str','stp','ldr','ldp','mov','add','sub') or i.address>=0x129750)
          ]
          for item in index_provenance:
            print('CHECKPOINT294_ORIGINAL_OWNER_CANDIDATE',item['pc'],item['instruction'])
          assert slots['rosette']['0x88']=='0x34565c'
          assert sections['rosette_indexed_pose_setter_plus88'][0]['pc']=='0x34565c'
          print('CHECKPOINT294_INDEXED_SETTER_ORIGINAL_SLOT_PASSED')

          out={
            'original_elf_sha256':digest,
            'evidence':sections,
            'original_optimizer_owner_register_cues':index_provenance,
            'relocated_original_method_slots':slots,
            'native_whole_session_executed':False,
            'index_correspondence_proven':False,
            'optimizer_pose_mutation_verified':False,
          }
          Path('checkpoint294-original-optimizer-pose-disassembly.json').write_text(json.dumps(out,indent=2)+'\n')
          print('CHECKPOINT294_ORIGINAL_SOLVER_WRITEBACK_DISASSEMBLY_PASSED')
          PY
      - name: Checkout exact private research commit in public Playground only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 4b449e029fafb9d7d863ed78d22ccb15ed5fbc82
          path: decompile
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify original indexed writeback receiver, original method bytes and vptr
        run: |
          set -euo pipefail
          test "$(git -C decompile rev-parse HEAD)" = 4b449e029fafb9d7d863ed78d22ccb15ed5fbc82
          python3 decompile/research/photosphere/checkpoint294/verify_original_solver_rosette_indexed_writeback.py original.so --output checkpoint294-original-indexed-writeback.json | tee checkpoint294-original-indexed-writeback.log
          grep -q '^CHECKPOINT294_ORIGINAL_INDEXED_WRITEBACK_CHAIN_PASSED' checkpoint294-original-indexed-writeback.log
      - name: Execute original indexed pose setter on bounded native cases
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages --quiet unicorn
          mkdir -p decompile/research/native
          cp original.so decompile/research/native/liblightcycle.so
          (
            cd decompile
            python3 research/photosphere/checkpoint294/native_original_indexed_rosette_pose_setter.py | tee ../checkpoint294-original-indexed-native.log
            cp checkpoint294-original-indexed-pose-fixtures.json ..
          )
          grep -q 'CHECKPOINT294_ORIGINAL_INDEXED_SET_CASES_PASSED 12' checkpoint294-original-indexed-native.log
      - name: Checkout exact PhotosphereCleanroom pose-writeback PR snapshot
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: cfeb93e35b2c9f4df0aee69924729928674abc7f
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify Rust original-byte oracle and full Rust library suite
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = cfeb93e35b2c9f4df0aee69924729928674abc7f
          python3 - <<'PY'
          import json
          with open('checkpoint294-original-indexed-pose-fixtures.json') as f: original=json.load(f)
          with open('app/tests/fixtures/native_indexed_pose_setter_294.json') as f: frozen=json.load(f)
          assert original == frozen, "Rust frozen native oracle differs from fresh executed original ARM64"
          print('CHECKPOINT294_RUST_FIXTURE_EQUALS_EXECUTED_ORIGINAL_PASSED',len(original['cases']))
          PY
          cd app
          git diff --check
          rustfmt --edition 2021 --check src/native_rosette_pose_vector.rs
          cargo test --lib checkpoint294_original_indexed_rosette_setter_matches_arm64_word_bytes -- --nocapture
          cargo test --lib
      - name: Publish text-only original evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint294-original-optimizer-pose-disassembly
          path: |
            checkpoint294-original-optimizer-pose-disassembly.json
            checkpoint294-original-indexed-writeback.json
            checkpoint294-original-indexed-writeback.log
            checkpoint294-original-indexed-pose-fixtures.json
            checkpoint294-original-indexed-native.log
          if-no-files-found: warn
          retention-days: 14
