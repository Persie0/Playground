name: Image Enhancer background processing validation
on:
  push:
    branches:
      - background-media-processing-validation-20260928
    paths:
      - '.github/workflows/image-background-validation.yml'
permissions:
  contents: read
env:
  APP_REPOSITORY: Persie0/image_enhancer
  APP_REF: feature/android-background-media-processing-20260928
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: app
        run: flutter pub get
      - name: Foreground processing tests
        working-directory: app
        run: |
          flutter test \
            test/android_media_processing_config_test.dart \
            test/android_foreground_service_manifest_test.dart \
            test/image_processing_job_test.dart \
            test/image_processing_notification_throttle_test.dart \
            test/image_processing_service_test.dart \
            test/image_processing_recovery_test.dart \
            test/upscale_cancellation_regression_test.dart \
            test/background_image_processing_regression_test.dart
      - name: Nested upscaler tests
        working-directory: app
        run: flutter test flutter_super_resolution/test
      - name: Full tests
        working-directory: app
        run: flutter test
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Debug APK
        working-directory: app
        run: flutter build apk --debug
