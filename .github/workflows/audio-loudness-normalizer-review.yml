name: Audio Loudness Normalizer PR review

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audio-loudness-normalizer-review.yml
      - audio-loudness-normalizer-review-target.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-loudness-normalizer-review
  cancel-in-progress: true

jobs:
  flutter-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_PAT: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
    steps:
      - name: Check out private Audio Loudness Normalizer
        uses: actions/checkout@v4
        with:
          repository: Persie0/AudioLoudnessNormalizer
          ref: feat/complete-normalizer-features
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: source
      - name: Authorize Git Flutter dependencies (only if private)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GH_PAT" ]; then
            git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          fi
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Generate native runner projects
        working-directory: source
        run: bash tool/bootstrap.sh
      - name: Analyze Dart code
        working-directory: source
        run: flutter analyze
      - name: Unit tests
        working-directory: source
        run: flutter test --reporter expanded
      - name: Install FFmpeg and FFprobe for native command regression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Exercise real FFmpeg multitrack and MP3 exports
        working-directory: source
        run: bash tool/check_multitrack.sh
      - name: Build Android debug APK
        working-directory: source
        run: flutter build apk --debug
      - name: Upload debug build
        uses: actions/upload-artifact@v4
        with:
          name: audio-loudness-normalizer-debug
          path: source/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios-check:
    needs: flutter-check
    runs-on: macos-15
    timeout-minutes: 80
    env:
      GH_PAT: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: Persie0/AudioLoudnessNormalizer
          ref: feat/complete-normalizer-features
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: source
      - name: Authorize Git Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$GH_PAT" ]; then
            git config --global url."https://x-access-token:${GH_PAT}@github.com/".insteadOf "https://github.com/"
          fi
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Generate native runner projects
        working-directory: source
        run: bash tool/bootstrap.sh
      - name: Build iOS without signing
        working-directory: source
        run: flutter build ios --no-codesign
