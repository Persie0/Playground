name: Noise Remover R8 release verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noise-remover-r8-release-verify.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag/SHA in Persie0/noise_remover
        required: true
        default: optimize/agp94-r8-analyzer
        type: string

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/noise_remover
  APP_REF: ${{ inputs.ref || 'optimize/agp94-r8-analyzer' }}

jobs:
  release-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if [[ -z "$PRIVATE_TOKEN" ]]; then
            echo "::error::Set PRIVATE_REPO_TOKEN (Contents: read on Persie0/noise_remover)."
            exit 2
          fi

      - name: Checkout private Noise Remover
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: android-actions/setup-android@v3

      - name: Setup AGP 9.4 compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install dependencies and Android components
        working-directory: private-app
        run: |
          flutter --version
          flutter pub get
          printf 'flutter.sdk=%s\nsdk.dir=%s\n' "$FLUTTER_ROOT" "$ANDROID_SDK_ROOT" > android/local.properties
          yes | sdkmanager "ndk;29.0.14206865" >/dev/null

      - name: Supply CI gradlew shim
        run: |
          cat > private-app/android/gradlew <<'EOF'
          #!/usr/bin/env bash
          set -e
          exec gradle "$@"
          EOF
          chmod +x private-app/android/gradlew
          private-app/android/gradlew --version

      - name: Create disposable release keystore
        working-directory: private-app
        run: |
          keytool -genkeypair -v \
            -keystore android/app/ci-release.jks \
            -storepass android \
            -keypass android \
            -alias ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=CI, OU=CI, O=CI, L=CI, S=CI, C=US"
          printf '%s\n' \
            'storePassword=android' \
            'keyPassword=android' \
            'keyAlias=ci' \
            'storeFile=ci-release.jks' \
            > android/key.properties

      - name: Verify Android toolchain and release dependency graph
        working-directory: private-app/android
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:dependencies --configuration releaseRuntimeClasspath | tee ../../release-dependencies.txt
          ./gradlew --no-daemon :app:dependencyInsight --configuration releaseRuntimeClasspath --dependency work-runtime | tee ../../work-runtime.txt
          ./gradlew --no-daemon :app:dependencyInsight --configuration releaseRuntimeClasspath --dependency room-runtime | tee ../../room-runtime.txt

      - name: Run standalone R8 Configuration Analyzer
        working-directory: private-app/android
        run: |
          ./gradlew --no-daemon :app:analyzeReleaseR8Config --stacktrace
          REPORT="app/build/reports/r8/r8-config-analyzer-release.html"
          test -s "$REPORT"
          cp "$REPORT" ../../r8-config-analyzer-release.html

      - name: Summarize R8 analyzer report
        working-directory: private-app
        run: |
          python3 - <<'PY'
          import html, re
          from pathlib import Path
          p = Path('../r8-config-analyzer-release.html')
          text = p.read_text(errors='ignore')
          text = re.sub(r'<script\b[^>]*>.*?</script>', ' ', text, flags=re.S|re.I)
          text = re.sub(r'<style\b[^>]*>.*?</style>', ' ', text, flags=re.S|re.I)
          text = re.sub(r'<[^>]+>', '\n', text)
          text = html.unescape(text)
          lines = [' '.join(x.split()) for x in text.splitlines()]
          lines = [x for x in lines if x]
          keywords = ('score', 'keep', 'optimization', 'obfuscation', 'shrinking', 'prevent', 'rule')
          selected = []
          for line in lines:
              if any(k in line.lower() for k in keywords):
                  selected.append(line)
          print('\n'.join(selected[:500]))
          Path('../r8-analyzer-summary.txt').write_text('\n'.join(selected))
          PY

      - name: Scan dependency consumer rules for broad keeps
        working-directory: private-app
        run: |
          python3 - <<'PY'
          import re, zipfile
          from pathlib import Path
          cache = Path.home()/'.gradle/caches/modules-2/files-2.1'
          out = []
          broad = re.compile(r'^\s*-keep(?:,[^ ]+)?\s+(?:class|interface|enum)\s+([^\s{]+)')
          for aar in cache.rglob('*.aar'):
              try:
                  with zipfile.ZipFile(aar) as z:
                      for name in z.namelist():
                          low = name.lower()
                          if not any(k in low for k in ('proguard', 'consumer-rules', 'consumer_rules')):
                              continue
                          try:
                              text = z.read(name).decode('utf-8', 'ignore')
                          except Exception:
                              continue
                          for line in text.splitlines():
                              m = broad.match(line)
                              if not m:
                                  continue
                              target = m.group(1)
                              if '**' in target or target in ('*', '**'):
                                  out.append((str(aar), name, line.strip()))
              except zipfile.BadZipFile:
                  pass
          out.sort(key=lambda x: (x[0], x[1], x[2]))
          report = '\n'.join(' | '.join(x) for x in out)
          print(report[:60000])
          Path('../broad-consumer-keeps.txt').write_text(report)
          PY

      - name: Run Flutter tests
        working-directory: private-app
        run: flutter test

      - name: Configure release build resources
        working-directory: private-app
        run: |
          sed -i \
            -e '/^org\.gradle\.jvmargs=/d' \
            -e '/^org\.gradle\.workers\.max=/d' \
            -e '/^org\.gradle\.parallel=/d' \
            -e '/^org\.gradle\.daemon=/d' \
            -e '/^kotlin\.compiler\.execution\.strategy=/d' \
            android/gradle.properties
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xms2g -Xmx10g -XX:+UseParallelGC -Dfile.encoding=UTF-8
          org.gradle.workers.max=1
          org.gradle.parallel=false
          org.gradle.daemon=false
          kotlin.compiler.execution.strategy=in-process
          EOF

      - name: Build optimized release bundle
        working-directory: private-app
        env:
          CARGO_BUILD_JOBS: '2'
          GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false'
        run: flutter build appbundle --release --obfuscate --split-debug-info=build/debug-info

      - name: Extract exact R8 metadata
        working-directory: private-app
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          aab = Path('build/app/outputs/bundle/release/app-release.aab')
          with zipfile.ZipFile(aab) as z:
              raw = z.read('BUNDLE-METADATA/com.android.tools/r8.json')
          data = json.loads(raw)
          Path('../r8-metrics.json').write_text(json.dumps(data, indent=2, sort_keys=True))
          print(json.dumps(data, indent=2, sort_keys=True))
          PY

      - name: Upload R8 audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noise-remover-agp94-r8-audit
          path: |
            private-app/build/app/outputs/bundle/release/app-release.aab
            private-app/build/app/outputs/mapping/release/
            release-dependencies.txt
            work-runtime.txt
            room-runtime.txt
            r8-config-analyzer-release.html
            r8-analyzer-summary.txt
            broad-consumer-keeps.txt
            r8-metrics.json
          if-no-files-found: ignore
          retention-days: 7
