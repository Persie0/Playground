name: Photo Sphere offscreen guidance regression RED
# Assert that the baseline has no offscreen scan hint.
on:
  push:
    branches: [main]
    paths: [".github/workflows/photosphere-guidance-red.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guidance-red:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: 05cb208447a146f1786244a43605ed1007870766
    steps:
      - uses: actions/checkout@v4
        with:
          path: playground
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 05cb208447a146f1786244a43605ed1007870766
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: engine
          persist-credentials: false
      - name: Reuse verified unchanged Rust libraries
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "capture-host-6e0fc91056f9" --repo Persie0/PhotosphereCleanroom --pattern PhotoSphere-preview.apk --dir "$RUNNER_TEMP/native-base"
          python3 - <<'PY'
          import hashlib,os,pathlib,zipfile,json,subprocess
          comparison=json.loads(subprocess.check_output(["gh","api","repos/Persie0/PhotosphereCleanroom/compare/6e0fc91056f9facf04e114700c324d4fd2e57847..."+os.environ["SOURCE_SHA"]],text=True))
          native=[f["filename"] for f in comparison.get("files",[]) if f["filename"].startswith("src/") or f["filename"] in ["Cargo.toml","Cargo.lock","rust-toolchain.toml"]]
          assert not native,"Native source changed; rebuild it instead of reusing libraries"
          with zipfile.ZipFile(pathlib.Path(os.environ["RUNNER_TEMP"])/"native-base/PhotoSphere-preview.apk") as apk:
              for abi in ["arm64-v8a","x86_64"]:
                  data=apk.read("lib/"+abi+"/libphotosphere.so")
                  out=pathlib.Path("engine/android/app/src/main/jniLibs")/abi/"libphotosphere.so"
                  out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
                  print(abi+" native SHA-256 "+hashlib.sha256(data).hexdigest())
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true
      - name: Unit tests, lint and installable packages
        working-directory: engine/android
        run: python3 ../../playground/scripts/run_private_rust_check.py recovery-build gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable emulator KVM access
        run: sudo chmod 666 /dev/kvm
      - name: Expect missing offscreen hint
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -memory 3072
          script: python3 playground/scripts/expect_photosphere_guidance_red.py
      - name: Preserve failure diagnostics privately
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: python3 playground/scripts/preserve_photosphere_diagnostics.py engine guidance-red
