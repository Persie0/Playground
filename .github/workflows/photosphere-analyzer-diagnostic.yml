name: Photosphere analyzer diagnostic

on:
  push:
    branches: [photosphere-analyzer-diagnostic]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout current private fix
        uses: actions/checkout@v5
        with:
          repository: Persie0/Photosphere-
          ref: fix/capture-guidance-3d
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: cd app && flutter pub get >/dev/null

      - name: Check patch-file formatting
        id: patch_format
        continue-on-error: true
        run: |
          cd app
          dart format --output=none --set-exit-if-changed \
            lib/src/models/capture_geometry.dart \
            lib/src/models/vec3.dart \
            lib/src/screens/capture_screen.dart \
            lib/src/services/capture_sharpness.dart \
            lib/src/services/motion_pose_tracker.dart \
            lib/src/services/native_orientation.dart \
            test/capture_geometry_test.dart \
            test/native_orientation_test.dart \
            tool/configure_platforms.dart >/dev/null

      - name: Check repository-wide formatting
        id: repo_format
        continue-on-error: true
        run: cd app && dart format --output=none --set-exit-if-changed lib test tool >/dev/null

      - name: Run Flutter analyzer
        id: analyze
        continue-on-error: true
        run: cd app && flutter analyze >/dev/null

      - name: Enforce patch and analyzer gates
        if: always()
        env:
          PATCH_FORMAT: ${{ steps.patch_format.outcome }}
          ANALYZE: ${{ steps.analyze.outcome }}
        run: test "$PATCH_FORMAT" = success -a "$ANALYZE" = success
