name: Photosphere checkpoint346 original finalizer four FOV vector transfers
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint346-source.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint346-source
  cancel-in-progress: false
jobs:
  original-finalizer-four-vectors:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact private research SHA read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 0ec13ef729a7c09aea22a95a3a018bf023350099
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Pin source and install emulation plus disassembly
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0ec13ef729a7c09aea22a95a3a018bf023350099"
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint346/scan_original_finalizer_postgraph.py research/photosphere/checkpoint346/native_original_finalizer_four_vector_join.py research/photosphere/checkpoint346/scan_original_postgraph_callees.py
      - name: Retrieve checksum-pinned original ARM64 binary
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Survey original finalizer and native registration source instructions
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint346/scan_original_finalizer_postgraph.py original.so --output checkpoint346-static.json | tee checkpoint346-static.log
          grep -q 'CHECKPOINT346_STATIC_SOURCE_PASS 5 ' checkpoint346-static.log
      - name: Run original finalizer four-vector copy on native source-produced estimator
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint346/native_original_finalizer_four_vector_join.py original.so --output checkpoint346-four-vectors.json | tee checkpoint346-four-vectors.log
          grep -q 'CHECKPOINT346_FOUR_VECTOR_ORIGINAL_PASS 15 31' checkpoint346-four-vectors.log
      - name: Identify original postgraph helper functions and potential status writes
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint346/scan_original_postgraph_callees.py original.so --output checkpoint346-callees.json | tee checkpoint346-callees.log
          grep -q 'CHECKPOINT346_POSTGRAPH_CALLEE_SCAN_PASS 7 ' checkpoint346-callees.log
      - name: Archive only nonproprietary source outcome JSON and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-checkpoint346-source
          path: |
            checkpoint346-static.json
            checkpoint346-static.log
            checkpoint346-four-vectors.json
            checkpoint346-four-vectors.log
            checkpoint346-callees.json
            checkpoint346-callees.log
          if-no-files-found: warn
          retention-days: 7
