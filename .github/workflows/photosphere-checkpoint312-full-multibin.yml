name: Photosphere checkpoint312 full original multi-bin
on:
  push:
    branches: [research/photosphere-checkpoint312-full-multibin]
    paths: [.github/workflows/photosphere-checkpoint312-full-multibin.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-multibin:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install exact ARM64 source execution dependencies
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools unicorn
      - name: Fetch original GCam 8.8.225 APK and pin original ARM64 binary
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk'
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Checkout pinned checkpoint312 original emulator
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 53be5d0a8cbde805ce9d54ae2cabd3e38d87b50e
          path: native-research
          sparse-checkout: |
            research/photosphere/checkpoint312
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Execute full original ARM64 bin iteration and actual affine lookup
        run: |
          set -euo pipefail
          test "$(git -C native-research rev-parse HEAD)" = 53be5d0a8cbde805ce9d54ae2cabd3e38d87b50e
          python3 native-research/research/photosphere/checkpoint312/verify_original_multibin.py original.so --output checkpoint312-original-loop-pins.json | tee checkpoint312-original-loop-pins.log
          python3 native-research/research/photosphere/checkpoint312/native_original_multibin.py original.so --output checkpoint312-original-multibin.json | tee checkpoint312-native-multibin.log
          grep -q '^CHECKPOINT312_ORIGINAL_LOOP_SOURCE_VERIFIED' checkpoint312-original-loop-pins.log
          grep -q '^CHECKPOINT312_ORIGINAL_MULTIBIN_PASS 12 52 30' checkpoint312-native-multibin.log
          grep -q '^CHECKPOINT312_ORIGINAL_COMPACT_ORACLE_PASS 12 52 30' checkpoint312-native-multibin.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint312-original-native-multibin
          path: |
            checkpoint312-native-multibin.log
            checkpoint312-original-multibin.json
            checkpoint312-original-multibin-compact.json
            checkpoint312-original-loop-pins.log
            checkpoint312-original-loop-pins.json
          retention-days: 14
