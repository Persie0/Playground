name: Photosphere checkpoint312 full original multi-bin
on:
  push:
    branches: [research/photosphere-checkpoint312-full-multibin]
    paths: [.github/workflows/photosphere-checkpoint312-full-multibin.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-multibin:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install exact ARM64 source execution dependencies
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools unicorn
      - name: Fetch original GCam 8.8.225 APK and pin original ARM64 binary
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk'
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Checkout pinned checkpoint312 original emulator
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 1db8db759102782b79af78e5a9fbed49543232b2
          path: native-research
          sparse-checkout: |
            research/photosphere/checkpoint312
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Execute full original ARM64 bin iteration and actual affine lookup
        run: |
          set -euo pipefail
          test "$(git -C native-research rev-parse HEAD)" = 1db8db759102782b79af78e5a9fbed49543232b2
          python3 native-research/research/photosphere/checkpoint312/verify_original_multibin.py original.so --output checkpoint312-original-loop-pins.json | tee checkpoint312-original-loop-pins.log
          python3 native-research/research/photosphere/checkpoint312/native_original_multibin.py original.so --output checkpoint312-original-multibin.json | tee checkpoint312-native-multibin.log
          grep -q '^CHECKPOINT312_ORIGINAL_LOOP_SOURCE_VERIFIED' checkpoint312-original-loop-pins.log
          grep -q '^CHECKPOINT312_ORIGINAL_MULTIBIN_PASS 12 52 30' checkpoint312-native-multibin.log
          grep -q '^CHECKPOINT312_ORIGINAL_COMPACT_ORACLE_PASS 12 52 30' checkpoint312-native-multibin.log
      - name: Checkout pinned PhotosphereCleanroom original multi-bin parity regression
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: b1554d4a6d8be7894bff1269ff46cde38ed4d530
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Fresh original 12-scene multi-bin oracle equals Rust and full suite
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = b1554d4a6d8be7894bff1269ff46cde38ed4d530
          python3 - <<'PY'
          from pathlib import Path
          import json
          native=json.loads(Path('checkpoint312-original-multibin-compact.json').read_text())
          rust=json.loads(Path('app/tests/fixtures/native_original_multibin_312.json').read_text())
          if native!=rust:
              for key in sorted(set(native)|set(rust)):
                  if native.get(key)==rust.get(key):continue
                  if key=="cases":
                      for i,(x,y) in enumerate(zip(native[key],rust[key])):
                          for field in sorted(set(x)|set(y)):
                              if x.get(field)!=y.get(field):
                                  print('CHECKPOINT312_ORIGINAL_RUST_CASE_DIFF',i,x.get('name'),field,repr(x.get(field))[:350],repr(y.get(field))[:350])
                  else:
                      print('CHECKPOINT312_ORIGINAL_RUST_TOP_DIFF',key,repr(native.get(key))[:350],repr(rust.get(key))[:350])
              raise AssertionError('original source-native and Rust oracle diverge')
          assert native['original_native_scenario_count']==12
          assert native['original_total_fmod_calls']==52
          assert native['original_total_affine_calls']==30
          print('CHECKPOINT312_FRESH_ORIGINAL_RUST_EQUAL',len(native['cases']),native['original_total_fmod_calls'],native['original_total_affine_calls'])
          PY
          cd app
          git diff --check
          rustfmt --edition 2021 --check src/native_line_multibin.rs
          cargo test --lib checkpoint312_ -- --nocapture
          cargo test --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint312-original-native-multibin
          path: |
            checkpoint312-native-multibin.log
            checkpoint312-original-multibin.json
            checkpoint312-original-multibin-compact.json
            checkpoint312-original-loop-pins.log
            checkpoint312-original-loop-pins.json
          retention-days: 14
