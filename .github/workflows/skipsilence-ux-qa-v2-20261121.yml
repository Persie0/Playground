name: SkipSilencePlayer Impeccable UX follow-up
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/skipsilence-ux-qa-v2-20261121.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/SkipSilencePlayer
          ref: 279dbcc52103c9a76f257b13e1313af75647afce
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: source
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Android unit tests and APK
        working-directory: source/kotlin-android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: SkipSilencePlayer-UX-Followup-debug-APK
          path: source/kotlin-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/SkipSilencePlayer
          ref: 279dbcc52103c9a76f257b13e1313af75647afce
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: source
      - name: Build iOS Simulator
        working-directory: source/swift-ios
        run: |
          set -o pipefail
          xcodebuild \
            -project SkipSilencePlayer.xcodeproj \
            -scheme SkipSilencePlayer \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .derived \
            CODE_SIGNING_ALLOWED=NO \
            build
  emulator:
    needs: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SkipSilencePlayer-UX-Followup-debug-APK
          path: apk
      - name: Prepare UI smoke test
        run: |
          cat > smoke.sh <<'SMOKE'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p screenshots
          adb install apk/app-debug.apk
          adb shell am start -n at.persie0.skipsilenceplayer/.MainActivity
          sleep 7
          adb exec-out screencap -p > screenshots/01-library.png
          adb shell uiautomator dump /sdcard/window.xml >/dev/null
          adb pull /sdcard/window.xml screenshots/01-library.xml >/dev/null
          python3 - <<'PY' > /tmp/settings-location.txt
          import xml.etree.ElementTree as ET, re
          root = ET.parse('screenshots/01-library.xml').getroot()
          for node in root.iter('node'):
              hay = (node.attrib.get('text') or '') + ' ' + (node.attrib.get('content-desc') or '')
              if 'Settings' in hay:
                  coordinates = [int(x) for x in re.findall(r'\d+', node.attrib.get('bounds', ''))]
                  if len(coordinates) == 4:
                      print((coordinates[0]+coordinates[2])//2, (coordinates[1]+coordinates[3])//2)
                      break
          PY
          if [ ! -s /tmp/settings-location.txt ]; then echo 'Settings action not found' >&2; exit 1; fi
          read X Y < /tmp/settings-location.txt
          adb shell input tap "$X" "$Y"
          sleep 3
          adb exec-out screencap -p > screenshots/02-settings-portrait.png
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          sleep 4
          adb exec-out screencap -p > screenshots/03-settings-landscape.png
          adb shell settings put system user_rotation 0
          adb shell settings put system font_scale 1.3
          sleep 4
          adb exec-out screencap -p > screenshots/04-settings-large-type.png
          adb shell uiautomator dump /sdcard/window-large-type.xml >/dev/null
          adb pull /sdcard/window-large-type.xml screenshots/04-settings-large-type.xml >/dev/null
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('screenshots/04-settings-large-type.xml').getroot()
          text = ' '.join((n.attrib.get('text') or '') for n in root.iter('node'))
          assert 'Double-tap seek' in text and 'Aspect' in text, 'Settings was lost after configuration change'
          print('Settings retained after font-size recreation')
          PY
          adb shell settings put system font_scale 1.0
          adb shell input keyevent 4
          sleep 2
          adb exec-out screencap -p > screenshots/05-library-after-settings.png
          # Optional real media fixture: output is inspection-only, not an
          # assertion until a verified content URI can be granted to the app.
          if command -v ffmpeg >/dev/null; then
            ffmpeg -hide_banner -loglevel error -y \
              -f lavfi -i testsrc2=size=320x180:rate=24 \
              -f lavfi -i sine=frequency=440:sample_rate=48000 \
              -t 20 -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
              -c:a aac /tmp/skipsilence-fixture.mp4
            adb shell mkdir -p /sdcard/Movies
            adb push /tmp/skipsilence-fixture.mp4 /sdcard/Movies/skipsilence-fixture.mp4 >/dev/null
            adb shell am broadcast -a android.intent.action.MEDIA_SCANNER_SCAN_FILE -d file:///sdcard/Movies/skipsilence-fixture.mp4 >/dev/null || true
            sleep 4
            adb shell content query --uri content://media/external/video/media --projection _id:_display_name > screenshots/06-media-query.txt || true
            python3 - <<'PY' > /tmp/video-id.txt
          import re
          for line in open('screenshots/06-media-query.txt'):
              if 'skipsilence-fixture.mp4' in line:
                  m = re.search(r'_id=(\d+)', line)
                  if m:
                      print(m.group(1))
                      break
          PY
            if [ -s /tmp/video-id.txt ]; then
              ID="$(cat /tmp/video-id.txt)"
              adb shell am start -W -a android.intent.action.VIEW -t video/mp4 -f 0x1 \
                -d "content://media/external/video/media/$ID" \
                -n at.persie0.skipsilenceplayer/.MainActivity || true
              sleep 7
              adb exec-out screencap -p > screenshots/07-playing-video.png
            fi
          fi
          find screenshots -maxdepth 1 -type f -printf '%f %s bytes\n'
          SMOKE
          chmod +x smoke.sh
      - name: Android emulator screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash ./smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SkipSilencePlayer-UX-Followup-screenshots
          path: screenshots/
          if-no-files-found: warn
          retention-days: 30
