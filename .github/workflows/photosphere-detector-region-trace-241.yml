name: Photo Sphere checkpoint 241 original FAST detector region thresholds
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-detector-region-trace-241.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: research/checkpoint241-native-detector-selection
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install Unicorn and ELF dependencies
        run: python3 -m pip install --break-system-packages --quiet -r research/photosphere/checkpoint218/requirements.txt
      - name: Retrieve and verify original GCam binary
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Trace original native FAST regions and thresholds
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint241/native_detector_region_trace.py > checkpoint241-regions.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=Path('checkpoint241-regions.log').read_text()
          d=json.loads(s.split('CHECKPOINT241_NATIVE_REGIONS_BEGIN\n')[1].split('\nCHECKPOINT241_NATIVE_REGIONS_END')[0])
          assert len(d['cases'])==2
          for c in d['cases']:
              trials=c['region_trials']
              assert trials
              assert len(c['tile_crops'])==64
              print('ORIGINAL_SCORE_GATE',c['name'],'helper calls',len(c['score_helper_outputs']),'aux histogram', {k:sum(z['aux']==k for z in c['score_helper_outputs']) for k in sorted(set(z['aux'] for z in c['score_helper_outputs']))})
              print('ORIGINAL_FAST_TILES',c['name'],c['tile_crops'])
              assert c['radius_call']['radius']==5
              assert c['detector_configuration']['radius']==5
              assert c['detector_configuration']['score_gate']==2
              assert c['after_optional_radius']['count']==c['detector_return'].get('keypoint_count',0)
              print('NATIVE_REGION_SUMMARY',c['name'],
                    'detector config',c['detector_configuration'],
                    'regions',len(trials),
                    'threshold_histogram',c['threshold_histogram'])
              for reg in trials[:5]:
                  print('NATIVE_REGION_RECORD',reg)
          Path('checkpoint241-regions.json').write_text(json.dumps(d,indent=2)+'\n')
          print('CHECKPOINT241_REGIONS_JSON_BEGIN')
          print(json.dumps(d,separators=(',',':')))
          print('CHECKPOINT241_REGIONS_JSON_END')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint241-native-fast-thresholds-and-regions
          path: checkpoint241-regions.json
          retention-days: 7
          if-no-files-found: warn
