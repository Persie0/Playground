name: Photosphere checkpoint334 Rust graph-group parity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint334-rust.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: photosphere-checkpoint334-rust
  cancel-in-progress: false
jobs:
  native-graph-group-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact private Rust app read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: a519f71a4f14045ff89cd5d588b72f8c48c59c52
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify pinned Rust app commit
        run: test "$(git rev-parse HEAD)" = "a519f71a4f14045ff89cd5d588b72f8c48c59c52"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - name: Compare committed native fixtures with unmodified source-oracle artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 42248221648 --repo Persie0/Playground --name photosphere-checkpoint334-group-oracle --dir original-oracle
          python3 - <<'PY'
          import json
          from pathlib import Path
          inputs=[
              ('tests/fixtures/native_original_graph_group_334.json','original-oracle/checkpoint334-native-groups.json',25),
              ('tests/fixtures/native_original_graph_cohort_334.json','original-oracle/checkpoint334-original-cohort.json',24),
          ]
          for app_path,original_path,expected in inputs:
              app=json.loads(Path(app_path).read_text())
              original=json.loads(Path(original_path).read_text())
              assert app['elf_sha256']==original['elf_sha256']
              assert app['opcode_pins']==original['opcode_pins']==18
              assert len(app['cases'])==len(original['cases'])==expected
              assert app['cases']==original['cases'], (app_path,'source-original cases do not match the executed ELF artifact')
              print('CHECKPOINT334_FIXTURE_BYTEWISE_PARITY_PASS',expected,app_path)
          PY
      - name: Original 25-case source graph winner differential
        run: |
          set -euo pipefail
          cargo test --locked --lib checkpoint334 -- --nocapture > checkpoint334-focused.log 2>&1 || { tail -n 180 checkpoint334-focused.log; exit 1; }
          grep -q 'test result: ok. 5 passed; 0 failed' checkpoint334-focused.log
          tail -n 20 checkpoint334-focused.log
      - name: Full library and integration regression
        run: |
          set -euo pipefail
          cargo test --locked --lib > checkpoint334-lib.log 2>&1 || { tail -n 180 checkpoint334-lib.log; exit 1; }
          grep '^test result:' checkpoint334-lib.log | tail -1
          cargo test --locked --tests > checkpoint334-integration.log 2>&1 || { tail -n 180 checkpoint334-integration.log; exit 1; }
          grep '^test result:' checkpoint334-integration.log | tail -8
      - name: Checkout pinned research scripts read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 8235b589d2e83701295288fc46f7a66365be022b
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: research
      - name: Python native source oracle syntax
        run: |
          set -euo pipefail
          python3 -m py_compile research/research/photosphere/checkpoint334/native_original_graph_group_winner.py
          python3 -m py_compile research/research/photosphere/checkpoint334/native_original_max_degree_cohort.py
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-checkpoint334-rust-evidence
          path: |
            checkpoint334-focused.log
            checkpoint334-lib.log
            checkpoint334-integration.log
          retention-days: 7
          if-no-files-found: warn
