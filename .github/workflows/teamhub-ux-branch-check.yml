name: TeamHub UX branch checks
on:
  push:
    branches:
      - ci/teamhub-impeccable-20261122
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout private TeamHub with first accessible configured token
        shell: bash
        env:
          PERZIS_TOKEN: ${{ secrets.PERZIS_TOKEN }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          for candidate in "$PERZIS_TOKEN" "$PRIVATE_REPO_TOKEN" "$GH_TOKEN" "$GH_RELEASE_TOKEN"; do
            if [ -z "$candidate" ]; then continue; fi
            header=$(printf 'x-access-token:%s' "$candidate" | base64 -w0)
            if git -c "http.extraHeader=AUTHORIZATION: basic $header" clone \
                --depth 1 --single-branch --branch impeccable/teamhub-ux-hardening-20261122 \
                https://github.com/perzis/teamplus_clone.git teamhub-src >/dev/null 2>&1; then
              echo 'Private TeamHub checkout succeeded.'
              exit 0
            fi
            rm -rf teamhub-src
          done
          echo 'Unable to read private TeamHub with the configured Playground secrets.'
          exit 1
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve packages
        working-directory: teamhub-src
        run: flutter pub get
      - name: Analyze code
        id: analysis
        continue-on-error: true
        working-directory: teamhub-src
        run: flutter analyze --no-pub --no-fatal-infos
      - name: Run Flutter widget and unit tests
        id: tests
        continue-on-error: true
        working-directory: teamhub-src
        run: flutter test --no-pub

      - name: Require both checks to pass
        if: always()
        env:
          ANALYSIS: ${{ steps.analysis.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          printf 'Analysis: %s\nTests: %s\n' "$ANALYSIS" "$TESTS"
          test "$ANALYSIS" = success && test "$TESTS" = success
