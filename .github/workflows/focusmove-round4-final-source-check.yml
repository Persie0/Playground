name: FocusMove round 4 final private-source verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/focusmove-round4-final-source-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout exact private PR revision
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=fix/impeccable-focusmove-round4-20261121 https://github.com/Persie0/pomodoroexercise.git source
          test "$(git -C source rev-parse HEAD)" = ba1ec84e7c09f2b13bd12d926aabdbd43682ad29
      - name: Resolve dependencies
        shell: bash
        working-directory: source
        run: timeout 240s flutter pub get
      - name: Analyze
        shell: bash
        working-directory: source
        run: timeout 120s flutter analyze
      - name: Full Flutter test suite
        shell: bash
        working-directory: source
        run: timeout 300s flutter test --reporter expanded
