name: TopTravelList worldwide bias pass 72
on:
  push:
    branches: [main]
    paths: ['.github/workflows/toptravellist-worldwide-bias-pass72-20261126.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require successful preceding validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            result=$(gh api repos/Persie0/Playground/actions/runs/45850470267 --jq '.status + ":" + (.conclusion // "")')
            if [[ "$result" == "completed:success" ]]; then exit 0; fi
            if [[ "$result" == completed:* ]]; then echo "Preceding run did not succeed"; exit 1; fi
            sleep 10
          done
          echo "Preceding run timed out"
          exit 1
      - uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: data/worldwide-bias-audit-20261126
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and regenerate all worldwide rankings
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 350d77081b549dabb53e8720a211f1670fdf4ac6 HEAD
          test "$(git rev-list --count 350d77081b549dabb53e8720a211f1670fdf4ac6..HEAD)" -le 1
          git config user.name toptravellist-editorial-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin refs/heads/data/worldwide-audit-pass72-staging
          test "$(git rev-parse FETCH_HEAD)" = c490b2fd26f5b537cd3ea3221d5a15f0fe0fb842
          git cherry-pick c490b2fd26f5b537cd3ea3221d5a15f0fe0fb842
          pip install -r requirements.txt
          python scripts/validate.py
          python scripts/check_city_benchmarks.py
          python scripts/check_sight_benchmarks.py
          python scripts/generate_rankings.py
          python scripts/generate_rankings.py --check
          python scripts/audit_worldwide.py
          python - <<'PY'
          import csv
          from pathlib import Path
          rows={r['id']:r for r in csv.DictReader(Path('methodology/worldwide-diagnostics/records.tsv').open(),delimiter='\t')}
          expected={'sight-de-celtic-centres':'89.10','sight-de-green-belt':'88.20','sight-de-paper-mills':'85.70','sight-de-schoningen':'88.45','sight-ro-communist-prisons':'85.85','sight-ro-danube-limes':'84.30','sight-ro-roman-dacia':'85.65','sight-ro-princely-foundations':'86.45','sight-no-baelljasvarri-struve-station':'73.70','sight-no-luvdiidcohkka-struve-station':'73.55','sight-no-tys-fjord-extension':'89.65','sight-no-varjjat-siida':'85.05','sight-no-vestfold-ship-burials':'84.85','sight-fi-saimaa-ringed-seal-archipelagos':'89.65','sight-ch-beech-forests':'87.15','sight-au-cape-york-cultural-landscapes':'89.40','sight-au-gondwana-rainforests-extension':'87.15'}
          assert len(rows)==len(list(Path('countries').glob('*/cities/*.yaml')))+len(list(Path('countries').glob('*/sights/*.yaml')))
          for k,v in expected.items():
              assert rows[k]['overall']==v,(k,rows[k]['overall'],v)
              print('Verified',k,v)
          PY
          python - <<'PY'
          import csv,re,subprocess,io
          from pathlib import Path
          root=Path('methodology')
          files=sorted(root.glob('worldwide-incomplete-batch-100*-2026-11-26.md'))+[root/'worldwide-incomplete-batch-final-90-pass23-2026-11-26.md']
          assert len(files)==16,files
          seen=set()
          for f in files:
              rows=re.findall(r'\.\./countries/([A-Z]{2}/(?:sights|cities)/[^)]+\.yaml)',f.read_text())
              expected_count=90 if 'final-90' in f.name else 100
              assert len(rows)==expected_count and len(set(rows))==expected_count,(f,len(rows))
              assert not seen.intersection(rows),(f,seen.intersection(rows))
              seen.update(rows)
          raw=subprocess.check_output(['git','show','d69bfe1532605e1136ab38f9b268f92809ba0109:methodology/worldwide-diagnostics/records.tsv'],text=True)
          baseline={r['source'].removeprefix('countries/') for r in csv.DictReader(io.StringIO(raw),delimiter='\t') if 'incomplete-core' in r['flags'].split(';')}
          assert len(seen)==1590 and seen==baseline,(len(seen),len(baseline),seen-baseline,baseline-seen)
          current=list(csv.DictReader((root/'worldwide-diagnostics/records.tsv').open(),delimiter='\t'))
          unresolved={r['source'].removeprefix('countries/') for r in current if 'incomplete-core' in r['flags'].split(';')}
          assert unresolved<=seen,unresolved-seen
          assert len(unresolved)==1274,len(unresolved)
          print('Verified exact original inventory coverage:',len(seen),'unresolved:',len(unresolved))
          PY
          python scripts/rank.py --kind cities --limit 60
          python scripts/rank.py --kind sights --limit 60
          git diff --check
      - name: Commit generated reports
        run: |
          set -euo pipefail
          git config user.name toptravellist-editorial-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md 'countries/*/cities.md' 'countries/*/sights.md' methodology/worldwide-diagnostics methodology/worldwide-incomplete-batch-100-pass22-2026-11-26.md methodology/worldwide-incomplete-batch-final-90-pass23-2026-11-26.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate all-country rankings and diagnostic after deferred reassessment pass 72'
          fi
          git push origin HEAD:refs/heads/data/worldwide-bias-audit-20261126
