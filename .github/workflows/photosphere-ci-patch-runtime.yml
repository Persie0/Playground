name: Photosphere CI runtime patcher

on:
  push:
    branches: [photosphere-ci-v2]
    paths:
      - '.github/workflows/photosphere-ci-patch-runtime.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: photosphere-ci-v2
      - name: Route synthetic benchmark through Flutter test runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/photosphere-private-ci.yml')
          s = p.read_text()
          old = '          dart run tool/benchmark.dart --manifest benchmark/synthetic/manifest.json --out benchmark/synthetic-results.json\n'
          new = '''          PHOTOSPHERE_BENCHMARK_MANIFEST=benchmark/synthetic/manifest.json \\
          PHOTOSPHERE_BENCHMARK_OUTPUT=benchmark/synthetic-results.json \\
            flutter test test/benchmark_harness_test.dart --reporter expanded\n'''
          if old not in s:
              raise SystemExit('Expected dart benchmark command not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- .github/workflows/photosphere-private-ci.yml
      - name: Commit runtime fix
        run: |
          git config user.name photosphere-ci-fix
          git config user.email actions@users.noreply.github.com
          git add .github/workflows/photosphere-private-ci.yml
          git commit -m 'Run Photosphere benchmark in Flutter test runtime'
          git push origin HEAD:photosphere-ci-v2
