name: Photosphere remaining CI autofix

on:
  push:
    branches: [photosphere-ci-v2]
    paths:
      - '.github/workflows/photosphere-autofix-lints.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Photosphere source
        uses: actions/checkout@v4
        with:
          repository: Persie0/Photosphere-
          ref: audit/code-hardening-3
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true
          path: private-app
      - name: Install current Flutter stable
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Patch Android generated focal-length selection
        working-directory: private-app
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tool/configure_platforms.dart')
          text = path.read_text()
          old = (
              '        val candidates = focalLengths.mapNotNull { focalValue ->\n'
              '            val focal = focalValue.toDouble()\n'
              '            if (focal <= 0.0) return@mapNotNull null\n'
              '            val horizontal = 2.0 * atan(sensor.width.toDouble() / (2.0 * focal)) * 180.0 / PI\n'
              '            val vertical = 2.0 * atan(sensor.height.toDouble() / (2.0 * focal)) * 180.0 / PI\n'
              '            if (!horizontal.isFinite() || !vertical.isFinite()) null else Pair(horizontal, vertical)\n'
              '        }\n'
              '        val selected = candidates.minByOrNull { abs(it.first - 72.0) } ?: return null\n'
              '        return mapOf("horizontal" to selected.first, "vertical" to selected.second)\n'
          )
          new = (
              '        var selectedHorizontal: Double? = null\n'
              '        var selectedVertical: Double? = null\n'
              '        var bestScore = Double.POSITIVE_INFINITY\n'
              '        for (focalValue in focalLengths) {\n'
              '            val focal = focalValue.toDouble()\n'
              '            if (focal <= 0.0) continue\n'
              '            val horizontal = 2.0 * atan(sensor.width.toDouble() / (2.0 * focal)) * 180.0 / PI\n'
              '            val vertical = 2.0 * atan(sensor.height.toDouble() / (2.0 * focal)) * 180.0 / PI\n'
              '            if (!horizontal.isFinite() || !vertical.isFinite()) continue\n'
              '            val score = abs(horizontal - 72.0)\n'
              '            if (score < bestScore) {\n'
              '                bestScore = score\n'
              '                selectedHorizontal = horizontal\n'
              '                selectedVertical = vertical\n'
              '            }\n'
              '        }\n'
              '        val horizontal = selectedHorizontal ?: return null\n'
              '        val vertical = selectedVertical ?: return null\n'
              '        return mapOf("horizontal" to horizontal, "vertical" to vertical)\n'
          )
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Unexpected Android focal-length generator block')
          path.write_text(text)
          PY
          dart format tool/configure_platforms.dart
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit and push fixes
        working-directory: private-app
        shell: bash
        run: |
          git config user.name 'photosphere-ci-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add tool/configure_platforms.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Android Camera2 focal-length generator'
            git push origin HEAD:audit/code-hardening-3
          fi
