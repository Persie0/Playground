name: Noise Remover paywall-only retry validation
on:
  push:
    paths:
      - '.github/workflows/noise-remover-paywall-retry.yml'
permissions:
  contents: read
env:
  APP_REPOSITORY: Persie0/noise_remover
  APP_REF: fix/network-retry-only-from-paywall
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout private app branch
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Show formatter diff
        run: |
          dart format lib/services/deferred_service_retry_guard.dart test/network_error_test.dart
          git diff -- lib/services/deferred_service_retry_guard.dart test/network_error_test.dart
      - name: Network retry regression tests
        run: flutter test test/network_error_test.dart test/purchase_restriction_reporting_test.dart
      - name: Strict analyze
        run: flutter analyze --fatal-infos
