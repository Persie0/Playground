name: Video Upscaler PR13 ONNX inference smoke
on:
  push:
    paths:
      - '.github/workflows/video-upscaler-pr13-onnx-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout feature code through Playground
        uses: actions/checkout@v4
        with:
          repository: Persie0/video_upscaler
          ref: feature/image-enhancer-2x-onnx
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - name: Run actual General Low ONNX inference with NV12 video pixels
        working-directory: app
        env:
          RUN_ONNX_SMOKE: '1'
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter testImageEnhancerLowModelUpscalesRealNV12Frame 2>&1 | tee onnx-smoke.log
          grep -E 'testImageEnhancerLowModelUpscalesRealNV12Frame.*passed' onnx-smoke.log
          if grep -E 'testImageEnhancerLowModelUpscalesRealNV12Frame.*skipped' onnx-smoke.log; then
            echo 'ONNX inference smoke test was skipped' >&2
            exit 1
          fi
