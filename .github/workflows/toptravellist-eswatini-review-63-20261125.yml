name: TopTravelList Eswatini PR 63 review
on:
  push:
    branches: [main]
    paths: ['.github/workflows/toptravellist-eswatini-review-63-20261125.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: data/eswatini-worldwide-20261125
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate latest main and validate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name toptravellist-review-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          python -m pip install -r requirements.txt
          python scripts/validate.py
          python scripts/check_city_benchmarks.py
          python scripts/check_sight_benchmarks.py
          python scripts/generate_rankings.py --country SZ
          python scripts/generate_rankings.py --check
          python scripts/rank.py --kind cities --limit 60
          python scripts/rank.py --kind sights --limit 60
          git add README.md countries/SZ/cities.md countries/SZ/sights.md
          git diff --cached --check
          if ! git diff --cached --quiet; then git commit -m 'Regenerate Eswatini rankings after visitor-scope reassessment'; fi
          git push origin HEAD:refs/heads/data/eswatini-worldwide-20261125
          git rev-parse HEAD
