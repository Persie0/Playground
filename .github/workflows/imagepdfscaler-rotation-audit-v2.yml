          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/image_processing_test.dart')
          s = p.read_text()
          marker = "  test('original PDF quality returns full-resolution bytes unchanged', () async {"
          if 'deferred quarter turns materialize' not in s:
              extra = '''  test('opaque editor preview uses compact JPEG without changing full dimensions', () async {
                final source = img.Image(width: 1800, height: 900)
                  ..clear(img.ColorRgb8(30, 80, 140));
                final prepared = await ImageProcessingService.prepareImport(
                  Uint8List.fromList(img.encodePng(source)),
                );
                expect(prepared, isNotNull);
                expect(prepared!.previewBytes[0], 0xFF);
                expect(prepared.previewBytes[1], 0xD8);
                final full = img.decodeImage(prepared.fullBytes)!;
                expect(full.width, 1800);
                expect(full.height, 900);
              });

              test('deferred quarter turns materialize in one full-resolution pass', () async {
                final source = img.Image(width: 120, height: 60)
                  ..clear(img.ColorRgb8(100, 120, 140));
                final bytes = Uint8List.fromList(img.encodePng(source));
                final result = await ImageProcessingService.materializeQuarterTurns(
                  fullBytes: bytes,
                  quarterTurns: 1,
                );
                expect(result, isNotNull);
                expect(result!.pixelWidth, 60);
                expect(result.pixelHeight, 120);
              });

            '''
              if marker not in s:
                  raise SystemExit('image-processing test marker not found')
              s = s.replace(marker, extra + marker, 1)
              p.write_text(s)
          PY

          cat > AUDIT_2026-09.md <<'MD'
          # ImagePdfScaler audit — September 2026

          ## Fixed in this audit

          - **Home-screen 90° rotation:** previously decoded, rotated, PNG-encoded the full-resolution image and regenerated its preview on every tap. It is now a metadata/layout operation: swap the millimetre rectangle and increment a quarter-turn. The canvas rotates the preview at render time and PDF export applies a PDF transform. Repeated quarter-turns no longer resample or recompress the source pixels.
          - **Crop/fine-rotation interoperability:** deferred quarter turns are materialized once, off the UI isolate, only when entering the destructive crop/fine-rotation editor.
          - **Preview load:** editor previews remain capped at 1024 px and opaque previews now use JPEG quality 82; alpha images remain PNG. Original-quality PDF pixels are unchanged.
          - **Dialog lifecycle:** Exact size, Layout settings, and Save project now own their TextEditingControllers for the full dialog route lifetime, preventing the same focus/route teardown race that previously affected Fit copies.
          - **Project rotation compatibility:** project format v3 gives rotationQuarterTurns real transform semantics. v1/v2 loads ignore the old informational field because those versions had already physically rotated their pixels.
          - **Save As safety:** a same-name Save As no longer silently overwrites another project.
          - **Project path hardening:** project IDs are validated before being used in file paths.
          - **Print/share errors:** plugin failures are caught and surfaced in-app.
          - **iOS gallery permission:** platform bootstrap adds NSPhotoLibraryUsageDescription when generating iOS.
          - **PDF duplicate work:** identical source buffers at the same physical print size are prepared only once per export.

          ## Architecture verified

          - Paper/image geometry remains millimetre-based end-to-end.
          - PDF paper size remains exact with zero PDF margin.
          - Full-resolution source bytes stay separate from editor previews.
          - Snap/margins/gap, multi-select alignment/distribution, auto-pack, calibration, and named projects remain independent of raster processing.

          ## Remaining medium-priority opportunities

          1. **Project storage:** image assets are still base64 inside JSON. A manifest plus binary asset files would remove base64 overhead and lower save/load peak memory.
          2. **Heavy sheets while dragging:** each drag tick still updates EditorPage state. A dedicated canvas state/notifier would reduce rebuild scope for many-image layouts.
          3. **Auto packing:** the shelf packer is simple and can reject arrangements that MaxRects/Skyline could fit.
          4. **Compressed PDF export:** distinct source images are downsampled sequentially. Bounded parallel preparation (for example two workers) could reduce latency without an unbounded memory spike.
          5. **Production signing:** generated release APKs are test artifacts; Play Store production signing still needs the production keystore/CI secrets.
          MD

          dart format lib test
          git diff --check

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Strict analyze
        working-directory: app
        run: flutter analyze

      - name: Full test suite
        working-directory: app
        run: flutter test

      - name: Generate Android scaffold
        shell: bash
        run: |
          rm -rf /tmp/imagepdfscaler-scaffold
          flutter create /tmp/imagepdfscaler-scaffold \
            --platforms=android \
            --org com.persie \
            --project-name image_pdf_scaler
          rm -rf app/android
          cp -R /tmp/imagepdfscaler-scaffold/android app/android

      - name: Build release APK
        working-directory: app
        run: flutter build apk --release

      - name: Commit and push green audit
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Persie0'
          git config user.email '76871553+Persie0@users.noreply.github.com'
          git add lib test tool pubspec.yaml AUDIT_2026-09.md
          git commit -m 'Make 90 degree rotation instant and complete audit' || true
          git push origin HEAD:audit/performance-rotation

      - name: Upload audited release APK
        uses: actions/upload-artifact@v4
        with:
