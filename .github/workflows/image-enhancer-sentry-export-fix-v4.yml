name: Image Enhancer Sentry export fixes v4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/image-enhancer-sentry-export-fix-v4.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/image_enhancer
  TARGET_BRANCH: fix/sentry-export-2026-09-04

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Checkout private Image Enhancer
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply root-cause fixes
        working-directory: app
        run: |
          git checkout -B "$TARGET_BRANCH"
          python3 - <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text()
          def write(path, value): Path(path).write_text(value)
          def once(value, old, new, label):
              if old not in value:
                  raise SystemExit(f'{label}: anchor not found')
              return value.replace(old, new, 1)

          write('lib/utils/permission_helper.dart', """import 'dart:async';
          import 'package:flutter/services.dart';

          class PermissionHelper {
            static bool _isBusyPlatformException(Object error) {
              if (error is! PlatformException) return false;
              final details =
                  '${error.message ?? ''} ${error.details ?? ''}'.toLowerCase();
              return error.code == 'already_active' ||
                  (error.code == 'PermissionHandler.PermissionManager' &&
                      details.contains('already running')) ||
                  details.contains('image picker is already active') ||
                  details.contains('request for permissions is already running');
            }

            static Future<T> runWithRetry<T>(
              Future<T> Function() task, {
              int maxRetries = 3,
              Duration baseDelay = const Duration(milliseconds: 500),
            }) async {
              var retries = 0;
              while (true) {
                try {
                  return await task();
                } catch (error) {
                  if (!_isBusyPlatformException(error) || retries >= maxRetries) {
                    rethrow;
                  }
                  final delay = baseDelay * (1 << retries);
                  retries++;
                  if (delay != Duration.zero) await Future<void>.delayed(delay);
                }
              }
            }
          }
          """)

          p = 'lib/utils/model_download.dart'
          s = read(p)
          s = once(s,
              "if (error is DioException && CancelToken.isCancel(error)) rethrow;\n        final shouldRetry =",
              """if (error is DioException && CancelToken.isCancel(error)) rethrow;
                if (_isCertificateFailure(error)) {
                  _emit(onEvent, 'certificate_error', {'attempt': attempt});
                  throw SocketException(
                    'Secure model download connection could not be verified.',
                  );
                }
                final shouldRetry =""",
              'certificate catch')
          s = once(s,
              '  static bool _isTransient(Object error) {',
              """  static bool _isCertificateFailure(Object error) {
                if (error is HandshakeException) return true;
                if (error is! DioException) return false;
                if (error.type == DioExceptionType.badCertificate) return true;
                final details =
                    '${error.message ?? ''} ${error.error ?? ''}'.toLowerCase();
                return details.contains('certificate_verify_failed') ||
                    details.contains('unable to get local issuer certificate') ||
                    details.contains('handshakeexception');
              }

                static bool _isTransient(Object error) {""",
              'certificate classifier')
          write(p, s)

          p = 'lib/main.dart'
          s = read(p)
          s = once(s,
              "if (throwable is UnsupportedFileException) {\n            return null;\n          }",
              """if (throwable is UnsupportedFileException ||
                      throwable is ImageTooLargeException) {
                    return null;
                  }""",
              'global size validation filter')
          write(p, s)

          p = 'lib/super_resolution_home_page.dart'
          s = read(p)
          s = once(s,
              "if (kReleaseMode && e is! UnsupportedFileException) {\n        Sentry.captureException(e, stackTrace: stackTrace);\n      }",
              """if (kReleaseMode &&
                  e is! UnsupportedFileException &&
                  e is! ImageTooLargeException) {
                Sentry.captureException(e, stackTrace: stackTrace);
              }""",
              'processing size validation filter')
          write(p, s)

          p = 'flutter_super_resolution/lib/flutter_super_resolution.dart'
          s = read(p)
          s = once(s,
              '  final _inferenceLock = _AsyncLock();',
              """  final _inferenceLock = _AsyncLock();
                int _activeUpscales = 0;
                Completer<void>? _idleCompleter;

                Future<void> _waitForIdle() async {
                  if (_activeUpscales == 0) return;
                  _idleCompleter ??= Completer<void>();
                  await _idleCompleter!.future;
                }

                void _beginUpscale() => _activeUpscales++;

                void _endUpscale() {
                  _activeUpscales--;
                  if (_activeUpscales == 0) {
                    final completer = _idleCompleter;
                    _idleCompleter = null;
                    if (completer != null && !completer.isCompleted) {
                      completer.complete();
                    }
                  }
                }""",
              'upscale lifecycle fields')

          init_anchor = ") async {\n    try {\n      final ort = OnnxRuntime();"
          if s.count(init_anchor) != 2:
              raise SystemExit(f'initializer anchor count: {s.count(init_anchor)}')
          s = s.replace(init_anchor,
              ") async {\n    await _waitForIdle();\n    try {\n      final ort = OnnxRuntime();", 2)

          old_process = """    try {
                if (!useTiling ||
                    (sourceImage.width <= effectiveTileSize &&
                        sourceImage.height <= effectiveTileSize)) {
                  return await _processFullImage(
                    sourceImage,
                    scale,
                    onProgress,
                    onDiagnostics,
                  );
                } else {
                  return await _processByTiles(
                      sourceImage, scale, onProgress, effectiveTileSize, onDiagnostics);
                }
              } catch (e) {
                throw Exception('Error processing image: $e');
              }"""
          new_process = """    _beginUpscale();
              try {
                if (!useTiling) {
                  return await _processFullImage(
                    sourceImage,
                    scale,
                    onProgress,
                    onDiagnostics,
                  );
                }
                return await _processByTiles(
                  sourceImage,
                  scale,
                  onProgress,
                  effectiveTileSize,
                  onDiagnostics,
                );
              } catch (e) {
                throw Exception('Error processing image: $e');
              } finally {
                _endUpscale();
              }"""
          s = once(s, old_process, new_process, 'fixed-shape processing')
          s = once(s,
              "Future<void> dispose() async {\n    final session = _session;",
              """Future<void> dispose() async {
                await _waitForIdle();
                final session = _session;""",
              'dispose waits for upscale')
          write(p, s)

          write('test/permission_helper_test.dart', """import 'package:flutter/services.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'package:image_enhancer/utils/permission_helper.dart';

          void main() {
            test('retries image_picker already_active errors', () async {
              var calls = 0;
              final result = await PermissionHelper.runWithRetry<int>(
                () async {
                  calls++;
                  if (calls < 3) {
                    throw PlatformException(
                      code: 'already_active',
                      message: 'Image picker is already active',
                    );
                  }
                  return 42;
                },
                baseDelay: Duration.zero,
              );
              expect(result, 42);
              expect(calls, 3);
            });

            test('retries permission request already running', () async {
              var calls = 0;
              final result = await PermissionHelper.runWithRetry<int>(
                () async {
                  calls++;
                  if (calls == 1) {
                    throw PlatformException(
                      code: 'PermissionHandler.PermissionManager',
                      message: 'A request for permissions is already running',
                    );
                  }
                  return 7;
                },
                baseDelay: Duration.zero,
              );
              expect(result, 7);
              expect(calls, 2);
            });

            test('does not retry unrelated platform errors', () async {
              var calls = 0;
              await expectLater(
                PermissionHelper.runWithRetry<void>(
                  () async {
                    calls++;
                    throw PlatformException(code: 'other');
                  },
                  baseDelay: Duration.zero,
                ),
                throwsA(isA<PlatformException>()),
              );
              expect(calls, 1);
            });
          }
          """)
          PY

          dart format lib/main.dart lib/super_resolution_home_page.dart \
            lib/utils/model_download.dart lib/utils/permission_helper.dart \
            test/permission_helper_test.dart \
            flutter_super_resolution/lib/flutter_super_resolution.dart

      - name: Analyze and test app
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Test super-resolution package
        working-directory: app/flutter_super_resolution
        run: |
          flutter pub get
          flutter test

      - name: Commit and push verified fixes
        working-directory: app
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          git config user.name 'Persie0'
          git config user.email '76871553+Persie0@users.noreply.github.com'
          git add lib test flutter_super_resolution/lib flutter_super_resolution/test
          git commit -m 'Fix Sentry export root causes'
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/Persie0/image_enhancer.git"
          git push --force origin HEAD:"$TARGET_BRANCH"
