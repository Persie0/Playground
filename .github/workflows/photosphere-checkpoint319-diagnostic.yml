name: Photosphere checkpoint319 original diagnostic call chain
on:
  push:
    branches: [research/photosphere-checkpoint319-diagnostic]
    paths: [.github/workflows/photosphere-checkpoint319-diagnostic.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-diagnostic-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install machine-code inspection packages
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools unicorn
      - name: Download SHA-pinned Google Camera ARM64 ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk'
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Read-only checkout original source analysis
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: c8a003a4ba14c2b416e333e9c8360cffef007f8a
          path: research
          sparse-checkout: |
            research/photosphere/checkpoint319
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Inspect source-original diagnostic function bodies
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = c8a003a4ba14c2b416e333e9c8360cffef007f8a
          python3 research/research/photosphere/checkpoint319/scan_original_diagnostic_callees.py original.so --output checkpoint319-original-callees.json | tee checkpoint319-original-callees.log
          grep -q '^CHECKPOINT319_ORIGINAL_DIAGNOSTIC_CALLEES_SCANNED' checkpoint319-original-callees.log
          python3 research/research/photosphere/checkpoint319/native_original_diagnostic_severity.py original.so --output checkpoint319-original-severity-gate.json | tee checkpoint319-original-severity-gate.log
          grep -q '^CHECKPOINT319_ORIGINAL_SEVERITY_GATE_PASS' checkpoint319-original-severity-gate.log
          python3 research/research/photosphere/checkpoint319/native_original_diagnostic_returning.py original.so --output checkpoint319-original-returning-diagnostic.json | tee checkpoint319-original-returning-diagnostic.log
          grep -q '^CHECKPOINT319_ORIGINAL_CONDITIONAL_RESUME_PASS' checkpoint319-original-returning-diagnostic.log
          echo CHECKPOINT319_RESUME_JSON_BEGIN
          cat checkpoint319-original-returning-diagnostic.json
          echo CHECKPOINT319_RESUME_JSON_END
          echo CHECKPOINT319_SEVERITY_JSON_BEGIN
          cat checkpoint319-original-severity-gate.json
          echo CHECKPOINT319_SEVERITY_JSON_END
          echo CHECKPOINT319_CALLEES_JSON_BEGIN
          cat checkpoint319-original-callees.json
          echo CHECKPOINT319_CALLEES_JSON_END
      - name: Read-only checkout pinned Rust checkpoint319 model
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: b7a32a9241ce8e3b80b30758c513b3a17805baf9
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Compare fresh original ARM64 oracles to Rust fixtures
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = b7a32a9241ce8e3b80b30758c513b3a17805baf9
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("checkpoint319-original-callees.json").read_text())
          for f in d["functions"]:
              del f["original_entry_instructions"]
              del f["original_tail_instructions"]
              del f["original_all_instructions"]
          pairs=[
              (d,"app/tests/fixtures/native_original_diagnostic_callees_319.json"),
              (json.loads(Path("checkpoint319-original-severity-gate.json").read_text()),"app/tests/fixtures/native_original_diagnostic_severity_319.json"),
          ]
          wrapper=json.loads(Path("checkpoint319-original-returning-diagnostic.json").read_text())
          for c in wrapper["cases"]:
              trace=c.pop("original_trace_pcs")
              c["original_trace_start_pc"]=trace[0]
              c["original_trace_end_pc"]=trace[-1]
              c["original_trace_instruction_count"]=len(trace)
          pairs.append((wrapper,"app/tests/fixtures/native_original_conditional_diagnostic_319.json"))
          for native,path in pairs:
              fixture=json.loads(Path(path).read_text())
              assert native==fixture, ("source ARM64 oracle mismatch",path)
              print("CHECKPOINT319_FRESH_ORIGINAL_FIXTURE_EQUAL",path)
          assert wrapper["original_fixture_count"]==9
          assert wrapper["original_diagnostic_count"]==11
          assert wrapper["original_decrement_count"]==8
          PY
      - name: Rust checkpoint319 focused and full regression
        run: |
          set -euo pipefail
          cd app
          rustfmt --edition 2021 --check src/native_line_diagnostic_resume.rs src/native_line_diagnostic_resume_checkpoint319_test.rs
          cargo test --lib checkpoint319 -- --nocapture
          cargo test --lib
      - name: Print formatted Rust parity source for exact readback
        run: |
          echo CHECKPOINT319_RUST_MODEL_BEGIN
          cat app/src/native_line_diagnostic_resume.rs
          echo CHECKPOINT319_RUST_MODEL_END
          echo CHECKPOINT319_RUST_TEST_BEGIN
          cat app/src/native_line_diagnostic_resume_checkpoint319_test.rs
          echo CHECKPOINT319_RUST_TEST_END
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint319-original-diagnostic
          path: |
            checkpoint319-original-callees.json
            checkpoint319-original-callees.log
            checkpoint319-original-severity-gate.json
            checkpoint319-original-severity-gate.log
            checkpoint319-original-returning-diagnostic.json
            checkpoint319-original-returning-diagnostic.log
          retention-days: 14
