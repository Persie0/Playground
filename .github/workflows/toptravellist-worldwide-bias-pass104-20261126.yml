name: TopTravelList worldwide bias pass 104
on:
  push:
    branches: [main]
    paths: ['.github/workflows/toptravellist-worldwide-bias-pass104-20261126.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: data/worldwide-bias-audit-pass104
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and regenerate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 360b7cd5524d09f59eb8902ab6adfdb966e8e35c
          pip install -r requirements.txt
          python scripts/validate.py
          python scripts/check_city_benchmarks.py
          python scripts/check_sight_benchmarks.py
          python scripts/generate_rankings.py
          python scripts/generate_rankings.py --check
          python scripts/audit_worldwide.py
          python scripts/reconcile_worldwide_backlog.py --verify-baseline
          python scripts/reconcile_worldwide_backlog.py --check
          python - <<'PY'
          import csv, subprocess, yaml
          from pathlib import Path
          expected={"AM/sights/karmir-blur-teishebaini":("83.20",dict(impact=8.0,experience=7.7,depth=8.0)),"ES/sights/mining-heritage":("88.30",dict(experience=8.9,depth=9.1)),"ES/sights/romanesque-enclave":("88.10",dict(experience=8.8,depth=9.1)),"IT/sights/benedictine":("91.00",dict(impact=9.0,experience=8.9,depth=9.3)),"HU/sights/lechner-architecture":("89.15",dict(experience=8.6,depth=8.7))}
          def read(p):
              with Path(p).open() as f:
                  return list(csv.DictReader(f,delimiter='\t'))
          rows=read('methodology/worldwide-diagnostics/records.tsv')
          bysource={r['source']:r for r in rows}
          for path,(score,changes) in expected.items():
              p='countries/'+path+'.yaml'
              old=yaml.safe_load(subprocess.check_output(['git','show','23e4260dc74d2156176217f215f5d33ef17d7295:'+p],text=True))
              assert all(old['scores'][k] is None for k in changes)
              old['scores'].update(changes)
              assert old==yaml.safe_load(Path(p).read_text())
              assert bysource[p]['overall']==score,(p,bysource[p]['overall'])
          q=read('methodology/worldwide-backlog/remaining.tsv')
          h=read('methodology/worldwide-backlog/original-inventory.tsv')
          assert len(rows)==16269 and len(q)==989
          assert {r['source'] for r in q}=={r['source'] for r in rows if 'incomplete-core' in r['flags'].split(';')}
          assert len(h)==1590 and sum(r['current_status']=='complete' for r in h)==601
          print('Verified all five ratings and exact live queue.')
          PY
          git diff --check
      - name: Commit generated reports
        run: |
          set -euo pipefail
          git config user.name toptravellist-editorial-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md 'countries/*/cities.md' 'countries/*/sights.md' methodology/worldwide-diagnostics methodology/worldwide-backlog
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate rankings and live backlog after pass 104'
            git push origin HEAD:refs/heads/data/worldwide-bias-audit-pass104
          fi
