name: Photosphere checkpoint338 pair vector ownership and transfer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint338-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint338-transfer
  cancel-in-progress: false
jobs:
  source-original:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout original research pinned read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 8efa77460b818b6ea9563eb37d1ff8739474e311
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify exact private source SHA and dependencies
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8efa77460b818b6ea9563eb37d1ff8739474e311"
          python3 -m pip install --quiet --break-system-packages capstone unicorn pyelftools
      - name: Obtain checksum-pinned original Google Camera native binary
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Resolve original source exact FDE and opcodes
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint338/scan_original_pair_transfer.py original.so --output checkpoint338-transfer-source-map.json | tee checkpoint338-source-map.log
          grep -q '^CHECKPOINT338_ORIGINAL_TRANSFER_MAP_PASS 5 8' checkpoint338-source-map.log
      - name: Execute original native deep-copy vector assignment on source and FOV memory
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint338/native_original_pair_transfer.py original.so --output checkpoint338-original-transfer-execution.json | tee checkpoint338-transfer-execution.log
          grep -q '^CHECKPOINT338_TRANSFER_SOURCE_PASS 25 18' checkpoint338-transfer-execution.log
      - name: Archive evidence with no proprietary ELF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-checkpoint338-source
          path: |
            checkpoint338-transfer-source-map.json
            checkpoint338-source-map.log
            checkpoint338-original-transfer-execution.json
            checkpoint338-transfer-execution.log
          retention-days: 7
          if-no-files-found: warn
