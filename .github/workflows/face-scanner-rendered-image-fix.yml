name: Face Scanner rendered image export fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/face-scanner-rendered-image-fix.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-and-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Face Scanner fix branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/face_scanner
          ref: fix/save-image-to-gallery
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: face_scanner
          persist-credentials: true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch rendered image export
        working-directory: face_scanner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/screens/show2d.dart')
          text = path.read_text()

          text = text.replace(
              "import 'package:flutter/material.dart';\n",
              "import 'package:flutter/material.dart';\nimport 'package:flutter/rendering.dart';\n",
              1,
          )

          text = text.replace(
              "  bool _isProcessingImage = false;\n",
              "  bool _isProcessingImage = false;\n  final GlobalKey _resultPreviewKey = GlobalKey();\n",
              1,
          )

          old_tile = '''              if (_textureFile != null)\n                UnlockOrAdListTile(\n                  leading: const Icon(Icons.image),\n                  title: _appLocalizations.exportTexture,\n                  subtitle: _appLocalizations.saveTextureDesc,\n                  onUnlocked: () {\n                    Navigator.pop(sheetContext);\n                    _exportTexture();\n                  },\n                ),'''
          new_tile = '''              if (_textureFile != null)\n                UnlockOrAdListTile(\n                  leading: const Icon(Icons.image_outlined),\n                  title: _appLocalizations.saveToGallery,\n                  onUnlocked: () async {\n                    Navigator.pop(sheetContext);\n                    await _exportRenderedImage();\n                  },\n                ),'''
          if old_tile not in text:
              raise SystemExit('export texture tile block not found')
          text = text.replace(old_tile, new_tile, 1)

          start = '''                              return SizedBox(\n                                width: displayWidth,'''
          replacement = '''                              return RepaintBoundary(\n                                key: _resultPreviewKey,\n                                child: SizedBox(\n                                  width: displayWidth,'''
          if start not in text:
              raise SystemExit('preview start not found')
          text = text.replace(start, replacement, 1)

          end = '''                                  ],\n                                ),\n                              );\n                            },'''
          replacement_end = '''                                  ],\n                                ),\n                              ),\n                            );\n                            },'''
          if end not in text:
              raise SystemExit('preview end not found')
          text = text.replace(end, replacement_end, 1)

          pattern = re.compile(r"  Future<void> _exportTexture\(\) async \{.*?\n  \}\n\n  void _showViewInfoDialog", re.S)
          new_method = '''  Future<Uint8List> _captureRenderedResult() async {\n    final renderObject =\n        _resultPreviewKey.currentContext?.findRenderObject();\n    if (renderObject is! RenderRepaintBoundary) {\n      throw StateError('Rendered face preview is not available.');\n    }\n\n    final logicalSize = renderObject.size;\n    if (logicalSize.width <= 0 || logicalSize.height <= 0) {\n      throw StateError('Rendered face preview has an invalid size.');\n    }\n\n    final sourceSize = _actualImageSize ?? widget.imageSize ?? logicalSize;\n    final widthRatio = sourceSize.width / logicalSize.width;\n    final heightRatio = sourceSize.height / logicalSize.height;\n    final pixelRatio = min(widthRatio, heightRatio);\n    if (!pixelRatio.isFinite || pixelRatio <= 0) {\n      throw StateError('Unable to determine export resolution.');\n    }\n\n    final image = await renderObject.toImage(pixelRatio: pixelRatio);\n    try {\n      final byteData = await image.toByteData(format: ui.ImageByteFormat.png);\n      if (byteData == null) {\n        throw StateError('Unable to encode rendered face image.');\n      }\n      return byteData.buffer.asUint8List();\n    } finally {\n      image.dispose();\n    }\n  }\n\n  Future<void> _exportRenderedImage() async {\n    if (_loadedImage == null || _faceMeshes == null || _faceMeshes!.isEmpty) {\n      return;\n    }\n\n    try {\n      await WidgetsBinding.instance.endOfFrame;\n      final imageBytes = await _captureRenderedResult();\n      final timestamp = DateTime.now().millisecondsSinceEpoch;\n      final filename = 'face_mesh_result_$timestamp.png';\n\n      if (Platform.isAndroid || Platform.isIOS) {\n        await GalleryImageSaver.platformDefault().saveImageBytes(\n          imageBytes,\n          fileName: filename,\n        );\n        if (mounted) {\n          _showSnackBar(_appLocalizations.successfullySavedToGallery);\n        }\n      } else {\n        final result = await FileSaver.instance.saveFile(\n          name: filename,\n          bytes: imageBytes,\n          fileExtension: 'png',\n          mimeType: MimeType.png,\n        );\n        if (mounted) {\n          _showSnackBar(_appLocalizations.fileSaved(result));\n        }\n      }\n    } catch (exception, stackTrace) {\n      await Sentry.captureException(exception, stackTrace: stackTrace);\n      if (mounted) {\n        _showSnackBar(_appLocalizations.failedToSaveImage(exception.toString()));\n      }\n    }\n  }\n\n  void _showViewInfoDialog'''
          text, count = pattern.subn(new_method, text, count=1)
          if count != 1:
              raise SystemExit('export texture method block not found')

          path.write_text(text)

          saver = Path('lib/services/gallery_image_saver.dart')
          saver_text = saver.read_text().replace('Future<void> saveJpeg(', 'Future<void> saveImageBytes(', 1)
          saver.write_text(saver_text)

          tests = Path('test/services/gallery_image_saver_test.dart')
          test_text = tests.read_text().replace('.saveJpeg(', '.saveImageBytes(')
          test_text = test_text.replace("expect(fileName, 'face.jpg');", "expect(fileName, 'face.png');", 1)
          test_text = test_text.replace("fileName: 'face.jpg'", "fileName: 'face.png'")
          tests.write_text(test_text)
          PY

          dart format lib/screens/show2d.dart lib/services/gallery_image_saver.dart test/services/gallery_image_saver_test.dart

      - name: Resolve dependencies
        working-directory: face_scanner
        run: flutter pub get

      - name: Run gallery saver tests
        working-directory: face_scanner
        run: flutter test test/services/gallery_image_saver_test.dart

      - name: Analyze changed Dart files
        working-directory: face_scanner
        run: flutter analyze lib/screens/show2d.dart lib/services/gallery_image_saver.dart test/services/gallery_image_saver_test.dart

      - name: Build Android debug APK
        working-directory: face_scanner
        run: flutter build apk --debug

      - name: Commit and push fix
        working-directory: face_scanner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/show2d.dart lib/services/gallery_image_saver.dart test/services/gallery_image_saver_test.dart
          git commit -m "fix: export rendered face mesh image"
          git push origin HEAD:fix/save-image-to-gallery

  ios:
    needs: patch-and-android
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Check out updated Face Scanner fix branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/face_scanner
          ref: fix/save-image-to-gallery
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: face_scanner
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: face_scanner
        run: flutter pub get
      - name: Run gallery saver tests
        working-directory: face_scanner
        run: flutter test test/services/gallery_image_saver_test.dart
      - name: Build iOS without signing
        working-directory: face_scanner
        run: flutter build ios --debug --no-codesign
