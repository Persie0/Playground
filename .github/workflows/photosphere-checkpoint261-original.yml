name: PhotoSphere checkpoint261 original RANSAC first RNG boundary (one shot)
on:
  push:
    branches: [ci/photosphere-checkpoint261-native-rng-entry]
    paths: ['.github/workflows/photosphere-checkpoint261-original.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint261-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-robust-rng-entry:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'ci: run photosphere checkpoint261 once'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 7bcf15559799df48575a567579cdad4adebbf07f
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify pinned native probe and install emulator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7bcf15559799df48575a567579cdad4adebbf07f"
          python3 -m py_compile research/photosphere/checkpoint261/native_robust_estimator_to_rng.py research/photosphere/checkpoint261/validate_original_ransac_rng_entry.py
          python3 -m pip install --break-system-packages --quiet -r research/photosphere/checkpoint218/requirements.txt
      - name: Fetch pinned original Google Camera APK and ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Execute original robust estimator to first native RNG draw
        run: |
          set -euo pipefail
          if ! python3 research/photosphere/checkpoint261/native_robust_estimator_to_rng.py > checkpoint261-original.log 2> checkpoint261-original.stderr; then
            tail -n 120 checkpoint261-original.stderr || true
            exit 1
          fi
          python3 research/photosphere/checkpoint261/validate_original_ransac_rng_entry.py checkpoint261-original.log | tee checkpoint261-validation.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=Path('checkpoint261-original.log').read_text()
          d=json.loads(s.split('CHECKPOINT261_NATIVE_ADDIMAGE_FEATURE_BEGIN\n')[1].split('\nCHECKPOINT261_NATIVE_ADDIMAGE_FEATURE_END')[0])
          Path('checkpoint261-original.json').write_text(json.dumps(d,indent=2)+'\n')
          for c in d['cases']:
              v=c['native_second_actual_addimage']
              print('CHECKPOINT261_NATIVE_RNG_ENTRY',c['name'],
                    v.get('native_robust_estimator_original_entry'),
                    v.get('native_original_first_sampling_instruction'))
          PY
      - name: Archive full original native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint261-original-robust-first-rng
          path: |
            checkpoint261-original.log
            checkpoint261-original.stderr
            checkpoint261-original.json
            checkpoint261-validation.txt
          retention-days: 14
          if-no-files-found: warn
