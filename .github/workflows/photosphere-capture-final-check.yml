name: Photosphere capture final check
on:
  push:
    branches: [photosphere-capture-ci]
    paths:
      - .github/workflows/photosphere-capture-final-check.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout private capture branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/Photosphere-
          ref: fix/capture-guidance-3d
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: app
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: cd app && flutter pub get
      - name: Verify only patch files are canonically formatted
        run: |
          cd app
          dart format --output=none --set-exit-if-changed \
            lib/src/models/capture_geometry.dart \
            lib/src/models/vec3.dart \
            lib/src/screens/capture_screen.dart \
            lib/src/services/capture_sharpness.dart \
            lib/src/services/motion_pose_tracker.dart \
            lib/src/services/native_orientation.dart \
            test/capture_geometry_test.dart \
            test/native_orientation_test.dart \
            tool/configure_platforms.dart
      - name: Run capture regression tests
        run: cd app && flutter test test/capture_geometry_test.dart test/native_orientation_test.dart --reporter expanded
      - name: Run complete unit-test suite
        id: full_tests
        continue-on-error: true
        run: cd app && flutter test --reporter expanded
      - name: Generate Android and iOS runners with native orientation bridges
        run: |
          set -euo pipefail
          cd app
          flutter create --platforms=android,ios --org com.persie --no-pub .
          dart tool/configure_platforms.dart
          dart tool/set_android_sdk37.dart
          grep -R -q 'TYPE_GAME_ROTATION_VECTOR' android/app/src/main/kotlin
          grep -R -q 'photosphere/orientation' android/app/src/main/kotlin
          grep -q 'photosphere/orientation' ios/Runner/AppDelegate.swift
          grep -q '"rx"' ios/Runner/AppDelegate.swift
          grep -q '"ux"' ios/Runner/AppDelegate.swift
          grep -q 'compileSdk = 37' android/app/build.gradle.kts
      - name: Report full-suite status
        run: echo "full_tests_outcome=${{ steps.full_tests.outcome }}"
