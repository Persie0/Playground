name: TopTravelList all 133 Austria sights editorially assessed
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/toptravellist-austria-complete-86-sights-20261122.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toptravellist-austria-all-sights-20261122
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout TopTravelList from public Playground with fallback token
        uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: audit/austria-remaining-86-individual-sight-review-2026
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: true
          path: repo
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project requirements
        working-directory: repo
        run: python -m pip install -r requirements.txt
      - name: Apply 86 remaining individual Austrian scoring decisions
        working-directory: repo
        run: |
          python -m py_compile scripts/review_sights_individually_2026.py
          python scripts/review_sights_individually_2026.py --apply
      - name: Global YAML schema and benchmark tests
        working-directory: repo
        run: |
          python scripts/validate.py
          python scripts/check_city_benchmarks.py
          python scripts/check_sight_benchmarks.py
      - name: Refresh and validate 197-country Markdown rankings and audit
        working-directory: repo
        run: |
          python scripts/generate_rankings.py
          python scripts/generate_rankings.py --check
          python scripts/review_sights_individually_2026.py --check
      - name: Independent exact coverage and source-label checks
        working-directory: repo
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path.cwd()
          stats=json.loads((root/'methodology/sight-review-2026-stats.json').read_text())
          assert stats['records']==1913
          assert stats['targeted']==501,stats
          assert stats['screened_only']==1412
          assert stats['source_referenced']==313
          assert stats['by_country']['AT']['reviewed']==133
          assert stats['by_country']['AT']['total']==133
          assert sum(1 for _ in (root/'countries').glob('*/cities/*.yaml'))==703
          assert sum(1 for _ in (root/'countries').glob('*/sights/*.yaml'))==1913
          lines=(root/'methodology/sight-review-decisions-2026/AT.tsv').read_text().splitlines()
          rows=[line for line in lines if line and not line.startswith('#')]
          assert len(rows)==133
          slugs={line.split('|')[0] for line in rows}
          assert slugs=={file.stem for file in (root/'countries/AT/sights').glob('*.yaml')}
          fresh=set()
          baseline=(root/'methodology/sight-review-2026-baseline.json')
          assert len(json.loads(baseline.read_text()))==1913
          for line in rows:
              k,vals,override,reason=line.split('|')
              assert len(vals.split(','))==5
              assert len(reason)>=60
          print('PASS: all 133 Austrian sights individually decided, 501 worldwide, 1412 pending.')
          PY
      - name: Commit canonical 86 source YAMLs, regenerations and audit
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'toptravellist-editorial-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add countries/AT/sights/*.yaml countries/AT/sights.md
          git add methodology/sight-review-2026-full-audit.md
          git add methodology/sight-review-2026-summary.md
          git add methodology/sight-review-2026-stats.json
          git diff --cached --check
          git diff --cached --name-only > /tmp/changed-files
          count="$(grep -Ec '^countries/AT/sights/[a-z0-9-]+[.]yaml$' /tmp/changed-files)"
          test "$count" -ge 65
          if grep -E '^countries/.*/cities/' /tmp/changed-files; then exit 1; fi
          git commit -m 'Individually score all 86 previously pending Austrian sights'
          git push origin HEAD:refs/heads/audit/austria-remaining-86-individual-sight-review-2026
