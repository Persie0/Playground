name: Toothfairy private development APK
on:
  push:
    branches: [ci/toothfairy-apk-20261126]
    paths: [.github/workflows/toothfairy-development-apk.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toothfairy-development-apk
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      SOURCE_SHA: 20f3d9fef56c4d5f78b8ea38f66b69ee7d8f42dc
      IMAGE: unityci/editor:ubuntu-6000.3.29f1-android-4.0.0
    steps:
      - name: Check Unity license and repository access
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$PRIVATE_TOKEN" ]]; then
            echo "::error::No private repository token configured."
            exit 1
          fi
          if [[ -n "$UNITY_LICENSE" && -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]]; then
            echo "Unity Personal license and account credentials configured (activation not yet verified)."
          elif [[ -n "$UNITY_SERIAL" && -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]]; then
            echo "Unity serial credentials configured (activation not yet verified)."
          else
            echo "::error::Unity activation missing. Configure UNITY_LICENSE (or UNITY_SERIAL), UNITY_EMAIL and UNITY_PASSWORD on Playground. No APK produced."
            exit 1
          fi
      - name: Fetch exact private source
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/toothfairy-src" "$RUNNER_TEMP/toothfairy-private"
          git -C "$RUNNER_TEMP/toothfairy-src" init -q
          git -C "$RUNNER_TEMP/toothfairy-src" remote add origin https://github.com/Persie0/Toothfairy.git
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -C "$RUNNER_TEMP/toothfairy-src" -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --quiet --depth=1 origin "$SOURCE_SHA" >"$RUNNER_TEMP/toothfairy-private/fetch.log" 2>&1
          git -C "$RUNNER_TEMP/toothfairy-src" checkout -q --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/toothfairy-src" rev-parse HEAD)" = "$SOURCE_SHA"
          echo "Pinned source fetched."
      - name: Retrieve review images of exact verified fairy asset
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          src="$RUNNER_TEMP/toothfairy-src"
          logs="$RUNNER_TEMP/toothfairy-private"
          mkdir -p "$logs/rig/review"
          auth="$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -C "$src" -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --quiet --depth=2 origin refs/heads/ci/model-review/45833287178-1 >"$logs/rig/review.log" 2>&1
          # App-only changes are allowed; verify that both asset blobs match the reviewed rig exactly.
          for asset in assets-source/Fairy.blend mobile/Assets/Toothfairy/Resources/Fairy/Fairy.fbx; do
            test "$(git -C "$src" rev-parse "HEAD:$asset")" = "$(git -C "$src" rev-parse "FETCH_HEAD^:$asset")"
          done
          for name in Fairy-front Fairy-three-quarter Fairy-face Fairy-profile Fairy-grip Fairy-free-hand Fairy-posed; do
            git -C "$src" show "FETCH_HEAD:.ci/model-review/$name.jpg" >"$logs/rig/review/$name.jpg"
            test -s "$logs/rig/review/$name.jpg"
          done
          test -s "$src/mobile/Assets/Toothfairy/Resources/Fairy/Fairy.fbx"
          echo "Using exact Blender-verified V14 FBX; no regeneration."
      - name: Provision bundled Android offline speech
        shell: bash
        run: |
          set -euo pipefail
          bash "$RUNNER_TEMP/toothfairy-src/tools/fetch_offline_speech.sh" >"$RUNNER_TEMP/toothfairy-private/speech.log" 2>&1 || { echo "::error::Offline speech dependencies unavailable."; exit 1; }
          echo "Pinned offline speech dependencies and model archives verified."
      - name: Pull pinned-version Android editor
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$IMAGE" >/dev/null
      - name: Activate, prepare, run EditMode tests and build APK
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          log="$RUNNER_TEMP/toothfairy-private/unity.log"
          docker run --rm --shm-size=2g \
            -e UNITY_LICENSE -e UNITY_SERIAL -e UNITY_EMAIL -e UNITY_PASSWORD \
            -v "$RUNNER_TEMP/toothfairy-src:/src" \
            --entrypoint /bin/bash "$IMAGE" -c '
              set -euo pipefail
              export UNITY_EDITOR="$(command -v unity-editor)"
              test -x "$UNITY_EDITOR"
              mkdir -p /BlankProject/Assets
              export HOME=/root
              mkdir -p /tmp/toothfairy-activation
              activated=0
              cleanup() {
                if [[ "$activated" == 1 && -n "$UNITY_SERIAL" && -n "$UNITY_EMAIL" && -n "$UNITY_PASSWORD" ]]; then
                  "$UNITY_EDITOR" -batchmode -nographics -quit -returnlicense -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -projectPath /BlankProject -logFile /tmp/toothfairy-activation/return.log >/dev/null 2>&1 || true
                fi
              }
              trap cleanup EXIT
              # GameCI activates a fresh entitlement using the serial embedded in a Personal ULF.
              # Never copy a workstation-bound ULF into this ephemeral editor.
              if [[ -n "$UNITY_LICENSE" && -z "$UNITY_SERIAL" ]]; then
                UNITY_SERIAL="$(python3 -c "import os,base64,xml.etree.ElementTree as E; raw=os.environ[\"UNITY_LICENSE\"].strip(); root=E.fromstring(raw if raw.startswith(\"<\") else base64.b64decode(raw)); data=root.find(\".//DeveloperData\"); assert data is not None; print(base64.b64decode(data.attrib[\"Value\"])[4:].decode(\"ascii\").strip())")"
              fi
              if [[ ! "$UNITY_SERIAL" =~ ^[A-Z0-9-]+$ ]]; then
                echo "STAGE_LICENSE_FORMAT_INVALID"
                exit 1
              fi
              unset UNITY_LICENSE
              if [[ "$UNITY_SERIAL" == F* ]]; then
                dbus-uuidgen > /etc/machine-id
                mkdir -p /var/lib/dbus
                ln -sf /etc/machine-id /var/lib/dbus/machine-id
              fi
              echo "STAGE_ACTIVATING"
              for attempt in 1 2 3 4 5; do
                if "$UNITY_EDITOR" -quit -serial "$UNITY_SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -projectPath /BlankProject -logFile /tmp/toothfairy-activation/activation.log; then
                  activated=1
                  break
                fi
                if [[ "$attempt" != 5 ]]; then sleep $((15*(2**(attempt-1)))); fi
              done
              if [[ "$activated" != 1 ]]; then
                echo "STAGE_ACTIVATION_FAILED"
                if grep -qiE "invalid.*password|authentication failed|invalid credentials" /tmp/toothfairy-activation/activation.log; then echo "CLASS_AUTHENTICATION"; fi
                if grep -qiE "activation.*limit|maximum.*activations|no seats" /tmp/toothfairy-activation/activation.log; then echo "CLASS_SEAT_LIMIT"; fi
                if grep -qiE "no valid unity editor license|no license activation|0 entitlement|failed to activate entitlement" /tmp/toothfairy-activation/activation.log; then echo "CLASS_NO_ENTITLEMENT"; fi
                if grep -qiE "access token is unavailable|failed to update access token|failed to get access token" /tmp/toothfairy-activation/activation.log; then echo "CLASS_ACCESS_TOKEN"; fi
                if grep -qiE "project.*(not found|does not exist|invalid)|could not find project" /tmp/toothfairy-activation/activation.log; then echo "CLASS_PROJECT_PATH"; fi
                if grep -qiE "display.*(failed|unavailable)|cannot open display|xvfb.*error" /tmp/toothfairy-activation/activation.log; then echo "CLASS_DISPLAY"; fi
                if grep -qiE "connection timed out|could not resolve|network error|TLS handshake" /tmp/toothfairy-activation/activation.log; then echo "CLASS_NETWORK"; fi
                if [[ ! -s /tmp/toothfairy-activation/activation.log ]]; then echo "CLASS_NO_EDITOR_LOG"; fi
                exit 1
              fi
              echo "STAGE_ACTIVATED"
              echo "STAGE_BUILD_START"
              bash /src/tools/unity_development.sh Android
              test -s /src/mobile/Builds/Android/Toothfairy-debug.apk
            ' >"$log" 2>&1 || {
              echo "::error::Unity activation, import, tests or Android build failed. No APK produced. Private logs not printed."
              # Print only whitelisted stage markers and compiler codes, never raw private logs.
              grep -xE "STAGE_(LICENSE_FORMAT_INVALID|ACTIVATING|ACTIVATION_FAILED|ACTIVATED|BUILD_START)|CLASS_(AUTHENTICATION|SEAT_LIMIT|NO_ENTITLEMENT|ACCESS_TOKEN|PROJECT_PATH|DISPLAY|NETWORK|NO_EDITOR_LOG)" "$log" || true
              grep -hEo 'error CS[0-9]{4}' "$RUNNER_TEMP/toothfairy-src/mobile/Logs/"*.log 2>/dev/null | sort | uniq -c || true
              exit 1
            }
          grep -xE "STAGE_(ACTIVATED|BUILD_START)" "$log" || true
          echo "Development APK built; EditMode gate passed."
      - name: Publish APK to private draft release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          apk="$RUNNER_TEMP/toothfairy-src/mobile/Builds/Android/Toothfairy-debug.apk"
          test -s "$apk"
          unzip -tq "$apk" >/dev/null
          python3 "$RUNNER_TEMP/toothfairy-src/tools/check_android_speech_package.py" "$apk"
          python3 "$RUNNER_TEMP/toothfairy-src/tools/check_android_gpu_package.py" "$apk"
          test "$(gh repo view Persie0/Toothfairy --json isPrivate --jq .isPrivate)" = true
          tag="dev-apk-${SOURCE_SHA:0:7}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh release create "$tag" "$apk" "$RUNNER_TEMP/toothfairy-private/rig/review/"*.jpg --repo Persie0/Toothfairy --target "$SOURCE_SHA" \
            --draft --prerelease --title "Toothfairy development APK ($SOURCE_SHA)" \
            --notes "Development-only ARM64 debug APK. Unity EditMode and speech-package gates passed. Blender review renders attached; physical-device acceptance remains pending." \
            >"$RUNNER_TEMP/toothfairy-private/release.log" 2>&1
          echo "APK uploaded to private draft release."
      - name: Merge exactly the reviewed PR after successful build and package checks
        if: success() && env.SOURCE_SHA == '20f3d9fef56c4d5f78b8ea38f66b69ee7d8f42dc'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/toothfairy-private/merge.log"
          {
            test "$(gh repo view Persie0/Toothfairy --json isPrivate --jq .isPrivate)" = true
            pr="$(gh api repos/Persie0/Toothfairy/pulls/2)"
            if [[ "$(jq -r .merged <<< "$pr")" == true ]]; then
              test "$(jq -r .head.sha <<< "$pr")" = "$SOURCE_SHA"
            else
              test "$(jq -r .state <<< "$pr")" = open
              test "$(jq -r .head.sha <<< "$pr")" = "$SOURCE_SHA"
              test "$(jq -r .base.ref <<< "$pr")" = main
              test "$(jq -r .base.sha <<< "$pr")" = 97cd27159c80c9fd2723aad84b61539261e90d51
              if [[ "$(jq -r .draft <<< "$pr")" == true ]]; then
                gh pr ready 2 --repo Persie0/Toothfairy
              fi
              gh api --method PUT repos/Persie0/Toothfairy/pulls/2/merge -f sha="$SOURCE_SHA" -f merge_method=merge -f commit_title="Merge reviewed Toothfairy development improvements" | jq -e '.merged == true'
            fi
          } >"$log" 2>&1 || { echo "Merge gate blocked; no unverified revision was merged."; exit 1; }
          echo "Reviewed PR merged after successful validation."
      - name: Retain compiler diagnostics in private source repository
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/toothfairy-src"
          report="$RUNNER_TEMP/toothfairy-private/compiler-diagnostics.txt"
          test -d "$RUNNER_TEMP/toothfairy-private" || exit 0
          # Retain selected project build diagnostics privately, excluding activation and credentials logs.
          grep -hiE 'error CS[0-9]{4}|BuildFailedException|Exception:|FAILURE: Build failed|Execution failed for task|^[[:space:]]*[*] What went wrong:|^[[:space:]]*> .*failed|Tests failed|Failed: [1-9]|TOOTHFAIRY_PREPARE_OK|TOOTHFAIRY_BUILD_OK|Test run completed' "$src/mobile/Logs/"*.log 2>/dev/null | sort -u | head -n 200 > "$report" || true
          # Blender output is private; keep the ending context needed to repair generation/roundtrip.
          for stage in generate verify render commit push; do
            file="$RUNNER_TEMP/toothfairy-private/rig/$stage.log"
            if [[ -s "$file" ]]; then
              printf '\n--- Rig %s ---\n' "$stage" >> "$report"
              tail -n 60 "$file" >> "$report"
            fi
          done
          if [[ -s "$RUNNER_TEMP/toothfairy-private/speech.log" ]]; then tail -n 30 "$RUNNER_TEMP/toothfairy-private/speech.log" >> "$report"; fi
          # Append actual NUnit failure names, messages and stack traces privately.
          python3 - "$src/mobile/Logs" >> "$report" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for path in Path(sys.argv[1]).glob("editmode-*.xml"):
              try:
                  root = ET.parse(path).getroot()
                  print("NUnit summary:", {k: root.get(k) for k in ("result", "total", "passed", "failed", "skipped", "inconclusive")})
                  for case in root.iter("test-case"):
                      if case.get("result") == "Passed":
                          continue
                      print("TEST:", case.get("fullname"), case.get("result"))
                      for tag in ("failure/message", "failure/stack-trace", "reason/message"):
                          value = case.findtext(tag)
                          if value:
                              print(value[:4000])
              except (OSError, ET.ParseError) as exc:
                  print("NUnit report unreadable:", type(exc).__name__)
          PY
          test -s "$report" || { echo "No build diagnostics available."; exit 0; }
          test "$(gh repo view Persie0/Toothfairy --json isPrivate --jq .isPrivate)" = true
          diag_branch="ci/diagnostics/toothfairy-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gh api --method POST repos/Persie0/Toothfairy/git/refs -f ref="refs/heads/$diag_branch" -f sha="$SOURCE_SHA" >/dev/null
          gh api --method PUT repos/Persie0/Toothfairy/contents/.ci/compiler-diagnostics.txt -f message="Private compiler diagnostics for build $GITHUB_RUN_ID" -f branch="$diag_branch" -f content="$(base64 -w0 "$report")" >/dev/null
          echo "Compiler diagnostics retained in private source repository."
      - name: Cleanup private build data
        if: always()
        shell: bash
        run: |
          sudo rm -rf "$RUNNER_TEMP/toothfairy-src" "$RUNNER_TEMP/toothfairy-private"
