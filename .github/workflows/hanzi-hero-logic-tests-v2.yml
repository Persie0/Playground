name: Norwegian Yoyillo private verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hanzi-hero-logic-tests-v2.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout Norwegian Yoyillo
        uses: actions/checkout@v5
        with:
          repository: Persie0/norwegian_yoyillo
          ref: sync/hanzi-latest-fixes-20260921
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify privately
        shell: bash
        run: |
          set -e
          cd app
          flutter pub get >/tmp/norwegian-pub.log 2>&1 || { echo "::error::Dependency resolution failed"; exit 1; }
          echo "PASS: Flutter dependency resolution"
          flutter analyze >/tmp/norwegian-analyze.log 2>&1 || { echo "::error::Static analysis failed"; exit 1; }
          echo "PASS: Static analysis"
          flutter test >/tmp/norwegian-test.log 2>&1 || { echo "::error::Flutter tests failed"; exit 1; }
          echo "PASS: Flutter tests"
