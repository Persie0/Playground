name: Norwegian Yoyillo analyzer diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hanzi-hero-logic-tests-v2.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/norwegian_yoyillo
          ref: sync/hanzi-latest-fixes-20260921
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get >/dev/null
      - name: Analyze
        shell: bash
        run: |
          set +e
          flutter analyze > /tmp/analyze.log 2>&1
          rc=$?
          grep -E '(^| )error •|(^| )warning •|^[[:space:]]*[a-z_]+ •' /tmp/analyze.log || true
          exit $rc
