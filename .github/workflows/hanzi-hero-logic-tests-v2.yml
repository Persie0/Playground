name: Norwegian Yoyillo sync regression diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hanzi-hero-logic-tests-v2.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/norwegian_yoyillo
          ref: sync/hanzi-latest-fixes-20260921
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get >/dev/null
      - name: Run sync regression test
        shell: bash
        run: |
          set +e
          flutter test test/services/progress_sync_payload_service_test.dart > /tmp/test.log 2>&1
          rc=$?
          if [[ $rc -ne 0 ]]; then
            grep -E '(^[[:space:]]*[0-9]+:[0-9]+|Expected:|Actual:|Which:|Test failed|Some tests failed|Error:|Exception:)' /tmp/test.log || true
          else
            echo "PASS: sync regression test"
          fi
          exit $rc
