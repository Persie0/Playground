name: Norwegian Yoyillo current-main verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hanzi-hero-logic-tests-v2.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/norwegian_yoyillo
          ref: sync/hanzi-latest-fixes-current-main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify Norwegian Yoyillo
        shell: bash
        run: |
          set -e
          cd app
          flutter pub get >/tmp/norwegian-pub.log 2>&1 || { echo "::error::Dependency resolution failed"; exit 1; }
          echo "PASS: Flutter dependency resolution"
          flutter analyze >/tmp/norwegian-analyze.log 2>&1 || { grep -E 'error •|warning •|info •' /tmp/norwegian-analyze.log || true; echo "::error::Static analysis failed"; exit 1; }
          echo "PASS: Static analysis"
          flutter test test/services/gdrive_progress_sync_service_test.dart >/tmp/norwegian-test.log 2>&1 || { grep -E 'Expected:|Actual:|Which:|Test failed|Some tests failed|Error:|Exception:' /tmp/norwegian-test.log || true; echo "::error::Drive regression tests failed"; exit 1; }
          echo "PASS: Drive regression tests"
