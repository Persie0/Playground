name: HanziHero private logic tests

on:
  push:
    branches: [main]
    paths:
      - 'hanzi-hero-tests/run.txt'
      - '.github/workflows/hanzi-hero-logic-tests-v2.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag/SHA in Persie0/hanzi_hero
        required: false
        default: chore/r8-modernization-20260919
        type: string

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/hanzi_hero
  APP_REF: ${{ inputs.ref || 'chore/r8-modernization-20260919' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout app revision
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app
      - name: Checkout private CI harness
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-ci
          sparse-checkout: .github/playground
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21.x'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Run private R8 review suite
        run: bash private-ci/.github/playground/r8-review.sh app
