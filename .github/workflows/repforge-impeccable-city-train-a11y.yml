name: RepForge Impeccable City and Train accessibility validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repforge-impeccable-city-train-a11y.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Clone pinned private RepForge branch
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          SOURCE_BRANCH: feat/impeccable-city-train-a11y-20261121
          SOURCE_SHA: cf3424e87db57fa25102415ce2ea0dae876f10ff
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Missing private read token'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --quiet --depth 1 --branch "$SOURCE_BRANCH" \
            https://github.com/Persie0/gameexercise.git source
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA" || { echo 'Source moved; refusing unpinned run'; exit 1; }
      - name: Flutter analysis and regression tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get > /tmp/pub.log 2>&1 || { tail -n 50 /tmp/pub.log; exit 1; }
          dart format --output=none lib test > /tmp/format.log 2>&1 || { tail -n 70 /tmp/format.log; exit 1; }
          flutter analyze > /tmp/analyze.log 2>&1 || { tail -n 100 /tmp/analyze.log; exit 1; }
          flutter test test/exercise_library_screen_test.dart --reporter expanded > /tmp/train_focus.log 2>&1 || {
            echo '=== Detailed Train widget failures ==='
            tail -n 320 /tmp/train_focus.log | cut -c 1-300
            exit 1
          }
          flutter test --reporter compact > /tmp/tests.log 2>&1 || {
            tr '\r' '\n' < /tmp/tests.log | grep -E '\[E\]|TestFailure|Expected:|Actual:|The test description was:' | tail -n 120 || true
            tail -n 90 /tmp/tests.log | cut -c 1-250
            exit 1
          }
          tail -n 6 /tmp/analyze.log
          tail -n 10 /tmp/tests.log | cut -c 1-220
      - name: Compile Android debug app
        working-directory: source
        run: |
          set -euo pipefail
          flutter build apk --debug > /tmp/android.log 2>&1 || { tail -n 100 /tmp/android.log | cut -c 1-260; exit 1; }
          test -s build/app/outputs/flutter-apk/app-debug.apk
          echo 'Android debug compilation succeeded (APK not uploaded)'
