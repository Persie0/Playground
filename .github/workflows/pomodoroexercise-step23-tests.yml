# Run 2: correctly sized MediaQuery fixtures and lazy routine-card scrolling.
# Run 2: import Flutter VoidCallback for the fake backend.
name: FocusMove Step 23 timer reliability and no-duplicate-credit tests

on:
  push:
    paths:
      - '.github/workflows/pomodoroexercise-step23-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private FocusMove UX branch on ephemeral public runner
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/23-timer-reliability-hardening https://github.com/Persie0/pomodoroexercise.git source
      - name: Format Step 23 timer reliability changes (runner only)
        shell: bash
        working-directory: source
        run: |
          dart format lib/src/features/timer/persistent_timer_controller.dart lib/src/screens/privacy_settings_screen.dart test/timer_reliability_stress_test.dart
      - name: Analyze and test (no artifacts uploaded)
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test --reporter expanded
