name: Photosphere checkpoint322 native output init and secondary branches
on:
  push:
    branches: [research/photosphere-checkpoint322-output]
    paths: [.github/workflows/photosphere-checkpoint322-output.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-arm64-output:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install original machine-code execution packages
        run: python3 -m pip install --break-system-packages --quiet unicorn capstone pyelftools
      - name: Fetch checksum-verified original Google Camera ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk'
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Checkout exact source research commit read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 74869de5c12b3819d020222426b4834bc885a5f1
          path: research
          sparse-checkout: |
            research/photosphere/checkpoint322
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Execute original ARM64 output branches
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 74869de5c12b3819d020222426b4834bc885a5f1
          python3 research/research/photosphere/checkpoint322/native_original_output_branches.py original.so --output checkpoint322-original-output.json | tee checkpoint322-original-output.log
          grep -q '^CHECKPOINT322_ORIGINAL_OUTPUT_BRANCH_PASS' checkpoint322-original-output.log
          echo CHECKPOINT322_ORIGINAL_OUTPUT_JSON_BEGIN
          cat checkpoint322-original-output.json
          echo CHECKPOINT322_ORIGINAL_OUTPUT_JSON_END
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint322-original-output
          path: |
            checkpoint322-original-output.json
            checkpoint322-original-output.log
          retention-days: 14
