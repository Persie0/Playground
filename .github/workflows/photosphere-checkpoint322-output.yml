name: Photosphere checkpoint322 native output init and secondary branches
on:
  push:
    branches: [research/photosphere-checkpoint322-output]
    paths: [.github/workflows/photosphere-checkpoint322-output.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-arm64-output:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install original machine-code execution packages
        run: python3 -m pip install --break-system-packages --quiet unicorn capstone pyelftools
      - name: Fetch checksum-verified original Google Camera ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk'
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Checkout exact source research commit read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 1c55bc965bb015658f8f51b2e9b33e96075d2f8f
          path: research
          sparse-checkout: |
            research/photosphere/checkpoint322
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Execute original ARM64 output branches
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 1c55bc965bb015658f8f51b2e9b33e96075d2f8f
          python3 research/research/photosphere/checkpoint322/native_original_output_branches.py original.so --output checkpoint322-original-output.json | tee checkpoint322-original-output.log
          grep -q '^CHECKPOINT322_ORIGINAL_OUTPUT_BRANCH_PASS' checkpoint322-original-output.log
          echo CHECKPOINT322_ORIGINAL_OUTPUT_JSON_BEGIN
          cat checkpoint322-original-output.json
          echo CHECKPOINT322_ORIGINAL_OUTPUT_JSON_END
      - name: Checkout exact checkpoint322 Rust branch commit read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: ee97de080e5ded8ec1c7a6eeb03eb28182422acf
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Compare fresh original ARM64 oracle with checked-in Rust fixture
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = ee97de080e5ded8ec1c7a6eeb03eb28182422acf
          python3 - <<'PY'
          import json
          from pathlib import Path
          original=json.loads(Path("checkpoint322-original-output.json").read_text())
          for c in original["cases"]:
              trace=c.pop("original_trace_pcs")
              c["original_trace_start_pc"]=trace[0]
              c["original_trace_end_pc"]=trace[-1]
              c["original_source_ret_executed"]="0x3b81a8" in trace
              c["original_source_init_entry_executed"]="0x3b8254" in trace
              c["original_secondary_output_entry_executed"]="0x3b81ac" in trace
              c["original_trace_instruction_count"]=len(trace)
          frozen=json.loads(Path("app/tests/fixtures/native_original_output_branches_322.json").read_text())
          assert original==frozen, "live original ARM64 output/initialization differs from Rust fixture"
          assert original["original_case_count"]==9
          assert original["original_secondary_receiver_calls"]==6
          assert original["original_opcode_pins"]==29
          print("CHECKPOINT322_FRESH_SOURCE_ORIGINAL_RUST_EQUAL",9,6,29)
          PY
      - name: Run focused and full Rust library regression
        run: |
          set -euo pipefail
          cd app
          rustfmt --edition 2021 src/native_line_output_branches.rs src/native_line_output_branches_checkpoint322_test.rs
          cargo test --lib checkpoint322 -- --nocapture
          cargo test --lib
      - name: Read back formatted Rust source
        run: |
          echo CHECKPOINT322_RUST_MODEL_BEGIN
          cat app/src/native_line_output_branches.rs
          echo CHECKPOINT322_RUST_MODEL_END
          echo CHECKPOINT322_RUST_TEST_BEGIN
          cat app/src/native_line_output_branches_checkpoint322_test.rs
          echo CHECKPOINT322_RUST_TEST_END
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint322-original-output
          path: |
            checkpoint322-original-output.json
            checkpoint322-original-output.log
          retention-days: 14
