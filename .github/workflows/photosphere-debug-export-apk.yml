name: Photo Sphere UX audit APK
run-name: Build Photo Sphere UX audit APK (05deb5354dcd)
on:
  push:
    branches:
      - build/photosphere-debug-export-20261123
    paths:
      - .github/workflows/photosphere-debug-export-apk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-export-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      SOURCE_SHA: 05deb5354dcd33b3665ab5fc232a2641cf0aacc0
    steps:
      - name: Checkout public Playground scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: playground

      - name: Checkout pinned private Photo Sphere PR source
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 05deb5354dcd33b3665ab5fc232a2641cf0aacc0
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: engine

      - name: Verify exact PR commit
        run: test "$(git -C engine rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Set up Rust for native JNI libraries
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: Locate Android SDK and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          test -d "$SDK"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          NDK_DIR="$(find "$SDK/ndk" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sort -V | tail -1 || true)"
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -1)"
          if [[ -z "$NDK_DIR" ]]; then
            for attempt in 1 2 3; do
              if "$SDKMANAGER" "ndk;27.2.12479018"; then break; fi
              sleep 8
            done
            NDK_DIR="$SDK/ndk/27.2.12479018"
          fi
          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android29-clang"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          if [[ ! -f "$SDK/platforms/android-35/android.jar" || ! -d "$SDK/build-tools/35.0.0" ]]; then
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Configure existing Maven mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.gradle/init.d"
          cp playground/scripts/photosphere-maven-mirror.init.gradle "$HOME/.gradle/init.d/photosphere-maven-mirror.gradle"

      - name: Check Android JVM unit tests and lint
        working-directory: engine/android
        env:
          # Robolectric resolves android-all outside Gradle's Maven repository
          # configuration. Match the trusted public Central mirror used above.
          JAVA_TOOL_OPTIONS: -Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2/
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gradle --no-daemon :app:testDebugUnitTest :app:lintDebug 2>&1 | tee android-check.log; then
              exit 0
            fi
            if ! grep -q 'MavenArtifactFetcher' android-check.log; then
              echo "Non-network test failure; do not retry" >&2
              exit 1
            fi
            echo "Robolectric dependency fetch failed; retry $attempt/3" >&2
            sleep 8
          done
          exit 1

      - name: Rebuild Rust libraries for arm64-v8a and x86_64
        working-directory: engine
        run: python3 tools/build_android.py

      - name: Assemble Android debug APK
        working-directory: engine/android
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify native libraries and APK
        shell: bash
        run: |
          set -euo pipefail
          test -s engine/android/app/src/main/jniLibs/arm64-v8a/libphotosphere.so
          test -s engine/android/app/src/main/jniLibs/x86_64/libphotosphere.so
          test -s engine/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -tq engine/android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p out
          cp engine/android/app/build/outputs/apk/debug/app-debug.apk out/PhotoSphere-UX-debug.apk
          sha256sum out/PhotoSphere-UX-debug.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSphere-UX-debug-05deb53
          path: out/PhotoSphere-UX-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish private debug APK release for easy download
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          TAG=debug-ux-05deb53
          if gh release view "$TAG" --repo Persie0/PhotosphereCleanroom >/dev/null 2>&1; then
            gh release upload "$TAG" out/PhotoSphere-UX-debug.apk --clobber --repo Persie0/PhotosphereCleanroom
          else
            gh release create "$TAG" out/PhotoSphere-UX-debug.apk --repo Persie0/PhotosphereCleanroom --target "$SOURCE_SHA" --prerelease --title "Photo Sphere UX audit APK" --notes "Debug-signed APK for PR #208, commit $SOURCE_SHA. Native JNI libraries rebuilt for arm64-v8a and x86_64."
          fi

      - name: Build summary
        shell: bash
        run: |
          echo "## Photo Sphere debugging ZIP APK" >> "$GITHUB_STEP_SUMMARY"
          echo "Built from private PhotosphereCleanroom PR #208 commit $SOURCE_SHA." >> "$GITHUB_STEP_SUMMARY"
          echo "Public workflow compiled the Rust Android libraries, ran Android JVM tests and lint, and verified the installable APK." >> "$GITHUB_STEP_SUMMARY"
          echo "Download the PhotoSphere-UX-debug-05deb53 artifact from this run or use the matching private prerelease." >> "$GITHUB_STEP_SUMMARY"
