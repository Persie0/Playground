name: Test Resistor Scanner combined quota and Appodeal
# Final smoke: resume original gallery/camera action after ad approval; model audit and quota tests.
on:
  push:
    paths:
      - .github/workflows/resistor-appodeal-combined-quota-ci.yml
  workflow_dispatch:
permissions:
  contents: read

jobs:
  kotlin-build-and-quota-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout Resistor Scanner feature branch using public runner
        uses: actions/checkout@v4
        with:
          repository: Persie0/resistor-scanner-android
          ref: feat/combined-quota-appodeal-scan-ads
          path: scanner
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          if ! "$SDKMANAGER" --channel=3 "platforms;android-37" "build-tools;36.0.0" >/dev/null; then
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null
            sed -i 's/compileSdk = 37/compileSdk = 36/; s/targetSdk = 37/targetSdk = 36/' scanner/app/build.gradle.kts
            echo "CI_API36_FALLBACK=true" >> "$GITHUB_ENV"
            echo "::warning::API36 checkout-only build used; AAR API37 metadata checks skipped for test only"
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Build with Appodeal and run quota unit tests
        shell: bash
        working-directory: scanner
        run: |
          set -euo pipefail
          chmod +x gradlew
          args=()
          if [ "${CI_API36_FALLBACK:-false}" = "true" ]; then
            args+=(-x :app:checkDebugAarMetadata -x :app:checkDebugAndroidTestAarMetadata)
          fi
          ./gradlew --no-daemon --stacktrace \
            :app:assembleDebug :app:testDebugUnitTest :app:assembleDebugAndroidTest "${args[@]}"

      - name: Verify encrypted model packaging
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q cryptography
          python scanner/tools/verify_packaged_models.py scanner/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish test APK and unit-test reports
        uses: actions/upload-artifact@v4
        with:
          name: resistor-scanner-combined-quota-appodeal-debug
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            scanner/app/build/outputs/apk/debug/app-debug.apk
            scanner/app/build/test-results/testDebugUnitTest/
