name: Noise Remover retry guard audit
on:
  push:
    paths:
      - '.github/workflows/noise-remover-retry-guard-audit.yml'
permissions:
  contents: read
env:
  APP_REPOSITORY: Persie0/noise_remover
  APP_REF: fix/audit-network-retry-guard
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout app
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check regression-test formatting
        run: dart format --output=none --set-exit-if-changed test/network_error_test.dart test/video_media_detection_regression_test.dart
      - name: Run affected regression tests
        run: >
          flutter test
          test/network_error_test.dart
          test/purchase_restriction_reporting_test.dart
          test/video_media_detection_regression_test.dart
          test/services/pro_update_recovery_regression_test.dart
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Full Flutter test suite
        run: flutter test
