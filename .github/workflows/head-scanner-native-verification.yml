name: Native Head Scanner verification
on:
  push:
    paths:
      - .github/workflows/head-scanner-native-verification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/head_scanner
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
      - name: Install Android SDK
        run: |
          SDKMGR=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | head -1)
          test -n "$SDKMGR"
          yes | "$SDKMGR" --licenses >/dev/null || true
          "$SDKMGR" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile Android without downloading model
        working-directory: source/android
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E '(headscan_lite.onnx|head_faces.bin)'
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/head_scanner
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: source
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Fetch real signed release-1 model assets
        run: python3 source/scripts/prepare_model.py
      - name: Generate Xcode project
        working-directory: source/ios
        run: xcodegen generate
      - name: Compile iOS simulator
        working-directory: source/ios
        run: xcodebuild -project HeadScanner.xcodeproj -scheme HeadScanner -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
