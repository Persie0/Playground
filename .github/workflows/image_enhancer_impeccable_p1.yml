name: Image Enhancer Impeccable P1 checks

on:
  push:
    branches: [image-enhancer-impeccable-p1-validation-20261120]
    paths: [.github/workflows/image_enhancer_impeccable_p1.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-enhancer-impeccable-p1-validation-20261120
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout private Image Enhancer P1 branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/image_enhancer
          ref: ui/impeccable-p1-followup-20261120
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: image_enhancer

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: image_enhancer
        run: flutter pub get

      - name: Generate all app localizations
        working-directory: image_enhancer
        run: flutter gen-l10n

      - name: Focused UX and localization tests
        working-directory: image_enhancer
        run: flutter test test/enhancement_presets_test.dart test/result_comparison_page_test.dart test/upscale_cancellation_regression_test.dart test/home_layout_test.dart --timeout 2m --reporter expanded

      - name: Static analysis
        working-directory: image_enhancer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Full Flutter regression suite
        working-directory: image_enhancer
        run: flutter test --concurrency=2 --timeout 2m --reporter compact

      - name: Install Android CMake 3.22.1 with retries
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          for attempt in 1 2 3 4; do
            echo "CMake SDK installation attempt $attempt/4"
            if "$SDKMANAGER" --sdk_root="$SDK" --install "cmake;3.22.1"; then
              test -x "$SDK/cmake/3.22.1/bin/cmake"
              exit 0
            fi
            rm -rf "$SDK/.temp" || true
            sleep $((attempt * 12))
          done
          echo "::error::Unable to install Android CMake 3.22.1"
          exit 1

      - name: Build Android debug APK
        working-directory: image_enhancer
        run: flutter build apk --debug --no-pub

# Revalidate final locked Pro model UX and all ARB locales.
