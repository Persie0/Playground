name: Photosphere checkpoint310 original numerical geometry
on:
  push:
    branches: [research/photosphere-checkpoint310-geometry-helper]
    paths: [.github/workflows/photosphere-checkpoint310-geometry-helper.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install source ARM64 analysis
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools unicorn
      - name: Fetch original source APK and extract SHA-pinned ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk'
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Inspect original numerical-helper FDE and geometry caller
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee checkpoint310-original-disasm.log
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE
          from hashlib import sha256
          from bisect import bisect_right
          b=Path('original.so').read_bytes()
          assert sha256(b).hexdigest()=='878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1'
          with Path('original.so').open('rb') as f:
              elf=ELFFile(f)
              fdes=sorted((int(e['initial_location']),int(e['initial_location'])+int(e['address_range'])) for e in elf.get_dwarf_info().EH_CFI_entries() if isinstance(e,FDE))
          starts=[p for p,e in fdes]
          def fde(pc):
              ix=bisect_right(starts,pc)-1
              return fdes[ix] if ix>=0 and pc<fdes[ix][1] else None
          for addr in [0x3139c0,0x3139fc,0x313a40,0x313ac4,0x3145c8,0x314650,0x314800]:
              print('CHECKPOINT310_FDE',hex(addr),tuple(hex(z) for z in fde(addr)) if fde(addr) else None)
          cs=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          for name,lo,hi in [
              ('entry-geometry',0x3139c0,0x313a9c),
              ('return-validator',0x313a9c,0x313bd0),
              ('later-geometry',0x313bd0,0x313dd0),
              ('native-helper',0x3145c8,0x314780),
              ('helper-continuation',0x314780,0x3149c0),
          ]:
              print('CHECKPOINT310_WINDOW_START',name,hex(lo),hex(hi))
              for i in cs.disasm(b[lo:hi],lo):
                  print(f'{i.address:#010x} {i.mnemonic:8} {i.op_str}')
              print('CHECKPOINT310_WINDOW_END',name)
          print('CHECKPOINT310_ORIGINAL_GEOMETRY_DISCOVERY_PASS',len(fdes))
          PY
          grep -q '^CHECKPOINT310_ORIGINAL_GEOMETRY_DISCOVERY_PASS' checkpoint310-original-disasm.log
      - name: Resolve original imported math function and matching lookup helper
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee checkpoint310-original-math-import.log
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE
          from bisect import bisect_right
          b=Path('original.so').read_bytes()
          with Path('original.so').open('rb') as f:
            e=ELFFile(f);p=e.get_section_by_name('.plt');re=e.get_section_by_name('.rela.plt');sym=e.get_section(int(re['sh_link']))
            mapping={int(p['sh_addr'])+0x20+j*0x10:sym.get_symbol(r['r_info_sym']).name for j,r in enumerate(re.iter_relocations())}
            fdes=sorted((int(v['initial_location']),int(v['initial_location'])+int(v['address_range'])) for v in e.get_dwarf_info().EH_CFI_entries() if isinstance(v,FDE))
          print('CHECKPOINT310_IMPORTED_3FBF70',mapping.get(0x3fbf70))
          for x in [0x3fbf70,0x3fbf30,0x313524,0x3139fc,0x3145c8,0x314824]:
            ix=bisect_right([a for a,z in fdes],x)-1
            v=fdes[ix] if ix>=0 and x<fdes[ix][1] else None
            print('CHECKPOINT310_OWNER',hex(x),None if v is None else tuple(hex(k) for k in v))
          cs=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          for name,a,z in [('lookup-helper',0x313524,0x31363c),('native-helper-return',0x314800,0x314874),('math-threshold',0x314640,0x3146b8)]:
            print('CHECKPOINT310_WINDOW_START',name)
            for i in cs.disasm(b[a:z],a):print(f'{i.address:#010x} {i.mnemonic:8} {i.op_str}')
            print('CHECKPOINT310_WINDOW_END',name)
          print('CHECKPOINT310_ORIGINAL_MATH_IMPORT_RESOLVED')
          PY
          grep -q '^CHECKPOINT310_ORIGINAL_MATH_IMPORT_RESOLVED' checkpoint310-original-math-import.log
      - name: Read-only original checkpoint310 research checkout
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 284d463ca35d6e46a8e6d52d8d43ec4280bdb267
          path: research
          sparse-checkout: |
            research/photosphere/checkpoint310
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify and execute exact original ARM64 affine lookup across 24 cases
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 284d463ca35d6e46a8e6d52d8d43ec4280bdb267
          python3 research/research/photosphere/checkpoint310/verify_original_affine_bin_index.py original.so --output checkpoint310-native-affine-pins.json | tee checkpoint310-native-affine-pins.log
          python3 research/research/photosphere/checkpoint310/native_original_affine_bin_index.py original.so --output checkpoint310-original-affine-bin-index.json | tee checkpoint310-original-affine-bin-index.log
          grep -q '^CHECKPOINT310_ORIGINAL_AFFINE_SOURCE_VERIFIED' checkpoint310-native-affine-pins.log
          grep -q '^CHECKPOINT310_ORIGINAL_AFFINE_EXECUTION_PASS 24' checkpoint310-original-affine-bin-index.log
      - name: Checkout pinned checkpoint310 Rust affine-bin regression
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: fb92f782236ab0cfe0d06aefbbb285f05fb18790
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Compare original source-executed 24-case oracle with Rust fixture and run library tests
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = fb92f782236ab0cfe0d06aefbbb285f05fb18790
          python3 - <<'PY'
          import json
          from pathlib import Path
          original=json.loads(Path('checkpoint310-original-affine-bin-index.json').read_text())
          fixture=json.loads(Path('app/tests/fixtures/native_original_affine_bin_index_310.json').read_text())
          if original!=fixture:
              for key in sorted(set(original)|set(fixture)):
                  if original.get(key)==fixture.get(key):continue
                  if key=="cases":
                      for i,(a,b) in enumerate(zip(original.get(key,[]),fixture.get(key,[]))):
                          for field in sorted(set(a)|set(b)):
                              if a.get(field)!=b.get(field):
                                  print('CHECKPOINT310_AFFINE_CASE_DIFFERENCE',i,a.get('name'),field,repr(a.get(field))[:600],repr(b.get(field))[:600])
                  else:
                      print('CHECKPOINT310_AFFINE_TOP_DIFFERENCE',key,repr(original.get(key))[:600],repr(fixture.get(key))[:600])
              raise AssertionError('fresh original 24-case ARM64 affine output differs from Rust fixture')
          assert original['original_executed_case_count']==24
          print('CHECKPOINT310_FRESH_NATIVE_RUST_AFFINE_EQUAL',len(original['cases']))
          PY
          cd app
          git diff --check
          rustfmt --edition 2021 --check src/native_line_affine_bin_index.rs
          cargo test --lib checkpoint310_ -- --nocapture
          cargo test --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint310-original-geometry-disasm
          path: |
            checkpoint310-original-disasm.log
            checkpoint310-original-math-import.log
            checkpoint310-native-affine-pins.json
            checkpoint310-native-affine-pins.log
            checkpoint310-original-affine-bin-index.json
            checkpoint310-original-affine-bin-index.log
          retention-days: 14
