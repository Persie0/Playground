name: Resistor Scanner iOS Impeccable UX validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resistor-ios-impeccable-ux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 65
    steps:
      - name: Checkout private iOS UI branch through public Playground
        uses: actions/checkout@v4
        with:
          repository: Persie0/resistor-scanner-ios
          ref: 16ee6283011d04cbae1aeccf09ea49b7ff0559ad
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          submodules: false
          persist-credentials: false
          path: source

      - name: Run all Swift core tests
        shell: bash
        run: |
          set -euo pipefail
          cd source
          swift test 2>&1 | tee "$RUNNER_TEMP/resistor-ux-swift-test.log"

      - name: Parse all native Swift app source files without package resolution
        shell: bash
        run: |
          set -euo pipefail
          find source/ResistorScanner -name '*.swift' -print0 | xargs -0 swiftc -frontend -parse
          echo 'Native Swift source syntax OK'

      # This checks real production UI source against Apple's Simulator SDK.
      # It does not mock the scanner engine or claim full app compilation.
      - name: Type-check independent scanner SwiftUI components with iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          target="$(uname -m)-apple-ios17.0-simulator"
          modules="$RUNNER_TEMP/resistor-ios-modules"
          mkdir -p "$modules"
          xcrun --sdk iphonesimulator swiftc -swift-version 6 -sdk "$sdk" -target "$target" \
            -parse-as-library -module-name ResistorScannerCore -emit-module \
            -emit-module-path "$modules/ResistorScannerCore.swiftmodule" \
            source/Sources/ResistorScannerCore/*.swift
          xcrun --sdk iphonesimulator swiftc -swift-version 6 -sdk "$sdk" -target "$target" \
            -I "$modules" -typecheck \
            source/ResistorScanner/UI/BandChip.swift \
            source/ResistorScanner/UI/ResultCard.swift \
            source/ResistorScanner/UI/ScannerControls.swift \
            source/ResistorScanner/UI/ScannerOverlay.swift
          echo 'Independent native SwiftUI components passed iOS SDK type-checking.'

      - name: Check for obsolete ONNX dependencies
        shell: bash
        run: |
          set -euo pipefail
          if grep -REn 'OnnxRuntimeBindings|OrtSessionFactory|OrtBandNet|onnxruntime-swift-package-manager|onnxruntime in Frameworks' source/ResistorScanner source/ResistorScanner.xcodeproj; then
            echo 'Unexpected ONNX runtime reference'
            exit 1
          fi

      - name: Compile iOS simulator app without signing
        shell: bash
        run: |
          set -euo pipefail
          cd source
          xcodebuild -project ResistorScanner.xcodeproj -scheme ResistorScanner \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO build \
            > "$RUNNER_TEMP/resistor-ux-xcodebuild.log" 2>&1 || {
              grep -nE 'error:|fatal error:|BUILD FAILED' "$RUNNER_TEMP/resistor-ux-xcodebuild.log" | tail -100 || true
              tail -70 "$RUNNER_TEMP/resistor-ux-xcodebuild.log"
              exit 1
            }
          grep 'BUILD SUCCEEDED' "$RUNNER_TEMP/resistor-ux-xcodebuild.log"
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/ResistorScanner.app"
          test -s "$app/Models/resistor_bandnet.tflite.enc"
          test -s "$app/Models/resistor_bandnet.outputs.json"
          test -s "$app/Models/resistor_segmenter_ppliteseg.tflite.enc"
          if find "$app" -iname '*onnx*' -print | grep -q .; then
            echo 'Unexpected ONNX artifact packaged'
            exit 1
          fi
          echo 'Both encrypted TFLite models present; no ONNX artifacts packaged.'


      - name: Launch actual iOS app and capture native screenshot matrix
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/ResistorScanner.app"
          bash source/Scripts/capture_simulator_ui.sh "$app" "$RUNNER_TEMP/resistor-native-qa"

      - name: Exercise real onboarding, settings and legal flows
        shell: bash
        timeout-minutes: 25
        run: |
          set -euo pipefail
          cd source
          device="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for key, ds in reversed(list(json.load(sys.stdin)["devices"].items())) if "iOS-" in key for d in ds if d["name"].startswith("iPhone") and d.get("isAvailable")))')"
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/ResistorScanner.app"
          xcrun simctl privacy "$device" revoke camera at.austriao.resistor-scanner
          xcrun simctl ui "$device" appearance light
          xcrun simctl ui "$device" content_size large || true
          xcodebuild -project ResistorScanner.xcodeproj -scheme ResistorScanner \
            -configuration Debug -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/resistor-interaction.xcresult" \
            CODE_SIGNING_ALLOWED=NO test > "$RUNNER_TEMP/resistor-ui-test.log" 2>&1 || {
              tail -100 "$RUNNER_TEMP/resistor-ui-test.log"
              exit 1
            }
          grep 'TEST SUCCEEDED' "$RUNNER_TEMP/resistor-ui-test.log"

      - name: Upload interaction test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resistor-ui-interaction-results
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/resistor-interaction.xcresult
            ${{ runner.temp }}/resistor-ui-test.log

      - name: Upload native screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resistor-native-screenshot-matrix
          retention-days: 3
          if-no-files-found: warn
          path: ${{ runner.temp }}/resistor-native-qa/*.png

      - name: Upload test and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resistor-ios-impeccable-ux
          retention-days: 3
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/resistor-ux-swift-test.log
            ${{ runner.temp }}/resistor-ux-xcodebuild.log
