name: Noise Remover 2026-10-23 Flutter regressions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noise-remover-regression-20261023.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Noise Remover branch or SHA'
        required: false
        type: string
        default: master

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require private repository access
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout Noise Remover without retaining credentials
        uses: actions/checkout@v4
        with:
          repository: Persie0/noise_remover
          ref: ${{ github.event_name == 'push' && 'fix/ci-noise-remover-regression-tests-20261023' || inputs.ref || 'master' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - name: Authenticate private Git dependencies
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: git config --global url."https://x-access-token:${PRIVATE_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate localizations
        working-directory: app
        run: flutter gen-l10n

      - name: Analyze Flutter sources
        working-directory: app
        run: flutter analyze --no-pub --no-fatal-warnings --no-fatal-infos

      - name: Run complete Flutter test suite
        working-directory: app
        run: flutter test --no-pub --reporter expanded
