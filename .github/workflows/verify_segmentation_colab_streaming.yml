name: Verify segmentation Colab streaming

on:
  push:
    paths:
      - '.github/workflows/verify_segmentation_colab_streaming.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout resistor_model feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/resistor_model
          ref: fix/segmentation-colab-forward-trainer-logs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e '.[dev,segmentation,export]'

      - name: Run full suite
        run: pytest -q

      - name: Check source and notebook
        run: |
          python -m py_compile colab/train_resistor_segmentation_colab.py src/resistor_model/train_segmentation.py
          python - <<'PY'
          import json
          from pathlib import Path
          nb=json.loads(Path("colab/train_resistor_segmentation_colab.ipynb").read_text())
          assert nb["nbformat"] == 4
          assert "stdout and stderr" in "".join(nb["cells"][0]["source"])
          print("Notebook parsed; diagnostic log forwarding documented")
          PY

      - name: Verify real subprocess streaming and exit status
        run: |
          python - <<'PY'
          import runpy
          import sys
          import io
          from contextlib import redirect_stdout
          x=runpy.run_path('colab/train_resistor_segmentation_colab.py')
          run=x["run_with_heartbeat"]
          output=io.StringIO()
          with redirect_stdout(output):
              run([sys.executable,'-u','-c','import sys;print("[boot] forwarded",flush=True);print("[startup] forwarded stderr",file=sys.stderr,flush=True)'],heartbeat_seconds=.1)
          assert '[boot] forwarded' in output.getvalue()
          assert '[startup] forwarded stderr' in output.getvalue()
          print("Live child stdout/stderr bridge smoke passed")
          PY
