name: Photosphere checkpoint343 original full graph joined ARM64
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint343-source.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint343-source
  cancel-in-progress: false
jobs:
  original-unmodified-source:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact private research SHA read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 3bf0cd64ca60d699c188165da27aba32f1e17408
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Pin source and install ARM64 decoder/emulator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "3bf0cd64ca60d699c188165da27aba32f1e17408"
          python3 -m pip install --quiet --break-system-packages capstone unicorn
          python3 -m py_compile research/photosphere/checkpoint343/native_original_full_graph_join.py
      - name: Obtain checksum-verified original Google Camera source ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Execute original complete builder -> score -> candidate loop
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint343/native_original_full_graph_join.py original.so --output checkpoint343-original-joined.json | tee checkpoint343-original-joined.log
          grep -q '^CHECKPOINT343_JOINED_ORIGINAL_PASS 20 12$' checkpoint343-original-joined.log
      - name: Archive original outcome JSON and diagnostic text only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-checkpoint343-original
          path: |
            checkpoint343-original-joined.json
            checkpoint343-original-joined.log
          if-no-files-found: warn
          retention-days: 7
