name: Photosphere checkpoint309 original geometry entry branches
on:
  push:
    branches: [research/photosphere-checkpoint309-geometry-dim-guards]
    paths: [.github/workflows/photosphere-checkpoint309-geometry-dim-guards.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install source analysis and original ARM64 execution
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools unicorn
      - name: Original exact SHA pinned APK/ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk'
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Original line-geometry immediate comparison branches and fallback targets
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee checkpoint309-discovery.log
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from hashlib import sha256
          b=Path('original.so').read_bytes()
          assert sha256(b).hexdigest()=='878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1'
          cs=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          for name,lo,hi in [
            ('geometry-entry',0x31399c,0x3139d0),
            ('geometry-mismatch-A',0x314400,0x314458),
            ('geometry-mismatch-B',0x314458,0x3144c8),
            ('geometry-validator-return',0x313a98,0x313af4),
            ('geometry-special-tail',0x314488,0x3144f8),
          ]:
            print('CHECKPOINT309_WINDOW_START',name)
            for i in cs.disasm(b[lo:hi],lo):
              print(f'{i.address:#010x} {i.mnemonic:8} {i.op_str}')
            print('CHECKPOINT309_WINDOW_END',name)
          print('CHECKPOINT309_ORIGINAL_GEOMETRY_ENTRY_DISCOVERY_PASS')
          PY
          grep -q '^CHECKPOINT309_ORIGINAL_GEOMETRY_ENTRY_DISCOVERY_PASS' checkpoint309-discovery.log
      - name: Read-only checkout original checkpoint309 research and native differential
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: d13fae93e9589c64aed060bc9c10f56e6312a622
          path: research
          sparse-checkout: |
            research/photosphere/checkpoint309
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Source-verify and execute original geometry entry diagnostic pair comparisons
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = d13fae93e9589c64aed060bc9c10f56e6312a622
          python3 research/research/photosphere/checkpoint309/verify_original_geometry_entry.py original.so --output checkpoint309-original-geometry-pins.json | tee checkpoint309-original-pins.log
          python3 research/research/photosphere/checkpoint309/native_original_geometry_entry.py original.so --output checkpoint309-original-geometry-entry.json | tee checkpoint309-original-native.log
          grep -q '^CHECKPOINT309_GEOMETRY_ENTRY_SOURCE_PINS_VERIFIED' checkpoint309-original-pins.log
          grep -q '^CHECKPOINT309_ORIGINAL_GEOMETRY_ENTRY_EXECUTION_PASS 14 9' checkpoint309-original-native.log
      - name: Read-only checkout source-pinned PhotosphereCleanroom geometry guard and fixture
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: b4879b4f133616d8463d004746fa0c0ea5425970
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Compare fresh original 14 signed-word branch outcomes against Rust regression
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = b4879b4f133616d8463d004746fa0c0ea5425970
          python3 - <<'PY'
          import json
          from pathlib import Path
          original=json.loads(Path("checkpoint309-original-geometry-entry.json").read_text())
          fixture=json.loads(Path("app/tests/fixtures/native_original_geometry_entry_309.json").read_text())
          if original != fixture:
              for key in sorted(set(original)|set(fixture)):
                  if original.get(key)==fixture.get(key):continue
                  if key=="cases":
                      for index,(a,b) in enumerate(zip(original[key],fixture[key])):
                          for field in sorted(set(a)|set(b)):
                              if a.get(field)!=b.get(field):
                                  print("CHECKPOINT309_CASE_DIFF",index,a.get("name"),field,repr(a.get(field))[:350],repr(b.get(field))[:350])
                  else:
                      print("CHECKPOINT309_FIXTURE_DIFF",key,repr(original.get(key))[:350],repr(fixture.get(key))[:350])
              raise AssertionError("Original source geometry-entry ARM64 fixture differs from Rust")
          assert original["original_native_executed_cases"]==14
          print("CHECKPOINT309_NATIVE_RUST_FIXTURE_EQUAL",original["original_native_executed_cases"])
          PY
          cd app
          git diff --check
          rustfmt --edition 2021 --check src/native_line_geometry_entry.rs
          cargo test --lib checkpoint309_ -- --nocapture
          cargo test --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint309-source-discovery
          path: |
            checkpoint309-discovery.log
            checkpoint309-original-geometry-pins.json
            checkpoint309-original-geometry-entry.json
            checkpoint309-original-pins.log
            checkpoint309-original-native.log
          retention-days: 14
