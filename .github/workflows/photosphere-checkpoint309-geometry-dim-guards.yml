name: Photosphere checkpoint309 original geometry entry branches
on:
  push:
    branches: [research/photosphere-checkpoint309-geometry-dim-guards]
    paths: [.github/workflows/photosphere-checkpoint309-geometry-dim-guards.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install source analysis and original ARM64 execution
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools unicorn
      - name: Original exact SHA pinned APK/ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk'
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Original line-geometry immediate comparison branches and fallback targets
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee checkpoint309-discovery.log
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from hashlib import sha256
          b=Path('original.so').read_bytes()
          assert sha256(b).hexdigest()=='878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1'
          cs=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          for name,lo,hi in [
            ('geometry-entry',0x31399c,0x3139d0),
            ('geometry-mismatch-A',0x314400,0x314458),
            ('geometry-mismatch-B',0x314458,0x3144c8),
            ('geometry-validator-return',0x313a98,0x313af4),
            ('geometry-special-tail',0x314488,0x3144f8),
          ]:
            print('CHECKPOINT309_WINDOW_START',name)
            for i in cs.disasm(b[lo:hi],lo):
              print(f'{i.address:#010x} {i.mnemonic:8} {i.op_str}')
            print('CHECKPOINT309_WINDOW_END',name)
          print('CHECKPOINT309_ORIGINAL_GEOMETRY_ENTRY_DISCOVERY_PASS')
          PY
          grep -q '^CHECKPOINT309_ORIGINAL_GEOMETRY_ENTRY_DISCOVERY_PASS' checkpoint309-discovery.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint309-source-discovery
          path: checkpoint309-discovery.log
          retention-days: 14
