name: Photo Sphere checkpoint 236 original extractor image-helper boundary
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-native-extractor-236.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: research/checkpoint236-extractor-image-access
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install Unicorn and ELF dependencies
        run: python3 -m pip install --break-system-packages --quiet -r research/photosphere/checkpoint218/requirements.txt
      - name: Retrieve and verify original GCam binary
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Execute original processor and feature wrapper handoff
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint236/native_extractor_image_helper_probe.py > checkpoint236.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('checkpoint236.json').read_text())
          assert p['stop_before']=='0x3a2e18'
          assert len(p['cases'])==4
          for c in p['cases']:
              assert c['terminated_at']=='0x3a2e18'
              assert c['original_wrapper_entered'] and c['original_extractor_body_executed']
              assert c['original_feature_wrapper_args']['x0']==c['native_processor_parent']
              assert c['original_extractor_entry_args']['x0']==c['native_processor_extractor']
              assert c['source_unchanged']
              print(c['name'], 'processor', hex(c['native_processor_parent']),
                    'extractor', c['original_extractor_entry_args'])
          print('PASS: 4 original native extractor prologue / image-helper boundary cases')
          print('CHECKPOINT236_JSON_BEGIN')
          print(json.dumps(p,separators=(',',':')))
          print('CHECKPOINT236_JSON_END')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint236-original-extractor-image-access
          path: checkpoint236.json
          retention-days: 7
          if-no-files-found: warn
