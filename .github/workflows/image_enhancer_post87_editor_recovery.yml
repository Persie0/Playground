name: Image Enhancer post87 editor accessibility and recovery
on:
  push:
    branches: [image-enhancer-post87-editor-recovery-validation-20261122]
    paths:
      - .github/workflows/image_enhancer_post87_editor_recovery.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-enhancer-post87-editor-recovery-20261122
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout private app only using public Playground
        uses: actions/checkout@v4
        with:
          repository: Persie0/image_enhancer
          ref: impeccable/post87-editor-settings-recovery-accessibility
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: image_enhancer
      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        working-directory: image_enhancer
        run: flutter pub get --enforce-lockfile
      - name: Generate localized strings
        working-directory: image_enhancer
        run: flutter gen-l10n
      - name: Focused accessibility and restore regression
        working-directory: image_enhancer
        run: |
          flutter test test/impeccable_post87_editor_recovery_test.dart \
            test/impeccable_post86_preset_availability_test.dart \
            test/impeccable_post85_model_selection_truth_test.dart \
            test/impeccable_post83_quality_safety_test.dart \
            test/impeccable_p2_layout_test.dart \
            --timeout 2m --reporter expanded
      - name: Strict Flutter analyzer
        working-directory: image_enhancer
        run: flutter analyze
      - name: Complete Flutter regression suite
        working-directory: image_enhancer
        run: flutter test --concurrency=2 --timeout 2m --reporter compact
