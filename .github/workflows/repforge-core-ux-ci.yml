# Validating RepForge UX branch at 3acf799418aba2d1d3c1f731972392a3b8f9869b (public Playground only)
name: RepForge UI core validation (private checkout)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repforge-core-ux-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repforge-core-ux-ci
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Check out feature branch without persisting credentials
        id: private_checkout
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          SOURCE_REF: fix/core-workout-loop-ux
          EXPECTED_SOURCE_SHA: 3acf799418aba2d1d3c1f731972392a3b8f9869b
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Missing read token for private RepForge'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --quiet --depth 1 --branch "$SOURCE_REF" \
            https://github.com/Persie0/gameexercise.git source
          test -s source/pubspec.yaml
          ACTUAL_SOURCE_SHA="$(git -C source rev-parse HEAD)"
          test "$ACTUAL_SOURCE_SHA" = "$EXPECTED_SOURCE_SHA" || {
            echo 'Private branch moved since this public workflow was prepared'
            exit 1
          }
          git -C source log -1 --format='Source SHA: %h'
      - name: Analyze and test Flutter source
        id: verify
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get > /tmp/repforge_pub_get.log 2>&1 || {
            tail -n 60 /tmp/repforge_pub_get.log; exit 1;
          }
          # Validate Dart syntax without modifying the private checkout.
          dart format --output=none lib test > /tmp/repforge_format.log 2>&1 || {
            tail -n 60 /tmp/repforge_format.log; exit 1;
          }
          flutter analyze > /tmp/repforge_analyze.log 2>&1 || {
            tail -n 100 /tmp/repforge_analyze.log | cut -c 1-280; exit 1;
          }
          # Run affected widget suites first, and show each failure clearly.
          failed_suites=0
          for suite in \
            test/forge_workout_session_screen_test.dart \
            test/forge_workout_feedback_screen_test.dart \
            test/forge_quest_board_test.dart \
            test/exercise_library_screen_test.dart \
            test/app_smoke_test.dart; do
            if ! flutter test "$suite" --reporter expanded > /tmp/repforge_focus.log 2>&1; then
              echo "=== FAILED SUITE: $suite ==="
              grep -E 'TestFailure|EXCEPTION CAUGHT|The test description was:|Expected:|Actual:|\[E\]' /tmp/repforge_focus.log | tail -n 70 | cut -c 1-240 || true
              echo '=== First failure context ==='
              head -n 100 /tmp/repforge_focus.log | cut -c 1-280
              echo '=== Final test context ==='
              tail -n 110 /tmp/repforge_focus.log | cut -c 1-280
              failed_suites=$((failed_suites + 1))
            else
              echo "PASS: $suite"
            fi
          done
          test "$failed_suites" -eq 0 || exit 1
          flutter test --reporter compact > /tmp/repforge_test.log 2>&1 || {
            echo '=== All failed test names and assertions (bounded) ==='
            tr '\r' '\n' < /tmp/repforge_test.log | grep -E '\[E\]|The test description was:|Expected:|Actual:' | tail -n 150 | cut -c 1-240 || true
            echo '=== Final test context ==='
            tail -n 85 /tmp/repforge_test.log | cut -c 1-280
            exit 1
          }
          tail -n 6 /tmp/repforge_analyze.log
          tail -n 8 /tmp/repforge_test.log | cut -c 1-280
      - name: Compile Android debug APK locally (no artifact upload)
        id: android
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          flutter build apk --debug > /tmp/repforge_android.log 2>&1 || {
            tail -n 80 /tmp/repforge_android.log | cut -c 1-280; exit 1;
          }
          test -s build/app/outputs/flutter-apk/app-debug.apk
          echo 'Android compilation passed. Private APK is not published.'
      - name: Publish validation summary to public run
        if: always()
        shell: bash
        env:
          SOURCE_SHA: 7ea1986142efd5dc15942ef64346654e91a6e038
          CHECKOUT_RESULT: ${{ steps.private_checkout.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          ANDROID_RESULT: ${{ steps.android.outcome }}
        run: |
          {
            printf '### RepForge validation (no private artifacts uploaded)\\n\\n'
            printf '%s\\n' "- Source commit: \`$SOURCE_SHA\`"
            printf '%s\\n' "- Private checkout: **$CHECKOUT_RESULT**"
            printf '%s\\n' "- Flutter analyzer and tests: **$VERIFY_RESULT**"
            printf '%s\\n' "- Android debug APK compilation: **$ANDROID_RESULT**"
          } >> "$GITHUB_STEP_SUMMARY"
