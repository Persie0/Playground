name: RepForge UI core validation (private checkout)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repforge-core-ux-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repforge-core-ux-ci
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Check out feature branch without persisting credentials
        id: private_checkout
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          SOURCE_REF: fix/core-workout-loop-ux
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Missing read token for private RepForge'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --quiet --depth 1 --branch "$SOURCE_REF" \
            https://github.com/Persie0/gameexercise.git source
          test -s source/pubspec.yaml
          git -C source log -1 --format='Source SHA: %h'
      - name: Analyze and test Flutter source
        id: verify
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get > /tmp/repforge_pub_get.log 2>&1 || {
            tail -n 60 /tmp/repforge_pub_get.log; exit 1;
          }
          # Validate Dart syntax without modifying the private checkout.
          dart format --output=none lib test > /tmp/repforge_format.log 2>&1 || {
            tail -n 60 /tmp/repforge_format.log; exit 1;
          }
          flutter analyze > /tmp/repforge_analyze.log 2>&1 || {
            tail -n 100 /tmp/repforge_analyze.log | cut -c 1-280; exit 1;
          }
          flutter test --reporter compact > /tmp/repforge_test.log 2>&1 || {
            tail -n 110 /tmp/repforge_test.log | cut -c 1-280; exit 1;
          }
          tail -n 6 /tmp/repforge_analyze.log
          tail -n 8 /tmp/repforge_test.log | cut -c 1-280
      - name: Compile Android debug APK locally (no artifact upload)
        id: android
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          flutter build apk --debug > /tmp/repforge_android.log 2>&1 || {
            tail -n 80 /tmp/repforge_android.log | cut -c 1-280; exit 1;
          }
          test -s build/app/outputs/flutter-apk/app-debug.apk
          echo 'Android compilation passed. Private APK is not published.'
      - name: Report bounded validation summary to private PR
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          CHECKOUT_RESULT: ${{ steps.private_checkout.outcome }}
          VERIFY_RESULT: ${{ steps.verify.outcome }}
          ANDROID_RESULT: ${{ steps.android.outcome }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo 'No GitHub token available for private PR report'
            exit 0
          fi
          SOURCE_SHA='checkout failed'
          if [ -d source/.git ]; then
            SOURCE_SHA="$(git -C source rev-parse HEAD)"
          fi
          {
            printf 'Public Playground RepForge UI validation\n\n'
            printf '%s\n' "- Source commit: $SOURCE_SHA"
            printf '%s\n' "- Private branch checkout: **$CHECKOUT_RESULT**"
            printf '%s\n' "- Flutter format parse + analyzer + tests: **$VERIFY_RESULT**"
            printf '%s\n' "- Android debug compilation: **$ANDROID_RESULT**"
            printf '\n%s\n' 'No private source or APK artifact was uploaded to Playground.'
          } > "$RUNNER_TEMP/repforge-validation-summary.md"
          gh api --method POST repos/Persie0/gameexercise/issues/24/comments \
            --field body="$(cat "$RUNNER_TEMP/repforge-validation-summary.md")" >/dev/null
