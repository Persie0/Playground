name: Image Enhancer post85 Android native screenshot QA
on:
  push:
    branches: [image-enhancer-post85-emulator-screenshots-20261122]
    paths:
      - .github/workflows/image_enhancer_post85_emulator_qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout private QA branch via public Playground
        uses: actions/checkout@v4
        with:
          repository: Persie0/image_enhancer
          ref: qa/impeccable-post85-screenshots-20261122
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: image_enhancer
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve locked Flutter packages
        working-directory: image_enhancer
        run: |
          flutter pub get --enforce-lockfile
          flutter gen-l10n
      - name: Launch Android emulator and capture light and dark/large-type screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 720
          script: |
            cd image_enhancer
            flutter build apk --debug
            adb install -r build/app/outputs/flutter-apk/app-debug.apk
            adb shell am start -n at.persie0.image_enhancer/.MainActivity
            sleep 18
            mkdir -p "$RUNNER_TEMP/impeccable-qa"
            adb exec-out screencap -p > "$RUNNER_TEMP/impeccable-qa/android_light.png"
            adb shell settings put system font_scale 1.7
            adb shell cmd uimode night yes
            adb shell am force-stop at.persie0.image_enhancer
            adb shell am start -n at.persie0.image_enhancer/.MainActivity
            sleep 14
            adb exec-out screencap -p > "$RUNNER_TEMP/impeccable-qa/android_dark_large_text.png"
      - name: Store screenshots only in the private QA branch
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -eu
          test -s "$RUNNER_TEMP/impeccable-qa/android_light.png"
          test -s "$RUNNER_TEMP/impeccable-qa/android_dark_large_text.png"
          mkdir -p image_enhancer/docs/qa/impeccable-post85
          cp "$RUNNER_TEMP/impeccable-qa/"*.png image_enhancer/docs/qa/impeccable-post85/
          cd image_enhancer
          git config user.name 'Public Playground QA'
          git config user.email 'playground-qa@users.noreply.github.com'
          git add docs/qa/impeccable-post85/
          git commit -m 'Capture Android emulator visual QA, light and large-text dark [skip ci]'
          AUTH=$(printf 'x-access-token:%s' "$PRIVATE_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push \
            https://github.com/Persie0/image_enhancer.git \
            HEAD:refs/heads/qa/impeccable-post85-screenshots-20261122
