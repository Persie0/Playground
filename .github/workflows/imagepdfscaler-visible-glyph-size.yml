name: ImagePdfScaler physical glyph sizing validation
# Final review: verify supersampled real-font ink and PDF export
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imagepdfscaler-visible-glyph-size.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Confirm private checkout token
        env:
          APP_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$APP_TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: Persie0/ImagePdfScaler
          ref: fix/true-visible-text-height-20261014
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Flutter static analyzer
        working-directory: app
        run: flutter analyze --no-pub
      - name: Text visual-height and rendering tests
        working-directory: app
        run: flutter test --no-pub --reporter expanded test/text_editor_units_test.dart test/paper_canvas_interaction_test.dart test/visible_text_pdf_test.dart
      - name: Full Flutter suite
        working-directory: app
        run: flutter test --no-pub
      - name: Install Android NDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "ndk;29.0.13599879"
      - name: Android debug build
        working-directory: app
        run: flutter build apk --debug --no-pub
