name: Traffic counting fisheye speed-quality lab

on:
  push:
    paths:
      - ".github/workflows/traffic-counting-fisheye-quality-speed.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/traffic-counting-light-main
  APP_REF: perf/pipeline-25fps

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout traffic-counting candidate
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          lfs: false
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal benchmark dependencies
        run: python -m pip install numpy opencv-python pyyaml
      - name: Benchmark fisheye strategies
        working-directory: app
        run: |
          PYTHONPATH=edge/src python - <<'PY'
          from pathlib import Path
          from types import SimpleNamespace
          import json, math, statistics, time
          import cv2
          import numpy as np
          from img_processing.fisheye_rectifier import FisheyeRectifier

          cv2.setNumThreads(4)
          cfg = SimpleNamespace(
              maps_path='edge/calibration_data/precomputed_maps.npz',
              calibration_path='edge/calibration_data/zerocam_params.npz',
              calibration_width=2592,
              calibration_height=1944,
              require_exact_resolution=False,
              balance=1.0,
          )
          rect = FisheyeRectifier(cfg)
          candidates = [
              Path('tools/camera_calibration/docs/example2.jpg'),
              Path('tools/camera_calibration/docs/example1.jpg'),
          ]
          source_path = next(p for p in candidates if p.is_file())
          src = cv2.imread(str(source_path), cv2.IMREAD_COLOR)
          if src is None:
              raise RuntimeError(f'Could not read {source_path}')
          # Structural runtime comparison at the production source shape.
          src = cv2.resize(src, (1296, 972), interpolation=cv2.INTER_AREA)

          def baseline():
              full = rect.rectify(src)
              return cv2.resize(full, (384, 288), interpolation=cv2.INTER_AREA)

          def direct():
              return rect.rectify_to(src, 384, 288, 'stretch')[0]

          def supersample(w, h):
              mid = rect.rectify_to(src, w, h, 'stretch')[0]
              return cv2.resize(mid, (384, 288), interpolation=cv2.INTER_AREA)

          # Warm map caches and kernels.
          reference = baseline()
          variants = {
              'baseline_full_1296_then_area': baseline,
              'direct_384': direct,
              'supersample_576_then_area': lambda: supersample(576, 432),
              'supersample_768_then_area': lambda: supersample(768, 576),
              'supersample_960_then_area': lambda: supersample(960, 720),
          }
          for fn in variants.values():
              for _ in range(8): fn()

          def bench(fn, n=120):
              vals=[]
              for _ in range(n):
                  t=time.perf_counter(); out=fn(); vals.append((time.perf_counter()-t)*1000)
              vals.sort()
              return {'mean_ms':statistics.fmean(vals),'median_ms':statistics.median(vals),'p95_ms':vals[int(.95*(n-1))]}, out

          def quality(img):
              diff = img.astype(np.float32)-reference.astype(np.float32)
              mse=float(np.mean(diff*diff))
              psnr=float('inf') if mse == 0 else 10*math.log10((255.0*255.0)/mse)
              mae=float(np.mean(np.abs(diff)))
              return {'mse':mse,'mae':mae,'psnr_db':psnr}

          report={'source':str(source_path),'source_shape':list(src.shape),'opencv_threads':cv2.getNumThreads(),'variants':{}}
          for name, fn in variants.items():
              timing, out=bench(fn)
              report['variants'][name]={'timing':timing,'quality_vs_baseline':quality(out)}
          print(json.dumps(report, indent=2))
          Path('../fisheye_speed_quality.json').write_text(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: fisheye-speed-quality
          path: fisheye_speed_quality.json
          retention-days: 7
