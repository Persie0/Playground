name: Uniminder TU login beta race PR26
# Recheck analyzer guards and regressions after review
on:
  push:
    paths:
      - '.github/workflows/uniminder-tu-login-beta-race-pr26.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout Uniminder fix branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/student
          ref: fix/tu-login-combined-form-otp-race-20261022
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: uniminder
      - name: Execute JS combined-SSO regression test
        working-directory: uniminder
        run: node test/js/tu_login_otp_race_test.cjs
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: uniminder
        run: flutter pub get
      - name: Analyze modified login files
        working-directory: uniminder
        run: flutter analyze --no-pub lib/services/tu_login_otp_script.dart lib/screens/university/tiss_login_screen.dart lib/screens/university/tuwel_login_screen.dart lib/screens/university/tu_login_screen.dart test/tu_login_otp_script_test.dart
      - name: Flutter regression tests
        working-directory: uniminder
        run: flutter test --no-pub test/tu_login_otp_script_test.dart test/tiss_certificate_page_test.dart test/calendar_direct_links_test.dart
      - name: Android debug build
        working-directory: uniminder
        run: flutter build apk --debug --no-pub
