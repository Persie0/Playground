name: Root Detector Kotlin verification (public runner)
# Validation rerun after Compose icon fixes.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/root-detector-kotlin-verify.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/root_detection_app
          ref: native-kotlin-migration
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: root-detector

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" ||             "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0"

      - name: Ensure Flutter is archived and not a build dependency
        working-directory: root-detector
        run: |
          set -euo pipefail
          test -e old/pubspec.yaml
          test -e old/lib/detection_screen.dart
          test ! -e pubspec.yaml
          ! grep -R -n 'dev.flutter.flutter-gradle-plugin\|io.flutter.embedding'              --include='*.gradle' --include='*.kts' --include='*.kt' app

      - name: Run native Android tests and compile APK
        working-directory: root-detector
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
