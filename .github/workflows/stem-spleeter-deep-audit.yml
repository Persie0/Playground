name: Stem Spleeter deep audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/stem-spleeter-deep-audit.yml'
      - 'stem-spleeter-audit/**'

permissions:
  contents: read

jobs:
  inspect-vendor-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      has_x86_64: ${{ steps.abi.outputs.has_x86_64 }}
      has_x86: ${{ steps.abi.outputs.has_x86 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Download exact vendor SDK and models
        run: |
          set -euxo pipefail
          mkdir -p /tmp/spleeter/vendor
          curl -fL --retry 3 -o /tmp/spleeter/vendor/ttvspleeter.aar \
            https://raw.githubusercontent.com/FaceOnLive/Spleeter-Android-iOS/main/Android/app/libs/ttvspleeter.aar
          for n in 1 2 3 4; do
            curl -fL --retry 3 -o "/tmp/spleeter/vendor/data${n}.bin" \
              "https://raw.githubusercontent.com/FaceOnLive/Spleeter-Android-iOS/main/Android/app/src/main/assets/data${n}.bin"
          done

      - name: Verify immutable vendor sizes
        run: |
          set -euxo pipefail
          test "$(stat -c%s /tmp/spleeter/vendor/ttvspleeter.aar)" = 1013761
          test "$(stat -c%s /tmp/spleeter/vendor/data1.bin)" = 47185920
          test "$(stat -c%s /tmp/spleeter/vendor/data2.bin)" = 57671680
          test "$(stat -c%s /tmp/spleeter/vendor/data3.bin)" = 47185920
          test "$(stat -c%s /tmp/spleeter/vendor/data4.bin)" = 49559652
          sha256sum /tmp/spleeter/vendor/* | tee /tmp/spleeter/vendor.sha256

      - name: Inspect AAR contents, constants, bytecode and native strings
        run: |
          set -euxo pipefail
          mkdir -p /tmp/spleeter/aar
          unzip -q /tmp/spleeter/vendor/ttvspleeter.aar -d /tmp/spleeter/aar
          find /tmp/spleeter/aar -maxdepth 4 -type f -printf '%P %s bytes\n' | sort | tee /tmp/spleeter/aar-files.txt
          javap -classpath /tmp/spleeter/aar/classes.jar -public com.ttv.spleeter.SpleeterSDK | tee /tmp/spleeter/spleeter-api.txt
          javap -classpath /tmp/spleeter/aar/classes.jar -c -p -constants com.ttv.spleeter.SpleeterSDK | tee /tmp/spleeter/spleeter-bytecode.txt
          find /tmp/spleeter/aar -type f -name '*.so' -print | sort | tee /tmp/spleeter/native-libs.txt
          : > /tmp/spleeter/elf.txt
          : > /tmp/spleeter/native-strings.txt
          while IFS= read -r so; do
            echo "--- $so" | tee -a /tmp/spleeter/elf.txt /tmp/spleeter/native-strings.txt
            readelf -h "$so" | grep -E 'Class:|Machine:' | tee -a /tmp/spleeter/elf.txt || true
            readelf -d "$so" | grep NEEDED | tee -a /tmp/spleeter/elf.txt || true
            strings -a "$so" | grep -Eai 'data[1-4]\.bin|asset|wav|wave|sample|44100|sdk_|init|proc|error|license|activ|stem|model' \
              | sort -u | head -n 500 | tee -a /tmp/spleeter/native-strings.txt || true
          done < /tmp/spleeter/native-libs.txt

      - name: Detect emulator-compatible ABI
        id: abi
        run: |
          if find /tmp/spleeter/aar -type f -path '*/x86_64/*.so' | grep -q .; then
            echo 'has_x86_64=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_x86_64=false' >> "$GITHUB_OUTPUT"
          fi
          if find /tmp/spleeter/aar -type f -path '*/x86/*.so' | grep -q .; then
            echo 'has_x86=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_x86=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Generate and validate Spleeter PCM fixtures
        run: |
          python3 - <<'PY'
          import math, struct, wave, pathlib
          root = pathlib.Path('/tmp/spleeter')
          for seconds in (1, 5, 12):
              path = root / f'sine-{seconds}s-44100-stereo-s16.wav'
              with wave.open(str(path), 'wb') as w:
                  w.setnchannels(2)
                  w.setsampwidth(2)
                  w.setframerate(44100)
                  frames = bytearray()
                  for i in range(44100 * seconds):
                      v = int(0.2 * 32767 * math.sin(2 * math.pi * 440 * i / 44100))
                      frames += struct.pack('<hh', v, v)
                  w.writeframes(frames)
              with wave.open(str(path), 'rb') as r:
                  assert r.getnchannels() == 2
                  assert r.getsampwidth() == 2
                  assert r.getframerate() == 44100
                  assert r.getnframes() == 44100 * seconds
              print(path, path.stat().st_size)
          PY

      - name: Upload binary audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: stem-spleeter-binary-audit
          path: |
            /tmp/spleeter/aar-files.txt
            /tmp/spleeter/spleeter-api.txt
            /tmp/spleeter/spleeter-bytecode.txt
            /tmp/spleeter/native-libs.txt
            /tmp/spleeter/elf.txt
            /tmp/spleeter/native-strings.txt
            /tmp/spleeter/vendor.sha256
          retention-days: 14

  emulator-capability:
    needs: inspect-vendor-sdk
    runs-on: ubuntu-latest
    steps:
      - name: Report Linux runtime-test capability
        run: |
          echo "x86_64=${{ needs.inspect-vendor-sdk.outputs.has_x86_64 }}"
          echo "x86=${{ needs.inspect-vendor-sdk.outputs.has_x86 }}"
          if [[ '${{ needs.inspect-vendor-sdk.outputs.has_x86_64 }}' != 'true' && '${{ needs.inspect-vendor-sdk.outputs.has_x86 }}' != 'true' ]]; then
            echo 'Vendor AAR has no x86/x86_64 native library; Linux KVM emulator cannot execute this binary directly.'
          fi

  arm64-runtime-smoke:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare exact vendor runtime payload
        run: |
          set -euxo pipefail
          mkdir -p stem-spleeter-audit/app/libs stem-spleeter-audit/app/src/main/assets .tools
          curl -fL --retry 3 -o stem-spleeter-audit/app/libs/ttvspleeter.aar \
            https://raw.githubusercontent.com/FaceOnLive/Spleeter-Android-iOS/main/Android/app/libs/ttvspleeter.aar
          for n in 1 2 3 4; do
            curl -fL --retry 3 -o "stem-spleeter-audit/app/src/main/assets/data${n}.bin" \
              "https://raw.githubusercontent.com/FaceOnLive/Spleeter-Android-iOS/main/Android/app/src/main/assets/data${n}.bin"
          done
          curl -fL --retry 3 -o stem-spleeter-audit/app/src/main/assets/vendor_input.wav \
            https://raw.githubusercontent.com/FaceOnLive/Spleeter-Android-iOS/main/iOS/SpleeterDemo/assets/_input.wav
          curl -fL --retry 3 -o .tools/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q .tools/gradle.zip -d .tools
          test "$(stat -f%z stem-spleeter-audit/app/libs/ttvspleeter.aar)" = 1013761
          test "$(stat -f%z stem-spleeter-audit/app/src/main/assets/vendor_input.wav)" = 1919532

      - name: Execute untouched Spleeter AAR on ARM64 Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: arm64-v8a
          profile: pixel_4
          cores: 4
          ram-size: 4096M
          heap-size: 1024M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set +e
            cd stem-spleeter-audit
            ../.tools/gradle-8.9/bin/gradle :app:connectedDebugAndroidTest --stacktrace --info
            rc=$?
            cd ..
            adb logcat -d -v threadtime | grep -E 'SpleeterAudit|ttvspleeter|spleeter' > spleeter-runtime-log.txt || true
            cat spleeter-runtime-log.txt || true
            exit $rc

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stem-spleeter-arm64-runtime
          path: |
            spleeter-runtime-log.txt
            stem-spleeter-audit/app/build/reports/androidTests/connected/
            stem-spleeter-audit/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
