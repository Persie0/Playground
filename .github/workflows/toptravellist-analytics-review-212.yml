name: TopTravelList analytics review
on:
  push:
    branches: ['ci/toptravellist-analytics-review-212']
    paths: ['.github/workflows/toptravellist-analytics-review-212.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: feature/country-bubbles-atlas-analytics
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrate main and test
        run: |
          set -euo pipefail
          git config user.name toptravellist-review-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git diff --check origin/main...HEAD
          cd web
          if [ -f package-lock.json ]; then npm ci; else npm install --no-package-lock; fi
          npm test
          npm run build
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          npm exec vite -- preview --host 127.0.0.1 --port 4173 > /tmp/atlas-preview.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const atlas=JSON.parse(fs.readFileSync('public/atlas.json','utf8'));
          const expected=atlas.rows.filter(r=>r.country==='AT'&&r.kind==='sights'&&r.overall!==null&&r.overall>=85.25);
          assert.ok(expected.length>0);
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({viewport:{width:1280,height:900}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            await page.goto('http://127.0.0.1:4173/?basemap=outline&display=country&kind=sights&country=AT&min=85.25&unranked=0');
            await page.locator('.country-bubble').first().waitFor();
            assert.equal(await page.locator('.country-bubble').count(),1);
            assert.equal(Number(await page.locator('.country-bubble').innerText()),expected.length);
            assert.match(await page.locator('#analyticsBody .analyticstat').first().innerText(),new RegExp('\\b'+expected.length+'\\b'));
            await page.locator('#query').fill('palace');
            await page.waitForTimeout(300);
            await page.locator('.country-bubble').first().waitFor();
            await page.locator('.country-bubble').first().click();
            assert.equal(await page.locator('#display').inputValue(),'rank');
            assert.equal(await page.locator('#query').inputValue(),'palace');
            assert.equal(await page.locator('#min').inputValue(),'85.25');
            await page.locator('#listView').click();
            await page.locator('#rows [data-id]').first().click();
            assert.match(await page.locator('#detail').innerText(),/Country comparison/);
            await page.locator('#closeDetail').click();
            await page.locator('#countries').click();
            await page.locator('#query').fill('Austria');
            await page.waitForTimeout(300);
            await page.locator('#rows [data-country="AT"]').click();
            assert.equal(await page.locator('#kind').inputValue(),'');
            assert.equal(await page.locator('#metric').inputValue(),'overall');
            assert.equal(await page.locator('#min').inputValue(),'0');
            await page.locator('#advanced summary').click();
            if(!await page.locator('#min').isVisible()) await page.locator('#advanced summary').click();
            await page.locator('#min').fill('85,25');
            assert.match(await page.locator('#count').innerText(),/matches/);
            assert.equal(await page.locator('#min').getAttribute('aria-invalid'),'false');
            assert.equal(new URL(page.url()).searchParams.get('min'),'85.25');
            await page.locator('#analyticsSort').selectOption('mean');
            assert.match(await page.locator('#analyticsBody').innerText(),/Top 10 countries by mean score/);
            await page.locator('#query').fill('zzzznonexistentdestination');
            await page.waitForTimeout(300);
            assert.match(await page.locator('#analyticsBody').innerText(),/No matching data/);
            await page.setViewportSize({width:360,height:800});
            await page.locator('#reset').click();
            await page.waitForTimeout(300);
            assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),'mobile horizontal overflow');
            assert.deepEqual(errors,[]);
            console.log('PASS: browser smoke: country bubbles, search drill-down, details, directory, decimal filter, analytics, empty state, mobile overflow');
          } finally {await browser.close()}
          JS
          cd ..
          git push origin HEAD:refs/heads/feature/country-bubbles-atlas-analytics
