name: Traffic counting analysis PR CI

on:
  push:
    paths:
      - ".github/workflows/traffic-counting-analysis-pr-ci.yml"
      - "debug_triggers/traffic-counting-analysis-pr-ci.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/traffic-counting-light-main
  APP_REF: perzi/review-pr2-pr5-geometry-fixes

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout traffic-counting candidate
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis test dependencies
        run: |
          python -m pip install             "pytest>=9,<10"             "ruff>=0.16.7,<0.17"             "numpy>=2.2,<2.6"             "opencv-python-headless>=4.12,<5"             "pyyaml>=6,<7"             "loguru>=0.7,<1"

      - name: Correctness lint
        working-directory: app/traffic-counting-edge-detection-master
        run: |
          ruff check --select E9,F63,F7,F82             src/analysis             src/detection/direction_detection.py             src/speed_measurement/homography_matrix.py             tests/test_analysis_*.py             tests/test_direction_detection.py

      - name: Run all analysis tests plus direction geometry
        working-directory: app/traffic-counting-edge-detection-master
        run: |
          PYTHONPATH=src pytest -q             tests/test_analysis_*.py             tests/test_direction_detection.py
