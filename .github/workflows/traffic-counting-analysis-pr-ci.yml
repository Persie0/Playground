name: Traffic counting analysis PR CI

on:
  push:
    paths:
      - ".github/workflows/traffic-counting-analysis-pr-ci.yml"
      - "debug_triggers/traffic-counting-analysis-pr-ci.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/traffic-counting-light-main
  APP_REF: perzi/stef-pr6-dashboard-analysis

jobs:
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout traffic-counting candidate
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/traffic-counting-edge-dashboard-main/frontend/package-lock.json

      - name: Install backend test dependencies
        run: python -m pip install "pytest>=9,<10" "fastapi==0.136.3" "httpx>=0.28,<1"

      - name: Backend analysis API tests
        working-directory: app/traffic-counting-edge-dashboard-main/server
        run: pytest -q tests/test_analysis.py

      - name: Install frontend dependencies
        working-directory: app/traffic-counting-edge-dashboard-main/frontend
        run: npm ci

      - name: Frontend analysis unit tests
        working-directory: app/traffic-counting-edge-dashboard-main/frontend
        run: npx ng test --watch=false --include src/app/route/analysis/analysis.spec.ts

      - name: Production frontend build
        working-directory: app/traffic-counting-edge-dashboard-main/frontend
        run: npm run build
