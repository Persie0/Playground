name: Traffic counting dashboard PR CI

on:
  push:
    paths:
      - ".github/workflows/traffic-counting-analysis-pr-ci.yml"
      - "debug_triggers/traffic-counting-analysis-pr-ci.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/traffic-counting-light-main
  APP_REF: perzi/stef-pr6-analysis-dashboard

jobs:
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout traffic-counting candidate
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install server test dependencies
        run: python -m pip install "pytest>=9,<10" "fastapi>=0.136,<0.137" "httpx>=0.28,<1"

      - name: Test analysis API
        working-directory: app/traffic-counting-edge-dashboard-main/server
        run: PYTHONPATH=. pytest -q tests/test_analysis.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/traffic-counting-edge-dashboard-main/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/traffic-counting-edge-dashboard-main/frontend
        run: npm ci

      - name: Test frontend
        working-directory: app/traffic-counting-edge-dashboard-main/frontend
        run: npm test

      - name: Build frontend
        working-directory: app/traffic-counting-edge-dashboard-main/frontend
        run: npm run build
