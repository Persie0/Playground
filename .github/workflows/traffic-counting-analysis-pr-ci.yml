name: Traffic counting analysis PR CI

on:
  push:
    paths:
      - ".github/workflows/traffic-counting-analysis-pr-ci.yml"
      - "debug_triggers/traffic-counting-analysis-pr-ci.txt"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/traffic-counting-light-main
  DETECTOR_REF: perzi/stef-pr6-dashboard-analysis
  DASHBOARD_REF: perzi/stef-pr6-dashboard-analysis

jobs:
  detector:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout reviewed detector branch
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.DETECTOR_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis test dependencies
        run: |
          python -m pip install \
            "pytest>=9,<10" \
            "ruff>=0.16.7,<0.17" \
            "numpy>=2.2,<2.6" \
            "opencv-python-headless>=4.12,<5" \
            "pyyaml>=6,<7" \
            "loguru>=0.7,<1"

      - name: Compile detector sources
        working-directory: app/traffic-counting-edge-detection-master
        run: python -m compileall -q src

      - name: Correctness lint
        working-directory: app/traffic-counting-edge-detection-master
        run: ruff check --select E9,F63,F7,F82 src tests

      - name: Run all new analysis and direction tests
        working-directory: app/traffic-counting-edge-detection-master
        run: |
          PYTHONPATH=src pytest -q \
            tests/test_analysis_*.py \
            tests/test_direction_detection.py

  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout PR6 dashboard branch
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.DASHBOARD_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/traffic-counting-edge-dashboard-main/frontend/package-lock.json

      - name: Install dashboard backend dependencies
        working-directory: app/traffic-counting-edge-dashboard-main/server
        run: python -m pip install -r requirements.txt pytest httpx

      - name: Run complete dashboard backend tests
        working-directory: app/traffic-counting-edge-dashboard-main/server
        run: PYTHONPATH=. pytest -q tests

      - name: Install frontend dependencies
        working-directory: app/traffic-counting-edge-dashboard-main/frontend
        run: npm ci

      - name: Run complete frontend unit tests
        working-directory: app/traffic-counting-edge-dashboard-main/frontend
        run: npx ng test --watch=false

      - name: Production frontend build
        working-directory: app/traffic-counting-edge-dashboard-main/frontend
        run: npm run build
