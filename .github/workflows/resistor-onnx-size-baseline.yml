name: Measure Resistor Scanner ONNX APK
on:
  push:
    paths:
      - .github/workflows/resistor-onnx-size-baseline.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  onnx-debug-size:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout legacy ONNX main branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/resistor-scanner-android
          ref: main
          path: scanner
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Match Play services debug build hosted SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          if ! "$SDKMANAGER" --channel=3 "platforms;android-37" "build-tools;36.0.0" >/dev/null; then
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null
            sed -i 's/compileSdk = 37/compileSdk = 36/; s/targetSdk = 37/targetSdk = 36/' scanner/app/build.gradle.kts
            echo "SKIP_SDK37_AAR_CHECKS=true" >> "$GITHUB_ENV"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Build original ONNX main debug APK and measure bytes
        working-directory: scanner
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          args=()
          if [ "${SKIP_SDK37_AAR_CHECKS:-false}" = "true" ]; then
            args+=(-x :app:checkDebugAarMetadata)
          fi
          ./gradlew --no-daemon :app:assembleDebug "${args[@]}"
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          bytes=$(stat -c %s "$apk")
          echo "ONNX_DEBUG_APK_BYTES=$bytes"
          echo "ONNX_DEBUG_APK_MIB=$(awk -v b="$bytes" 'BEGIN {printf "%.2f", b/1048576}')"
          echo "ONNX_DEBUG_APK_MB=$(awk -v b="$bytes" 'BEGIN {printf "%.2f", b/1000000}')"
          echo "ONNX_BASE_SHA=$(git rev-parse HEAD)"
          sha256sum "$apk"
          {
            echo "### ONNX baseline main debug APK"
            echo "Bytes: $bytes"
            echo "MB: $(awk -v b="$bytes" 'BEGIN {printf "%.2f", b/1000000}')"
            echo "MiB: $(awk -v b="$bytes" 'BEGIN {printf "%.2f", b/1048576}')"
            echo "SHA: $(git rev-parse HEAD)"
          } >> "$GITHUB_STEP_SUMMARY"
