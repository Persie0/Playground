name: Live Noise R8 Sentry test

on:
  push:
    paths:
      - .github/workflows/live-noise-r8-sentry-test.yml

permissions:
  contents: read

jobs:
  r8:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/live_noise_cancelling
          ref: fix/r8-sentry-proguard-20261001
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21.x'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configure throwaway signing
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore android/key.jks -storepass testpass -keypass testpass -alias key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=R8 Test, OU=CI, O=Persie0, L=Vienna, ST=Vienna, C=AT"
          cat > android/key.properties <<'EOF'
          storePassword=testpass
          keyPassword=testpass
          keyAlias=key
          storeFile=./key.jks
          EOF

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK
        shell: bash
        run: |
          set -euo pipefail
          echo y | sdkmanager "ndk;29.0.14206865" --sdk_root="$ANDROID_SDK_ROOT"

      - name: Configure R8 analyzer
        shell: bash
        run: |
          set -euo pipefail
          touch android/gradle.properties
          sed -i '/org.gradle.jvmargs=/d;/kotlin.daemon/d;/kotlin.compiler/d;/android.r8/d;/org.gradle.workers/d;/org.gradle.daemon=/d;/org.gradle.vfs.watch=/d;/android.experimental.r8.enableR8ConfigurationAnalyzer=/d' android/gradle.properties
          {
            echo 'org.gradle.jvmargs=-Xms4g -Xmx12g -XX:+UseParallelGC -XX:ParallelGCThreads=2'
            echo 'org.gradle.daemon=false'
            echo 'org.gradle.vfs.watch=false'
            echo 'org.gradle.workers.max=1'
            echo 'kotlin.compiler.execution.strategy=in-process'
            echo 'android.r8.jvmargs=-Xmx6g -XX:+UseParallelGC'
            echo 'android.experimental.r8.enableR8ConfigurationAnalyzer=true'
          } >> android/gradle.properties

      - name: Resolve dependencies
        run: |
          flutter pub get
          flutter pub deps | grep -E 'sentry(_flutter|_dart_plugin)? ' || true

      - name: Build release bundle
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xms4g -Xmx12g -XX:+UseParallelGC' -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=1 -Dandroid.r8.jvmargs='-Xmx6g'"
        run: |
          flutter build appbundle \
            --obfuscate \
            --split-debug-info=./build \
            --build-name=20261001-r8test \
            --build-number=26

      - name: Verify all R8 scores are at least 25 percent
        shell: bash
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          aab = Path('build/app/outputs/bundle/release/app-release.aab')
          with zipfile.ZipFile(aab) as z:
              data = json.loads(z.read('BUNDLE-METADATA/com.android.tools/r8.json'))
          stats = data['stats']
          scores = {
              'Optimization': 100.0 - float(stats['noOptimizationPercentage']),
              'Obfuscation': 100.0 - float(stats['noObfuscationPercentage']),
              'Shrinking': 100.0 - float(stats['noShrinkingPercentage']),
          }
          for name, value in scores.items():
              print(f'{name}: {value:.2f}%')
          low = {k:v for k,v in scores.items() if v < 25.0}
          if low:
              raise SystemExit('R8 score gate failed: ' + ', '.join(f'{k}={v:.2f}%' for k,v in low.items()))
          PY

      - name: Upload R8 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-noise-r8-sentry-test
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/mapping/release
          if-no-files-found: warn
          retention-days: 2
