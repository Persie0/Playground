name: TopTravelList 70 individually reviewed worldwide sights
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/toptravellist-70-reviewed-sights-global-20261122.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toptravellist-70-reviewed-sights-20261122
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout worldwide destination review branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: audit/china-remaining-sights-global-peers-2026
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: true
          path: repo
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        working-directory: repo
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile scripts/review_sights_individually_2026.py
      - name: Apply 70 explicit site-specific score decisions and regenerate audit
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python scripts/review_sights_individually_2026.py --apply
      - name: Schema, worldwide benchmarks and approved 10 anchors
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate.py
          python scripts/check_city_benchmarks.py
          python scripts/check_sight_benchmarks.py
      - name: Regenerate worldwide country ranking tables and check idempotency
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_rankings.py
          python scripts/generate_rankings.py --check
          python scripts/review_sights_individually_2026.py --check
      - name: Independently assert site and source counts, no cities modified
        working-directory: repo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path.cwd()
          stats=json.loads((root/'methodology/sight-review-2026-stats.json').read_text())
          assert stats['records']==1913
          assert stats['targeted']==415, stats
          assert stats['screened_only']==1498
          assert stats['source_referenced']==266
          assert stats['changed']>=360
          by=stats['by_country']
          assert by['CN']['reviewed']==83
          assert by['AT']['reviewed']==47
          assert by['TH']['reviewed']==44
          assert by['KR']['reviewed']==44
          assert by['TW']['reviewed']==40
          assert by['VN']['reviewed']==74
          assert by['KH']['reviewed']==83
          assert sum(1 for _ in (root/'countries').glob('*/cities/*.yaml'))==703
          assert sum(1 for _ in (root/'countries').glob('*/sights/*.yaml'))==1913
          print('PASS: 70 further individually researched sights, 415 named editorial decisions, 1498 pending.')
          PY
      - name: Commit canonical sight YAMLs and generated rank tables only
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'toptravellist-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add countries/*/sights/*.yaml countries/*/sights.md
          git add methodology/sight-review-2026-stats.json
          git add methodology/sight-review-2026-summary.md
          git add methodology/sight-review-2026-full-audit.md
          git diff --cached --check
          git diff --cached --name-only > /tmp/revised.yml
          test "$(grep -Ec '^countries/(CN|AT|KR|TH|TW|VN|KH)/sights/[a-z0-9-]+[.]yaml$' /tmp/revised.yml)" -ge 55
          if grep -E '^countries/[^/]+/cities/' /tmp/revised.yml; then exit 1; fi
          git commit -m 'Revise 70 individually researched international sight profiles'
          git push origin HEAD:refs/heads/audit/china-remaining-sights-global-peers-2026
