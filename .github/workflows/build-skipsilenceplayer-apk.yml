name: Build SkipSilencePlayer APK
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "SkipSilencePlayer branch, tag or commit to build"
        required: true
        default: "feature/impeccable-full-ia-adaptive-20261120"
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-skipsilenceplayer-apk.yml"

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Android tests and APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SkipSilencePlayer
        uses: actions/checkout@v5
        with:
          repository: Persie0/SkipSilencePlayer
          ref: ${{ github.event.inputs.source_ref || 'feature/impeccable-full-ia-adaptive-20261120' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: SkipSilencePlayer

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Test and assemble debug APK
        working-directory: SkipSilencePlayer/kotlin-android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SkipSilencePlayer-debug-APK
          path: SkipSilencePlayer/kotlin-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
