name: PhotoSphere checkpoint257 original registration gate (one shot)
on:
  push:
    branches: [ci/photosphere-checkpoint257-registration-gate]
    paths: ['.github/workflows/photosphere-checkpoint257-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint257-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-registration-gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'ci: run photosphere checkpoint257 once'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 8e045e87a48acb9c04671b2556db5b49c3cd8b6b
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify source and install native ARM64 emulator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8e045e87a48acb9c04671b2556db5b49c3cd8b6b"
          python3 -m py_compile research/photosphere/checkpoint257/native_post_extractor_registration_gate.py research/photosphere/checkpoint257/validate_post_extractor_gate.py
          python3 -m pip install --break-system-packages --quiet -r research/photosphere/checkpoint218/requirements.txt
      - name: Retrieve pinned original GCam APK and ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Execute ORIGINAL native post-extractor registration decision
        run: |
          set -euo pipefail
          if ! python3 research/photosphere/checkpoint257/native_post_extractor_registration_gate.py > checkpoint257-original.log 2> checkpoint257-original.stderr; then
            tail -n 100 checkpoint257-original.stderr || true
            exit 1
          fi
          python3 research/photosphere/checkpoint257/validate_post_extractor_gate.py checkpoint257-original.log | tee checkpoint257-validation.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=Path('checkpoint257-original.log').read_text()
          d=json.loads(s.split('CHECKPOINT257_NATIVE_ADDIMAGE_FEATURE_BEGIN\n')[1].split('\nCHECKPOINT257_NATIVE_ADDIMAGE_FEATURE_END')[0])
          Path('checkpoint257-original.json').write_text(json.dumps(d,indent=2)+'\n')
          for c in d['cases']:
            v=c['native_second_actual_addimage']
            print('CHECKPOINT257_REGISTRATION_BOUNDARY',c['name'],
                  v.get('post_extractor_registration_boundary'),
                  'gate_returns',v.get('native_gate_returns'))
          PY
      - name: Archive original native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint257-original-registration-gate
          path: |
            checkpoint257-original.log
            checkpoint257-original.stderr
            checkpoint257-original.json
            checkpoint257-validation.txt
          if-no-files-found: warn
          retention-days: 14
