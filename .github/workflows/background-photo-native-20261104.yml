name: Background Remover photo native validation
on:
  push:
    branches:
      - validation/background-photo-20261104
  workflow_dispatch:

# Revalidate BackgroundVideoRemover feature branch after merging latest main (73227d1).
permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out private feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/BackgroundVideoRemover
          ref: feature/photo-background-removal
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
      - name: Install Android API 36 CI-compatible SDK
        run: |
          SDK_MANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          test -n "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Use SDK 36 and compatible Compose BOM in this temporary workspace only
        run: |
          sed -i 's/compileSdk = 37/compileSdk = 36/;s/targetSdk = 37/targetSdk = 36/;s/2026.09.00/2026.05.00/' android/app/build.gradle.kts
      - name: Android unit tests and debug assembly
        working-directory: android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon

  ios:
    runs-on: macos-latest
    steps:
      - name: Check out private feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/BackgroundVideoRemover
          ref: feature/photo-background-removal
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
      - name: Build iOS app and compile XCTest targets
        run: |
          xcodebuild -project ios/BackgroundVideoRemover.xcodeproj \
            -scheme BackgroundVideoRemover \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Execute XCTest when simulator available
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available | sed -nE '/iPhone /s/.*\\(([0-9A-Fa-f-]{36})\\).*/\\1/p' | head -1 || true)
          if [ -z "$DEVICE" ]; then
            echo 'iPhone simulator unavailable; XCTest compilation only.'
            exit 0
          fi
          xcodebuild -project ios/BackgroundVideoRemover.xcodeproj \
            -scheme BackgroundVideoRemover \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO test
