name: AlarmChallenges Pose Lab bulk export validation
on:
  push:
    paths:
      - '.github/workflows/alarmchallenges-pose-export.yml'
      - 'alarmchallenges-pose-export-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private feature branch
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -eu
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth=1 --branch feature/pose-lab-bulk-export \
            https://github.com/Persie0/alarmchallenges.git source
          git -C source rev-parse HEAD
      - name: Get deps and validate Dart tests
        working-directory: source
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          python3 test/native_alarm_configuration_test.py
      - name: Build Android debug APK
        working-directory: source
        run: |
          flutter build apk --debug
          git rev-parse HEAD > build/app/outputs/flutter-apk/SOURCE_COMMIT.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/SHA256SUMS.txt
      - name: Upload APK and resolved lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alarmchallenges-bulk-pose-export-debug-apk
          path: |
            source/build/app/outputs/flutter-apk/app-debug.apk
            source/build/app/outputs/flutter-apk/*.txt
            source/pubspec.lock
          retention-days: 7
          if-no-files-found: warn

  ios:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private feature branch
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -eu
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth=1 --branch feature/pose-lab-bulk-export \
            https://github.com/Persie0/alarmchallenges.git source
          git -C source rev-parse HEAD
      - name: Flutter tests and iOS simulator build
        working-directory: source
        run: |
          flutter pub get
          flutter test
          flutter build ios --simulator --no-codesign
