name: Photosphere checkpoint318 native secondary cleanup
on:
  push:
    branches: [research/photosphere-checkpoint318-cleanup]
    paths: [.github/workflows/photosphere-checkpoint318-cleanup.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python original machine code dependencies
        run: python3 -m pip install --break-system-packages --quiet unicorn capstone pyelftools
      - name: Retrieve original checksum-verified GCam ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk'
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Pin original cleanup scripts from private research read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 765f37e1fb3aeb782342d186dcb852f4dc61843a
          path: research
          sparse-checkout: |
            research/photosphere/checkpoint318
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Execute original machine-code cleanup and print oracle
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 765f37e1fb3aeb782342d186dcb852f4dc61843a
          python3 research/research/photosphere/checkpoint318/native_original_secondary_cleanup.py original.so --output checkpoint318-original-cleanup.json | tee checkpoint318-original-cleanup.log
          grep -q '^CHECKPOINT318_NATIVE_SECONDARY_CLEANUP_PASS' checkpoint318-original-cleanup.log
          echo CHECKPOINT318_CLEANUP_JSON_BEGIN
          cat checkpoint318-original-cleanup.json
          echo CHECKPOINT318_CLEANUP_JSON_END
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint318-source-original-cleanup
          path: |
            checkpoint318-original-cleanup.json
            checkpoint318-original-cleanup.log
          retention-days: 14
