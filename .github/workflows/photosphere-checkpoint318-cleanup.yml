name: Photosphere checkpoint318 native secondary cleanup
on:
  push:
    branches: [research/photosphere-checkpoint318-cleanup]
    paths: [.github/workflows/photosphere-checkpoint318-cleanup.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python original machine code dependencies
        run: python3 -m pip install --break-system-packages --quiet unicorn capstone pyelftools
      - name: Retrieve original checksum-verified GCam ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk'
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Pin original cleanup scripts from private research read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: c0c070cfd0cb3d3fd61994146ac215ef11fa41a1
          path: research
          sparse-checkout: |
            research/photosphere/checkpoint318
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Execute original machine-code cleanup and print oracle
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = c0c070cfd0cb3d3fd61994146ac215ef11fa41a1
          python3 research/research/photosphere/checkpoint318/native_original_secondary_cleanup.py original.so --output checkpoint318-original-cleanup.json | tee checkpoint318-original-cleanup.log
          grep -q '^CHECKPOINT318_NATIVE_SECONDARY_CLEANUP_PASS' checkpoint318-original-cleanup.log
          python3 research/research/photosphere/checkpoint318/native_original_secondary_diagnostic.py original.so --output checkpoint318-original-diagnostic.json | tee checkpoint318-original-diagnostic.log
          grep -q '^CHECKPOINT318_ORIGINAL_DIAGNOSTIC_PROVENANCE_PASS' checkpoint318-original-diagnostic.log
          echo CHECKPOINT318_DIAGNOSTIC_JSON_BEGIN
          cat checkpoint318-original-diagnostic.json
          echo CHECKPOINT318_DIAGNOSTIC_JSON_END
          echo CHECKPOINT318_CLEANUP_JSON_BEGIN
          cat checkpoint318-original-cleanup.json
          echo CHECKPOINT318_CLEANUP_JSON_END
      - name: Read-only checkout pinned checkpoint318 Rust app
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 1673d5f4c8a093e0fb3719d7cbec25cacbccd706
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Compare regenerated original native oracles with Rust fixtures
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = 1673d5f4c8a093e0fb3719d7cbec25cacbccd706
          python3 - <<'PY'
          import json
          from pathlib import Path
          original=json.loads(Path("checkpoint318-original-cleanup.json").read_text())
          for case in original["cases"]:
              pcs=case.pop("original_trace_pcs")
              case["original_trace_start_pc"]=pcs[0]
              case["original_trace_end_pc"]=pcs[-1]
              case["original_trace_instruction_count"]=len(pcs)
          frozen=json.loads(Path("app/tests/fixtures/native_original_second_line_cleanup_318.json").read_text())
          assert original==frozen, "native ARM64 cleanup trace differs from Rust fixture"
          print("CHECKPOINT318_ORIGINAL_CLEANUP_FIXTURE_EQUAL",original["original_fixture_count"],original["original_release_calls"])
          diagnostic=json.loads(Path("checkpoint318-original-diagnostic.json").read_text())
          frozen=json.loads(Path("app/tests/fixtures/native_original_second_line_diagnostic_318.json").read_text())
          assert diagnostic==frozen, "source ARM64 diagnostic provenance differs from Rust fixture"
          print("CHECKPOINT318_ORIGINAL_DIAGNOSTIC_FIXTURE_EQUAL",len(diagnostic["original_source_executed_prefixes"]))
          PY
      - name: Run Rust checkpoint318 focused and full regressions
        run: |
          set -euo pipefail
          cd app
          rustfmt --edition 2021 --check src/native_line_secondary_cleanup.rs src/native_line_secondary_cleanup_checkpoint318_test.rs
          cargo test --lib checkpoint318 -- --nocapture
          cargo test --lib
      - name: Print formatted Rust source for exact readback
        run: |
          echo CHECKPOINT318_RUST_MODEL_BEGIN
          cat app/src/native_line_secondary_cleanup.rs
          echo CHECKPOINT318_RUST_MODEL_END
          echo CHECKPOINT318_RUST_TEST_BEGIN
          cat app/src/native_line_secondary_cleanup_checkpoint318_test.rs
          echo CHECKPOINT318_RUST_TEST_END
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint318-source-original-cleanup
          path: |
            checkpoint318-original-cleanup.json
            checkpoint318-original-cleanup.log
            checkpoint318-original-diagnostic.json
            checkpoint318-original-diagnostic.log
          retention-days: 14
