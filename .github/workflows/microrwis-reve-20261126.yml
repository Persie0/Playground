name: MicroRWIS revision E sensor PCB
on:
  push:
    branches: [ci/microrwis-prototype-20261126]
    paths: [.github/workflows/microrwis-reve-20261126.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/Hardwares
          ref: 720c4b4e410a862b5239bd13570e6fd02258bd2d
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Models and reproducibility
        working-directory: source/road-weather-station
        run: |
          node simulation/rev-e-cable.mjs > /tmp/cable-results.json
          diff -u simulation/rev-e-cable-results.json /tmp/cable-results.json
          node simulation/rev-d.mjs > /tmp/rev-d.json
          node simulation/test.mjs > /tmp/rev-a.json
          diff -u simulation/results.json /tmp/rev-a.json
          node simulation/rev-b.mjs > /tmp/rev-b.json
          node simulation/rev-c.mjs > /tmp/rev-c.json
          cd hardware/sensor-interface
          node generate.mjs
          git diff --exit-code -- sensor-interface.kicad_pcb netlist.json
          node verify.mjs
      - name: KiCad install
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version
      - name: PCB DRC and fabrication export check
        working-directory: source/road-weather-station/hardware/sensor-interface
        run: |
          mkdir -p /tmp/rwis-gerbers
          kicad-cli pcb drc --exit-code-violations --severity-error --output /tmp/rwis-drc.txt sensor-interface.kicad_pcb || { cat /tmp/rwis-drc.txt; exit 1; }
          cat /tmp/rwis-drc.txt
          kicad-cli pcb export gerbers --output /tmp/rwis-gerbers/ sensor-interface.kicad_pcb
          kicad-cli pcb export drill --output /tmp/rwis-gerbers/ sensor-interface.kicad_pcb
          find /tmp/rwis-gerbers -type f -printf '%f %s bytes\n'
          test "$(find /tmp/rwis-gerbers -name '*.gbr' -size +0c | wc -l)" -ge 5
          test "$(find /tmp/rwis-gerbers -name '*.drl' -size +0c | wc -l)" -ge 1
          # No upload: private design files stay private.
