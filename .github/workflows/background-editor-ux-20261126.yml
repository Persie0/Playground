name: Background editor UX native checks
on:
  push:
    branches: [ci/background-editor-ux-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/BackgroundVideoRemover
          ref: 208ace8d9a2277e7953fc4538892b0bbdf1a0c72
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
          cache-disabled: true
      - name: Compile and test
        working-directory: source/android
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          sed -i 's/compileSdk = 37/compileSdk = 36/;s/targetSdk = 37/targetSdk = 36/;s/2026.09.00/2026.05.00/' app/build.gradle.kts
          if gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug > "$RUNNER_TEMP/editor-android.log" 2>&1; then
            echo 'Android unit tests and debug compilation passed.'
          else
            echo '::error::Android unit tests or compilation failed; private build output withheld.'
            exit 1
          fi
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Native emulator smoke and configuration captures
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EDITOR_SCREENSHOT_DIR: ${{ runner.temp }}/editor-android-screens
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install source/android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
            python3 source/scripts/ux-emulator-smoke.py
      - name: Retain Android evidence privately
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          EDITOR_SCREENSHOT_DIR: ${{ runner.temp }}/editor-android-screens
          EDITOR_PLATFORM: android
        run: python3 source/scripts/retain-ux-evidence.py
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/BackgroundVideoRemover
          ref: 208ace8d9a2277e7953fc4538892b0bbdf1a0c72
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: source
      - name: Compile for iOS Simulator
        shell: bash
        run: |
          if xcodebuild -project source/ios/BackgroundVideoRemover.xcodeproj -scheme BackgroundVideoRemover -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build > "$RUNNER_TEMP/editor-ios.log" 2>&1; then
            echo 'iOS Simulator compilation passed.'
          else
            echo '::error::iOS compilation failed; private build output withheld.'
            exit 1
          fi
      - name: Generate UI test scheme
        working-directory: source/ios
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen >/dev/null; fi
          xcodegen generate >/dev/null
      - name: Run simulator UI tests in light and dark with larger text
        shell: bash
        working-directory: source/ios
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for xs in d["devices"].values() for x in xs if x["name"].startswith("iPhone") and x.get("isAvailable")))')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b >/dev/null
          for MODE in light dark; do
            xcrun simctl ui "$DEVICE" appearance "$MODE"
            if [ "$MODE" = dark ]; then
              xcrun simctl ui "$DEVICE" content_size accessibility-medium
            fi
            RESULT="$RUNNER_TEMP/editor-$MODE.xcresult"
            if ! xcodebuild -project BackgroundVideoRemover.xcodeproj -scheme BackgroundVideoRemover -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO -parallel-testing-enabled NO -only-testing:BackgroundVideoRemoverUITests -only-testing:BackgroundVideoRemoverTests/VideoPipelineTests/testExportBlockReasons -resultBundlePath "$RESULT" test > "$RUNNER_TEMP/editor-$MODE.log" 2>&1; then
              echo "::error::iOS UI smoke failed in $MODE appearance."
              exit 1
            fi
            xcrun xcresulttool export attachments --path "$RESULT" --output-path "$RUNNER_TEMP/editor-ios-screens/$MODE" >/dev/null
            echo "iOS UI smoke passed: $MODE appearance."
          done
      - name: Retain iOS evidence privately
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          EDITOR_SCREENSHOT_DIR: ${{ runner.temp }}/editor-ios-screens
          EDITOR_PLATFORM: ios
        run: python3 source/scripts/retain-ux-evidence.py
