name: Temporary AudioBooster APK build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-audiobooster-build-apk-20261004.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check out AudioBooster main
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: audiobooster
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: audiobooster
        run: flutter pub get
      - name: Bootstrap Android
        working-directory: audiobooster
        run: bash tool/bootstrap_android.sh
      - name: Build debug APK
        working-directory: audiobooster
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: audiobooster-debug-apk
          path: audiobooster/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
