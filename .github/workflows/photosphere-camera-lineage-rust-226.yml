name: Photo Sphere checkpoint 226 Rust camera lineage parity
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-camera-lineage-rust-226.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camera-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: ceb6ecf94b0928e929e82614f8b782ce2f3f59f5
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Record exact app source SHA
        run: git rev-parse HEAD
      - name: Verify final checkpoint226 full Rust tests
        run: cargo test --locked
