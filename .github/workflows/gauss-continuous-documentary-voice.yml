name: Gauss Circle - Documentary Script Revision (Public)
on:
  push:
    branches: [ci/gauss-continuous-directors-cut-20261126]
    paths: [.github/workflows/gauss-continuous-documentary-voice.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gauss-continuous-documentary-20261126
  cancel-in-progress: false
env:
  SOURCE_SHA: 69a16187fd77b5fba0b7f69d2f9890e1f82fe82b
  PICTURE_TAG: gauss-circle-continuous-directors-cut-1080p30-20261126
  ORIGINAL_TAG: gauss-circle-complete-1080p30-20261112
  RELEASE_TAG: gauss-circle-directed-documentary-v22-1080p30-20261126
  GH_TOKEN: ${{ github.token }}
  PYTHONUNBUFFERED: '1'
jobs:
  documentary:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read pinned private source on public runner
        uses: actions/checkout@v4
        with:
          repository: Persie0/manimVideos
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'opencv-python-headless>=4.9,<5' 'Pillow>=10,<13' 'edge-tts>=7,<9'
      - name: Verify and render the new visual designs
        run: |
          set -euo pipefail
          cd source/gauss-circle-problem
          python -m unittest discover -s tests -p test_documentary_visual_direction.py -v
          python -m unittest discover -s tests -p test_caption_readability.py -v
          python -m unittest discover -s tests -p test_documentary_pause_timing.py -v
          python -m unittest discover -s tests -p test_documentary_sync.py -v
          python -m production.documentary_visual_direction --preview-only --output-dir ../../visual-previews
      - uses: actions/upload-artifact@v4
        with:
          name: gauss-directed-visual-previews
          path: visual-previews/*
          if-no-files-found: error
          retention-days: 21
      - name: Obtain verified continuous picture and original clean music source
        run: |
          set -euo pipefail
          mkdir -p input
          gh release download "$PICTURE_TAG" --repo Persie0/Playground --dir input --pattern 'Gauss_Circle_Continuous_Directors_Cut_1080p30.mp4' --pattern 'Gauss_Circle_Narration_Cues.json' --pattern 'SHA256SUMS.txt'
          (cd input && sha256sum --check --ignore-missing SHA256SUMS.txt)
          gh release download "$ORIGINAL_TAG" --repo Persie0/Playground --dir input --pattern 'Gauss_Circle_Complete_1080p30_NoNarration.mp4'
          printf '%s  %s\n' e0396bd59ecebf10e8a2b319680b0497632bc8d1ca1a7ba60ec94005f6e0d33e input/Gauss_Circle_Complete_1080p30_NoNarration.mp4 | sha256sum -c -
      - name: Check every rewritten beat against the exact reviewed speech windows and math
        run: |
          set -euo pipefail
          cd source/gauss-circle-problem
          python -m compileall -q production/narrate_continuous_documentary.py production/mix_continuous_documentary.py
          python -m production.narrate_continuous_documentary --script planning/narration-continuous-documentary.md --reference-cues ../../input/Gauss_Circle_Narration_Cues.json --output-dir ../../output --validate-only
          python - <<'PY'
          import json,math
          from pathlib import Path
          from production import narrate_continuous_documentary as n
          from production import continuous_directors_cut as c
          from shared.math_data import count_squared
          cues=json.loads(Path('../../input/Gauss_Circle_Narration_Cues.json').read_text())
          script=n.parse_script(Path('planning/narration-continuous-documentary.md').read_text())
          assert len(script)==14 and sum(map(len,script.values()))==67
          assert [count_squared(r*r) for r in (2,3,5,10,100)]==[13,29,81,317,31417]
          assert count_squared(24)==69
          assert sum(math.isqrt(25-x*x) for x in range(1,5))==15
          beats,joins=c.build_timeline(cues)
          for beat in beats:
              old=[p for p in cues['paragraphs'] if p['scene']==beat.number]
              durations=[p['duration_seconds'] for p in old]
              starts,gaps=n.fit_layout(durations,old,beat.speech_start,beat.speech_end)
              assert all(n.MIN_GAP-.0001<=g<=n.MAX_GAP+.0001 for g in gaps)
              assert abs(starts[-1]+durations[-1]-beat.speech_end)<.001
          print('PASS: all 14 beats, 67 paragraphs, exact mathematical examples and bounded layout')
          PY
      - name: Reuse exact V21 voice and measured word cues; improve subtitle wrapping
        run: |
          set -euo pipefail
          gh run download 45888653746 --repo Persie0/Playground --name gauss-continuous-documentary-voice-qa --dir output
          (cd output && sha256sum -c SHA256SUMS.txt)
          cd source/gauss-circle-problem
          python -m production.reuse_documentary_voice --script planning/narration-continuous-documentary.md --output-dir ../../output
          (cd ../../output && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: gauss-continuous-documentary-voice-qa
          path: output/*
          if-no-files-found: error
          retention-days: 21
      - name: Direct seventeen mathematical visual sequences using actual word cues
        run: |
          set -euo pipefail
          cd source/gauss-circle-problem
          python -m production.documentary_visual_direction --picture ../../input/Gauss_Circle_Continuous_Directors_Cut_1080p30.mp4 --cues ../../output/Gauss_Circle_Documentary_Narration_Cues.json --output-dir ../../directed-picture
          cp ../../directed-picture/*.png ../../directed-picture/*_QA.json ../../output/
      - name: Mix revised narration and clean original instrumental into directed picture
        run: |
          set -euo pipefail
          cd source/gauss-circle-problem
          python -m production.mix_continuous_documentary --picture ../../directed-picture/Gauss_Circle_Directed_Picture_1080p30.mp4 --instrumental-source ../../input/Gauss_Circle_Complete_1080p30_NoNarration.mp4 --reference-cues ../../input/Gauss_Circle_Narration_Cues.json --output-dir ../../output
          (cd ../../output && sha256sum -c SHA256SUMS.txt)
      - name: Verify decoded visual reveal timing and final narration alignment
        run: |
          set -euo pipefail
          cd source/gauss-circle-problem
          python -m production.verify_documentary_sync --film ../../output/Gauss_Circle_Continuous_Documentary_1080p30.mp4 --voice ../../output/Gauss_Circle_Documentary_Voice.wav --visual-qa ../../output/Gauss_Directed_Visuals_QA.json --audio-qa ../../output/Gauss_Circle_Documentary_Audio_QA.json --output ../../output/Gauss_Documentary_Sync_QA.json
          (cd ../../output && sha256sum Gauss_Documentary_Sync_QA.json >> SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: gauss-continuous-documentary-1080p30
          path: output/*
          if-no-files-found: error
          retention-days: 21
          compression-level: 0
      - name: Publish new edition only after complete verification
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo Persie0/Playground >/dev/null 2>&1; then
            echo 'Refusing to overwrite existing release'
            exit 1
          fi
          gh release create "$RELEASE_TAG" output/* --repo Persie0/Playground --title "Gauss Circle — Directed Documentary v22 (1080p30)" --notes "Final readability consolidation: seventeen directed sequences, continuous shell growth, analytical cancellation, linked-arrivals contrast, higher-contrast informational dots, larger numeric labels, balanced captions, exact reused V21 narration and post-encode synchronization checks, original clean instrumental, exact 16,098-frame 536.6-second clock, and visual and audio QA. The source picture is re-encoded to integrate the directed sequences. Earlier releases are unchanged. Source PR #266. Final human viewing remains necessary."
