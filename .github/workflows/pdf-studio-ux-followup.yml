name: PDF Studio UX follow-up validation
# Final validation pass: reader toolbar fits narrow phone widths

on:
  push:
    branches:
      - pdf-studio-ux-followup-ci
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-studio-ux-followup-validation
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout private PDF Studio feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/pdfapp
          ref: feature/pdf-studio-ux-followup
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        run: flutter pub get
      - name: Flutter analyze
        run: flutter analyze
      - name: Flutter tests
        run: flutter test
      - name: Build Android debug
        run: flutter build apk --debug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pdf-studio-ux-followup-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
