name: Photosphere 457 source-original Ceres native four pointer sort
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-457-native-four-sort.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-457-native-four-sort
  cancel-in-progress: false
jobs:
  original-small-sort:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout private source SHA read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: bf8af3f1d8f57b176eec2bef9015846b9d621a25
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify research SHA and Python syntax
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = bf8af3f1d8f57b176eec2bef9015846b9d621a25
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py research/photosphere/checkpoint442/live_six_pair_native_camera_getters.py research/photosphere/checkpoint454/live_original_problem_constructor.py research/photosphere/checkpoint455/live_first_native_registration_entry.py research/photosphere/checkpoint456/live_first_scratch_copy.py research/photosphere/checkpoint457/live_first_native_four_pointer_sort.py research/photosphere/checkpoint457/scan_native_four_pointer_sort.py
      - name: Verify source-original GCam 8.8.225 APK and ARM64 ELF
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Source-run exact original native four-element Ceres sort to caller return
        working-directory: research-src
        env:
          PHOTOSPHERE_THIRD_SHIFT407: '2'
          PHOTOSPHERE_FOURTH_CERES457: '1'
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py > checkpoint457-native.log 2> checkpoint457-diagnostic.log || {
            echo CHECKPOINT457_NATIVE_FAILURE
            tail -n 90 checkpoint457-diagnostic.log
            tail -n 8 checkpoint457-native.log | cut -c1-240
            exit 1
          }
          python3 - <<'PY'
          import json
          line=next(x for x in open("checkpoint457-native.log")
                    if x.startswith("CHECKPOINT395_NATIVE_POINT_SETUP_THIRD_ROBUST_ENTRY_REPORT="))
          d=json.loads(line.split("=",1)[1])
          s=d["checkpoint457_fourth_original_four_pointer_sort"]
          c=d["checkpoint456_fourth_original_first_scratch_copy"]
          p=d["checkpoint455_fourth_native_first_registration_entry"]
          getters=d["checkpoint442_fourth_original_native_getters"]
          assert s and s["checkpoint"]==457
          assert s["source_original_sort_callsite_executed"]
          assert s["source_original_sort_entry_executed"]
          assert s["source_original_small_sort_rodata_jump_table_native_read"]
          assert s["source_original_four_pointer_dispatch_target"]=="0x3cf0e0"
          assert s["source_original_four_pointer_short_branch_taken"]
          assert s["source_original_four_pointer_sorted_ascending_verified"]
          assert s["source_original_ceres_native_sort_return_pc"]=="0x1347b8"
          assert s["source_original_sort_stack_restored"]
          assert s["source_original_original_parameter_input_unchanged"]
          assert s["source_original_native_problem_owner_unchanged"]
          assert s["source_original_native_pimpl_unchanged"]
          assert s["source_original_native_aux216_unchanged"]
          assert s["source_original_source_observation_unchanged"]
          assert not s["source_original_first_parameter_lookup_executed"]
          assert not s["source_original_residual_registration_completed"]
          assert s["source_original_ceres_optimizer_unexecuted"]
          assert c["source_original_parameter_pointer_copy_verified"]
          assert c["source_original_32byte_malloc_BL_executed"]
          assert c["source_original_memmove_import_host_substituted"]
          assert c["source_original_first_sort_BL_stop_pc"]=="0x1347b4"
          assert not c["source_original_sort_executed"]
          assert p["original_source_0x128e04_call_executed"]
          assert getters["source_original_four_pointer_sort_457_completed"]
          assert getters["source_original_first_scratch_456_completed"]
          assert getters["source_original_first_registration_455_completed"]
          assert getters["source_original_problem_ctor_454_completed"]
          assert getters["source_original_point_row_451_completed"]
          assert getters["source_original_pair_buffer_unchanged"]
          assert getters["source_original_source_camera_unchanged"]
          assert getters["source_original_provider_owned_children_unchanged"]
          assert getters["source_original_nested_vector_payloads_unchanged_443"]
          v=getters["source_original_matcher_owned_nested_vectors_443"]
          assert [x["point28"]["count"] for x in v]==[25,15,16,11,0,19]
          assert sum(x["point28"]["count"] for x in v)==86
          print("CHECKPOINT457_SOURCE_NATIVE_SORT_VERIFIED")
          print("CHECKPOINT457_SOURCE_NATIVE_SORT_RECEIPT="+json.dumps(s,sort_keys=True))
          PY
      - name: Delete original APK and native ELF on success or failure
        if: always()
        working-directory: research-src
        run: |
          rm -f original.apk research/native/liblightcycle.so
      - name: Upload source-only diagnostic (no original binary)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-457-first-four-pointer-sort-source-only
          path: research-src/checkpoint457-diagnostic.log
          if-no-files-found: error
          retention-days: 7
