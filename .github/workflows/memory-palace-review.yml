name: Memory Palace review validation

# red-phase root-cause trigger
on:
  push:
    paths:
      - '.github/workflows/memory-palace-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate private repository token
        env:
          REPO_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$REPO_TOKEN"

      - name: Checkout Memory Palace review branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/Memory_Palace_Builder
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: fix/revenuecat-hardening
          fetch-depth: 1
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Run visibility regression tests
        working-directory: app
        run: flutter test test/pro_visibility_regression_test.dart

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Run full Flutter tests
        working-directory: app
        run: flutter test
