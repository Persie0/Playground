name: Google sign-in dependency validation

on:
  push:
    paths:
      - .github/workflows/google-signin-deps-validation.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: memory-palace
            repository: Persie0/Memory_Palace_Builder
            ref: chore/google-signin-deps-2026-09
          - label: mwst-buchhalter
            repository: Persie0/mwst_buchhalter
            ref: chore/google-signin-deps-2026-09
          - label: vitamindtracker
            repository: Persie0/vitamindtracker
            ref: chore/google-signin-deps-2026-09
          - label: nomadrank
            repository: Persie0/skratch_clone
            ref: chore/google-signin-deps-2026-09
          - label: norwegian-yoyillo
            repository: Persie0/norwegian_yoyillo
            ref: chore/google-signin-deps-2026-09

    steps:
      - name: Check private repository token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        shell: bash
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout app branch
        uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: app
          persist-credentials: true

      - name: Configure private GitHub dependencies
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        shell: bash
        run: |
          git config --global url."https://x-access-token:${PRIVATE_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        id: pub
        continue-on-error: true
        working-directory: app
        shell: bash
        run: flutter pub get >/tmp/pub-get.log 2>&1

      - name: Analyze
        id: analyze
        if: steps.pub.outcome == 'success'
        continue-on-error: true
        working-directory: app
        shell: bash
        run: flutter analyze --no-fatal-infos >/tmp/analyze.log 2>&1

      - name: Build Android debug APK
        id: build
        if: steps.pub.outcome == 'success' && steps.analyze.outcome == 'success'
        continue-on-error: true
        working-directory: app
        shell: bash
        run: flutter build apk --debug >/tmp/build.log 2>&1

      - name: Record sanitized result and refreshed lockfile
        if: always()
        working-directory: app
        shell: bash
        env:
          PUB_OUTCOME: ${{ steps.pub.outcome }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          set -euo pipefail
          mkdir -p .ci
          printf 'pub=%s\nanalyze=%s\nbuild=%s\n' \
            "$PUB_OUTCOME" "$ANALYZE_OUTCOME" "$BUILD_OUTCOME" \
            > .ci/google-signin-deps-validation.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/google-signin-deps-validation.txt

          if [ "$PUB_OUTCOME" = "success" ] &&
             [ "$ANALYZE_OUTCOME" = "success" ] &&
             [ "$BUILD_OUTCOME" = "success" ]; then
            git add pubspec.lock
          fi

          git commit -m "ci: record dependency validation"
          git push origin "HEAD:${{ matrix.ref }}"

          if [ "$PUB_OUTCOME" != "success" ] ||
             [ "$ANALYZE_OUTCOME" != "success" ] ||
             [ "$BUILD_OUTCOME" != "success" ]; then
            exit 1
          fi
