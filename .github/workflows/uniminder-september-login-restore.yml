name: Uniminder September login restoration validation
on:
  push:
    paths:
      - '.github/workflows/uniminder-september-login-restore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout historical-login PR
        uses: actions/checkout@v4
        with:
          repository: Persie0/student
          ref: fix/restore-tiss-login-september-2026
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: uniminder
      - name: Confirm exact September 2026 source
        working-directory: uniminder
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object lib/screens/university/tiss_login_screen.dart)" = caacef9a84a4b2eeb9515926e035aeea0deee0a6
          test ! -e lib/services/tiss_login_autofill.dart
          test ! -e test/tiss_login_autofill_test.dart
          grep -q 'fontSize: 7.2,' lib/screens/calendar/calendar_screen.dart
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: uniminder
        run: flutter pub get
      - name: Analyze TISS login and grades integration
        working-directory: uniminder
        run: flutter analyze --no-pub lib/screens/university/tiss_login_screen.dart lib/screens/university/certificates_screen.dart lib/services/certificates_service.dart lib/screens/calendar/calendar_screen.dart
      - name: Run existing calendar and TISS regression tests
        working-directory: uniminder
        run: flutter test --no-pub test/tiss_certificate_page_test.dart test/calendar_direct_links_test.dart test/course_name_resolver_test.dart
