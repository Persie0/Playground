name: Noise Remover GlitchTip SAF and long-file fixes
# Revalidate after analyzer lint fix on private branch.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/noise-remover-glitchtip-20261105.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout private Noise Remover branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/noise_remover
          ref: fix/glitchtip-saf-longfile-20261105
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Check formatting of changed files
        continue-on-error: true
        working-directory: app
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/services/settings_service.dart \
            lib/services/android_saf_export_policy.dart \
            lib/screens/result_screen.dart \
            lib/services/android_long_foreground_worker.dart \
            lib/utils/long_file_failure_diagnostics.dart \
            test/services/android_saf_export_policy_test.dart \
            test/utils/long_file_failure_diagnostics_test.dart

      - name: Targeted Flutter regression tests
        working-directory: app
        run: |
          flutter test \
            test/services/android_saf_export_policy_test.dart \
            test/utils/long_file_failure_diagnostics_test.dart \
            test/full_error_hardening_regression_test.dart \
            test/recording_storage_regression_test.dart

      - name: Analyze touched sources
        working-directory: app
        run: |
          flutter analyze --no-pub \
            lib/services/settings_service.dart \
            lib/services/android_saf_export_policy.dart \
            lib/screens/result_screen.dart \
            lib/services/android_long_foreground_worker.dart \
            lib/utils/long_file_failure_diagnostics.dart \
            test/services/android_saf_export_policy_test.dart \
            test/utils/long_file_failure_diagnostics_test.dart
