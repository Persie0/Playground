name: Photo Sphere checkpoint 228 Rust AddImage native first-frame preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-addimage-rust-228.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 6a70f2f5507584737101f224684b34da29b094b4
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Print exact source revision
        run: git rev-parse HEAD
      - name: Run full Rust regression with original first-image AddImage feature record state
        run: cargo test --locked
