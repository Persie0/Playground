name: Photo Sphere checkpoint 228 Rust AddImage native first-frame preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-addimage-rust-228.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: parity/checkpoint228-addimage-lifecycle
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Print exact source revision
        run: git rev-parse HEAD
      - name: Validate complete checkpoint227 Rust test suite
        run: cargo test --locked --lib original_addimage_first_frame_feature_setup_preserves_camera_words -- --nocapture
