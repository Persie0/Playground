name: Traffic counting PR28 follow-up verify

on:
  push:
    paths:
      - ".github/workflows/traffic-counting-pr28-followup.yml"
      - "debug_triggers/traffic-counting-pr28-followup.txt"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout traffic branch with LFS models
        uses: actions/checkout@v5
        with:
          repository: Persie0/traffic-counting-light-main
          ref: perf/pr28-followup-exact-optimizations
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          lfs: true
          path: traffic

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r traffic/traffic-counting-edge-detection-master/requirements-nonhailo.txt

      - name: Focused equivalence tests
        working-directory: traffic/traffic-counting-edge-detection-master
        env:
          PYTHONPATH: src
        run: |
          pytest -q tests/test_perf_pr28_followup.py tests/test_analysis_masked_median.py

      - name: NCNN by-reference actual-model equivalence
        working-directory: traffic/traffic-counting-edge-detection-master
        run: |
          python - <<'PY'
          from pathlib import Path
          import ncnn
          import numpy as np

          model = Path("src/inference/models/libreyolo9t-288x384-ncnn")
          param = next(model.glob("*.param"))
          binf = next(model.glob("*.bin"))
          if binf.stat().st_size < 1_000_000:
              raise SystemExit(f"model binary was not materialized from LFS: {binf.stat().st_size} bytes")
          net = ncnn.Net()
          net.opt.num_threads = 4
          assert int(net.load_param(str(param))) == 0
          assert int(net.load_model(str(binf))) == 0

          rng = np.random.default_rng(28)
          image = rng.integers(0, 255, (288, 384, 3), dtype=np.uint8)
          mat = ncnn.Mat.from_pixels(image, ncnn.Mat.PixelType.PIXEL_BGR2RGB, 384, 288)
          mat.substract_mean_normalize([], [1.0 / 255.0] * 3)

          with net.create_extractor() as ex:
              assert int(ex.input("in0", mat)) == 0
              ret_old, old_out = ex.extract("out0")
          assert int(ret_old) == 0
          old = np.asarray(old_out, dtype=np.float32).copy()

          with net.create_extractor() as ex:
              assert int(ex.input("in0", mat)) == 0
              new_out = ncnn.Mat()
              ret_new = ex.extract("out0", new_out, 0)
          assert int(ret_new) == 0
          new = np.asarray(new_out, dtype=np.float32)

          if not np.array_equal(old, new):
              raise SystemExit(f"NCNN outputs differ: max abs {np.max(np.abs(old - new))}")
          print("NCNN convenience/by-reference outputs identical:", old.shape)
          PY

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            traffic/traffic-counting-edge-detection-master/src/analysis/background/masked_median.py \
            traffic/traffic-counting-edge-detection-master/src/speed_measurement/homography_speed_measurement.py \
            traffic/traffic-counting-edge-detection-master/src/inference/ncnn_inference.py

      - name: Full documented unittest suite (legacy failures informational)
        continue-on-error: true
        working-directory: traffic/traffic-counting-edge-detection-master
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_*.py"
