name: Traffic counting PR28 follow-up verify

on:
  push:
    paths:
      - ".github/workflows/traffic-counting-pr28-followup.yml"
      - "debug_triggers/traffic-counting-pr28-followup.txt"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout traffic branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/traffic-counting-light-main
          ref: perf/pr28-followup-exact-optimizations
          path: traffic

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -r traffic/traffic-counting-edge-detection-master/requirements-nonhailo.txt

      - name: Focused equivalence tests
        working-directory: traffic/traffic-counting-edge-detection-master
        env:
          PYTHONPATH: src
        run: |
          pytest -q tests/test_perf_pr28_followup.py tests/test_analysis_masked_median.py

      - name: NCNN by-reference overload smoke test
        working-directory: traffic/traffic-counting-edge-detection-master
        run: |
          python - <<'PY'
          import ncnn
          net = ncnn.Net()
          out = ncnn.Mat()
          with net.create_extractor() as ex:
              try:
                  ret = ex.extract("out0", out, 0)
              except TypeError as exc:
                  raise SystemExit(f"by-reference extract overload unavailable: {exc}")
          print("by-reference overload accepted; return code:", ret)
          PY

      - name: Compile changed Python modules
        run: |
          python -m py_compile \
            traffic/traffic-counting-edge-detection-master/src/analysis/background/masked_median.py \
            traffic/traffic-counting-edge-detection-master/src/speed_measurement/homography_speed_measurement.py \
            traffic/traffic-counting-edge-detection-master/src/inference/ncnn_inference.py

      - name: Full Python test suite
        working-directory: traffic/traffic-counting-edge-detection-master
        env:
          PYTHONPATH: src
        run: pytest -q
