name: RepForge Impeccable follow-up validation (public runner)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repforge-impeccable-followup-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Read pinned private RepForge commit
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          SOURCE_BRANCH: feat/impeccable-city-guard-quest-a11y-20261121
          SOURCE_SHA: d84a6a0f8355ad43197774a72b0c4e271b3d22e5
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Private repository token missing'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --quiet --depth 1 --branch "$SOURCE_BRANCH" \
            https://github.com/Persie0/gameexercise.git source
          test -s source/pubspec.yaml
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA" || {
            echo 'Private branch changed after CI was prepared'; exit 1;
          }
      - name: Format check, analyze and focused widget regressions
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          flutter pub get > /tmp/repforge_pub.log 2>&1 || {
            tail -n 75 /tmp/repforge_pub.log; exit 1;
          }
          dart format --output=none lib test > /tmp/repforge_format.log 2>&1 || {
            tail -n 100 /tmp/repforge_format.log; exit 1;
          }
          flutter analyze > /tmp/repforge_analyze.log 2>&1 || {
            tail -n 120 /tmp/repforge_analyze.log; exit 1;
          }
          flutter test test/forge_city_build_screen_test.dart test/app_smoke_test.dart --reporter expanded > /tmp/repforge_focus.log 2>&1 || {
            tail -n 260 /tmp/repforge_focus.log | cut -c 1-250; exit 1;
          }
          flutter test --reporter compact > /tmp/repforge_all.log 2>&1 || {
            tr '\r' '\n' < /tmp/repforge_all.log |
              grep -E '\[E\]|TestFailure|Expected:|Actual:|The test description was:' |
              tail -n 120 | cut -c 1-220 || true
            tail -n 140 /tmp/repforge_all.log | cut -c 1-240
            exit 1
          }
          tail -n 5 /tmp/repforge_analyze.log
          tail -n 7 /tmp/repforge_all.log | cut -c 1-220
      - name: Compile Android debug APK
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          flutter build apk --debug > /tmp/repforge_android.log 2>&1 || {
            tail -n 115 /tmp/repforge_android.log | cut -c 1-280; exit 1;
          }
          test -s build/app/outputs/flutter-apk/app-debug.apk
          echo 'Android debug APK compiled successfully; not uploaded'
