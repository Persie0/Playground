name: Image Enhancer post85 selection truth and theme validation
on:
  push:
    branches: [image-enhancer-post85-selection-truth-validation-20261122]
    paths:
      - .github/workflows/image_enhancer_post85_selection_truth.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-enhancer-post85-selection-truth-validation-20261122
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout private app using public Playground token
        uses: actions/checkout@v4
        with:
          repository: Persie0/image_enhancer
          ref: impeccable/post85-model-selection-truth-and-theming
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: image_enhancer
      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        working-directory: image_enhancer
        run: flutter pub get --enforce-lockfile
      - name: Generate localized Flutter strings
        working-directory: image_enhancer
        run: flutter gen-l10n
      - name: Focused model UX regression tests
        working-directory: image_enhancer
        run: |
          flutter test test/impeccable_post85_model_selection_truth_test.dart \
            test/impeccable_post84_model_guidance_test.dart \
            test/impeccable_live_batch_queue_test.dart \
            test/impeccable_model_purpose_test.dart \
            test/impeccable_post_p2_ux_test.dart \
            test/model_localization_coverage_test.dart \
            --timeout 2m --reporter expanded
      - name: Strict Flutter analyzer
        working-directory: image_enhancer
        run: flutter analyze
      - name: Complete Flutter regression suite
        working-directory: image_enhancer
        run: flutter test --concurrency=2 --timeout 2m --reporter compact
