'''
          if s.count(old) != 1:
              raise SystemExit('optional interstitial catch not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          flutter pub get
          flutter gen-l10n
          dart format lib/services/subscription_service.dart lib/screens/paywall_screen.dart lib/services/ad_service.dart
          flutter analyze --no-fatal-infos
          flutter test
      - name: Commit and push fix branch
        working-directory: app
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          git config user.name 'Persie0'
          git config user.email '76871553+Persie0@users.noreply.github.com'
          git add lib/services/subscription_service.dart lib/screens/paywall_screen.dart lib/services/ad_service.dart
          git commit -m 'Handle expected store and ad states without Sentry noise'
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/Persie0/noise_remover.git"
          git push --force-with-lease origin HEAD:fix/sentry-expected-external-states
