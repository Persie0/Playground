name: Noise Remover remaining Sentry fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noise-remover-sentry-external-state-fixes.yml'
      - '.github/scripts/noise_remover_sentry_external.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Checkout current Noise Remover master
        uses: actions/checkout@v5
        with:
          repository: Persie0/noise_remover
          ref: master
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: app
          fetch-depth: 0
      - name: Apply expected external-state fixes
        run: |
          cd app
          git checkout -B fix/sentry-expected-external-states origin/master
          python3 ../.github/scripts/noise_remover_sentry_external.py
          sed -i 's/} on TimeoutException catch (e, stackTrace) {/} on TimeoutException catch (e) {/' lib/screens/paywall_screen.dart
          flutter pub get
          flutter gen-l10n
          dart format lib/services/subscription_service.dart lib/screens/paywall_screen.dart lib/services/ad_service.dart
          flutter analyze --no-fatal-infos
          flutter test
      - name: Commit and push fix branch
        working-directory: app
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          git config user.name 'Persie0'
          git config user.email '76871553+Persie0@users.noreply.github.com'
          git add lib/services/subscription_service.dart lib/screens/paywall_screen.dart lib/services/ad_service.dart
          git commit -m 'Handle expected store and ad states without Sentry noise'
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/Persie0/noise_remover.git"
          git push --force-with-lease origin HEAD:fix/sentry-expected-external-states
