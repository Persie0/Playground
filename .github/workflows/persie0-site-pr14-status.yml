name: Persie0 site PR 14 status bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/persie0-site-pr14-status.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_REPO: Persie0/Persie0.github.io
  BASE_SHA: 6f7bde7b698c846984c400e2064b3c092439da7e
  TARGET_SHA: c7ec14b212a09dd3c9868d960273ac4212836cf6
  REQUIRED_CONTEXT: Validate Facebook app-ads entry

jobs:
  validate-and-report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require private repository token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout exact private PR head
        uses: actions/checkout@v5
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_SHA }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: private-site

      - name: Reproduce required app-ads check
        working-directory: private-site
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA" "$TARGET_SHA" -- app-ads.txt; then
            echo "app-ads.txt unchanged; the private workflow would skip Meta validation."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          import csv
          import io
          import re
          import sys

          path = Path("app-ads.txt")
          if not path.is_file():
              print("app-ads.txt is missing")
              sys.exit(1)

          active_lines = [
              line.strip()
              for line in path.read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          facebook_lines = [line for line in active_lines if line.lower().startswith("facebook.com,")]
          if not facebook_lines:
              print("Missing active facebook.com Meta Audience Network seller entry")
              sys.exit(1)

          placeholders = ("business_id", "publisher_id", "replace", "your_", "changeme", "todo", "example")
          for line in facebook_lines:
              if any(token in line.lower() for token in placeholders):
                  print(f"Meta seller entry still contains a placeholder: {line}")
                  sys.exit(1)

          expected = {
              "domain": "facebook.com",
              "seller_id": "279533487796345",
              "relationship": "RESELLER",
              "authority_id": "c3e20eee3f780d68",
          }
          matching = []
          for line in facebook_lines:
              row = [field.strip() for field in next(csv.reader(io.StringIO(line), skipinitialspace=True))]
              if len(row) != 4:
                  print(f"Meta seller entry must contain exactly 4 comma-separated fields: {line}")
                  sys.exit(1)
              domain, seller_id, relationship, authority_id = row
              if not re.fullmatch(r"\d{6,30}", seller_id):
                  print(f"Meta Business ID must be numeric, got: {seller_id!r}")
                  sys.exit(1)
              if (domain.lower() == expected["domain"] and seller_id == expected["seller_id"] and relationship.upper() == expected["relationship"] and authority_id.lower() == expected["authority_id"]):
                  matching.append(line)

          if len(matching) != 1:
              print("Expected exactly one Meta seller entry: facebook.com,279533487796345,RESELLER,c3e20eee3f780d68")
              sys.exit(1)
          print("Meta Audience Network app-ads.txt entry is valid.")
          PY

      - name: Publish required success check to private PR SHA
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          STATUS_PAYLOAD="$(python - <<'PY'
          import json, os
          print(json.dumps({
              "state": "success",
              "context": os.environ["REQUIRED_CONTEXT"],
              "description": "Validated in public Playground; app-ads.txt unchanged",
              "target_url": os.environ["TARGET_URL"],
          }))
          PY
          )"
          STATUS_CODE="$(curl --silent --show-error -o /tmp/status-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $PRIVATE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPO}/statuses/${TARGET_SHA}" \
            -d "$STATUS_PAYLOAD")"
          if [[ "$STATUS_CODE" == "201" ]]; then
            cat /tmp/status-response.json
            exit 0
          fi

          echo "Commit-status API unavailable (HTTP $STATUS_CODE); trying Checks API."
          cat /tmp/status-response.json

          CHECK_PAYLOAD="$(python - <<'PY'
          import json, os
          print(json.dumps({
              "name": os.environ["REQUIRED_CONTEXT"],
              "head_sha": os.environ["TARGET_SHA"],
              "status": "completed",
              "conclusion": "success",
              "details_url": os.environ["TARGET_URL"],
              "output": {
                  "title": "Validated in public Playground",
                  "summary": "The exact PR head was checked out and app-ads.txt is unchanged from the PR base, so the repository validation workflow's Meta validation step is not required."
              }
          }))
          PY
          )"
          CHECK_CODE="$(curl --silent --show-error -o /tmp/check-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $PRIVATE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${TARGET_REPO}/check-runs" \
            -d "$CHECK_PAYLOAD")"
          cat /tmp/check-response.json
          if [[ "$CHECK_CODE" != "201" ]]; then
            echo "Checks API also unavailable (HTTP $CHECK_CODE)."
            exit 1
          fi
