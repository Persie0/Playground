name: Photosphere batch 373-375 original third matcher and source point-vector growth
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-batch-373-375.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-batch-373-375
  cancel-in-progress: false
jobs:
  native-original:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Exact private research SHA read-only checkout
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 9de95a9a1cb3f87c0e8408a5b6556d0f662dd30b
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify commit and native dependencies once
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9de95a9a1cb3f87c0e8408a5b6556d0f662dd30b
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint373/native_original_third_addimage_matcher_entry.py research/photosphere/checkpoint374/native_original_point_row_growth_solver.py
      - name: Ephemeral source-original APK and ARM64 ELF verified by hash
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Native status5 pair 28-byte row vector growth and solver handoff
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint374/native_original_point_row_growth_solver.py research/native/liblightcycle.so --output checkpoint374-native.json | tee checkpoint374-native.log
          grep -q '^CHECKPOINT374_NATIVE_MULTI_POINT_ROW_GROWTH_SOLVER_BRANCH_PASS ' checkpoint374-native.log
          python3 - <<'PY'
          import json
          d=json.load(open('checkpoint374-native.json'))
          assert d['checkpoint']==374
          assert d['original_addimage_native_pose_getters_executed']
          assert d['original_fov_pairs_bitwise_identical_to_source']
          p=d['source_original_point_row_append_probe']
          x=p['original_source_native_multirow_growth']
          assert p['original_28byte_row_append_helper_pc']=='0x122384'
          assert not p['original_source_row_vector_header_test_supplied']
          assert x['original_native_append_count']==3
          assert x['original_rows_test_supplied']
          assert x['original_original_vector_headers_not_injected']
          assert [int(t['row_count']) for t in x['original_native_header_progression']]==[1,2,3]
          assert len(x['original_native_owned_source_rows_hex'])==3
          assert x['original_status5_three_row_solver_entry_pc_sequence'][-1]=='0x128da8'
          assert p['native_original_fov_pair_source_restored_after_test']
          print('CHECKPOINT374_ORIGINAL_ROW_GROWTH_NATIVE_VERIFIED')
          PY
      - name: Original third-image AddImage matcher-entry and second-native point row provenance
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint373/native_original_third_addimage_matcher_entry.py > checkpoint373-full.log 2> checkpoint373-debug.log
          grep -q '^CHECKPOINT373_ORIGINAL_THIRD_MATCHER_ENTRY_REPORT=' checkpoint373-full.log
          python3 - <<'PY'
          import json
          line=next(l for l in open('checkpoint373-full.log') if l.startswith('CHECKPOINT373_ORIGINAL_THIRD_MATCHER_ENTRY_REPORT='))
          d=json.loads(line.split('=',1)[1])
          assert d['checkpoint']==373
          assert d['original_550_trial_ransac_executed']
          assert d['original_bidirectional_links_executed']
          assert d['original_postlink_tree_exit_executed']
          p=d['source_original_third_image_callsite']
          assert p['original_third_wrapper_return_seen']
          assert p['original_prior_two_image_provider_counts']==[2,2]
          assert p['original_provider_count_after_three']==[3,3]
          assert p['original_third_feature_owner_vector_count']==3
          assert p['original_native_third_rosette_camera_vector_counts']==[3,3]
          assert p['original_native_third_rosette_pose_vector_counts']==[3,3]
          assert p['original_third_source_index2_input_no_host_branch_patches']
          assert not p['original_third_matcher_body_or_ransac_executed']
          assert not p['reached_full_original_third_addimage']
          if p['original_third_matcher_entry_reached']:
            assert p['original_third_highlevel_matcher_entry']['pc']=='0x120600'
            assert p['original_third_highlevel_matcher_entry']['original_addimage_caller_return_pc']=='0x11db8c'
            assert p['original_third_highlevel_matcher_entry']['native_highlevel_matcher_body_executed_for_third']==False
            print('CHECKPOINT373_TRUE_ORIGINAL_THIRD_MATCHER_ENTRY_REACHED')
          else:
            print('CHECKPOINT373_THIRD_MATCHER_ENTRY_NOT_YET_REACHED',p.get('original_third_execution_error'),p.get('original_third_registration_pcs'))
          rows=d['source_original_second_matcher_point_rows']
          assert all(x['original_native_executed'] and x['original_source_writer']=='0x122384' for x in rows)
          print('CHECKPOINT373_ORIGINAL_SECOND_MATCHER_NATIVE_POINT_ROW_CALLS',len(rows))
          open('checkpoint373-compact.json','w').write(json.dumps(d,indent=2,sort_keys=True)+'\n')
          PY
      - name: Remove original proprietary APK and ELF before uploads
        if: always()
        run: rm -f original.apk research/native/liblightcycle.so com.google.android.GoogleCamera_*.apk
      - name: Archive numeric-only native oracles and findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-373-375-source-oracles
          path: |
            checkpoint374-native.json
            checkpoint374-native.log
            checkpoint373-compact.json
            checkpoint373-debug.log
          retention-days: 7
          if-no-files-found: warn

  app-rust:
    needs: native-original
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact private app SHA read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 674eb168446511ef3f14ead11303a77db0030888
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: photosphere-373-375-source-oracles
          path: source
      - name: Verify app SHA and fixed Rust toolchain
        run: test "$(git rev-parse HEAD)" = 674eb168446511ef3f14ead11303a77db0030888
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Single Rust library and integration regression batch
        env:
          PHOTOSPHERE_374_NATIVE_JSON: ${{ github.workspace }}/source/checkpoint374-native.json
        run: |
          set -euo pipefail
          test -s "$PHOTOSPHERE_374_NATIVE_JSON"
          cargo test --locked --lib > batch374-lib.log 2>&1 || { tail -n 160 batch374-lib.log; exit 1; }
          cargo test --locked --tests > batch374-integration.log 2>&1 || { tail -n 160 batch374-integration.log; exit 1; }
          grep '^test result:' batch374-lib.log | tail -1
          grep '^test result:' batch374-integration.log | tail -10
      - name: Retain only grouped Rust logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-373-375-rust
          path: |
            batch374-lib.log
            batch374-integration.log
          retention-days: 7
          if-no-files-found: warn
