name: Traffic Alchemist Impeccable Final UX Validation
on:
  push:
    branches: [ci/traffic-alchemist-impeccable-final]
    paths:
      - .github/workflows/traffic-alchemist-battle-ui.yml
  workflow_dispatch:
    inputs:
      private_ref:
        description: Branch or commit in Traffic Alchemist
        type: string
        required: true
        default: feat/impeccable-p1-p2-final-pass
permissions:
  contents: read
jobs:
  ui-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout private game without persisting credentials
        uses: actions/checkout@v5
        with:
          repository: Persie0/trafficalchemist
          ref: ${{ inputs.private_ref || 'feat/impeccable-p1-p2-final-pass' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: game
      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false
      - name: Import and validate scripts
        working-directory: game
        run: |
          set -o pipefail
          timeout 70s godot --headless --editor --path . --import --quit 2>&1 | tee /tmp/import.log
          if grep -Eq 'SCRIPT ERROR:|Failed to load script' /tmp/import.log; then exit 1; fi
      - name: Debug interactive UI suite with streamed error output
        working-directory: game
        run: timeout 22s godot --headless --path . --script tests/test_ui.gd
      - name: Run eight Godot regression suites
        working-directory: game
        run: python3 tests/run_checks.py
