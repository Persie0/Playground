name: SkipSilencePlayer round 7 native UX validation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/skipsilenceplayer-round7-native-qa.yml
      - .github/scripts/skipsilence-r7-native-ui.py

permissions:
  contents: read

jobs:
  android-ui:
    name: Android tests and real-media UI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout public Playground smoke script
        uses: actions/checkout@v4
      - name: Checkout SkipSilencePlayer
        uses: actions/checkout@v4
        with:
          repository: Persie0/SkipSilencePlayer
          ref: 516ae23195adb3bce3a2ff3629be39dd921bce8c
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          path: app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests and build APK
        working-directory: app/kotlin-android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Generate local video with audio for smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir -p native-review
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=320x180:rate=10" \
            -f lavfi -i "sine=frequency=440:sample_rate=44100" \
            -t 120 -c:v libx264 -preset ultrafast -crf 34 \
            -pix_fmt yuv420p -c:a aac -b:a 64k \
            native-review/fixture.mp4
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator playback, guidance and Library accessibility
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/kotlin-android/app/build/outputs/apk/debug/app-debug.apk
            python3 .github/scripts/skipsilence-r7-native-ui.py
            echo 'ANDROID_PLAYER_CAPTURE_START'
            base64 -w 0 native-review/video-player.png
            echo
            echo 'ANDROID_PLAYER_CAPTURE_END'
            echo 'ANDROID_LARGE_FONT_CAPTURE_START'
            base64 -w 0 native-review/large-font-library.png
            echo
            echo 'ANDROID_LARGE_FONT_CAPTURE_END'
      - name: Print player screenshot when UI smoke fails
        if: failure()
        run: |
          if [ -f native-review/video-player.png ]; then
            echo 'ANDROID_PLAYER_CAPTURE_START'
            base64 -w 0 native-review/video-player.png
            echo
            echo 'ANDROID_PLAYER_CAPTURE_END'
          fi
      - name: Upload native UI review captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SkipSilencePlayer-round7-native-Android-review
          path: native-review/*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SkipSilencePlayer-round7-debug-APK
          path: app/kotlin-android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

  ios:
    # No iOS source changed since the preceding successful simulator build.
    # Keep this job available for manual full verification only.
    if: github.event_name == 'workflow_dispatch'
    name: iOS simulator compile
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout SkipSilencePlayer
        uses: actions/checkout@v4
        with:
          repository: Persie0/SkipSilencePlayer
          ref: 516ae23195adb3bce3a2ff3629be39dd921bce8c
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          path: app
      - name: Build unsigned iOS simulator app
        run: |
          set -o pipefail
          xcodebuild -project app/swift-ios/SkipSilencePlayer.xcodeproj \
            -scheme SkipSilencePlayer -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
