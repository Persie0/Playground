name: Noise Remover rebase open PRs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noise-remover-rebase-open-prs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rebase-pr141:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Checkout Noise Remover master
        uses: actions/checkout@v5
        with:
          repository: Persie0/noise_remover
          ref: master
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: app
          fetch-depth: 0
      - name: Rebase safe PR 141 design hunks onto master
        working-directory: app
        run: |
          git fetch origin design/material3-accessibility-refresh
          OLD=origin/design/material3-accessibility-refresh
          BASE=$(git merge-base origin/master "$OLD")
          git diff --binary "$BASE" "$OLD" -- \
            lib/theme.dart \
            lib/screens/home_screen.dart \
            lib/screens/result_screen.dart > /tmp/pr141.patch
          git checkout -B design/material3-accessibility-refresh origin/master

          # Preserve all current production logic. Apply every clean design hunk;
          # overlapping stale hunks are intentionally rejected instead of
          # overwriting newer R8/error/player work.
          set +e
          git apply --reject --whitespace=fix /tmp/pr141.patch
          APPLY_STATUS=$?
          set -e
          echo "git apply status: $APPLY_STATUS"
          find lib -name '*.rej' -print -exec sed -n '1,220p' {} \;
          find lib -name '*.rej' -delete

          flutter pub get
          flutter gen-l10n
          dart format lib/theme.dart lib/screens/home_screen.dart lib/screens/result_screen.dart
          flutter analyze --no-fatal-infos
          flutter test

      - name: Commit and update PR 141 branch
        working-directory: app
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          git config user.name 'Persie0'
          git config user.email '76871553+Persie0@users.noreply.github.com'
          git add lib/theme.dart lib/screens/home_screen.dart lib/screens/result_screen.dart
          git commit -m 'Rebase Material 3 accessibility refresh onto current master'
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/Persie0/noise_remover.git"
          git push --force-with-lease origin HEAD:design/material3-accessibility-refresh

  rebase-pr127:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Checkout Noise Remover master
        uses: actions/checkout@v5
        with:
          repository: Persie0/noise_remover
          ref: master
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: app
          fetch-depth: 0
      - name: Rebase still-valid PR 127 fixes onto master
        working-directory: app
        run: |
          git fetch origin agent/fix-current-sentry-aug10
          OLD=origin/agent/fix-current-sentry-aug10
          BASE=$(git merge-base origin/master "$OLD")
          git diff --binary "$BASE" "$OLD" -- \
            lib/services/settings_service.dart \
            lib/utils/ffmpeg_utils.dart > /tmp/pr127-clean.patch
          git checkout -B agent/fix-current-sentry-aug10 origin/master
          git apply --index /tmp/pr127-clean.patch

          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/screens/audio_recording_screen.dart')
          s = p.read_text()

          def once(old, new, label):
              global s
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {n}')
              s = s.replace(old, new, 1)

          once(
              '  static const int _rawWriteHighWaterBytes = 2 * 1024 * 1024;\n\n',
              "  static const int _rawWriteHighWaterBytes = 2 * 1024 * 1024;\n\n"
              "  // Avoid record 7.x automatic Android Bluetooth SCO management.\n"
              "  // That path owns ACTION_SCO_AUDIO_STATE_UPDATED and is the native\n"
              "  // receiver implicated by NOISEREMOVE-59. Noise Remover has no\n"
              "  // Bluetooth input selector, so use the stable default-device path.\n"
              "  static const AndroidRecordConfig _androidRecordConfig =\n"
              "      AndroidRecordConfig(manageBluetooth: false);\n\n",
              'android config',
          )
          once(
              '  bool _isRecording = false;\n  bool _isRequestingPermission = false;\n  bool _isCleanWhileRecording = false;\n',
              '  bool _isRecording = false;\n  bool _isRequestingPermission = false;\n  bool _isCleanWhileRecording = false;\n'
              '  bool _isDisposed = false;\n  bool _isCancelling = false;\n  bool _recorderStarted = false;\n'
              '  Future<void>? _startRecordingFuture;\n',
              'recorder fields',
          )
          once(
              '  Future<void> _cleanupResources() async {\n    await _recordStreamSub?.cancel();\n    _recordStreamSub = null;\n  }\n\n',
              '  Future<void> _cleanupResources() async {\n    await _recordStreamSub?.cancel();\n    _recordStreamSub = null;\n  }\n\n'
              '  Future<void> _disposeRecorderResources() async {\n'
              '    await _cleanupResources();\n'
              '    _processingIsolate?.kill(priority: Isolate.immediate);\n'
              '    _processingIsolate = null;\n'
              '    try {\n      await Noiseless.instance.resetRealtime();\n    } catch (_) {}\n'
              '    try {\n      await _finishRawSink();\n    } catch (_) {}\n'
              '    _isolateReceivePort?.close();\n'
              '    _isolateReceivePort = null;\n'
              '    _isolateSendPort = null;\n'
              '    await _recorder.dispose();\n'
              '  }\n\n'
              '  Future<void> _beginRecording() {\n'
              '    if (_isDisposed) return Future<void>.value();\n'
              '    final existing = _startRecordingFuture;\n'
              '    if (existing != null) return existing;\n\n'
              '    late Future<void> operation;\n'
              '    operation = _startRecording().whenComplete(() {\n'
              '      if (identical(_startRecordingFuture, operation)) {\n'
              '        _startRecordingFuture = null;\n'
              '      }\n'
              '    });\n'
              '    _startRecordingFuture = operation;\n'
              '    return operation;\n'
              '  }\n\n'
              '  Future<String?> _stopRecorderIfStarted() async {\n'
              '    if (!_recorderStarted) return null;\n'
              '    _recorderStarted = false;\n'
              '    return _recorder.stop();\n'
              '  }\n\n',
              'recorder helpers',
          )
          once(
              '  @override\n  void dispose() {\n    _timer?.cancel();\n    _waveformTimer?.cancel();\n    unawaited(_cleanupResources());\n    _processingIsolate?.kill(priority: Isolate.immediate);\n    unawaited(Noiseless.instance.resetRealtime());\n    unawaited(_finishRawSink().catchError((Object _) {}));\n    _isolateReceivePort?.close();\n    _recorder.dispose();\n    super.dispose();\n  }\n',
              '  @override\n  void dispose() {\n    _isDisposed = true;\n    _timer?.cancel();\n    _waveformTimer?.cancel();\n    final starting = _startRecordingFuture;\n    if (starting == null) {\n      unawaited(_disposeRecorderResources());\n    } else {\n      unawaited(starting.whenComplete(_disposeRecorderResources));\n    }\n    super.dispose();\n  }\n',
              'dispose lifecycle',
          )
          once(
              '  Future<void> _startRecording() async {\n    try {\n      final dir = await getTemporaryDirectory();\n',
              '  Future<void> _startRecording() async {\n    if (_isDisposed) return;\n    try {\n      final dir = await getTemporaryDirectory();\n      if (_isDisposed || !mounted) return;\n',
              'start guard',
          )
          once(
              '            if (message is SendPort) {\n              handshakeCompleter.complete(message);\n',
              '            if (message is SendPort) {\n              if (!handshakeCompleter.isCompleted) {\n                handshakeCompleter.complete(message);\n              }\n',
              'handshake guard',
          )
          once(
              '          _isolateSendPort = await handshakeCompleter.future.timeout(\n            const Duration(seconds: 10),\n          );\n\n          final stream = await _recorder.startStream(',
              '          _isolateSendPort = await handshakeCompleter.future.timeout(\n            const Duration(seconds: 10),\n          );\n          if (_isDisposed || !mounted) return;\n\n          final stream = await _recorder.startStream(',
              'post handshake guard',
          )

          # Every recorder configuration should avoid automatic SCO management.
          count = s.count('              numChannels: 1,\n')
          if count != 3:
              raise SystemExit(f'RecordConfig numChannels: expected 3, found {count}')
          s = s.replace(
              '              numChannels: 1,\n',
              '              numChannels: 1,\n              androidConfig: _androidRecordConfig,\n',
          )
          once(
              '          );\n\n          // Forward every PCM chunk to the isolate',
              '          );\n          _recorderStarted = true;\n\n          // Forward every PCM chunk to the isolate',
              'stream started flag',
          )

          # Guard the plain-WAV fallback if disposal happened while stream setup
          # was in flight, and mark successful starts before any later stop path.
          once(
              '          _isCleanWhileRecording = false;\n\n          // Fallback: plain WAV recording\n',
              '          _isCleanWhileRecording = false;\n          if (_isDisposed || !mounted) return;\n\n          // Fallback: plain WAV recording\n',
              'fallback disposal guard',
          )
          # Two file-path recorder starts (fallback and normal path).
          marker = '            path: filePath,\n          );'
          if s.count(marker) != 1:
              raise SystemExit(f'fallback recorder marker count={s.count(marker)}')
          s = s.replace(marker, marker + '\n          _recorderStarted = true;', 1)
          marker2 = '          path: filePath,\n        );'
          if s.count(marker2) != 1:
              raise SystemExit(f'normal recorder marker count={s.count(marker2)}')
          s = s.replace(marker2, marker2 + '\n        _recorderStarted = true;', 1)
          once(
              '      if (!mounted) return;\n      setState(() => _isRecording = true);',
              '      if (_isDisposed || !mounted) return;\n      setState(() => _isRecording = true);',
              'final start guard',
          )
          once(
              '  Future<void> _togglePause() async {\n    if (_isPaused) {',
              '  Future<void> _togglePause() async {\n    if (!_recorderStarted) return;\n    if (_isPaused) {',
              'pause guard',
          )

          # Serialize every native stop against the recorder-start flag.
          s = s.replace('await _recorder.stop();', 'await _stopRecorderIfStarted();')
          s = s.replace('outPath = await _recorder.stop();', 'outPath = await _stopRecorderIfStarted();')

          start = s.index('  Future<void> _cancelRecording() async {')
          end = s.index('  Future<void> _deleteTempFiles() async {', start)
          cancel = '''  Future<void> _cancelRecording() async {
    if (_isCancelling) return;
    _isCancelling = true;
    try {
      _timer?.cancel();
      _waveformTimer?.cancel();

      final starting = _startRecordingFuture;
      if (starting != null) await starting;
      if (_isDisposed) return;

      if (_isCleanWhileRecording) {
        await _stopRecorderIfStarted();
        await _recordStreamSub?.cancel();
        _recordStreamSub = null;
        await _finishRawSink();

        if (_isolateSendPort != null) {
          final responsePort = ReceivePort();
          try {
            _isolateSendPort!.send({
              'cmd': 'close',
              'replyPort': responsePort.sendPort,
            });
            await responsePort.first.timeout(const Duration(seconds: 5));
          } catch (_) {
            // Cancellation discards output, but native state is reset below.
          } finally {
            responsePort.close();
          }
        }
        _processingIsolate?.kill(priority: Isolate.immediate);
        _processingIsolate = null;
        _isolateReceivePort?.close();
        _isolateReceivePort = null;
        _isolateSendPort = null;
        await Noiseless.instance.resetRealtime();
        await _deleteTempFiles();
      } else {
        await _stopRecorderIfStarted();
      }

      if (mounted) Navigator.pop(context);
    } finally {
      _isCancelling = false;
    }
  }

'''
          s = s[:start] + cancel + s[end:]

          once(
              '                              if (_isRequestingPermission) return;\n',
              '                              if (_isRequestingPermission ||\n                                  _startRecordingFuture != null) {\n                                return;\n                              }\n',
              'duplicate start UI guard',
          )
          s = s.replace('await _startRecording();', 'await _beginRecording();')

          p.write_text(s)
          PY

          flutter pub get
          flutter gen-l10n
          dart format \
            lib/screens/audio_recording_screen.dart \
            lib/services/settings_service.dart \
            lib/utils/ffmpeg_utils.dart
          flutter analyze --no-fatal-infos
          flutter test

      - name: Commit and update PR 127 branch
        working-directory: app
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          git config user.name 'Persie0'
          git config user.email '76871553+Persie0@users.noreply.github.com'
          git add \
            lib/screens/audio_recording_screen.dart \
            lib/services/settings_service.dart \
            lib/utils/ffmpeg_utils.dart
          git commit -m 'Rebase valid Sentry crash fixes onto current master'
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/Persie0/noise_remover.git"
          git push --force-with-lease origin HEAD:agent/fix-current-sentry-aug10
