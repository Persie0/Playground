name: PhotoSphere checkpoint260 original robust ray preparation (one shot)
on:
  push:
    branches: [ci/photosphere-checkpoint260-native-ray-prep]
    paths: ['.github/workflows/photosphere-checkpoint260-original.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint260-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-robust-ray-prep:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'ci: run photosphere checkpoint260 once'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 87fab4c8efdd3102a285a29aacc4ad844e1c0437
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify pinned source and install original native emulator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "87fab4c8efdd3102a285a29aacc4ad844e1c0437"
          python3 -m py_compile research/photosphere/checkpoint260/native_original_robust_ray_vectors.py research/photosphere/checkpoint260/validate_native_ray_vectors.py
          python3 -m pip install --break-system-packages --quiet -r research/photosphere/checkpoint218/requirements.txt
      - name: Extract pinned GCam APK and ARM64 liblightcycle
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Execute original native 0x127bac and capture robust estimator input ABI
        run: |
          set -euo pipefail
          if ! python3 research/photosphere/checkpoint260/native_original_robust_ray_vectors.py > checkpoint260-original.log 2> checkpoint260-original.stderr; then
            tail -n 100 checkpoint260-original.stderr || true
            exit 1
          fi
          python3 research/photosphere/checkpoint260/validate_native_ray_vectors.py checkpoint260-original.log | tee checkpoint260-validation.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=Path('checkpoint260-original.log').read_text()
          d=json.loads(s.split('CHECKPOINT260_NATIVE_ADDIMAGE_FEATURE_BEGIN\n')[1].split('\nCHECKPOINT260_NATIVE_ADDIMAGE_FEATURE_END')[0])
          Path('checkpoint260-original.json').write_text(json.dumps(d,indent=2)+'\n')
          for c in d['cases']:
            n=c['native_second_actual_addimage']
            r=n.get('original_robust_estimator_input_boundary')
            print('CHECKPOINT260_ORIGINAL_RANSAC_INPUTS',c['name'],
                  None if r is None else {k:r[k]['byte_count'] for k in ('first_original_ray_vector','second_original_ray_vector')})
          PY
      - name: Archive full native ray inputs and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint260-original-robust-ray-inputs
          path: |
            checkpoint260-original.log
            checkpoint260-original.stderr
            checkpoint260-original.json
            checkpoint260-validation.txt
          if-no-files-found: warn
          retention-days: 14
