name: Photosphere private formatter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/photosphere-private-format.yml'

permissions:
  contents: read

jobs:
  format-private-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private Photosphere with write token
        uses: actions/checkout@v4
        with:
          repository: Persie0/Photosphere-
          ref: audit/code-hardening-3
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true
      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Format Dart sources
        run: |
          dart format lib test tool
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test tool
          git commit -m 'Format audited Dart sources'
          git push origin HEAD:audit/code-hardening-3
