name: ToiletCompass keyboard focus regression
# Regression run after keeping the search field outside lazy scrolling lists
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toiletcompass-keyboard-focus-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/toiletcompass
          ref: fix/region-search-keyboard-dismissal
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Format touched Dart sources
        working-directory: app
        run: dart format lib/onboarding_screen.dart lib/database_region_selector.dart test/onboarding_keyboard_focus_test.dart
      - name: Analyze Flutter
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run keyboard-focused widget test
        working-directory: app
        run: flutter test test/onboarding_keyboard_focus_test.dart
      - name: Run full Flutter regression suite
        working-directory: app
        run: flutter test
