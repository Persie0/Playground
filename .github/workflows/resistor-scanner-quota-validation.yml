name: Resistor Scanner quota validation

on:
  push:
    paths:
      - ".github/workflows/resistor-scanner-quota-validation.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/resistor-scanner-android
          ref: feat/expand-free-scan-limits
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build and test Android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace

  ios:
    runs-on: macos-15
    steps:
      - name: Checkout iOS branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/resistor-scanner-ios
          ref: feat/expand-free-scan-limits
          submodules: recursive
      - name: Swift package tests
        run: swift test
      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project ResistorScanner.xcodeproj -scheme ResistorScanner
      - name: Build iOS simulator app
        run: xcodebuild -project ResistorScanner.xcodeproj -scheme ResistorScanner -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
