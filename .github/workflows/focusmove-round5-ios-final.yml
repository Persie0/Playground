name: FocusMove round 5 final merged iOS simulator validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/focusmove-round5-ios-final.yml']
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout merged FocusMove main privately on runner
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=main https://github.com/Persie0/pomodoroexercise.git source
          test "$(git -C source rev-parse HEAD)" = 4f7fb62793d001be996f3b86486dee3edac47ad7
      - name: Compile unsigned iOS simulator without GNU timeout dependency
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter build ios --simulator --no-codesign
          test -d build/ios/iphonesimulator/Runner.app
