name: Uniminder WebView beta AGP9 release check
on:
  push:
    paths:
      - '.github/workflows/uniminder-webview-beta3-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout private Uniminder beta branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/student
          ref: feat/inappwebview-beta3-remove-agp9-workaround-20261021
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: true
          path: uniminder
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve new WebView versions
        working-directory: uniminder
        run: |
          flutter pub get
          grep -A5 '^  flutter_inappwebview:' pubspec.lock
          grep -A5 '^  flutter_inappwebview_android:' pubspec.lock
      - name: Verify optimized ProGuard is built into upstream beta
        shell: bash
        working-directory: uniminder
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          lock = Path('pubspec.lock').read_text()
          assert re.search(r'flutter_inappwebview_android:.*?version: "1.2.0-beta.3"', lock, re.S), 'WebView Android beta not resolved'
          cache = Path(os.environ['PUB_CACHE'])
          matches = list(cache.glob('hosted/*/flutter_inappwebview_android-1.2.0-beta.3/android/build.gradle'))
          assert len(matches)==1, f'Unexpected plugin paths: {matches}'
          content = matches[0].read_text()
          assert "getDefaultProguardFile('proguard-android.txt')" not in content
          assert "getDefaultProguardFile('proguard-android-optimize.txt')" in content
          assert 'android.r8.proguardAndroidTxt.disallowed=false' not in Path('android/gradle.properties').read_text()
          print('Verified AGP 9-compatible plugin without workarounds.')
          PY
      - name: Flutter static analysis
        working-directory: uniminder
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Flutter tests
        working-directory: uniminder
        run: flutter test --no-pub
      - name: Create throwaway CI release signing key
        working-directory: uniminder
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -noprompt -storetype JKS -keystore android/app/key.jks \
            -storepass ci-temporary-store -keypass ci-temporary-store \
            -alias key -keyalg RSA -keysize 2048 -validity 1 \
            -dname 'CN=Temporary CI, OU=Test, O=Test, L=Test, S=Test, C=AT'
          printf 'storePassword=ci-temporary-store\nkeyPassword=ci-temporary-store\nkeyAlias=key\nstoreFile=./key.jks\n' > android/key.properties
      - name: Compile R8 optimized release app bundle
        working-directory: uniminder
        run: flutter build appbundle --release --no-pub --build-number=999999
      - name: Commit resolved pubspec lockfile to PR branch
        working-directory: uniminder
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- pubspec.lock; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add pubspec.lock
            git commit -m 'build: lock AGP9-compatible WebView beta dependencies'
            git push origin HEAD:feat/inappwebview-beta3-remove-agp9-workaround-20261021
          else
            echo 'pubspec.lock already matches beta dependencies.'
          fi
