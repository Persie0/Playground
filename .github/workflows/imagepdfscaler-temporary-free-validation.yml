name: ImagePdfScaler temporary free release validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/imagepdfscaler-temporary-free-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate private checkout token
        env:
          APP_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$APP_TOKEN"
      - uses: actions/checkout@v4
        with:
          repository: Persie0/ImagePdfScaler
          ref: chore/temporarily-disable-iap-paywalls
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze all Dart code
        working-directory: app
        run: flutter analyze --no-pub
      - name: Validate no billing calls or paywall
        working-directory: app
        run: flutter test --no-pub --reporter expanded test/billing_disabled_test.dart test/editor_page_logic_test.dart
      - name: Run full Flutter test suite
        working-directory: app
        run: flutter test --no-pub
      - name: Install required Android NDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail
          "$SDKMANAGER" --install "ndk;29.0.13599879"
      - name: Build Android debug APK
        working-directory: app
        run: flutter build apk --debug --no-pub
