name: Image Enhancer layout test
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/image-enhancer-layout-test.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout committed image enhancer branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/image_enhancer
          ref: ui/keep-model-progress-visible
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Verify focused layout regression
        run: flutter test test/home_layout_test.dart
      - name: Verify full test suite
        run: flutter test
