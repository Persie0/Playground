name: Ultrasonic Rev A checks
on:
  push:
    branches: [ultrasonic-rev-a-validation]
    paths: ['.github/workflows/ultrasonic-rev-a-validation.yml']
permissions:
  contents: read
jobs:
  eda:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/Ultrasonic
          ref: ab4349aae88deb8254243c29ea5180e5e021325d
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          persist-credentials: false
      - run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints
          mkdir -p reports "$HOME/.config/kicad/9.0"
          sed "s|\${KIPRJMOD}|$PWD/hardware|g" hardware/sym-lib-table > "$HOME/.config/kicad/9.0/sym-lib-table"
          sed "s|\${KIPRJMOD}|$PWD/hardware|g" hardware/fp-lib-table > "$HOME/.config/kicad/9.0/fp-lib-table"
          kicad-cli version
          kicad-cli sch erc --exit-code-violations -o reports/erc.txt hardware/ultrasonic.kicad_sch
        id: erc
        continue-on-error: true
      - run: |
          kicad-cli pcb drc --exit-code-violations -o reports/drc.txt hardware/ultrasonic.kicad_pcb
        id: drc
        continue-on-error: true
      - run: |
          for f in reports/*.txt; do echo "=== $f ==="; cat "$f"; done
          test -s reports/erc.txt && test -s reports/drc.txt
          test '${{ steps.erc.outcome }}' = success && test '${{ steps.drc.outcome }}' = success
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eda-reports
          path: reports/
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/Ultrasonic
          ref: ab4349aae88deb8254243c29ea5180e5e021325d
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          persist-credentials: false
      - run: |
          docker run --rm -v "$PWD:/project" -w /project/firmware espressif/idf:v5.4.2 idf.py build
  simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/Ultrasonic
          ref: ab4349aae88deb8254243c29ea5180e5e021325d
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          persist-credentials: false
      - run: python3 simulation/rc_sweep.py
