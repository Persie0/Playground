name: Ultrasonic multi-design checks
on:
  push:
    branches: [ultrasonic-rev-a-validation]
    paths: ['.github/workflows/ultrasonic-rev-a-validation.yml']
permissions:
  contents: read
jobs:
  eda:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/Ultrasonic
          ref: e3e46937227e10eec7d55b05a6c3ea09260d0d4c
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          persist-credentials: false
      - run: |
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints
          kicad-cli version
      - name: Validate three separate projects
        run: |
          mkdir -p reports "$HOME/.config/kicad/9.0"
          result=0
          for spec in 'designs/esp32-digital/hardware ultrasonic' 'designs/analog-dds/hardware analog-dds' 'designs/analog-dds/reference-pwm reference-pwm'; do
            read -r folder name <<< "$spec"
            sed "s|\${KIPRJMOD}|$PWD/$folder|g" "$folder/sym-lib-table" > "$HOME/.config/kicad/9.0/sym-lib-table"
            sed "s|\${KIPRJMOD}|$PWD/$folder|g" "$folder/fp-lib-table" > "$HOME/.config/kicad/9.0/fp-lib-table"
            kicad-cli sch erc --exit-code-violations -o "reports/$name-erc.txt" "$folder/$name.kicad_sch" || result=1
            kicad-cli pcb drc --exit-code-violations -o "reports/$name-drc.txt" "$folder/$name.kicad_pcb" || result=1
          done
          for f in reports/*.txt; do echo "=== $f ==="; cat "$f"; done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eda-reports
          path: reports/
  digital:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/Ultrasonic
          ref: e3e46937227e10eec7d55b05a6c3ea09260d0d4c
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          persist-credentials: false
      - run: python3 designs/esp32-digital/simulation/rc_sweep.py
      - run: docker run --rm -v "$PWD:/project" -w /project/designs/esp32-digital/firmware espressif/idf:v5.4.2 idf.py build
  nano:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/Ultrasonic
          ref: e3e46937227e10eec7d55b05a6c3ea09260d0d4c
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli compile --fqbn arduino:avr:nano designs/analog-dds/firmware/dds_setup
          mkdir -p "$HOME/Arduino/libraries"
          git clone --depth 1 https://github.com/TheSpaceEgg/SimpleAD9833.git "$HOME/Arduino/libraries/SimpleAD9833"
          arduino-cli compile --fqbn arduino:avr:nano --libraries "$HOME/Arduino/libraries" designs/analog-dds/firmware/simplead9833_setup
          arduino-cli compile --fqbn arduino:avr:nano --libraries "$HOME/Arduino/libraries" designs/analog-dds/original-files/AD9833
