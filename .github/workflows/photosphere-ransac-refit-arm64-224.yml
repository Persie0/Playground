name: Photo Sphere checkpoint 224 original ARM64 refit disassembly
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-ransac-refit-arm64-224.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install ARM64 disassembler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-aarch64-linux-gnu >/dev/null
      - name: Fetch verified original Google Camera APK
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so' | sha256sum -c -
      - name: Recover original complete refitter and SVD dispatch
        run: |
          set -euo pipefail
          aarch64-linux-gnu-objdump -d --start-address=0x30f588 --stop-address=0x30f860 liblightcycle.so > refit-assembly.txt
          test -s refit-assembly.txt
          cat refit-assembly.txt
      - uses: actions/upload-artifact@v4
        with:
          name: checkpoint224-original-refit-assembly
          path: refit-assembly.txt
          retention-days: 3
