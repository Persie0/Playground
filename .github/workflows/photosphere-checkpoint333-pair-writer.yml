name: Photosphere checkpoint333 original pair record writer tracing
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint333-pair-writer.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint333-pair-writer
  cancel-in-progress: false
jobs:
  source-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout pinned private research read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 2221aaf62abdd3ad626edc9d9c690d3c323f6c0a
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify pinned source and install decoder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2221aaf62abdd3ad626edc9d9c690d3c323f6c0a"
          python3 -m pip install --quiet --break-system-packages capstone unicorn pyelftools
      - name: Retrieve checksum verified original
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Trace original pair status writer ancestry
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint333/trace_pair_record_writer.py original.so --output checkpoint333-owners.json | tee checkpoint333-owners.log
          grep -q '^CHECKPOINT333_STATIC_OWNER_SCAN_PASS 8' checkpoint333-owners.log
      - name: Inspect candidate original pair-record creator and model virtual slots
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint333/scan_original_pair_writer_candidate.py original.so --output checkpoint333-candidate.json | tee checkpoint333-candidate.log
          grep -q '^CHECKPOINT333_CANDIDATE_SCAN_PASS' checkpoint333-candidate.log
      - name: Execute the original ARM64 pair status 6 writer with full fields
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint333/native_original_graph_status_writer.py original.so --output checkpoint333-native-graph-status.json | tee checkpoint333-native-graph-status.log
          grep -q '^CHECKPOINT333_ORIGINAL_GRAPH_STATUS_PASS 19 15' checkpoint333-native-graph-status.log
      - name: Upload code-derived report not original executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-checkpoint333-original-owners
          path: |
            checkpoint333-owners.json
            checkpoint333-owners.log
            checkpoint333-candidate.json
            checkpoint333-candidate.log
            checkpoint333-native-graph-status.json
            checkpoint333-native-graph-status.log
          retention-days: 7
          if-no-files-found: warn
