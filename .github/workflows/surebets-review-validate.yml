name: Validate Surebets PR review

on:
  push:
    paths:
      - '.github/workflows/surebets-review-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate private repository token
        env:
          REPO_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$REPO_TOKEN"

      - name: Checkout Surebets PR 13 branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/surebets_calculator
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: fix/revenuecat-hardening
          fetch-depth: 1
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply reviewed fixes
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/services/subscription_service.dart')
          lines = path.read_text().splitlines()

          install = next(i for i, line in enumerate(lines) if line.strip() == '_installLifecycleRefresh();')
          try_index = next(i for i in range(install - 1, -1, -1) if lines[i].strip() == 'try {')
          install_line = lines.pop(install)
          lines.insert(try_index, install_line)
          lines.insert(try_index + 1, '')

          launched = next(i for i, line in enumerate(lines) if line.strip().startswith("if (!launched) throw StateError("))
          indent = lines[launched][:len(lines[launched]) - len(lines[launched].lstrip())]
          message = lines[launched].strip()[len('if (!launched) '):]
          lines[launched:launched + 1] = [
              f'{indent}if (!launched) {{',
              f'{indent}  {message}',
              f'{indent}}}',
          ]

          path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Format and diff check
        working-directory: app
        run: |
          dart format lib/services/subscription_service.dart
          git diff --check

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: app
        run: flutter test

      - name: Commit and push reviewed fixes
        if: success()
        working-directory: app
        env:
          REPO_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if git diff --quiet; then
            echo 'No changes to push'
            exit 0
          fi
          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/subscription_service.dart
          git commit -m 'fix: harden RevenueCat lifecycle refresh [skip ci]'
          git remote set-url origin "https://x-access-token:${REPO_TOKEN}@github.com/Persie0/surebets_calculator.git"
          git push origin HEAD:fix/revenuecat-hardening
