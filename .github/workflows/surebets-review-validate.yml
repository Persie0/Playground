name: Validate Surebets PR review

on:
  push:
    paths:
      - '.github/workflows/surebets-review-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate private repository token
        env:
          REPO_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$REPO_TOKEN"

      - name: Checkout Surebets PR 13 branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/surebets_calculator
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: fix/revenuecat-hardening
          fetch-depth: 1
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply reviewed compile fix
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/settings_page.dart')
          lines = path.read_text().splitlines()
          replaced = False
          for i in range(len(lines) - 1):
              if (
                  lines[i].strip() == 'SettingsProvider.setBoughtProStatic();'
                  and lines[i + 1].strip() == 'SubscriptionService.instance.syncFromLegacy(true);'
              ):
                  indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
                  lines[i:i + 2] = [
                      f'{indent}unawaited(',
                      f'{indent}  SubscriptionService.instance.setPro(',
                      f'{indent}    true,',
                      f'{indent}    isLifetime: true,',
                      f'{indent}  ),',
                      f'{indent});',
                  ]
                  replaced = True
                  break
          if not replaced:
              raise SystemExit('Expected tester Pro legacy block not found')
          path.write_text('\n'.join(lines) + '\n')
          PY
          dart format lib/settings_page.dart
          git diff --check

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: app
        run: flutter test

      - name: Commit and push reviewed fix
        if: success()
        working-directory: app
        env:
          REPO_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if git diff --quiet; then
            echo 'No changes to push'
            exit 0
          fi
          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/settings_page.dart
          git commit -m 'fix: keep tester Pro override after RevenueCat hardening [skip ci]'
          git remote set-url origin "https://x-access-token:${REPO_TOKEN}@github.com/Persie0/surebets_calculator.git"
          git push origin HEAD:fix/revenuecat-hardening
