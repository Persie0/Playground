name: HanziHero native UX screenshots

on:
  push:
    branches:
      - impeccable/hanzihero-ui-ci-20261122
    paths:
      - .github/workflows/hanzihero-ux-native-snapshots-20261123.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-native-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Checkout private HanziHero UX branch
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=impeccable/hanzihero-ux-40-20261122 https://github.com/Persie0/hanzi_hero.git app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare screenshot-only Android build configuration
        shell: bash
        run: |
          # The runner cannot obtain platform android-37. Use stable API 36
          # only in this disposable CI checkout; production sources remain unchanged.
          sed -i 's/compileSdk = 37/compileSdk = 36/' app/android/app/build.gradle.kts
          sed -i 's/targetSdk = 37/targetSdk = 36/' app/android/app/build.gradle.kts
          sed -i 's/ndkVersion = "29.0.14206865"/ndkVersion = flutter.ndkVersion/' app/android/app/build.gradle.kts
          # Screenshot-only dependency substitution: API 37 is not offered
          # by this public runner's SDK manager. Never commit this override.
          printf 'dependency_overrides:\n  permission_handler_android: 13.0.1\n' > app/pubspec_overrides.yaml
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /tmp/sdk-install.log 2>&1 || { tail -n 60 /tmp/sdk-install.log; exit 1; }

      - name: Build native Android debug APK
        working-directory: app
        shell: bash
        run: |
          flutter pub get
          flutter build apk --debug > /tmp/build-apk.log 2>&1 || { tail -n 110 /tmp/build-apk.log; exit 1; }

      - name: Enable hardware acceleration
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Capture native onboarding on an AOSP emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: Nexus 5X
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            set -euo pipefail
            APP=at.persie0.hanziHero
            mkdir -p ux-screenshots
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            adb shell input keyevent 82 || true
            adb install -r app/build/app/outputs/flutter-apk/app-debug.apk
            sleep 20
            adb shell am start -n "$APP/.MainActivity"
            sleep 14

            get_hierarchy() {
              adb shell uiautomator dump /sdcard/ux-hierarchy.xml >/dev/null 2>&1 || true
              adb shell cat /sdcard/ux-hierarchy.xml > /tmp/ux-hierarchy.xml 2>/dev/null || true
            }

            tap_by_label() {
              get_hierarchy
              local bounds
              bounds="$(python3 - "$1" <<'PY'
            import re
            import sys
            import xml.etree.ElementTree as ET
            try:
                root = ET.parse('/tmp/ux-hierarchy.xml').getroot()
                for element in root.iter():
                    attrs = element.attrib
                    label = (attrs.get('text', '') + ' ' + attrs.get('content-desc', '')).lower()
                    if sys.argv[1].lower() in label:
                        coords = list(map(int, re.findall(r'\d+', attrs.get('bounds', ''))))
                        if len(coords) == 4:
                            print((coords[0] + coords[2]) // 2, (coords[1] + coords[3]) // 2)
                            sys.exit(0)
            except Exception:
                pass
            sys.exit(1)
            PY
              )" || return 1
              adb shell input tap $bounds
            }

            clear_system_dialog() {
              get_hierarchy
              if grep -Eiq "isn.t responding|not responding" /tmp/ux-hierarchy.xml; then
                echo "System ANR detected; closing the unresponsive launcher"
                tap_by_label "Close app" || adb shell input keyevent 4 || true
                sleep 5
                adb shell am start -n "$APP/.MainActivity"
                sleep 8
                get_hierarchy
              fi
            }

            capture() {
              local name="$1"
              clear_system_dialog
              get_hierarchy
              cp /tmp/ux-hierarchy.xml "ux-screenshots/$name.xml" || true
              adb exec-out screencap -p > "ux-screenshots/$name.png"
              adb shell dumpsys window | grep -E 'mCurrentFocus|mFocusedApp' | head -n 4 || true
            }

            capture android-phone-light
            if tap_by_label "Get Started"; then
              sleep 5
              capture android-script-selection-light
            fi
            adb shell settings put system font_scale 1.3
            adb shell am force-stop "$APP"
            adb shell am start -n "$APP/.MainActivity"
            sleep 8
            capture android-phone-large-text
            adb shell cmd uimode night yes
            adb shell am force-stop "$APP"
            adb shell am start -n "$APP/.MainActivity"
            sleep 8
            capture android-phone-dark-large-text
            adb shell settings put system font_scale 1.0
            adb shell wm size 1200x1920
            adb shell wm density 200
            adb shell am force-stop "$APP"
            adb shell am start -n "$APP/.MainActivity"
            sleep 8
            capture android-tablet-size-dark
            adb shell cmd uimode night no
            adb shell settings put system font_scale 1.0
            adb shell wm size reset
            adb shell wm density reset

      - name: Upload native screen captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hanzihero-native-ux-android
          path: ux-screenshots/
          if-no-files-found: warn
          retention-days: 7
