name: Noise Remover PR196 current-head verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noise-remover-pr196-current-head.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact private head
        uses: actions/checkout@v5
        with:
          repository: Persie0/noise_remover
          ref: 715d2393aee152b8e5770111cabb7a9f2ff28e14
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          fetch-depth: 0
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Full Flutter tests
        working-directory: app
        run: flutter test --concurrency=1 --timeout 2m --reporter expanded

      - name: Analyzer
        if: always()
        working-directory: app
        run: flutter analyze

