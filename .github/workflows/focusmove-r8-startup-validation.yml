name: FocusMove R8 startup regression validation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/focusmove-r8-startup-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focusmove-r8-startup-validation
  cancel-in-progress: false
jobs:
  android-release-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private FocusMove fix only on ephemeral runner
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          EXPECTED_SHA: 925e06f7b32fd467ff1c5b92a9ad802dbbfbcfd8
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Private checkout token missing'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=fix/workmanager-room-r8-startup https://github.com/Persie0/pomodoroexercise.git source
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Analyze and test
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test --reporter expanded
      - name: Compile minified release APK
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          flutter build apk --release
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.persie.pomodoroexercise.ci'"
          echo "Release APK sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch release APK to verify WorkManager startup on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          arch: x86_64
          target: google_apis
          profile: pixel_3a
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            set -euo pipefail
            adb install -r source/build/app/outputs/flutter-apk/app-release.apk
            adb logcat -c
            adb shell am start -n com.persie.pomodoroexercise.ci/com.persie.pomodoroexercise.MainActivity
            sleep 12
            adb logcat -d -v brief > "$RUNNER_TEMP/focusmove-startup-log.txt"
            if grep -E 'Failed to create an instance of androidx.work.impl.WorkDatabase|Unable to get provider androidx.startup.InitializationProvider' "$RUNNER_TEMP/focusmove-startup-log.txt"; then
              echo 'FATAL: WorkManager startup regression reproduced'
              exit 1
            fi
            PID="$(adb shell pidof com.persie.pomodoroexercise.ci | tr -d '\r')"
            test -n "$PID" || {
              echo 'FocusMove process died after release startup'
              grep -A 28 -B 2 'FATAL EXCEPTION' "$RUNNER_TEMP/focusmove-startup-log.txt" | tail -n 100 || true
              exit 1
            }
            echo "Android release startup successful (PID $PID)"
