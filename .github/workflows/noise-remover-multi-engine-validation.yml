name: Noise Remover alternative denoisers validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noise-remover-multi-engine-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-and-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private Noise Remover feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/noise_remover
          ref: feature/multi-engine-speech-denoising
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: true
          path: app
      - name: Configure Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Format new files before analysis
        working-directory: app
        run: |
          dart format lib/services/noise_model_catalog.dart lib/services/native_neural_denoiser.dart lib/services/alternative_noise_processor.dart test/services/noise_model_catalog_test.dart
          git diff --stat
      - name: Analyzer on alternative model integration
        working-directory: app
        run: flutter analyze --no-pub --no-fatal-infos lib/services/noise_model_catalog.dart lib/services/native_neural_denoiser.dart lib/services/alternative_noise_processor.dart lib/services/model_download_service.dart lib/screens/processing_settings_page.dart lib/widgets/model_option_widget.dart lib/screens/home_screen.dart lib/screens/bulk_processing_screen.dart lib/services/background_processing_core.dart lib/services/android_long_foreground_worker.dart lib/services/android_bulk_foreground_worker.dart lib/services/long_file_job_service.dart
      - name: Model catalog and integrity tests
        working-directory: app
        run: flutter test --no-pub test/services/noise_model_catalog_test.dart
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Format Rust ONNX engines
        working-directory: app/flutter_nnnoiseless/rust
        run: rustfmt --edition 2021 src/api/alternate.rs
      - name: Rust cargo check (safe streaming ONNX Level1 sessions)
        working-directory: app/flutter_nnnoiseless/rust
        run: cargo check --lib && cargo test --lib ulunas_tests --locked
      - name: Assert only one neural runtime and no DeepFilterNet3
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'deepfilternet3|flutter_litert|ulunas_denoiser' lib --include='*.dart'; then
            echo 'Stale Flutter model references' >&2
            exit 1
          fi
          if grep -qE '^name = "(deep_filter|tract-core|tract-onnx)"' flutter_nnnoiseless/rust/Cargo.lock; then
            echo 'Tract/DeepFilterNet dependency remains in Cargo lockfile' >&2
            exit 1
          fi
          if grep -R -F 'Session::builder()' flutter_nnnoiseless/rust/src/api; then
            echo 'Legacy implicit ORT environment remains' >&2
            exit 1
          fi
          if grep -q '^  flutter_litert:' pubspec.lock; then
            echo 'LiteRT dependency still in Flutter lockfile' >&2
            exit 1
          fi
      - name: Save generated lockfiles to the private feature branch
        if: success()
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Playground CI'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add pubspec.lock flutter_nnnoiseless/rust/Cargo.lock flutter_nnnoiseless/rust/src/api/alternate.rs lib/services/noise_model_catalog.dart lib/services/native_neural_denoiser.dart lib/services/alternative_noise_processor.dart test/services/noise_model_catalog_test.dart
          if git diff --cached --quiet; then
            echo "Lockfiles already current."
          else
            git commit -m 'chore: lock and format compact ONNX runtime'
            git push origin HEAD:feature/multi-engine-speech-denoising
          fi
      - name: Report generated dependency manifest
        if: always()
        working-directory: app
        run: git status --short | head -100
