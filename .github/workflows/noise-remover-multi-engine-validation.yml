name: Noise Remover alternative denoisers validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noise-remover-multi-engine-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-and-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private Noise Remover feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/noise_remover
          ref: feature/multi-engine-speech-denoising
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - name: Configure Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Format new files before analysis
        working-directory: app
        run: |
          dart format lib/services/noise_model_catalog.dart lib/services/native_neural_denoiser.dart lib/services/ulunas_denoiser.dart lib/services/alternative_noise_processor.dart test/services/noise_model_catalog_test.dart
          git diff --stat
      - name: Analyzer on alternative model integration
        working-directory: app
        run: flutter analyze --no-pub lib/services/noise_model_catalog.dart lib/services/native_neural_denoiser.dart lib/services/ulunas_denoiser.dart lib/services/alternative_noise_processor.dart lib/services/model_download_service.dart lib/screens/processing_settings_page.dart lib/widgets/model_option_widget.dart lib/screens/home_screen.dart lib/screens/bulk_processing_screen.dart lib/services/background_processing_core.dart lib/services/android_long_foreground_worker.dart lib/services/android_bulk_foreground_worker.dart lib/services/long_file_job_service.dart
      - name: Model catalog and integrity tests
        working-directory: app
        run: flutter test --no-pub test/services/noise_model_catalog_test.dart
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cargo check (native model engines, second validation)
        working-directory: app/flutter_nnnoiseless/rust
        run: cargo check --lib
      - name: Report generated dependency manifest
        if: always()
        working-directory: app
        run: git status --short | head -100
