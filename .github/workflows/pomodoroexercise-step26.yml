name: FocusMove Step 26 store-readiness validation
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/pomodoroexercise-step26.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: focusmove-step26-store-validation
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private PR branch into ephemeral workspace only
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Missing private checkout credential'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/26-store-readiness https://github.com/Persie0/pomodoroexercise.git source
      - name: Analyze source and run platform asset / unit tests
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test --reporter expanded
      - name: Compile Android debug and CI-only release APKs
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          flutter build apk --debug
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-debug.apk
          test -s build/app/outputs/flutter-apk/app-release.apk
      - name: Audit merged release manifest, package ID and privacy flags
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.persie.pomodoroexercise.ci'"
          "$AAPT" dump permissions "$APK" | tee "$RUNNER_TEMP/permissions.txt"
          if grep -E 'android.permission.(INTERNET|RECORD_AUDIO|ACCESS_(FINE|COARSE|BACKGROUND)_LOCATION|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|FOREGROUND_SERVICE)' "$RUNNER_TEMP/permissions.txt"; then
            echo 'Unexpected permission in compiled CI release'
            exit 1
          fi
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          grep -q 'android:allowBackup' "$RUNNER_TEMP/manifest.txt"
          grep -q 'android:dataExtractionRules' "$RUNNER_TEMP/manifest.txt"
      - name: Verify production AAB fails closed without upload key
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          if flutter build appbundle --release > "$RUNNER_TEMP/aab-check.txt" 2>&1; then
            echo 'Unsigned/debug-signed production AAB was unexpectedly allowed'
            exit 1
          fi
          if ! grep -Fq 'Production AAB requires all FOCUSMOVE_' "$RUNNER_TEMP/aab-check.txt"; then
            tail -n 40 "$RUNNER_TEMP/aab-check.txt"
            echo 'AAB failed for an unexpected reason'
            exit 1
          fi
  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private PR branch into ephemeral workspace only
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Missing private checkout credential'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/26-store-readiness https://github.com/Persie0/pomodoroexercise.git source
      - name: Build unsigned iOS simulator with branded assets
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          flutter pub get
          flutter build ios --simulator --no-codesign
          APP=build/ios/iphonesimulator/Runner.app
          test -d "$APP"
          for name in MLKitPoseDetectionFastResources MLKitPoseDetectionCommonResources MLKitXenoResources; do
            test -d "$APP/$name.bundle" || { echo "Missing ML Kit resources: $name"; exit 1; }
          done
