name: Surebets RevenueCat lifecycle fix

on:
  push:
    paths:
      - '.github/workflows/surebets-lifecycle-order-review.yml'

permissions:
  contents: read

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate private repository token
        env:
          REPO_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$REPO_TOKEN"

      - name: Checkout Surebets PR 13 branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/surebets_calculator
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          ref: fix/revenuecat-hardening
          fetch-depth: 1
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply reviewed fixes
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/services/subscription_service.dart')
          lines = path.read_text().splitlines()
          lifecycle_fixed = False
          lint_fixed = False
          for i in range(len(lines) - 2):
              if (
                  lines[i].strip() == 'try {'
                  and lines[i + 1].strip() == 'await _updateProStatus(await Purchases.getCustomerInfo());'
                  and lines[i + 2].strip() == '_installLifecycleRefresh();'
              ):
                  indent = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
                  lines[i:i + 3] = [
                      f'{indent}_installLifecycleRefresh();',
                      '',
                      f'{indent}try {{',
                      f'{indent}  await _updateProStatus(await Purchases.getCustomerInfo());',
                  ]
                  lifecycle_fixed = True
                  break
          for i, line in enumerate(lines):
              if line.strip() == "if (!launched) throw StateError('Could not open subscription management.');":
                  indent = line[:len(line) - len(line.lstrip())]
                  lines[i:i + 1] = [
                      f'{indent}if (!launched) {{',
                      f"{indent}  throw StateError('Could not open subscription management.');",
                      f'{indent}}}',
                  ]
                  lint_fixed = True
                  break
          if not lifecycle_fixed:
              raise SystemExit('Expected lifecycle block not found')
          if not lint_fixed:
              raise SystemExit('Expected subscription-management lint line not found')
          path.write_text('\n'.join(lines) + '\n')
          PY
          dart format lib/services/subscription_service.dart
          git diff --check

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: app
        run: flutter test

      - name: Commit and push reviewed fixes
        if: success()
        working-directory: app
        env:
          REPO_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if git diff --quiet; then
            echo 'No changes to push'
            exit 0
          fi
          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/services/subscription_service.dart
          git commit -m 'fix: harden RevenueCat resume refresh path [skip ci]'
          git remote set-url origin "https://x-access-token:${REPO_TOKEN}@github.com/Persie0/surebets_calculator.git"
          git push origin HEAD:fix/revenuecat-hardening
