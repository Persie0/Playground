name: Toothfairy development build preflight
on:
  push:
    branches: [toothfairy-private-validation]
    paths: ['.github/workflows/toothfairy-build-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch pinned private source
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feature/01-mobile-foundation https://github.com/Persie0/Toothfairy.git source
          test "$(git -C source rev-parse HEAD)" = 9e1e5d3ab46fc18336163f90bfe685c82843571f
      - name: Check build tooling and assets
        run: |
          set -euo pipefail
          cd source
          bash -n tools/unity_development.sh
          python -m unittest discover -s tools -p test_build_results.py >/tmp/tf-build-parser.log 2>&1
          python tools/validate_generated.py >/tmp/tf-build-assets.log 2>&1
          echo "Build-result parser and existing asset checks passed."
      - name: Compile Android native bridge sources against Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          JAR="$(find "$SDK/platforms" -name android.jar | sort -V | tail -1)"
          test -f "$JAR"
          mkdir -p /tmp/tf-java/com/unity3d/player /tmp/tf-java-classes
          cat > /tmp/tf-java/com/unity3d/player/UnityPlayer.java <<'JAVA'
          package com.unity3d.player;
          public class UnityPlayer {
              public static android.app.Activity currentActivity;
              public static void UnitySendMessage(String obj,String method,String value) {}
          }
          JAVA
          javac -source 11 -target 11 -classpath "$JAR" -d /tmp/tf-java-classes /tmp/tf-java/com/unity3d/player/UnityPlayer.java source/mobile/Assets/Plugins/Android/*.java >/tmp/tf-java.log 2>&1 || { echo "Android Java compilation failed; private source diagnostics withheld"; grep -E 'error:|[0-9]+ errors?' /tmp/tf-java.log | sed -E 's/^.*error:/error:/' | head -8; exit 1; }
          echo "All five Android Java bridges compiled against Android SDK (UnityPlayer stub)."
      - name: Unity activation readiness
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; then
            echo "Unity activation material configured; actual activation and editor build not attempted by this preflight."
          else
            echo "::notice::No UNITY_LICENSE or UNITY_SERIAL configured. Full Unity CI build blocked; use an activated local editor or configure licensed CI."
          fi
      - name: Cleanup
        if: always()
        run: rm -rf source /tmp/tf-java /tmp/tf-java-classes /tmp/tf-java.log /tmp/tf-build-parser.log /tmp/tf-build-assets.log
