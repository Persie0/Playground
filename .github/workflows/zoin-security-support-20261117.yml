name: Zoin security and support UI validation (public runner)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/zoin-security-support-20261117.yml

permissions:
  contents: read

jobs:
  zoin-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out private Zoin using sequential Playground token fallback
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/zoin-askpass.sh" <<'ASKPASS'
          #!/usr/bin/env bash
          if [[ "$1" == *Username* ]]; then
            printf '%s\\n' x-access-token
          else
            printf '%s\\n' "$ZOIN_CHECKOUT_TOKEN"
          fi
          ASKPASS
          chmod 700 "$RUNNER_TEMP/zoin-askpass.sh"
          export GIT_ASKPASS="$RUNNER_TEMP/zoin-askpass.sh"
          export GIT_TERMINAL_PROMPT=0
          found=false
          for secret_name in PRIVATE_REPO_TOKEN GH_TOKEN GH_RELEASE_TOKEN; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "$secret_name is not configured"
              continue
            fi
            export ZOIN_CHECKOUT_TOKEN="${!secret_name}"
            rm -rf zoin
            if git -c credential.helper= clone --quiet --depth 1 --single-branch \\
              --branch fix/security-and-support-ux-20261117 \\
              https://github.com/perzis/zoin.git zoin; then
              echo "Zoin checkout succeeded using $secret_name"
              found=true
              break
            fi
            echo "$secret_name lacks access to perzis/zoin; trying next"
          done
          unset ZOIN_CHECKOUT_TOKEN
          rm -f "$RUNNER_TEMP/zoin-askpass.sh"
          if [[ "$found" != true ]]; then
            echo "::error::No configured Playground token can read perzis/zoin"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        run: python -m pip install -r zoin/backend/requirements-dev.txt

      - name: Run Zoin backend tests
        env:
          ENVIRONMENT: testing
          PYTHONPATH: ${{ github.workspace }}/zoin/backend
        run: python -m pytest -q zoin/backend/tests

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Get Flutter dependencies
        working-directory: zoin
        run: flutter pub get

      - name: Analyze Flutter
        working-directory: zoin
        run: flutter analyze

      - name: Flutter unit and widget tests
        working-directory: zoin
        run: flutter test

      - name: Build Android debug APK (not for release)
        working-directory: zoin
        run: flutter build apk --debug --dart-define=USE_DEMO=true
