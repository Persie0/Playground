name: Zoin security and support UI validation (public runner)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/zoin-security-support-20261117.yml

permissions:
  contents: read

jobs:
  zoin-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out private Zoin branch on public Playground runner
        uses: actions/checkout@v4
        with:
          repository: perzis/zoin
          ref: fix/security-and-support-ux-20261117
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run Zoin backend tests
        env:
          ENVIRONMENT: testing
          PYTHONPATH: ${{ github.workspace }}/backend
        run: python -m pytest -q backend/tests

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze

      - name: Flutter unit and widget tests
        run: flutter test

      - name: Build Android debug APK (not for release)
        run: flutter build apk --debug --dart-define=USE_DEMO=true
