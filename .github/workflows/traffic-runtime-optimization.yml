name: Traffic runtime optimization executor

on:
  push:
    branches:
      - perf/traffic-runtime-optimization
    paths:
      - ".github/workflows/traffic-runtime-optimization.yml"
      - ".github/runtime-optimization-trigger.txt"

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/traffic-counting-light-main
  APP_REF: perf/runtime-optimization

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout private optimization branch
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused camera-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy>=2.2,<2.5" \
            "opencv-python>=4.12.0.88,<5" \
            "loguru>=0.7.3,<0.8" \
            "pyyaml>=6.0.3,<7" \
            "easydict>=1.13,<2" \
            "pytest>=9.1.1,<10"

      - name: Run focused private optimization step
        run: bash app/.github/playground/runtime-optimization-step.sh app
