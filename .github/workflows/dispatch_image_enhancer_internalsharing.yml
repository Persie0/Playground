name: Dispatch image_enhancer internal sharing

on:
  push:
    paths:
      - '.github/workflows/dispatch_image_enhancer_internalsharing.yml'

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch firebase_tester_builder
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GH_TOKEN_FALLBACK: ${{ secrets.GH_TOKEN }}
          GH_RELEASE_TOKEN_FALLBACK: ${{ secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${PRIVATE_REPO_TOKEN:-${GH_TOKEN_FALLBACK:-${GH_RELEASE_TOKEN_FALLBACK:-}}}"
          if [ -z "$TOKEN" ]; then
            echo '::error::No dispatch token available (PRIVATE_REPO_TOKEN/GH_TOKEN/GH_RELEASE_TOKEN).'
            exit 1
          fi
          payload='{"ref":"main","inputs":{"app":"image_enhancer","build_apk":"true","run_tests":"false","branch":"main","play_track":"internalsharing"}}'
          curl --fail-with-body -sS -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Persie0/firebase_tester_builder/actions/workflows/play_auto.yml/dispatches \
            -d "$payload"
          echo 'Dispatched firebase_tester_builder/play_auto.yml for image_enhancer using internalsharing.'
