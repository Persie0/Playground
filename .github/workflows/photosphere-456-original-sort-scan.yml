name: Photosphere 456 original ARM64 Ceres sort-call inventory
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-456-original-sort-scan.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-456-original-sort-scan
  cancel-in-progress: false
jobs:
  static-original-sort:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: d4723e4fec0117e40d42603291306a490875f13a
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify exact private research SHA and Python
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = d4723e4fec0117e40d42603291306a490875f13a
          python3 -m pip install --quiet --break-system-packages capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint456/scan_original_sort_target.py
      - name: Hash-check original APK and ELF
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Decode original sort callee and original source transfers
        working-directory: research-src
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint456/scan_original_sort_target.py research/native/liblightcycle.so --output checkpoint456-original-sort.json
          python3 - <<'PY'
          import json
          d=json.load(open("checkpoint456-original-sort.json"))
          assert d["source_opcode_pins_verified"]
          assert d["original_sort_callsite_pc"]=="0x1347b4"
          assert d["original_sort_callee_pc"]=="0x3cedb0"
          assert not d["source_native_sort_executed"]
          assert not d["source_native_ceres_parameter_lookup_executed"]
          print("CHECKPOINT456_ORIGINAL_SORT_STATIC_VERIFIED")
          PY
      - name: Delete original APK and ELF before any artifact
        if: always()
        working-directory: research-src
        run: rm -f original.apk research/native/liblightcycle.so
      - name: Upload only source opcode inventory
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-456-source-original-sort-opcodes
          path: research-src/checkpoint456-original-sort.json
          retention-days: 7
          if-no-files-found: error
