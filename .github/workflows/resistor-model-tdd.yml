name: Resistor model TDD checks

on:
  workflow_dispatch:
  push:
    branches: [resistor-dataset-train]
    paths:
      - .github/workflows/resistor-model-tdd.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: Persie0/resistor_model
          ref: feat/training-stack
          path: resistor_model
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -q numpy opencv-python-headless PyYAML pytest
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run focused training/data/metrics regression tests
        env:
          PYTHONPATH: resistor_model/src
        run: pytest -q resistor_model/tests/test_data_core.py resistor_model/tests/test_roboflow_import.py resistor_model/tests/test_dataset.py resistor_model/tests/test_runtime.py
