name: Verify promoted traffic detector

on:
  push:
    branches:
      - traffic-detector-384x288
    paths:
      - '.github/workflows/verify-promoted-traffic-detector.yml'

permissions:
  contents: read

env:
  TARGET_REPOSITORY: Persie0/traffic-counting-light-main
  TARGET_BRANCH: feat/promote-yolo11n-384x288

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Playground
        uses: actions/checkout@v4

      - name: Validate private repository token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if [[ -z "$PRIVATE_TOKEN" ]]; then
            echo "::error::PRIVATE_REPO_TOKEN or GH_TOKEN is required."
            exit 2
          fi

      - name: Checkout final production branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true
          path: target
          lfs: false

      - name: Pull only promoted model LFS object
        working-directory: target
        run: |
          git lfs install --local
          git lfs pull --include='edge/models/yolo11n_384x288_ncnn_model/model.ncnn.bin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime verification dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            'easydict>=1.13,<2' \
            'ncnn==1.0.20260526' \
            'numpy>=2.2,<2.5' \
            'opencv-python>=4.12,<5' \
            'pyyaml>=6,<7' \
            'pytest>=9,<10'

      - name: Verify artifact, tests, imports, and real NCNN inference
        working-directory: target/edge
        run: |
          echo 'bf9f082c9bfb7486a09810a0f6f34df7907321c0295de44366ee140d95c7631a  models/yolo11n_384x288_ncnn_model/model.ncnn.bin' | sha256sum -c -
          echo '4839a5c5c99afa008258446115195d4b300a4786d7b4febe296b9241d05c0843  models/yolo11n_384x288_ncnn_model/model.ncnn.param' | sha256sum -c -
          python -m compileall -q src
          python -m pytest -q \
            tests/test_pi_detector_config.py \
            tests/test_fisheye_rectifier.py \
            tests/test_image_loader_transform.py
          PYTHONPATH=src python - <<'PY'
          from pathlib import Path

          import numpy as np
          from detectors.ncnn_detector import NcnnDetector
          from interfaces.image_loader import ProcessedImage
          from utils.config import Config

          Config.load(Path('configs/runtime/pi_camera.yaml'))
          image = np.zeros((288, 384, 3), dtype=np.uint8)
          processed = ProcessedImage(
              original_image=image,
              image=image,
              original_width=384,
              original_height=288,
              width=384,
              height=288,
              scale_x=1.0,
              scale_y=1.0,
              pad_x=0,
              pad_y=0,
          )
          result = NcnnDetector().detect(processed)
          print(f'NCNN smoke inference OK: cars={len(result.cars)}, pedestrians={len(result.pedestrians)}')
          PY
