# Run 1: synthetic frame and sensor stability tests.
name: FocusMove Step 24 movement safety and accessibility tests

on:
  push:
    paths:
      - '.github/workflows/pomodoroexercise-step24-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private FocusMove UX branch on ephemeral public runner
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/24-movement-accessibility-qa https://github.com/Persie0/pomodoroexercise.git source
      - name: Format Step 24 movement and accessibility changes (runner only)
        shell: bash
        working-directory: source
        run: |
          dart format lib/src/features/pose/movement_rep_detectors.dart lib/src/features/pose/squat_rep_detector.dart lib/src/features/pose/pose_preview_screen.dart lib/src/features/activities/step_counter_adapter.dart lib/src/screens/walking_session_sheet.dart lib/src/screens/guided_break_sheet.dart test/movement_accessibility_qa_test.dart
      - name: Analyze and test (no artifacts uploaded)
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test --reporter expanded
