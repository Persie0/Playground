name: Euclid's Orchard - Recover 1080p Film from Existing Scene Artifacts

on:
  push:
    branches: [ci/euclids-orchard-full1080p]
    paths:
      - .github/workflows/euclids-orchard-assemble-recovery.yml
  workflow_dispatch:
    inputs:
      artifacts_run_id:
        description: "Completed 26-scene source-render run with matching artifact names"
        required: true
        type: string
        default: '41740923487'

permissions:
  actions: read
  contents: write

env:
  SOURCE_SHA: e471557830b2f8e47495133508d78e4c17545699
  RELEASE_TAG: euclids-orchard-19m12s-native1080p-silent-2026-11-04
  SOURCE_RUN_ID: ${{ inputs.artifacts_run_id || '41740923487' }}
  PYTHONUNBUFFERED: '1'

concurrency:
  group: euclids-orchard-assemble-recovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assemble-verify-publish:
    name: Reuse 26 renders, assemble and validate native 1080p film
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout public Playground scripts
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install required FFmpeg / FFprobe
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'
      - name: Verify assembly helper runs without NumPy or private source
        run: |
          set -euo pipefail
          python -m py_compile scripts/euclids-orchard/render_fullfilm.py
          python scripts/euclids-orchard/render_fullfilm.py assemble --help
      - name: Download 26 already rendered native HD scene segments
        uses: actions/download-artifact@v4
        with:
          repository: Persie0/Playground
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ github.token }}
          pattern: orchard-scene-*-native1080p
          path: output/scenes
          merge-multiple: true
      - name: Assemble and fully decode / validate 34560 frames
        env:
          EUCLIDS_SOURCE_SHA: ${{ env.SOURCE_SHA }}
        run: |
          set -euo pipefail
          test "$(find output/scenes -maxdepth 1 -type f -name 'scene-??.mp4' | wc -l)" -eq 26
          python scripts/euclids-orchard/render_fullfilm.py assemble \
            --parts-dir output/scenes \
            --output output/Euclids_Orchard_19m12s_1080p30_SILENT.mp4
          cd output
          sha256sum Euclids_Orchard_19m12s_1080p30_SILENT.mp4 RENDER_INFO.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Upload recovered film and verification manifest
        uses: actions/upload-artifact@v4
        with:
          name: Euclids-Orchard-19m12s-Native1080p30-SILENT
          path: |
            output/Euclids_Orchard_19m12s_1080p30_SILENT.mp4
            output/RENDER_INFO.txt
            output/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Publish validated silent HD master on public Playground
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/orchard-visual-release.md <<'EOF'
          # Euclid's Orchard - complete 26-scene native 1080p silent export

          - 19:12 (1152.000 seconds), 34,560 frames, 1920x1080 / 30fps H.264.
          - All 26 scene segments rendered natively from pinned source Persie0/manimVideos e471557830b2f8e47495133508d78e4c17545699.
          - Recovery reuses verified artifacts from public Playground run 41740923487 without re-rendering the scenes.
          - Full video-stream decode, precise frame count and SHA256 validated.
          - SILENT VISUAL EXPORT ONLY. Narration, score, timed subtitles and final source QA remain outstanding.
          EOF
          if gh release view "$RELEASE_TAG" --repo Persie0/Playground >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              output/Euclids_Orchard_19m12s_1080p30_SILENT.mp4 \
              output/RENDER_INFO.txt output/SHA256SUMS.txt \
              --repo Persie0/Playground --clobber
            gh release edit "$RELEASE_TAG" --repo Persie0/Playground \
              --notes-file /tmp/orchard-visual-release.md --prerelease
          else
            gh release create "$RELEASE_TAG" \
              output/Euclids_Orchard_19m12s_1080p30_SILENT.mp4 \
              output/RENDER_INFO.txt output/SHA256SUMS.txt \
              --repo Persie0/Playground --target "$GITHUB_SHA" \
              --title "Euclid's Orchard - Full 19:12 Native 1080p Visual Export (Silent)" \
              --notes-file /tmp/orchard-visual-release.md --prerelease
          fi
          gh release view "$RELEASE_TAG" --repo Persie0/Playground --json url,assets
