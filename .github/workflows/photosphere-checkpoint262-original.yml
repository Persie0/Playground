name: PhotoSphere checkpoint262 original controlled RANSAC pair (one shot)
on:
  push:
    branches: [ci/photosphere-checkpoint262-controlled-rand]
    paths: ['.github/workflows/photosphere-checkpoint262-original.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint262-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-controlled-pair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'ci: run photosphere checkpoint262 once'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 69119bd4330a8101dc840a96a5ba0c593a5cd001
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify exact native probe and install emulator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "69119bd4330a8101dc840a96a5ba0c593a5cd001"
          python3 -m py_compile research/photosphere/checkpoint262/native_controlled_first_pair.py research/photosphere/checkpoint262/validate_controlled_pair.py
          python3 -m pip install --break-system-packages --quiet -r research/photosphere/checkpoint218/requirements.txt
      - name: Fetch pinned original Google Camera APK and ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Execute original native RANSAC sampler with explicitly controlled libc rand draws
        run: |
          set -euo pipefail
          if ! python3 research/photosphere/checkpoint262/native_controlled_first_pair.py > checkpoint262-original.log 2> checkpoint262-original.stderr; then
            tail -n 120 checkpoint262-original.stderr || true
            exit 1
          fi
          python3 research/photosphere/checkpoint262/validate_controlled_pair.py checkpoint262-original.log | tee checkpoint262-validation.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=Path('checkpoint262-original.log').read_text()
          d=json.loads(s.split('CHECKPOINT262_NATIVE_ADDIMAGE_FEATURE_BEGIN\n')[1].split('\nCHECKPOINT262_NATIVE_ADDIMAGE_FEATURE_END')[0])
          Path('checkpoint262-original.json').write_text(json.dumps(d,indent=2)+'\n')
          for c in d['cases']:
              v=c['native_second_actual_addimage']
              print('CHECKPOINT262_NATIVE_PAIR',c['name'],v.get('native_original_controlled_pair'))
          PY
      - name: Archive exact original native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint262-original-controlled-pair
          path: |
            checkpoint262-original.log
            checkpoint262-original.stderr
            checkpoint262-original.json
            checkpoint262-validation.txt
          retention-days: 14
          if-no-files-found: warn
