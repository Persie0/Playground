name: Whisper Kotlin SDK native and widget tests
on:
  pull_request:
    paths: [.github/workflows/whisper-sdk-widget-recheck.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/whisper_offline_transcribe
          ref: chore/flutter-kotlin-2421-20261013
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Android SDK / NDK
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-37.0' || "$SDKMANAGER" --install 'platforms;android-37'
          "$SDKMANAGER" --install 'ndk;29.0.13599879'
      - name: Dart dependencies
        working-directory: app
        run: flutter pub get
      - name: Build native Whisper Android
        working-directory: app
        run: flutter build apk --debug --no-pub
      - name: Run actual transcription home widget test
        working-directory: app
        run: flutter test --no-pub
