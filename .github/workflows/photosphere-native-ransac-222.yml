name: Photo Sphere native two-pair RANSAC checkpoint 222
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-native-ransac-222.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-model-and-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PhotoSphereCleanroom branch using private token
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: parity/native-two-pair-svd-model
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - name: Compile and test all Rust library checks once
        run: |
          set -euo pipefail
          cargo test --locked --lib > "$RUNNER_TEMP/native-ransac-222.log" 2>&1 || {
            tail -100 "$RUNNER_TEMP/native-ransac-222.log"
            exit 1
          }
          grep -E 'test result:' "$RUNNER_TEMP/native-ransac-222.log" | tail -2
      - name: Record tested application source
        if: always()
        run: git rev-parse HEAD
