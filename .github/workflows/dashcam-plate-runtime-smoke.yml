name: Dashcam plate TFLite runtime smoke

on:
  push:
    branches: [main]
    paths: ['.github/workflows/dashcam-plate-runtime-smoke.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout private DashcamBlur branch using public repository secrets
        uses: actions/checkout@v4
        with:
          repository: Persie0/DashcamBlur
          ref: feat/offline-video-privacy-editor
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: editor
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate host and verified bundled model
        working-directory: editor
        run: |
          python3 tool/bootstrap.py
          flutter pub get
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Execute native TFLite inference with no Internet required
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            cd editor
            flutter test integration_test/plate_model_test.dart --no-pub -d emulator-5554
