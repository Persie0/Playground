name: NetworkLimiter Linux smoke validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-qt-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Clone public NetworkLimiter main
        run: git clone --depth 1 --branch main https://github.com/Persie0/networklimiter.git source

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install psutil PySide6

      - name: Validate Python syntax
        run: python -m compileall -q source/networklimiter source/tests

      - name: Run unit tests
        run: cd source && python -m unittest discover -s tests -v

      - name: Validate installer syntax
        run: bash -n source/install.sh source/uninstall.sh

      - name: Run offscreen Qt startup smoke test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd source
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from networklimiter.gui import Window

          app = QApplication([])
          window = Window(tray_start=False)
          assert window.windowTitle() == "NetworkLimiter"
          assert window.global_rates.download.value() == 100
          assert window.process_table.columnCount() == 6
          window.exit_app()
          print("Qt startup OK")
          PY
