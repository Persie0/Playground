name: NetworkLimiter global-only Linux smoke
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-and-qt-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out public NetworkLimiter main
        run: git clone --depth 1 --branch main https://github.com/Persie0/networklimiter.git source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: python -m pip install psutil PySide6
      - name: Compile all Python modules
        run: python -m compileall -q source/networklimiter source/tests
      - name: Validate global-only backend
        run: cd source && python -m unittest discover -s tests -v
      - name: Verify installer shell syntax
        run: bash -n source/install.sh source/uninstall.sh
      - name: Offscreen Qt startup and simplified controls
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd source
          python - <<'PY'
          from PySide6.QtWidgets import QApplication
          from networklimiter.gui import Window
          app = QApplication([])
          window = Window(tray_start=False)
          assert window.windowTitle() == "NetworkLimiter"
          assert window.toggle.text() == "Enable speed limit"
          assert window.backend_rate == 1024
          assert window.units.count() == 2
          assert not hasattr(window, "rule_table")
          assert not hasattr(window, "process_table")
          window.exit_app()
          print("Global-only Qt smoke test passed")
          PY
