name: PhotoSphere checkpoint256 second native AddImage (one shot)
on:
  push:
    branches: [ci/photosphere-checkpoint256-second-addimage]
    paths: ['.github/workflows/photosphere-checkpoint256-native.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint256-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-second-addimage:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'ci: run photosphere checkpoint256 once'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 4b3bb99f8f9eb96e5552da34bf28ca858bf5525e
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify pinned private research code and install emulator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4b3bb99f8f9eb96e5552da34bf28ca858bf5525e"
          python3 -m py_compile research/photosphere/checkpoint256/native_second_addimage_lifecycle.py research/photosphere/checkpoint256/validate_second_addimage.py
          python3 -m pip install --break-system-packages --quiet -r research/photosphere/checkpoint218/requirements.txt
      - name: Retrieve original pinned GCam APK and ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Execute second actual native AddImage in retained estimator and validate
        run: |
          set -euo pipefail
          if ! python3 research/photosphere/checkpoint256/native_second_addimage_lifecycle.py > checkpoint256-original.log 2> checkpoint256-original.stderr; then
            tail -n 110 checkpoint256-original.stderr || true
            exit 1
          fi
          python3 research/photosphere/checkpoint256/validate_second_addimage.py checkpoint256-original.log | tee checkpoint256-validation.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=Path('checkpoint256-original.log').read_text()
          d=json.loads(s.split('CHECKPOINT256_NATIVE_ADDIMAGE_FEATURE_BEGIN\n')[1].split('\nCHECKPOINT256_NATIVE_ADDIMAGE_FEATURE_END')[0])
          Path('checkpoint256-original.json').write_text(json.dumps(d,indent=2)+'\n')
          for c in d['cases']:
            v=c['native_second_actual_addimage']
            print('CHECKPOINT256_SECOND_ADDIMAGE_COUNTS',c['name'],
                  [x['count'] for x in v['original_converter_features']],
                  len(v['original_owner_ptrs']),v['original_feature_provider_appends'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint256-original-second-addimage
          path: |
            checkpoint256-original.log
            checkpoint256-original.stderr
            checkpoint256-original.json
            checkpoint256-validation.txt
          retention-days: 14
          if-no-files-found: warn
