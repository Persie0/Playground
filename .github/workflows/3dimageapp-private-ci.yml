name: 3dimageapp private CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag/SHA in Persie0/3dimageapp
        required: true
        default: main
        type: string
  push:
    branches: [main]
    paths:
      - '3dimageapp/**'
      - '.github/workflows/3dimageapp-private-ci.yml'

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/3dimageapp
  APP_REF: ${{ inputs.ref || 'main' }}

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if [[ -z "$PRIVATE_TOKEN" ]]; then
            echo "::error::Set PRIVATE_REPO_TOKEN (Contents: read on Persie0/3dimageapp)."
            exit 2
          fi
      - name: Checkout private 3dimageapp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-app
      - name: Run native release + sanitizer tests
        run: bash 3dimageapp/test-core.sh private-app

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if [[ -z "$PRIVATE_TOKEN" ]]; then
            echo "::error::Set PRIVATE_REPO_TOKEN (Contents: read on Persie0/3dimageapp)."
            exit 2
          fi
      - name: Checkout private 3dimageapp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK/NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build, test and lint Android privately
        run: bash 3dimageapp/test-android.sh private-app

  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if [[ -z "$PRIVATE_TOKEN" ]]; then
            echo "::error::Set PRIVATE_REPO_TOKEN (Contents: read on Persie0/3dimageapp)."
            exit 2
          fi
      - name: Checkout private 3dimageapp
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-app
      - name: Install XcodeGen
        run: brew install xcodegen >/dev/null
      - name: Test logic and build iOS privately
        run: bash 3dimageapp/test-ios.sh private-app
