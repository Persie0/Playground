name: Photosphere checkpoint281 original estimator vtable and indirect dispatch (one-shot)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint281-original-estimator-vtable.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint281-vtable
  cancel-in-progress: false
jobs:
  original-vtable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact research source
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: bf19fea76796b2b954ee514dd32e5e83d5f7d77a
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify pinned source and install decoders
        run: |
          test "$(git rev-parse HEAD)" = "bf19fea76796b2b954ee514dd32e5e83d5f7d77a"
          python3 -m pip install --break-system-packages --quiet pyelftools capstone
      - name: Get SHA-pinned original GCam APK and ARM64 ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Resolve original estimator vptr and candidate BLR contexts
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint281/locate_original_estimator_vtable.py original.so > checkpoint281-vtable.log
          grep '^CHECKPOINT281_ORIGINAL_ESTIMATOR_VPTR' checkpoint281-vtable.log
          grep '^CHECKPOINT281_ORIGINAL_VTABLE_METHODS' checkpoint281-vtable.log
          grep '^CHECKPOINT281_ORIGINAL_INDIRECT_DISPATCH_CANDIDATE_COUNTS' checkpoint281-vtable.log
          grep '^CHECKPOINT281_ORIGINAL_INDIRECT_CANDIDATE' checkpoint281-vtable.log | head -30 || true
          grep -q '^CHECKPOINT281_ORIGINAL_VTABLE_DISPATCH_SCAN_PASSED' checkpoint281-vtable.log
          python3 - <<'PY'
          import json
          d=json.load(open('checkpoint281-vtable-dispatch.json'))
          assert d['original_cxx_estimator_constructor_vptr']=='0x3fdca0'
          assert d['original_vtable_methods']['component_eligibility']['relocated_slot']=='0x3fdd10'
          assert d['original_vtable_methods']['removal']['relocated_slot']=='0x3fdcd0'
          print('CHECKPOINT281_ORIGINAL_VTABLE_VERIFIED',flush=True)
          PY
      - name: Archive original vtable/caller investigation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint281-original-estimator-vtable
          path: |
            checkpoint281-vtable.log
            checkpoint281-vtable-dispatch.json
          if-no-files-found: warn
          retention-days: 14
