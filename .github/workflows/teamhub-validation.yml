name: TeamHub validation and debug APK

on:
  push:
    paths:
      - ".github/workflows/teamhub-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout private TeamHub code
        uses: actions/checkout@v4
        with:
          repository: Persie0/teamplus_clone
          ref: feat/team-hub-foundation
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: teamhub
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter dependencies and analysis
        working-directory: teamhub
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Python backend tests
        working-directory: teamhub
        run: |
          python3 -m pip install --user -r server/requirements.txt -r server/tests/requirements.txt
          python3 -m pytest -q server/tests
      - name: Build debug APK
        working-directory: teamhub
        run: flutter build apk --debug --no-pub --dart-define=API_BASE_URL=https://teamhub.example.com
      - name: Upload Android debug build
        uses: actions/upload-artifact@v4
        with:
          name: teamhub-debug-apk
          path: teamhub/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
