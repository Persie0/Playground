name: Photosphere analyzer autofix 2

on:
  push:
    branches: [photosphere-ci-v2]
    paths:
      - '.github/workflows/photosphere-autofix-2.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Checkout Photosphere source
        uses: actions/checkout@v4
        with:
          repository: Persie0/Photosphere-
          ref: audit/code-hardening-3
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true
          path: private-app
      - name: Fix convertTo MatType calls
        working-directory: private-app
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/src/services/local_patch_alignment_repair.dart')
          text = path.read_text()
          text = text.replace(
              'convertToAsync(\n        cv.MatType.CV_32F,',
              'convertToAsync(\n        cv.MatType(cv.MatType.CV_32F),',
          )
          path.write_text(text)
      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies and format
        working-directory: private-app
        run: |
          flutter pub get
          dart format lib/src/services/local_patch_alignment_repair.dart
      - name: Commit and push
        working-directory: private-app
        shell: bash
        run: |
          git config user.name 'photosphere-ci-fix'
          git config user.email 'actions@users.noreply.github.com'
          git add lib/src/services/local_patch_alignment_repair.dart
          if ! git diff --cached --quiet; then
            git commit -m 'Fix remaining dartcv4 MatType conversions'
            git push origin HEAD:audit/code-hardening-3
          fi
      - name: Analyze
        working-directory: private-app
        run: flutter analyze
      - name: Test
        working-directory: private-app
        run: flutter test
