name: Traffic counting runtime hardening

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag/SHA in Persie0/traffic-counting-light-main
        required: true
        default: fix/audit-runtime-1-5
        type: string
  push:
    branches: [main]
    paths:
      - '.github/workflows/traffic-counting-runtime-hardening.yml'

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/traffic-counting-light-main
  APP_REF: ${{ inputs.ref || 'fix/audit-runtime-1-5' }}
  PYTHONPATH: src

jobs:
  edge-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if [[ -z "$PRIVATE_TOKEN" ]]; then
            echo "::error::Set PRIVATE_REPO_TOKEN or GH_TOKEN with Contents: read on Persie0/traffic-counting-light-main."
            exit 2
          fi

      - name: Checkout traffic-counting branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: traffic-counting

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: traffic-counting/edge/pyproject.toml

      - name: Install edge runtime and test dependencies
        working-directory: traffic-counting/edge
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[pi,dev]'

      - name: Validate shipped configs
        working-directory: traffic-counting/edge
        run: |
          python - <<'PY'
          from pathlib import Path
          from utils.config import Config

          for path in [
              Path('configs/runtime/pi_camera.yaml'),
              Path('configs/runtime/recording.yaml'),
              Path('configs/runtime/webcam.yaml'),
              Path('configs/benchmark/ncnn.yaml'),
          ]:
              Config.load(path)
              print(f'OK {path}')
          PY

      - name: Run focused runtime-hardening tests
        working-directory: traffic-counting/edge
        run: |
          python -m pytest -q \
            tests/test_config.py \
            tests/test_dashboard_camera.py \
            tests/test_dashboard_data_writer.py \
            tests/test_fast_plate_ocr_batching.py \
            tests/test_image_loader_transform.py \
            tests/test_license_plate_runtime.py \
            tests/test_line_counter_classes.py \
            tests/test_line_counter_retention.py \
            tests/test_main_failure.py \
            tests/test_ncnn_nms.py \
            tests/test_privacy_output.py \
            tests/test_processed_image_roi.py \
            tests/test_reader_manager_async.py \
            tests/test_settings.py \
            tests/test_speed_calibration_reload.py \
            tests/test_speed_sampling.py \
            tests/test_video_capture_queue.py

      - name: Run complete edge test suite
        working-directory: traffic-counting/edge
        run: python -m pytest -q tests

      - name: Compile edge sources
        working-directory: traffic-counting/edge
        run: python -m compileall -q src tests

      - name: Ruff correctness checks
        working-directory: traffic-counting/edge
        # The repository has a pre-existing broad Ruff backlog. This gate keeps
        # high-signal parser/undefined-name/import failures without turning a
        # focused runtime patch into an unrelated style migration.
        run: python -m ruff check --select F,E9 src tests
