name: Temporary AudioBooster RevenueCat trial gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-audiobooster-revenuecat-trial.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check out AudioBooster feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: feature/revenuecat-trial-monetization
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: audiobooster
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: audiobooster
        run: flutter pub get
      - name: Bootstrap Android
        working-directory: audiobooster
        run: bash tool/bootstrap_android.sh
      - name: Trial access gate test
        working-directory: audiobooster/android
        run: ./gradlew testDebugUnitTest --tests com.persie0.audiobooster.audio.TrialAccessGateTest
