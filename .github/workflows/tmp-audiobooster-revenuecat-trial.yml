name: Temporary AudioBooster RevenueCat build RED gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-audiobooster-revenuecat-trial.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check out corrected tests-before-build-config revision
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: ea5477670beecc49864127441db66e4b676652f5
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: audiobooster
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: audiobooster
        run: flutter pub get
      - name: RevenueCat build config RED gate
        working-directory: audiobooster
        run: flutter test test/revenuecat_build_config_test.dart
