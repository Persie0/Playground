name: Temporary AudioBooster final head verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-audiobooster-revenuecat-trial.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check out final AudioBooster branch head
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: feature/revenuecat-trial-monetization
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: audiobooster
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify branch head
        working-directory: audiobooster
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "99ef0ec97f88bf87452cd96373d54cad48076e35"
          flutter pub get
          git diff --exit-code -- pubspec.lock
      - name: Full Flutter tests
        working-directory: audiobooster
        run: flutter test
      - name: Analyze
        working-directory: audiobooster
        run: flutter analyze
      - name: Bootstrap and app native tests
        working-directory: audiobooster
        run: |
          set -euxo pipefail
          bash tool/bootstrap_android.sh
          cmp tool/android/MainActivity.kt android/app/src/main/kotlin/com/persie0/audiobooster/MainActivity.kt
          diff -qr tool/android/com/persie0/audiobooster/audio android/app/src/main/kotlin/com/persie0/audiobooster/audio
          cd android
          ./gradlew :app:testDebugUnitTest
