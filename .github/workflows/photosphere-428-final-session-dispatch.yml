name: Photosphere 428 original SessionImpl finalizer dispatch
on:
  push:
    branches: [main]
    paths: [.github/workflows/photosphere-428-final-session-dispatch.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-428-final-session-dispatch
  cancel-in-progress: false
jobs:
  original-session-to-global-align-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pinned private source checkout read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 26a7cac72970098084ffb5edd20bbb6600b96987
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify pinned commit and install static ELF tools
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 26a7cac72970098084ffb5edd20bbb6600b96987
          python3 -m pip install --quiet --break-system-packages capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint428/scan_original_final_session_dispatch.py
      - name: Verify original pinned Google Camera APK and ELF
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Scan original session final alignment and global-focal target
        working-directory: research-src
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint428/scan_original_final_session_dispatch.py original.so --out checkpoint428-final-session-map.json
          test -s checkpoint428-final-session-map.json
      - name: Delete proprietary original executable before artifact upload
        if: always()
        working-directory: research-src
        run: |
          rm -f original.apk original.so com.google.android.GoogleCamera_*.apk
      - name: Upload source-only numeric dispatch map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-428-original-final-session-source
          path: research-src/checkpoint428-final-session-map.json
          if-no-files-found: warn
          retention-days: 7
