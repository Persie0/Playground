name: Photosphere checkpoint353 original provider append source execution
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint353-append.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint353-append
  cancel-in-progress: false
jobs:
  native-original-provider-append:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact original research SHA read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: b8766bdb2790792d9c23b6d25ec106e81fa1d903
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify research SHA and install original ARM64 emulator
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b8766bdb2790792d9c23b6d25ec106e81fa1d903"
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint353/native_original_provider_append.py
      - name: Obtain checksum-verified original Google Camera ARM64 source
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Execute original 0x3450dc provider append with preallocated arrays and two virtual ABI stubs
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint353/native_original_provider_append.py original.so --output checkpoint353-original-append.json | tee checkpoint353-original-append.log
          grep -q '^CHECKPOINT353_ORIGINAL_ADDIMAGE_PROVIDER_APPEND_SOURCE_PASS 34 5 11$' checkpoint353-original-append.log
      - name: Save only results and logs, never proprietary ELF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-checkpoint353-append
          path: |
            checkpoint353-original-append.json
            checkpoint353-original-append.log
          retention-days: 7
          if-no-files-found: warn
