name: NomadRank Android Google Sign-In 7.2.18 verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nomadrank-google-signin-7218.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout NomadRank feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/skratch_clone
          ref: fix/android-google-sign-in-server-client-id
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies and refresh lockfile
        run: |
          flutter pub get
          grep -A 7 '^  google_sign_in_android:' pubspec.lock
          test "$(sed -n '/^  google_sign_in_android:/,/^  google_sign_in_ios:/p' pubspec.lock | grep 'version: "7.2.18"')" != ""

      - name: Format changed Dart files
        run: dart format lib/providers/user_provider.dart lib/utils/google_sign_in_config.dart test/google_sign_in_config_test.dart

      - name: Analyze auth changes
        run: flutter analyze --no-pub lib/providers/user_provider.dart lib/utils/google_sign_in_config.dart test/google_sign_in_config_test.dart

      - name: Run Google Sign-In config regression tests
        run: flutter test --no-pub test/google_sign_in_config_test.dart

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Commit resolved dependency lockfile
        if: success()
        run: |
          if ! git diff --quiet -- pubspec.lock lib/providers/user_provider.dart lib/utils/google_sign_in_config.dart test/google_sign_in_config_test.dart; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pubspec.lock lib/providers/user_provider.dart lib/utils/google_sign_in_config.dart test/google_sign_in_config_test.dart
            git commit -m "chore(auth): lock google_sign_in_android 7.2.18"
            git push origin HEAD:fix/android-google-sign-in-server-client-id
          fi
