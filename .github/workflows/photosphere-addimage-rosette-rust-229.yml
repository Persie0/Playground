name: Photo Sphere checkpoint 229 original AddImage rosette camera clones
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-addimage-rosette-rust-229.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 634feb87abca4e05852fc2eedb8879fe50fa36e2
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Print exact source revision
        run: git rev-parse HEAD
      - name: Run complete checkpoint229 Rust regression suite on pinned app revision
        run: cargo test --locked
