name: Photosphere checkpoint321 original output and threshold
on:
  push:
    branches: [research/photosphere-checkpoint321-output]
    paths: [.github/workflows/photosphere-checkpoint321-output.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install original-code inspection tools
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools unicorn
      - name: Retrieve SHA-pinned original GCam ARM64 ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk'
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Read-only checkout original source analysis
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: ef8deffc55618c799b5e7ceb63f883f3fd12178c
          path: research
          sparse-checkout: |
            research/photosphere/checkpoint321
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Scan original output and threshold
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = ef8deffc55618c799b5e7ceb63f883f3fd12178c
          python3 research/research/photosphere/checkpoint321/scan_original_output_threshold.py original.so --output checkpoint321-output-scan.json | tee checkpoint321-output-scan.log
          grep -q '^CHECKPOINT321_ORIGINAL_OUTPUT_THRESHOLD_SCAN' checkpoint321-output-scan.log
          python3 research/research/photosphere/checkpoint321/native_original_atomic_dispatch.py original.so --output checkpoint321-original-atomic-dispatch.json | tee checkpoint321-original-atomic-dispatch.log
          grep -q '^CHECKPOINT321_ORIGINAL_ATOMIC_AND_DISPATCH_PASS' checkpoint321-original-atomic-dispatch.log
          echo CHECKPOINT321_ORIGINAL_ATOMIC_DISPATCH_BEGIN
          cat checkpoint321-original-atomic-dispatch.json
          echo CHECKPOINT321_ORIGINAL_ATOMIC_DISPATCH_END
          echo CHECKPOINT321_OUTPUT_SCAN_BEGIN
          cat checkpoint321-output-scan.json
          echo CHECKPOINT321_OUTPUT_SCAN_END
      - name: Read-only checkout pinned checkpoint321 Rust parity
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 241c93ae71b756d6413adedac4e1274b0f301a02
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Validate fresh original ARM64 oracles against frozen Rust fixtures
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = 241c93ae71b756d6413adedac4e1274b0f301a02
          python3 - <<'PY'
          import json
          from pathlib import Path
          native=json.loads(Path("checkpoint321-original-atomic-dispatch.json").read_text())
          for case in native["dispatch_cases"]:
              trace=case.pop("original_original_instruction_pcs")
              case["original_source_start_pc"]=trace[0]
              case["original_source_emulator_stop_pc"]=trace[-1]
              case["original_source_early_ret_pc_executed"]="0x3b81a8" in trace
              case["original_source_virtual_blr_count"]=trace.count("0x3b818c")
              case["original_source_instruction_count"]=len(trace)
          original=json.loads(Path("app/tests/fixtures/native_original_atomic_output_321.json").read_text())
          assert native==original,"original source-executed atomic/dispatch differs from Rust fixture"
          assert native["original_threshold_case_count"]==9
          assert native["original_dispatch_case_count"]==11
          assert native["original_virtual_callback_count"]==17
          print("CHECKPOINT321_FRESH_SOURCE_ATOMIC_DISPATCH_FIXTURE_EQUAL",9,11,17)
          scan=json.loads(Path("checkpoint321-output-scan.json").read_text())
          scan["original_output_helpers"]=[
              f for f in scan["original_output_helpers"] if f["entry"] in ("0x3b8144","0x3b87f4")]
          scan["original_threshold_page_references"]=[
              x for x in scan["original_threshold_page_references"]
              if x["pc"] in ("0x3b8794","0x3b87f4","0x3b8150")]
          original=json.loads(Path("app/tests/fixtures/native_original_output_threshold_scan_321.json").read_text())
          assert scan==original,"original static output/threshold ELF scan differs from Rust fixture"
          assert scan["original_text_instruction_count"]==800909
          assert scan["original_threshold_page_adrp_reference_count"]==130
          print("CHECKPOINT321_FRESH_SOURCE_OUTPUT_BSS_FIXTURE_EQUAL",800909,130)
          PY
      - name: Run focused and full Rust library regression
        run: |
          set -euo pipefail
          cd app
          rustfmt --edition 2021 src/native_line_output_dispatch.rs src/native_line_output_dispatch_checkpoint321_test.rs
          cargo test --lib checkpoint321 -- --nocapture
          cargo test --lib
      - name: Print formatted Rust source for readback
        run: |
          echo CHECKPOINT321_RUST_MODEL_BEGIN
          cat app/src/native_line_output_dispatch.rs
          echo CHECKPOINT321_RUST_MODEL_END
          echo CHECKPOINT321_RUST_TEST_BEGIN
          cat app/src/native_line_output_dispatch_checkpoint321_test.rs
          echo CHECKPOINT321_RUST_TEST_END
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint321-original-output-scan
          path: |
            checkpoint321-output-scan.json
            checkpoint321-output-scan.log
            checkpoint321-original-atomic-dispatch.json
            checkpoint321-original-atomic-dispatch.log
          retention-days: 14
