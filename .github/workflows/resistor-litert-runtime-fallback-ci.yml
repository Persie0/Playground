name: Resistor Scanner Play-services-only LiteRT R8 regression
# Test preservation of GMS LiteRT bridge method getAccelerationConfig under R8, no bundled runtime.
on:
  push:
    paths:
      - .github/workflows/resistor-litert-runtime-fallback-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-and-debug-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/resistor-scanner-android
          ref: fix/litert-system-model-fallback
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: scanner
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK platforms
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          if ! "$SDKMANAGER" --channel=3 "platforms;android-37" "build-tools;36.0.0" >/dev/null; then
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null
            sed -i 's/compileSdk = 37/compileSdk = 36/; s/targetSdk = 37/targetSdk = 36/' scanner/app/build.gradle.kts
            echo "CI_API36_FALLBACK=true" >> "$GITHUB_ENV"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Enforce system-only model runtime and no bundled LiteRT dependency
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n 'FROM_APPLICATION_ONLY' scanner/app/src/main/java scanner/app/src/androidTest/java
          ! grep -q 'com.google.ai.edge.litert:litert' scanner/app/build.gradle.kts
          grep -Fq 'com.google.android.gms.tflite.**' scanner/app/proguard-rules.pro
          echo "PASS: Play services LiteRT only, no standalone runtime dependency"

      - name: Compile debug, instrumented and R8-minified release APKs
        working-directory: scanner
        run: |
          chmod +x gradlew
          args=()
          if [ "${CI_API36_FALLBACK:-false}" = true ]; then
            args+=(-x :app:checkDebugAarMetadata -x :app:checkReleaseAarMetadata -x :app:checkDebugAndroidTestAarMetadata)
          fi
          ./gradlew --no-daemon --stacktrace \
            :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:testDebugUnitTest "${args[@]}"
      - name: Assert getAccelerationConfig survives R8 in release APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import sys
          candidates = [
              Path("scanner/app/build/outputs/apk/release/app-release-unsigned.apk"),
              Path("scanner/app/build/outputs/apk/qaRelease/app-qaRelease.apk")
          ]
          apk = next((path for path in candidates if path.is_file()), None)
          if not apk:
              sys.exit("Missing R8 release APK for dex inspection")
          with ZipFile(apk) as z:
              dex_entries = [n for n in z.namelist() if n.startswith("classes") and n.endswith(".dex")]
              if not dex_entries:
                  sys.exit("No DEX bytecode in APK")
              # A compressed DEX entry contains its string pool including method
              # names, whether a class has been obfuscated or not.
              has_bridge_method = any(b"getAccelerationConfig" in z.read(n) for n in dex_entries)
              if not has_bridge_method:
                  sys.exit("R8 removed/renamed getAccelerationConfig: would reproduce QA NoSuchMethodError")
              print("PASS: getAccelerationConfig retained in R8-minified APK", apk)
          PY
      - name: Audit both model assets in APKs
        shell: bash
        run: |
          python -m pip install -q cryptography
          python scanner/tools/verify_packaged_models.py scanner/app/build/outputs/apk/debug/app-debug.apk
          python scanner/tools/verify_packaged_models.py scanner/app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh scanner/app/build/outputs/apk/debug/app-debug.apk scanner/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: resistor-litert-gms-only-debug
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
          path: scanner/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: resistor-litert-gms-only-unsigned-release
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
          path: scanner/app/build/outputs/apk/release/app-release-unsigned.apk
