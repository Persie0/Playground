name: Resistor Scanner LiteRT fallback release regression
on:
  push:
    paths:
      - .github/workflows/resistor-litert-runtime-fallback-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-and-debug-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/resistor-scanner-android
          ref: fix/litert-system-model-fallback
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: scanner
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK platforms
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          if ! "$SDKMANAGER" --channel=3 "platforms;android-37" "build-tools;36.0.0" >/dev/null; then
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null
            sed -i 's/compileSdk = 37/compileSdk = 36/; s/targetSdk = 37/targetSdk = 36/' scanner/app/build.gradle.kts
            echo "CI_API36_FALLBACK=true" >> "$GITHUB_ENV"
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false
      - name: Compile debug, instrumented and R8-minified release APKs
        working-directory: scanner
        run: |
          chmod +x gradlew
          args=()
          if [ "${CI_API36_FALLBACK:-false}" = true ]; then
            args+=(-x :app:checkDebugAarMetadata -x :app:checkReleaseAarMetadata -x :app:checkDebugAndroidTestAarMetadata)
          fi
          ./gradlew --no-daemon --stacktrace \
            :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:testDebugUnitTest "${args[@]}"
      - name: Audit both model assets in APKs
        shell: bash
        run: |
          python -m pip install -q cryptography
          python scanner/tools/verify_packaged_models.py scanner/app/build/outputs/apk/debug/app-debug.apk
          python scanner/tools/verify_packaged_models.py scanner/app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh scanner/app/build/outputs/apk/debug/app-debug.apk scanner/app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: resistor-litert-fallback-debug
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
          path: scanner/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: resistor-litert-fallback-unsigned-release
          retention-days: 14
          if-no-files-found: error
          compression-level: 0
          path: scanner/app/build/outputs/apk/release/app-release-unsigned.apk
