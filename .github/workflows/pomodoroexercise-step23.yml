name: FocusMove Step 23 timer reliability and platform validation
# Run 1: analyzer and 221 timer reliability/widget/unit tests passed in public Playground.

on:
  push:
    paths:
      - '.github/workflows/pomodoroexercise-step23.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focusmove-step23-reliability
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private branch in ephemeral runner only
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Missing private checkout token'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/23-timer-reliability-hardening https://github.com/Persie0/pomodoroexercise.git source
      - name: Format Step 23 source and tests, resolve packages
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/src/features/timer/persistent_timer_controller.dart lib/src/screens/privacy_settings_screen.dart test/timer_reliability_stress_test.dart
      - name: Commit formatter changes back to private PR branch only
        working-directory: source
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'focusmove-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add lib test pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m 'chore: format Step 23 timer reliability changes'
            AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/23-timer-reliability-hardening
          fi

  android-flutter:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private feature branch (not published)
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/23-timer-reliability-hardening https://github.com/Persie0/pomodoroexercise.git source
      - name: Analyze and run full Flutter test suite
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test --reporter expanded
      - name: Build Android debug and release APKs (not published)
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk

  ios-simulator:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private feature branch (not published)
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/23-timer-reliability-hardening https://github.com/Persie0/pomodoroexercise.git source
      - name: Build unsigned iOS simulator (not published)
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter build ios --simulator --no-codesign
      - name: Verify ML Kit model resources are bundled
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APP=build/ios/iphonesimulator/Runner.app
          test -d "$APP"
          for name in MLKitPoseDetectionFastResources MLKitPoseDetectionCommonResources MLKitXenoResources; do
            test -d "$APP/$name.bundle" || { echo "Missing iOS resource bundle: $name"; exit 1; }
          done
