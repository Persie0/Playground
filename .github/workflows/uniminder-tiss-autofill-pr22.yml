name: Uniminder TISS autofill PR22 review
on:
  push:
    paths:
      - '.github/workflows/uniminder-tiss-autofill-pr22.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout Uniminder PR
        uses: actions/checkout@v4
        with:
          repository: Persie0/student
          ref: fix/tiss-login-credentials-and-calendar-course-size-20261022
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: uniminder
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fetch dependencies
        working-directory: uniminder
        run: flutter pub get
      - name: Analyze modified source and tests
        working-directory: uniminder
        run: flutter analyze --no-pub lib/services/tiss_login_autofill.dart lib/screens/university/tiss_login_screen.dart lib/screens/calendar/calendar_screen.dart test/tiss_login_autofill_test.dart
      - name: Run login and calendar regression tests
        working-directory: uniminder
        run: flutter test --no-pub test/tiss_login_autofill_test.dart test/tiss_certificate_page_test.dart test/course_name_resolver_test.dart test/calendar_direct_links_test.dart
      - name: Compile Android debug APK
        working-directory: uniminder
        run: flutter build apk --debug --no-pub
