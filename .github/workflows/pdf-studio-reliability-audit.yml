name: PDF Studio reliability audit
on:
  push:
    branches: [pdf-studio-reliability-audit-ci]
    paths:
      - .github/workflows/pdf-studio-reliability-audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-studio-reliability-audit
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout pinned private app revision
        uses: actions/checkout@v4
        with:
          repository: Persie0/pdfapp
          ref: 57468cc749a7dddc37a565881c3bfafacf7673d2
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify checkout
        run: git rev-parse HEAD
      - name: Resolve dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Full regression suite
        run: flutter test --reporter expanded
      - name: Compile Android release APK
        run: flutter build apk --release

  merge-reviewed:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/pdf-studio-reliability-audit-ci'
    steps:
      - name: Merge only the reviewed PR after successful validation
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          EXPECTED_HEAD: 57468cc749a7dddc37a565881c3bfafacf7673d2
          EXPECTED_BASE: 7f74bede55811867ae20602e42c42a2e8c31019e
        run: |
          set -euo pipefail
          actual="$(gh api repos/Persie0/pdfapp/pulls/11 --jq '.head.sha + " " + .base.sha + " " + .state')"
          if [ "$actual" != "$EXPECTED_HEAD $EXPECTED_BASE open" ]; then
            echo 'PR head, base or state changed; refusing to merge.'
            exit 1
          fi
          merged="$(gh api --method PUT repos/Persie0/pdfapp/pulls/11/merge -f sha="$EXPECTED_HEAD" -f merge_method=squash --jq '.merged')"
          test "$merged" = true
          echo 'Reviewed PR merged successfully.'
