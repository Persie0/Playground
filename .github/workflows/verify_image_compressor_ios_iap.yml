name: Verify image_compressor iOS IAP

on:
  push:
    paths:
      - '.github/workflows/verify_image_compressor_ios_iap.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out image_compressor feature branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/image_compressor
          token: ${{ secrets.GH_TOKEN }}
          ref: feat/ios-iap-support

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

      - name: Validate Xcode project
        run: xcodebuild -project ios/Runner.xcodeproj -list

      - name: Build iOS without signing
        env:
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: flutter build ios --debug --no-codesign
