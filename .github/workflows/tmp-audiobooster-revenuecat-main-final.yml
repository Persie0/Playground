name: Temporary AudioBooster RevenueCat main validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-audiobooster-revenuecat-main-final.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Check out exact AudioBooster main revision
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: 9e17742b9977ecedeee5a6bda0af3cb9aeffa6d6
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: audiobooster
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: audiobooster
        run: flutter pub get

      - name: Focused monetization tests
        working-directory: audiobooster
        run: flutter test test/subscription test/trial_bridge_test.dart test/trial_paywall_flow_test.dart test/revenuecat_build_config_test.dart

      - name: Full Flutter tests
        working-directory: audiobooster
        run: flutter test

      - name: Flutter analyze
        working-directory: audiobooster
        run: flutter analyze

      - name: Bootstrap Android
        working-directory: audiobooster
        run: bash tool/bootstrap_android.sh

      - name: Native app unit tests
        working-directory: audiobooster/android
        run: ./gradlew :app:testDebugUnitTest

      - name: Maintained native source drift
        working-directory: audiobooster
        run: |
          cmp tool/android/MainActivity.kt android/app/src/main/kotlin/com/persie0/audiobooster/MainActivity.kt
          diff -qr tool/android/com/persie0/audiobooster android/app/src/main/kotlin/com/persie0/audiobooster

      - name: Debug APK
        working-directory: audiobooster
        run: flutter build apk --debug

      - name: Release APK
        working-directory: audiobooster
        run: flutter build apk --release

      - name: Release AAB
        working-directory: audiobooster
        run: flutter build appbundle --release

      - name: Monetization boundary
        working-directory: audiobooster
        run: |
          grep -q 'purchases_flutter: ^10.13.0' pubspec.yaml
          grep -q 'goog_zoooKoAwTLrRRsvbFZIGEdkrFAF' lib/subscription/subscription_service.dart
          grep -q 'audiobooster_pro' lib/subscription/subscription_service.dart
          grep -q 'FREE_TRIAL_MS = 300_000L' tool/android/com/persie0/audiobooster/audio/TrialAccessGate.kt
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          ! grep -R -E 'Appodeal|BidMachine|Bidon|IronSource' pubspec.yaml android/app/src/main/AndroidManifest.xml android/settings.gradle.kts android/app/build.gradle.kts
