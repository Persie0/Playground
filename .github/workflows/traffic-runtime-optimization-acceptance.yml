name: Traffic runtime optimization acceptance

on:
  push:
    branches:
      - perf/traffic-runtime-optimization
    paths:
      - ".github/workflows/traffic-runtime-optimization-acceptance.yml"
      - ".github/runtime-optimization-acceptance-trigger.txt"

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/traffic-counting-light-main
  APP_REF: perf/runtime-optimization

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout private optimization branch
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run full private runtime hardening
        id: hardening
        continue-on-error: true
        run: bash app/.github/playground/runtime-hardening.sh app

      - name: Diagnose project tests when hardening fails
        if: steps.hardening.outcome == 'failure'
        run: |
          APP="$(cd app && pwd -P)"
          cd "$APP"
          PYTHONPATH="$APP/edge/src:$APP" python -m pytest -q project_tests

      - name: Enforce hardening result
        if: steps.hardening.outcome == 'failure'
        run: exit 1
