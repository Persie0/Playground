name: Memory Palace PR47 review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/memory-palace-pr47-review.yml'

permissions:
  contents: read

jobs:
  branch-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/Memory_Palace_Builder
          ref: fix/deep-audit-2026-08
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Format check
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Test
        working-directory: app
        run: flutter test

  merge-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/Memory_Palace_Builder
          ref: fix/deep-audit-2026-08
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true
          path: app
          fetch-depth: 0

      - name: Probe merge with current main
        working-directory: app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge --no-commit --no-ff origin/main; then
            echo "MERGE_CLEAN=true"
          else
            echo "Merge conflicts:"
            git diff --name-only --diff-filter=U
            exit 1
          fi
