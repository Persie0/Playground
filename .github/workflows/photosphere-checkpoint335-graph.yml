name: Photosphere checkpoint335 original graph candidate provenance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint335-graph.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint335-graph
  cancel-in-progress: false
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Pinned private research checkout read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 499540dd850d06d989db15a28c663debfa1d51ad
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify source and install decoder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "499540dd850d06d989db15a28c663debfa1d51ad"
          python3 -m pip install --quiet --break-system-packages capstone unicorn pyelftools
      - name: Fetch original APK and checksum pinned ARM64 ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Source-disassemble original native triplet graph functions
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint335/inspect_original_graph_triplets.py original.so --output checkpoint335-functions.json | tee checkpoint335-original-inspection.log
          grep -q '^CHECKPOINT335_SOURCE_FUNCTION_SCAN_PASS 4' checkpoint335-original-inspection.log
      - name: Archive nonproprietary result, no original executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-checkpoint335-native-evidence
          path: |
            checkpoint335-functions.json
            checkpoint335-original-inspection.log
            checkpoint335-triplets.json
            checkpoint335-triplets.log
          if-no-files-found: warn
          retention-days: 7
