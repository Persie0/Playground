name: PDF Studio latest UX widget tests
# Validate injected-library home UX widget tests without filesystem dependencies.
on:
  push:
    paths:
      - .github/workflows/pdfapp-ui-quick.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-studio-ux-widget-tests
  cancel-in-progress: true

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current PDF Studio UX branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/pdfapp
          ref: feature/impeccable-ux-overhaul
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze and test all UI flows
        run: |
          flutter pub get
          flutter analyze
          flutter test
