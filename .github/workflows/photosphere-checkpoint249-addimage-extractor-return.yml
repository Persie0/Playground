name: Photo Sphere checkpoint249 original AddImage extractor-to-wrapper return
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint249-addimage-extractor-return.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-addimage-rosette-ray:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 5e07da32197019ea4e2849e70a075eca7c69db99
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify exact research commit
        run: test "$(git rev-parse HEAD)" = "5e07da32197019ea4e2849e70a075eca7c69db99"
      - name: Install original ARM64 emulation dependencies
        run: python3 -m pip install --break-system-packages --quiet -r research/photosphere/checkpoint218/requirements.txt
      - name: Fetch exact source GCam ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Execute original AddImage through native extractor wrapper return
        run: |
          set -euo pipefail
          if ! python3 research/photosphere/checkpoint249/native_addimage_extractor_return.py > checkpoint249-rosette.log 2> checkpoint249-rosette.stderr; then
            echo 'CHECKPOINT249_NATIVE_ERROR_TRACE'
            tail -n 120 checkpoint249-rosette.stderr || true
            echo 'CHECKPOINT249_NATIVE_STDOUT_TAIL'
            tail -n 60 checkpoint249-rosette.log || true
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=Path('checkpoint249-rosette.log').read_text()
          d=json.loads(s.split('CHECKPOINT249_NATIVE_ADDIMAGE_FEATURE_BEGIN\n')[1].split('\nCHECKPOINT249_NATIVE_ADDIMAGE_FEATURE_END')[0])
          assert d['elf_sha256']=='878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1'
          assert len(d['cases'])==2
          print('CHECKPOINT249_ORIGINAL_COUNTS_PRECHECK',[(c['name'],c['terminated_at'],c['native_detector_level_counts'],[v['count'] for v in c['native_converter_features']]) for c in d['cases']],flush=True)
          for c in d['cases']:
              assert c['terminated_at']=='0x11d9cc'
              assert c['native_addimage_wrapper_return']
              assert c['native_extractor_scheduler_done']
              assert c['original_wrapper_entered']
              assert len(c['rosette_native_clones'])==2
              assert c['native_pyramid_dimensions'][0]==c['synthetic_pixels']['shape']
              assert len(c['native_detector_level_counts'])==3
              assert len(c['native_converter_features'])==3
          a,b=d['cases']
          assert [x['count'] for x in a['native_converter_features']]==[9,0,0]
          assert [x['count'] for x in b['native_converter_features']]==[47,0,0]
          Path('checkpoint249-addimage-features.json').write_text(json.dumps(d,indent=2)+'\n')
          print('CHECKPOINT249_ORIGINAL_FEATURE_ORACLE_BEGIN')
          print(json.dumps(d,separators=(',',':')))
          print('CHECKPOINT249_ORIGINAL_FEATURE_ORACLE_END')
          print('CHECKPOINT249_CASE_COUNTS',[(c['name'],c['native_detector_level_counts'],[x['count'] for x in c['native_converter_features']]) for c in d['cases']])
          PY
      - name: Verify original extractor return preserves every checkpoint248 native descriptor
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('checkpoint249-addimage-features.json').read_text())
          old=json.loads(Path('research/photosphere/checkpoint248/native-addimage-full-feature-oracle.json').read_text())
          assert len(d['cases'])==len(old['cases'])==2
          for a,b in zip(d['cases'],old['cases']):
              assert a['name']==b['name']
              assert a['native_detector_level_counts']==b['native_detector_level_counts']
              assert a['native_pyramid_dimensions']==b['native_pyramid_dimensions']
              assert a['native_converter_features']==b['native_converter_features']
              assert a['native_addimage_wrapper_return']
          print('CHECKPOINT249_NATIVE_WRAPPER_RETURN_VALIDATED',len(d['cases']),sum(x['count'] for c in d['cases'] for x in c['native_converter_features']))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint249-original-addimage-features
          path: |
            checkpoint249-addimage-features.json
            checkpoint249-rosette.log
            checkpoint249-rosette.stderr
          retention-days: 14
          if-no-files-found: warn
