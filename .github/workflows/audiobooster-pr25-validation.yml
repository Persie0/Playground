name: AudioBooster PR25 Android validation
# Final validation of the latest PR branch after radio-group semantics and rotation-state fixes.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audiobooster-pr25-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audiobooster-pr25-validation
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout private AudioBooster PR branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: impeccable/audio-ux-accessibility-20261122
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-37.0' 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile, run unit tests, and lint debug variant
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
