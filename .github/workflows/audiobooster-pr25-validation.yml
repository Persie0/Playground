name: AudioBooster PR25 Android validation
# Final validation after native screenshot review: balanced onboarding and succinct privacy details.
# Public-only validation for private AudioBooster UX changes (no private Actions minutes).

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audiobooster-pr25-validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audiobooster-pr25-validation
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout private AudioBooster PR branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: impeccable/audio-ux-accessibility-20261122
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-37.0' 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile, run unit tests, and lint debug variant
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:compileDebugKotlin :app:testDebugUnitTest :app:assembleDebug :app:lintDebug

      - name: Enable KVM acceleration for emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          ls -l /dev/kvm || true

      - name: Validate UI on emulator with normal and large dark text
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night no
            ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=com.persie0.audiobooster.ui
            adb shell settings put system font_scale 1.3
            adb shell cmd uimode night yes
            ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.package=com.persie0.audiobooster.ui
