name: RepForge Flutter Android and iOS bootstrap validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/repforge-flutter-validation.yml

permissions:
  contents: read

jobs:
  android:
    name: Flutter analysis, tests, Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Check out private RepForge branch without storing credentials
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Missing private repository read token'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth 1 --branch feat/flutter-app-bootstrap \
            https://github.com/Persie0/gameexercise.git source
          test -s source/pubspec.yaml
      - name: Flutter static checks
        working-directory: source
        run: |
          flutter --version
          flutter pub get
          dart format lib test
          flutter analyze
          flutter test
      - name: Android debug APK compile
        working-directory: source
        run: |
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
          echo 'Android debug APK build completed successfully'
      - name: Verify expected permissions and identifier
        working-directory: source
        run: |
          grep -F 'com.persie.repforge' android/app/build.gradle.kts
          ! grep -R -E 'USE_EXACT_ALARM|SCHEDULE_EXACT_ALARM|AlarmKit|NativeAlarmEngine' android/app/src/main ios/Runner || exit 1

      - name: Persist Dart formatter and dependency lockfile to feature branch
        if: success()
        working-directory: source
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git add pubspec.lock lib test
          if git diff --cached --quiet; then
            echo 'No format or dependency lockfile changes'
            exit 0
          fi
          git config user.name 'RepForge CI'
          git config user.email 'repforge-ci@users.noreply.github.com'
          git commit -m 'chore: format Dart source and pin Flutter dependencies'
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push origin HEAD:refs/heads/feat/flutter-app-bootstrap

  ios:
    name: iOS simulator compile
    needs: android
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Check out private RepForge branch without storing credentials
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Missing private repository read token'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth 1 --branch feat/flutter-app-bootstrap \
            https://github.com/Persie0/gameexercise.git source
          test -s source/pubspec.yaml
      - name: Build unsigned iOS simulator app
        working-directory: source
        run: |
          xcodebuild -version
          flutter pub get
          flutter test
          flutter build ios --simulator --no-codesign
          test -d build/ios/iphonesimulator/Runner.app
          echo 'iOS simulator compile completed successfully'
