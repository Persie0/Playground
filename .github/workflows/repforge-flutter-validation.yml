# Step 19 German/English, privacy and offline data-sharing validation (public runner only).
name: RepForge Flutter Android and iOS integration validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/repforge-flutter-validation.yml
      - repforge-flutter-trigger.txt

permissions:
  contents: read

jobs:
  android:
    name: Flutter analysis, tests, Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Check out private RepForge branch without storing credentials
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Missing private repository read token'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth 1 --branch feat/step19-localization-privacy-access \
            https://github.com/Persie0/gameexercise.git source
          test -s source/pubspec.yaml
      - name: Flutter static checks
        working-directory: source
        run: |
          flutter --version
          flutter pub get
          dart run build_runner build
          dart format lib test
          flutter analyze
          # Keep a failing widget test from flooding publicly visible job logs.
          # An isolated failure is reported with useful assertions and its tail.
          run_test() {
            name="$1"; shift
            output="/tmp/repforge_${name}.log"
            if timeout 90s flutter test --reporter expanded "$@" > "$output" 2>&1; then
              tail -n 8 "$output"
            else
              echo "Failed test group: $name; first diagnostics:"
              head -n 140 "$output" | cut -c 1-300
              echo "Last diagnostics:"
              tail -n 24 "$output" | cut -c 1-300
              exit 1
            fi
          }
          run_test repository test/forge_step19_archive_share_test.dart
          run_test widgets test/forge_step19_localization_test.dart
          run_test legacy_exercise_library test/exercise_library_screen_test.dart
          run_test legacy_library test/exercise_library_screen_test.dart
          run_test full_suite
      - name: Android debug APK compile
        working-directory: source
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            if flutter build apk --debug > /tmp/repforge_android_build.log 2>&1; then
              tail -n 25 /tmp/repforge_android_build.log
              test -s build/app/outputs/flutter-apk/app-debug.apk
              echo 'Android debug APK build completed successfully'
              break
            fi
            # Do not rerun source/Gradle errors. Maven's HTTP 429 is a
            # transient upstream limit after multiple public CI attempts.
            if ! grep -qE 'Received status code 429|Too Many Requests' /tmp/repforge_android_build.log; then
              tail -n 120 /tmp/repforge_android_build.log
              exit 1
            fi
            if [ "$attempt" -eq 4 ]; then
              echo 'Maven Central still rate-limited after bounded retries'
              tail -n 80 /tmp/repforge_android_build.log
              exit 1
            fi
            delay=$((attempt * 40))
            echo "Upstream Maven HTTP 429; retrying build after ${delay}s (attempt ${attempt}/4)"
            sleep "$delay"
          done
      - name: Verify expected permissions and identifier
        working-directory: source
        run: |
          grep -F 'com.persie.repforge' android/app/build.gradle.kts
          ! grep -R -E 'USE_EXACT_ALARM|SCHEDULE_EXACT_ALARM|AlarmKit|NativeAlarmEngine' android/app/src/main ios/Runner || exit 1

      - name: Persist Dart formatter and dependency lockfile to feature branch
        if: success()
        working-directory: source
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git add pubspec.lock lib test
          if git diff --cached --quiet; then
            echo 'No format or dependency lockfile changes'
            exit 0
          fi
          git config user.name 'RepForge CI'
          git config user.email 'repforge-ci@users.noreply.github.com'
          git commit -m 'chore: format Dart source and pin Flutter dependencies'
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            push origin HEAD:refs/heads/feat/step19-localization-privacy-access

  ios:
    name: iOS simulator compile
    needs: android
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true
      - name: Check out private RepForge branch without storing credentials
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Missing private repository read token'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 | tr -d '\n')"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth 1 --branch feat/step19-localization-privacy-access \
            https://github.com/Persie0/gameexercise.git source
          test -s source/pubspec.yaml
      - name: Build unsigned iOS simulator app
        working-directory: source
        run: |
          xcodebuild -version
          flutter pub get
          flutter test --reporter expanded 2>&1 | tail -n 30
          flutter build ios --simulator --no-codesign
          test -d build/ios/iphonesimulator/Runner.app
          echo 'iOS simulator compile completed successfully'
