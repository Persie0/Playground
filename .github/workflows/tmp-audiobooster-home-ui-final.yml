name: Temporary AudioBooster home UI final gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-audiobooster-home-ui-final.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Check out AudioBooster feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: feature/home-history-player-help
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: audiobooster
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: audiobooster-home-ui-${{ runner.os }}-v1
      - name: Install dependencies
        working-directory: audiobooster
        run: flutter pub get
      - name: Verify requested UI structure and asset placement
        working-directory: audiobooster
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/audio_player_example.webp
          grep -q "assets/audio_player_example.webp" pubspec.yaml
          grep -q "assets/audio_player_example.webp" lib/home/setup_media_app_sheet.dart
          ! grep -q "audio_player_example" lib/home/booster_home.dart
          ! grep -q "appBar: AppBar" lib/home/booster_home.dart
          ! grep -q "power_settings_new_rounded" lib/home/booster_home.dart
          grep -q "home-settings-button" lib/home/booster_home.dart
          grep -q "apps.take(3)" lib/home/booster_home.dart
          grep -q "app.packageName\|_supportedApps\[index\].packageName" lib/home/booster_home.dart
      - name: Run all Flutter tests
        working-directory: audiobooster
        run: flutter test
      - name: Analyze
        working-directory: audiobooster
        run: flutter analyze
      - name: Bootstrap Android twice
        working-directory: audiobooster
        run: |
          bash tool/bootstrap_android.sh
          bash tool/bootstrap_android.sh
      - name: Android tests and instrumentation compilation
        working-directory: audiobooster/android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebugAndroidTest
      - name: Build debug APK
        working-directory: audiobooster
        run: flutter build apk --debug
