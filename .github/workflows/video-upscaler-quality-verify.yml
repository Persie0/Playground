name: Video Upscaler quality and stabilization verification
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/video-upscaler-quality-verify.yml
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout private video upscaler improvement branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/video_upscaler_android
          ref: fix/detail-boost-stabilization-quality
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: appsrc
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 37
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-37.0' || "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-37'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile and run unit tests
        working-directory: appsrc
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - name: Validate GPU shaders
        working-directory: appsrc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y glslang-tools
          for shader in app/src/main/assets/shaders/*.comp; do glslangValidator -S comp "$shader"; done
          for shader in app/src/main/assets/shaders/*.frag; do glslangValidator -S frag "$shader"; done
          glslangValidator -S vert app/src/main/assets/shaders/quad.vert
      - name: Publish APK and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-upscaler-quality-debug
          path: |
            appsrc/app/build/outputs/apk/debug/app-debug.apk
            appsrc/app/build/reports/tests/
          if-no-files-found: warn
