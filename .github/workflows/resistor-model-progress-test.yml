name: Resistor model progress TDD check

on:
  push:
    branches: [resistor-dataset-train]
    paths:
      - .github/workflows/resistor-model-progress-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Checkout resistor_model progress branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/resistor_model
          ref: feat/live-training-progress
          path: resistor_model
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: resistor_model/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './resistor_model[dev]'
      - name: Progress tests
        working-directory: resistor_model
        run: pytest -q tests/test_progress.py
