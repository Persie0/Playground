name: Traffic background paired microbenchmark

on:
  push:
    branches:
      - perf/traffic-runtime-optimization
    paths:
      - ".github/workflows/traffic-background-microbenchmark.yml"
      - ".github/runtime-background-bench-trigger.txt"

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/traffic-counting-light-main
  CANDIDATE_REF: perf/runtime-optimization

jobs:
  paired-background:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout private baseline
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: baseline

      - name: Checkout private candidate
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.CANDIDATE_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: candidate

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused background benchmark dependencies
        run: python -m pip install "numpy>=2.2,<2.5"

      - name: Run baseline background benchmark
        run: |
          mkdir -p runtime-background-results
          BASE_SHA="$(git -C baseline rev-parse HEAD)"
          PYTHONPATH="$PWD/baseline/edge/src:$PWD/candidate" BASE_SHA="$BASE_SHA" python - <<'PY'
          import json, os
          from pathlib import Path
          from benchmarks.runtime_perf.background_cases import BACKGROUND_CASE_FACTORIES
          from benchmarks.runtime_perf.run_suite import build_suite
          result = build_suite(
              BACKGROUND_CASE_FACTORIES,
              sha=os.environ["BASE_SHA"],
              profile="hosted",
              rounds=5,
              iterations=100,
              warmups=10,
          )
          Path("runtime-background-results/baseline.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Run candidate background benchmark
        run: |
          CANDIDATE_SHA="$(git -C candidate rev-parse HEAD)"
          PYTHONPATH="$PWD/candidate/edge/src:$PWD/candidate" CANDIDATE_SHA="$CANDIDATE_SHA" python - <<'PY'
          import json, os
          from pathlib import Path
          from benchmarks.runtime_perf.background_cases import BACKGROUND_CASE_FACTORIES
          from benchmarks.runtime_perf.run_suite import build_suite
          result = build_suite(
              BACKGROUND_CASE_FACTORIES,
              sha=os.environ["CANDIDATE_SHA"],
              profile="hosted",
              rounds=5,
              iterations=100,
              warmups=10,
          )
          Path("runtime-background-results/candidate.json").write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Compare background benchmark
        run: |
          PYTHONPATH="$PWD/candidate/edge/src:$PWD/candidate" \
          python candidate/benchmarks/runtime_perf/compare.py \
            --baseline runtime-background-results/baseline.json \
            --candidate runtime-background-results/candidate.json \
            --json runtime-background-results/comparison.json \
            --markdown runtime-background-results/comparison.md
          cat runtime-background-results/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload background comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traffic-background-runtime-comparison
          path: runtime-background-results/
          if-no-files-found: warn
