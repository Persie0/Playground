name: Resistor model final merge gate

on:
  workflow_dispatch:
  push:
    branches: [resistor-dataset-train]
    paths:
      - .github/workflows/resistor-model-final-gate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Checkout resistor_model feature branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/resistor_model
          ref: feat/training-stack
          path: resistor_model
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: resistor_model/pyproject.toml

      - name: Install training and export stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e './resistor_model[dev,export]'

      - name: Download private annotated dataset
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_TOKEN"
          curl --fail --location --retry 3 --retry-delay 2 \
            -H "Authorization: Bearer $PRIVATE_TOKEN" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/Persie0/resistor_scanner/contents/rres.v4i.yolov8.zip?ref=tflite" \
            -o /tmp/rres-yolo.zip
          mkdir -p /tmp/rres
          unzip -q /tmp/rres-yolo.zip -d /tmp/rres

      - name: Unit tests and compile check
        working-directory: resistor_model
        run: |
          pytest -q
          python -m compileall -q src

      - name: Import audit and leakage-safe splits
        run: |
          set -euo pipefail
          python -m resistor_model.tools.import_roboflow_yolo \
            --root /tmp/rres \
            --output /tmp/rres/manifest.jsonl \
            --min-bands 3 --max-bands 6 | tee /tmp/import-report.json
          python -m resistor_model.tools.audit_dataset \
            --manifest /tmp/rres/manifest.jsonl \
            --image-root /tmp/rres \
            --output /tmp/audit-report.json
          python -m resistor_model.tools.make_splits \
            --manifest /tmp/rres/manifest.jsonl \
            --output /tmp/rres/splits.json \
            --ratios 0.70 0.15 0.15 \
            --seed 42 --group-session

      - name: Verify split isolation coverage and decoder ambiguity
        run: |
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          from resistor_model.constants import INDEX_TO_COLOR
          from resistor_model.data.dataset import ResistorBandDataset
          from resistor_model.decoder import _decode_one

          manifest = Path('/tmp/rres/manifest.jsonl')
          rows = [json.loads(line) for line in manifest.read_text().splitlines() if line.strip()]
          splits = json.loads(Path('/tmp/rres/splits.json').read_text())
          id_to_split = {}
          for split, ids in splits.items():
              for rid in ids:
                  if rid in id_to_split:
                      raise AssertionError(f'resistor/source id in multiple splits: {rid}')
                  id_to_split[rid] = split

          session_splits = defaultdict(set)
          colors = {name: Counter() for name in ('train', 'val', 'test')}
          counts = {name: Counter() for name in ('train', 'val', 'test')}
          for row in rows:
              row_splits = set()
              for resistor in row['resistors']:
                  split = id_to_split.get(resistor['id'])
                  if split is None:
                      raise AssertionError(f"unassigned resistor/source id: {resistor['id']}")
                  row_splits.add(split)
                  counts[split][len(resistor['bands'])] += 1
                  colors[split].update(b['color'] for b in resistor['bands'])
              if len(row_splits) != 1:
                  raise AssertionError(f'image spans splits: {row["image"]} -> {row_splits}')
              if row.get('session_id') is not None:
                  session_splits[row['session_id']].update(row_splits)

          leaking = {k: sorted(v) for k, v in session_splits.items() if len(v) > 1}
          if leaking:
              raise AssertionError(f'capture/session leakage: {list(leaking.items())[:5]}')

          # Require broad held-out coverage for the colors with substantial support.
          total = Counter()
          for c in colors.values(): total.update(c)
          common = {c for c, n in total.items() if n >= 80}
          for split in ('val', 'test'):
              missing = sorted(c for c in common if colors[split][c] == 0)
              if missing:
                  raise AssertionError(f'{split} missing common colors: {missing}')
              if not counts[split][4] or not counts[split][5]:
                  raise AssertionError(f'{split} lacks 4/5-band coverage: {dict(counts[split])}')

          # Quantify color-only electrical-direction ambiguity after actual rectification.
          ds = ResistorBandDataset(manifest, '/tmp/rres', output_size=(64, 384), sequence_bins=96, max_bands=6, augment=False)
          ambiguous = Counter()
          unambiguous = Counter()
          for sample in ds:
              n = int(sample['count'])
              seq = [INDEX_TO_COLOR[int(x)] for x in sample['slot_colors'][:n].tolist()]
              forward = _decode_one(seq)
              reverse = _decode_one(list(reversed(seq)))
              if forward.valid and reverse.valid:
                  f = (forward.ohms, forward.tolerance_percent, forward.tempco_ppm)
                  r = (reverse.ohms, reverse.tolerance_percent, reverse.tempco_ppm)
                  if f != r:
                      ambiguous[n] += 1
                  else:
                      unambiguous[n] += 1
              elif forward.valid or reverse.valid:
                  unambiguous[n] += 1

          print('SPLIT_SIZES', {k: len(v) for k, v in splits.items()})
          print('COLOR_COUNTS', {k: dict(v) for k, v in colors.items()})
          print('BAND_COUNTS', {k: dict(v) for k, v in counts.items()})
          print('CAPTURE_GROUPS', len(session_splits), 'LEAKING', len(leaking))
          print('AMBIGUOUS_VALUE_DIRECTION', dict(ambiguous))
          print('UNAMBIGUOUS_VALUE_DIRECTION', dict(unambiguous))
          PY

      - name: Real-data train validation evaluation and ONNX smoke
        run: |
          python - <<'PY'
          import yaml
          cfg = {
            'seed': 42,
            'data': {
              'manifest': '/tmp/rres/manifest.jsonl', 'image_root': '/tmp/rres',
              'splits_file': '/tmp/rres/splits.json', 'output_size': [64, 384],
              'sequence_bins': 96, 'group_session': True,
              'split_ratios': [0.70, 0.15, 0.15], 'num_workers': 2,
            },
            'model': {
              'num_colors': 12, 'max_bands': 6, 'base_channels': 16,
              'd_model': 64, 'transformer_layers': 1, 'transformer_heads': 4,
              'slot_decoder_layers': 1, 'dropout': 0.10, 'use_chromatic_branch': True,
            },
            'train': {
              'epochs': 1, 'batch_size': 8, 'lr': 3e-4, 'weight_decay': 0.05,
              'warmup_epochs': 0, 'grad_clip': 1.0, 'amp': False,
              'ema_decay': 0.99, 'output_dir': '/tmp/runs/final-gate', 'resume': None,
            },
            'loss': {
              'dense': 1.0, 'color': 2.0, 'exist': 0.5, 'center': 1.0,
              'width': 0.5, 'order': 0.2, 'count': 0.2,
              'consistency': 0.05, 'body_class_weight': 0.25,
            },
          }
          with open('/tmp/final-gate.yaml', 'w') as f:
              yaml.safe_dump(cfg, f, sort_keys=False)
          PY
          python -m resistor_model.train --config /tmp/final-gate.yaml --smoke
          python -m resistor_model.evaluate \
            --checkpoint /tmp/runs/final-gate/best.pt \
            --manifest /tmp/rres/manifest.jsonl \
            --image-root /tmp/rres --split test --batch-size 16 \
            | tee /tmp/test-metrics.txt
          python -m resistor_model.export \
            --checkpoint /tmp/runs/final-gate/best.pt \
            --output /tmp/runs/final-gate/model.onnx
          test -s /tmp/runs/final-gate/model.onnx
          test -s /tmp/runs/final-gate/model.onnx.json

      - name: Upload final gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resistor-model-final-gate-${{ github.run_id }}
          path: |
            /tmp/import-report.json
            /tmp/audit-report.json
            /tmp/rres/splits.json
            /tmp/runs/final-gate/metrics.jsonl
            /tmp/test-metrics.txt
            /tmp/runs/final-gate/model.onnx.json
          if-no-files-found: warn
          retention-days: 14
