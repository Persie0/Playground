name: Temporary R8 gate TDD

on:
  push:
    paths:
      - '.github/workflows/tmp-r8-gate-red-green.yml'

# Green phase: production gate now exists on the builder branch.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout firebase tester builder branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/firebase_tester_builder
          ref: feat/global-r8-25-gate
      - name: Run R8 gate unit tests
        run: python3 -m unittest -v tests/test_verify_r8_min_scores.py
