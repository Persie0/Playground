name: Temporary R8 gate TDD

on:
  push:
    paths:
      - '.github/workflows/tmp-r8-gate-red-green.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged firebase tester builder
        uses: actions/checkout@v5
        with:
          repository: Persie0/firebase_tester_builder
          ref: main
      - name: Run R8 gate tests
        run: python3 -m unittest discover -v tests
