name: Photosphere checkpoint302 original seed inputs
on:
  push:
    branches: [research/photosphere-checkpoint302-seed-inputs]
    paths: ['.github/workflows/photosphere-checkpoint302-seed-inputs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-seed-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install original ELF disassembler
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools
      - name: Download and SHA-verify original GCam 8.8.225 ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Disassemble BOTH original callers into seed entry at 0x2d70a4
        run: |
          python3 - <<'PY' | tee checkpoint302-seed-callers.log
          from pathlib import Path
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM
          import hashlib
          elf=Path("original.so").read_bytes()
          assert hashlib.sha256(elf).hexdigest()=="878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1"
          d=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          entry=0x2d70a4
          for caller in (0x2d41d8,0x2d4e3c):
              instr=list(d.disasm(elf[caller:caller+4],caller))
              assert len(instr)==1 and instr[0].mnemonic=="bl" and instr[0].op_str==f"#0x{entry:x}",instr
              print("CHECKPOINT302_CALLER",hex(caller),"bl",hex(entry))
              start=caller-0x220
              end=caller+0x50
              for i in d.disasm(elf[start:end],start):
                  print(f"{i.address:#010x} {i.mnemonic:8} {i.op_str}")
              print("CHECKPOINT302_CALLER_END",hex(caller))
          PY
          grep -q '^CHECKPOINT302_CALLER 0x2d41d8' checkpoint302-seed-callers.log
          grep -q '^CHECKPOINT302_CALLER 0x2d4e3c' checkpoint302-seed-callers.log
      - name: Trace config register and seed field initialization inside original constructor
        run: |
          python3 - <<'PY' | tee checkpoint302-seed-field.log
          from pathlib import Path
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM
          elf=Path("original.so").read_bytes()
          d=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          for i in d.disasm(elf[0x2d3d98:0x2d40a0],0x2d3d98):
              print(f"{i.address:#010x} {i.mnemonic:8} {i.op_str}")
          PY
          grep -q '^0x002d3ff0 str      x8, \[x19, #0x60\]' checkpoint302-seed-field.log
          grep -q '^0x002d4068 str      x10, \[x19, #0x60\]' checkpoint302-seed-field.log
      - name: Checkout exact checkpoint302 research commit
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 51a2dc1dd59f2b818192aac2ed022fbf547268f8
          path: research
          sparse-checkout: |
            research/photosphere/checkpoint302
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Validate exact original seed-config source pins and caller count
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 51a2dc1dd59f2b818192aac2ed022fbf547268f8
          python3 research/research/photosphere/checkpoint302/verify_original_seed_config.py original.so --output checkpoint302-seed-config.json | tee checkpoint302-verifier.log
          grep -q '^CHECKPOINT302_ORIGINAL_SOURCE_PINS_PASSED' checkpoint302-verifier.log
      - name: Checkout pinned checkpoint302 Rust port
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 7e332874cf2f0c177f64be0306b57debc0cdd378
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Run original-seed Rust regression and complete library tests
        working-directory: app
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7e332874cf2f0c177f64be0306b57debc0cdd378
          git diff --check
          rustfmt --edition 2021 --check src/native_rng_seed.rs
          cargo test --lib checkpoint302_ -- --nocapture
          cargo test --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint302-original-seed-callers
          path: |
            checkpoint302-seed-callers.log
            checkpoint302-seed-field.log
            checkpoint302-seed-config.json
            checkpoint302-verifier.log
          retention-days: 14
