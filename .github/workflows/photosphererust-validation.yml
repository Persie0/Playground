name: PhotosphereRust validation

on:
  push:
    paths:
      - ".github/workflows/photosphererust-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PhotosphereRust
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereRust
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: PhotosphereRust

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,aarch64-apple-ios

      - name: Test default feature set
        working-directory: PhotosphereRust
        run: cargo test --all-targets

      - name: Test portable JPEG fallback
        working-directory: PhotosphereRust
        run: cargo test --all-targets --no-default-features

      - name: Check Android JNI feature on host
        working-directory: PhotosphereRust
        run: cargo check --features android-jni

      - name: Check ARM64 Android
        working-directory: PhotosphereRust
        run: cargo check --release --target aarch64-linux-android --features android-jni

      - name: Check ARM64 iOS
        working-directory: PhotosphereRust
        run: cargo check --release --target aarch64-apple-ios

      - name: Build optimized release
        working-directory: PhotosphereRust
        run: cargo build --release
