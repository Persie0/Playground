# trigger: photosphererust-checkpoint82-2026-10-08-2023
name: PhotosphereRust validation

on:
  push:
    paths:
      - ".github/workflows/photosphererust-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PhotosphereRust
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereRust
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: PhotosphereRust

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,aarch64-apple-ios

      - name: Test default feature set
        working-directory: PhotosphereRust
        run: cargo test --all-targets

      - name: Stress quality-equivalent render paths
        working-directory: PhotosphereRust
        run: |
          cargo test --release --test smoke direct_and_bounded_paths_are_pixel_equivalent -- --exact
          cargo test --release --test smoke grouped_bounded_path_matches_direct_pixels -- --exact
          cargo test --release --test smoke cropped_exposure_matches_full_decode_reference -- --exact
          for i in 1 2 3 4 5; do
            cargo test --release --test smoke direct_and_bounded_paths_are_pixel_equivalent -- --exact
            cargo test --release --test smoke serial_and_parallel_exposure_paths_are_pixel_equivalent -- --exact
            cargo test --release --test smoke heap_and_file_backed_output_are_pixel_equivalent -- --exact
            cargo test --release --test smoke cropped_and_full_exposure_paths_are_pixel_equivalent -- --exact
          done

      - name: Test portable JPEG fallback
        working-directory: PhotosphereRust
        run: cargo test --all-targets --no-default-features

      - name: Test fast JPEG without mmap
        working-directory: PhotosphereRust
        run: cargo test --all-targets --no-default-features --features fast-jpeg

      - name: Test mmap output without fast JPEG
        working-directory: PhotosphereRust
        run: cargo test --all-targets --no-default-features --features mmap-output

      - name: Check Android JNI feature on host
        working-directory: PhotosphereRust
        run: cargo check --features android-jni

      - name: Check ARM64 Android
        working-directory: PhotosphereRust
        run: cargo check --release --target aarch64-linux-android --features android-jni

      - name: Check ARM64 iOS
        working-directory: PhotosphereRust
        run: cargo check --release --target aarch64-apple-ios

      - name: Build optimized release
        working-directory: PhotosphereRust
        run: cargo build --release

      - name: Benchmark render paths
        working-directory: PhotosphereRust
        run: cargo run --release --example synthetic_bench

      - name: Benchmark phone-sized JPEG cache
        working-directory: PhotosphereRust
        run: cargo run --release --example phone_source_bench
