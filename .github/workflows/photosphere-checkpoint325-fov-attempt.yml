name: Photosphere checkpoint325 original FOV estimator
on:
  push:
    branches: [research/photosphere-checkpoint325-fov-attempt]
    paths: [.github/workflows/photosphere-checkpoint325-fov-attempt.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-fov-attempt:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install source original machine code inspection
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools unicorn
      - name: Download and verify exact original GCam ARM64 binary
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk'
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Read only source research checkout
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 0949090c2265638d02562f6aa23053fb2e90abc8
          path: research
          sparse-checkout: |
            research/photosphere/checkpoint325
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Inspect original FOV estimator and pair status gates
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = 0949090c2265638d02562f6aa23053fb2e90abc8
          python3 research/research/photosphere/checkpoint325/scan_original_attempt.py original.so --output checkpoint325-original-attempt-scan.json | tee checkpoint325-original-attempt-scan.log
          grep -q '^CHECKPOINT325_ORIGINAL_ESTIMATOR_SCAN' checkpoint325-original-attempt-scan.log
          python3 research/research/photosphere/checkpoint325/native_original_pair_status_gate.py original.so --output checkpoint325-original-pair-gate.json | tee checkpoint325-original-pair-gate.log
          grep -q '^CHECKPOINT325_ORIGINAL_PAIR_GATE_PASS' checkpoint325-original-pair-gate.log
          echo CHECKPOINT325_PAIR_GATE_JSON_BEGIN
          cat checkpoint325-original-pair-gate.json
          echo CHECKPOINT325_PAIR_GATE_JSON_END
      - name: Read only checkout checkpoint325 app commit
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 69c95eddfbe82cff219764d426537f2abdb606ac
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Differential newly executed original pair gate with frozen Rust fixture
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = 69c95eddfbe82cff219764d426537f2abdb606ac
          python3 - <<'PY'
          import json
          from pathlib import Path
          original=json.loads(Path("checkpoint325-original-pair-gate.json").read_text())
          frozen=json.loads(Path("app/tests/fixtures/native_original_fov_pair_gate_325.json").read_text())
          assert original==frozen,"fresh GCam ARM64 pair-result gate diverges from Rust fixture"
          assert original["original_case_count"]==11
          assert original["original_opcode_pins"]==17
          assert original["original_virtual_getter_calls"]==10
          assert original["original_full_estimator_executed"] is False
          print("CHECKPOINT325_FRESH_ORIGINAL_RUST_FIXTURE_EQUAL",11,17,10)
          PY
      - name: Run checkpoint325 source gate and full Rust regressions
        run: |
          set -euo pipefail
          cd app
          rustfmt --edition 2021 --check src/native_fov_pair_gate.rs src/native_fov_pair_gate_checkpoint325_test.rs
          cargo test --lib checkpoint325 -- --nocapture
          cargo test --lib
          cargo check --no-default-features
          cargo check --features android-jni
      - name: Read back rustfmt output
        run: |
          echo CHECKPOINT325_RUST_MODULE_BEGIN
          cat app/src/native_fov_pair_gate.rs
          echo CHECKPOINT325_RUST_MODULE_END
          echo CHECKPOINT325_RUST_TEST_BEGIN
          cat app/src/native_fov_pair_gate_checkpoint325_test.rs
          echo CHECKPOINT325_RUST_TEST_END
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint325-original-fov-estimator
          path: |
            checkpoint325-original-attempt-scan.json
            checkpoint325-original-attempt-scan.log
            checkpoint325-original-pair-gate.json
            checkpoint325-original-pair-gate.log
          retention-days: 14
