name: Surebets Impeccable UX validation

on:
  push:
    branches:
      - ci/surebets-impeccable-20261121
    paths:
      - .github/workflows/surebets-impeccable-ux-20261121.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Surebets review branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/surebets_calculator
          ref: design/impeccable-calculator-ux-20261121
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve project dependencies
        run: flutter pub get

      - name: Verify Dart formatting and syntax
        run: |
          dart format lib/calculator_screen.dart lib/widgets/calculation_overview.dart lib/bet_history_screen.dart lib/advanced_screen.dart lib/free_bet_snr_screen.dart lib/free_bet_sr_screen.dart lib/widgets/free_bet_result_card.dart test/calculation_overview_widget_test.dart test/free_bet_result_card_test.dart test/history_screen_dismissal_regression_test.dart
          git diff --check

      - name: Analyze Flutter
        run: flutter analyze --no-fatal-infos

      - name: Run Flutter regression suite
        run: flutter test
