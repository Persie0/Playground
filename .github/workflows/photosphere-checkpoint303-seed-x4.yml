name: Photosphere checkpoint303 original mode2 seed caller provenance
on:
  push:
    branches: [research/photosphere-checkpoint303-seed-x4]
    paths: ['.github/workflows/photosphere-checkpoint303-seed-x4.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint303-seed-x4
  cancel-in-progress: true
jobs:
  original-seed-callers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install native disassembly dependencies
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools
      - name: Download SHA-pinned original GCam APK and ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Inventory direct mode2 constructor wrapper callsites and inspect x4
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee checkpoint303-seed-x4.log
          from pathlib import Path
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          import hashlib, collections
          data=Path("original.so").read_bytes()
          assert hashlib.sha256(data).hexdigest()=="878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1"
          with Path("original.so").open("rb") as f:
              sec=ELFFile(f).get_section_by_name(".text")
              st=int(sec["sh_addr"]); ed=st+int(sec["sh_size"])
              assert st==int(sec["sh_offset"])==0xed630
          d=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          ins=list(d.disasm(data[st:ed],st))
          sites=[0x2d4de4,0x2d3d98,0x2d70a4,0x2d4e28]
          for target in sites:
              direct=[(i.address,i.mnemonic) for i in ins if i.mnemonic in ("bl","b") and i.op_str==f"#0x{target:x}"]
              print("CHECKPOINT303_REFERENCES",hex(target),len(direct),[(hex(a),op) for a,op in direct])
              for pc,op in direct[:30]:
                  print("CHECKPOINT303_CALLER_CONTEXT_START",hex(pc),hex(target))
                  start=max(st,pc-0x100);end=min(ed,pc+0x50)
                  for i in d.disasm(data[start:end],start):
                      print(f"{i.address:#010x} {i.mnemonic:8} {i.op_str}")
                  print("CHECKPOINT303_CALLER_CONTEXT_END",hex(pc),hex(target))
          print("CHECKPOINT303_MODE2_FUNCTION_START")
          for i in d.disasm(data[0x2d4de4:0x2d4f50],0x2d4de4):
              print(f"{i.address:#010x} {i.mnemonic:8} {i.op_str}")
          print("CHECKPOINT303_MODE2_FUNCTION_END")
          print("CHECKPOINT303_ORIGINAL_CALLSITE_SCAN_PASSED",len(ins))
          PY
          grep -q '^CHECKPOINT303_ORIGINAL_CALLSITE_SCAN_PASSED' checkpoint303-seed-x4.log
      - name: Investigate surrounding function boundary and native caller ownership
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee checkpoint303-function-boundary.log
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          d=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          b=Path("original.so").read_bytes()
          with Path("original.so").open("rb") as f:
              image=ELFFile(f)
              print("CHECKPOINT303_UNWIND_SECTIONS",[(x.name,int(x["sh_addr"])) for x in image.iter_sections() if "eh_frame" in x.name or "exidx" in x.name or "symtab" in x.name])
          print("CHECKPOINT303_SURROUNDING_BOUNDARY_START")
          for i in d.disasm(b[0x2bba00:0x2bc100],0x2bba00):
              print(f"{i.address:#010x} {i.mnemonic:8} {i.op_str}")
          print("CHECKPOINT303_SURROUNDING_BOUNDARY_END")
          print("CHECKPOINT303_PRIOR_RET_PROLOGUE_CANDIDATES")
          for i in d.disasm(b[0x2bb000:0x2bc1f4],0x2bb000):
              if i.mnemonic in ("ret","stp","sub") and (i.mnemonic=="ret" or "sp" in i.op_str and ("x29" in i.op_str or "x30" in i.op_str or i.mnemonic=="sub")):
                  if i.address>=0x2bb900:
                      print(f"{i.address:#010x} {i.mnemonic:8} {i.op_str}")
          print("CHECKPOINT303_ORIGINAL_BOUNDARY_SCAN_PASSED")
          PY
          grep -q '^CHECKPOINT303_ORIGINAL_BOUNDARY_SCAN_PASSED' checkpoint303-function-boundary.log
      - name: Recover exact unwind FDE function ownership and direct inbound calls
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee checkpoint303-fde-inbound.log
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE
          with Path("original.so").open("rb") as f:
              elf=ELFFile(f)
              sec=elf.get_section_by_name(".text")
              assert int(sec["sh_addr"])==int(sec["sh_offset"])==0xed630
              entries=elf.get_dwarf_info().EH_CFI_entries()
              frames=sorted((int(e["initial_location"]),int(e["address_range"])) for e in entries if isinstance(e,FDE))
              print("CHECKPOINT303_TOTAL_FDES",len(frames))
              targets=(0x2bc1f4,0x2d4de4,0x2c9c7c,0x2d41d8,0x30f860)
              owners={}
              for target in targets:
                  matched=[(st,n) for st,n in frames if st<=target<st+n]
                  print("CHECKPOINT303_FDE_OWNER",hex(target),[(hex(st),hex(n)) for st,n in matched])
                  if len(matched)==1: owners[target]=matched[0][0]
              b=Path("original.so").read_bytes()
              ins=list(Cs(CS_ARCH_ARM64,CS_MODE_ARM).disasm(b[0xed630:int(sec["sh_addr"])+int(sec["sh_size"])],0xed630))
              for target,entry in owners.items():
                  hits=[(hex(i.address),i.mnemonic) for i in ins if i.op_str==f"#0x{entry:x}" and i.mnemonic in ("bl","b")]
                  print("CHECKPOINT303_FDE_INBOUND",hex(target),"entry",hex(entry),"hits",hits)
                  if target==0x2bc1f4:
                      for site,kind in hits[:20]:
                          pc=int(site,16);print("CHECKPOINT303_UPSTREAM_SITE",site,kind)
                          for i in Cs(CS_ARCH_ARM64,CS_MODE_ARM).disasm(b[pc-0x70:pc+0x30],pc-0x70):
                              print(f"{i.address:#010x} {i.mnemonic:8} {i.op_str}")
              print("CHECKPOINT303_FDE_SCAN_PASSED")
          PY
          grep -q '^CHECKPOINT303_FDE_SCAN_PASSED' checkpoint303-fde-inbound.log
      - name: Trace bounded original direct-call ancestry of seed owner and RANSAC
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee checkpoint303-ancestry.log
          from pathlib import Path
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from elftools.elf.elffile import ELFFile
          from elftools.dwarf.callframe import FDE
          from bisect import bisect_right
          from collections import defaultdict,deque
          with Path("original.so").open("rb") as f:
              e=ELFFile(f);s=e.get_section_by_name(".text")
              st=int(s["sh_addr"]);ed=st+int(s["sh_size"])
              frames=sorted((int(v["initial_location"]),int(v["initial_location"])+int(v["address_range"])) for v in e.get_dwarf_info().EH_CFI_entries() if isinstance(v,FDE))
          starts=[v[0] for v in frames]
          def owner(pc):
              k=bisect_right(starts,pc)-1
              return starts[k] if k>=0 and pc<frames[k][1] else None
          d=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          data=Path("original.so").read_bytes()
          incoming=defaultdict(list)
          for i in d.disasm(data[st:ed],st):
              if i.mnemonic not in ("bl","b") or not i.op_str.startswith("#0x"):continue
              try:dest=int(i.op_str[1:],16)
              except ValueError:continue
              src_fn=owner(i.address); dest_fn=owner(dest)
              if src_fn is None or dest_fn is None or src_fn==dest_fn:continue
              if i.mnemonic=="b" and dest!=dest_fn:continue
              incoming[dest_fn].append((src_fn,i.address,i.mnemonic))
          roots={"mode2_null_wrapper_owner":owner(0x2bc1f4),"other_mode2_constructor_caller":owner(0x2c9c7c),"original_ransac":owner(0x30f860),"ransac_addimage_caller":owner(0x120914)}
          print("CHECKPOINT303_ROOTS",{name:hex(pc) for name,pc in roots.items()})
          all_anc={}
          for name,root in roots.items():
              todo=deque([(root,0)]);seen={root};results=[]
              while todo:
                  cur,depth=todo.popleft()
                  if depth>=6:continue
                  refs=incoming[cur]
                  results.append({"owner":hex(cur),"depth":depth,"direct_inbound_count":len(refs),"refs":[(hex(source),hex(site),kind) for source,site,kind in refs[:25]]})
                  for source,site,kind in refs:
                      if source not in seen:
                          seen.add(source);todo.append((source,depth+1))
                  if len(seen)>180:break
              all_anc[name]=seen
              print("CHECKPOINT303_ANCESTRY",name,"nodes",len(seen),"layers",results[:50])
          for other in ("original_ransac","ransac_addimage_caller"):
              for seed in ("mode2_null_wrapper_owner","other_mode2_constructor_caller"):
                  common=all_anc[seed]&all_anc[other]
                  print("CHECKPOINT303_BOUNDED_DIRECT_INTERSECTION",seed,other,sorted(hex(x) for x in common)[:30])
          print("CHECKPOINT303_ANCESTRY_SCAN_PASSED")
          PY
          grep -q '^CHECKPOINT303_ANCESTRY_SCAN_PASSED' checkpoint303-ancestry.log
      - name: Checkout exact checkpoint303 original research source
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: ec088cab1b6ee413226767f0e54f2b206f5c08b0
          path: research
          sparse-checkout: |
            research/photosphere/checkpoint303
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Run pinned original null-seed provenance verifier
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = ec088cab1b6ee413226767f0e54f2b206f5c08b0
          python3 research/research/photosphere/checkpoint303/verify_original_seed_x4.py original.so --output checkpoint303-original-seed-provenance.json | tee checkpoint303-verifier.log
          grep -q '^CHECKPOINT303_NATIVE_ORIGINAL_VERIFIED' checkpoint303-verifier.log
      - name: Syntax-check bounded optional device provenance trace
        run: |
          set -euo pipefail
          node --check research/research/photosphere/checkpoint303/device-rng-entry-trace.frida.js
          echo CHECKPOINT303_DEVICE_TRACE_SYNTAX_PASSED
      - name: Checkout pinned PhotosphereCleanroom checkpoint303 fixture
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 9db58befe0cae6232ff1e6313482e86c22997cf8
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Compare freshly audited original evidence with Rust fixture and run tests
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = 9db58befe0cae6232ff1e6313482e86c22997cf8
          python3 - <<'PY'
          import json
          from pathlib import Path
          original=json.loads(Path('checkpoint303-original-seed-provenance.json').read_text())
          fixture=json.loads(Path('app/tests/fixtures/native_original_seed_x4_303.json').read_text())
          assert original==fixture, "Rust provenance fixture differs from freshly verified original ELF"
          print('CHECKPOINT303_FRESH_ORIGINAL_RUST_FIXTURE_EQUAL',original['pinned_original_instruction_count'])
          PY
          cd app
          git diff --check
          rustfmt --edition 2021 --check src/native_rng_seed.rs
          cargo test --lib checkpoint303_ -- --nocapture
          cargo test --lib
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint303-seed-x4-source-evidence
          path: |
            checkpoint303-seed-x4.log
            checkpoint303-function-boundary.log
            checkpoint303-fde-inbound.log
            checkpoint303-ancestry.log
            checkpoint303-original-seed-provenance.json
            checkpoint303-verifier.log
          retention-days: 14
