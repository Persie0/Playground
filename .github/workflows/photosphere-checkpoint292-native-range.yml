name: Photosphere checkpoint292 original range-copy ARM64 disassembly
on:
  push:
    branches: [research/photosphere-checkpoint292-native-range-helper]
    paths: ['.github/workflows/photosphere-checkpoint292-native-range.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint292-disassembly
  cancel-in-progress: false
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install original ARM64 decoder
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools
      - name: Download exact GCam 8.8.225 original
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Inspect native helper and exact rosette callers
        run: |
          python3 - <<'PY'
          from capstone import Cs, CS_ARCH_ARM64, CS_MODE_ARM
          import hashlib,json
          from pathlib import Path
          b=Path("original.so").read_bytes()
          assert hashlib.sha256(b).hexdigest()=="878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1"
          d=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          windows={
            "range_helper_0x124510":(0x124510,0x124980),
            "rosette_constructor":(0x343ed0,0x343f70),
            "rosette_plus70":(0x3454c0,0x345530),
            "estimator_addimage_receiver":(0x11d6d0,0x11d718)
          }
          evidence={}
          for name,(start,end) in windows.items():
              ins=[{"pc":hex(i.address),"instruction":i.mnemonic+" "+i.op_str} for i in d.disasm(b[start:end],start)]
              assert ins and ins[0]["pc"]==hex(start)
              evidence[name]=ins
              print("CHECKPOINT292_WINDOW",name,hex(start),hex(end))
              for v in ins: print("CHECKPOINT292_CODE",name,v["pc"],v["instruction"])
          # Direct branch evidence, exact encoding only, not runtime reachability.
          calls=[]
          for i in d.disasm(b[0x2000:0x3f0000],0x2000):
              if i.mnemonic in ("bl","b") and i.op_str=="#0x124510":
                  calls.append({"pc":hex(i.address),"instruction":i.mnemonic+" "+i.op_str})
          print("CHECKPOINT292_DIRECT_BRANCHES",json.dumps(calls))
          evidence["direct_branches"]=calls
          Path("checkpoint292-original-range-instructions.json").write_text(json.dumps({
              "elf_sha256":hashlib.sha256(b).hexdigest(),
              "original_arm64":evidence,
              "native_execution_performed":False
          },indent=2)+"\n")
          print("CHECKPOINT292_ORIGINAL_RANGE_DISASSEMBLY_PASS")
          PY
      - name: Checkout checkpoint292 emulator experiment (no private Actions)
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 4d0a74ecfee4d2e602f9cb7d56ab3656e7eaf8f5
          path: research-source
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Execute original ARM64 vector assignment on bounded fixtures
        run: |
          set -euo pipefail
          test "$(git -C research-source rev-parse HEAD)" = 4d0a74ecfee4d2e602f9cb7d56ab3656e7eaf8f5
          python3 -m pip install --break-system-packages --quiet unicorn
          mkdir -p research-source/research/native
          cp original.so research-source/research/native/liblightcycle.so
          cd research-source
          python3 research/photosphere/checkpoint292/native_original_pose_vector_assign.py | tee ../checkpoint292-native-pose-vector.log
          grep -q 'CHECKPOINT292_NATIVE_POSE_VECTOR_CASES_PASSED 10' ../checkpoint292-native-pose-vector.log
          cp checkpoint292-native-pose-vector-fixtures.json ..
      - name: Checkout exact PhotosphereCleanroom Rust checkpoint292 commit
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 7e047bf2aad65190c37b942d8f03112217eff0db
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Validate scoped Rust pose-vector fixture and entire Rust library
        working-directory: app
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 7e047bf2aad65190c37b942d8f03112217eff0db
          git diff --check
          rustfmt --edition 2021 --check src/native_rosette_pose_vector.rs
          cargo test --lib checkpoint292_original_native_pose_vector_assignment_matches_all_cases -- --nocapture
          cargo test --lib
      - name: Archive only text disassembly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint292-original-range-helper-disassembly
          path: |
            checkpoint292-original-range-instructions.json
            checkpoint292-native-pose-vector-fixtures.json
            checkpoint292-native-pose-vector.log
          if-no-files-found: warn
          retention-days: 14
