name: Image Enhancer app audit 2026-09-04

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/image-enhancer-app-audit-2026-09-04.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/image_enhancer
  TARGET_BRANCH: fix/app-audit-2026-09-04

jobs:
  audit-fix-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Checkout private Image Enhancer
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply audit fixes
        working-directory: app
        run: |
          set -euo pipefail
          git checkout -B "$TARGET_BRANCH"
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, value):
              Path(path).write_text(value)

          def replace_once(value, old, new, label):
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 anchor, found {count}')
              return value.replace(old, new, 1)

          # RevenueCat: only the app's actual entitlement grants Pro. Also keep
          # verbose RevenueCat logging out of production builds.
          p = 'lib/services/subscription_service.dart'
          s = read(p)
          s = replace_once(
              s,
              '    await Purchases.setLogLevel(LogLevel.debug);',
              """    if (kDebugMode) {
                    await Purchases.setLogLevel(LogLevel.debug);
                  }""",
              'RevenueCat release logging')
          s = replace_once(
              s,
              """    final isProNow = customerInfo.entitlements.active.isNotEmpty;

                  bool isLifetimeNow = false;
                  if (isProNow) {
                    final entitlement = customerInfo.entitlements.active.values.first;
                    // In RevenueCat, nil expirationDate usually means lifetime
                    isLifetimeNow = entitlement.expirationDate == null;
                  }""",
              """    final entitlement =
                      customerInfo.entitlements.active[_entitlementId];
                  final isProNow = entitlement != null;
                  // In RevenueCat, a null expiration date represents a lifetime
                  // entitlement. Never infer Pro from another active entitlement.
                  final isLifetimeNow =
                      entitlement != null && entitlement.expirationDate == null;""",
              'exact RevenueCat entitlement')
          write(p, s)

          # Model picker: Pro status must be live, not frozen when the route opens.
          p = 'lib/model_selection_page.dart'
          s = read(p)
          s = replace_once(
              s,
              """class ModelSelectionPage extends StatefulWidget {
                final Map<String, ModelInfo> availableModels;
                final bool isProUser;

                const ModelSelectionPage({
                  super.key,
                  required this.availableModels,
                  required this.isProUser,
                });""",
              """class ModelSelectionPage extends StatefulWidget {
                final Map<String, ModelInfo> availableModels;

                const ModelSelectionPage({
                  super.key,
                  required this.availableModels,
                });""",
              'remove stale Pro constructor snapshot')
          s = replace_once(
              s,
              '  bool _isToastShown = false;',
              """  bool _isToastShown = false;

                bool get _isProUserNow =>
                    Provider.of<SettingsProvider>(context, listen: false).getBoughtPro();""",
              'dynamic Pro getter')
          s = replace_once(
              s,
              '    if (model.isPro && !widget.isProUser) {',
              '    if (model.isPro && !_isProUserNow) {',
              'download Pro check')
          s = replace_once(
              s,
              """    final isDark = Theme.of(context).brightness == Brightness.dark;
                final bgColor = isDark ? _bgDark : _bgLight;""",
              """    final isProUser = Provider.of<SettingsProvider>(context).getBoughtPro();
                final isDark = Theme.of(context).brightness == Brightness.dark;
                final bgColor = isDark ? _bgDark : _bgLight;""",
              'subscribe model picker to Pro changes')
          if s.count('widget.isProUser') != 2:
              raise SystemExit(f'expected 2 remaining widget.isProUser refs, found {s.count("widget.isProUser")}')
          s = s.replace('widget.isProUser', 'isProUser')
          old_dropdown = """                        onChanged: (val) {
                          setState(() => _selectedModelKey = val);
                          // Show info dialog for ad-gated models if not pro user
                          if (val != null &&
                              _isAdGatedModel(val) &&
                              !isProUser) {
                            _showAdGatedModelInfo();
                          }
                        },"""
          new_dropdown = """                        onChanged: _isDownloading
                            ? null
                            : (val) {
                                setState(() => _selectedModelKey = val);
                                // Show info for ad-gated models if not Pro.
                                if (val != null &&
                                    _isAdGatedModel(val) &&
                                    !isProUser) {
                                  _showAdGatedModelInfo();
                                }
                              },"""
          s = replace_once(s, old_dropdown, new_dropdown, 'freeze model choice during download')
          write(p, s)

          # Banner must disappear immediately when SettingsProvider switches to Pro.
          p = 'lib/adbanner.dart'
          s = read(p)
          s = replace_once(
              s,
              """  Widget build(BuildContext context) {
                if (!Provider.of<SettingsProvider>(context, listen: false).getBoughtPro() &&
                    canShowAd) {""",
              """  Widget build(BuildContext context) {
                final isProUser = Provider.of<SettingsProvider>(context).getBoughtPro();
                if (!isProUser && canShowAd) {""",
              'banner listens for Pro state')
          write(p, s)

          # Home page lifecycle, memory and UX hardening.
          p = 'lib/super_resolution_home_page.dart'
          s = read(p)
          s = replace_once(
              s,
              """    final settings = Provider.of<SettingsProvider>(context, listen: false);
                final result = await Navigator.push(
                  context,
                  MaterialPageRoute(
                    builder: (context) => ModelSelectionPage(
                      availableModels: _availableModels,
                      isProUser: settings.getBoughtPro(),
                    ),
                  ),
                );""",
              """    final result = await Navigator.push(
                  context,
                  MaterialPageRoute(
                    builder: (context) => ModelSelectionPage(
                      availableModels: _availableModels,
                    ),
                  ),
                );""",
              'live Pro model picker call')
          s = replace_once(
              s,
              '        if (modelFile.existsSync()) {',
              '        if (await modelFile.exists()) {',
              'async model existence check')
          s = replace_once(
              s,
              """  Future<void> _pickImage({bool batch = false}) async {
                if (_isPickingImage || _isProcessing || _processRequestInFlight) return;""",
              """  Future<void> _pickImage({bool batch = false}) async {
                if (_isPickingImage ||
                    _isProcessing ||
                    _processRequestInFlight ||
                    _isSaving ||
                    _isSharing ||
                    _isSharePreparing) {
                  return;
                }""",
              'block image replacement during result IO')
          s = replace_once(
              s,
              """        final List<XFile> images = await PermissionHelper.runWithRetry(
                  () => _picker.pickMultiImage(),
                );
                if (images.isNotEmpty) {""",
              """        final List<XFile> images = await PermissionHelper.runWithRetry(
                  () => _picker.pickMultiImage(),
                );
                if (!mounted) return;
                if (images.isNotEmpty) {""",
              'batch picker mounted guard')
          s = replace_once(
              s,
              """          for (final file in files) {
                    await _validateImageForScale(file, scale);
                  }
                  setState(() {""",
              """          for (final file in files) {
                    await _validateImageForScale(file, scale);
                    if (!mounted) return;
                  }
                  if (!mounted) return;
                  setState(() {""",
              'batch validation mounted guard')
          s = replace_once(
              s,
              """        final XFile? image = await PermissionHelper.runWithRetry(
                  () => _picker.pickImage(source: ImageSource.gallery),
                );
                if (image != null) {""",
              """        final XFile? image = await PermissionHelper.runWithRetry(
                  () => _picker.pickImage(source: ImageSource.gallery),
                );
                if (!mounted) return;
                if (image != null) {""",
              'single picker mounted guard')
          s = replace_once(
              s,
              """            return;
                  }
                  setState(() {
                    _selectedImage = file;""",
              """            return;
                  }
                  if (!mounted) return;
                  setState(() {
                    _selectedImage = file;""",
              'single validation mounted guard')
          s = replace_once(
              s,
              """  void _recordUpscaleDiagnostics(Map<String, Object?> diagnostics) {
                final settings = Provider.of<SettingsProvider>(context, listen: false);""",
              """  void _recordUpscaleDiagnostics(Map<String, Object?> diagnostics) {
                if (!mounted) return;
                final settings = Provider.of<SettingsProvider>(context, listen: false);""",
              'diagnostics mounted guard')
          s = replace_once(
              s,
              """    } catch (_) {
                  await upscaler.dispose();
                  rethrow;
                }
                _upscaler = upscaler;""",
              """    } catch (_) {
                  await upscaler.dispose();
                  rethrow;
                }
                if (!mounted) {
                  await upscaler.dispose();
                  return;
                }
                _upscaler = upscaler;""",
              'dispose late initialized session')
          s = replace_once(
              s,
              '    if (!imageToProcess.existsSync()) {',
              '    if (!await imageToProcess.exists()) {',
              'async source existence check')
          s = replace_once(
              s,
              """      final scaleFactor = _getScaleFactorForModel(modelKey);
                await _validateImageForScale(imageToProcess, scaleFactor);
                await _ensureModelSession(modelKey: modelKey, overlap: overlap);

                if (_upscaler == null) {
                  throw Exception(l10n.modelInfoMissing);
                }""",
              """      final scaleFactor = _getScaleFactorForModel(modelKey);
                await _validateImageForScale(imageToProcess, scaleFactor);
                if (!mounted) return;
                await _ensureModelSession(modelKey: modelKey, overlap: overlap);
                if (!mounted) return;

                final upscaler = _upscaler;
                if (upscaler == null) {
                  throw Exception(l10n.modelInfoMissing);
                }""",
              'session mounted guards and stable local reference')
          s = replace_once(
              s,
              """      late final ui.Image upscaledImage;
                try {
                  upscaledImage = await _upscaler!.upscaleImage(""",
              """      if (!mounted) {
                  sourceImage.dispose();
                  return;
                }

                late final ui.Image upscaledImage;
                try {
                  upscaledImage = await upscaler.upscaleImage(""",
              'avoid inference after page disposal')
          s = replace_once(
              s,
              """      } else {
                // For batch mode, the caller will handle the state
                _upscaledImage = upscaledImage;
              }""",
              """      } else if (mounted) {
                // For batch mode, the caller will handle the state.
                _upscaledImage = upscaledImage;
              } else {
                upscaledImage.dispose();
              }""",
              'dispose late batch result after navigation')
          s = replace_once(
              s,
              """        if (e is UnsupportedFileException) {
                  _showError(l10n.unsupportedFileError);
                } else {
                  _showError(l10n.failedToUpscaleImage(e.toString()));
                }""",
              """        if (e is UnsupportedFileException) {
                  _showError(l10n.unsupportedFileError);
                } else if (e is ImageTooLargeException) {
                  _showError(e.message);
                } else {
                  _showError(l10n.failedToUpscaleImage(e.toString()));
                }""",
              'friendly single image size error')
          s = replace_once(
              s,
              """        await _upscaleImage(
                  imageToProcess: images[i],
                  modelKey: modelKey,
                  overlap: overlap,
                  batchItem: true,
                );
                if (_upscaledImage != null) {""",
              """        await _upscaleImage(
                  imageToProcess: images[i],
                  modelKey: modelKey,
                  overlap: overlap,
                  batchItem: true,
                );
                if (!mounted) break;
                if (_upscaledImage != null) {""",
              'batch loop mounted guard')
          s = replace_once(
              s,
              """      if (mounted) _showError(l10n.failedToUpscaleImage(e.toString()));""",
              """      if (mounted) {
                _showError(
                  e is ImageTooLargeException
                      ? e.message
                      : l10n.failedToUpscaleImage(e.toString()),
                );
              }""",
              'friendly batch size error')
          s = replace_once(
              s,
              """        final bytes = await tempFile.readAsBytes();
                final originalName = entry.key.path.split(Platform.pathSeparator).last;""",
              """        final originalName = entry.key.path.split(Platform.pathSeparator).last;""",
              'avoid batch result byte copy')
          s = replace_once(
              s,
              """        final result = await PermissionHelper.runWithRetry<dynamic>(
                  () async => await ImageGallerySaverPlus.saveImage(
                    bytes,
                    quality: 100,
                    name: '${stem}_upscaled',
                  ),
                );""",
              """        final result = await PermissionHelper.runWithRetry<dynamic>(
                  () async => await ImageGallerySaverPlus.saveFile(
                    tempFile.path,
                    name: '${stem}_upscaled',
                  ),
                );""",
              'save batch file by path')
          s = replace_once(
              s,
              """      final preparedFile = File(preparedPath);
                final bytes = await preparedFile.readAsBytes();

                final result = await PermissionHelper.runWithRetry<dynamic>(
                  () async => await ImageGallerySaverPlus.saveImage(
                    bytes,
                    quality: 100,
                    name: preparedFile.uri.pathSegments.last.replaceAll('.png', ''),
                  ),
                );""",
              """      final preparedFile = File(preparedPath);

                final result = await PermissionHelper.runWithRetry<dynamic>(
                  () async => await ImageGallerySaverPlus.saveFile(
                    preparedFile.path,
                    name: preparedFile.uri.pathSegments.last.replaceAll('.png', ''),
                  ),
                );""",
              'save single file by path')
          old_reprocess_guard = """                                  onPressed:
                                      _isSaving ||
                                          _isProcessing ||
                                          _processRequestInFlight
                                      ? null
                                      : _handleProcessRequest,"""
          new_reprocess_guard = """                                  onPressed:
                                      _isSaving ||
                                          _isSharing ||
                                          _isSharePreparing ||
                                          _isProcessing ||
                                          _processRequestInFlight
                                      ? null
                                      : _handleProcessRequest,"""
          s = replace_once(s, old_reprocess_guard, new_reprocess_guard, 'reprocess result IO guard')
          write(p, s)
          PY

          dart format \
            lib/services/subscription_service.dart \
            lib/model_selection_page.dart \
            lib/adbanner.dart \
            lib/super_resolution_home_page.dart
          git diff --check

      - name: Analyze and test app
        working-directory: app
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Test super-resolution package
        working-directory: app/flutter_super_resolution
        run: |
          flutter pub get
          flutter test

      - name: Compile Android debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Commit and push verified fixes
        working-directory: app
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'Persie0'
          git config user.email '76871553+Persie0@users.noreply.github.com'
          git add lib
          git commit -m 'Harden app lifecycle, entitlements, and result IO'
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/Persie0/image_enhancer.git"
          git push --force origin HEAD:"$TARGET_BRANCH"
