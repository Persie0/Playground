name: ToiletCompass DB page scrolling and explicit download
# Validate corrected pinned search header height
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toiletcompass-db-page-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/toiletcompass
          ref: fix/scrollable-db-page-explicit-selection
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter packages
        working-directory: app
        run: flutter pub get
      - name: Flutter analysis
        working-directory: app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Region scroll and explicit download tests
        working-directory: app
        run: flutter test test/database_region_selector_test.dart test/onboarding_keyboard_focus_test.dart
      - name: Complete Flutter test suite
        working-directory: app
        run: flutter test
