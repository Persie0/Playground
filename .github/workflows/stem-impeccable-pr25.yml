name: StemLab PR 25 UI verification
on:
  push:
    branches: [ci/stem-impeccable-pr25]
    paths: ['.github/workflows/stem-impeccable-pr25.yml', 'stem/impeccable-pr25-trigger.txt']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/stem
          ref: 378d22102367078374d57640bf664245d3912bea
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: stem-app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: stem-app
        run: flutter pub get
      - name: Analyze
        working-directory: stem-app
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Test
        working-directory: stem-app
        run: flutter test --reporter expanded
