name: Review H1 minimal cross-dot pre69 PR72
on:
  push:
    branches: ['ci/traffic-h1-direct-pre69-pr72-20261104']
    paths: ['.github/workflows/traffic-h1-pre69-pr72-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR72 commit
        uses: actions/checkout@v5
        with:
          repository: Persie0/traffic-counting-light-main
          ref: 64c2e5d6d9813bd88d29a26a81c021eb1374038e
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          persist-credentials: false
          path: app
      - name: Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless pytest pyyaml loguru requests scipy pillow jsonpickle
      - name: Run focused direction and baseline analysis tests 3.11
        env:
          PYTHONPATH: app/traffic-counting-edge-detection-master/src
        run: |
          python -m compileall -q app/traffic-counting-edge-detection-master/src/detection/direction_detection.py app/traffic-counting-edge-detection-master/src/speed_measurement/homography_matrix.py
          python -m pytest -q \
            app/traffic-counting-edge-detection-master/tests/test_direction_ground_angles.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_native_input.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_route_heatmap.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_waiting_detector.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_pipeline_integration.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_background_refresh.py
      - name: Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install focused test dependencies 3.13
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless pytest pyyaml loguru requests scipy pillow jsonpickle
      - name: Run same focused tests 3.13
        env:
          PYTHONPATH: app/traffic-counting-edge-detection-master/src
        run: |
          python -m pytest -q \
            app/traffic-counting-edge-detection-master/tests/test_direction_ground_angles.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_native_input.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_route_heatmap.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_waiting_detector.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_pipeline_integration.py \
            app/traffic-counting-edge-detection-master/tests/test_analysis_background_refresh.py
