name: Decompile Google Camera 8.8.225

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/decompile-google-camera.yml"

permissions:
  contents: write

concurrency:
  group: google-camera-decompile
  cancel-in-progress: true

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Playground
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Download exact Pixel Camera APK from private release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "PRIVATE_REPO_TOKEN/GH_TOKEN is not configured"; exit 1; }
          mkdir -p input
          gh api             -H "Accept: application/octet-stream"             "repos/Persie0/decompile/releases/assets/615482104"             > input/google-camera-8.8.225.apk

          test -s input/google-camera-8.8.225.apk
          echo "9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  input/google-camera-8.8.225.apk" | sha256sum -c -
          stat -c '%n %s bytes' input/google-camera-8.8.225.apk

      - name: Download and verify JADX 1.5.6
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip" -o jadx.zip
          echo "545ea2be9c242511bc145755cf4bda2485ade42966e096f8b4d3da2a230e8974  jadx.zip" | sha256sum -c -
          mkdir -p .tools/jadx
          unzip -q jadx.zip -d .tools/jadx
          .tools/jadx/bin/jadx --version

      - name: Decompile and deobfuscate
        env:
          JAVA_OPTS: -Xms512m -Xmx5g -XX:+UseG1GC
        shell: bash
        run: |
          set -euo pipefail
          version="8.8.225.510547499.09"
          out="decompiled/google-camera/$version"
          rm -rf "$out"
          mkdir -p "$out"

          set +e
          .tools/jadx/bin/jadx             --threads-count 1             --no-res             --show-bad-code             --deobf             --deobf-cfg-file "$out/$version.jobf"             --deobf-cfg-file-mode overwrite             --deobf-res-name-source auto             --use-source-name-as-class-name-alias if-better             --rename-flags "case,valid,printable"             --comments-level info             --log-level progress             --output-dir "$out"             input/google-camera-8.8.225.apk 2>&1 | tee "$out/jadx.log"
          jadx_exit="${PIPESTATUS[0]}"
          set -e

          source_count="$(find "$out/sources" -type f -name '*.java' 2>/dev/null | wc -l)"
          test "$source_count" -gt 0
          echo "JADX_EXIT=$jadx_exit" >> "$GITHUB_ENV"
          echo "SOURCE_COUNT=$source_count" >> "$GITHUB_ENV"
          echo "Recovered $source_count Java files; JADX exit $jadx_exit"

      - name: Package source-only output
        shell: bash
        run: |
          set -euo pipefail
          version="8.8.225.510547499.09"
          out="decompiled/google-camera/$version"

          cat > "$out/README.md" <<EOF
          # Pixel Camera $version decompiled sources

          Input package: com.google.android.GoogleCamera
          Version code: 66251366
          APK SHA-256: 9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47
          JADX: 1.5.6
          JADX exit code: $JADX_EXIT
          Decompiled Java files: $SOURCE_COUNT

          JADX automatic deobfuscation was enabled. Original R8/ProGuard identifiers cannot be recovered without Google's mapping file. Decompiled methods marked with errors are approximate. Android resources are intentionally excluded, matching the existing LingQ source-only workflow.
          EOF

          mkdir -p package/google-camera
          cp -a "$out" package/google-camera/
          (cd package && zip -qr ../google-camera-8.8.225.510547499.09-jadx-sources.zip google-camera)

          plain_sha="$(sha256sum google-camera-8.8.225.510547499.09-jadx-sources.zip | awk '{print $1}')"
          echo "PLAIN_SHA=$plain_sha" >> "$GITHUB_ENV"
          echo "ARCHIVE_SIZE=$(stat -c %s google-camera-8.8.225.510547499.09-jadx-sources.zip)" >> "$GITHUB_ENV"

      - name: Encrypt transfer payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p transfer/google-camera-8.8.225.510547499.09

          cat > public.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAnSdR6ORoIByVIC04iXIB
          g4j8P4JjM+c3PX8IRL6o4esRgbCWPvZrax8RefWREwn9nJQEKv2LwQ1Px3RzaNCa
          KLWiwFTjYbmII1JW16TRtPzhrIGntz8xMeZKRgsC3MiUhgQ8cBP1un0pXdEauWjF
          VWKfXNpTeXag0tE3Fj6IJoTZDvMy56d+2rQ1L4AiYMhNmIAWStvHYMdtVD5oTsa+
          C0pk75lkoGVW4wj0FZI0QBYUNFkB9U+iWNpHmevXI4NuZ0KBoM/5xWUY0Aqp7efS
          YFy/GPmz0Heo7nNHA8916QRl4KGhC3d1Dpn3k6pFv0gXmx2wC7y53umbdCtCeSfR
          TQIDAQAB
          -----END PUBLIC KEY-----
          EOF

          openssl rand 48 > secret.bin
          key="$(xxd -p -l 32 secret.bin | tr -d '\n')"
          iv="$(xxd -p -s 32 -l 16 secret.bin | tr -d '\n')"

          openssl enc -aes-256-ctr             -K "$key" -iv "$iv"             -in google-camera-8.8.225.510547499.09-jadx-sources.zip             -out payload.enc

          openssl pkeyutl -encrypt -pubin -inkey public.pem             -pkeyopt rsa_padding_mode:oaep             -pkeyopt rsa_oaep_md:sha256             -in secret.bin             -out wrapped-key.bin

          base64 -w 0 wrapped-key.bin > transfer/google-camera-8.8.225.510547499.09/wrapped-key.b64
          base64 -w 0 payload.enc | split -b 4M -d -a 3 - transfer/google-camera-8.8.225.510547499.09/part-

          enc_sha="$(sha256sum payload.enc | awk '{print $1}')"
          part_count="$(find transfer/google-camera-8.8.225.510547499.09 -name 'part-*' | wc -l)"

          cat > transfer/google-camera-8.8.225.510547499.09/manifest.txt <<EOF
          package=com.google.android.GoogleCamera
          version=8.8.225.510547499.09
          version_code=66251366
          apk_sha256=9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47
          jadx_version=1.5.6
          jadx_exit=$JADX_EXIT
          java_files=$SOURCE_COUNT
          archive_size=$ARCHIVE_SIZE
          archive_sha256=$PLAIN_SHA
          encrypted_sha256=$enc_sha
          part_count=$part_count
          part_encoding=base64
          part_size=4MiB
          cipher=aes-256-ctr
          key_wrap=rsa-oaep-sha256
          EOF

          cat transfer/google-camera-8.8.225.510547499.09/manifest.txt
          du -sh transfer/google-camera-8.8.225.510547499.09

      - name: Publish encrypted transfer branch
        shell: bash
        run: |
          set -euo pipefail
          cp -a transfer /tmp/gcam-transfer
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gcam-transfer
          git rm -rf . >/dev/null 2>&1 || true
          cp -a /tmp/gcam-transfer ./transfer
          git add transfer
          git commit -m "Encrypted Google Camera JADX transfer"
          git push --force origin HEAD:gcam-transfer

          {
            echo "## Google Camera decompilation"
            echo
            echo "- Java source files: $SOURCE_COUNT"
            echo "- JADX exit: $JADX_EXIT"
            echo "- Source archive SHA-256: $PLAIN_SHA"
            echo "- Encrypted transfer branch: gcam-transfer"
          } >> "$GITHUB_STEP_SUMMARY"
