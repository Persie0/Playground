name: Audiobooster Kotlin main release validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audiobooster-kotlin-main-release-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout fixed Audiobooster source
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: ea9047ddcbf2d5cf508de585c0a8fc03bb1ec9e6
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install compile SDK 37
        run: # Android API 37 is published as a minor-version platform (37.0).
          sdkmanager 'platforms;android-37.0' || sdkmanager --channel=3 'platforms;android-37.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Disable production signing for validation
        working-directory: app
        shell: bash
        run: |
          # Validate an unsigned bundle; never use private release keys in public CI.
          if [ -f key.properties ]; then
            mv key.properties key.properties.ci-disabled
          fi

      - name: Test, release lint and release bundle
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:bundleRelease --stacktrace

      - name: Show lint diagnostics on failure
        if: failure()
        working-directory: app
        shell: bash
        run: |
          if [ -f app/build/reports/lint-results-release.txt ]; then
            cat app/build/reports/lint-results-release.txt
          fi
