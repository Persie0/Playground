name: Photo Sphere checkpoint 227 Rust AddImage camera oracle
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-addimage-rust-227.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: d57810c5cb42a7699634d463e09070b6ba6a1969
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Print exact source revision
        run: git rev-parse HEAD
      - name: Validate complete checkpoint227 Rust test suite
        run: cargo test --locked
