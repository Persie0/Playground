name: Airline simulator streamed restore and peak memory GREEN batch
on:
  push:
    branches: [airlinesimulator-foundation-ci]
    paths: [.github/workflows/airlinesimulator-foundation-ci.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: career-save
            os: ubuntu-latest
          - check: thirty-one-day-career
            os: ubuntu-latest
          - check: economy-market
            os: ubuntu-latest
          - check: live-services
            os: ubuntu-latest
          - check: live-competition
            os: ubuntu-latest
          - check: live-recovery
            os: ubuntu-latest
          - check: fleet-economy
            os: ubuntu-latest
          - check: fleet-depth
            os: ubuntu-latest
          - check: network-depth
            os: ubuntu-latest
          - check: connections-loyalty
            os: ubuntu-latest
          - check: partner-offers
            os: ubuntu-latest
          - check: brand-strategy
            os: ubuntu-latest
          - check: ceo-work
            os: ubuntu-latest
          - check: seasonal-market
            os: ubuntu-latest
          - check: procedural-contracts
            os: ubuntu-latest
          - check: manager-automation
            os: ubuntu-latest
          - check: endless-history
            os: ubuntu-latest
          - check: benchmark-one
            os: ubuntu-latest
          - check: benchmark-ten
            os: ubuntu-latest
          - check: benchmark-one-year
            os: ubuntu-latest
          - check: benchmark-ten-year
            os: ubuntu-latest
          - check: benchmark-fifty
            os: ubuntu-latest
          - check: benchmark-two-hundred-week
            os: ubuntu-latest
          - check: benchmark-two-hundred-month
            os: ubuntu-latest
          - check: benchmark-two-hundred-quarter-compressed
            os: ubuntu-latest
          - check: benchmark-fifty-year
            os: ubuntu-latest
          - check: benchmark-fifty-year-compressed
            os: ubuntu-latest
          - check: benchmark-two-hundred-year-compressed
            os: ubuntu-latest
          - check: benchmark-one-decade
            os: ubuntu-latest
          - check: godot-career-save
            os: ubuntu-latest
          - check: godot-ceo-headless
            os: ubuntu-latest
          - check: godot-ceo-window
            os: ubuntu-latest
          - check: full-release
            os: ubuntu-latest
          - check: full-debug
            os: ubuntu-latest
          - check: windows-release
            os: windows-latest
          - check: godot-headless
            os: ubuntu-latest
          - check: godot-window
            os: ubuntu-latest
          - check: linux-export
            os: ubuntu-latest
          - check: godot-commercial-visual
            os: ubuntu-latest
          - check: godot-commercial-management
            os: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: Persie0/airlinesimulator
          ref: 055eef068aef4b1392e3dfe75fcb910efcf6b6bb
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Build and test (private output suppressed)
        if: '!startsWith(matrix.check, ''benchmark-'')'
        working-directory: private-source
        shell: bash
        env:
          CHECK: ${{ matrix.check }}
        run: |
          config=Release
          if [ "$CHECK" = full-debug ]; then config=Debug; fi
          args=(tests/Simulation.Tests/Simulation.Tests.csproj -c "$config")
          expected=208
          case "$CHECK" in
            career-save) args+=(--filter FullyQualifiedName~CareerSaveTests); expected=5 ;;
            thirty-one-day-career) args+=(--filter FullyQualifiedName~VerticalSliceTests); expected=1 ;;
            economy-market) args+=(--filter FullyQualifiedName~CommercialIntegrationTests); expected=5 ;;
            live-services) args+=(--filter FullyQualifiedName~LiveServiceTests); expected=5 ;;
            live-competition) args+=(--filter FullyQualifiedName~LiveCompetitionTests); expected=5 ;;
            live-recovery) args+=(--filter FullyQualifiedName~LiveRecoveryTests); expected=7 ;;
            fleet-economy) args+=(--filter FullyQualifiedName~FleetEconomyTests); expected=5 ;;
            fleet-depth) args+=(--filter FullyQualifiedName~FleetDepthTests); expected=6 ;;
            network-depth) args+=(--filter FullyQualifiedName~NetworkDepthTests); expected=5 ;;
            connections-loyalty) args+=(--filter FullyQualifiedName~ConnectionTests); expected=6 ;;
            partner-offers) args+=(--filter FullyQualifiedName~PartnerOfferTests); expected=5 ;;
            brand-strategy) args+=(--filter FullyQualifiedName~StrategyTests); expected=10 ;;
            ceo-work) args+=(--filter FullyQualifiedName~WorkTaskTests); expected=6 ;;
            seasonal-market) args+=(--filter FullyQualifiedName~MarketEvolutionTests); expected=6 ;;
            procedural-contracts) args+=(--filter FullyQualifiedName~ContractTests); expected=6 ;;
            manager-automation) args+=(--filter FullyQualifiedName~AutomationTests); expected=6 ;;
            endless-history) args+=(--filter FullyQualifiedName~EndlessTests); expected=15 ;;
            *)
              if dotnet build AirlineSimulator.sln -c "$config" > "$RUNNER_TEMP/build.log" 2>&1; then
                echo 'Solution build PASS'
              else
                echo 'Solution build FAIL'
                grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}' "$RUNNER_TEMP/build.log" | sort | uniq -c || true
                exit 1
              fi
              args+=(--no-build)
              ;;
          esac
          if dotnet test "${args[@]}" > "$RUNNER_TEMP/test.log" 2>&1; then
            grep -Eo 'Passed: *[0-9]+|Failed: *[0-9]+|Total: *[0-9]+' "$RUNNER_TEMP/test.log" || true
            grep -Eq "Passed: *$expected([^0-9]|$)" "$RUNNER_TEMP/test.log"
            echo "Expected $expected tests PASS"
          else
            echo 'Tests FAIL'
            grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}|Failed: *[0-9]+' "$RUNNER_TEMP/test.log" | sort | uniq -c || true
            exit 1
          fi
      - name: Install Godot
        if: startsWith(matrix.check, 'godot-') || matrix.check == 'linux-export'
        shell: bash
        run: |
          version=4.7.2-stable
          curl --fail --location --retry 3 --silent --show-error "https://github.com/godotengine/godot-builds/releases/download/$version/Godot_v${version}_mono_linux_x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          editor=$(find "$RUNNER_TEMP/godot" -type f -name 'Godot*_mono_linux.x86_64' -print -quit)
          test -n "$editor"
          chmod +x "$editor"
          echo "GODOT_EDITOR=$editor" >> "$GITHUB_ENV"
      - name: Import project and compile scripts
        if: startsWith(matrix.check, 'godot-') || matrix.check == 'linux-export'
        working-directory: private-source
        shell: bash
        run: |
          if "$GODOT_EDITOR" --headless --editor --path . --import > "$RUNNER_TEMP/import.log" 2>&1 && dotnet build AirlineSimulator.csproj -c Debug >> "$RUNNER_TEMP/import.log" 2>&1; then
            echo 'Godot import and Debug build PASS'
          else
            echo 'Godot import or Debug build FAIL'
            grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}' "$RUNNER_TEMP/import.log" | sort | uniq -c || true
            exit 1
          fi
      - name: Run actual greybox scene assertions
        if: startsWith(matrix.check, 'godot-')
        working-directory: private-source
        shell: bash
        env:
          CHECK: ${{ matrix.check }}
        run: |
          flag=--greybox-smoke
          expected_marker=AIRLINE_GREYBOX_OK
          if [ "$CHECK" = godot-commercial-visual ]; then flag=--visual-slice-smoke; expected_marker=AIRLINE_VISUAL_SLICE_OK; fi
          if [ "$CHECK" = godot-commercial-management ]; then flag=--management-smoke; expected_marker=AIRLINE_MANAGEMENT_OK; fi
          if [ "$CHECK" = godot-career-save ]; then flag=--career-save-smoke; expected_marker=AIRLINE_CAREER_SAVE_OK; fi
          if [[ "$CHECK" == godot-ceo-* ]]; then flag=--ceo-smoke; expected_marker=AIRLINE_CEO_OK; fi
          set +e
          if [ "$CHECK" = godot-window ] || [ "$CHECK" = godot-ceo-window ]; then
            LIBGL_ALWAYS_SOFTWARE=1 timeout 90 xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_EDITOR" --path . --audio-driver Dummy --quit-after 300 -- "$flag" > "$RUNNER_TEMP/boot.log" 2>&1
          else
            timeout 90 "$GODOT_EDITOR" --headless --path . --quit-after 300 -- "$flag" > "$RUNNER_TEMP/boot.log" 2>&1
          fi
          status=$?
          set -e
          echo "Exit status: $status"
          for marker in AIRLINE_BOOT_OK:1 "$expected_marker"; do
            if grep -q "$marker" "$RUNNER_TEMP/boot.log"; then echo "$marker present"; else echo "$marker missing"; fi
          done
          echo "Engine error count: $(grep -Ec 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/boot.log" || true)"
          test "$status" -eq 0
          grep -q "$expected_marker" "$RUNNER_TEMP/boot.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/boot.log"
      - name: Export Linux game and run packaged scene assertions
        if: matrix.check == 'linux-export'
        working-directory: private-source
        shell: bash
        run: |
          version=4.7.2-stable
          curl --fail --location --retry 3 --silent --show-error "https://github.com/godotengine/godot-builds/releases/download/$version/Godot_v${version}_mono_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          dest="$HOME/.local/share/godot/export_templates/4.7.2.stable.mono"
          mkdir -p "$dest"
          cp -a "$RUNNER_TEMP/templates/templates/." "$dest/"
          mkdir -p exports/linux
          "$GODOT_EDITOR" --headless --path . --export-release Linux exports/linux/AirlineSimulator.x86_64 > "$RUNNER_TEMP/export.log" 2>&1
          test -s exports/linux/AirlineSimulator.x86_64
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/export.log"
          chmod +x exports/linux/AirlineSimulator.x86_64
          timeout 90 exports/linux/AirlineSimulator.x86_64 --headless --quit-after 300 -- --greybox-smoke > "$RUNNER_TEMP/export-boot.log" 2>&1
          grep -q 'AIRLINE_GREYBOX_OK' "$RUNNER_TEMP/export-boot.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/export-boot.log"
          echo 'Exported Linux scene assertions PASS'
          timeout 90 exports/linux/AirlineSimulator.x86_64 --headless --quit-after 300 -- --management-smoke > "$RUNNER_TEMP/export-commercial.log" 2>&1
          grep -q 'AIRLINE_MANAGEMENT_OK' "$RUNNER_TEMP/export-commercial.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/export-commercial.log"
          echo 'Exported commercial management assertions PASS'
          timeout 90 exports/linux/AirlineSimulator.x86_64 --headless --quit-after 300 -- --career-save-smoke > "$RUNNER_TEMP/export-career.log" 2>&1
          grep -q 'AIRLINE_CAREER_SAVE_OK' "$RUNNER_TEMP/export-career.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/export-career.log"
          echo 'Exported career save assertions PASS'
          timeout 90 exports/linux/AirlineSimulator.x86_64 --headless --quit-after 300 -- --ceo-smoke > "$RUNNER_TEMP/export-ceo.log" 2>&1
          grep -q 'AIRLINE_CEO_OK' "$RUNNER_TEMP/export-ceo.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/export-ceo.log"
          echo 'Exported CEO scene assertions PASS'
      - name: Measure deterministic live career baseline
        if: startsWith(matrix.check, 'benchmark-')
        working-directory: private-source
        shell: bash
        env:
          CHECK: ${{ matrix.check }}
        run: |
          fleet=1
          days=30
          compressed=false
          if [[ "$CHECK" == benchmark-ten* ]]; then fleet=10; fi
          if [[ "$CHECK" == *-year* ]]; then days=365; fi
          if [[ "$CHECK" == *-compressed ]]; then compressed=true; fi
          if [[ "$CHECK" == benchmark-fifty* ]]; then fleet=50; fi
          if [ "$CHECK" = benchmark-two-hundred-week ]; then fleet=200; days=7; fi
          if [ "$CHECK" = benchmark-two-hundred-month ]; then fleet=200; days=30; fi
          if [ "$CHECK" = benchmark-two-hundred-quarter-compressed ]; then fleet=200; days=90; fi
          if [ "$CHECK" = benchmark-two-hundred-year-compressed ]; then fleet=200; days=365; fi
          if [ "$CHECK" = benchmark-one-decade ]; then days=3650; fi
          if ! dotnet build tools/SimulationBench/SimulationBench.csproj -c Release > "$RUNNER_TEMP/bench-build.log" 2>&1; then
            echo 'Benchmark build FAIL'
            grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}' "$RUNNER_TEMP/bench-build.log" | sort | uniq -c || true
            exit 1
          fi
          for trial in 1 2; do
            if ! timeout 480 dotnet run --no-build -c Release --project tools/SimulationBench -- --seed 7 --fleet "$fleet" --days "$days" --compressed "$compressed" --csv "$RUNNER_TEMP/bench-$trial.csv" > "$RUNNER_TEMP/bench-$trial.log" 2>&1; then
              echo "Benchmark trial $trial FAIL"
              grep -Eo '^BENCH_FAILURE phase=(setup|simulation|persistence) code=(command-rejected|route-plan-capacity|planned-schedule-rejected|fleet-setup-incomplete|active-fleet-mismatch|reservation-conflict|outstanding-liability|completion-mismatch|rotation-count-mismatch|restore-mismatch) day=[0-9]+$' "$RUNNER_TEMP/bench-$trial.log" | head -1 || true
              exit 1
            fi
          done
          python - <<'PY'
          import csv, os, re
          rows = []
          for trial in (1, 2):
              with open(os.path.join(os.environ['RUNNER_TEMP'], f'bench-{trial}.csv')) as f:
                  row = next(csv.DictReader(f))
              assert re.fullmatch('[A-F0-9]{64}', row['canonical_sha256'])
              assert int(row['completed']) == int(row['fleet']) * int(row['days'])
              assert int(row['deferred_cents']) == 0
              rows.append(row)
          assert rows[0]['canonical_sha256'] == rows[1]['canonical_sha256']
          for i, row in enumerate(rows, 1):
              print(f'Trial {i}')
              for key in ('fleet','days','completed','elapsed_ms','setup_ms','p50_day_ms','p95_day_ms','managed_bytes','working_set_bytes','peak_working_set_bytes','save_bytes','save_ms','load_ms','cash_cents','profit_cents','deferred_cents','handlers','summary_buckets'):
                  value = row[key]
                  assert re.fullmatch(r'-?[0-9]+(?:\.[0-9]+)?', value)
                  print(f'{key}={value}')
          print('Canonical replay PASS')
          PY
