name: Airline simulator clock GREEN verification
on:
  push:
    branches: [airlinesimulator-foundation-ci]
    paths: [.github/workflows/airlinesimulator-foundation-ci.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: focused-clock
            os: ubuntu-latest
          - check: full-release
            os: ubuntu-latest
          - check: full-debug
            os: ubuntu-latest
          - check: windows-release
            os: windows-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: Persie0/airlinesimulator
          ref: f2a04e334e11a1ce17d07684b20b8e035d31b490
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Validate clock and regression suite (private output suppressed)
        working-directory: private-source
        shell: bash
        env:
          CHECK: ${{ matrix.check }}
        run: |
          config=Release
          if [ "$CHECK" = full-debug ]; then config=Debug; fi
          if [ "$CHECK" != focused-clock ]; then
            if dotnet build AirlineSimulator.sln -c "$config" > "$RUNNER_TEMP/build.log" 2>&1; then
              echo 'Solution build PASS'
            else
              echo 'Solution build FAIL'
              grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}' "$RUNNER_TEMP/build.log" | sort | uniq -c || true
              exit 1
            fi
          fi
          args=(tests/Simulation.Tests/Simulation.Tests.csproj -c "$config")
          if [ "$CHECK" = focused-clock ]; then args+=(--filter FullyQualifiedName~ClockTests); else args+=(--no-build); fi
          if dotnet test "${args[@]}" > "$RUNNER_TEMP/test.log" 2>&1; then
            echo 'Tests PASS'
            grep -Eo 'Passed: *[0-9]+|Failed: *[0-9]+|Total: *[0-9]+' "$RUNNER_TEMP/test.log" || true
          else
            echo 'Tests FAIL'
            grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}|Failed: *[0-9]+' "$RUNNER_TEMP/test.log" | sort | uniq -c || true
            exit 1
          fi
