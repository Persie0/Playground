name: Airline simulator tasks 14–16 GREEN batch
on:
  push:
    branches: [airlinesimulator-foundation-ci]
    paths: [.github/workflows/airlinesimulator-foundation-ci.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: demand
            os: ubuntu-latest
          - check: journey
            os: ubuntu-latest
          - check: recovery
            os: ubuntu-latest
          - check: full-release
            os: ubuntu-latest
          - check: full-debug
            os: ubuntu-latest
          - check: windows-release
            os: windows-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: Persie0/airlinesimulator
          ref: 848faaae23abb5509926cfdbb113afc03366c0f1
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Verify build and tests (private diagnostics suppressed)
        working-directory: private-source
        shell: bash
        env:
          CHECK: ${{ matrix.check }}
        run: |
          config=Release
          if [ "$CHECK" = full-debug ]; then config=Debug; fi
          args=(tests/Simulation.Tests/Simulation.Tests.csproj -c "$config")
          expected=99
          case "$CHECK" in
            demand) args+=(--filter FullyQualifiedName~DemandTests); expected=6 ;;
            journey) args+=(--filter FullyQualifiedName~JourneyTests); expected=6 ;;
            recovery) args+=(--filter FullyQualifiedName~RecoveryTests); expected=4 ;;
            *)
              if dotnet build AirlineSimulator.sln -c "$config" > "$RUNNER_TEMP/build.log" 2>&1; then
                echo 'Solution build PASS'
              else
                echo 'Solution build FAIL'
                grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}' "$RUNNER_TEMP/build.log" | sort | uniq -c || true
                exit 1
              fi
              args+=(--no-build)
              ;;
          esac
          if dotnet test "${args[@]}" > "$RUNNER_TEMP/test.log" 2>&1; then
            grep -Eo 'Passed: *[0-9]+|Failed: *[0-9]+|Total: *[0-9]+' "$RUNNER_TEMP/test.log" || true
            grep -Eq "Passed: *$expected([^0-9]|$)" "$RUNNER_TEMP/test.log"
            echo "Expected $expected tests PASS"
          else
            echo 'Tests FAIL'
            grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}|Failed: *[0-9]+' "$RUNNER_TEMP/test.log" | sort | uniq -c || true
            exit 1
          fi
