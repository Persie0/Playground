name: Airline simulator clock RED gate
on:
  push:
    branches: [airlinesimulator-foundation-ci]
    paths: [.github/workflows/airlinesimulator-foundation-ci.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red:
    name: ${{ matrix.framework }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [clock-tests, solution-build]
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: Persie0/airlinesimulator
          ref: ba842a1841e5d9a779057af92f546e5111e4eb49
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Verify expected missing clock type without exposing private logs
        working-directory: private-source
        shell: bash
        env:
          MODE: ${{ matrix.framework }}
        run: |
          set +e
          if [ "$MODE" = clock-tests ]; then
            dotnet test tests/Simulation.Tests/Simulation.Tests.csproj -c Release --filter FullyQualifiedName~ClockTests > "$RUNNER_TEMP/red.log" 2>&1
          else
            dotnet build AirlineSimulator.sln -c Release > "$RUNNER_TEMP/red.log" 2>&1
          fi
          status=$?
          set -e
          if [ "$status" -ne 0 ] && grep -Eq 'CS0246.*SimulationClock' "$RUNNER_TEMP/red.log"; then
            echo 'Expected RED: SimulationClock is not implemented.'
          else
            echo 'Expected RED was not established.'
            grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}' "$RUNNER_TEMP/red.log" | sort | uniq -c || true
            exit 1
          fi
