name: Airline simulator tasks 06–08 RED batch
on:
  push:
    branches: [airlinesimulator-foundation-ci]
    paths: [.github/workflows/airlinesimulator-foundation-ci.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [flight-lifecycle, passenger-queue, greybox-smoke]
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: Persie0/airlinesimulator
          ref: bcaad71a8f2ab42b47a1a12d0822dd94c44d7b1c
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Verify missing simulation implementation
        if: matrix.task != 'greybox-smoke'
        working-directory: private-source
        shell: bash
        env:
          TASK: ${{ matrix.task }}
        run: |
          if [ "$TASK" = flight-lifecycle ]; then
            rm tests/Simulation.Tests/QueueProofTests.cs
            filter=FlightTests
            expected='CS0103.*(ScenarioFactory|FlightStatus)'
          else
            rm tests/Simulation.Tests/FlightTests.cs
            filter=QueueProofTests
            expected='CS0246.*ServiceQueue|CS0103.*SnapshotBuilder'
          fi
          set +e
          dotnet test tests/Simulation.Tests/Simulation.Tests.csproj -c Release --filter "FullyQualifiedName~$filter" > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && grep -Eq "$expected" "$RUNNER_TEMP/red.log"; then
            echo "Expected RED verified for $TASK"
          else
            echo "Expected RED not established for $TASK"
            grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}' "$RUNNER_TEMP/red.log" | sort | uniq -c || true
            exit 1
          fi
      - name: Install Godot for real smoke gate
        if: matrix.task == 'greybox-smoke'
        shell: bash
        run: |
          version=4.7.2-stable
          curl --fail --location --retry 3 --silent --show-error "https://github.com/godotengine/godot-builds/releases/download/$version/Godot_v${version}_mono_linux_x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          editor=$(find "$RUNNER_TEMP/godot" -type f -name 'Godot*_mono_linux.x86_64' -print -quit)
          test -n "$editor"
          chmod +x "$editor"
          echo "GODOT_EDITOR=$editor" >> "$GITHUB_ENV"
      - name: Establish missing scene smoke marker
        if: matrix.task == 'greybox-smoke'
        working-directory: private-source
        shell: bash
        run: |
          "$GODOT_EDITOR" --headless --editor --path . --import > "$RUNNER_TEMP/import.log" 2>&1
          dotnet build AirlineSimulator.csproj -c Debug > "$RUNNER_TEMP/build.log" 2>&1
          "$GODOT_EDITOR" --headless --path . --quit-after 120 -- --greybox-smoke > "$RUNNER_TEMP/boot.log" 2>&1
          grep -q 'AIRLINE_BOOT_OK:1' "$RUNNER_TEMP/boot.log"
          if grep -q 'AIRLINE_GREYBOX_OK' "$RUNNER_TEMP/boot.log"; then
            echo 'Unexpected GREEN before implementation'
            exit 1
          fi
          echo 'Expected RED: boot succeeded but greybox smoke marker missing.'
