name: Airline simulator next three tasks RED batch
on:
  push:
    branches: [airlinesimulator-foundation-ci]
    paths: [.github/workflows/airlinesimulator-foundation-ci.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [command-engine, content-catalog, scheduling]
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: Persie0/airlinesimulator
          ref: b4695b735b55a67b9643303292c97c7d574ad042
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Verify missing implementation independently
        working-directory: private-source
        shell: bash
        env:
          TASK: ${{ matrix.task }}
        run: |
          case "$TASK" in
            command-engine)
              rm tests/Simulation.Tests/{ContentTests,FixturePaths,ScheduleTests}.cs
              filter=EngineTests
              expected='CS0246.*(SimulationEngine|StableRandom|SetAirlineName)|CS0103.*GameState'
              ;;
            content-catalog)
              rm tests/Simulation.Tests/{EngineTests,ScheduleTests}.cs
              filter=ContentTests
              expected='CS0246.*ContentCatalog|CS0103.*ContentCatalog'
              ;;
            scheduling)
              rm tests/Simulation.Tests/{EngineTests,ContentTests}.cs
              filter=ScheduleTests
              expected='CS0246.*(ReservationBook|ScheduleService|ScheduleProposal)'
              ;;
            *) exit 1 ;;
          esac
          set +e
          dotnet test tests/Simulation.Tests/Simulation.Tests.csproj -c Release --filter "FullyQualifiedName~$filter" > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && grep -Eq "$expected" "$RUNNER_TEMP/red.log"; then
            echo "Expected RED verified for $TASK"
          else
            echo "Expected RED not established for $TASK"
            grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}' "$RUNNER_TEMP/red.log" | sort | uniq -c || true
            exit 1
          fi
