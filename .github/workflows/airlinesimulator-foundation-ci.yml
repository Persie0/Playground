name: Airline simulator commercial RED batch
on:
  push:
    branches: [airlinesimulator-foundation-ci]
    paths: [.github/workflows/airlinesimulator-foundation-ci.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [ledger, quotes, booking]
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: Persie0/airlinesimulator
          ref: f931c48d09f4ef8f6af020d444c297dbd691b6d2
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Confirm expected missing commercial API
        working-directory: private-source
        shell: bash
        env:
          TASK: ${{ matrix.task }}
        run: |
          case "$TASK" in
            ledger)
              rm tests/Simulation.Tests/{QuoteTests,BookingTests}.cs
              filter=LedgerTests
              expected='CS0246.*(Ledger|Transaction|Entry)|CS0103.*Account'
              ;;
            quotes)
              rm tests/Simulation.Tests/{LedgerTests,BookingTests}.cs
              filter=QuoteTests
              expected='CS0246.*(QuoteService|BookingRequest)|CS0103.*FeeCatalog'
              ;;
            booking)
              rm tests/Simulation.Tests/{LedgerTests,QuoteTests}.cs
              filter=BookingTests
              expected='CS0246.*(BookingService|Inventory|SettlementService)'
              ;;
          esac
          set +e
          dotnet test tests/Simulation.Tests/Simulation.Tests.csproj -c Release --filter "FullyQualifiedName~$filter" > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && grep -Eq "$expected" "$RUNNER_TEMP/red.log"; then
            echo "Expected RED verified for $TASK"
          else
            echo "Expected RED not established for $TASK"
            grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}' "$RUNNER_TEMP/red.log" | sort | uniq -c || true
            exit 1
          fi
