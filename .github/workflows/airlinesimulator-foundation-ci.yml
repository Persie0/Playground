name: Airline simulator tasks 09–10 GREEN foundation batch
on:
  push:
    branches: [airlinesimulator-foundation-ci]
    paths: [.github/workflows/airlinesimulator-foundation-ci.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: ${{ matrix.check }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: save-system
            os: ubuntu-latest
          - check: foundation-gate
            os: ubuntu-latest
          - check: full-release
            os: ubuntu-latest
          - check: full-debug
            os: ubuntu-latest
          - check: windows-release
            os: windows-latest
          - check: godot-headless
            os: ubuntu-latest
          - check: godot-window
            os: ubuntu-latest
          - check: linux-export
            os: ubuntu-latest
          - check: windows-export
            os: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: Persie0/airlinesimulator
          ref: 00d967854d752fb41b4fa5c66eaf530bb4ef4c80
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Build and test (private output suppressed)
        working-directory: private-source
        shell: bash
        env:
          CHECK: ${{ matrix.check }}
        run: |
          config=Release
          if [ "$CHECK" = full-debug ]; then config=Debug; fi
          args=(tests/Simulation.Tests/Simulation.Tests.csproj -c "$config")
          expected=59
          case "$CHECK" in
            flight-lifecycle) args+=(--filter FullyQualifiedName~SaveTests); expected=8 ;;
            passenger-queue) args+=(--filter FullyQualifiedName~FoundationGateTests); expected=1 ;;
            *)
              if dotnet build AirlineSimulator.sln -c "$config" > "$RUNNER_TEMP/build.log" 2>&1; then
                echo 'Solution build PASS'
              else
                echo 'Solution build FAIL'
                grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}' "$RUNNER_TEMP/build.log" | sort | uniq -c || true
                exit 1
              fi
              args+=(--no-build)
              ;;
          esac
          if dotnet test "${args[@]}" > "$RUNNER_TEMP/test.log" 2>&1; then
            grep -Eo 'Passed: *[0-9]+|Failed: *[0-9]+|Total: *[0-9]+' "$RUNNER_TEMP/test.log" || true
            grep -Eq "Passed: *$expected([^0-9]|$)" "$RUNNER_TEMP/test.log"
            echo "Expected $expected tests PASS"
          else
            echo 'Tests FAIL'
            grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}|Failed: *[0-9]+' "$RUNNER_TEMP/test.log" | sort | uniq -c || true
            exit 1
          fi
      - name: Install Godot
        if: startsWith(matrix.check, 'godot-') || endsWith(matrix.check, '-export')
        shell: bash
        run: |
          version=4.7.2-stable
          curl --fail --location --retry 3 --silent --show-error "https://github.com/godotengine/godot-builds/releases/download/$version/Godot_v${version}_mono_linux_x86_64.zip" -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          editor=$(find "$RUNNER_TEMP/godot" -type f -name 'Godot*_mono_linux.x86_64' -print -quit)
          test -n "$editor"
          chmod +x "$editor"
          echo "GODOT_EDITOR=$editor" >> "$GITHUB_ENV"
      - name: Import project and compile scripts
        if: startsWith(matrix.check, 'godot-') || endsWith(matrix.check, '-export')
        working-directory: private-source
        shell: bash
        run: |
          if "$GODOT_EDITOR" --headless --editor --path . --import > "$RUNNER_TEMP/import.log" 2>&1 && dotnet build AirlineSimulator.csproj -c Debug >> "$RUNNER_TEMP/import.log" 2>&1; then
            echo 'Godot import and Debug build PASS'
          else
            echo 'Godot import or Debug build FAIL'
            grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}' "$RUNNER_TEMP/import.log" | sort | uniq -c || true
            exit 1
          fi
      - name: Run actual greybox scene assertions
        if: startsWith(matrix.check, 'godot-')
        working-directory: private-source
        shell: bash
        env:
          CHECK: ${{ matrix.check }}
        run: |
          set +e
          if [ "$CHECK" = godot-window ]; then
            LIBGL_ALWAYS_SOFTWARE=1 timeout 90 xvfb-run -a -s '-screen 0 1280x720x24' "$GODOT_EDITOR" --path . --audio-driver Dummy --quit-after 300 -- --greybox-smoke > "$RUNNER_TEMP/boot.log" 2>&1
          else
            timeout 90 "$GODOT_EDITOR" --headless --path . --quit-after 300 -- --greybox-smoke > "$RUNNER_TEMP/boot.log" 2>&1
          fi
          status=$?
          set -e
          echo "Exit status: $status"
          for marker in AIRLINE_BOOT_OK:1 AIRLINE_GREYBOX_OK; do
            if grep -q "$marker" "$RUNNER_TEMP/boot.log"; then echo "$marker present"; else echo "$marker missing"; fi
          done
          echo "Engine error count: $(grep -Ec 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/boot.log" || true)"
          test "$status" -eq 0
          grep -q 'AIRLINE_GREYBOX_OK' "$RUNNER_TEMP/boot.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/boot.log"
      - name: Export Linux game and run packaged scene assertions
        if: matrix.check == 'linux-export'
        working-directory: private-source
        shell: bash
        run: |
          version=4.7.2-stable
          curl --fail --location --retry 3 --silent --show-error "https://github.com/godotengine/godot-builds/releases/download/$version/Godot_v${version}_mono_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          dest="$HOME/.local/share/godot/export_templates/4.7.2.stable.mono"
          mkdir -p "$dest"
          cp -a "$RUNNER_TEMP/templates/templates/." "$dest/"
          mkdir -p exports/linux
          "$GODOT_EDITOR" --headless --path . --export-release Linux exports/linux/AirlineSimulator.x86_64 > "$RUNNER_TEMP/export.log" 2>&1
          test -s exports/linux/AirlineSimulator.x86_64
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/export.log"
          chmod +x exports/linux/AirlineSimulator.x86_64
          timeout 90 exports/linux/AirlineSimulator.x86_64 --headless --quit-after 300 -- --greybox-smoke > "$RUNNER_TEMP/export-boot.log" 2>&1
          grep -q 'AIRLINE_GREYBOX_OK' "$RUNNER_TEMP/export-boot.log"
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/export-boot.log"
          echo 'Exported Linux scene assertions PASS'

      - name: Export Windows release (no artifacts uploaded)
        if: matrix.check == 'windows-export'
        working-directory: private-source
        shell: bash
        run: |
          version=4.7.2-stable
          curl --fail --location --retry 3 --silent --show-error "https://github.com/godotengine/godot-builds/releases/download/$version/Godot_v${version}_mono_export_templates.tpz" -o "$RUNNER_TEMP/templates.tpz"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/templates"
          dest="$HOME/.local/share/godot/export_templates/4.7.2.stable.mono"
          mkdir -p "$dest"
          cp -a "$RUNNER_TEMP/templates/templates/." "$dest/"
          mkdir -p exports/windows
          "$GODOT_EDITOR" --headless --path . --export-release "Windows Desktop" exports/windows/AirlineSimulator.exe > "$RUNNER_TEMP/export.log" 2>&1
          test -s exports/windows/AirlineSimulator.exe
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|ERROR:' "$RUNNER_TEMP/export.log"
          echo 'Windows desktop export PASS'
