name: SkipSilencePlayer round 3 native screenshot review
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/skipsilenceplayer-round3-native-screens.yml
permissions:
  contents: read
jobs:
  android:
    name: Android phone at 130 percent text
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/SkipSilencePlayer
          ref: ac79ad452f176de36627a5c8ba5ccd02cf96ee1b
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          path: app
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Assemble native APK
        working-directory: app/kotlin-android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon
      - name: Allow Android emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r app/kotlin-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put system font_scale 1.3
            sleep 15
            # The stock Pixel Launcher can display an unrelated boot-time ANR.
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell am start -n at.persie0.skipsilenceplayer/.MainActivity
            sleep 10
            adb exec-out screencap -p > android-home.png
            echo 'ANDROID_SCREENSHOT_START'
            base64 -w 0 android-home.png
            echo
            echo 'ANDROID_SCREENSHOT_END'
      - uses: actions/upload-artifact@v4
        with:
          name: SkipSilencePlayer-android-native-review
          path: android-home.png
          if-no-files-found: warn
  ios:
    if: github.event_name == 'workflow_dispatch'
    name: iPhone simulator home screenshot
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/SkipSilencePlayer
          ref: ac79ad452f176de36627a5c8ba5ccd02cf96ee1b
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          path: app
      - name: Build iOS simulator app
        run: |
          xcodebuild -project app/swift-ios/SkipSilencePlayer.xcodeproj -scheme SkipSilencePlayer \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/SkipDerived" CODE_SIGNING_ALLOWED=NO build
      - name: Launch in simulator and capture native screenshot
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin)["devices"]; a=[x["udid"] for v in d.values() for x in v if x.get("isAvailable") and x["name"].startswith("iPhone")]; print(a[0] if a else "")')
          test -n "$SIM_ID"
          xcrun simctl boot "$SIM_ID"
          xcrun simctl bootstatus "$SIM_ID" -b
          xcrun simctl install "$SIM_ID" "$RUNNER_TEMP/SkipDerived/Build/Products/Debug-iphonesimulator/SkipSilencePlayer.app"
          xcrun simctl launch "$SIM_ID" at.persie0.SkipSilencePlayer
          sleep 8
          xcrun simctl io "$SIM_ID" screenshot ios-home.png
          sips -Z 700 -s format jpeg -s formatOptions 55 -o ios-review.jpg ios-home.png >/dev/null
          echo 'IOS_SCREENSHOT_START'
          base64 -i ios-review.jpg | tr -d '\n'
          echo
          echo 'IOS_SCREENSHOT_END'
      - uses: actions/upload-artifact@v4
        with:
          name: SkipSilencePlayer-ios-native-review
          path: ios-home.png
          if-no-files-found: warn
