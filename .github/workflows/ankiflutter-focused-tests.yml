name: AnkiFlutter focused tests

on:
  push:
    paths:
      - ankiflutter-focused-target.txt
      - .github/workflows/ankiflutter-focused-tests.yml

permissions:
  contents: read

jobs:
  reviewer-focused:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Read target
        id: target
        run: echo "sha=$(tr -d '\r\n' < ankiflutter-focused-target.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          repository: Persie0/AnkiFlutter
          ref: ${{ steps.target.outputs.sha }}
          path: source
          submodules: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: source/app
        run: flutter pub get
      - name: Analyze Flutter app
        working-directory: source/app
        run: flutter analyze
      - name: Run reviewer focused tests
        working-directory: source/app
        run: |
          flutter test \
            test/core/backend/backend_operation_test.dart \
            test/features/card_info/data/anki_card_info_repository_test.dart \
            test/features/card_info/card_info_formatters_test.dart \
            test/features/card_info/card_info_page_test.dart \
            test/features/reviewer/review_controller_card_info_test.dart \
            test/features/reviewer/review_controller_auto_advance_parity_test.dart \
            test/features/reviewer/review_controller_stale_completion_test.dart \
            test/features/reviewer/review_page_typed_answer_test.dart \
            test/features/reviewer/data/anki_review_typed_answer_repository_test.dart \
            test/features/reviewer/data/anki_review_delete_note_repository_test.dart \
            test/features/reviewer/review_delete_note_test.dart \
            test/features/reviewer/data/anki_review_forget_card_repository_test.dart \
            test/features/reviewer/review_forget_card_test.dart \
            test/features/reviewer/data/anki_review_set_due_date_repository_test.dart \
            test/features/reviewer/review_set_due_date_test.dart \
            test/features/reviewer/review_controller_options_test.dart \
            test/features/reviewer/review_options_test.dart
