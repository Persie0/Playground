name: Photo Sphere checkpoint 233 original ARM oriented patch grids
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-oriented-patch-233.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-original-grid:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: parity/checkpoint233-native-oriented-offsets
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: Exact private source version
        run: git rev-parse HEAD
      - name: Test original native grid and all other Rust behaviors
        run: |
          cargo test --locked
