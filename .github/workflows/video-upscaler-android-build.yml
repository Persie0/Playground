name: Video Upscaler Android build (private repo)
# Compile full Android port at latest feature-branch head
on:
  push:
    paths:
      - .github/workflows/video-upscaler-android-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout private app into runner
        uses: actions/checkout@v4
        with:
          repository: Persie0/video_upscaler_android
          ref: feat/native-android-upscaler
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: appsrc
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android 35 platform
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build and test Android
        working-directory: appsrc
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-upscaler-android-test-reports
          path: appsrc/app/build/reports/tests/
          if-no-files-found: ignore
