name: Fix HanziHero PR81 stale test expectation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hanzi-pr81-fix.yml'

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate private repository token
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$REPO_TOKEN"

      - name: Checkout HanziHero PR81 branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/hanzi_hero
          ref: chore/lower-free-interactions-limit-to-30
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true
          fetch-depth: 0
          path: app

      - name: Correct Pro counter expectation
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('test/providers/safe_settings_provider_test.dart')
          text = path.read_text()
          old = 'expect(pro.dailyCardsViewed, 51);'
          new = 'expect(pro.dailyCardsViewed, 31);'
          if old not in text:
              raise SystemExit('stale expectation target not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- test/providers/safe_settings_provider_test.dart

      - name: Commit and push
        working-directory: app
        run: |
          git config user.name 'OpenAI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/providers/safe_settings_provider_test.dart
          git commit -m 'test: update Pro counter expectation for 30-action cap [skip ci]'
          git push origin HEAD:chore/lower-free-interactions-limit-to-30
