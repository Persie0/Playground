name: TopTravelList Sri Lanka 233 reviews and rankings
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/toptravellist-sri-lanka-233-20261125.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: data/sri-lanka-worldwide-v2-2026
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          fetch-depth: 0
          path: repo
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and generate rankings
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python scripts/validate.py
          python scripts/check_city_benchmarks.py
          python scripts/check_sight_benchmarks.py
          python scripts/check_new_country_reviews.py --country LK
          python scripts/generate_rankings.py --country LK
          python scripts/generate_rankings.py --check
          python scripts/rank.py --kind cities --limit 60
          python scripts/rank.py --kind sights --limit 60
          python scripts/rank.py --kind sights --country LK --limit 20
      - name: Assert coverage, exact scores and evidence levels
        working-directory: repo
        run: |
          python - <<'PY'
          import re
          from decimal import Decimal
          from pathlib import Path
          import yaml
          root=Path('countries/LK')
          d=Path('methodology/reviews/LK')
          txt='\n'.join((d/p).read_text() for p in ['cities.md','sights-heritage-urban.md','sights-nature-coast.md'])
          ids=re.findall(r'^## ((?:city|sight)-lk-[a-z0-9-]+) — ',txt,re.M)
          assert len(ids)==len(set(ids))==233
          assert txt.count('**source-linked-unverified**')==121
          assert txt.count('**editorial-only**')==110
          assert txt.count('**unassessed**')==2
          dims=['impact','uniqueness','significance','experience','depth']
          weights=[30,25,20,15,10]
          high=[]; unranked=[]
          for k,n in [('cities',55),('sights',178)]:
              files=list((root/k).glob('*.yaml'))
              assert len(files)==n,(k,len(files))
              md=(root/f'{k}.md').read_text()
              for f in files:
                  a=yaml.safe_load(f.read_text())
                  assert a['id'] in ids and a['location']['country_code']=='LK'
                  vals=[*(a['scores'][x] for x in dims),*a['scores']['categories'].values()]
                  assert all(v is None or 0<=v<10 for v in vals)
                  section=txt.split('## '+a['id']+' — ',1)[1].split('\n## ',1)[0]
                  assert f']({k}/{f.name})' in md
                  if any(a['scores'][x] is None for x in dims):
                      unranked.append(a['id'])
                      assert '**unassessed**' in section
                      continue
                  total=sum(Decimal(str(a['scores'][x]))*w for x,w in zip(dims,weights))/10
                  assert f'Overall: {total:.2f}/100.' in section,(a['id'],total)
                  if total>=90 or any(v is not None and v>=9.5 for v in vals):
                      high.append(a['id'])
                      assert 'High-score challenge: Not applicable' not in section,a['id']
          assert set(unranked)=={'sight-lk-pidurutalagala','sight-lk-ritigala-strict-natural-reserve'},unranked
          assert len(high)==24,high
          cities=len(list(Path('countries').glob('*/cities/*.yaml')))
          sights=len(list(Path('countries').glob('*/sights/*.yaml')))
          assert (cities,sights)==(1276,3951),(cities,sights)
          print('PASS: 233 named reviews, 231 complete scores, 2 unassessed, 24 high-score challenges; worldwide:',cities,sights,cities+sights)
          PY
      - name: Commit generated rankings
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name toptravellist-editorial-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md countries/LK/cities.md countries/LK/sights.md
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Generate Sri Lanka ranking pages and country directory'
            git push origin HEAD:refs/heads/data/sri-lanka-worldwide-v2-2026
          fi
