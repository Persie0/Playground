name: Validate ExtractAudioFromVideo
on:
  push:
    branches: [main]
    paths: ['.github/workflows/validate-extract-audio.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/ExtractAudioFromVideo
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: target
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build and inspect Android
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_media_licensing.sh
          cd kotlin-android
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace
          mapfile -t libs < <(find app/build -type f \( -name 'libavcodec.so' -o -name 'libavformat.so' -o -name 'libavutil.so' \))
          test "${#libs[@]}" -gt 0
          for lib in "${libs[@]}"; do
            ! strings "$lib" | grep -E -- '--enable-gpl([ =]|$)|--enable-nonfree([ =]|$)'
          done
  ios:
    needs: android
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/ExtractAudioFromVideo
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: target
      - name: Resolve and inspect iOS FFmpeg assets
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/verify_media_licensing.sh
          cd swift-ios/Vendor/FFmpegKitNextLGPL
          swift package resolve
          found=0
          while IFS= read -r b; do
            if file "$b" | grep -q Mach-O; then
              case "$(basename "$b")" in
                ffmpegkit|libavcodec|libavdevice|libavfilter|libavformat|libavutil|libswresample|libswscale)
                  found=$((found+1))
                  otool -l "$b" | grep -q LC_ID_DYLIB
                  ! strings "$b" | grep -E -- '--enable-gpl([ =]|$)|--enable-nonfree([ =]|$)|--enable-libx264([ =]|$)|--enable-libx265([ =]|$)|--enable-libxvid([ =]|$)|--enable-libvidstab([ =]|$)|--enable-librubberband([ =]|$)'
                  ;;
              esac
            fi
          done < <(find .build -type f)
          test "$found" -gt 0
      - name: Build iOS simulator
        working-directory: target/swift-ios
        run: |
          set -o pipefail
          xcodebuild -project ExtractAudioFromVideo.xcodeproj -target ExtractAudioFromVideo -configuration Debug -sdk iphonesimulator CODE_SIGNING_ALLOWED=NO build
