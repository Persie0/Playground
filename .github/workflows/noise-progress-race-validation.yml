name: Noise foreground progress race validation

on:
  push:
    branches: [background-media-processing-validation-20260928]
    paths:
      - '.github/workflows/noise-progress-race-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout noise race fix branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/noise_remover
          ref: fix/android-background-progress-race-20261001
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      - name: Controller race tests
        run: flutter test test/services/android_media_processing_controller_test.dart

      - name: Focused analysis
        run: flutter analyze lib/services/android_media_processing_controller.dart lib/services/android_media_processing_task.dart test/services/android_media_processing_controller_test.dart
