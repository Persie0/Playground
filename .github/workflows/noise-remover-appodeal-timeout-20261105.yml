name: Noise Remover Appodeal timeout reporting regression

on:
  push:
    branches: [main]
    paths: ['.github/workflows/noise-remover-appodeal-timeout-20261105.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require private checkout token
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$TOKEN"
      - name: Checkout Noise Remover
        uses: actions/checkout@v4
        with:
          repository: Persie0/noise_remover
          ref: fix/appodeal-callback-timeout-20261105
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter pub get
        working-directory: app
        run: flutter pub get
      - name: Check changed Dart formatting
        continue-on-error: true
        working-directory: app
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/services/ads_lifecycle_policy.dart \
            lib/services/ad_service.dart \
            lib/main.dart \
            test/services/ads_lifecycle_policy_test.dart \
            test/services/appodeal_timeout_reporting_test.dart
      - name: Run focused regression tests
        working-directory: app
        run: |
          flutter test \
            test/services/ads_lifecycle_policy_test.dart \
            test/services/appodeal_timeout_reporting_test.dart
      - name: Analyze changed sources
        working-directory: app
        run: |
          flutter analyze --no-pub \
            lib/services/ads_lifecycle_policy.dart \
            lib/services/ad_service.dart \
            lib/main.dart \
            test/services/ads_lifecycle_policy_test.dart \
            test/services/appodeal_timeout_reporting_test.dart
