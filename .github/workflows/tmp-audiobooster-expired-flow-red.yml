name: Temporary AudioBooster foreground expiry RED

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-audiobooster-expired-flow-red.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout AudioBooster feature
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: 42dcde111a6b2923ceb7ee4751d22e0aab20584c
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: audiobooster
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: audiobooster
        run: flutter pub get
      - name: Expired flow tests
        working-directory: audiobooster
        run: flutter test test/trial_paywall_flow_test.dart test/heads_up_notification_source_test.dart
