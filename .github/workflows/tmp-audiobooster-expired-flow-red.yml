name: Temporary AudioBooster bootstrap cleanup RED

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-audiobooster-expired-flow-red.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout AudioBooster feature
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: 672cb5a77cf97d7ced6d70dbe8808072e303ad99
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: audiobooster
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: audiobooster
        run: flutter pub get
      - name: Focused source tests
        working-directory: audiobooster
        run: flutter test test/bootstrap_android_source_test.dart test/foreground_engine_source_test.dart
