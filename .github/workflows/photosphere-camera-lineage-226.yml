name: Photo Sphere checkpoint 226 original camera lineage oracle
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-camera-lineage-226.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-camera-lineage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: research/checkpoint226-live-camera-lineage
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install pinned ARM64 native execution dependencies
        run: python3 -m pip install --break-system-packages --quiet -r research/photosphere/checkpoint218/requirements.txt
      - name: Download and fingerprint original GCam library
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Execute six complete method chains against native instructions
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint226/native_live_camera_lineage_probe.py > native-camera-lineage.json
          python3 - <<'PY'
          import json
          data=json.load(open("native-camera-lineage.json"))
          assert len(data["cases"]) == 6
          for case in data["cases"]:
              assert all(len(s["camera_words"])==9 for s in case["stages"])
              print(case["name"],len(case["stages"]),case["stages"][-1]["camera_words"])
          print("CAMERA_LINEAGE_JSON_BEGIN")
          print(json.dumps(data,separators=(",",":")))
          print("CAMERA_LINEAGE_JSON_END")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint226-original-camera-lineage
          path: native-camera-lineage.json
          retention-days: 4
          if-no-files-found: warn
