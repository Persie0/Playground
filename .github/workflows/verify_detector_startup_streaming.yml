name: Verify detector startup streaming

on:
  push:
    paths:
      - '.github/workflows/verify_detector_startup_streaming.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resistor_model fix branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/resistor_model
          ref: fix/detector-colab-startup-stall

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e '.[dev,detection,export]' onnxruntime

      - name: Run full tests
        run: pytest -q

      - name: Streaming COCO smoke
        run: |
          python - <<'PY'
          import json, tempfile
          from pathlib import Path
          from resistor_model.detection import load_coco_bbox_metadata

          with tempfile.TemporaryDirectory() as tmp:
              p = Path(tmp) / 'large.coco.json'
              payload = {
                  'images': [{'id': 1, 'file_name': 'x.jpg', 'width': 100, 'height': 50}],
                  'annotations': [{
                      'id': 1,
                      'image_id': 1,
                      'category_id': 1,
                      'bbox': [5, 6, 40, 20],
                      'segmentation': {'size': [50,100], 'counts': 'x' * (20 * 1024 * 1024)},
                      'iscrowd': 0,
                  }],
                  'categories': [{'id': 1, 'name': 'resistor'}],
              }
              p.write_text(json.dumps(payload))
              cats, images, anns = load_coco_bbox_metadata(p, progress_label='synthetic')
              assert cats == {1: 'resistor'}
              assert len(images) == 1 and len(anns) == 1
              assert set(anns[0]) == {'image_id','category_id','bbox','iscrowd'}
              print('streaming bbox parser OK')
          PY

      - name: SSDLite startup and loss smoke
        run: |
          python - <<'PY'
          import torch
          from resistor_model.detection import build_ssdlite_model
          model = build_ssdlite_model(num_classes=2, pretrained_backbone=False)
          model.train()
          images=[torch.rand(3,320,320)]
          targets=[{'boxes':torch.tensor([[30.,80.,290.,240.]]), 'labels':torch.tensor([1])}]
          losses=model(images,targets)
          total=sum(losses.values())
          assert torch.isfinite(total)
          print('finite loss', float(total))
          PY
