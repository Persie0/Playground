name: Head model MakeHuman tests

on:
  push:
    paths:
      - ".github/workflows/head-model-makehuman-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Head_model
        uses: actions/checkout@v4
        with:
          repository: Persie0/Head_model
          ref: main
          path: Head_model
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: Head_model
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[train,export,dev]"
      - name: Compile
        working-directory: Head_model
        run: |
          python -m compileall -q src tests colab/train_headscan_lite_colab.py
      - name: Test
        working-directory: Head_model
        run: pytest -q
