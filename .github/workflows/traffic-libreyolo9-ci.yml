name: Traffic LibreYOLO9 migration CI
# rerun after rectangular metadata compatibility fix

on:
  push:
    branches:
      - traffic-libreyolo9-ci
  workflow_dispatch:
    inputs:
      ref:
        description: Private traffic-counting branch, tag, or SHA
        required: true
        default: chore/libreyolo9-migration
        type: string

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/traffic-counting-light-main
  APP_REF: ${{ inputs.ref || 'chore/libreyolo9-migration' }}

jobs:
  libreyolo9-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout private traffic branch
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/edge/pyproject.toml

      - name: Install runtime, test and LibreYOLO export dependencies
        working-directory: app/edge
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[pi,dev,libreyolo-export]'

      - name: Export both active LibreYOLO9t NCNN shapes
        working-directory: app
        run: |
          python tools/export_libreyolo9_ncnn.py --overwrite

      - name: Validate generated artifacts and active config references
        working-directory: app
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          root = Path(".")
          expected = {
              root / "edge/models/libreyolo9t_384x288_ncnn_model": (288, 384),
              root / "edge/models/libreyolo9t_416x256_ncnn_model": (256, 416),
          }

          for model_dir, shape in expected.items():
              for name in ("model.ncnn.param", "model.ncnn.bin", "metadata.yaml", "provenance.json"):
                  path = model_dir / name
                  assert path.is_file() and path.stat().st_size > 0, path

              metadata = yaml.safe_load((model_dir / "metadata.yaml").read_text())
              assert metadata["model_family"] == "yolo9", metadata
              assert metadata["task"] == "detect", metadata
              assert (int(metadata["imgsz_h"]), int(metadata["imgsz_w"])) == shape, metadata

          active_files = [
              root / "edge/configs/runtime/pi_camera.yaml",
              root / "edge/configs/runtime/webcam.yaml",
              root / "edge/configs/runtime/recording.yaml",
              root / "edge/configs/runtime/recording_last10min.yaml",
              root / "edge/configs/benchmark/ncnn.yaml",
              root / "benchmarks/scripts/benchmark_pi5_arm_ncnn_pipeline.py",
              root / "benchmarks/scripts/benchmark_thread_budget.py",
          ]
          for path in active_files:
              text = path.read_text(encoding="utf-8").lower()
              assert "yolo11n_" not in text, path
              assert "libreyolo9t" in text, path
          PY

      - name: Run LibreYOLO decoder and config regression tests
        working-directory: app/edge
        env:
          PYTHONPATH: ${{ github.workspace }}/app/edge/src
        run: |
          python -m pytest -q             tests/test_ncnn_output.py             tests/test_pi_detector_config.py             tests/test_config.py             tests/test_ncnn_nms.py

      - name: Run complete edge tests
        working-directory: app/edge
        env:
          PYTHONPATH: ${{ github.workspace }}/app/edge/src
          MPLBACKEND: Agg
        run: python -m pytest -q tests

      - name: Run project tests
        working-directory: app
        env:
          PYTHONPATH: ${{ github.workspace }}/app/edge/src
          MPLBACKEND: Agg
        run: python -m pytest -q project_tests

      - name: Compile Python sources
        working-directory: app
        run: python -m compileall -q edge/src edge/tests edge/scripts experiments tools project_tests

      - name: Ruff migration-critical Python
        working-directory: app/edge
        run: |
          python -m ruff check --select F,E9             src/detectors/ncnn_detector.py             src/detectors/ncnn_output.py             tests/test_ncnn_output.py             tests/test_pi_detector_config.py             ../tools/export_libreyolo9_ncnn.py             ../../benchmarks/scripts/benchmark_pi5_arm_ncnn_pipeline.py             ../../benchmarks/scripts/benchmark_thread_budget.py
