name: AudioBooster native Kotlin checks
# Public validation for the native Kotlin migration (release-lint fixed head).
# exact PR-head validation: 04d042b0d2591d28f971ee53e9faa53c94c4db39

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audiobooster-kotlin.yml
  workflow_dispatch:
    inputs:
      audio_ref:
        description: AudioBooster branch, tag, or commit to validate
        required: false
        default: native-kotlin-rewrite

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Playground
        uses: actions/checkout@v4

      - name: Check out AudioBooster
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: ${{ inputs.audio_ref || '04d042b0d2591d28f971ee53e9faa53c94c4db39' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: audiobooster

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=""
          for root in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk /opt/android-sdk; do
            [ -n "$root" ] || continue
            candidate="$(find "$root" -type f -name sdkmanager 2>/dev/null | head -n1 || true)"
            if [ -n "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"

      - name: Validate native-only active tree
        working-directory: audiobooster
        shell: bash
        run: |
          set -euo pipefail
          test -d old/lib
          test -f old/pubspec.yaml
          test ! -f pubspec.yaml
          test ! -d lib
          if grep -R -n -E 'io\.flutter|dev\.flutter|flutterEmbedding|GeneratedPluginRegistrant'               --exclude-dir=old --exclude-dir=.git .; then
            echo '::error::Active project still contains Flutter host references.'
            exit 1
          fi

      - name: Unit tests and APK builds
        working-directory: audiobooster
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon             :app:testDebugUnitTest             :app:assembleDebug             :app:assembleDebugAndroidTest             :app:assembleRelease             --stacktrace
