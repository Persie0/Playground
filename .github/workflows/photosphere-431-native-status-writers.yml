name: Photosphere 431 original matcher pair-status store source scan
on:
  push:
    branches: [main]
    paths: [.github/workflows/photosphere-431-native-status-writers.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: photosphere-431-native-status-writers
  cancel-in-progress: false
jobs:
  original-fourth-matcher-status-store:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Pinned private source checkout read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 8043ef02c6e28f661b55be27f8d007e47ac34a90
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify pinned commit and install static ELF tools
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 8043ef02c6e28f661b55be27f8d007e47ac34a90
          python3 -m pip install --quiet --break-system-packages capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint431/scan_original_native_pair_status_producers.py
      - name: Verify original pinned Google Camera APK and ELF
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Download prior validated fourth-image source pair receipt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 43051591742 --repo Persie0/Playground \
            --name photosphere-430-original-pair-status-only \
            --dir source-only
          test -s source-only/checkpoint430-source-pair-status-inputs.json
      - name: Source scan original matcher pair-status producers, cross-checking source pair receipt
        working-directory: research-src
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint431/scan_original_native_pair_status_producers.py original.so \
            --source-pairs ../source-only/checkpoint430-source-pair-status-inputs.json \
            --out checkpoint431-native-status-writer-map.json
          test -s checkpoint431-native-status-writer-map.json
      - name: Delete proprietary original executable before artifact upload
        if: always()
        working-directory: research-src
        run: |
          rm -f original.apk original.so com.google.android.GoogleCamera_*.apk
      - name: Upload source-only numeric dispatch map
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-431-native-status-producers-source
          path: research-src/checkpoint431-native-status-writer-map.json
          if-no-files-found: warn
          retention-days: 7
