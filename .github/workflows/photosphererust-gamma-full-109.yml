name: Photo Sphere full gamma regression checkpoint 109
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/photosphererust-gamma-full-109.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        config: [default, portable, android-jni]
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereRust
          ref: f54ad7127e1f2663c3a9489173cb38d34f64df12
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          path: PhotosphereRust
      - uses: dtolnay/rust-toolchain@stable
      - name: Run complete Rust regression suite on pinned native gamma implementation
        working-directory: PhotosphereRust
        shell: bash
        env:
          CONFIG: ${{ matrix.config }}
        run: |
          set -euo pipefail
          case "$CONFIG" in
            default) cargo test --all-targets ;;
            portable) cargo test --all-targets --no-default-features ;;
            android-jni) cargo test --all-targets --features android-jni ;;
          esac
          cargo fmt --all -- --check
