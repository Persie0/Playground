name: ToiletCompass release manifest verification

# Keep all CI activity in this public Playground repository.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout private app using Playground secret
        uses: actions/checkout@v4
        with:
          repository: Persie0/toiletcompass
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Restore Flutter-generated Gradle wrapper (not committed in app repo)
        working-directory: app
        run: flutter create --platforms=android --project-name=toiletcompass --no-pub .

      - name: Merge Android release manifest
        working-directory: app/android
        run: ./gradlew --no-daemon :app:processReleaseMainManifest

      - name: Assert merged release has no foreground-service permissions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          # Inspect only the final application manifest, not plugin-library manifests.
          app_dir = Path("app/build/app")
          candidates = [
              p for p in app_dir.rglob("AndroidManifest.xml")
              if ("/merged_manifest/" in str(p) or "/merged_manifests/" in str(p))
              and "/release/" in str(p)
          ]
          if not candidates:
              raise SystemExit("ERROR: No merged release AndroidManifest.xml produced by Gradle")
          ns = "{http://schemas.android.com/apk/res/android}name"
          for manifest in candidates:
              root = ET.parse(manifest).getroot()
              permissions = [
                  element.get(ns, "")
                  for element in root
                  if element.tag in ("uses-permission", "uses-permission-sdk-23", "uses-permission-sdk-m")
              ]
              unexpected = [p for p in permissions if p.startswith("android.permission.FOREGROUND_SERVICE")]
              print(f"Verified {manifest}: {len(permissions)} permissions; forbidden={unexpected}")
              if unexpected:
                  raise SystemExit("ERROR: foreground-service permissions remain in merged release manifest")
          PY

