name: ToiletCompass foreground-service fix and Play retry

# Keep all CI activity in this public Playground repository.
on:
  push:
    paths:
      - .github/workflows/toiletcompass-foreground-service-play-retry.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout private app using Playground secret
        uses: actions/checkout@v4
        with:
          repository: Persie0/toiletcompass
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Merge Android release manifest
        working-directory: app/android
        run: ./gradlew --no-daemon :app:processReleaseMainManifest

      - name: Assert merged release has no foreground-service permissions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          app_dir = Path("app/build")
          candidates = [
              p for p in app_dir.rglob("AndroidManifest.xml")
              if ("/merged_manifest/" in str(p) or "/merged_manifests/" in str(p))
              and "/release/" in str(p)
          ]
          if not candidates:
              raise SystemExit("ERROR: No merged release AndroidManifest.xml produced by Gradle")
          ns = "{http://schemas.android.com/apk/res/android}name"
          for manifest in candidates:
              root = ET.parse(manifest).getroot()
              permissions = [
                  element.get(ns, "")
                  for element in root
                  if element.tag in ("uses-permission", "uses-permission-sdk-23", "uses-permission-sdk-m")
              ]
              unexpected = [p for p in permissions if p.startswith("android.permission.FOREGROUND_SERVICE")]
              print(f"Verified {manifest}: {len(permissions)} permissions; forbidden={unexpected}")
              if unexpected:
                  raise SystemExit("ERROR: foreground-service permissions remain in merged release manifest")
          PY

      - name: Dispatch public Firebase builder release
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::Missing repository token"; exit 1; }
          STARTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run play_auto.yml \
            --repo Persie0/firebase_tester_builder \
            --ref main \
            -f app=toiletcompass \
            -f build_apk=true \
            -f run_tests=false \
            -f branch=main

          RUN_ID=""
          for attempt in $(seq 1 60); do
            RUN_ID="$(gh run list \
              --repo Persie0/firebase_tester_builder \
              --workflow play_auto.yml \
              --event workflow_dispatch \
              --limit 30 \
              --json databaseId,createdAt,displayTitle \
              --jq ".[] | select(.createdAt >= \"${STARTED_AT}\" and (.displayTitle | contains(\"Deploy toiletcompass\"))) | .databaseId" \
              | head -n 1)"
            test -z "$RUN_ID" || break
            sleep 5
          done
          test -n "$RUN_ID" || { echo "::error::Dispatched release run not found"; exit 1; }
          echo "Play release run: https://github.com/Persie0/firebase_tester_builder/actions/runs/$RUN_ID"
          gh run watch "$RUN_ID" --repo Persie0/firebase_tester_builder --exit-status
