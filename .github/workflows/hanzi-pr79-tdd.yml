name: HanziHero PR79 soft-paywall TDD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hanzi-pr79-tdd.yml'
      - 'hanzi-pr79-tdd/run.txt'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout HanziHero feature branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/hanzi_hero
          ref: feature/engagement-soft-paywall
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: app
        run: flutter pub get
      - name: Run PR79 regression test
        working-directory: app
        run: flutter test test/engagement_soft_paywall_pro_guard_test.dart
