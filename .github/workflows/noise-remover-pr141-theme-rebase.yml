name: Noise Remover PR141 theme rebase

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noise-remover-pr141-theme-rebase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Checkout current Noise Remover master
        uses: actions/checkout@v5
        with:
          repository: Persie0/noise_remover
          ref: master
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: app
          fetch-depth: 0
      - name: Rebase conflict-free accessibility theme
        working-directory: app
        run: |
          git fetch origin design/material3-accessibility-refresh
          git checkout -B design/material3-accessibility-refresh origin/master
          git show origin/design/material3-accessibility-refresh:lib/theme.dart > lib/theme.dart
          flutter pub get
          flutter gen-l10n
          dart format lib/theme.dart
          flutter analyze --no-fatal-infos
          flutter test
      - name: Commit and update PR branch
        working-directory: app
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          git config user.name 'Persie0'
          git config user.email '76871553+Persie0@users.noreply.github.com'
          git add lib/theme.dart
          git commit -m 'Rebase Material 3 accessibility theme onto current master'
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/Persie0/noise_remover.git"
          git push --force-with-lease origin HEAD:design/material3-accessibility-refresh
