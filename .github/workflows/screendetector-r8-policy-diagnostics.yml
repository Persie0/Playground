name: Screendetector R8 policy diagnostics
run-name: Screendetector R8 / DEX size diagnostics (no Play upload)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/screendetector-r8-policy-diagnostics.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout private screendetector without persisting token
        uses: actions/checkout@v4
        with:
          repository: Persie0/screendetector
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --channel=3 "platforms;android-37.0" "ndk;29.0.13599879" >/dev/null
          if [ -d "$ANDROID_SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$ANDROID_SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$ANDROID_SDK_ROOT/platforms/android-37"
          fi

      - uses: endersonmenezes/free-disk-space@v2
        with:
          remove_android: false
          remove_dotnet: false
          remove_haskell: true
          remove_tool_cache: false
          remove_swap: false
          remove_packages_one_command: true
          remove_folders: /usr/share/swift
          testing: false

      - name: Use temporary CI-only upload signing key
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt -keystore android/app/r8-ci.jks \
            -storepass diagnostic -keypass diagnostic -alias ci \
            -keyalg RSA -keysize 2048 -validity 365 \
            -dname "CN=R8 Diagnostic, OU=CI, O=CI, L=CI, S=CI, C=US"
          cat > android/key.properties <<'EOF'
          storePassword=diagnostic
          keyPassword=diagnostic
          keyAlias=ci
          storeFile=r8-ci.jks
          EOF
          # This unsigned-for-Play diagnostic is never published or uploaded.

      - name: Resolve Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Build release bundle for local inspection only
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          flutter build appbundle --obfuscate --split-debug-info=./build

      - name: Inspect actual DEX size and R8 coverage
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          aab = Path('build/app/outputs/bundle/release/app-release.aab')
          with ZipFile(aab) as archive:
              dex = [x for x in archive.infolist() if x.filename.startswith('base/dex/') and x.filename.endswith('.dex')]
              total = sum(x.file_size for x in dex)
              print(f'DEX_SIZE_BYTES={total} DEX_SIZE_MB={total / 1_000_000:.3f} DEX_FILES={len(dex)}')
              print(f'PLAY_2027_DEX_THRESHOLD_EXCEEDED={total > 10_000_000}')
              data = json.loads(archive.read('BUNDLE-METADATA/com.android.tools/r8.json'))
          def find(node, name):
              if isinstance(node, dict):
                  if name in node:
                      return node[name]
                  for value in node.values():
                      found = find(value, name)
                      if found is not None:
                          return found
              if isinstance(node, list):
                  for value in node:
                      found = find(value, name)
                      if found is not None:
                          return found
              return None
          for label, disabled in [('optimization', 'noOptimizationPercentage'), ('obfuscation', 'noObfuscationPercentage'), ('shrinking', 'noShrinkingPercentage')]:
              value = find(data, disabled)
              print(f'R8_{label.upper()}={100 - float(value):.2f}%' if value is not None else f'R8_{label.upper()}=unavailable')
          for key in ['isOptimizationsEnabled', 'isObfuscationEnabled', 'isShrinkingEnabled']:
              print(f'{key}={find(data,key)}')
          reports = list(Path('build').rglob('configanalyzer.html'))
          reports += list(Path('build').rglob('r8-config-analyzer-release.html'))
          for report in reports[:10]:
              print(f'CONFIG_ANALYZER_PATH={report}')
          Path('r8_diagnostics.json').write_text(json.dumps({'dexBytes': total, 'play2027DexGateExceeded': total > 10_000_000}))
          PY

      - name: Upload R8 analyzer and size results (not private app bundle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screendetector-r8-diagnostics
          path: |
            app/r8_diagnostics.json
            app/build/**/configanalyzer.html
            app/build/**/r8-config-analyzer-release.html
          if-no-files-found: warn
          retention-days: 3
