name: Noise Remover private Android dependency audit
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Private app branch, tag, or SHA
        required: false
        default: master
        type: string
permissions:
  contents: read
env:
  APP_REPOSITORY: Persie0/noise_remover
  APP_REF: ${{ inputs.ref || 'master' }}
jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout private app revision
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app
      - name: Checkout private CI harness
        uses: actions/checkout@v5
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: master
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-ci
          sparse-checkout: .github/playground
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Run private dependency audit
        run: bash private-ci/.github/playground/dependency-audit.sh app
