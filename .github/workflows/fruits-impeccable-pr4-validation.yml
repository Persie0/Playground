name: Fruit Explorer PR 4 validation
on:
  push:
    paths:
      - '.github/workflows/fruits-impeccable-pr4-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/fruits
          ref: 35e4e9a62fcb0b7e88512617afb1e24375785ce7
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Resolve dependencies
        run: flutter pub get > /tmp/fruits-deps.log 2>&1
      - name: Analyze and test
        shell: bash
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > /tmp/fruits-analyze.log 2>&1
          a=$?
          flutter test --dart-define=ORCHARD_CAPTURE=true --reporter expanded > /tmp/fruits-test.log 2>&1
          t=$?
          echo "Analyzer exit: $a"
          echo "Test exit: $t"
          # Only expose diagnostic codes and locations, never private source lines.
          grep -E '^[[:space:]]*(error|warning|info) •' /tmp/fruits-analyze.log | sed -E 's/^[[:space:]]*(error|warning|info) • .* • ([^•]+) • ([a-z_]+)$/\1 • \2 • \3/' | grep -E '^(error|warning|info) • [^•]+ • [a-z_]+$' || true
          grep -E '^[0-9]{2}:[0-9]{2} [+0-9 ~-]+: (All tests passed!|Some tests failed\.)$' /tmp/fruits-test.log || true
          grep -E '^[0-9]{2}:[0-9]{2} [+0-9 ~-]+: .*\[E\]$' /tmp/fruits-test.log | sed -E 's/^.*: /Failed test: /' || true
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/fruits-test.log').read_text()
          for line in log.splitlines():
              if re.search(r'A RenderFlex overflowed by [\d.]+ pixels on the (left|right|top|bottom)', line):
                  print(re.search(r'A RenderFlex overflowed by [\d.]+ pixels on the (left|right|top|bottom)', line).group())
              elif re.match(r'^\s*(Expected:|Actual:|Which:|The following .* was thrown|Multiple exceptions)', line):
                  print(line[:250])
              elif re.search(r'orchard_ui_test\.dart:\d+:\d+', line):
                  print(re.search(r'orchard_ui_test\.dart:\d+:\d+', line).group())
          PY
          test "$a" = 0 && test "$t" = 0

      - name: Inspect bundled font metadata
        if: always()
        run: |
          for f in assets/fonts/*.ttf; do
            printf '%s: ' "$(basename "$f")"
            fc-scan --format '%{family} | %{style}\n' "$f"
          done
      - name: Build synthetic visual preview
        if: success()
        shell: bash
        run: |
          flutter create --platforms=web --project-name fruits . >/tmp/fruits-web-setup.log 2>&1
          python3 - <<'PY'
          from pathlib import Path
          source = Path('test/orchard_flow_test.dart').read_text()
          fixture = source[source.index('FruitEntry _fruit('):source.index('class _FailOnceStore')]
          Path('lib/qa_preview.dart').write_text("""import 'package:flutter/material.dart';
          import 'fruit_entry.dart';
          import 'fruit_tracker_store.dart';
          import 'main.dart';
          """ + fixture + """
          void main() => runApp(MainApp(store: FruitTrackerStore.withEntries(_entries())));
          """)
          PY
          flutter build web --target lib/qa_preview.dart >/tmp/fruits-web-build.log 2>&1
      - name: Capture real renderer
        if: success()
        shell: bash
        run: |
          mkdir -p qa_captures
          python3 -m http.server 8765 --directory build/web >/tmp/fruits-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          mkdir -p /tmp/fruits-preview
          cd /tmp/fruits-preview
          npm install --no-save playwright >/tmp/fruits-playwright.log 2>&1
          cat > capture.cjs <<'JS'
          const {chromium} = require('playwright');
          (async () => {
            const browser = await chromium.launch({executablePath:'/usr/bin/google-chrome',args:['--no-sandbox']});
            for (const [name,width,height] of [['phone',390,844],['tablet',800,1024]]) {
              const page = await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
              await page.goto('http://localhost:8765',{waitUntil:'networkidle',timeout:90000});
              await page.waitForTimeout(3000);
              await page.screenshot({path:process.env.GITHUB_WORKSPACE+'/qa_captures/real-'+name+'-home.png'});
              for (const [index,tab] of [[1,'explore'],[2,'journal'],[3,'stats']]) {
                await page.mouse.click(width*(index+.5)/4,height-36);
                await page.waitForTimeout(500);
                await page.screenshot({path:process.env.GITHUB_WORKSPACE+'/qa_captures/real-'+name+'-'+tab+'.png'});
              }
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error('Capture failed');process.exit(1)});
          JS
          node capture.cjs
      - name: Preserve synthetic screen captures in the private repository only
        if: always()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set +x
          if [ ! -d qa_captures ]; then
            echo 'No captures produced.'
            exit 0
          fi
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess
          count = 0
          for p in sorted(pathlib.Path('qa_captures').glob('*.png')):
              dest = 'qa_captures/' + os.environ['GITHUB_RUN_ID'] + '/' + p.name
              body = json.dumps(dict(message='Record synthetic UI capture', branch='qa/orchard-pr4-captures', content=base64.b64encode(p.read_bytes()).decode()))
              result = subprocess.run(['gh','api','--method','PUT','repos/Persie0/fruits/contents/'+dest,'--input','-'], input=body, text=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              if result.returncode: raise SystemExit('Private capture upload failed')
              count += 1
          print(f'Private captures stored: {count}')
          PY
