name: Photosphere 424 fourth original 2-to-3 RANSAC/refit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-424-fourth-third-robust.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-424-fourth-third-robust
  cancel-in-progress: false
jobs:
  original-fourth-postgraph:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout pinned private research read-only without private Actions
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 463a96afb795cc8d5fbc1d4ea80485cefd9822cf
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Exact source SHA and Python compile
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 463a96afb795cc8d5fbc1d4ea80485cefd9822cf
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py
      - name: Original pinned GCam APK and ELF source checksum
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Execute original fourth [2,3] native RANSAC and optional refit
        working-directory: research-src
        env:
          PHOTOSPHERE_THIRD_SHIFT407: '2'
          PHOTOSPHERE_FOURTH_THIRD_ROBUST424: '1'
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py > checkpoint424-source.log 2> checkpoint424-diagnostic.log || {
            echo 'CHECKPOINT424_NATIVE_THIRD_ROBUST_NOT_VERIFIED'
            tail -n 130 checkpoint424-diagnostic.log
            tail -n 6 checkpoint424-source.log | cut -c1-240
            exit 1
          }
          python3 - <<'PY'
          import json
          row=next(x for x in open('checkpoint424-source.log')
              if x.startswith('CHECKPOINT395_NATIVE_POINT_SETUP_THIRD_ROBUST_ENTRY_REPORT='))
          d=json.loads(row.split('=',1)[1])
          assert d['original_elf_sha256']=='878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1'
          f=d['checkpoint409_fourth_source_descriptor']
          graph=d['checkpoint414_fourth_native_graph']
          first=d['checkpoint411_fourth_native_robust']
          second=d['checkpoint419_fourth_second_robust']
          p=d['checkpoint421_fourth_postreject']
          third=d['checkpoint423_fourth_third_descriptor']
          robust=d['checkpoint424_fourth_third_robust']
          assert f['original_distinct_pixel_offsets']==[0,1,2,3]
          assert len(set(f['original_all_four_source_pixel_sha256']))==4
          assert graph['source_original_reciprocal_graph_verified']
          assert graph['original_native_fourth_pair_indices_i32']==[0,3]
          assert graph['source_native_fourth_point_row_count']==11
          assert first['native_original_trial_count']==550
          assert first['source_native_robust_return_w0']==1
          assert second['native_original_trial_count']==5000
          assert second['native_original_svd_call_count']==5000
          assert second['source_native_robust_return_w0']==0
          assert not second['source_native_refit_executed']
          assert p['source_first_pair_graph_preserved']
          assert p['source_next_candidate_w25']==2
          assert p['source_following_matcher_entered']
          assert third['native_selected_candidate_image']==2
          assert third['source_original_third_matcher_entered']
          assert third['source_original_third_matcher_threshold_reached']
          assert third['source_original_native_raw_matches']==19
          assert third['source_original_threshold_qualifies_robust']
          assert third['source_original_threshold_pc']=='0x1208a0'
          assert third['source_original_third_robust_executed']
          assert third['source_original_endpoint']=='third_native_robust_return'
          assert p['source_original_endpoint']=='third_native_robust_return'
          assert f['source_original_endpoint']=='third_native_robust_return'
          assert robust['source_native_raw_descriptor_matches']==19
          assert robust['source_original_robust_entry_pc']=='0x30f860'
          assert robust['native_original_robust_calls']==1
          assert robust['native_original_trial_budget_verified']
          assert robust['native_original_trial_count'] in (550,5000)
          assert len(robust['test_controlled_imported_rand_values'])==2*robust['native_original_trial_count']
          assert robust['native_original_first_sample_indices']==[0,18]
          assert robust['native_original_svd_call_count']>=robust['native_original_trial_count']
          assert robust['source_native_postloop_pc']=='0x310418'
          assert robust['source_native_postloop_trial_count_w21']==robust['native_original_trial_count']
          assert robust['source_native_robust_return_pc']=='0x120918'
          assert robust['source_native_robust_return_w0'] in (0,1)
          assert third['source_original_third_robust_return_w0']==robust['source_native_robust_return_w0']
          assert third['source_original_third_refit_executed']==robust['source_native_refit_executed']
          assert not third['source_original_third_graph_appended']
          assert not third['source_original_constructor_executed']
          assert not third['native_source_graph_host_patched']
          assert not d['original_full_solver_ceres_executed']
          assert d['bionic_rand_stream_test_controlled']
          with open('checkpoint424-original-source.json','w') as fp:
              json.dump(d,fp,indent=2,sort_keys=True);fp.write('\n')
          print('CHECKPOINT424_ORIGINAL_FOURTH_THIRD_ROBUST_PASS',json.dumps({
              'pair':[2,3],
              'raw_matches':19,
              'native_trials':robust['native_original_trial_count'],
              'native_svd_calls':robust['native_original_svd_call_count'],
              'source_refit':robust['source_native_refit_executed'],
              'source_robust_return_w0':robust['source_native_robust_return_w0'],
          },sort_keys=True))
          PY
      - name: Delete original GCam APK and ELF before artifact upload
        if: always()
        working-directory: research-src
        run: |
          rm -f original.apk research/native/liblightcycle.so com.google.android.GoogleCamera_*.apk
      - name: Archive original fourth third robust numeric source only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-424-original-fourth-third-robust-source
          path: |
            research-src/checkpoint424-original-source.json
            research-src/checkpoint424-diagnostic.log
          retention-days: 7
          if-no-files-found: warn
