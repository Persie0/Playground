name: mac-backgrounds - macOS compile

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths:
      - .github/workflows/mac-backgrounds-compile.yml

permissions:
  contents: read

jobs:
  build:
    name: Swift macOS build (public Playground runner)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout private mac-backgrounds without exposing the token
        uses: actions/checkout@v4
        with:
          repository: Persie0/mac-backgrounds
          ref: 4fe0aa9f6560d1d5bc81e668c233bbd87daa8bba
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
      - name: Validate project metadata
        run: |
          plutil -lint Config/Info.plist Config/LivingDesktop.entitlements
          xcodegen generate --spec project.yml
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Build macOS app (unsigned, no artifact publishing)
        run: |
          xcodebuild -project LivingDesktop.xcodeproj -scheme LivingDesktop -configuration Debug -destination 'platform=macOS' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Run deterministic scene and window-visibility tests
        run: |
          xcodebuild -project LivingDesktop.xcodeproj -scheme LivingDesktop -configuration Debug -destination 'platform=macOS' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO test
      - name: Upload all fourteen scene motion renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Living-Desktop-Scene-Motion-Review
          path: /tmp/living-desktop-motion-review/*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Build optimized Release app and validate bundle resources
        run: |
          set -euo pipefail
          xcodebuild -project LivingDesktop.xcodeproj -scheme LivingDesktop -configuration Release -destination 'platform=macOS' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO ARCHS='arm64 x86_64' build
          APP="DerivedData/Build/Products/Release/Living Desktop.app"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/PrivacyInfo.xcprivacy"
          test -f "$APP/Contents/Resources/Assets.car"
          plutil -lint "$APP/Contents/Info.plist" "$APP/Contents/Resources/PrivacyInfo.xcprivacy"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "com.persie.livingdesktop"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "1.0.0"
          # App Store required-reason APIs: UserDefaults (CA92.1) and systemUptime (35F9.1).
          python3 - "$APP/Contents/Resources/PrivacyInfo.xcprivacy" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              data = plistlib.load(f)
          accessed = {
              entry["NSPrivacyAccessedAPIType"]: set(entry["NSPrivacyAccessedAPITypeReasons"])
              for entry in data["NSPrivacyAccessedAPITypes"]
          }
          assert "CA92.1" in accessed["NSPrivacyAccessedAPICategoryUserDefaults"]
          assert "35F9.1" in accessed["NSPrivacyAccessedAPICategorySystemBootTime"]
          assert data["NSPrivacyTracking"] is False
          PY
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/Living Desktop")"
          echo "Release architectures: $ARCHS"
          [[ " $ARCHS " == *" arm64 "* ]] && [[ " $ARCHS " == *" x86_64 "* ]]
      - name: Checkout validated visual baseline for paired performance comparison
        uses: actions/checkout@v4
        with:
          repository: Persie0/mac-backgrounds
          ref: 7d52a2fbc6d71aca2d521a29fd6d23d82e0d444c
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: benchmark-baseline
      - name: Compare Release renderer performance and pixel output on the same Mac
        run: |
          set -euo pipefail
          mkdir -p /tmp/living-desktop-performance
          touch /tmp/living-desktop-run-benchmark
          trap 'rm -f /tmp/living-desktop-run-benchmark' EXIT
          cp Tests/LivingDesktopTests/RendererPerformanceTests.swift benchmark-baseline/Tests/LivingDesktopTests/
          (
            cd benchmark-baseline
            xcodegen generate --spec project.yml
            xcodebuild -project LivingDesktop.xcodeproj -scheme LivingDesktop -configuration Release -destination 'platform=macOS' -derivedDataPath BenchmarkDerivedData CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES ONLY_ACTIVE_ARCH=YES -parallel-testing-enabled NO -only-testing:LivingDesktopTests/RendererPerformanceTests test
          )
          mv /tmp/living-desktop-render-benchmark.json /tmp/living-desktop-performance/baseline.json
          xcodebuild -project LivingDesktop.xcodeproj -scheme LivingDesktop -configuration Release -destination 'platform=macOS' -derivedDataPath BenchmarkDerivedData CODE_SIGNING_ALLOWED=NO ENABLE_TESTABILITY=YES ONLY_ACTIVE_ARCH=YES -parallel-testing-enabled NO -only-testing:LivingDesktopTests/RendererPerformanceTests test
          mv /tmp/living-desktop-render-benchmark.json /tmp/living-desktop-performance/optimized.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from statistics import median
          p = Path("/tmp/living-desktop-performance")
          baseline = json.loads((p / "baseline.json").read_text())
          optimized = json.loads((p / "optimized.json").read_text())
          a = {(x["scene"], x["surface"]): x for x in baseline}
          b = {(x["scene"], x["surface"]): x for x in optimized}
          assert a.keys() == b.keys()
          rows = []
          mismatches = []
          for k in a:
              old, new = a[k], b[k]
              identical = old["digest"] == new["digest"]
              if not old["timeDependent"] and not identical:
                  mismatches.append(k)
              rows.append(dict(scene=k[0], surface=k[1], before_ms=old["medianMilliseconds"],
                               after_ms=new["medianMilliseconds"], before_p95=old["p95Milliseconds"],
                               after_p95=new["p95Milliseconds"], pixel_identical=identical,
                               clock_dependent=old["timeDependent"]))
          result = dict(rows=rows, median_speedup=median(r["before_ms"]/max(0.000001,r["after_ms"]) for r in rows),
                        exact_non_clock_cases=sum(r["pixel_identical"] and not r["clock_dependent"] for r in rows),
                        mismatches=mismatches,
                        note="Wall-clock frame rendering benchmark, not battery wattage or presentation FPS.")
          (p / "comparison.json").write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          assert not mismatches, f"Unexpected pixel changes: {mismatches}"
          PY
      - name: Upload paired renderer performance and pixel comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Living-Desktop-Renderer-Performance
          path: /tmp/living-desktop-performance/*.json
          retention-days: 7
          if-no-files-found: warn
      - name: Package unsigned test app for macOS
        run: |
          mkdir -p dist
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "DerivedData/Build/Products/Release/Living Desktop.app" \
            "dist/Living-Desktop-macOS-universal-unsigned.zip"
          shasum -a 256 dist/*.zip > dist/SHA256SUMS.txt
      - name: Upload unsigned test build (not a notarized release)
        uses: actions/upload-artifact@v4
        with:
          name: Living-Desktop-macOS-universal-unsigned
          path: dist/
          retention-days: 7
          if-no-files-found: error

