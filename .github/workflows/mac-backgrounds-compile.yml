name: mac-backgrounds - macOS compile

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/mac-backgrounds-compile.yml

permissions:
  contents: read

jobs:
  build:
    name: Swift macOS build (public Playground runner)
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout private mac-backgrounds without exposing the token
        uses: actions/checkout@v4
        with:
          repository: Persie0/mac-backgrounds
          ref: audit/window-geometry-render-lifecycle
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
      - name: Validate project metadata
        run: |
          plutil -lint Config/Info.plist Config/LivingDesktop.entitlements
          xcodegen generate --spec project.yml
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Build macOS app (unsigned, no artifact publishing)
        run: |
          xcodebuild -project LivingDesktop.xcodeproj -scheme LivingDesktop -configuration Debug -destination 'platform=macOS' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO build
      - name: Run deterministic scene and window-visibility tests
        run: |
          xcodebuild -project LivingDesktop.xcodeproj -scheme LivingDesktop -configuration Debug -destination 'platform=macOS' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO test
      - name: Build optimized Release app and validate bundle resources
        run: |
          set -euo pipefail
          xcodebuild -project LivingDesktop.xcodeproj -scheme LivingDesktop -configuration Release -destination 'platform=macOS' -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=NO ARCHS='arm64 x86_64' build
          APP="DerivedData/Build/Products/Release/Living Desktop.app"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/PrivacyInfo.xcprivacy"
          test -f "$APP/Contents/Resources/Assets.car"
          plutil -lint "$APP/Contents/Info.plist" "$APP/Contents/Resources/PrivacyInfo.xcprivacy"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$APP/Contents/Info.plist")" = "com.persie.livingdesktop"
          test "$(plutil -extract CFBundleShortVersionString raw -o - "$APP/Contents/Info.plist")" = "1.0.0"
          # App Store required-reason APIs: UserDefaults (CA92.1) and systemUptime (35F9.1).
          python3 - "$APP/Contents/Resources/PrivacyInfo.xcprivacy" <<'PY'
          import plistlib, sys
          with open(sys.argv[1], "rb") as f:
              data = plistlib.load(f)
          accessed = {
              entry["NSPrivacyAccessedAPIType"]: set(entry["NSPrivacyAccessedAPITypeReasons"])
              for entry in data["NSPrivacyAccessedAPITypes"]
          }
          assert "CA92.1" in accessed["NSPrivacyAccessedAPICategoryUserDefaults"]
          assert "35F9.1" in accessed["NSPrivacyAccessedAPICategorySystemBootTime"]
          assert data["NSPrivacyTracking"] is False
          PY
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/Living Desktop")"
          echo "Release architectures: $ARCHS"
          [[ " $ARCHS " == *" arm64 "* ]] && [[ " $ARCHS " == *" x86_64 "* ]]
      - name: Package unsigned test app for macOS
        run: |
          mkdir -p dist
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "DerivedData/Build/Products/Release/Living Desktop.app" \
            "dist/Living-Desktop-macOS-universal-unsigned.zip"
          shasum -a 256 dist/*.zip > dist/SHA256SUMS.txt
      - name: Upload unsigned test build (not a notarized release)
        uses: actions/upload-artifact@v4
        with:
          name: Living-Desktop-macOS-universal-unsigned
          path: dist/
          retention-days: 7
          if-no-files-found: error

