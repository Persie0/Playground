name: Generate native Head Scanner projects
on:
  push:
    paths:
      - .github/workflows/head-scanner-project-generation.yml
permissions:
  contents: read
jobs:
  generate:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/head_scanner
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: source
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Prepare pinned mobile model resources for XcodeGen
        run: python3 source/scripts/prepare_model.py
      - name: Generate Xcode project
        working-directory: source/ios
        run: xcodegen generate
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12.1"
      - name: Generate Android Gradle wrapper
        working-directory: source/android
        run: gradle --no-daemon wrapper --gradle-version 8.12.1
      - name: Commit only generated projects to private app repository
        working-directory: source
        run: |
          git config user.name "Playground CI"
          git config user.email "playground-ci@users.noreply.github.com"
          git add ios/HeadScanner.xcodeproj android/gradlew android/gradlew.bat android/gradle/wrapper
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m "Add generated Xcode project and Gradle wrapper"
            git push origin HEAD:main
          fi
