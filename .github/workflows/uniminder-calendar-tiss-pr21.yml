name: Uniminder TUWEL/TISS PR21 validation
# Verify latest changes including TISS login auto-fill and TISS-only event guard
on:
  push:
    paths:
      - '.github/workflows/uniminder-calendar-tiss-pr21.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout private Uniminder PR
        uses: actions/checkout@v4
        with:
          repository: Persie0/student
          ref: fix/calendar-tuwel-fallback-tiss-cert-session-20261021
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: uniminder
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Dependencies
        working-directory: uniminder
        run: flutter pub get
      - name: Analyze modified files
        working-directory: uniminder
        run: flutter analyze --no-pub lib/models/calendar_event.dart lib/screens/calendar/event_detail_screen.dart lib/services/tiss_certificate_page.dart lib/services/certificates_service.dart lib/screens/university/certificates_screen.dart lib/screens/university/tiss_login_screen.dart test/calendar_direct_links_test.dart test/tiss_certificate_page_test.dart
      - name: Regression tests
        working-directory: uniminder
        run: flutter test --no-pub test/calendar_direct_links_test.dart test/tiss_certificate_page_test.dart test/course_name_resolver_test.dart test/pdf_validation_test.dart
      - name: Compile Android debug APK
        working-directory: uniminder
        run: flutter build apk --debug --no-pub
