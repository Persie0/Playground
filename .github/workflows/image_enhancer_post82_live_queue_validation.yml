name: Image Enhancer post82 live queue UX validation

on:
  push:
    branches: [image-enhancer-post82-live-queue-validation-20261121]
    paths:
      - .github/workflows/image_enhancer_post82_live_queue_validation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-enhancer-post82-live-queue-validation-20261121
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout private image editor using public Playground
        uses: actions/checkout@v4
        with:
          repository: Persie0/image_enhancer
          ref: impeccable/post82-live-batch-and-model-discovery
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: image_enhancer
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve locked Flutter dependencies
        working-directory: image_enhancer
        run: flutter pub get --enforce-lockfile
      - name: Generate app localizations
        working-directory: image_enhancer
        run: flutter gen-l10n
      - name: Focused UX and regression tests
        working-directory: image_enhancer
        run: flutter test test/impeccable_live_batch_queue_test.dart test/batch_recovery_ux_test.dart test/impeccable_p2_layout_test.dart test/impeccable_result_flow_v2_test.dart --timeout 2m --reporter expanded
      - name: Strict Flutter analyzer
        working-directory: image_enhancer
        run: flutter analyze
      - name: Full Flutter regression suite
        working-directory: image_enhancer
        run: flutter test --concurrency=2 --timeout 2m --reporter compact
