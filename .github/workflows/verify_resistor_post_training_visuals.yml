name: Verify resistor post-training visual testers
on:
  push:
    paths:
      - '.github/workflows/verify_resistor_post_training_visuals.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/resistor_model
          ref: feature/post-training-colab-image-testing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python project, detector, visual tester, and tests
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e '.[dev,segmentation,detection,export]' onnxruntime opencv-python-headless matplotlib
      - name: Run regression suite
        run: pytest -q
      - name: Check notebook JSON and Python source
        run: |
          python -m compileall -q colab src tests
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('train_resistor_segmentation_colab.ipynb','train_resistor_detector_colab.ipynb'):
              nb=json.loads((Path('colab')/name).read_text())
              assert len(nb['cells'])==4
              print(name, 'has', len(nb['cells']), 'cells')
          PY
