name: Airline simulator live cabin seat and baggage RED batch
on:
  push:
    branches: [airlinesimulator-foundation-ci]
    paths: [.github/workflows/airlinesimulator-next-red.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [cabin-stock, group-seats, baggage]
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: Persie0/airlinesimulator
          ref: b781a7f5279ebfef4a63e46cf3c267b2dc69c72f
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Confirm expected missing integration APIs
        working-directory: private-source
        shell: bash
        env:
          TASK: ${{ matrix.task }}
        run: |
          case "$TASK" in
            cabin-stock)
              filter=FullyQualifiedName~LiveServiceTests.CabinStockShortageRefundsUndeliveredCoffee
              expected='CS1061.*(ConfigureCabinStock|RemainingCabinStock)'
              ;;
            group-seats)
              filter=FullyQualifiedName~LiveServiceTests.GroupSeatsAreAssignedAndNeverOverlap
              expected='CS1061.*GetAssignedSeats'
              ;;
            baggage)
              filter=FullyQualifiedName~LiveServiceTests.BaggageDisputeAndRepackAffectActualDelivery
              expected='CS1061.*(GetBags|SetBagSize|RepackBag)'
              ;;
          esac
          set +e
          dotnet test tests/Simulation.Tests/Simulation.Tests.csproj -c Release --filter "$filter" > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && grep -Eq "$expected" "$RUNNER_TEMP/red.log"; then
            echo "Expected RED verified for $TASK"
          else
            echo "Expected RED not established for $TASK"
            grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}|Failed: *[0-9]+|Passed: *[0-9]+' "$RUNNER_TEMP/red.log" | sort | uniq -c || true
            exit 1
          fi
