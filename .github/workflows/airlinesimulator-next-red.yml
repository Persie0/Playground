name: Airline simulator endless history RED batch
on:
  push:
    branches: [airlinesimulator-foundation-ci]
    paths: [.github/workflows/airlinesimulator-next-red.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [history-compaction, bounded-projection, ten-year-archive]
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: Persie0/airlinesimulator
          ref: e0db26ead6fcfaa3013ea86919d254993f858b35
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Confirm expected missing integration APIs
        working-directory: private-source
        shell: bash
        env:
          TASK: ${{ matrix.task }}
        run: |
          case "$TASK" in
            history-compaction)
              filter=FullyQualifiedName~EndlessTests.HistoryCompactionPreservesFinancialStateAndActiveLiabilities
              expected='CS(1061|0246|0103).*(History|HistoryArchive|HistoricalFlightOutcome)'
              ;;
            bounded-projection)
              filter=FullyQualifiedName~EndlessTests.CompletedFlightHandlersAreReleasedAndSnapshotsRemainBounded
              expected='CS(1061|0246|0103).*(History|HistoryArchive|HistoricalFlightOutcome|LiveSnapshot|RegisteredEventHandlerCount)'
              ;;
            ten-year-archive)
              filter=FullyQualifiedName~EndlessTests.TenYearSummaryAccumulatorIsDeterministic
              expected='CS(1061|0246|0103).*(History|HistoryArchive|HistoricalFlightOutcome)'
              ;;
          esac
          set +e
          dotnet test tests/Simulation.Tests/Simulation.Tests.csproj -c Release --filter "$filter" > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && grep -Eq "$expected" "$RUNNER_TEMP/red.log"; then
            echo "Expected RED verified for $TASK"
          else
            echo "Expected RED not established for $TASK"
            grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}|Failed: *[0-9]+|Passed: *[0-9]+' "$RUNNER_TEMP/red.log" | sort | uniq -c || true
            exit 1
          fi
