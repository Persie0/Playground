name: Airline simulator live extras and rival operations RED batch
on:
  push:
    branches: [airlinesimulator-foundation-ci]
    paths: [.github/workflows/airlinesimulator-next-red.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [automatic-extras, rival-rotation, rival-persistence]
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: Persie0/airlinesimulator
          ref: f338259e54346bede6426993ba9b19b38d429f3f
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Confirm expected missing integration APIs
        working-directory: private-source
        shell: bash
        env:
          TASK: ${{ matrix.task }}
        run: |
          case "$TASK" in
            automatic-extras)
              filter=FullyQualifiedName~LiveCompetitionTests.OptionalPurchasesUseRealQuotesAndStock
              expected='CS1061.*SetAutomaticExtras'
              ;;
            rival-rotation)
              filter=FullyQualifiedName~LiveCompetitionTests.RivalOperatesRealReservedRotation
              expected='CS1061.*(RivalFlights|IsRival)'
              ;;
            rival-persistence)
              filter=FullyQualifiedName~LiveCompetitionTests.RivalAndOptionalPurchasesPersistAndReplay
              expected='CS1061.*(AutomaticExtrasEnabled|RivalFlights)'
              ;;
          esac
          set +e
          dotnet test tests/Simulation.Tests/Simulation.Tests.csproj -c Release --filter "$filter" > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && grep -Eq "$expected" "$RUNNER_TEMP/red.log"; then
            echo "Expected RED verified for $TASK"
          else
            echo "Expected RED not established for $TASK"
            grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}|Failed: *[0-9]+|Passed: *[0-9]+' "$RUNNER_TEMP/red.log" | sort | uniq -c || true
            exit 1
          fi
