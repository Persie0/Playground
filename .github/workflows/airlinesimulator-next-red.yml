name: Airline simulator live disruption recovery RED batch
on:
  push:
    branches: [airlinesimulator-foundation-ci]
    paths: [.github/workflows/airlinesimulator-next-red.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [timeline-recovery, spare-and-gate, service-disruptions]
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: Persie0/airlinesimulator
          ref: cde328ba72ab9c91e4b19b8536fd85f63af43906
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Confirm expected missing integration APIs
        working-directory: private-source
        shell: bash
        env:
          TASK: ${{ matrix.task }}
        run: |
          case "$TASK" in
            timeline-recovery)
              filter=FullyQualifiedName~LiveRecoveryTests.WeatherMovesAuthoritativeTimelineAndReservations
              expected='CS1061.*ApplyDisruption'
              ;;
            spare-and-gate)
              filter=FullyQualifiedName~LiveRecoveryTests.SparePreviewIsReadOnlyAndSwapChargesOnce
              expected='CS1061.*(PreviewRecovery|ExecuteRecovery|ChangeGate)'
              ;;
            service-disruptions)
              filter=FullyQualifiedName~LiveRecoveryTests.StockAndLostBagDisruptionsChangeSettlement
              expected='CS1061.*ApplyDisruption'
              ;;
          esac
          set +e
          dotnet test tests/Simulation.Tests/Simulation.Tests.csproj -c Release --filter "$filter" > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && grep -Eq "$expected" "$RUNNER_TEMP/red.log"; then
            echo "Expected RED verified for $TASK"
          else
            echo "Expected RED not established for $TASK"
            grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}|Failed: *[0-9]+|Passed: *[0-9]+' "$RUNNER_TEMP/red.log" | sort | uniq -c || true
            exit 1
          fi
