name: Airline simulator fleet depth RED batch
on:
  push:
    branches: [airlinesimulator-foundation-ci]
    paths: [.github/workflows/airlinesimulator-next-red.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [staff-training, timed-maintenance, recurrence-distress]
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: Persie0/airlinesimulator
          ref: 473b9d249c6f35ccdded1f20c22e0f62f66087cb
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Confirm expected missing integration APIs
        working-directory: private-source
        shell: bash
        env:
          TASK: ${{ matrix.task }}
        run: |
          case "$TASK" in
            staff-training)
              filter=FullyQualifiedName~FleetDepthTests.PaidDutyAndTrainingCannotOverlapAndChargeOnce
              expected='CS1061.*(BeginTraining|IsTrainingComplete)'
              ;;
            timed-maintenance)
              filter=FullyQualifiedName~FleetDepthTests.TimedMaintenancePreventsEarlyReleaseAndDispatch
              expected='CS1061.*BeginInspection'
              ;;
            recurrence-distress)
              filter=FullyQualifiedName~FleetDepthTests.RestructureKeepsCustomerLiabilitiesAndOutstandingPrincipal
              expected='CS1061.*(FinancialDistress|RestructureCredit|RequestSandboxRescue|SetFleetRecurrence)'
              ;;
          esac
          set +e
          dotnet test tests/Simulation.Tests/Simulation.Tests.csproj -c Release --filter "$filter" > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && grep -Eq "$expected" "$RUNNER_TEMP/red.log"; then
            echo "Expected RED verified for $TASK"
          else
            echo "Expected RED not established for $TASK"
            grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}|Failed: *[0-9]+|Passed: *[0-9]+' "$RUNNER_TEMP/red.log" | sort | uniq -c || true
            exit 1
          fi
