name: Airline simulator CEO work task RED batch
on:
  push:
    branches: [airlinesimulator-foundation-ci]
    paths: [.github/workflows/airlinesimulator-next-red.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [staff-fallback, work-persistence, stock-and-divider]
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: Persie0/airlinesimulator
          ref: f878d8af2c1e9e95f34ec9ce1685fa587221f520
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Confirm expected missing integration APIs
        working-directory: private-source
        shell: bash
        env:
          TASK: ${{ matrix.task }}
        run: |
          case "$TASK" in
            staff-fallback)
              filter=FullyQualifiedName~WorkTaskTests.StaffFallbackAfterCeoReleasesBagTask
              expected='CS(1061|0103).*(Work|WorkKind|WorkStatus)'
              ;;
            work-persistence)
              filter=FullyQualifiedName~WorkTaskTests.AbandonedClaimExpiresAcrossSaveAndStaffCompletesOnce
              expected='CS1061.*Work'
              ;;
            stock-and-divider)
              filter=FullyQualifiedName~WorkTaskTests.RestockUsesRealInventoryAndSupplierExpenseOnce
              expected='CS(1061|0103).*(Work|WorkKind)'
              ;;
          esac
          set +e
          dotnet test tests/Simulation.Tests/Simulation.Tests.csproj -c Release --filter "$filter" > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && grep -Eq "$expected" "$RUNNER_TEMP/red.log"; then
            echo "Expected RED verified for $TASK"
          else
            echo "Expected RED not established for $TASK"
            grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}|Failed: *[0-9]+|Passed: *[0-9]+' "$RUNNER_TEMP/red.log" | sort | uniq -c || true
            exit 1
          fi
