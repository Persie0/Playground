name: Airline simulator brand and strategy RED batch
on:
  push:
    branches: [airlinesimulator-foundation-ci]
    paths: [.github/workflows/airlinesimulator-next-red.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [brand-promises, strategy-persistence, annual-strategy]
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: Persie0/airlinesimulator
          ref: c820dab90907009852c66fb66e5bdf702d38ebee
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Confirm expected missing integration APIs
        working-directory: private-source
        shell: bash
        env:
          TASK: ${{ matrix.task }}
        run: |
          case "$TASK" in
            brand-promises)
              filter=FullyQualifiedName~StrategyTests.BrandPromisesAreImmutableForConfirmedTravelAndCommandsAreIdempotent
              expected='CS1061.*Strategy'
              ;;
            strategy-persistence)
              filter=FullyQualifiedName~StrategyTests.StrategyPromisesAndReviewHistorySurviveReload
              expected='CS1061.*Strategy'
              ;;
            annual-strategy)
              filter=FullyQualifiedName~StrategyTests.OneYearStrategySweepPreservesFinancialAndOperationalInvariants
              expected='CS1061.*Strategy'
              ;;
          esac
          set +e
          dotnet test tests/Simulation.Tests/Simulation.Tests.csproj -c Release --filter "$filter" > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && grep -Eq "$expected" "$RUNNER_TEMP/red.log"; then
            echo "Expected RED verified for $TASK"
          else
            echo "Expected RED not established for $TASK"
            grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}|Failed: *[0-9]+|Passed: *[0-9]+' "$RUNNER_TEMP/red.log" | sort | uniq -c || true
            exit 1
          fi
