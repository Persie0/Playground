name: Airline simulator commercial persistence RED batch
on:
  push:
    branches: [airlinesimulator-foundation-ci]
    paths: [.github/workflows/airlinesimulator-next-red.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  red:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: [career-save, thirty-one-day-career]
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/checkout@v4
        with:
          repository: Persie0/airlinesimulator
          ref: 032f85d41dca842e047371c3c83a91195697912e
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Confirm expected commercial save rejection
        working-directory: private-source
        shell: bash
        env:
          TASK: ${{ matrix.task }}
        run: |
          if [ "$TASK" = career-save ]; then
            filter=FullyQualifiedName~CareerSaveTests.MidBoardingResume
          else
            filter=FullyQualifiedName~VerticalSliceTests.ThirtyDayCareerAndBeyond
          fi
          set +e
          dotnet test tests/Simulation.Tests/Simulation.Tests.csproj -c Release --filter "$filter" > "$RUNNER_TEMP/red.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ] && grep -Eq 'NotSupportedException.*Commercial career persistence requires schema 2' "$RUNNER_TEMP/red.log"; then
            echo "Expected RED verified for $TASK"
          else
            echo "Expected RED not established for $TASK"
            grep -Eo '(CS|MSB|NU|NETSDK)[0-9]{4}|Failed: *[0-9]+|Passed: *[0-9]+' "$RUNNER_TEMP/red.log" | sort | uniq -c || true
            exit 1
          fi
