name: TopTravelList Monaco guarded merge
on:
  push:
    branches: [main]
    paths: ['.github/workflows/toptravellist-monaco-merge-20261125.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: data/monaco-worldwide-v2-30
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Integrate, validate and merge PR 103
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          git config user.name toptravellist-editorial-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          branch=data/monaco-worldwide-v2-30
          repo=Persie0/TopTravelList
          for attempt in 1 2 3; do
            git fetch origin main "$branch"
            base=$(git rev-parse origin/main)
            head=$(git rev-parse "origin/$branch")
            echo "Attempt $attempt base=$base head=$head"
            if [ "$(gh api "repos/$repo/pulls/103" --jq .merged)" = true ]; then exit 0; fi
            if [ -n "$(git ls-tree -r --name-only "$base" countries/MC | grep '\.yaml$' || true)" ]; then
              echo "Monaco already populated on main; refusing replacement"; exit 1
            fi
            git reset --hard "$base"
            git checkout "$head" -- countries/MC methodology/reviews/MC
            git add countries/MC methodology/reviews/MC
            # Generate before comparison with base; keep existing unrelated files.
            python scripts/generate_rankings.py --country MC
            git add README.md countries/MC/cities.md countries/MC/sights.md
            git diff --cached --check
            new=$(git commit-tree "$(git write-tree)" -p "$head" -p "$base" -m "Integrate Monaco against current main and regenerate rankings")
            git reset --hard "$new"
            python scripts/validate.py
            python scripts/check_city_benchmarks.py
            python scripts/check_sight_benchmarks.py
            python scripts/check_new_country_reviews.py --country MC
            python scripts/generate_rankings.py --country MC
            python scripts/generate_rankings.py --check
            python scripts/rank.py --kind cities --limit 60
            python scripts/rank.py --kind sights --limit 60
            python scripts/rank.py --kind sights --country MC --limit 15
            BASE="$base" python - <<'MC'
          import os, re, subprocess
          from pathlib import Path
          from decimal import Decimal
          import yaml
          docs=Path('methodology/reviews/MC')
          txt='\n'.join((docs/f'{k}.md').read_text() for k in ['cities','sights'])
          assert len(set(re.findall(r'^## ((?:city|sight)-mc-[a-z0-9-]+) — ',txt,re.M)))==30
          assert txt.count('**source-linked-unverified**')==23
          assert txt.count('**editorial-only**')==5
          assert txt.count('**unassessed**')==2
          unranked=0
          high=0
          for k,n in [('cities',1),('sights',29)]:
              root=Path('countries/MC')
              files=list((root/k).glob('*.yaml'))
              assert len(files)==n
              md=(root/f'{k}.md').read_text()
              assert md.count('https://www.google.com/maps/search/?api=1&query=')==2*n
              assert md.count('[Google Maps](')==n
              for f in files:
                  a=yaml.safe_load(f.read_text())
                  sec=txt.split('## '+a['id']+' — ',1)[1].split('\n## ',1)[0]
                  peers=re.findall(r'\]\(\.\./\.\./\.\./countries/([A-Z]{2}/(?:cities|sights)/[^)]+\.yaml)\)',sec)
                  assert len(set(p for p in peers if not p.startswith('MC/')))==4
                  assert all((Path('countries')/p).is_file() for p in peers)
                  assert f']({k}/{f.name})' in md
                  vals=[a['scores'][x] for x in ['impact','uniqueness','significance','experience','depth']]
                  assert all(x is None or x<10 for x in vals+list(a['scores']['categories'].values()))
                  if any(x is not None and x>=9.5 for x in vals+list(a['scores']['categories'].values())) or (None not in vals and sum(Decimal(str(v))*w for v,w in zip(vals,[30,25,20,15,10]))/10>=90):
                      high+=1
                      assert 'High-score challenge: Not applicable' not in sec
                  if None in vals:
                      unranked+=1
                  else:
                      total=sum(Decimal(str(v))*w for v,w in zip(vals,[30,25,20,15,10]))/10
                      assert f'Computed overall: {total:.2f}/100.' in sec
          assert unranked==2 and high==0
          print('Exceptional cases:',high)
          assert all(p=='README.md' or p.startswith(('countries/MC/','methodology/reviews/MC/')) for p in subprocess.check_output(['git','diff','--name-only',os.environ['BASE'],'HEAD'],text=True).splitlines())
          print('PASS: individual reviews, peer links, scores, GPS links, preservation.')
          print('WORLDWIDE:',len({f.parent.parent.name for f in Path('countries').glob('*/*/*.yaml')}),len(list(Path('countries').glob('*/cities/*.yaml'))),len(list(Path('countries').glob('*/sights/*.yaml'))))
          MC
            git diff --exit-code
            git push origin HEAD:refs/heads/"$branch"
            # Avoid merging a stale generated directory.
            for poll in 1 2 3 4 5; do
              git fetch origin main
              if [ "$(git rev-parse origin/main)" != "$base" ]; then break; fi
              pr=$(gh api "repos/$repo/pulls/103")
              if [ "$(jq -r .merged <<<"$pr")" = true ]; then exit 0; fi
              if [ "$(jq -r .head.sha <<<"$pr")" = "$new" ] && [ "$(jq -r .mergeable <<<"$pr")" = true ]; then
                if gh api --method PUT "repos/$repo/pulls/103/merge" -f sha="$new" -f merge_method=squash; then
                  test "$(gh api "repos/$repo/pulls/103" --jq .merged)" = true
                  exit 0
                fi
              fi
              sleep 2
            done
          done
          echo "Could not merge after three validated attempts"; exit 1
