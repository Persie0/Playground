name: Photosphere checkpoint271 full production RANSAC integration on original native 25 rays (one-shot)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint271-rust-integration.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-parity-singletons
  cancel-in-progress: false
jobs:
  production-original-refit-covariance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout pinned private app via public Playground
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 21fb18e4c1f4c60bd9852a337714657c256407c9
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify source
        run: test "$(git rev-parse HEAD)" = "21fb18e4c1f4c60bd9852a337714657c256407c9"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - name: Compare production full RANSAC 25 inliers and rotation to original native
        run: |
          set -euo pipefail
          if ! cargo test --locked --lib checkpoint271_full_production_ransac_on_real_native_addimage_rays -- --nocapture > checkpoint271-focused.log 2>&1; then
            tail -n 120 checkpoint271-focused.log
            exit 1
          fi
          grep -q 'test result: ok. 1 passed; 0 failed' checkpoint271-focused.log
          tail -n 20 checkpoint271-focused.log
      - name: Run complete Rust library regression suite
        run: |
          set -euo pipefail
          if ! cargo test --locked --lib > checkpoint271-all.log 2>&1; then
            tail -n 120 checkpoint271-all.log
            exit 1
          fi
          grep -E 'test result:' checkpoint271-all.log | tail -2
      - name: Archive validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint271-rust-integrated-ransac
          path: |
            checkpoint271-focused.log
            checkpoint271-all.log
          if-no-files-found: warn
          retention-days: 14
