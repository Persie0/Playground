name: Root Detector Material You results verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/root-detector-material-results.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/root_detection_app
          ref: material-you-readable-results
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: app-source
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDK 37.0
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0"
      - name: Kotlin unit tests, release lint, and debug APK
        working-directory: app-source
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleDebug --stacktrace

  emulator-readability:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/root_detection_app
          ref: material-you-readable-results
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: root-detector
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDK 37.0
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0"
      - name: Assemble debug
        working-directory: root-detector
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          set -eu
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          ls -l /dev/kvm
      - name: Android emulator font-scale and theme smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            bash root-detector/scripts/emulator-smoke.sh
            adb shell settings put system font_scale 1.5
            adb shell am force-stop at.persie0.root_detection_app
            adb shell am start -W -n at.persie0.root_detection_app/.MainActivity
            sleep 10
            adb shell pidof at.persie0.root_detection_app
            adb exec-out screencap -p > results-large-text.png
            adb shell cmd uimode night yes
            adb shell am force-stop at.persie0.root_detection_app
            adb shell am start -W -n at.persie0.root_detection_app/.MainActivity
            sleep 10
            adb shell pidof at.persie0.root_detection_app
            adb exec-out screencap -p > results-large-text-dark.png
      - name: Save accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: material-results-light-dark-large-text
          path: |
            root-detector-eula.png
            root-detector-scan.png
            results-large-text.png
            results-large-text-dark.png
            root-detector-logcat.txt
          retention-days: 3
          if-no-files-found: ignore
