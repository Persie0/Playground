name: ToiletCompass PR 21 review
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/toiletcompass-pr21-review.yml'
permissions:
  contents: read
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ci/toiletcompass-pr21-review'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
      APP_REPO: Persie0/toiletcompass
      APP_BRANCH: fix/compact-preferences-onboarding
      EXPECTED_HEAD: 596203fbab4dd56d24739eb856b3c8a2c2d16a4a
    steps:
      - name: Checkout exact app review revision
        uses: actions/checkout@v5
        with:
          repository: Persie0/toiletcompass
          ref: fix/compact-preferences-onboarding
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: app
      - name: Verify revision and PR state
        working-directory: app
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(gh pr view 21 --repo "$APP_REPO" --json headRefOid,state --jq '.headRefOid + " " + .state')" = "$EXPECTED_HEAD OPEN"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies and generate localization
        working-directory: app
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Analyze and test
        working-directory: app
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test
      - name: Commit validated dependency and generated file changes, then merge
        working-directory: app
        run: |
          set -euo pipefail
          test "$(gh pr view 21 --repo "$APP_REPO" --json headRefOid,state --jq '.headRefOid + " " + .state')" = "$EXPECTED_HEAD OPEN"
          git add pubspec.lock
          git add -u -- lib/l10n/gen_l10n ios macos android linux windows
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Synchronize verified Flutter dependencies and generated files"
            git push origin "HEAD:refs/heads/$APP_BRANCH"
          fi
          gh pr merge 21 --repo "$APP_REPO" --merge --match-head-commit "$(git rev-parse HEAD)"
