name: Export specialized builder actions payload

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export_builder_actions_payload.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Clone public builder source
        run: git clone --depth 1 https://github.com/Persie0/firebase_tester_builder.git builder

      - name: Build migration payload
        shell: bash
        run: |
          set -euo pipefail
          root=payload
          mkdir -p "$root/.github/workflows" "$root/debug_triggers"
          moved_workflows=(
            appodeal_43_migrate_all.yml appodeal_43_migrate_all_v2.yml
            debug_game_build.yml debug_stem_build.yml
            dispatch_hanzi_hero_release.yml dispatch_image_compressor_release.yml
            dispatch_noise_remover_release.yml dispatch_screendetector_release.yml
            image_compressor_play_retry.yml patch_optional_telegram.yml
            patch_play_auto_android_sdk.yml probe_image_compressor_release.yml
            probe_screendetector_release.yml report_screendetector_dispatch.yml
            report_screendetector_release.yml watch_image_compressor_release.yml
          )
          for workflow in "${moved_workflows[@]}"; do
            test -s "builder/.github/workflows/$workflow"
            cp "builder/.github/workflows/$workflow" "$root/.github/workflows/$workflow"
          done
          cp builder/debug_triggers/game.txt "$root/debug_triggers/game.txt"
          cp builder/debug_triggers/stem.txt "$root/debug_triggers/stem.txt"
          [ ! -d builder/release_triggers ] || cp -a builder/release_triggers "$root/release_triggers"
          [ ! -d builder/release_status ] || cp -a builder/release_status "$root/release_status"
          [ ! -d builder/.github/release-status ] || cp -a builder/.github/release-status "$root/.github/release-status"

          python3 - <<'PY'
          from pathlib import Path
          d = Path('payload/.github/workflows')
          current = '$' + '{{ github.token }}'
          cross = '$' + '{{ secrets.GH_TOKEN }}'
          for p in d.glob('*.yml'):
              text = p.read_text(encoding='utf-8').replace(current, cross)
              text = text.replace('Check out builder repository', 'Check out Playground repository')
              p.write_text(text, encoding='utf-8')
          PY

          cat > "$root/.github/workflows/report_screendetector_release.yml" <<'EOF'
          name: Record screendetector release result

          on:
            workflow_dispatch:
            schedule:
              - cron: '23 */6 * * *'

          permissions:
            contents: write

          jobs:
            record-result:
              runs-on: ubuntu-latest
              steps:
                - name: Check out Playground repository
                  uses: actions/checkout@v4
                  with:
                    ref: main

                - name: Record latest screendetector Play release
                  env:
                    GH_TOKEN: __CROSS_REPO_TOKEN__
                  shell: bash
                  run: |
                    set -euo pipefail
                    RUN_JSON="$(gh run list \
                      --repo Persie0/firebase_tester_builder \
                      --workflow play_auto.yml \
                      --event workflow_dispatch \
                      --limit 50 \
                      --json databaseId,displayTitle,status,conclusion,createdAt,updatedAt,url,headSha,headBranch \
                      --jq '[.[] | select(.displayTitle | contains("Deploy screendetector"))][0]')"
                    if [ -z "$RUN_JSON" ] || [ "$RUN_JSON" = "null" ]; then
                      echo 'No screendetector Play release found.'
                      exit 0
                    fi
                    mkdir -p .github/release-status
                    printf '%s\n' "$RUN_JSON" | jq -r '
                      "# screendetector release result\n\n" +
                      "- Title: " + (.displayTitle // "") + "\n" +
                      "- Run ID: " + ((.databaseId // 0) | tostring) + "\n" +
                      "- Conclusion: " + (.conclusion // "") + "\n" +
                      "- Status: " + (.status // "") + "\n" +
                      "- Source branch: " + (.headBranch // "") + "\n" +
                      "- Source SHA: " + (.headSha // "") + "\n" +
                      "- Created: " + (.createdAt // "") + "\n" +
                      "- Updated: " + (.updatedAt // "") + "\n" +
                      "- Run: " + (.url // "")
                    ' > .github/release-status/screendetector-latest.md

                - name: Commit result when changed
                  shell: bash
                  run: |
                    set -euo pipefail
                    git config user.name 'github-actions[bot]'
                    git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                    git add .github/release-status/screendetector-latest.md
                    if git diff --cached --quiet; then exit 0; fi
                    git commit -m 'ci: record screendetector release result [skip ci]'
                    git push origin HEAD:main
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path('payload/.github/workflows/report_screendetector_release.yml')
          text = p.read_text(encoding='utf-8').replace('__CROSS_REPO_TOKEN__', '$' + '{{ secrets.GH_TOKEN }}')
          lines = text.splitlines()
          nonempty = [line for line in lines if line.strip()]
          indent = min(len(line)-len(line.lstrip()) for line in nonempty) if nonempty else 0
          p.write_text('\n'.join(line[indent:] if len(line) >= indent else line for line in lines) + '\n', encoding='utf-8')
          PY

          test "$(find "$root/.github/workflows" -maxdepth 1 -type f | wc -l)" -eq 16
          test -s "$root/debug_triggers/game.txt"
          test -s "$root/debug_triggers/stem.txt"
          if grep -Fq 'workflow_run:' "$root/.github/workflows/report_screendetector_release.yml"; then exit 1; fi

      - name: Upload exact migration payload
        uses: actions/upload-artifact@v4
        with:
          name: builder-actions-playground-payload
          path: payload
          include-hidden-files: true
          if-no-files-found: error
