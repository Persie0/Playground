name: Photosphere 462 original Ceres second parameter RB-tree registration and native return
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-462-native-second-tree-return.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-462-native-second-tree-return
  cancel-in-progress: false
jobs:
  original-second-tree-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout private source SHA read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 6ddb9bf21a2b034cdd064ec4fa5f2255a754f654
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify research SHA and Python syntax
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6ddb9bf21a2b034cdd064ec4fa5f2255a754f654
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py research/photosphere/checkpoint442/live_six_pair_native_camera_getters.py research/photosphere/checkpoint454/live_original_problem_constructor.py research/photosphere/checkpoint455/live_first_native_registration_entry.py research/photosphere/checkpoint456/live_first_scratch_copy.py research/photosphere/checkpoint457/live_first_native_four_pointer_sort.py research/photosphere/checkpoint457/scan_native_four_pointer_sort.py research/photosphere/checkpoint458/scan_original_ceres_postsort.py research/photosphere/checkpoint458/live_original_postsort_to_lookup.py research/photosphere/checkpoint459/live_first_parameter_owner.py research/photosphere/checkpoint459/scan_original_first_parameter_owner.py research/photosphere/checkpoint460/live_first_parameter_tree_insert.py research/photosphere/checkpoint460/scan_original_parameter_tree_insertion.py research/photosphere/checkpoint461/live_second_parameter_nonempty_tree.py research/photosphere/checkpoint462/live_second_parameter_tree_insert.py
      - name: Verify source-original GCam 8.8.225 APK and ARM64 ELF
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Source-run original second Ceres RB-tree child, rebalance and owner vector growth
        working-directory: research-src
        env:
          PHOTOSPHERE_THIRD_SHIFT407: '2'
          PHOTOSPHERE_FOURTH_CERES462: '1'
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py > checkpoint462-native.log 2> checkpoint462-diagnostic.log || {
            echo CHECKPOINT462_NATIVE_FAILURE
            tail -n 90 checkpoint462-diagnostic.log
            tail -n 8 checkpoint462-native.log | cut -c1-240
            exit 1
          }
          python3 - <<'PY'
          import json
          line=next(x for x in open("checkpoint462-native.log")
                    if x.startswith("CHECKPOINT395_NATIVE_POINT_SETUP_THIRD_ROBUST_ENTRY_REPORT="))
          d=json.loads(line.split("=",1)[1])
          z=d["checkpoint462_fourth_original_second_parameter_tree_insert"]
          q=d["checkpoint461_fourth_original_second_parameter"]
          t=d["checkpoint460_fourth_original_first_parameter_tree_insert"]
          a=d["checkpoint459_fourth_original_first_parameter_owner"]
          h=d["checkpoint458_fourth_original_postsort_to_parameter_lookup"]
          s=d["checkpoint457_fourth_original_four_pointer_sort"]
          c=d["checkpoint456_fourth_original_first_scratch_copy"]
          p=d["checkpoint455_fourth_native_first_registration_entry"]
          getters=d["checkpoint442_fourth_original_native_getters"]
          if not z:
              print("CHECKPOINT462_MISSING_RECEIPT_DEBUG="+json.dumps({
                "callback_error":getters.get("source_original_callback_execution_error"),
                "requested":getters.get("source_original_second_tree_insert_462_requested"),
                "completed":getters.get("source_original_second_tree_insert_462_completed"),
                "second_461_completed":getters.get("source_original_second_parameter_461_completed"),
                "first_tree_460_completed":getters.get("source_original_first_tree_insert_460_completed"),
                "first_459_completed":getters.get("source_original_first_parameter_459_completed"),
                "first_source_row":getters.get("source_original_callback_rows",[])[:1],
              },default=str,sort_keys=True))
              raise AssertionError("original source second parameter tree insertion receipt missing")
          assert z["checkpoint"]==462
          assert z["original_second_tree_source_native_48byte_allocation_executed"]
          assert z["original_second_tree_source_native_right_child_inserted"]
          assert z["original_second_tree_native_rebalance_helper_executed"]
          assert z["original_second_tree_root_black_child_red_verified"]
          assert z["original_second_tree_node_count"]==2
          assert z["original_second_tree_16byte_vector_growth_source_executed"]
          assert z["original_second_tree_8byte_imported_memmove_host_substituted"]
          assert z["original_second_tree_old_vector_imported_free_host_substituted"]
          assert z["original_second_tree_auxiliary_parameter_vector_two_owners_verified"]
          assert z["original_second_tree_source_original_lookup_native_return_executed"]
          assert z["original_second_tree_native_return_pc"]=="0x134858"
          assert z["original_second_tree_first_and_second_80byte_objects_unchanged"]
          assert z["original_second_tree_first_observation_cost_loss_unchanged"]
          assert z["original_second_tree_four_parameter_pointer_words_unchanged"]
          assert z["original_second_tree_32byte_result_array_first_only"]
          assert z["original_third_parameter_lookup_unexecuted"]
          assert z["original_ceres_residual_registration_unexecuted"]
          assert z["original_ceres_optimizer_unexecuted"]
          assert q["checkpoint"]==461
          assert q["original_second_parameter_source_overlap_helper_executed"]
          assert q["original_second_parameter_source_nonoverlap_verified"]
          assert q["original_second_parameter_source_object_initialized"]
          assert q["original_second_parameter_native_tree_insert_stop_pc"]=="0x133ddc"
          assert t["checkpoint"]==460 and t["source_original_first_parameter_tree_count"]==1
          assert t["source_original_first_parameter_lookup_native_return_executed"]
          assert a["checkpoint"]==459 and a["original_first_parameter_object_byte_size"]==80
          assert h["checkpoint"]==458 and h["original_source_3_adjacent_sorted_unique_pointer_checks"]==3
          assert s["source_original_four_pointer_sorted_ascending_verified"]
          assert c["source_original_parameter_pointer_copy_verified"]
          assert p["original_source_0x128e04_call_executed"]
          assert getters["source_original_second_tree_insert_462_completed"]
          assert getters["source_original_second_parameter_461_completed"]
          assert getters["source_original_first_tree_insert_460_completed"]
          assert getters["source_original_first_parameter_459_completed"]
          assert getters["source_original_postsort_458_completed"]
          assert getters["source_original_four_pointer_sort_457_completed"]
          assert getters["source_original_first_scratch_456_completed"]
          assert getters["source_original_first_registration_455_completed"]
          assert getters["source_original_problem_ctor_454_completed"]
          assert getters["source_original_point_row_451_completed"]
          assert getters["source_original_pair_buffer_unchanged"]
          assert getters["source_original_source_camera_unchanged"]
          assert getters["source_original_provider_owned_children_unchanged"]
          assert getters["source_original_nested_vector_payloads_unchanged_443"]
          v=getters["source_original_matcher_owned_nested_vectors_443"]
          assert [x["point28"]["count"] for x in v]==[25,15,16,11,0,19]
          assert sum(x["point28"]["count"] for x in v)==86
          print("CHECKPOINT462_SECOND_SOURCE_NATIVE_TREE_RETURN_VERIFIED")
          print("CHECKPOINT462_SOURCE_NATIVE_RECEIPT="+json.dumps(z,sort_keys=True))
          PY
      - name: Delete original APK and native ELF on success or failure
        if: always()
        working-directory: research-src
        run: |
          rm -f original.apk research/native/liblightcycle.so
      - name: Upload source-only diagnostic (no original binary)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-462-second-tree-source-only
          path: research-src/checkpoint462-diagnostic.log
          if-no-files-found: error
          retention-days: 7
