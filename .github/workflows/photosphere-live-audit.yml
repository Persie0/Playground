name: Photosphere live preview validation
on:
  push:
    branches: [codex/photosphere-live-audit-20261005]
    paths: [.github/workflows/photosphere-live-audit.yml]
  workflow_dispatch:
concurrency:
  group: photosphere-live-audit-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  APP_SHA: fcc0f24b2ca8b1a0d47eb03cfaaec3f2e1d73999
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/Photosphere
          ref: fcc0f24b2ca8b1a0d47eb03cfaaec3f2e1d73999
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze and exercise image processing and scan preview
        shell: bash
        env:
          CI_RESULTS_PATH: .ci-results/decode-metrics.json
        run: |
          set +e
          set -uo pipefail
          cd app
          mkdir -p .ci-results
          failed=0
          check() {
            local label="$1"
            shift
            "$@" >".ci-results/$label.log" 2>&1
            local rc=$?
            printf '%s=%s\n' "$label" "$rc" >>.ci-results/status.txt
            if [ "$rc" -ne 0 ]; then failed=1; fi
            echo "CHECK: $label exit=$rc"
          }
          check setup flutter pub get
          check format dart format --output=none --set-exit-if-changed lib test tool
          check analyze flutter analyze
          if [ "$failed" -eq 0 ]; then
            check tests flutter test --reporter expanded
          fi
          check python-tests python3 -m unittest tool/test_blind_review.py
          check syntax bash -n tool/bootstrap.sh tool/verify.sh
          git config user.name Codex
          git config user.email codex@openai.com
          evidence="codex/photosphere-ci-unit-${{ github.run_id }}"
          git checkout -B "$evidence" >.ci-results/evidence.log 2>&1
          git add -f .ci-results
          git commit -m 'Record private processing and preview validation' >>.ci-results/evidence.log 2>&1
          git push origin "HEAD:refs/heads/$evidence" >>.ci-results/evidence.log 2>&1
          evidence_rc=$?
          if [ "$evidence_rc" -ne 0 ]; then echo '::error::Private diagnostics could not be saved.'; exit 1; fi
          exit "$failed"
  android:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/Photosphere
          ref: fcc0f24b2ca8b1a0d47eb03cfaaec3f2e1d73999
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile native camera bridge and image pipeline
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cd app
          mkdir -p .ci-results
          failed=0
          check() {
            local label="$1"
            shift
            "$@" >".ci-results/$label.log" 2>&1
            local rc=$?
            printf '%s=%s\n' "$label" "$rc" >>.ci-results/status.txt
            if [ "$rc" -ne 0 ]; then failed=1; fi
            echo "CHECK: $label exit=$rc"
          }
          check generate flutter create --platforms=android,ios --org com.persie --no-pub .
          check configure dart tool/configure_platforms.dart
          check sdk dart tool/set_android_sdk37.dart
          check setup flutter pub get
          if [ "$failed" -eq 0 ]; then
            check build flutter build apk --debug
          fi
          git config user.name Codex
          git config user.email codex@openai.com
          evidence="codex/photosphere-ci-android-${{ github.run_id }}"
          git checkout -B "$evidence" >.ci-results/evidence.log 2>&1
          git add -f .ci-results
          git commit -m 'Record private android native build validation' >>.ci-results/evidence.log 2>&1
          git push origin "HEAD:refs/heads/$evidence" >>.ci-results/evidence.log 2>&1
          evidence_rc=$?
          if [ "$evidence_rc" -ne 0 ]; then echo '::error::Private diagnostics could not be saved.'; exit 1; fi
          exit "$failed"
  ios:
    needs: unit
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - uses: actions/checkout@v5
        with:
          repository: Persie0/Photosphere
          ref: fcc0f24b2ca8b1a0d47eb03cfaaec3f2e1d73999
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: app
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Compile native camera bridge and image pipeline
        shell: bash
        run: |
          set +e
          set -uo pipefail
          cd app
          mkdir -p .ci-results
          failed=0
          check() {
            local label="$1"
            shift
            "$@" >".ci-results/$label.log" 2>&1
            local rc=$?
            printf '%s=%s\n' "$label" "$rc" >>.ci-results/status.txt
            if [ "$rc" -ne 0 ]; then failed=1; fi
            echo "CHECK: $label exit=$rc"
          }
          check generate flutter create --platforms=android,ios --org com.persie --no-pub .
          check configure dart tool/configure_platforms.dart
          check sdk dart tool/set_android_sdk37.dart
          check setup flutter pub get
          if [ "$failed" -eq 0 ]; then
            check build flutter build ios --debug --no-codesign
          fi
          git config user.name Codex
          git config user.email codex@openai.com
          evidence="codex/photosphere-ci-ios-${{ github.run_id }}"
          git checkout -B "$evidence" >.ci-results/evidence.log 2>&1
          git add -f .ci-results
          git commit -m 'Record private ios native build validation' >>.ci-results/evidence.log 2>&1
          git push origin "HEAD:refs/heads/$evidence" >>.ci-results/evidence.log 2>&1
          evidence_rc=$?
          if [ "$evidence_rc" -ne 0 ]; then echo '::error::Private diagnostics could not be saved.'; exit 1; fi
          exit "$failed"
