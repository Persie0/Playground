name: TopTravelList worldwide bias pass 105
on:
  push:
    branches: [main]
    paths: ['.github/workflows/toptravellist-worldwide-bias-pass105-20261126.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: data/worldwide-bias-audit-pass105
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and regenerate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0de24f6a7ebb83a155e1ca3706a40839cbd02f51
          pip install -r requirements.txt
          python scripts/validate.py
          python scripts/check_city_benchmarks.py
          python scripts/check_sight_benchmarks.py
          python scripts/generate_rankings.py
          python scripts/generate_rankings.py --check
          python scripts/audit_worldwide.py
          python scripts/reconcile_worldwide_backlog.py --verify-baseline
          python scripts/reconcile_worldwide_backlog.py --check
          python - <<'PY'
          import csv, subprocess, yaml
          from pathlib import Path
          expected={"FI/sights/church-three-crosses":("86.30",dict(experience=8.1,depth=8.4)),"MX/sights/chicxulub-ring-of-cenotes":("92.95",dict(impact=9.2,uniqueness=9.5,significance=9.4,experience=9.2,depth=9.0)),"ES/sights/silver-route":("88.00",dict(experience=8.8,depth=9.1)),"ES/sights/windmills":("86.50",dict(experience=8.6,depth=8.5)),"RO/sights/cules":("83.85",dict(experience=8.3,depth=8.5))}
          def read(p):
              with Path(p).open() as f:
                  return list(csv.DictReader(f,delimiter='\t'))
          rows=read('methodology/worldwide-diagnostics/records.tsv')
          bysource={r['source']:r for r in rows}
          for path,(score,changes) in expected.items():
              p='countries/'+path+'.yaml'
              old=yaml.safe_load(subprocess.check_output(['git','show','3db774abc8206a4b2a6520dc93d6af6dcba24462:'+p],text=True))
              assert all(old['scores'][k] is None for k in changes)
              old['scores'].update(changes)
              assert old==yaml.safe_load(Path(p).read_text())
              assert bysource[p]['overall']==score,(p,bysource[p]['overall'])
          q=read('methodology/worldwide-backlog/remaining.tsv')
          h=read('methodology/worldwide-backlog/original-inventory.tsv')
          assert len(rows)==16269 and len(q)==984
          assert {r['source'] for r in q}=={r['source'] for r in rows if 'incomplete-core' in r['flags'].split(';')}
          assert len(h)==1590 and sum(r['current_status']=='complete' for r in h)==606
          print('Verified all five ratings and exact live queue.')
          PY
          git diff --check
      - name: Commit generated reports
        run: |
          set -euo pipefail
          git config user.name toptravellist-editorial-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md 'countries/*/cities.md' 'countries/*/sights.md' methodology/worldwide-diagnostics methodology/worldwide-backlog
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate rankings and live backlog after pass 105'
            git push origin HEAD:refs/heads/data/worldwide-bias-audit-pass105
          fi
