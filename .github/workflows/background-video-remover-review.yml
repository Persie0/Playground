name: BackgroundVideoRemover private branch review

on:
  push:
    branches:
      - ci/background-video-remover-review
    paths:
      - .github/workflows/background-video-remover-review.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  REVIEW_REPO: Persie0/BackgroundVideoRemover
  REVIEW_REF: feat/native-mobile-background-removal

jobs:
  android:
    name: Android compile and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private review branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REVIEW_REPO }}
          ref: ${{ env.REVIEW_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: review
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK (prefer API 37)
        run: |
          if sdkmanager --channel=3 "platforms;android-37" "build-tools;36.0.0"; then
            echo "Installed API 37."
          else
            echo "::warning::Android SDK 37 was not found on runner; compile against API 36 as a compatibility smoke test."
            sdkmanager "platforms;android-36" "build-tools;36.0.0"
            sed -i -e 's/compileSdk = 37/compileSdk = 36/' -e 's/targetSdk = 37/targetSdk = 36/' review/android/app/build.gradle.kts
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Test and build
        working-directory: review/android
        run: gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug

  ios:
    name: iOS simulator compile
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout private review branch
        uses: actions/checkout@v4
        with:
          repository: ${{ env.REVIEW_REPO }}
          ref: ${{ env.REVIEW_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: review
      - name: Build iOS simulator app
        run: |
          xcodebuild -project review/ios/BackgroundVideoRemover.xcodeproj \
            -scheme BackgroundVideoRemover \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
