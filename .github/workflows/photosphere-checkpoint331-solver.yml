name: Photosphere checkpoint331 original solver-return source oracle
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint331-solver.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-checkpoint331-solver
  cancel-in-progress: false
jobs:
  source-original:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact private research source read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 5753e8b091ac1d4384ffe4409217c5eee486ead7
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify research revision and dependencies
        run: |
          test "$(git rev-parse HEAD)" = "5753e8b091ac1d4384ffe4409217c5eee486ead7"
          python3 -m pip install --quiet --break-system-packages capstone unicorn pyelftools
      - name: Fetch checksum-verified original ELF
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Inspect exact original solver dispatcher and gate instructions
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee checkpoint331-original-instructions.log
          from capstone import Cs,CS_ARCH_ARM64,CS_MODE_ARM
          from pathlib import Path
          raw=Path('original.so').read_bytes()
          dis=Cs(CS_ARCH_ARM64,CS_MODE_ARM)
          for label,a,b in [('wrapper',0x122fcc,0x123060),('postsolve',0x1295f0,0x129770),('postsolve_return',0x129990,0x1299e8),('fov_gate',0xf10c0,0xf10ec)]:
              print('REGION',label,hex(a),hex(b))
              rows=list(dis.disasm(raw[a:b],a))
              assert len(rows)==(b-a)//4,(label,len(rows))
              for i in rows:print('INS',label,hex(i.address),i.mnemonic,i.op_str)
          print('CHECKPOINT331_INSPECTION_PASS')
          PY
          grep -q '^CHECKPOINT331_INSPECTION_PASS' checkpoint331-original-instructions.log
      - name: Execute original Ceres post-solve gate against controlled inputs
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint331/native_original_postsolve_gates.py original.so --output checkpoint331-original-report.json | tee checkpoint331-original-run.log
          grep -q '^CHECKPOINT331_ORIGINAL_POSTSOLVE_PASS' checkpoint331-original-run.log
      - name: Execute original adjuster wrapper dispatch with synthetic ABI
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint331/native_original_adjuster_dispatch.py original.so --output checkpoint331-original-dispatch.json | tee checkpoint331-dispatch.log
          grep -q '^CHECKPOINT331_ORIGINAL_DISPATCH_PASS' checkpoint331-dispatch.log
      - name: Upload instructions and oracle report (never binary)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint331-source
          path: |
            checkpoint331-original-instructions.log
            checkpoint331-original-run.log
            checkpoint331-original-report.json
            checkpoint331-dispatch.log
            checkpoint331-original-dispatch.json
          if-no-files-found: warn
          retention-days: 7
