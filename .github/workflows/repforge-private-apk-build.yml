name: RepForge build installable APK (private delivery)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repforge-private-apk-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repforge-private-apk-build
  cancel-in-progress: false

jobs:
  build-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - name: Check out pinned RepForge revision privately
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          EXPECTED_SHA: b5036ae18a5d4bed444bc09809c45ce0352405b9
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Missing private repository token'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --quiet --depth=1 --branch feat/step20-reliability-camera-gates \
            https://github.com/Persie0/gameexercise.git source
          ACTUAL_SHA="$(git -C source rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA" || {
            echo 'RepForge feature branch advanced; refusing to publish unreviewed code.'
            exit 1
          }
          printf 'SOURCE_SHA=%s\n' "$ACTUAL_SHA" >> "$GITHUB_ENV"

      - name: Analyze and build installable release-mode APK
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter build apk --release
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -s "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.persie.repforge'"
          "$AAPT" dump permissions "$APK" > "$RUNNER_TEMP/repforge-permissions.txt"
          if grep -E 'android.permission.(RECORD_AUDIO|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|ACCESS_(FINE|COARSE|BACKGROUND)_LOCATION|SCHEDULE_EXACT_ALARM|USE_EXACT_ALARM)' "$RUNNER_TEMP/repforge-permissions.txt"; then
            echo 'Unexpected APK permission'; exit 1
          fi
          sha256sum "$APK" | sed 's|  .*|  RepForge-Test.apk|'
          echo 'Source and APK are not uploaded as public Playground artifacts.'

      - name: Publish APK into private RepForge prerelease
        shell: bash
        working-directory: source
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          GH_PROMPT_DISABLED: '1'
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          SHORT_SHA="${SOURCE_SHA:0:12}"
          TAG="repforge-test-apk-$SHORT_SHA"
          NAME="RepForge-Test-$SHORT_SHA.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/$NAME"
          if gh release view "$TAG" --repo Persie0/gameexercise >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/$NAME" \
              --repo Persie0/gameexercise --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/$NAME" \
              --repo Persie0/gameexercise \
              --target "$SOURCE_SHA" \
              --title "RepForge Android test APK ($SHORT_SHA)" \
              --notes "Release-mode Android test APK from pinned commit $SOURCE_SHA. Signed with a CI-generated debug key, NOT a production Play Store signing key. Camera automatic rewards remain disabled pending physical validation. For private installation/testing only." \
              --prerelease
          fi
          gh release view "$TAG" --repo Persie0/gameexercise --json url,assets \
            --jq '{url,assets:[.assets[]|{name:.name,size:.size}]}'
          echo "Private RepForge APK prerelease ready for commit $SOURCE_SHA"
