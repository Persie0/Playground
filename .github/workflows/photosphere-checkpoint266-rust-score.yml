name: Photosphere checkpoint266 original 25-ray Rust score parity (one-shot)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-checkpoint266-rust-score.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-parity-singletons
  cancel-in-progress: false
jobs:
  rust-original-first-support:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact app candidate from public Playground
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: ff500f8205692b75b40a47a31374ece00f9b4082
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify exact app commit
        run: test "$(git rev-parse HEAD)" = "ff500f8205692b75b40a47a31374ece00f9b4082"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.1"
      - name: Test production 25-ray native mask parity
        run: |
          set -euo pipefail
          cargo test --locked --lib checkpoint266_native_first_ransac_support_mask_matches_production -- --nocapture > checkpoint266-rust-focused.log 2>&1 || {
            tail -n 120 checkpoint266-rust-focused.log
            exit 1
          }
          tail -n 22 checkpoint266-rust-focused.log
      - name: Run locked entire Rust library test suite
        run: |
          set -euo pipefail
          cargo test --locked --lib > checkpoint266-rust-all.log 2>&1 || {
            tail -n 120 checkpoint266-rust-all.log
            exit 1
          }
          grep -E 'test result:' checkpoint266-rust-all.log | tail -2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint266-rust-mask-parity
          path: |
            checkpoint266-rust-focused.log
            checkpoint266-rust-all.log
          if-no-files-found: warn
          retention-days: 14
