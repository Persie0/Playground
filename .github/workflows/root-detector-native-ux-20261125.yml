name: Root Detector native UX validation 2026-11-25
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/root-detector-native-ux-20261125.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/root_detection_app
          ref: 9eb73b31b9795c2ebbedb3669842230943db1ee4
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: root-detector
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
          cache-disabled: true
      - name: Verify native locale catalogs
        working-directory: root-detector
        run: python3 scripts/check-localization.py
      - name: Install Android SDK
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-37' || "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-37.0'
      - name: Compile and run unit tests
        working-directory: root-detector
        shell: bash
        run: |
          set -euo pipefail
          if ! gradle --no-daemon --console=plain :app:testDebugUnitTest :app:assembleDebug > "$RUNNER_TEMP/root-detector-build.log" 2>&1; then
            grep -E '^(e: |error: |Execution failed for task|> A failure occurred|.* tests completed, .* failed)' "$RUNNER_TEMP/root-detector-build.log" | head -40 || true
            exit 1
          fi
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for p in Path("app/build/test-results/testDebugUnitTest").glob("TEST-*.xml"):
              e = ET.parse(p).getroot()
              for k in totals: totals[k] += int(e.get(k, "0"))
          print("Unit test totals:", totals)
          assert totals["tests"] > 0 and not totals["failures"] and not totals["errors"]
          PY
      - name: Lint with sanitized diagnostics
        id: lint
        continue-on-error: true
        working-directory: root-detector
        shell: bash
        run: |
          set -euo pipefail
          status=0
          gradle --no-daemon --console=plain :app:lintDebug > "$RUNNER_TEMP/root-detector-lint.log" 2>&1 || status=$?
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          from collections import Counter
          reports=list(Path("app/build/reports").glob("lint-results-debug.xml"))
          if not reports:
              print("No lint XML report found")
          for p in reports:
              issues=ET.parse(p).getroot().findall("issue")
              print("Lint counts:", dict(Counter((i.get("severity"),i.get("id")) for i in issues)))
              for i in issues:
                  if i.get("severity") not in ("Error","Fatal"): continue
                  for loc in i.findall("location")[:1]:
                      print(i.get("id"), Path(loc.get("file","")).name, loc.get("line",""))
          PY
          exit "$status"
      - name: Enable KVM
        run: |
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Native launch and configuration smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            adb install root-detector/app/build/outputs/apk/debug/app-debug.apk >/dev/null
            adb shell svc wifi disable
            adb shell svc data disable
            adb shell am start -W -n at.persie0.root_detection_app/.MainActivity >/dev/null
            sleep 5
            adb shell pidof at.persie0.root_detection_app >/dev/null
            adb shell uiautomator dump /sdcard/root-detector-window.xml >/dev/null
            adb shell cat /sdcard/root-detector-window.xml > "$RUNNER_TEMP/root-detector-window.xml"
            python3 -c "from pathlib import Path; import os; s=Path(os.environ['RUNNER_TEMP'],'root-detector-window.xml').read_text(); assert 'at.persie0.root_detection_app' in s; assert 'Accept and Continue' not in s"
            adb shell settings put system font_scale 2.0
            adb shell cmd uimode night yes
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 1
            sleep 5
            adb shell pidof at.persie0.root_detection_app >/dev/null
            adb shell settings put system user_rotation 0
            adb shell settings put system font_scale 1.0
            adb shell cmd uimode night no
            echo "Cold launch and configuration-change smoke succeeded."
      - name: Enforce lint result
        if: always()
        run: test "${{ steps.lint.outcome }}" = success
