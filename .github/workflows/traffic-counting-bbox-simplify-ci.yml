name: Traffic counting bbox-only footprints validation

on:
  push:
    branches: [ci/traffic-counting-bbox-only-20261105]
    paths:
      - .github/workflows/traffic-counting-bbox-simplify-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detector:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Verify private checkout access
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout private PR branch (without persisting token)
        uses: actions/checkout@v4
        with:
          repository: Persie0/traffic-counting-light-main
          ref: simplify/bbox-only-vehicle-footprints
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install detector dev dependencies
        working-directory: app/traffic-counting-edge-detection-master
        run: python -m pip install -e ".[dev]"
      - name: Compile detector sources and tests
        working-directory: app/traffic-counting-edge-detection-master
        run: python -m compileall -q src tests
      - name: Lint for runtime-breaking errors
        working-directory: app/traffic-counting-edge-detection-master
        run: ruff check --select E9,F63,F7,F82 src/analysis/analysis_pipeline.py src/analysis/traffic/footprints.py src/analysis/traffic/models.py src/analysis/traffic/occupied_area.py src/analysis/traffic/traffic_stage.py src/analysis/traffic/trajectory.py tests/test_analysis_vehicle_footprint_polygons.py tests/test_analysis_vehicle_trajectory.py
      - name: Focused traffic-analysis regressions
        working-directory: app/traffic-counting-edge-detection-master
        run: |
          PYTHONPATH=src pytest -q \
            tests/test_analysis_bbox_footprint.py \
            tests/test_analysis_vehicle_footprint_polygons.py \
            tests/test_analysis_vehicle_trajectory.py \
            tests/test_analysis_occupied_area_categories.py \
            tests/test_analysis_native_input.py \
            tests/test_analysis_route_heatmap.py \
            tests/test_image_motion.py
      - name: Broad analysis and direction regression suite
        working-directory: app/traffic-counting-edge-detection-master
        run: PYTHONPATH=src pytest -q tests/test_analysis_*.py tests/test_direction_detection.py
