name: Photo Sphere checkpoint 224 original full refit oracle
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-ransac-refit-oracle-224.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-refit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: research/checkpoint224-native-refit-oracle
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Install bounded ARM64 emulator
        run: python3 -m pip install --break-system-packages --quiet unicorn==2.1.4
      - name: Fetch original verified native library
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  liblightcycle.so' | sha256sum -c -
      - name: Execute complete original refit on five controlled ray sets
        run: |
          set -euo pipefail
          python3 tools/native_ransac_full_refit_probe.py liblightcycle.so > refit-oracle.json
          python3 -c 'import json; x=json.load(open("refit-oracle.json")); assert len(x["cases"])==5; print(json.dumps(x,indent=2))'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint224-refit-oracle
          path: refit-oracle.json
          retention-days: 4
          if-no-files-found: warn
