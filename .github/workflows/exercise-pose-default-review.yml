name: Three exercise apps default learned pose validation
on:
  push:
    paths:
      - '.github/workflows/exercise-pose-default-review.yml'
      - 'exercise-pose-default-trigger.txt'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  alarm_android:
    name: alarmchallenges Android tests and APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Read private feature branch
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth 1 --branch feature/learned-pose-default \
            https://github.com/Persie0/alarmchallenges.git source
          git -C source rev-parse HEAD
      - name: Resolve dependencies and generate source
        working-directory: source
        run: |
          flutter pub get
      - name: Validate model holdout and app behavior
        working-directory: source
        run: |
          flutter analyze --no-fatal-infos
          flutter test test/google_fitness_pose_knn_test.dart --reporter expanded
          flutter test
          python3 test/native_alarm_configuration_test.py
      - name: Compile debug APK
        working-directory: source
        run: |
          set -euo pipefail
          built=false
          for attempt in 1 2 3 4; do
            if flutter build apk --debug > /tmp/pose-android-build.log 2>&1; then
              built=true
              tail -n 12 /tmp/pose-android-build.log
              break
            fi
            if ! grep -Eq 'status code 429|Too Many Requests|HTTP 429' /tmp/pose-android-build.log; then
              tail -n 100 /tmp/pose-android-build.log
              exit 1
            fi
            if [ "$attempt" -eq 4 ]; then
              tail -n 80 /tmp/pose-android-build.log
              exit 1
            fi
            sleep $((attempt * 25))
          done
          test "$built" = true
          test -s build/app/outputs/flutter-apk/app-debug.apk
          git rev-parse HEAD > build/app/outputs/flutter-apk/SOURCE_COMMIT.txt
          sha256sum build/app/outputs/flutter-apk/app-debug.apk > build/app/outputs/flutter-apk/SHA256SUMS.txt
      - name: Upload APK and resolution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alarmchallenges-default-learned-pose-debug-apk
          path: |
            source/build/app/outputs/flutter-apk/app-debug.apk
            source/build/app/outputs/flutter-apk/*.txt
            source/pubspec.lock
          if-no-files-found: warn
          retention-days: 7

  alarm_ios:
    name: alarmchallenges iOS simulator
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Read private feature branch
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" \
            clone --depth 1 --branch feature/learned-pose-default \
            https://github.com/Persie0/alarmchallenges.git source
          git -C source rev-parse HEAD
      - name: Validate model and build iOS simulator
        working-directory: source
        run: |
          flutter pub get
          flutter test test/google_fitness_pose_knn_test.dart
          flutter build ios --simulator --no-codesign

