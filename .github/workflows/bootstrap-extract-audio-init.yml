name: Implement and Validate ExtractAudioFromVideo

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-extract-audio-init.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}

    steps:
      - name: Require private-repo token
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_TOKEN"

      - name: Materialize source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source"
          cat > "$RUNNER_TEMP/source.tar.gz.b64" <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 --decode "$RUNNER_TEMP/source.tar.gz.b64" > "$RUNNER_TEMP/source.tar.gz"
          echo "161fd7db18298e56c9c283e2abe1d685c05f11ef05224d3c46eed1641edef1dd  $RUNNER_TEMP/source.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/source"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Generate Gradle wrapper
        working-directory: ${{ runner.temp }}/source/kotlin-android
        shell: bash
        run: gradle wrapper --gradle-version 9.6.0

      - name: Build Android debug APK
        working-directory: ${{ runner.temp }}/source/kotlin-android
        shell: bash
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Push implementation to private repository
        shell: bash
        run: |
          set -euo pipefail
          TARGET="$RUNNER_TEMP/target"
          git clone "https://x-access-token:${PRIVATE_TOKEN}@github.com/Persie0/ExtractAudioFromVideo.git" "$TARGET"
          cd "$TARGET"
          git checkout main
          rsync -a --delete \
            --exclude ".git/" \
            --exclude ".gradle/" \
            --exclude "build/" \
            --exclude "*/build/" \
            "$RUNNER_TEMP/source/" "$TARGET/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement native Swift and Kotlin audio extractors"
          git push origin main

  ios-validate:
    needs: android-build-and-push
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}

    steps:
      - name: Clone private implementation
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_TOKEN"
          git clone "https://x-access-token:${PRIVATE_TOKEN}@github.com/Persie0/ExtractAudioFromVideo.git" target

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Swift iOS app
        working-directory: target/swift-ios
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ExtractAudioFromVideo.xcodeproj \
            -target ExtractAudioFromVideo \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
