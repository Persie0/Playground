name: Image Enhancer Impeccable P2 UI checks

on:
  push:
    branches: [image-enhancer-impeccable-p2-validation-20261121]
    paths: [.github/workflows/image_enhancer_impeccable_p2.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-enhancer-impeccable-p2-validation-20261121
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Image Enhancer P2 branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/image_enhancer
          ref: ui/impeccable-p2-settings-accessibility-20261121
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: image_enhancer

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: image_enhancer
        run: flutter pub get

      - name: Generate app localizations
        working-directory: image_enhancer
        run: flutter gen-l10n

      - name: Focused responsive and accessibility tests
        working-directory: image_enhancer
        run: flutter test test/impeccable_p2_layout_test.dart test/enhancement_presets_test.dart test/result_comparison_page_test.dart test/home_layout_test.dart --timeout 2m --reporter expanded

      - name: Static analysis
        working-directory: image_enhancer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Full Flutter test suite
        working-directory: image_enhancer
        run: flutter test --concurrency=2 --timeout 2m --reporter compact
