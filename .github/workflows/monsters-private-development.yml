name: Monsters private development verification
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/monsters-private-development.yml"
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build with an already configured valid Unity CI license"
        type: boolean
        default: false
      revision:
        description: "Private main commit or branch"
        type: string
        default: main
permissions:
  contents: read
concurrency:
  group: monsters-private-development
  cancel-in-progress: false
jobs:
  source-and-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: Persie0/monsters
          ref: ${{ inputs.revision || '1f3b76301bc05f9845bd5e0eaea26d75f4177432' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned grammar parsers
        run: python -m pip install -q -r app/tools/requirements-syntax.txt
      - name: Check source and generated content
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_dialogue.py
          python tools/voice_catalog.py
          python tools/verify_assets.py
          python -m compileall -q tools assets-source/build_monsters.py
          bash -n tools/unity_development.sh
          if ! python tools/check_source_syntax.py >"$RUNNER_TEMP/monsters-syntax.log" 2>&1; then
            echo "::error::Private source grammar check failed"
            exit 1
          fi
          grep -E '^(cs|java): [0-9]+ source files parsed$' "$RUNNER_TEMP/monsters-syntax.log"
      - name: Report grammar failures privately
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          if [ -s "$RUNNER_TEMP/monsters-syntax.log" ]; then
            grep -E '^mobile/Assets/[A-Za-z0-9_./-]+:[0-9]+:[0-9]+: (ERROR|[A-Za-z_]+)$' "$RUNNER_TEMP/monsters-syntax.log" > "$RUNNER_TEMP/monsters-syntax-report.txt" || true
            if [ -s "$RUNNER_TEMP/monsters-syntax-report.txt" ]; then
              gh api --method POST repos/Persie0/monsters/issues/1/comments -F body=@"$RUNNER_TEMP/monsters-syntax-report.txt" >/dev/null || true
            fi
          fi
  android-development:
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk
    needs: source-and-assets
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: Persie0/monsters
          ref: ${{ inputs.revision }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app
      - name: Check license and build
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::Configure a valid Unity CI license before requesting APK generation."
            exit 1
          fi
          IMAGE=unityci/editor:ubuntu-6000.3.29f1-android-4.0.0
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk /opt/hostedtoolcache/CodeQL
          docker pull "$IMAGE" >/dev/null
          mkdir -p app/mobile/Logs
          docker run --rm --shm-size=1g --entrypoint bash -e UNITY_LICENSE -v "$GITHUB_WORKSPACE/app:/project" "$IMAGE" -lc '
            set -euo pipefail
            umask 077
            mkdir -p "$HOME/.local/share/unity3d/Unity"
            printf "%s" "$UNITY_LICENSE" > "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf"
            unset UNITY_LICENSE
            export UNITY_EDITOR=/opt/unity/Editor/Unity
            test -x "$UNITY_EDITOR"
            echo "MONSTERS_CI_STAGE executable-found"
            bash /project/tools/unity_development.sh Android
          ' > "$RUNNER_TEMP/monsters-unity.log" 2>&1 || {
            grep -E '^MONSTERS_CI_STAGE [a-z-]+$' "$RUNNER_TEMP/monsters-unity.log" || true
            if grep -qiE 'license.*(invalid|failed|not found)|no valid unity editor license' "$RUNNER_TEMP/monsters-unity.log" app/mobile/Logs/*-ci.log 2>/dev/null; then
              echo "::error::Unity license activation failed; renew or activate a valid entitlement."
            else
              echo "::error::Unity validation failed; private logs withheld."
            fi
            exit 1
          }
          test -s app/mobile/Builds/Android/Monsters-debug.apk
          python3 app/tools/check_unity_results.py app/mobile/Logs/test-ci.xml
      - name: Publish APK to private repository only
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          SHA=$(git -C app rev-parse HEAD)
          gh release create "development-${SHA:0:12}" app/mobile/Builds/Android/Monsters-debug.apk --repo Persie0/monsters --target "$SHA" --prerelease --title "Development APK ${SHA:0:12}" --notes "Unity development build and EditMode validation; device and release review required." >/dev/null
          echo "Private development APK published."
