name: Photosphere 418 fourth original 1-to-3 descriptor gate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-418-fourth-second-descriptor.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-418-fourth-second-descriptor
  cancel-in-progress: false
jobs:
  original-fourth-postgraph:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout pinned private research read-only without private Actions
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: 719ff988a328b1b483f7461c59da7633a9942922
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Exact source SHA and Python compile
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 719ff988a328b1b483f7461c59da7633a9942922
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py
      - name: Original pinned GCam APK and ELF source checksum
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Execute next original 1-to-3 descriptor matcher to native threshold
        working-directory: research-src
        env:
          PHOTOSPHERE_THIRD_SHIFT407: '2'
          PHOTOSPHERE_FOURTH_SECOND_MATCH418: '1'
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py > checkpoint418-source.log 2> checkpoint418-diagnostic.log || {
            echo 'CHECKPOINT416_ORIGINAL_NATIVE_POSTGRAPH_NOT_VERIFIED'
            tail -n 130 checkpoint418-diagnostic.log
            tail -n 6 checkpoint418-source.log | cut -c1-240
            exit 1
          }
          python3 - <<'PY'
          import json
          row=next(x for x in open('checkpoint418-source.log')
              if x.startswith('CHECKPOINT395_NATIVE_POINT_SETUP_THIRD_ROBUST_ENTRY_REPORT='))
          d=json.loads(row.split('=',1)[1])
          assert d['original_elf_sha256']=='878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1'
          f=d['checkpoint409_fourth_source_descriptor']
          g=d['checkpoint414_fourth_native_graph']
          p=d['checkpoint416_fourth_native_postgraph']
          x=d['checkpoint418_fourth_second_descriptor']
          assert f['original_distinct_pixel_offsets']==[0,1,2,3]
          assert len(set(f['original_all_four_source_pixel_sha256']))==4
          assert f['source_original_graph_pair_created_for_fourth']
          assert g['source_original_reciprocal_graph_verified']
          assert g['original_native_fourth_pair_indices_i32']==[0,3]
          assert g['source_native_fourth_point_row_count']==11
          assert p['source_original_postgraph_start_pc']=='0x11dbb8'
          assert p['source_original_first_0_to_3_reciprocal_graph_verified']
          assert [t['source_pc'] for t in p['source_original_postgraph_observed_pcs']]==[
              '0x11dbb8','0x11dc18','0x11db88']
          assert p['source_original_next_matcher_boundary']['native_current_image_w21']==3
          assert p['source_original_next_matcher_boundary']['native_next_candidate_w25']==1
          assert p['source_original_next_candidate_matcher_executed']
          assert p['source_original_next_matcher_boundary']['source_original_next_matcher_body_executed']
          assert p['source_original_endpoint']=='fourth_second_descriptor_native_threshold'
          assert x['source_original_endpoint']=='fourth_second_descriptor_native_threshold'
          assert x['original_source_selected_second_candidate']==1
          assert x['original_native_second_descriptor_body_entered']
          assert x['original_native_second_descriptor_threshold_reached']
          assert not x['original_native_second_robust_executed']
          assert not x['source_original_second_pair_graph_appended']
          assert not x['source_original_second_candidate_constructor_executed']
          assert not x['source_original_full_ceres_executed']
          assert not x['source_host_overrode_matcher_or_native_graph']
          assert len(f['original_native_descriptor_calls'])==2
          assert f['original_native_descriptor_calls'][1]['native_candidate_index_w25']==1
          matches=x['original_native_raw_descriptor_match_count']
          assert matches>=0
          assert len(bytes.fromhex(x['original_native_20_byte_source_match_vector_hex']))==20*matches
          assert x['original_native_source_qualified_for_robust']==(matches>=7)
          assert x['source_original_threshold_pc']==('0x1208a0' if matches>=7 else '0x12070c')
          assert not p['native_graph_memory_host_patched']
          assert not p['source_original_relative_pair_constructor_executed']
          assert not p['source_original_full_ceres_executed']
          with open('checkpoint418-original-source.json','w') as fp:
              json.dump(d,fp,indent=2,sort_keys=True);fp.write('\n')
          print('CHECKPOINT418_ORIGINAL_SECOND_FOURTH_DESCRIPTOR_PASS',json.dumps({
              'pair':[1,3],
              'raw_matches':matches,
              'native_robust_eligible':matches>=7,
              'native_threshold_pc':x['source_original_threshold_pc'],
              'same_vm_image_offsets':f['original_distinct_pixel_offsets'],
          },sort_keys=True))
          PY
      - name: Delete original GCam APK and ELF before artifact upload
        if: always()
        working-directory: research-src
        run: |
          rm -f original.apk research/native/liblightcycle.so com.google.android.GoogleCamera_*.apk
      - name: Archive source-only original fourth second descriptor evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-418-original-fourth-second-descriptor-source
          path: |
            research-src/checkpoint418-original-source.json
            research-src/checkpoint418-diagnostic.log
          retention-days: 7
          if-no-files-found: warn
