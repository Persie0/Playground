name: Temporary AudioBooster RevenueCat release packaging

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-audiobooster-revenuecat-release.yml

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check out exact AudioBooster main revision
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: 9e17742b9977ecedeee5a6bda0af3cb9aeffa6d6
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: audiobooster

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies
        working-directory: audiobooster
        run: flutter pub get

      - name: Bootstrap Android
        working-directory: audiobooster
        run: bash tool/bootstrap_android.sh

      - name: Install disposable CI signing key
        working-directory: audiobooster
        run: |
          keytool -genkeypair -noprompt             -keystore /tmp/audiobooster-ci.jks             -storepass ci-release-password             -keypass ci-release-password             -alias ci             -keyalg RSA             -keysize 2048             -validity 2             -dname "CN=AudioBooster CI"
          cat > android/key.properties <<'EOF'
          storePassword=ci-release-password
          keyPassword=ci-release-password
          keyAlias=ci
          storeFile=/tmp/audiobooster-ci.jks
          EOF

      - name: Release APK
        working-directory: audiobooster
        run: flutter build apk --release

      - name: Release AAB
        working-directory: audiobooster
        run: flutter build appbundle --release

      - name: Monetization boundary
        working-directory: audiobooster
        run: |
          grep -q 'purchases_flutter: ^10.13.0' pubspec.yaml
          grep -q 'goog_zoooKoAwTLrRRsvbFZIGEdkrFAF' lib/subscription/subscription_service.dart
          grep -q 'audiobooster_pro' lib/subscription/subscription_service.dart
          grep -q 'FREE_TRIAL_MS = 300_000L' tool/android/com/persie0/audiobooster/audio/TrialAccessGate.kt
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          ! grep -R -E 'Appodeal|BidMachine|Bidon|IronSource' pubspec.yaml android/app/src/main/AndroidManifest.xml android/settings.gradle.kts android/app/build.gradle.kts
