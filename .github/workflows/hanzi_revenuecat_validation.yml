name: HanziHero RevenueCat validation

on:
  push:
    paths:
      - '.github/workflows/hanzi_revenuecat_validation.yml'
      - '.github/hanzi_revenuecat_ref.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Clone HanziHero branch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          REF="$(cat .github/hanzi_revenuecat_ref.txt)"
          gh repo clone Persie0/hanzi_hero hanzi_hero
          cd hanzi_hero
          git fetch origin "$REF"
          git checkout "$REF"

      - name: Install dependencies
        working-directory: hanzi_hero
        run: flutter pub get

      - name: Run RevenueCat regression tests
        working-directory: hanzi_hero
        run: flutter test test/services/subscription_service_test.dart
