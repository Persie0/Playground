name: HanziHero PR80 full verification

on:
  push:
    paths:
      - '.github/workflows/hanzi_revenuecat_validation.yml'
      - '.github/hanzi_revenuecat_ref.txt'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout HanziHero branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/hanzi_hero
          ref: fix/revenuecat-startup-hardening
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Run full Flutter test suite
        working-directory: app
        run: flutter test
