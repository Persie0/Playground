name: Photosphere synthetic debug

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch/tag/SHA in Persie0/Photosphere-
        required: true
        default: audit/code-hardening-3
        type: string
  push:
    branches: [photosphere-ci-v2]
    paths:
      - '.github/workflows/photosphere-synthetic-debug.yml'

permissions:
  contents: read

env:
  APP_REPOSITORY: Persie0/Photosphere-
  APP_REF: ${{ inputs.ref || 'audit/code-hardening-3' }}

jobs:
  synthetic-debug:
    name: synthetic-${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [fast, robust, parallax, motionSafe]
    env:
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private Photosphere
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPOSITORY }}
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: private-app
      - name: Install Flutter stable
        shell: bash
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        working-directory: private-app
        run: flutter pub get
      - name: Generate deterministic overlapping test photos
        working-directory: private-app
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow numpy
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          import numpy as np
          from PIL import Image, ImageDraw
          out = Path('benchmark/synthetic')
          out.mkdir(parents=True, exist_ok=True)
          rng = np.random.default_rng(20260831)
          base = rng.integers(0, 256, size=(800, 1600, 3), dtype=np.uint8)
          image = Image.fromarray(base, 'RGB')
          draw = ImageDraw.Draw(image)
          for x in range(40, 1560, 80):
              draw.line((x, 0, x, 799), fill=(255, 255 - (x % 200), x % 255), width=3)
          for y in range(40, 760, 80):
              draw.line((0, y, 1599, y), fill=(y % 255, 255, 255 - (y % 200)), width=3)
          for _ in range(60):
              x = int(rng.integers(20, 1550)); y = int(rng.integers(20, 750)); r = int(rng.integers(8, 35))
              color = tuple(int(v) for v in rng.integers(0, 256, size=3))
              draw.ellipse((x-r, y-r, x+r, y+r), outline=color, width=4)
          images = []
          for i, x in enumerate((0, 300, 600, 900)):
              p = out / f'frame_{i}.jpg'
              image.crop((x, 0, x + 700, 800)).save(p, quality=96, subsampling=0)
              images.append(str(p))
          manifest = {
              'outputDir': f'benchmark/synthetic-out-{os.environ["MODE"]}',
              'cases': [{
                  'name': 'synthetic_overlap', 'category': 'ci', 'device': 'github-linux',
                  'images': images, 'modes': [os.environ['MODE']],
              }],
          }
          (out / 'manifest.json').write_text(json.dumps(manifest, indent=2))
          PY
      - name: Run benchmark and capture diagnostics
        id: benchmark
        working-directory: private-app
        shell: bash
        run: |
          set +e
          set -o pipefail
          dart run tool/benchmark.dart --manifest benchmark/synthetic/manifest.json --out "benchmark/synthetic-results-$MODE.json" 2>&1 | tee "benchmark/synthetic-$MODE.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          if [[ -f "benchmark/synthetic-results-$MODE.json" ]]; then
            cat "benchmark/synthetic-results-$MODE.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-synthetic-${{ matrix.mode }}
          path: |
            private-app/benchmark/synthetic-${{ matrix.mode }}.log
            private-app/benchmark/synthetic-results-${{ matrix.mode }}.json
            private-app/benchmark/synthetic-out-${{ matrix.mode }}/**
          if-no-files-found: warn
          retention-days: 7
      - name: Validate result
        working-directory: private-app
        run: |
          test '${{ steps.benchmark.outputs.exit_code }}' = '0'
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          mode = os.environ['MODE']
          data = json.loads(Path(f'benchmark/synthetic-results-{mode}.json').read_text())
          records = data['records']
          assert len(records) == 1, records
          r = records[0]
          assert r.get('success'), r
          assert r['width'] == 2 * r['height'], r
          assert r['usedFrameCount'] >= 3, r
          assert r['memory']['peakRssMiB'] > 0, r
          print(json.dumps(r, indent=2))
          PY
