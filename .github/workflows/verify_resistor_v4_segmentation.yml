name: Verify resistor v4 segmentation

on:
  push:
    paths:
      - '.github/workflows/verify_resistor_v4_segmentation.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout resistor_model v4 branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/resistor_model
          ref: feature/v4-segmentation-colab

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -e '.[dev,segmentation,export]'

      - name: Run full repository tests
        run: pytest -q

      - name: Verify v4 Colab and notebook
        run: |
          python -m py_compile colab/train_resistor_segmentation_colab.py src/resistor_model/segmentation.py
          python - <<'PY'
          import json
          from pathlib import Path
          notebook = json.loads(Path('colab/train_resistor_segmentation_colab.ipynb').read_text())
          markdown = ''.join(notebook['cells'][0]['source'])
          assert 'v4/resistor_sam3_merged.zip' in markdown
          assert 'segmentation-v4-lraspp' in markdown
          print('v4 notebook assertions passed')
          PY

      - name: Train-forward segmentation smoke
        run: |
          python - <<'PY'
          import torch
          from resistor_model.segmentation import build_lraspp_model, segmentation_loss
          model=build_lraspp_model(num_classes=2,pretrained_backbone=False).train()
          image=torch.rand(2,3,64,64)
          masks=torch.zeros(2,64,64,dtype=torch.long)
          masks[:,15:42,20:43]=1
          logits=model(image)['out']
          loss=segmentation_loss(logits,masks)
          assert torch.isfinite(loss), loss
          loss.backward()
          print('finite segmentation forward/backward loss',float(loss.detach()))
          PY
