name: Sync SplitTune app icons

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch in Persie0/stem to update
        required: true
        default: ui/practice-export-polish
        type: string

permissions:
  contents: read

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate repository token
        env:
          REPO_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$REPO_TOKEN" ]; then
            echo "::error::GH_RELEASE_TOKEN or GH_TOKEN is required."
            exit 1
          fi

      - name: Checkout Stem branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/stem
          ref: ${{ inputs.ref }}
          token: ${{ secrets.GH_RELEASE_TOKEN || secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Install SVG renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

      - name: Render launcher assets
        shell: bash
        run: |
          set -euo pipefail
          SRC="assets/branding/splittune_app_icon.svg"
          test -f "$SRC"

          render() {
            local size="$1"
            local path="$2"
            mkdir -p "$(dirname "$path")"
            rsvg-convert "$SRC" -w "$size" -h "$size" -o "$path"
          }

          render 48  android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          render 72  android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          render 96  android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          render 144 android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          render 192 android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          IOS="ios/Runner/Assets.xcassets/AppIcon.appiconset"
          render 20   "$IOS/Icon-App-20x20@1x.png"
          render 40   "$IOS/Icon-App-20x20@2x.png"
          render 60   "$IOS/Icon-App-20x20@3x.png"
          render 29   "$IOS/Icon-App-29x29@1x.png"
          render 58   "$IOS/Icon-App-29x29@2x.png"
          render 87   "$IOS/Icon-App-29x29@3x.png"
          render 40   "$IOS/Icon-App-40x40@1x.png"
          render 80   "$IOS/Icon-App-40x40@2x.png"
          render 120  "$IOS/Icon-App-40x40@3x.png"
          render 120  "$IOS/Icon-App-60x60@2x.png"
          render 180  "$IOS/Icon-App-60x60@3x.png"
          render 76   "$IOS/Icon-App-76x76@1x.png"
          render 152  "$IOS/Icon-App-76x76@2x.png"
          render 167  "$IOS/Icon-App-83.5x83.5@2x.png"
          render 1024 "$IOS/Icon-App-1024x1024@1x.png"

          file android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          file "$IOS/Icon-App-1024x1024@1x.png"

      - name: Commit generated icons
        env:
          TARGET_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/res/mipmap-*/ic_launcher.png \
                  ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png
          if git diff --cached --quiet; then
            echo "No icon changes to commit."
            exit 0
          fi
          git commit -m "Install SplitTune app icon"
          git push origin "HEAD:$TARGET_REF"
