name: FocusMove PR8 Android-only build
on:
  push:
    paths:
      - '.github/workflows/focusmove-pr8-android-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'FocusMove')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Fetch private FocusMove source securely
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --depth=1 --branch=feat/08-guided-break-player https://github.com/Persie0/pomodoroexercise.git source
      - name: Android debug APK smoke build
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get >/tmp/focusmove-pr8-pub.log 2>&1
          timeout 1000 flutter build apk --debug --no-pub >/tmp/focusmove-pr8-build.log 2>&1 || {
            echo 'FocusMove PR8 Android compilation failed or exceeded bound.'
            exit 1
          }
          test -s build/app/outputs/flutter-apk/app-debug.apk
          echo 'FocusMove PR8 Android debug APK built. No private output/artifact published.'
