name: TopTravelList worldwide bias pass 5
on:
  push:
    branches: [main]
    paths: ['.github/workflows/toptravellist-worldwide-bias-pass5-20261126.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: data/worldwide-bias-audit-20261126
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and regenerate all worldwide rankings
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9e223670b7bb47502ce6372992c506fae246c787
          pip install -r requirements.txt
          python scripts/validate.py
          python scripts/check_city_benchmarks.py
          python scripts/check_sight_benchmarks.py
          python scripts/generate_rankings.py
          python scripts/generate_rankings.py --check
          python scripts/audit_worldwide.py
          python - <<'PY'
          import csv
          from pathlib import Path
          rows={r['id']:r for r in csv.DictReader(Path('methodology/worldwide-diagnostics/records.tsv').open(),delimiter='\t')}
          expected={'sight-in-nongriat-double-decker-living-root-bridge':'90.75','sight-va-saint-peters-square':'92.35','sight-in-shravanabelagola-bahubali-statue':'91.70','sight-np-lumbini-sacred-garden':'90.50','sight-cn-guangji-bridge':'89.10','sight-cz-old-town-square-prague':'89.25'}
          assert len(rows)==len(list(Path('countries').glob('*/cities/*.yaml')))+len(list(Path('countries').glob('*/sights/*.yaml')))
          for k,v in expected.items():
              assert rows[k]['overall']==v,(k,rows[k]['overall'],v)
              print('Verified',k,v)
          PY
          git diff --check
      - name: Commit generated reports
        run: |
          set -euo pipefail
          git config user.name toptravellist-editorial-bot
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md 'countries/*/cities.md' 'countries/*/sights.md' methodology/worldwide-diagnostics
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate all-country rankings and diagnostic after small-scope review'
            git push origin HEAD:refs/heads/data/worldwide-bias-audit-20261126
          fi
