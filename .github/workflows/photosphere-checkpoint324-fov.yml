name: Photosphere checkpoint324 production FOV calibration
on:
  push:
    branches: [research/photosphere-checkpoint324-fov]
    paths: [.github/workflows/photosphere-checkpoint324-fov.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fov-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install original-code tools
        run: python3 -m pip install --break-system-packages --quiet capstone pyelftools unicorn
      - name: Retrieve checksum-pinned original Google Camera library
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk'
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > original.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  original.so' | sha256sum -c -
      - name: Checkout original FOV source research read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: e457422c8bbb4010947562bbfcafe79cd810ebcd
          path: research
          sparse-checkout: |
            research/photosphere/checkpoint324
          filter: blob:none
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Verify original native FOV retry opcode sequence
        run: |
          set -euo pipefail
          test "$(git -C research rev-parse HEAD)" = e457422c8bbb4010947562bbfcafe79cd810ebcd
          python3 research/research/photosphere/checkpoint324/scan_original_fov_retry.py original.so --output checkpoint324-original-fov.json | tee checkpoint324-original-fov.log
          grep -q '^CHECKPOINT324_ORIGINAL_FOV_SOURCE_PASS' checkpoint324-original-fov.log
          python3 research/research/photosphere/checkpoint324/native_original_fov_retry_wrapper.py original.so --output checkpoint324-fov-retry-native.json | tee checkpoint324-fov-retry-native.log
          grep -q '^CHECKPOINT324_ORIGINAL_RETRY_WRAPPER_PASS' checkpoint324-fov-retry-native.log
          echo CHECKPOINT324_FOV_NATIVE_JSON_BEGIN
          cat checkpoint324-fov-retry-native.json
          echo CHECKPOINT324_FOV_NATIVE_JSON_END
          echo CHECKPOINT324_FOV_SOURCE_JSON_BEGIN
          cat checkpoint324-original-fov.json
          echo CHECKPOINT324_FOV_SOURCE_JSON_END
      - name: Checkout exact app checkpoint324 commit read-only
        uses: actions/checkout@v4
        with:
          repository: Persie0/PhotosphereCleanroom
          ref: 60dbe53909816d65df935074c99ca65fdfc83583
          path: app
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Differential original ELF source output against app fixtures
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          sources=[
            ("checkpoint324-original-fov.json","app/tests/fixtures/native_original_fov_source_324.json"),
            ("checkpoint324-fov-retry-native.json","app/tests/fixtures/native_original_fov_retry_324.json"),
          ]
          for source,fixture in sources:
            a=json.loads(Path(source).read_text())
            b=json.loads(Path(fixture).read_text())
            assert a==b,(source,"fresh original native GCam source diverged from Rust oracle")
            print("CHECKPOINT324_SOURCE_NATIVE_RUST_EQUAL",source)
          original=json.loads(Path(sources[1][0]).read_text())
          assert original["original_case_count"]==7
          assert original["original_total_inner_attempts"]==15
          assert original["original_real_numerical_fov_solver_executed"] is False
          PY
      - name: Run focused and full FOV application Rust regressions
        run: |
          set -euo pipefail
          test "$(git -C app rev-parse HEAD)" = 60dbe53909816d65df935074c99ca65fdfc83583
          cd app
          rustfmt --edition 2021 --check src/session_checkpoint324_fov_test.rs src/ffi_checkpoint324_fov_test.rs
          cargo test --lib checkpoint324 -- --nocapture
          cargo test --lib
          cargo check --no-default-features
          cargo check --features android-jni
      - name: Read back formatted Rust integration test
        run: |
          echo CHECKPOINT324_TEST_BEGIN
          cat app/src/session_checkpoint324_fov_test.rs
          echo CHECKPOINT324_TEST_END
          echo CHECKPOINT324_FFI_TEST_BEGIN
          cat app/src/ffi_checkpoint324_fov_test.rs
          echo CHECKPOINT324_FFI_TEST_END
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: checkpoint324-native-source
          path: |
            checkpoint324-original-fov.json
            checkpoint324-original-fov.log
            checkpoint324-fov-retry-native.json
            checkpoint324-fov-retry-native.log
          retention-days: 14
