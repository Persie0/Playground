name: Face Scanner open PR verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/face-scanner-open-prs-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consolidated-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Face Scanner consolidated fixes
        uses: actions/checkout@v4
        with:
          repository: Persie0/face_scanner
          ref: fix/review-open-prs-20260929
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: face_scanner
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: face_scanner
        run: flutter pub get
      - name: Verify formatting
        working-directory: face_scanner
        run: dart format --output=none --set-exit-if-changed lib/services/image_converter.dart lib/services/appodeal_service.dart lib/main.dart lib/providers/storage_manager.dart lib/providers/settings_provider.dart lib/services/revenue_cat_service.dart lib/face_mesh_detector_painter.dart lib/screens/object3d.dart lib/store/unlock_first.dart test/appodeal_service_test.dart
      - name: Analyze changed Dart files
        working-directory: face_scanner
        run: flutter analyze lib/services/image_converter.dart lib/services/appodeal_service.dart lib/main.dart lib/providers/storage_manager.dart lib/providers/settings_provider.dart lib/services/revenue_cat_service.dart lib/face_mesh_detector_painter.dart lib/screens/object3d.dart lib/store/unlock_first.dart test/appodeal_service_test.dart
      - name: Run Appodeal tests
        working-directory: face_scanner
        run: flutter test test/appodeal_service_test.dart
      - name: Build Android debug APK
        working-directory: face_scanner
        run: flutter build apk --debug
      - name: Create throwaway release keystore
        working-directory: face_scanner
        run: |
          keytool -genkeypair -v -keystore android/app/ci-key.jks -storepass android -keypass android -alias key -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI, OU=CI, O=CI, L=Vienna, ST=Vienna, C=AT"
          cat > android/key.properties <<'EOF'
          storePassword=android
          keyPassword=android
          keyAlias=key
          storeFile=ci-key.jks
          EOF
      - name: Build Android release APK with R8
        working-directory: face_scanner
        run: flutter build apk --release

  consolidated-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out Face Scanner consolidated fixes
        uses: actions/checkout@v4
        with:
          repository: Persie0/face_scanner
          ref: fix/review-open-prs-20260929
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: face_scanner
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: face_scanner
        run: flutter pub get
      - name: Build iOS without signing
        working-directory: face_scanner
        run: flutter build ios --debug --no-codesign

  mediapipe-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out Face Scanner MediaPipe PR
        uses: actions/checkout@v4
        with:
          repository: Persie0/face_scanner
          ref: jules-14485126674186090172-ac6df43a
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: face_scanner
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: face_scanner
        run: flutter pub get
      - name: Sync generated lockfile back to PR branch
        working-directory: face_scanner
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: resolve MediaPipe 3.1.0 lockfile [skip ci]"
            git push origin HEAD:jules-14485126674186090172-ac6df43a
          fi
      - name: Verify MediaPipe wrapper formatting
        working-directory: face_scanner
        run: dart format --output=none --set-exit-if-changed lib/face_mesh_compat.dart
      - name: Analyze MediaPipe migration
        working-directory: face_scanner
        run: flutter analyze lib/face_mesh_compat.dart lib/facmesh.dart lib/screens/camera_view.dart lib/face_mesh_detector_painter.dart
      - name: Build Android debug APK
        working-directory: face_scanner
        run: flutter build apk --debug

  mediapipe-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Check out Face Scanner MediaPipe PR
        uses: actions/checkout@v4
        with:
          repository: Persie0/face_scanner
          ref: jules-14485126674186090172-ac6df43a
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: face_scanner
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: face_scanner
        run: flutter pub get
      - name: Build iOS without signing
        working-directory: face_scanner
        run: flutter build ios --debug --no-codesign
