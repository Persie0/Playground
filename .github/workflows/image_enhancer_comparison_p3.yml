name: Image Enhancer P3 comparison UX validation

on:
  push:
    branches: [image-enhancer-comparison-p3-validation-20261121]
    paths: [.github/workflows/image_enhancer_comparison_p3.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-enhancer-comparison-p3-validation-20261121
  cancel-in-progress: true

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout private Image Enhancer P3 branch with public Actions minutes
        uses: actions/checkout@v4
        with:
          repository: Persie0/image_enhancer
          ref: ui/comparison-gesture-accessibility-p3-20261121
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: image_enhancer

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: image_enhancer
        run: flutter pub get

      - name: Generate all app localizations
        working-directory: image_enhancer
        run: flutter gen-l10n

      - name: Focused comparison, accessibility and responsive tests
        working-directory: image_enhancer
        run: flutter test test/result_comparison_page_test.dart test/enhancement_presets_test.dart test/impeccable_p2_layout_test.dart --timeout 2m --reporter expanded

      - name: Static analysis
        working-directory: image_enhancer
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Full Flutter regression suite
        working-directory: image_enhancer
        run: flutter test --concurrency=2 --timeout 2m --reporter compact
