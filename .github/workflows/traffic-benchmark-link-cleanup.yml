name: Traffic benchmark link cleanup

on:
  push:
    paths:
      - '.github/workflows/traffic-benchmark-link-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout traffic branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/traffic-counting-light-main
          ref: perf/pi5-28fps-verified-fixes
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          fetch-depth: 0
          lfs: false
          path: traffic

      - name: Fix benchmark references
        working-directory: traffic
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('traffic-counting-edge-detection-master/docs/performance-improvements.md'): [
                  ('../benchmark/pi5_camera_fisheye_fullres_downscale_28fps/', '../benchmark/perzi/pi5_camera_fisheye_fullres_downscale_28fps/'),
                  ('../benchmark/pi5_video_run_with_lp_sneckdown/', '../benchmark/perzi/pi5_video_run_with_lp_sneckdown/'),
              ],
              Path('old/benchmarks/README.md'): [
                  ('../../traffic-counting-edge-detection-master/benchmark/pi5_camera_fisheye_fullres_downscale_28fps/', '../../traffic-counting-edge-detection-master/benchmark/perzi/pi5_camera_fisheye_fullres_downscale_28fps/'),
                  ('../../traffic-counting-edge-detection-master/benchmark/pi5_video_run_with_lp_sneckdown/', '../../traffic-counting-edge-detection-master/benchmark/perzi/pi5_video_run_with_lp_sneckdown/'),
              ],
              Path('traffic-counting-edge-detection-master/benchmark/perzi/pi5_video_run_with_lp_sneckdown/README.md'): [
                  ('file:///home/persie/Downloads/traffic-counting-light-main/traffic-counting-edge-detection-master/benchmark/pi5_video_run_with_lp_sneckdown/', ''),
              ],
          }

          changed = []
          for path, pairs in replacements.items():
              text = path.read_text()
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text)
                  changed.append(str(path))

          assert changed, 'Expected benchmark-link cleanup to change files'

          perf = Path('traffic-counting-edge-detection-master/docs/performance-improvements.md').read_text()
          assert '../benchmark/pi5_camera_fisheye_fullres_downscale_28fps/' not in perf
          assert '../benchmark/pi5_video_run_with_lp_sneckdown/' not in perf

          legacy = Path('old/benchmarks/README.md').read_text()
          assert '../../traffic-counting-edge-detection-master/benchmark/pi5_camera_fisheye_fullres_downscale_28fps/' not in legacy
          assert '../../traffic-counting-edge-detection-master/benchmark/pi5_video_run_with_lp_sneckdown/' not in legacy

          lp = Path('traffic-counting-edge-detection-master/benchmark/perzi/pi5_video_run_with_lp_sneckdown/README.md').read_text()
          assert 'file:///home/persie/Downloads/traffic-counting-light-main/traffic-counting-edge-detection-master/benchmark/pi5_video_run_with_lp_sneckdown/' not in lp
          print('\n'.join(changed))
          PY

          git diff --check
          git diff --stat

      - name: Commit and push cleanup
        working-directory: traffic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add traffic-counting-edge-detection-master/docs/performance-improvements.md \
                  old/benchmarks/README.md \
                  traffic-counting-edge-detection-master/benchmark/perzi/pi5_video_run_with_lp_sneckdown/README.md
          git commit -m 'benchmarks: fix links after Perzi reorganization'
          git push origin HEAD:perf/pi5-28fps-verified-fixes
