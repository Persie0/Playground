name: Noise Remover Appodeal consent CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noise-remover-appodeal-consent-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Noise Remover branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/noise_remover
          ref: fix/appodeal-consent-retry-sentry
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get

      - name: Generate localization
        working-directory: app
        run: flutter gen-l10n

      - name: Format touched Dart files
        working-directory: app
        run: dart format lib/main.dart lib/services/ad_service.dart

      - name: Analyze
        working-directory: app
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: app
        run: flutter test

      - name: Push formatter result if needed
        working-directory: app
        env:
          TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: |
          if git diff --quiet -- lib/main.dart lib/services/ad_service.dart; then
            echo 'No formatter changes to push.'
            exit 0
          fi
          git config user.name 'Persie0'
          git config user.email '76871553+Persie0@users.noreply.github.com'
          git add lib/main.dart lib/services/ad_service.dart
          git commit -m 'Format Appodeal consent fix'
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/Persie0/noise_remover.git"
          git push origin HEAD:fix/appodeal-consent-retry-sentry
