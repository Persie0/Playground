name: Archive migrated Flutter apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive-migrated-flutter-once.yml'

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ensure private repository access is configured
        env:
          ARCHIVE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ARCHIVE_TOKEN"

      - name: Checkout root detector (Kotlin and old Flutter)
        uses: actions/checkout@v4
        with:
          repository: Persie0/root_detection_app
          ref: master
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: sources/root_detection_app
          fetch-depth: 1

      - name: Checkout fake GPS detector (Kotlin and old Flutter)
        uses: actions/checkout@v4
        with:
          repository: Persie0/fake_gps_detector
          ref: master
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: sources/fake_gps_detector
          fetch-depth: 1

      - name: Checkout private archive
        uses: actions/checkout@v4
        with:
          repository: Persie0/oldflutter
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          path: archive
          fetch-depth: 1

      - name: Copy and verify exact Flutter snapshots
        shell: bash
        run: |
          set -euo pipefail
          for app in root_detection_app fake_gps_detector; do
            source_dir="sources/$app/old"
            target_dir="archive/$app"
            test -f "$source_dir/pubspec.yaml"
            test -d "$source_dir/lib"
            if [ -e "$target_dir" ]; then
              diff -qr -- "$source_dir" "$target_dir"
            else
              mkdir -p "$target_dir"
              cp -a "$source_dir/." "$target_dir/"
            fi
            diff -qr -- "$source_dir" "$target_dir"
          done

      - name: Commit archives and push to private destination
        shell: bash
        run: |
          set -euo pipefail
          git -C archive config user.name "github-actions[bot]"
          git -C archive config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C archive add -f -A -- root_detection_app fake_gps_detector
          for app in root_detection_app fake_gps_detector; do
            original=$(git -C "sources/$app" ls-files -- old/ | wc -l)
            copied=$(git -C archive ls-files -- "$app/" | wc -l)
            echo "$app: $original tracked Flutter files copied and staged as $copied"
            test "$original" -gt 0
            test "$original" -eq "$copied"
          done
          if ! git -C archive diff --cached --quiet; then
            git -C archive commit -m "Archive Flutter projects replaced by native Kotlin apps [skip ci]"
            git -C archive push origin HEAD:main
          fi
          git -C archive fetch -q origin main
          test "$(git -C archive rev-parse HEAD)" = "$(git -C archive rev-parse origin/main)"
          for app in root_detection_app fake_gps_detector; do
            diff -qr -- "sources/$app/old" "archive/$app"
          done

      - name: Remove verified old Flutter folders from Kotlin repositories
        shell: bash
        run: |
          set -euo pipefail
          for app in root_detection_app fake_gps_detector; do
            echo "Moving $app: checking branch head before deleting archived files"
            local_head=$(git -C "sources/$app" rev-parse HEAD)
            remote_head=$(git -C "sources/$app" ls-remote origin refs/heads/master | cut -f1)
            test -n "$remote_head"
            test "$local_head" = "$remote_head"
            diff -qr -- "sources/$app/old" "archive/$app"
            git -C "sources/$app" config user.name "github-actions[bot]"
            git -C "sources/$app" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C "sources/$app" rm -r -- old
            git -C "sources/$app" commit -m "Move legacy Flutter app to Persie0/oldflutter/$app [skip ci]"
            git -C "sources/$app" push origin HEAD:master
            if git -C "sources/$app" ls-tree -r --name-only HEAD | grep -q '^old/'; then
              echo "::error::Legacy files remain in $app"
              exit 1
            fi
          done

      - name: Record completed migration
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Archived Flutter migration"
            echo "Destination: [Persie0/oldflutter](https://github.com/Persie0/oldflutter)"
            echo ""
            for app in root_detection_app fake_gps_detector; do
              echo "- [$app](https://github.com/Persie0/$app): removed old/ after verifying archived copy"
            done
          } >> "$GITHUB_STEP_SUMMARY"
