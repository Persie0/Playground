name: Temporary AudioBooster session localization validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-audiobooster-session-l10n-red.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check out exact AudioBooster feature revision
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: ea8034b7fa4191cb314ec15e58e680a326fdadc2
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: audiobooster
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        working-directory: audiobooster
        run: |
          set -euxo pipefail
          flutter pub get

      - name: Generate localizations
        working-directory: audiobooster
        run: |
          set -euxo pipefail
          flutter gen-l10n

      - name: Check generated localization drift
        working-directory: audiobooster
        run: |
          set -euxo pipefail
          git status --short
          git diff --check

      - name: Analyze
        working-directory: audiobooster
        run: |
          set -euxo pipefail
          flutter analyze

      - name: Session notification localization test
        working-directory: audiobooster
        run: |
          set -euxo pipefail
          flutter test test/session_notification_localization_test.dart

      - name: Full test suite
        working-directory: audiobooster
        run: |
          set -euxo pipefail
          flutter test

      - name: Build debug APK
        working-directory: audiobooster
        run: |
          set -euxo pipefail
          flutter build apk --debug
