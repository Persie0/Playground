name: Temporary AudioBooster finish localization

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-audiobooster-session-l10n-red.yml

permissions:
  contents: read

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check out AudioBooster feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: feature/session-notification-localization
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: audiobooster
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: audiobooster
        run: flutter pub get
      - name: Localize remaining UI copy
        working-directory: audiobooster
        run: python scripts/fix_remaining_l10n.py
      - name: Sync and translate new locale keys
        working-directory: audiobooster
        run: python scripts/localization_sync.py
      - name: Generate Flutter localizations
        working-directory: audiobooster
        run: flutter gen-l10n
      - name: Format
        working-directory: audiobooster
        run: dart format lib test
      - name: Commit localization completion
        working-directory: audiobooster
        run: |
          rm scripts/fix_remaining_l10n.py
          git checkout -- .dart_tool/package_config.json .dart_tool/package_graph.json .dart_tool/version 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Localize remaining AudioBooster UI"
          git push origin HEAD:feature/session-notification-localization
      - name: Analyze
        working-directory: audiobooster
        run: flutter analyze
      - name: Test
        working-directory: audiobooster
        run: flutter test
