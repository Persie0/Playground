name: Temporary AudioBooster session localization apply

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-audiobooster-session-l10n-red.yml

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check out AudioBooster feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: feature/session-notification-localization
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: audiobooster
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: audiobooster
        run: flutter pub get
      - name: Apply native session notification implementation
        working-directory: audiobooster
        run: python scripts/apply_session_notification.py
      - name: Extract Flutter UI strings
        working-directory: audiobooster
        run: dart run motrgem --replace
      - name: Sync and translate locales
        working-directory: audiobooster
        run: python scripts/localization_sync.py
      - name: Generate Flutter localizations
        working-directory: audiobooster
        run: flutter gen-l10n
      - name: Format Dart
        working-directory: audiobooster
        run: dart format lib test
      - name: Commit generated implementation
        working-directory: audiobooster
        run: |
          rm scripts/apply_session_notification.py
          git checkout -- .dart_tool/package_config.json .dart_tool/package_graph.json .dart_tool/version 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add session connection notification and app localization"
          git push origin HEAD:feature/session-notification-localization
