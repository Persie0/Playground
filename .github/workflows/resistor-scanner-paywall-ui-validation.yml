name: Resistor Scanner paywall and UI validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resistor-scanner-paywall-ui-validation.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - uses: actions/checkout@v5
        with:
          repository: Persie0/resistor-scanner-android
          ref: fix/paywall-portrait-live-bestof
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          path: app

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Verify Android behavior changes
        working-directory: app
        run: |
          set -euo pipefail
          grep -F 'android:screenOrientation="portrait"' app/src/main/AndroidManifest.xml
          grep -F 'require(sampleCount in 2..7)' app/src/main/java/at/austriao/resistorscanner/pipeline/ScannerPipeline.kt
          grep -F 'valueRange = 2f..7f' app/src/main/java/at/austriao/resistorscanner/ui/ScannerScreen.kt
          grep -F 'Gallery images are analyzed once.' app/src/main/java/at/austriao/resistorscanner/ui/ScannerScreen.kt
          ! grep -F 'StillFrameVariants' app/src/main/java/at/austriao/resistorscanner/pipeline/ScannerPipeline.kt

      - name: Test and build Android
        working-directory: app
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug

  ios:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - uses: actions/checkout@v5
        with:
          repository: Persie0/resistor-scanner-ios
          ref: fix/paywall-portrait-live-bestof
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1
          path: app

      - name: Verify iOS behavior changes
        working-directory: app
        run: |
          set -euo pipefail
          plutil -p ResistorScanner/Info.plist | tee /tmp/info.txt
          grep -F '"UIInterfaceOrientationPortrait"' /tmp/info.txt
          ! grep -F 'Landscape' /tmp/info.txt
          grep -F 'precondition((2...7).contains(sampleCount))' ResistorScanner/Pipeline/ScannerEngine.swift
          grep -F 'count: 1' ResistorScanner/UI/ScannerViewModel.swift
          grep -F 'in: 2...7' ResistorScanner/UI/SettingsSheet.swift
          grep -F '(!subscription.configured || !subscription.loading)' ResistorScanner/UI/ScannerView.swift

      - name: Run Swift tests
        working-directory: app
        run: swift test

      - name: Resolve packages
        working-directory: app
        run: xcodebuild -resolvePackageDependencies -project ResistorScanner.xcodeproj -scheme ResistorScanner

      - name: Build simulator app
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild \
            -project ResistorScanner.xcodeproj \
            -scheme ResistorScanner \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/ios-build.log"
