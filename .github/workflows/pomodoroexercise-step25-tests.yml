# Run 1: camera cooldown, SQLite upgrade, backup manifest, and partial export failures.
name: FocusMove Step 25 performance migration security tests

on:
  push:
    paths:
      - '.github/workflows/pomodoroexercise-step25-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private FocusMove Step 25 branch on ephemeral public runner
        shell: bash
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/25-performance-migration-security https://github.com/Persie0/pomodoroexercise.git source
      - name: Format Step 25 source/tests (runner only)
        shell: bash
        working-directory: source
        run: |
          dart format lib/src/features/pose/pose_frame_gate.dart lib/src/features/pose/pose_preview_screen.dart lib/src/features/pose/pose_lab_store.dart lib/src/features/settings/local_data_export.dart lib/src/screens/privacy_settings_screen.dart test/step25_security_performance_test.dart
      - name: Analyze and test (no artifacts uploaded)
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test --reporter expanded
