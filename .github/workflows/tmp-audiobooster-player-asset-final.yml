name: Temporary AudioBooster player asset final gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-audiobooster-player-asset-final.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Check out AudioBooster feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: feature/player-example-button-highlight
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: audiobooster
          fetch-depth: 0
      - name: Remove unrelated generated metadata changes
        working-directory: audiobooster
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- .dart_tool/package_config.json .dart_tool/version
          git config user.name "Persie0"
          git config user.email "76871553+Persie0@users.noreply.github.com"
          git add .dart_tool/package_config.json .dart_tool/version
          if ! git diff --cached --quiet; then
            git commit -m "chore: restore generated Flutter metadata"
            git push origin HEAD:feature/player-example-button-highlight
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: audiobooster
        run: flutter pub get
      - name: Verify asset and UI behavior
        working-directory: audiobooster
        run: flutter test test/home_history_tutorial_test.dart
      - name: Run all Flutter tests
        working-directory: audiobooster
        run: flutter test
      - name: Analyze
        working-directory: audiobooster
        run: flutter analyze
      - name: Bootstrap Android
        working-directory: audiobooster
        run: bash tool/bootstrap_android.sh
      - name: Build debug APK
        working-directory: audiobooster
        run: flutter build apk --debug
