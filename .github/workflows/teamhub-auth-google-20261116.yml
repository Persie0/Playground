name: TeamHub auth Google fix validation (private checkout, no artifacts)

on:
  push:
    paths:
      - ".github/workflows/teamhub-auth-google-20261116.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout private TeamHub fix branch (try authorized tokens)
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          GH_TOKEN_FALLBACK: ${{ secrets.GH_TOKEN }}
          GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          for candidate in "$PRIVATE_REPO_TOKEN" "$GH_TOKEN_FALLBACK" "$GH_RELEASE_TOKEN"; do
            if [ -z "$candidate" ]; then continue; fi
            authorization="$(printf 'x-access-token:%s' "$candidate" | base64 -w 0)"
            if GIT_CONFIG_COUNT=1 \
               GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
               GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $authorization" \
               git clone --quiet --depth=1 --single-branch \
                 --branch fix/auth-ui-google-login-20261116 \
                 https://github.com/perzis/teamplus_clone.git teamhub 2>/dev/null; then
              echo "Private TeamHub checkout successful."
              break
            fi
            rm -rf teamhub
          done
          if [ ! -d teamhub/.git ]; then
            echo "No configured token has read access to perzis/teamplus_clone." >&2
            exit 1
          fi
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        working-directory: teamhub
        run: flutter pub get
      - name: Flutter static analysis
        working-directory: teamhub
        run: flutter analyze --no-pub
      - name: Flutter unit and widget tests
        working-directory: teamhub
        run: flutter test --no-pub
      - name: Python reference backend tests (not production backend)
        working-directory: teamhub
        run: |
          python3 -m pip install --user -r server/requirements.txt -r server/tests/requirements.txt
          python3 -m pytest -q server/tests
      - name: Android debug APK compilation (no upload)
        working-directory: teamhub
        run: flutter build apk --debug --no-pub
