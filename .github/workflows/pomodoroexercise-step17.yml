name: FocusMove Step 17 break recommendation and picker UX validation
# Step 17: deterministic, gentle break suggestions and Choose another navigation.
# Private source is checked out only in ephemeral Playground runners.
# Final head includes top-level Rest escape and corrected modal visibility tests.

on:
  push:
    paths:
      - '.github/workflows/pomodoroexercise-step17.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focusmove-break-ux-step17
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private feature branch without source publication
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN" || { echo 'Missing private checkout token'; exit 1; }
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/17-break-recommendation-ux https://github.com/Persie0/pomodoroexercise.git source
      - name: Resolve packages and format sources
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          dart format lib/src/features/activities/activity_catalog.dart lib/src/features/timer/focus_routine.dart lib/src/features/timer/persistent_timer_controller.dart lib/src/features/timer/routine_and_setup_sheets.dart lib/src/screens/activities_home.dart lib/src/screens/timer_home.dart test/activity_catalog_test.dart test/activity_controller_test.dart test/activities_widget_test.dart
      - name: Commit only generated lockfile and formatting to private PR branch
        working-directory: source
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'focusmove-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add pubspec.lock lib test
          if ! git diff --cached --quiet; then
            git commit -m 'chore: format Step 17 break picker and ranking files and resolve dependency lock'
            AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
            git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feat/17-break-recommendation-ux
          fi

  android-flutter:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private feature branch
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/17-break-recommendation-ux https://github.com/Persie0/pomodoroexercise.git source
      - name: Flutter analyze and complete unit/widget tests
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test --reporter expanded
      - name: Build debug and release Android APKs, do not publish artifacts
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --debug
          test -s build/app/outputs/flutter-apk/app-debug.apk
          flutter build apk --release
          test -s build/app/outputs/flutter-apk/app-release.apk

  ios-simulator:
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Checkout private feature branch
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feat/17-break-recommendation-ux https://github.com/Persie0/pomodoroexercise.git source
      - name: Compile iOS simulator without signing or published artifacts
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter build ios --simulator --no-codesign
      - name: Verify ML Kit pose model resources are embedded
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APP=build/ios/iphonesimulator/Runner.app
          test -d "$APP"
          for name in MLKitPoseDetectionFastResources MLKitPoseDetectionCommonResources MLKitXenoResources; do
            test -d "$APP/$name.bundle" || { echo "Missing iOS model bundle: $name"; exit 1; }
            echo "Model bundle present: $name"
          done
