name: Traffic Pi5 perf benchmarks on ARM64

on:
  workflow_dispatch:
  # Temporary bootstrap trigger. Removed after the initial verified run so the
  # final workflow is manual-only.
  push:
    branches: [main]
    paths:
      - '.github/workflows/traffic-pi5-arm64-bench.yml'
      - 'tests/test_traffic_pi5_arm64_bench.py'
      - 'benchmarks/traffic_pi5_arm64_bench.py'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout Playground harness
        uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Harness tests
        run: python -m unittest tests/test_traffic_pi5_arm64_bench.py -v

      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"

      - name: Checkout baseline main
        uses: actions/checkout@v5
        with:
          repository: Persie0/traffic-counting-light-main
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          lfs: true
          path: baseline

      - name: Checkout optimized branch
        uses: actions/checkout@v5
        with:
          repository: Persie0/traffic-counting-light-main
          ref: perf/pi5-28fps-verified-fixes
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          lfs: true
          path: optimized

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'numpy==2.5.1' 'opencv-python==4.13.0.92' 'ncnn==1.0.20260526' 'pyyaml==6.0.3'

      - name: Record runner hardware
        run: |
          mkdir -p results
          uname -a | tee results/uname.txt
          lscpu | tee results/lscpu.txt
          python --version | tee results/python.txt
          python -m pip freeze | tee results/pip-freeze.txt

      - name: Run comparative benchmark suite
        run: |
          set -o pipefail
          python benchmarks/traffic_pi5_arm64_bench.py \
            --baseline baseline/traffic-counting-edge-detection-master \
            --optimized optimized/traffic-counting-edge-detection-master \
            --output results | tee results/console.log

      - name: Upload detailed benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traffic-pi5-arm64-benchmark
          path: results/
          if-no-files-found: error
          retention-days: 30
