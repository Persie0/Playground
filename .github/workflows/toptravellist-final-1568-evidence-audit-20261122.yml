name: TopTravelList remaining 1568 per-site evidence audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/toptravellist-final-1568-evidence-audit-20261122.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toptravellist-remaining-1568-source-20261122
  cancel-in-progress: false
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout target review branch with fallback token
        uses: actions/checkout@v4
        with:
          repository: Persie0/TopTravelList
          ref: audit/research-final-1568-sights-2026
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: true
          path: repo
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        working-directory: repo
        run: |
          python -m pip install -r requirements.txt
          python -m py_compile scripts/source_link_sights_2026.py
      - name: Gather individual Wikipedia article/source candidates
        working-directory: repo
        run: |
          python -u scripts/source_link_sights_2026.py --collect --workers 8
      - name: Verify every source match and all 1568 records
        working-directory: repo
        run: |
          python scripts/source_link_sights_2026.py --check
          python - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path('methodology/sight-review-2026-remaining-evidence.json').read_text())
          r=data['records']
          assert len(r)==1568
          assert all(x['name'] for x in r.values())
          assert all(x['country'] == k[:2] for k,x in r.items())
          assert all(x['status'] in ['verified_geo','verified_geo_context','verified_context','candidate_needs_review','unverified','lookup_error'] for x in r.values())
          from collections import Counter
          print('PER-SITE SOURCE COUNTS', Counter(x['status'] for x in r.values()))
          PY
      - name: Validate repository and preserve all published city/sight ranks
        working-directory: repo
        run: |
          python scripts/validate.py
          python scripts/check_city_benchmarks.py
          python scripts/check_sight_benchmarks.py
          python scripts/generate_rankings.py --check
      - name: Keep source evidence even if final check failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toptravellist-remaining-sights-wikimedia-evidence
          path: |
            repo/methodology/sight-review-2026-remaining-evidence.json
            repo/methodology/sight-review-2026-evidence-report.md
          retention-days: 30
          if-no-files-found: ignore
      - name: Commit 1568 source references and ambiguity classifications
        working-directory: repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'toptravellist-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add methodology/sight-review-2026-remaining-evidence.json methodology/sight-review-2026-evidence-report.md
          git diff --cached --check
          git commit -m 'Cross-check all remaining 1568 destinations against independent encyclopedia sources'
          git push origin HEAD:refs/heads/audit/research-final-1568-sights-2026
