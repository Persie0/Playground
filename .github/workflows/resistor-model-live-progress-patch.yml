name: Patch resistor pre-batch progress

on:
  push:
    branches: [resistor-dataset-train]
    paths:
      - .github/workflows/resistor-model-live-progress-patch.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          repository: Persie0/resistor_model
          ref: fix/colab-first-batch-progress
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: true
      - name: Apply pre-batch diagnostic patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/resistor_model/train.py')
          text = path.read_text()

          old = '''def _print_status(message: str) -> None:\n    print(message, flush=True)\n\n\ndef _format_duration'''
          new = '''def _print_status(message: str) -> None:\n    print(message, flush=True)\n\n\ndef _format_pre_batch_status(*, phase: str, epoch: int, epochs: int, total_steps: int) -> str:\n    total = max(int(total_steps), 1)\n    return f"[{phase}] epoch {epoch}/{epochs} | waiting for batch 1/{total}..."\n\n\ndef _format_duration'''
          assert old in text, 'pre-batch helper anchor not found'
          text = text.replace(old, new, 1)

          anchor = '''    interval = _progress_interval(total_steps)\n    started = time.time()\n\n    for step, batch in enumerate(loader):'''
          train_replacement = '''    interval = _progress_interval(total_steps)\n    started = time.time()\n    if show_progress:\n        _print_status(_format_pre_batch_status(\n            phase="train", epoch=epoch, epochs=epochs, total_steps=total_steps\n        ))\n\n    for step, batch in enumerate(loader):'''
          assert anchor in text, 'train loop anchor not found'
          text = text.replace(anchor, train_replacement, 1)

          val_replacement = '''    interval = _progress_interval(total_steps)\n    started = time.time()\n    if show_progress:\n        _print_status(_format_pre_batch_status(\n            phase="val", epoch=epoch, epochs=epochs, total_steps=total_steps\n        ))\n\n    for step, batch in enumerate(loader):'''
          assert anchor in text, 'validation loop anchor not found'
          text = text.replace(anchor, val_replacement, 1)

          path.write_text(text)
          PY
          git diff --check
          git diff -- src/resistor_model/train.py
      - name: Commit and push
        run: |
          git config user.name 'Persie0'
          git config user.email '76871553+Persie0@users.noreply.github.com'
          git add src/resistor_model/train.py
          git commit -m 'fix: show progress before first batch'
          git push origin HEAD:fix/colab-first-batch-progress
