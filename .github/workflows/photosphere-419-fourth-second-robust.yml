name: Photosphere 419 fourth original 1-to-3 native robust
on:
  push:
    branches: [main]
    paths: ['.github/workflows/photosphere-419-fourth-second-robust.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: photosphere-419-fourth-second-robust
  cancel-in-progress: false
jobs:
  original-fourth-postgraph:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout pinned private research read-only without private Actions
        uses: actions/checkout@v4
        with:
          repository: Persie0/decompile
          ref: c16ed16248407d7516d6c011ab935b4e94a8568e
          path: research-src
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
          persist-credentials: false
      - name: Exact source SHA and Python compile
        working-directory: research-src
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c16ed16248407d7516d6c011ab935b4e94a8568e
          python3 -m pip install --quiet --break-system-packages unicorn capstone pyelftools
          python3 -m py_compile research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py
      - name: Original pinned GCam APK and ELF source checksum
        working-directory: research-src
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          gh release download pho --repo Persie0/decompile --pattern 'com.google.android.GoogleCamera_8.8.225.510547499.09-66251366_minAPI33.arm64-v8a.nodpi._apkmirror.com.apk' --dir .
          mv com.google.android.GoogleCamera_*.apk original.apk
          echo '9ca2264cbf5680c8b5b740e53849c1586c53436a7e860616584c0349dba37c47  original.apk' | sha256sum -c -
          mkdir -p research/native
          unzip -p original.apk lib/arm64-v8a/liblightcycle.so > research/native/liblightcycle.so
          echo '878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1  research/native/liblightcycle.so' | sha256sum -c -
      - name: Execute original 1-to-3 RANSAC, 550 native trials, and refit
        working-directory: research-src
        env:
          PHOTOSPHERE_THIRD_SHIFT407: '2'
          PHOTOSPHERE_FOURTH_SECOND_ROBUST419: '1'
        run: |
          set -euo pipefail
          python3 research/photosphere/checkpoint395/native_third_original_postlink_tree_frontier.py > checkpoint419-source.log 2> checkpoint419-diagnostic.log || {
            echo 'CHECKPOINT419_NATIVE_SECOND_ROBUST_NOT_VERIFIED'
            tail -n 130 checkpoint419-diagnostic.log
            tail -n 6 checkpoint419-source.log | cut -c1-240
            exit 1
          }
          python3 - <<'PY'
          import json
          row=next(x for x in open('checkpoint419-source.log')
              if x.startswith('CHECKPOINT395_NATIVE_POINT_SETUP_THIRD_ROBUST_ENTRY_REPORT='))
          d=json.loads(row.split('=',1)[1])
          assert d['original_elf_sha256']=='878feb4ab3912bc0a4c399d9eb14b6c615926e132b324ad8ea02d4988fd428d1'
          fourth=d['checkpoint409_fourth_source_descriptor']
          graph=d['checkpoint414_fourth_native_graph']
          post=d['checkpoint416_fourth_native_postgraph']
          descriptor=d['checkpoint418_fourth_second_descriptor']
          second=d['checkpoint419_fourth_second_robust']
          first=d['checkpoint411_fourth_native_robust']
          assert fourth['original_distinct_pixel_offsets']==[0,1,2,3]
          assert len(set(fourth['original_all_four_source_pixel_sha256']))==4
          assert graph['source_original_reciprocal_graph_verified']
          assert graph['original_native_fourth_pair_indices_i32']==[0,3]
          assert graph['source_native_fourth_point_row_count']==11
          assert [t['source_pc'] for t in post['source_original_postgraph_observed_pcs']]==[
              '0x11dbb8','0x11dc18','0x11db88']
          assert post['source_original_next_candidate_matcher_executed']
          assert descriptor['original_source_selected_second_candidate']==1
          assert descriptor['original_native_raw_descriptor_match_count']==11
          assert descriptor['original_native_source_qualified_for_robust'] is True
          assert descriptor['source_original_threshold_pc']=='0x1208a0'
          assert descriptor['original_native_second_robust_executed']
          assert second['source_native_raw_descriptor_matches']==11
          assert second['source_original_robust_entry_pc']=='0x30f860'
          assert second['native_original_robust_calls']==1
          assert second['native_original_trial_count']==550
          assert second['native_original_550_trials_verified']
          assert len(second['test_controlled_imported_rand_values'])==1100
          assert second['native_original_first_sample_indices']==[0,10]
          assert second['native_original_svd_call_count']>=550
          assert second['source_native_robust_return_pc']=='0x120918'
          assert descriptor['source_original_second_robust_return_w0']==second['source_native_robust_return_w0']
          assert second['source_native_robust_return_w0'] in [0,1]
          assert descriptor['source_original_second_refit_executed']==second['source_native_refit_executed']
          assert first['native_original_550_trials_verified']
          assert first['native_original_trial_count']==550
          assert first['source_native_robust_return_w0']==1
          assert first['native_original_first_sample_indices']==[0,10]
          assert post['source_original_endpoint']=='fourth_second_native_robust_return'
          assert fourth['source_original_endpoint']=='fourth_second_native_robust_return'
          assert descriptor['source_original_endpoint']=='fourth_second_native_robust_return'
          assert not descriptor['source_original_second_pair_graph_appended']
          assert not descriptor['source_original_second_candidate_constructor_executed']
          assert not descriptor['source_original_full_ceres_executed']
          assert not descriptor['source_host_overrode_matcher_or_native_graph']
          assert not post['native_graph_memory_host_patched']
          assert not post['source_original_relative_pair_constructor_executed']
          assert not post['source_original_full_ceres_executed']
          assert not d['original_full_solver_ceres_executed']
          assert d['bionic_rand_stream_test_controlled']
          with open('checkpoint419-original-source.json','w') as fp:
              json.dump(d,fp,indent=2,sort_keys=True);fp.write('\n')
          print('CHECKPOINT419_ORIGINAL_SECOND_FOURTH_ROBUST_PASS',json.dumps({
              'pair':[1,3],
              'raw_matches':11,
              'trials':second['native_original_trial_count'],
              'svd_calls':second['native_original_svd_call_count'],
              'refit_executed':second['source_native_refit_executed'],
              'robust_return_w0':second['source_native_robust_return_w0'],
              'original_source_stop_pc':fourth['source_original_stop_pc'],
          },sort_keys=True))
          PY
      - name: Delete original GCam APK and ELF before artifact upload
        if: always()
        working-directory: research-src
        run: |
          rm -f original.apk research/native/liblightcycle.so com.google.android.GoogleCamera_*.apk
      - name: Archive source-only original fourth second robust evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: photosphere-419-original-fourth-second-robust-source
          path: |
            research-src/checkpoint419-original-source.json
            research-src/checkpoint419-diagnostic.log
          retention-days: 7
          if-no-files-found: warn
