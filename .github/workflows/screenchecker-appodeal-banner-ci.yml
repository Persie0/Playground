name: Screenchecker Appodeal banner Android validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/screenchecker-appodeal-banner-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout screenchecker main
        uses: actions/checkout@v4
        with:
          repository: Persie0/screendetector
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          persist-credentials: false
          path: app
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Android API 37 and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          # Pre-accept the preview SDK/NDK licenses on this ephemeral public runner.
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}" --channel=3 --install 'platforms;android-37.0' 'ndk;29.0.13599879'
          # AGP and some Flutter plugins still refer to the major-only path.
          if [ -d "${ANDROID_HOME}/platforms/android-37.0" ] && [ ! -e "${ANDROID_HOME}/platforms/android-37" ]; then
            ln -s android-37.0 "${ANDROID_HOME}/platforms/android-37"
          fi
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze Appodeal banner and EULA UI
        working-directory: app
        run: flutter analyze lib/widgets/screenchecker_banner.dart lib/eula_gate.dart --no-pub
      - name: Confirm all offline EULA documents are bundled
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test "$(find assets/eula/translations_eula -name 'eula-*.html' | wc -l)" -eq 28
          test -s assets/eula/static/legal-style.css
      - name: Build Android debug APK
        working-directory: app
        run: flutter build apk --debug --no-pub
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: screenchecker-appodeal-banner-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
