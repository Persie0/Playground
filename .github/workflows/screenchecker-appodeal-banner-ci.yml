name: Screenchecker Appodeal banner Android validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/screenchecker-appodeal-banner-ci.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout screenchecker feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/screendetector
          ref: feat/appodeal-android-banner
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN || github.token }}
          persist-credentials: false
          path: app
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Android API 37 and NDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          "${SDKMANAGER}" --install 'platforms;android-37' 'ndk;29.0.13599879'
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze banner widget
        working-directory: app
        run: flutter analyze lib/widgets/screenchecker_banner.dart --no-pub
      - name: Build Android debug APK
        working-directory: app
        run: flutter build apk --debug --no-pub
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: screenchecker-appodeal-banner-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 1
