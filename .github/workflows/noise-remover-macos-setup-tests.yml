name: Noise Remover macOS setup tests
# verification target: noise_remover macos-release 4b9c6282a5b3b1b4886c2923e688a5512e6bbc84
# trigger: 2026-09-27T00:05+02:00

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/noise-remover-macos-setup-tests.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: Private Noise Remover branch, tag, or SHA
        required: false
        default: macos-release
        type: string

permissions:
  contents: read

env:
  APP_REF: ${{ inputs.ref || 'macos-release' }}

jobs:
  setup-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate private checkout token
        env:
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        run: test -n "$PRIVATE_TOKEN"
      - name: Checkout private app revision
        uses: actions/checkout@v5
        with:
          repository: Persie0/noise_remover
          ref: ${{ env.APP_REF }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          persist-credentials: false
          path: app
      - name: Run macOS setup tests
        working-directory: app
        run: python3 -m unittest tool/test_setup_macos.py
