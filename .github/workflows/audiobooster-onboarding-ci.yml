name: AudioBooster onboarding feature checks
# Validates Persie0/Audiobooster feature/onboarding-material-you.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audiobooster-onboarding-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check out AudioBooster feature branch
        uses: actions/checkout@v4
        with:
          repository: Persie0/Audiobooster
          ref: feature/onboarding-material-you
          token: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
          path: audiobooster
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: audiobooster
        run: flutter pub get
      - name: Run Flutter tests
        working-directory: audiobooster
        run: flutter test
      - name: Analyze Dart sources
        working-directory: audiobooster
        run: flutter analyze
      - name: Bootstrap Android host
        working-directory: audiobooster
        run: bash tool/bootstrap_android.sh
      - name: Run Android unit tests
        working-directory: audiobooster/android
        run: ./gradlew :app:testDebugUnitTest
      - name: Build debug APK
        working-directory: audiobooster
        run: flutter build apk --debug
