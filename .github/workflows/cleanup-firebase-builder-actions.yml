name: Cleanup firebase tester builder Actions history

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-firebase-builder-actions.yml'

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_REPO: Persie0/firebase_tester_builder
    steps:
      - name: Verify exact builder workflow inventory
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}"
          expected="$(printf '%s\n' app_store_auto.yml debug_build_release_reusable.yml debug_create_app.yml play_auto.yml | sort)"
          actual="$(gh api "repos/${TARGET_REPO}/contents/.github/workflows?ref=main" --jq '.[].name' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Unexpected builder workflow inventory; refusing cleanup."
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual"
            exit 1
          fi

      - name: Rebuild audited deletion set
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${TARGET_REPO}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .status, .path] | @tsv' > /tmp/all-runs.tsv

          awk -F '\t' '
            $3 != ".github/workflows/app_store_auto.yml" &&
            $3 != ".github/workflows/play_auto.yml" &&
            $3 != ".github/workflows/debug_build_release_reusable.yml" &&
            $3 != ".github/workflows/debug_create_app.yml"
          ' /tmp/all-runs.tsv > /tmp/obsolete-runs.tsv

          obsolete="$(wc -l < /tmp/obsolete-runs.tsv | tr -d ' ')"
          echo "Obsolete runs to delete: $obsolete"
          if [ "$obsolete" -gt 726 ]; then
            echo "::error::Deletion set grew beyond the audited 726 runs; refusing cleanup."
            exit 1
          fi

      - name: Delete audited obsolete workflow runs
        env:
          TOKEN_RELEASE: ${{ secrets.GH_RELEASE_TOKEN }}
          TOKEN_PRIVATE: ${{ secrets.PRIVATE_REPO_TOKEN }}
          TOKEN_GH: ${{ secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          first_run_id="$(head -n 1 /tmp/obsolete-runs.tsv | cut -f1)"
          if [ -z "$first_run_id" ]; then
            echo "No obsolete workflow runs remain."
            exit 0
          fi

          selected=""
          for token_name in TOKEN_PRIVATE TOKEN_RELEASE TOKEN_GH; do
            token="${!token_name:-}"
            [ -n "$token" ] || continue
            echo "Testing Actions-write permission with $token_name on obsolete run $first_run_id"
            if GH_TOKEN="$token" gh api --silent --method DELETE "repos/${TARGET_REPO}/actions/runs/${first_run_id}" 2>/tmp/delete-error.log; then
              selected="$token"
              echo "Using $token_name for obsolete-run cleanup."
              break
            fi
            if grep -q 'HTTP 403' /tmp/delete-error.log; then
              echo "$token_name lacks Actions-write permission; trying next configured token."
              continue
            fi
            cat /tmp/delete-error.log
            exit 1
          done

          if [ -z "$selected" ]; then
            echo "::error::None of the configured Playground tokens can delete workflow runs in ${TARGET_REPO}."
            exit 1
          fi

          deleted=1
          tail -n +2 /tmp/obsolete-runs.tsv | while IFS=$'\t' read -r run_id status path; do
            [ -n "${run_id:-}" ] || continue
            case "$path" in
              .github/workflows/app_store_auto.yml|.github/workflows/play_auto.yml|.github/workflows/debug_build_release_reusable.yml|.github/workflows/debug_create_app.yml)
                echo "::error::Refusing to delete allowlisted workflow run $run_id ($path)"
                exit 1
                ;;
            esac
            GH_TOKEN="$selected" gh api --silent --method DELETE "repos/${TARGET_REPO}/actions/runs/${run_id}"
          done
          echo "Obsolete workflow run deletion completed."

      - name: Verify only four workflow histories remain
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${TARGET_REPO}/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | [.id, .path] | @tsv' > /tmp/remaining-runs.tsv

          unexpected="$(awk -F '\t' '
            $2 != ".github/workflows/app_store_auto.yml" &&
            $2 != ".github/workflows/play_auto.yml" &&
            $2 != ".github/workflows/debug_build_release_reusable.yml" &&
            $2 != ".github/workflows/debug_create_app.yml"
          ' /tmp/remaining-runs.tsv)"

          if [ -n "$unexpected" ]; then
            echo "::error::Obsolete workflow runs still remain:"
            printf '%s\n' "$unexpected"
            exit 1
          fi

          echo "Remaining workflow histories:"
          cut -f2 /tmp/remaining-runs.tsv | sort | uniq -c | sort -nr
