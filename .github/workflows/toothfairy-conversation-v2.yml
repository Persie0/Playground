name: Toothfairy expanded conversation validation
on:
  push:
    branches: [toothfairy-private-validation]
    paths: ['.github/workflows/toothfairy-conversation-v2.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  voice:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Fetch pinned private source
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$REPO_TOKEN"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" clone --quiet --depth=1 --branch=feature/01-mobile-foundation https://github.com/Persie0/Toothfairy.git source
          test "$(git -C source rev-parse HEAD)" = 8730992c4473c7d7893e682e797fe42536f32e87
      - name: Install pinned build-time synthesizer
        run: |
          python -m venv /tmp/tf-voice-venv
          /tmp/tf-voice-venv/bin/pip install -q -r source/tools/requirements-neural-voice.txt > /tmp/tf-voice-install.log 2>&1 || { echo "Dependency installation failed"; exit 1; }
      - name: Generate neural audio and test private assets
        env:
          OMP_NUM_THREADS: '2'
          OPENBLAS_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          cd source
          /tmp/tf-voice-venv/bin/python -m unittest discover -s tools -p test_dialogue_catalog.py >/tmp/tf-dialogue.log 2>&1 || { echo 'Catalog integrity failed'; exit 1; }
          echo 'Bilingual catalog integrity passed.'
          /tmp/tf-voice-venv/bin/python tools/build_neural_voice.py --missing-only > /tmp/tf-voice-build.log 2>&1 || { grep -E '^([A-Za-z.]+Error|TypeError|AssertionError):' /tmp/tf-voice-build.log | cut -c1-200 | tail -3; exit 1; }
          grep -E '^Generated [0-9]+ neural clips' /tmp/tf-voice-build.log
          /tmp/tf-voice-venv/bin/python -m unittest discover -s tools -p test_neural_voice.py > /tmp/tf-voice-test.log 2>&1 || { echo "Neural asset tests failed"; grep -E '^FAIL:|^ERROR:|^AssertionError:' /tmp/tf-voice-test.log | cut -c1-160; exit 1; }
          /tmp/tf-voice-venv/bin/python tools/validate_generated.py >> /tmp/tf-voice-test.log 2>&1 || { echo "Existing asset validation failed"; exit 1; }
          echo "Neural audio, timing and provenance tests passed."
      - name: Commit voice assets privately
        env:
          REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN || secrets.GH_TOKEN || secrets.GH_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          cd source
          git add mobile/Assets/Toothfairy/Resources/Voice assets-source/voice-notices
          git -c user.name=toothfairy-validation -c user.email=toothfairy-validation@users.noreply.github.com commit -qm "assets: bundle 96 additional validated dialogue clips"
          AUTH="$(printf 'x-access-token:%s' "$REPO_TOKEN" | base64 -w0)"
          echo "::add-mask::$AUTH"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $AUTH" push --quiet origin HEAD:refs/heads/feature/01-mobile-foundation
      - name: Cleanup
        if: always()
        run: rm -rf source /tmp/tf-voice-venv /tmp/tf-voice-install.log /tmp/tf-voice-build.log /tmp/tf-voice-test.log /tmp/tf-dialogue.log
